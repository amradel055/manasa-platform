<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form id="branchListForm" dir="#{userData.dir}" class='formmargin' >

            <div style=" position: absolute;left: 20px">
                <p:commandButton  icon="fa fa-fw fa-home"
                                  title="#{userData.userDDs['HOME']}"
                                  class="smhomeButton"  
                                  style="z-index: 2;

                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;

                                  background: #22323a 50% 50% repeat-x!important;" 
                                  action="exit" />

            </div>
            <p:fieldset legend="#{userData.userDDs['BRANCHES_MANAGEMENT']}" style="margin-bottom:20px">
                <div >
                    <p:messages autoUpdate="true"  id="messages" showDetail="true" closable="true"/>   
                </div>

                <div >

                    <p:dataTable 
                        var="branchTable" 
                        widgetVar="bTable"  
                        rowIndexVar="index" 
                        value="#{branchListBean.branches}" rows="15" 
                        paginator="true" emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                        id="branchListForm">
                        <f:facet name="header" class="col-md-12">
                            <p:commandButton icon="fa fa-plus" title="#{userData.userDDs['ADD']}" 
                                             class="saddButton"
                                             action="#{branchListBean.goToAdd()}" 
                                             style="float:right;margin: 0" rendered="#{userData.userScreens['branch'].add or userData.isAdmin}"/>
                            <p:outputPanel  >
                                <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large;" />
                                <p:inputText id="globalFilter" a:autofocus="true" onkeyup="PF('bTable').filter()" style="width: 50%important" />
                            </p:outputPanel>
                        </f:facet>
                        <p:column headerText="#" style="width: 6vh;font-size: 1.8vh;text-align:right;border-radius: 0px;border-radius: 0px;">
                            <h:outputText value="#{index + 1}"  style="font-size: 1.5vh" />
                        </p:column>
                        <p:column   headerText="ID"  style="width: 5vh; font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px;">
                            <p:outputLabel value="#{branchTable.id}"  style="font-size: 1.5vh"/>
                        </p:column>
                        <p:column   headerText="#{userData.userDDs['CS_CODE']}"  style="width: 5vh; font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px;">
                            <p:outputLabel value="#{branchTable.serial}"  style="font-size: 1.5vh"/>
                        </p:column>
                        <p:column filterStyle="display:none" style="width: 25vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px;" filterBy="#{branchTable.nameAr}"  filterMatchMode="contains" headerText="#{userData.userDDs['BRANCH_NAME_AR']}" sortBy="#{branchTable.nameAr}" >
                            <p:outputLabel value="#{branchTable.nameAr}"  style="font-size: 1.5vh" />
                        </p:column>
                        <p:column filterStyle="display:none" style="width: 25vh;font-size: 1.8vh;border-radius: 0px;" filterBy="#{branchTable.nameEn}"  filterMatchMode="contains" headerText="#{userData.userDDs['BRANCH_NAME_EN']}" sortBy="#{branchTable.nameEn}" >
                            <p:outputLabel value="#{branchTable.nameEn}" style="font-size: 1.5vh" />
                        </p:column>
                        <p:column filterStyle="display:none" style="width: 25vh;font-size: 1.8vh;border-radius: 0px;" filterBy="#{branchTable.companyId.name}"  filterMatchMode="contains" headerText="#{userData.userDDs['COMPANY_NAME']}" sortBy="#{branchTable.companyId.name}"  rendered="#{userData.isAdmin}">
                            <p:outputLabel value="#{branchTable.companyId.name}" style="font-size: 1.5vh" />
                        </p:column>

                        <p:column headerText="#{userData.userDDs['TRANSACTION']}"  style="width: 10vh;font-size: 1.8vh;text-align: center;border-radius: 0px;">

                            <p:commandButton class="seditButtons"
                                             update="@form"
                                             icon="fa fa-fw fa-edit" 
                                             title="#{userData.userDDs['EDIT']}" style="background-color: #6a6967;border-radius: 3px;margin-bottom:3px"
                                             action="#{branchListBean.goToEdit()}"
                                             rendered="#{userData.userScreens['branch'].view or userData.isAdmin}">
                                <f:setPropertyActionListener value="#{branchTable.id}"  target="#{branchListBean.branchselected}" />
                            </p:commandButton>

                            <p:commandButton  id="delete" update="@form" 
                                              class="scloseButtons" style="background-color: red;border-radius: 3px;margin-bottom:3px"
                                              icon="fa fa-remove" title="#{userData.userDDs['DELETE']}"
                                              action="#{branchListBean.delete}"
                                              rendered="#{userData.userScreens['branch'].delete or userData.isAdmin}">
                                <f:setPropertyActionListener value="#{branchTable}" target="#{branchListBean.branch}" />
                                <p:confirm header="Confirmation" message="#{userData.userDDs['ARE_YOU_SURE']}" icon="ui-icon-alert" />
                            </p:commandButton>



                        </p:column>
                    </p:dataTable>
                    <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                        <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                        <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                    </p:confirmDialog>
                </div>
            </p:fieldset>
        </h:form>
    </ui:define>
</ui:composition>
