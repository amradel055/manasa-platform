<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">

        <h:form class='formmargin' id="form"  enctype="multipart/form-data"  dir="#{userData.dir}">
            <div class="col-xs-12">
                <p:messages autoUpdate="true"  id="msgopp" showDetail="true" closable="true" />
            </div>
            <p:fieldset>
                <div class="ui-g-6 ui-xl-6">

                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:autoComplete style="width:36%!important"
                                            dropdown="true" maxResults="10"
                                            converter="#{EmployeeShiftFormMBNew.remCompanyDTOConverter}"
                                            value="#{EmployeeShiftFormMBNew.remEmployeeShiftDTO.remCompanyId}"
                                            var="remCompany"
                                            itemLabel="#{remCompany}" 
                                            itemValue="#{remCompany}"
                                            forceSelection="true" 
                                            completeMethod="#{EmployeeShiftFormMBNew.completeRemCompany}"
                                            >
                                <p:ajax update="@form"
                                        process="@form"
                                        event="itemSelect"
                                        listener="#{EmployeeShiftFormMBNew.updateRemCompany(remCompany)}" />
                            </p:autoComplete>
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 111px;" value="اسم المؤسسة"/>

                        </div>
                    </div>

                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:autoComplete style="width:36%!important"
                                            dropdown="true" maxResults="10"
                                            converter="#{EmployeeShiftFormMBNew.remTrafficDTOConverter}"
                                            value="#{EmployeeShiftFormMBNew.remEmployeeShiftDTO.remTrafficId}"
                                            var="rememployeeShift"
                                            itemLabel="#{rememployeeShift}" 
                                            itemValue="#{rememployeeShift}"
                                            forceSelection="true" 
                                            completeMethod="#{EmployeeShiftFormMBNew.completeRemTrafficByRemCompanyId1}"
                                            >

                            </p:autoComplete>
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 111px;" value="خط السير"/>
                        </div>
                    </div>

                </div>

                <div class="ui-g-6 ui-xl-6">

                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <p:inputText style="width: 35%!important" id="ad1" a:autofocus="true" value="#{EmployeeShiftFormMBNew.remEmployeeShiftDTO.code}"/>
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 85px;margin-right: 3%;" value="#{userData.userDDs['CODE']}"/>

                        </div>
                    </div>

                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <p:inputText style="width: 35%!important" id="ad2" value="#{EmployeeShiftFormMBNew.remEmployeeShiftDTO.name}"/>

                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 85px;" value="اسم المسار"/>

                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12" >
                        <p:commandButton  class="saveButton"  
                                          id="saveB" 
                                          title="#{userData.userDDs['SAVE']}"
                                          value="#{userData.userDDs['SAVE']}" 

                                          action="#{EmployeeShiftFormMBNew.save()}" 
                                          update="@form"/>
                    </div>

                </div> 
            </p:fieldset>
            <p:fieldset>


                <div class="ui-g-12 ui-xl-12">
                    <p:dataTable id="employeeShiftDetailsTable"
                                 reflow="true"
                                 var="employeeShiftDetailsTable"
                                 rowIndexVar="index" 
                                 dir="rtl" 
                                 emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                                 sortBy="#{1}"
                                 selectionMode="single"
                                 selection="#{EmployeeShiftFormMBNew.remEmployeeShiftDTO.remEmployeeShiftDetailSelected}"
                                 widgetVar="employeeShiftDetailsTable"
                                 rowKey="#{employeeShiftDetailsTable.index}"
                                 value="#{EmployeeShiftFormMBNew.remEmployeeShiftDTO.remEmployeeShiftDetailList}" >

                        <f:facet name="header" class="col-md-12">
                            <p:commandButton   class="saddButton" id="addnew"
                                               icon="fa fa-plus"
                                               title="#{userData.userDDs['ADD']}" 
                                               actionListener="#{EmployeeShiftFormMBNew.addDetail()}" 
                                               update="employeeShiftDetailsTable"                                         
                                               ajax="true"
                                               style="float:right" />
                            <p:outputPanel>
                                <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                                <p:inputText id="globalFilter" onkeyup="PF('employeeShiftDetailsTable').filter()" style="width:150px" />
                            </p:outputPanel>
                        </f:facet>

                        <p:column headerText="#">
                            #{index + 1}
                        </p:column>

                        <p:column style="width: 70vh;font-size: 1.8vh;text-align: right;border-radius: 0px;" headerText="الموظف" 
                                  filterStyle="display:none"
                                  filterBy="#{employeeShiftDetailsTable.employeeId}"  filterMatchMode="contains" 
                                  sortBy="#{employeeShiftDetailsTable.employeeId}">

                            <p:autoComplete id="point"  
                                            style="width:100%"
                                            converter="#{EmployeeShiftFormMBNew.employeeDTOConverter}"
                                            value="#{employeeShiftDetailsTable.employeeId}"
                                            maxResults="10"
                                            var="employee"
                                            itemLabel="#{employee}" 
                                            itemValue="#{employee}" 
                                            forceSelection="true" 
                                            completeMethod="#{EmployeeShiftFormMBNew.completeRemEmployee1}" >
                                <p:ajax event="itemSelect" listener="#{EmployeeShiftFormMBNew.backup()}" />
                            </p:autoComplete>   

                        </p:column>


                        <p:column  >
                            <p:commandButton  id="b7" icon="fa fa-remove" 
                                              class="sdeleteButtons" style="color: #fff!important;background-color: red;"
                                              title="#{userData.userDDs['DELETE']}" 
                                              actionListener="#{EmployeeShiftFormMBNew.deleteDetail(employeeShiftDetailsTable)}" 
                                              update="@form"  
                                              immediate="true"
                                              ajax="true" />
                            <p:commandButton   class="saddButton" id="addnew2"
                                               icon="fa fa-plus"
                                               title="#{userData.userDDs['ADD']}" 
                                               actionListener="#{EmployeeShiftFormMBNew.addDetail()}" 
                                               update="employeeShiftDetailsTable"                                         
                                               ajax="true"
                                               style="float:right" />
                        </p:column>


                    </p:dataTable>
                </div>
            </p:fieldset>
        </h:form>
    </ui:define>
</ui:composition>
