<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <h:form id="question" dir="#{userData.dir}"  styleClass='formmargin'>

            <p:fieldset id="whole565" legend=" اختر الماده " style="margin-bottom:20px; margin-right: 30px">

                <div class="ui-g-12 ui-xl-12">
                    <div class="ui-g-6 ui-xl-6">
                        <p:selectOneMenu style="width: 75%"  id="material1336552" 
                                         value="#{teacherQuestionListMB.materialSelected}"
                                         >
                            <f:selectItem itemLabel="choose" itemValue="" />
                            <f:selectItems value="#{teacherQuestionListMB.materialsDTOList}" var="material" itemLabel="#{material.name}" itemValue="#{material.id}" />
                        </p:selectOneMenu>
                    </div>
                    <div class="ui-g-6 ui-xl-6">
                        <p:outputLabel style="width: 85px" value="اختر المادة " />

                    </div>
                </div>

                <h:panelGrid class="centerButtons col-md-12" columns="1">

                    <h:panelGroup>
                        <p:commandButton class="saveButton" 
                                         id="saveB" 
                                         title="#{userData.userDDs['SEARCH']}" 
                                         value="#{userData.userDDs['SEARCH']}"
                                         icon="fa fa-fw fa-save" 
                                         action="#{teacherQuestionListMB.search()}" 
                                         update="@form"/>

                    </h:panelGroup>

                </h:panelGrid>
            </p:fieldset>

            <p:fieldset legend="الاساله" style="margin-bottom:20px">

                <p:dataTable 
                    draggableColumns="true" 
                    draggableRows="true"
                    var="teacherQuestion" 
                    widgetVar="teacherQuestion"  
                    rowIndexVar="index" 
                    value="#{teacherQuestionListMB.questionCommonDTOList}"
                    rows="#{userData.rowListCount}" 
                    paginator="true" 
                    selection="#{teacherQuestionListMB.questionCommonDTOSelected}"
                    rowKey="#{teacherQuestion.index}"
                    sortBy="#{1}"
                    emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                    id="teacherQuestion">
                    <f:facet name="header">
                        <p:commandButton  styleClass="saddButton" style="float:right" icon="fa fa-plus" title="#{userData.userDDs['ADD']}" action="#{teacherQuestionListMB.goToAdd()}" 
                                          />

                        <p:outputPanel  >
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" a:autofocus="true" onkeyup="PF('teacherQuestion').filter()" style="width:150px" />
                        </p:outputPanel>
                    </f:facet>


                    <p:column style="text-align: right;font-size: 15px;border-radius: 0px"  
                              filterStyle="display:none" filterBy="#{teacherQuestion.text}"  
                              filterMatchMode="contains" headerText="السؤال" sortBy="#{teacherQuestion.text}">
                        <p:outputLabel value="#{teacherQuestion.text}" />
                    </p:column>
                    <p:column style="text-align: right;font-size: 15px;border-radius: 0px"  
                              filterStyle="display:none" filterBy="#{teacherQuestion.image}"  
                              filterMatchMode="contains" headerText="الصورة" sortBy="#{teacherQuestion.image}">
                        <p:outputLabel value="#{teacherQuestion.image}" />
                    </p:column>
                    <p:column style="width: 10vh;font-size: 1.8vh;border-radius: 0px;"
                              headerText="صورة السؤال " >
                        <p:graphicImage url="#{teacherQuestionListMB.host.concat(teacherQuestion.image)}" library="demo"  style="max-width:120%;max-height:140%;object-fit: fill"/>
                    </p:column>
                    <p:column style="width:16vh;text-align: center;font-size: 15px;border-radius: 0px"  headerText="#{userData.userDDs['TRANSACTION']}">
                        <p:commandButton update="@form" icon="fa fa-fw fa-edit"
                                         styleClass="seditButtons" style="background-color: #6a6967;border-radius: 3px;margin-bottom:3px"
                                         title="#{userData.userDDs['EDIT']}" action="#{teacherQuestionListMB.goToEdit()}"
                                         >
                            <f:setPropertyActionListener value="#{teacherQuestion.id}"  target="#{teacherQuestionListMB.questionCommonDTOSelected}" />
                        </p:commandButton>
                        <p:commandButton  styleClass="sdeleteButtons" update="question:teacherQuestion" icon="fa fa-remove" style="background-color: red;border-radius: 3px;margin-bottom:3px"   
                                          title="#{userData.userDDs['DELETE']}"  action="#{teacherQuestionListMB.delete()}" 
                                          >
                            <f:setPropertyActionListener value="#{teacherQuestion}" target="#{teacherQuestionListMB.questionCommonDTO}" />
                            <p:confirm header="Confirmation" message="#{userData.userDDs['ARE_YOU_SURE']}" icon="ui-icon-alert" />
                        </p:commandButton>
                    </p:column>
                </p:dataTable>
                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                    <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                    <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                </p:confirmDialog>

            </p:fieldset>
        </h:form>
    </ui:define>
</ui:composition>
