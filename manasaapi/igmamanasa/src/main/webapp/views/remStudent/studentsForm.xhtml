<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">

        <h:form id="form" dir="#{userData.dir}}" class='formmargin'>

            <p:fieldset legend="انشاء طالب"  style="margin-bottom:20px">


                <div class="col-xs-12">
                    <p:messages autoUpdate="true"  id="msgopp" showDetail="true" closable="true" />
                </div>
                <div  id="firstLine" class="ui-g-12 ui-g-nopad">
                    <div class="ui-g">

                        <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText style="width: 35%!important" id="ad2" value="#{remStudentFormMB.remStudentDTO.name}"/>

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 85px;" value="اسم الطالب"/>

                                </div>
                            </div>

                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText style="width: 35%!important" id="ad3" value="#{remStudentFormMB.remStudentDTO.code}"/>

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 85px;" value="كود الطالب"/>

                                </div>
                            </div>
                        </div>                        
                    </div>
                </div>
            </p:fieldset>


            <div align="center">
                <p:commandButton  class="saveButton"  
                                  id="saveB" 
                                  title="#{userData.userDDs['SAVE']}"
                                  value="#{userData.userDDs['SAVE']}" 
                                  style=""
                                  action="#{remStudentFormMB.save()}" 
                                  update="@form"/>

                <p:commandButton  class="newButton" 
                                  id="newN"
                                  ajax="false"
                                  style=""
                                  value="#{userData.userDDs['NEW']}" 
                                  title="#{userData.userDDs['NEW']}"
                                  onclick="form.target = ''" 
                                  actionListener="#{remStudentFormMB.reset()}"/>


                <p:commandButton     class="searchButtons"
                                     title="#{userData.userDDs['SEARCH']}"
                                     action="#{remStudentListMB.init()}"
                                     id="searchS"
                                     value="#{userData.userDDs['SEARCH']}"
                                     update="@form"
                                     style="color: #fff!important;background-color: #F9A825;margin-left: 5px;"   />

               <p:commandButton  class="deleteButton"  
                                  id="deleteD" 
                                  title="#{userData.userDDs['DELETE']}"
                                  value="#{userData.userDDs['DELETE']}" 
                                  style=""
                                  action="#{remStudentListMB.delete()}" 
                                  update="@form"/>



                <p:blockUI block="form" trigger="saveB" animate="true" >

                    <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                </p:blockUI> 

            </div>


            <p:fieldset legend="بيانات الطالب" style="margin-bottom:20px; text-align: right; font-size: 2.4vh;">


                <div>
                    <p:dataTable id="tableId" var="student" value="#{remStudentListMB.remStudentDTOList}" selectionMode="single" selection="#{remStudentListMB.remStudentDTO}"  rowKey="#{student.index}" >
                        <p:column   style=" font-size: 2.4vh; text-align: right " headerText="اسم الطالب">
                            <h:outputText value="#{student.name}" />
                        </p:column>


                        <p:column style=" font-size: 2.4vh; text-align: right " headerText="كود الطالب">
                            <h:outputText value="#{student.code}" />
                        </p:column>

                    </p:dataTable>
                </div>
            </p:fieldset>


        </h:form>
    </ui:define>
</ui:composition>
