<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">

        <h:form class='formmargin' id="form"  enctype="multipart/form-data"  dir="#{userData.dir}">

            <p:fieldset legend="تسجيل يدوي لمسار الاتوبيس"  style="margin-bottom:20px">


                <div class="col-xs-12">
                    <p:messages autoUpdate="true"  id="msgopp" showDetail="true" closable="true" />
                </div>
                <div  id="firstLine" class="ui-g-12 ui-g-nopad">
                    <div class="ui-g">


                        <div class="ui-g-6 ui-xl-6">


                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:autoComplete style="width:36%!important"
                                                    dropdown="true" maxResults="10"
                                                    converter="#{autoComplete.remBusesDTOConverter}"
                                                    value="#{busesFollowFormMB.remBusesDTOSelected}"
                                                    var="rembuses"
                                                    itemLabel="#{rembuses}" 
                                                    itemValue="#{rembuses}"
                                                    forceSelection="true" 
                                                    completeMethod="#{autoComplete.completeRemBuses}"
                                                    >
                                        <p:ajax event="itemSelect" update="@form" listener="#{busesFollowFormMB.updateWorkOrderDetail()}"/>
                                    </p:autoComplete>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 111px;" value="اسم الاتوبيس"/>

                                </div>
                            </div>

                        </div>

                        <div class="ui-g-6 ui-xl-6">


                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:selectOneMenu   style="width: 40%" id="workOrdere" value="#{busesFollowFormMB.remWorkOrderDetailDTOSelected}" 
                                                     converter="#{busesFollowFormMB.remWorkOrderDetailDTOConverter}">
                                        <f:selectItem itemLabel="اختر" itemValue="" />
                                        <f:selectItems value="#{busesFollowFormMB.remWorkOrderDetailDTOList}" var="workOrder" 
                                                       itemValue="#{workOrder}" itemLabel="#{workOrder}" />
                                        <p:ajax update="@form"  event="change"/>
                                    </p:selectOneMenu>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 111px;" value="خط السير"/>

                                </div>
                            </div>

                        </div>


                        </div>                        
                    </div>
              

            </p:fieldset>
            <p:fieldset>
                <div class="col-xs-12">
                    <p:dataTable var="remWorkOrderDetailTable" value="#{busesFollowFormMB.remPointsDTOList}" rowIndexVar="index" 
                                 class="col-xs-12" reflow="true" rows="5" paginator="true" editable="true">
                        <p:column width="100" headerText="مسلسل" class="col-xs-1">
                            <p:cellEditor>
                                <f:facet name="output">
                                    <h:outputText value="#{index + 1}"  />
                                </f:facet>
                                <f:facet name="input">
                                    <h:outputText value="#{index + 1}"  />
                                </f:facet>
                            </p:cellEditor>
                        </p:column>
                        <p:column headerText="اسم النقطة" class="col-xs-2">
                            <p:cellEditor>
                                <f:facet name="output">
                                    <h:outputText value="#{remWorkOrderDetailTable.name}"  />
                                </f:facet>
                                <f:facet name="input">
                                    <h:outputText value="#{remWorkOrderDetailTable.name}"  />
                                </f:facet>
                            </p:cellEditor>
                        </p:column>
                        <p:column headerText="عرض" class="col-xs-2">
                            <p:commandButton  class="saddButtons" id="addnew2"
                                              value="#{remWorkOrderDetailTable.checkArrival ? 'ارجاع' : 'تأكيد'}"
                                              title="#{remWorkOrderDetailTable.checkArrival ? 'ارجاع' : 'تأكيد'}" 
                                              actionListener="#{busesFollowFormMB.updatePoint(remWorkOrderDetailTable)}" 
                                              update="@form"                                         
                                              ajax="true" style="float:right;background-color: rgb(42, 163, 218);border-radius: 3px;"
                                              />
                        </p:column>
                    </p:dataTable>
                </div>
            </p:fieldset>


        </h:form>
    </ui:define>
</ui:composition>
