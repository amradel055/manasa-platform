<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/newTemplate.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">
        <h:form class='formmargin' id="form"  enctype="multipart/form-data"  dir="#{userData.dir}">
            <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                  margin-top: 24%;
                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;"
                                  icon="fa fa-fw fa-home"
                                  title="#{userData.userDDs['HOME']}"
                                  class="smhomeButton" 
                                  action="exit" />

            </div>
            <p:fieldset legend="الابلاغ عن مشكلة"  style="margin-bottom:20px">
                   <p:messages autoUpdate="true"  id="messages" showDetail="true" closable="true" /> 
                <div  id="firstLine" class="ui-g-12 ui-g-nopad">
                    <div class="ui-g">

                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 85px;margin-right: 4%;"  value="الرقم" />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 85px;margin-right: 4%;"  value="#{isagSupportMB.support.serial}" />
                                </h:panelGroup>

                            </h:panelGroup>
                        </div>
                        
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 85px;margin-right: 4%;"  value="التاريخ" />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:calendar style="width: 50%"   id="dateFrom"  disabled="true"
                                                value="#{isagSupportMB.support.date}"
                                                pattern="dd/MM/yyyy" showButtonPanel="true" >
                                    </p:calendar>
                                </h:panelGroup>

                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 100px; margin-right: 4%" value="المديول"/>
                                </h:panelGroup>


                                <h:panelGroup>
                                    <p:selectOneMenu style="width:37%" value="#{isagSupportMB.support.module}"  >
                                        <f:selectItem itemLabel="#{userData.userDDs['CHOOSE']}"  itemValue="" />
                                        <f:selectItem itemLabel="اعدادات الانظمه العامة" itemValue="1"/>
                                        <f:selectItem itemLabel="تقارير الانظمه العامة" itemValue="2"/>
                                        <f:selectItem itemLabel="إداره الحسابات العامه" itemValue="3"/>
                                        <f:selectItem itemLabel="تقارير الحسابات العامه" itemValue="4"/>
                                        <f:selectItem itemLabel="إداره الخزائن والبنوك" itemValue="5"/>
                                        <f:selectItem itemLabel="تقارير الخزائن و البنوك" itemValue="6"/>
                                        <f:selectItem itemLabel="الترحيلات" itemValue="7"/>
                                        <f:selectItem itemLabel="إداره التوزيع و المخازن" itemValue="8"/>
                                        <f:selectItem itemLabel="تقارير التوزيع والمخازن" itemValue="9"/>
                                        <f:selectItem itemLabel="اداره العيادات" itemValue="10"/>
                                        <f:selectItem itemLabel="تقارير اداره العيادات" itemValue="11"/>  
                                        <f:selectItem itemLabel="اداره التقسيط" itemValue="12"/>
                                        <f:selectItem itemLabel="تقارير اداره التقسيط" itemValue="13"/>
                                        <f:selectItem itemLabel="اداره المشاريع" itemValue="14"/>
                                        <f:selectItem itemLabel="تقارير اداره المشاريع" itemValue="15"/>  
                                        <f:selectItem itemLabel="اداره الموارد البشريه 2" itemValue="16"/>
                                        <f:selectItem itemLabel="اداره الاصول الثابته" itemValue="17"/>
                                        <f:selectItem itemLabel="اداره النقليات" itemValue="18"/> 
                                        <f:selectItem itemLabel="اداره علاقات العملاء" itemValue="19"/> 
                                        <p:ajax update="screen"
                                                event="itemSelect"                                                   
                                                listener="#{isagSupportMB.findScreenBymodeule()}" />
                                    </p:selectOneMenu>
                                </h:panelGroup> 

                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>

                                <h:panelGroup>
                                    <p:outputLabel style="width: 85px;margin-right: 4%;" value="عنوان المشكلة"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:inputText required="true" style="width: 35%!important" id="ad2" value="#{isagSupportMB.support.title}"/>
                                </h:panelGroup>

                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>

                                <h:panelGroup>
                                    <p:outputLabel style="width:100px; margin-right: 4%;" value="اسم الشاشة"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:selectOneMenu id="screen" style="width:37%" value="#{isagSupportMB.support.screen}" converter="#{isagSupportMB.isagScreenConverter}"  >
                                        <f:selectItem itemLabel="#{userData.userDDs['CHOOSE']}"  itemValue="" />
                                        <f:selectItems  value="#{isagSupportMB.isagScreenList}" var="screen" itemLabel="#{screen.namear}" itemValue="#{screen}" />

                                    </p:selectOneMenu>
                                </h:panelGroup> 
                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width:100px; margin-right: 4%;" value="الحاله"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width:100px; margin-right: 4%;" value="#{isagSupportMB.support.statusName}"/>
                                </h:panelGroup> 
                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-12">
                            <h:panelGroup>

                                <h:panelGroup>
                                    <p:outputLabel style="width: 93px;margin-right: 2%; display: block; margin-top: 5%;" value="شرح المشكلة"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:inputTextarea required="true" style="width: 67%!important; min-height: 100px !important; display: block; margin-right: 11% !important; margin-top: -6% !important;" id="ad3" value="#{isagSupportMB.support.description}"/>
                                </h:panelGroup> 

                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>

                                <h:panelGroup>
                                    <p:outputLabel style="width: 98px; margin-right: 4%" value="الأولوية"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:selectOneMenu style="width:37%" value="#{isagSupportMB.support.priorety}"  >
                                        <f:selectItem itemLabel="#{userData.userDDs['CHOOSE']}"  itemValue="" />
                                        <f:selectItem itemLabel="عاجله جدا" itemValue="1"/>
                                        <f:selectItem itemLabel="عاجله" itemValue="2"/>
                                        <f:selectItem itemLabel="متوسطه" itemValue="3"/>
                                        <f:selectItem itemLabel="عاديه" itemValue="4"/>
                                    </p:selectOneMenu>
                                </h:panelGroup>

                            </h:panelGroup>
                        </div>



                        <div class="col-sm-6">
                            <h:panelGrid> 

                                <h:panelGroup>


                                    <h:panelGroup>
                                        <p:outputLabel value="ارفاق صورة" style="width: 120px;margin-right: 3%;margin-top: 2%;"  />
                                    </h:panelGroup>



                                    <h:panelGroup style="background-color: #FFFFFF!important;">
                                        <p:fileUpload style="width: 39%;margin-right: 17%; margin-top: -6%" id="logo"                                          
                                                      label="#{userData.userDDs['CHOOSE']} "
                                                      dragDropSupport="true"  
                                                      cancelLabel="#{userData.userDDs['CANCEL']}" 
                                                      uploadLabel="#{userData.userDDs['UPLOAD']}"  
                                                      fileUploadListener="#{isagSupportMB.upload}"
                                                      mode="advanced" 
                                                      update="image imgName"
                                                      allowTypes="/(\.|\/)(gif|jpe?g|png|doc|docx|xls|xlsx|pdf|txt)$/"
                                                      />
                                        <p:message for="logo"/>
                                    </h:panelGroup>

                                    <h:panelGroup>
                                        <p:graphicImage id="image" style="margin-right: 40%;margin-top: 2%;"
                                                        value="#{isagSupportMB.image}" />
                                    </h:panelGroup>


                                </h:panelGroup>

                            </h:panelGrid> 
                        </div>
                        <div class="ui-g-12 ui-md-12">
                            <h:panelGroup>

                                <h:panelGroup>
                                    <p:outputLabel style="width: 66px;margin-right: 53%;" value="اسم الصورة"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:inputText style="width: 18.5%!important" id="imgName" value="#{isagSupportMB.imageName}"/>
                                </h:panelGroup>

                            </h:panelGroup>
                        </div>

                    </div>
                </div>

                <h:panelGrid columns="2"  class="col-md-12 centerButtons" style="margin-top: 2%">

                    <h:panelGroup>
                        <p:commandButton  class="saveButtons"  
                                          id="saveB" 
                                          title="#{userData.userDDs['SAVE']}"
                                          value="#{userData.userDDs['SAVE']}" 
                                          style="color: #fff!important;background-color: #2196F3!important;margin-left: 5px"
                                          action="#{isagSupportMB.save()}" 
                                          update="@form"/>
                        <p:commandButton 
                            id="newN"
                            ajax="false"
                            style="color: #fff!important;background-color: #9c27b0d1;margin-left: 5px"
                            value="#{userData.userDDs['NEW']}" 
                            class="newButtons"
                            actionListener="#{isagSupportMB.reset()}"/>
                        
                         <p:commandButton  class="deleteButtons" 
                                          id="cancel" 
                                          title="#{userData.userDDs['BACK']}" 
                                          value="#{userData.userDDs['BACK']}" 
                                          style="color: #fff!important;background-color: #035C70;margin-left: 5px"  
                                          immediate="true"
                                          action="#{isagSupportMB.exit()}" 
                                          update="@form"/>



                    </h:panelGroup>

                    <p:blockUI block="form" trigger="saveB" animate="true" >

                        <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                    </p:blockUI> 

                </h:panelGrid>
            </p:fieldset>
        </h:form>
    </ui:define>
</ui:composition>
