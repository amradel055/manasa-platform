<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/template/template.xhtml">
<h:outputStylesheet name="primeicons/primeicons.css" library="primefaces"/>


    <ui:define name="title">Dashboard</ui:define>

    <ui:define name="head">

    </ui:define>


    <ui:define name="content" >
        <div class="new-dashboard" style="float: left;;margin-top: 5%;background-color: #ece7eb;">
            
            <div class='searchBar' style='background-color: #fff; padding: 20px;margin: 1% 3% 1% 2%;'>
                    <h:form>
                        

                            <h:panelGrid columns="4" cellpadding="7">
                                <p:inputText id="txt1" value="#{searchView.text1}" required="true" label="Text 1" placeholder="البحث عن الفواتير"
                                             style="width: 175%;border: solid 1px grey;height: 30px;background-image: none !important;padding-right: 5%;" >
                                    <f:validateLength minimum="2"/>
                                </p:inputText>
                                <p:commandButton 
                                class="smsearchButtons"
                                icon="fa fa-fw fa-search-plus"  
                                style="background-color: #3851a5;border-radius: 0; margin-right: 250%;"
                                title="#{userData.userDDs['VIEW']}"
                                onclick="PF('pass').show();" />
                                <p:commandButton icon="fa fa-plus" value="إنشاء فاتورة" 
                                             class="saddButton"
                                             action="#{isagSupportListMB.goToAdd()}" 
                                             style="margin-right: 70%;float: right;background-color: #6c4886;width: 130%;" />
                                <p:commandButton icon="fa fa-plus" value="بدأ البيع" 
                                             class="saddButton"
                                             action="#{isagSupportListMB.goToAdd()}" 
                                             style="margin-right: 120%;float: right;background-color: #567152;width: 170%;" />
                            </h:panelGrid>
                        
                    </h:form>
            </div>
            
            <div class='navDashboard' style='background-color: #fff;margin: 1% 3% 1% 2%;'>
                <div style='display: inline-block;padding: 20px; background-color: #906bb0;font-size: 20px;color: #fff;'>
                    لوحة التحكم
                </div> 
                <div style='display: inline-block;float: left;'>
                    <ul style='list-style: none;' class='navMenu'>
                        <li style='display: inline-block;font-size: 17px;font-weight: 600;padding-top: 7px;padding-right: 30px;padding-left: 30px;'>الفواتير</li>
                        <li style='display: inline-block;font-size: 17px;font-weight: 600;padding-top: 7px;padding-right: 30px;padding-left: 30px;'>مخزون منخفض</li>
                        <li style='display: inline-block;font-size: 17px;font-weight: 600;padding-top: 7px;padding-right: 30px;padding-left: 30px;'>المدفوعات</li>
                        <li style='display: inline-block;font-size: 17px;font-weight: 600;padding-top: 7px;padding-right: 30px;padding-left: 30px;'>الارباح والخسارة</li>
                    </ul>
                </div>
            </div>
            
            <div   class="ui-g-12 ui-g-nopad" style='padding: 1% 3% 1% 2%;'>
                    <div class="ui-g">
                        <div class="ui-g-12 ui-md-4" style="background-color: #fff;width: 33%;margin-left: 1%;">
                            <div style="display: inline-block;">
                                1
                            </div>
                            <div style="display: inline-block;">
                                2
                            </div>
                        </div>
                        <div class="ui-g-12 ui-md-4" style="background-color: #fff;width: 33%;margin-left: 1%;">
                            DIV 2
                        </div>
                        <div class="ui-g-12 ui-md-4" style="width: 32%;">
                            <div style="display: inline-block;">
                                <h:panelGroup>
                                    <div style="padding:20px;"><p:outputLabel value="حجم المبيعات اليومي" /></div>
                                    <div><p:outputLabel style=""  value="2" /></div>
                                    <div><p:progressBar value="50" labelTemplate="{value}%" displayOnly="true"/></div>
                                </h:panelGroup>
                            </div>
                            <div style="display: inline-block;">
                                2
                            </div>
                        </div>
                    </div>
            </div>
            
        </div>
    </ui:define>

</ui:composition>
