<ui:composition 
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:p="http://primefaces.org/ui"
    xmlns:pa="http://primefaces.org/serenity">

    <div class="layout-topbar">
        <a class="topbar-logo">
            <p:graphicImage name="images/logo-slim.png" library="serenity-layout" />
            <span class="app-name">SERENITY</span>
        </a>

        <p:graphicImage name="images/logo-slim.png" library="serenity-layout" styleClass="mobile-logo" />

        <a href="#" class="menu-btn">
            <i class="material-icons">&#xE5D2;</i>
        </a>

        <a href="#" class="topbar-menu-btn">
            <i class="material-icons">&#xE853;</i>
        </a>

        <div class="layout-topbar-menu-wrapper">
            <div class="sidebar-logo">
                <a >
                    <p:graphicImage name="images/logo-slim.png" library="serenity-layout" />
                    <span class="app-name">IGMA</span>
                </a>
                <a href="#" class="sidebar-anchor" title="Toggle Menu"></a>
            </div>            
            <ul class="topbar-menu animated">
                <li class="profile-item">
                    <a href="#">       
                        <span class="profile-image-wrapper">
                            <p:graphicImage name="images/avatar.png" library="serenity-layout" />
                        </span>                     
                        <span class="topbar-item-name profile-name">#{userData.user.name}</span>
                    </a>

                </li>


                <li>



                    <h:form>
                        <p:commandButton    action="/dashboard"   value="الرئيسية"
                                            id="main1"   style="background-color:green; " 
                                            />
                        <p:commandButton    action="#{loginBean.logout(1)}"   icon="fa fa-sign-out-alt"
                                            id="logout1"   ajax="false" style="background-color:#CC1C1C; border-radius: 50%;" class="material-icons"
                                            />


                    </h:form>

                </li>
                <h:form>

                    <p:selectOneMenu  style="width: 15%!important;margin-right: 5%;margin-left:5%;margin-bottom: 5px;" id="master" value="#{dashboardMB.invType}"  >
                        <f:selectItem   itemLabel="اختر نوع الفاتوره" itemValue=""/>
                        <f:selectItem   itemLabel="المبيعات" itemValue="0"/>
                        <f:selectItem   itemLabel="مردود المبيعات" itemValue="1"/>
                        <f:selectItem   itemLabel="المشتريات" itemValue="2"/>                                  
                        <f:selectItem   itemLabel="مردود المشتريات" itemValue="3"/>                                  
                        <f:selectItem   itemLabel="المدفوعات" itemValue="4"/>  
                        <f:selectItem   itemLabel="المقبوضات " itemValue="5"/>                                  
                        <f:selectItem   itemLabel="التحويلات" itemValue="6"/>                                  
                        <f:selectItem   itemLabel="الجيم" itemValue="7"/>                                  
                    </p:selectOneMenu>
                    <p:commandButton icon="fa fa-plus" value="إنشاء فاتورة" 
                                     class="saddButton"
                                     action="#{dashboardMB.goToAdd()}" 
                                     style="margin-right:15%;margin-left:5%;margin-bottom:5%;float: right;background-color: #6c4886;width: 10%;"
                                     update="master"/>

                    <p:inputText style="width: 13%!important " id="ad1"   value="#{dashboardMB.serial}" placeholder="بحث برقم الفاتوره" />

                    <p:commandButton 
                        class="smsearchButtons"
                        icon="fa fa-fw fa-search-plus"
                        style="background-color: #3851a5;border-radius: 0; margin-right: 1%;margin-left: 1%;"
                        title="#{userData.userDDs['VIEW']}"
                        action="#{dashboardMB.goToEdit()}" 
                        />



                </h:form>
            </ul>
        </div>
    </div>
</ui:composition>
