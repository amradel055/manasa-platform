<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">
        <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>


        <h:form  class='formmargin' dir="#{userData.dir}"  id="form">


            <p:fieldset  legend="#{userData.userDDs['Extracts_reports']}"

                         style=" position: relative"> 

                <div  id="firstSegment" class="ui-g-12 ui-g-nopad firstset">

                    <div class="ui-g">



                        <div class="ui-g-6 ui-xl-6">

                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:calendar pattern="dd/MM/yyyy" 
                                                value="#{rscCompareReportMB.rscExtractReportSearchBean.dateFrom}"
                                                style="width: 50%"
                                                id="dateFrom">

                                    </p:calendar>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 90px" value="#{userData.userDDs['From_Date']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:calendar pattern="dd/MM/yyyy" 
                                                value="#{rscCompareReportMB.rscExtractReportSearchBean.dateTo}"
                                                style="width: 50%"
                                                id="dateTo">

                                    </p:calendar>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 90px" value="#{userData.userDDs['To_Date']}"/>

                                </div>
                            </div>

                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:autoComplete style="width:41%!important"
                                                    dropdown="true"
                                                    converter="#{autoComplete.organizationSiteDTOConvertor}"
                                                    value="#{rscCompareReportMB.rscExtractReportSearchBean.invOrganizationSiteDTOFromCustomer}"
                                                    var="organization"
                                                    itemLabel="#{organization}" 
                                                    itemValue="#{organization}"
                                                    forceSelection="true" 
                                                    completeMethod="#{autoComplete.completeCustomerFrom}"
                                                    id="contractorFrom"
                                                    >
                                    </p:autoComplete>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 90px" value="من مؤسسة"/>
                                </div>
                            </div>

                        </div>

                    </div>
                    <p:dialog modal="true"
                              position='bottom,center'
                              minHeight="40" minWidth="220"
                              header="#{userData.userDDs['Graph']}" widgetVar="dlg1">

                        <div  id="donutchart" style="width: 90vw; height: 750px;"></div>

                        <h:panelGroup class=" centerButtons">

                            <p:commandButton  class="printButton"
                                              id="PrintC"
                                              ajax="false"
                                              onclick="form.target = '_blank'"  
                                              icon="fa fa-fw fa-print"
                                              value="#{userData.userDDs['PRINT']}" 
                                              actionListener="#{rscCompareReportMB.exportChartPDF}"
                                              title="#{userData.userDDs['PRINT']}"
                                              immediate="true" />
                        </h:panelGroup>
                    </p:dialog> 
                </div>
                <div id="buttunss" class="asmaa">



                    <p:commandButton    class="searchButton"
                                        title="#{userData.userDDs['SEARCH']}"
                                        action="#{rscCompareReportMB.search()}"
                                        id="saveB"
                                        value="#{userData.userDDs['SEARCH']}"
                                        update="detailViewTable" 
                                        />

                    <p:commandButton  class="newButton"
                                      id="NewB"
                                      title="#{userData.userDDs['NEW']}" 
                                      immediate="true" 
                                      action="#{rscCompareReportMB.reset()}"
                                      update="@form"
                                      value="#{userData.userDDs['NEW']}"
                                      process="@this"
                                      />

                    <p:commandButton  class="PrintButton"
                                      id="PrintB"
                                      ajax="false"
                                      onclick="form.target = '_blank'"  
                                      value="#{userData.userDDs['PRINT']}" 
                                      actionListener="#{rscCompareReportMB.exportPDF}"
                                      title="#{userData.userDDs['PRINT']}"
                                      immediate="true" />

                    <p:commandButton  class="closeButton"
                                      id="CloseB"

                                      title="#{userData.userDDs['BACK']}"
                                      action="exit"
                                      value="#{userData.userDDs['BACK']}"/>
                    <h:commandLink>  
                        <p:graphicImage name="/img/excel.jpg" width="24"/>  
                        <p:dataExporter type="xls"
                                        target="detailViewTable" 
                                        fileName=" تقرير  حصر الاعمال"
                                        postProcessor="#{rscCompareReportMB.postProcessXLS}" />  
                    </h:commandLink>

                    <p:blockUI block="form" trigger="saveB NewB PrintB CloseB  " animate="true" >

                        <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                    </p:blockUI> 

                </div>
            </p:fieldset>

            <p:fieldset id="reportDB">
                <p:dataTable 
                    paginator="true"
                    rows="20"
                    draggableColumns="true" 
                    var="detail" 
                    rowIndexVar="index" 
                    value="#{rscCompareReportMB.rscTenderDTOReportList}" 
                    dir="rtl" 
                    id="detailViewTable"
                    >
                    <f:facet name="header">


                        <p:outputPanel>
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" onkeyup="PF('detailViewTable').filter()" style="width:150px" />
                        </p:outputPanel>

                    </f:facet>
                    <p:column style="width:16px"   headerText="التفصيلي" >
                        <p:rowToggler  />
                    </p:column>

                    <p:column   style="width: 8vh;text-align: right;font-size: 1.8vh;border-radius: 0px" headerText="رقم " 

                                filterBy="#{detail.serial}" 
                                filterMatchMode="contains" 
                                sortBy="#{detail.serial}"
                                filterable="false">

                        <p:outputLabel value="#{detail.serial}" />
                    </p:column>





                    <p:column style="width: 12vh;text-align: right;font-size: 1.8vh;border-radius: 0px" 
                              headerText="#{userData.userDDs['Date']}"

                              filterBy="#{detail.date}" 
                              filterMatchMode="contains" 
                              sortBy="#{detail.date}"
                              filterable="false">

                        <p:outputLabel value="#{detail.date}">
                            <f:convertDateTime type="date" pattern="dd-MM-yyyy"/>
                        </p:outputLabel>
                    </p:column>

                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh;border-radius: 0px" 
                              headerText="#{userData.userDDs['Notes']}" 

                              filterBy="#{detail.remark}" 
                              filterMatchMode="contains" 
                              sortBy="#{detail.remark}"
                              filterable="false">

                        <p:outputLabel value="#{detail.remark}" />
                    </p:column>

                    <p:rowExpansion>
                        <p:dataTable style="margin-top: 2%"
                                     draggableColumns="true" 
                                     paginator="true"
                                     rows="20"
                                     var="detaildetail" 
                                     widgetVar="detaildetail"  
                                     rowKey="#{detaildetail}"
                                     rowIndexVar="index" 
                                     value="#{detail.rscTenderDetailWorkUnitDTOList}" 
                                     dir="rtl" 
                                     emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                                     id="detaildetail">
                            <p:column   style="width: 8vh;text-align: right;font-size: 1.8vh;border-radius: 0px" headerText="البند" 

                                        filterBy="#{detaildetail.guideDTO.name}" 
                                        filterMatchMode="contains" 
                                        sortBy="#{detaildetail.guideDTO.name}"
                                        filterable="false">

                                <h:outputText value="#{detaildetail.guideDTO.name}" style="font-size: 1.5vh"/>
                            </p:column>
                            <p:column   style="width: 8vh;text-align: right;font-size: 1.8vh;border-radius: 0px" headerText="أقل سعر" 

                                        filterBy="#{detaildetail.priceFrom}" 
                                        filterMatchMode="contains" 
                                        sortBy="#{detaildetail.priceFrom}"
                                        filterable="false">

                                <h:outputText value="#{detaildetail.priceFrom}" style="font-size: 1.5vh"/>
                            </p:column>                            
                            <p:column   style="width: 8vh;text-align: right;font-size: 1.8vh;border-radius: 0px" headerText="أعلى سعر" 

                                        filterBy="#{detaildetail.priceTo}" 
                                        filterMatchMode="contains" 
                                        sortBy="#{detaildetail.priceTo}"
                                        filterable="false">

                                <h:outputText value="#{detaildetail.priceTo}" style="font-size: 1.5vh"/>
                            </p:column>

                            <p:column   style="width: 8vh;text-align: right;font-size: 1.8vh;border-radius: 0px" headerText="السعر" 

                                        filterBy="#{detaildetail.price}" 
                                        filterMatchMode="contains" 
                                        sortBy="#{detaildetail.price}"
                                        filterable="false">

                                <h:outputText value="#{detaildetail.price}" style="font-size: 1.5vh"/>
                            </p:column>
                            <p:column   style="width: 8vh;text-align: right;font-size: 1.8vh;border-radius: 0px" headerText="النتيجة" 

                                        filterBy="#{detaildetail.feedback}" 
                                        filterMatchMode="contains" 
                                        sortBy="#{detaildetail.feedback}"
                                        filterable="false">

                                <h:outputText value="#{detaildetail.feedback}" style="font-size: 1.5vh"/>
                            </p:column>
                        </p:dataTable>
                    </p:rowExpansion>

                </p:dataTable>


            </p:fieldset>




















            <script type="text/javascript">
                google.load("visualization", "1", {packages: ["corechart"]});
                google.charts.setOnLoadCallback(drawChart);
                function drawChart() {
                    var data = google.visualization.arrayToDataTable(
                #{purchaseOfItemsBySuppliersReportMB.pieChartsRows}
                    );
                    var options = {
                        title: 'مشتريات اصناف حسب الموردين',
                        height: 800,
                        seriesType: "bars",
                        vAxis: {
                            title: "الاجمالي"
                        },
                        hAxis: {
                            title: "اسم المورد",
                            slantedText: true, /* Enable slantedText for horizontal axis */
                            slantedTextAngle: 90 /* Define slant Angle */
                        },
                        'chartArea': {'width': '100%', height: '100%', top: '9%', left: '15%', right: '3%', bottom: '30%'} /* Adjust chart alignment to fit vertical labels for horizontal axis*/
                    };

                    var chart = new google.visualization.ComboChart(document.getElementById('donutchart'));
                    chart.draw(data, options);
                }
            </script>

        </h:form>

    </ui:define>
</ui:composition>
