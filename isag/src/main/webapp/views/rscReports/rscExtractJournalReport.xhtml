<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/newTemplate.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core">
    <ui:define name="content">


        <h:form id="form"  dir="#{userData.dir}"  style="margin-right: 20px">
            <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="width: 90px;background-image: none!important;z-index: 2" 
                                  class="viewButton searchButton"
                                  value="Hide/Show"/>  
            </div>

            <p:fieldset  legend="Daily Projects Reports"

                         style=" position: relative"> 

                <div  id="firstSegment" class="ui-g-12 ui-g-nopad firstset">

                    <div class="ui-g">


                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 70px" value="From Date"/>
                                </h:panelGroup> 
                                <h:panelGroup>
                                    <p:calendar pattern="dd/MM/yyyy" 
                                                value="#{rscExtractJournalReportMB.extractionWorkunitSearchBean.fromDate}"
                                                style="width: 56%"
                                                id="dateFrom">

                                    </p:calendar>
                                </h:panelGroup>

                            </h:panelGroup> 

                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 70px" value="To Date"/>
                                </h:panelGroup> 

                                <h:panelGroup>
                                    <p:calendar pattern="dd/MM/yyyy" 
                                                value="#{rscExtractJournalReportMB.extractionWorkunitSearchBean.toDate}"
                                                style="width: 56%"
                                                id="dateTo">

                                    </p:calendar>
                                </h:panelGroup>
                            </h:panelGroup> 

                        </div>

                        <div class="ui-g-12 ui-md-6">

                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 40px" value="The Owner"/>
                                </h:panelGroup> 

                                <h:panelGroup>


                                    <h:panelGroup>
                                        <p:selectOneMenu id="siteiwd"  value="#{rscExtractJournalReportMB.extractionWorkunitSearchBean.owner}"  label="Owner"
                                                         converter="#{rscExtractJournalReportMB.ownerInvOrgSiteDTOConverter}"
                                                         filter="true" filterMatchMode="startsWith" panelStyle="width:250px">
                                            <f:selectItems value="#{rscExtractJournalReportMB.customerListDTO}" var="site" itemLabel="#{site.name}" itemValue="#{site}"/>
                                            <p:ajax update="@form" 
                                                    listener="#{rscExtractJournalReportMB.ownerProjectView}"/>
                                        </p:selectOneMenu>
                                    </h:panelGroup> 



                                </h:panelGroup> 
                            </h:panelGroup>
                        </div>
                        <div  class="ui-g-12 ui-md-6">

                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel  style="width: 40px" value="Contract"/>
                                </h:panelGroup>                             


                                <h:panelGroup>
                                    <p:selectOneMenu id="siteidwd"  value="#{rscExtractJournalReportMB.extractionWorkunitSearchBean.contract}"  label="contract"
                                                     converter="#{rscExtractJournalReportMB.contractRegisterDTOConverterBean}"
                                                     filter="true" filterMatchMode="startsWith" panelStyle="width:250px">
                                        <f:selectItems value="#{rscExtractJournalReportMB.contractRegisterDTOList}" var="site" itemLabel="#{site}" itemValue="#{site}"/>
                                        <p:ajax update="@form" 
                                                listener="#{rscExtractJournalReportMB.projectWorkUnitsGuide}"/>
                                    </p:selectOneMenu>
                                </h:panelGroup> 


                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">

                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 70px" value="Contractor"/>
                                </h:panelGroup> 

                                <h:panelGroup>
                                    <p:selectCheckboxMenu id="siteid"  value="#{rscExtractJournalReportMB.extractionWorkunitSearchBean.siteList}"  label="مقاول"
                                                          converter="#{rscExtractJournalReportMB.invOrgSiteDTOConverterBean}"
                                                          filter="true" filterMatchMode="startsWith" panelStyle="width:250px">
                                        <f:selectItems value="#{rscExtractJournalReportMB.organizationSiteDTOList}" var="site" itemLabel="#{site.name}" itemValue="#{site}"/>
                                    </p:selectCheckboxMenu>
                                </h:panelGroup> 


                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">

                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 70px" value="Item"/>
                                </h:panelGroup> 

                                <h:panelGroup>
                                    <p:selectCheckboxMenu id="workunit" value="#{rscExtractJournalReportMB.extractionWorkunitSearchBean.workUnitList}"  label="item"
                                                          converter="#{rscExtractJournalReportMB.rscWorkUnitDTOConverterBean}"
                                                          filter="true" filterMatchMode="startsWith" panelStyle="width:250px">
                                        <f:selectItems value="#{rscExtractJournalReportMB.rscWorkUnitsGuideDTOList}" var="workunit" itemLabel="#{workunit.name}" itemValue="#{workunit}" />
                                    </p:selectCheckboxMenu>
                                </h:panelGroup> 


                            </h:panelGroup>
                        </div>


                    </div>

                </div>
                <paneGrid class="col-md-12 centerButtons" columns="1" >

                    <h:panelGroup   style="margin-top: 2%">


                        <p:commandButton    class="searchButton"
                                            title="#{userData.userDDs['SEARCH']}"
                                            action="#{rscExtractJournalReportMB.search()}"
                                            id="saveB"
                                            value="#{userData.userDDs['SEARCH']}"
                                            update="guideViewTable" 
                                            icon="fa fa-search"  />

                        <p:commandButton  class="newButton"
                                          id="NewB"
                                          title="#{userData.userDDs['NEW']}" 
                                          immediate="true" 
                                          action="#{rscExtractJournalReportMB.reset()}"
                                          update="@form"
                                          value="#{userData.userDDs['NEW']}"
                                          process="@this"
                                          icon="fa fa-plus"/>

                        <p:commandButton  class="PrintButton"
                                          id="PrintB"
                                          ajax="false"
                                          onclick="form.target = '_blank'"  
                                          icon="fa fa-fw fa-print"
                                          value="#{userData.userDDs['PRINT']}"  
                                          action="#{rscExtractJournalReportMB.print()}"
                                          title="#{userData.userDDs['PRINT']}"
                                          />

                        <p:commandButton  class="closeButton"
                                          id="CloseB"
                                          icon="fa fa-fw fa-backward"  
                                          title="#{userData.userDDs['BACK']}"
                                          action="exit" immediate="true"
                                          value="#{userData.userDDs['BACK']}"/>
                        <h:commandLink>  
                            <p:graphicImage name="/img/excel.jpg" width="24"/>  
                            <p:dataExporter type="xls"
                                            target="guideViewTable" 
                                            fileName="Daily Projects Reports"
                                            postProcessor="#{rscExtractJournalReportMB.postProcessXLS}" />  
                        </h:commandLink>

                        <p:blockUI block="form" trigger="saveB NewB PrintB CloseB" animate="true" >

                            <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                        </p:blockUI> 


                    </h:panelGroup>
                </paneGrid>
            </p:fieldset>

            <p:fieldset id="reportDB">
                <p:dataTable 
                    paginator="true"
                    rows="20"
                    draggableColumns="true" 
                    var="guideList" 
                    rowIndexVar="index" 
                    value="#{rscExtractJournalReportMB.guideDTOViewBeanList}" 
                    dir="rtl" 
                    id="guideViewTable"
                    >
                    <f:facet name="header">


                        <p:outputPanel>
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" onkeyup="PF('guideViewTable').filter()" style="width:150px" />
                        </p:outputPanel>

                    </f:facet>
                    <p:column style="width:16px">
                        <p:rowToggler />
                    </p:column>
                    <p:column   style="width: 10vh;text-align: right;font-size: 2.2vh" headerText="Item Code" 

                                filterBy="#{guideList.workUnitCode}" 
                                filterMatchMode="contains" 
                                sortBy="#{guideList.workUnitCode}"
                                filterable="false">

                        <p:outputLabel value="#{guideList.workUnitCode}" />
                    </p:column>
                    <p:column   style="width: 10vh;text-align: right;font-size: 2.2vh" headerText="Item Name" 

                                filterBy="#{guideList.workUnitName}" 
                                filterMatchMode="contains" 
                                sortBy="#{guideList.workUnitName}"
                                filterable="false">

                        <p:outputLabel value="#{guideList.workUnitName}" />
                    </p:column>


                    <p:rowExpansion>
                        <p:dataTable 
                            paginator="true"
                            rows="20"
                            var="detailview" 
                            rowIndexVar="index"  rowKey="detailview"
                            value="#{guideList.rscExtractJournalViewBeanList}" 
                            dir="rtl" 

                            >
                            <p:column style="width: 12vh;text-align: right;font-size: 1.8vh" 
                                      headerText="Date">

                                <p:outputLabel value="#{detailview.extractDate}">
                                    <f:convertDateTime type="date" pattern="dd-MM-yyyy"/>
                                </p:outputLabel>
                            </p:column>
                            <p:column   style="width: 10vh;text-align: right;font-size: 2.2vh" 
                                        headerText="Quantity" >

                                <p:outputLabel value="#{detailview.currentQty}" />
                            </p:column>


                        </p:dataTable>
                    </p:rowExpansion>

                </p:dataTable>




            </p:fieldset>

        </h:form>

    </ui:define>
</ui:composition>
