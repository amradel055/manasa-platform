<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">
        <h:form  id="form" dir="#{userData.dir}"  style="margin-right: 20px">

            <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="width: 90px;background-image: none!important;z-index: 2" 
                                  class="viewButton searchButton"
                                  value="Hide/Show"/>  
            </div>

            <p:fieldset  id="head"  legend="الكشف عن الفواتير"

                         style=" position: relative"> 

                <div  id="firstSegment" class="ui-g-12 ui-g-nopad firstset">

                    <div class="ui-g">

                        <div class="ui-g-12 ui-md-6">

                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 75px" value="من عميل"/>
                                </h:panelGroup> 

                                <h:panelGroup>
                                    <p:autoComplete style="width:36%!important"
                                                    id="fromSupplier"
                                                    dropdown="true"
                                                    converter="#{autoComplete.organizationSiteDTOConvertor}"
                                                    value="#{rscExtractUnitItemAmountMB.rscExtractUnitItemAmountSearchBean.customerFrom}"
                                                    var="organization"
                                                    itemLabel="#{organization}" 
                                                    itemValue="#{organization}"
                                                    forceSelection="true" 
                                                    completeMethod="#{autoComplete.completeCustomerFrom}"
                                                    >

                                    </p:autoComplete>
                                </h:panelGroup> 
                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 75px"
                                                   value="من بند"/>
                                </h:panelGroup> 

                                <h:panelGroup>
                                    <p:autoComplete style="width:36%!important" 
                                                    id="fromItem"
                                                    dropdown="true"
                                                    converter="#{autoComplete.rscWorkUnitsGuideDTOConverter}"
                                                    value="#{rscExtractUnitItemAmountMB.rscExtractUnitItemAmountSearchBean.rscWorkUnitsGuideFrom}"
                                                    var="rscWorkUnits"
                                                    itemLabel="#{rscWorkUnits}" 
                                                    itemValue="#{rscWorkUnits}"
                                                    forceSelection="true"
                                                    completeMethod="#{autoComplete.completeRscWorkUnitDTOTo}" >
                                    </p:autoComplete>
                                </h:panelGroup> 
                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 75px"
                                                   value="إلى بند"/>
                                </h:panelGroup> 

                                <h:panelGroup>
                                    <p:autoComplete style="width:36%!important" 
                                                    id="toItem"
                                                    dropdown="true"
                                                    converter="#{autoComplete.rscWorkUnitsGuideDTOConverter}"
                                                    value="#{rscExtractUnitItemAmountMB.rscExtractUnitItemAmountSearchBean.rscWorkUnitsGuideTo}"
                                                    var="rscWorkUnits"
                                                    itemLabel="#{rscWorkUnits}" 
                                                    itemValue="#{rscWorkUnits}"
                                                    forceSelection="true"
                                                    completeMethod="#{autoComplete.completeRscWorkUnitDTOTo}" >
                                    </p:autoComplete>
                                </h:panelGroup> 
                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">

                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel  style="width: 70px" value="#{userData.userDDs['FROM_DATE']}"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:calendar pattern="dd/MM/yyyy" 
                                                value="#{rscExtractUnitItemAmountMB.rscExtractUnitItemAmountSearchBean.dateFrom}"
                                                style="width: 55%"
                                                id="dateFrom">

                                    </p:calendar>
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel  style="width: 70px" value="#{userData.userDDs['TO_DATE']}"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:calendar pattern="dd/MM/yyyy" 
                                                value="#{rscExtractUnitItemAmountMB.rscExtractUnitItemAmountSearchBean.dateTo}"
                                                style="width: 55%"
                                                id="dateTo">

                                    </p:calendar>
                                </h:panelGroup>
                            </h:panelGroup>

                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel  style="width: 70px; margin-right: 6%;" value="التفصيلي"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:selectBooleanCheckbox value="#{rscExtractUnitItemAmountMB.viewDetail}" >
                                        <p:ajax update="ContractorAccountViewTable"/>
                                    </p:selectBooleanCheckbox>
                                </h:panelGroup>
                            </h:panelGroup>

                        </div>


                    </div>
                </div>

                <h:panelGrid columns="1"  class="col-md-12" >

                    <h:panelGroup class="centerButtons" style="margin-top: 2%">

                        <p:commandButton   class="searchButton"
                                           title="#{userData.userDDs['SEARCH']}"
                                           action="#{rscExtractUnitItemAmountMB.search()}"
                                           id="search"
                                           value="#{userData.userDDs['SEARCH']}"
                                           update="ContractorAccountViewTable" 
                                             />

                        <p:commandButton  class="newButton"
                                          id="NewB"
                                          title="#{userData.userDDs['NEW']}" 
                                          immediate="true" 
                                          action="#{rscExtractUnitItemAmountMB.reset()}"
                                          update="@form"
                                          value="#{userData.userDDs['NEW']}"
                                          onclick="clearDate();"/>

                        <p:commandButton  class="printButtons" 
                                          ajax="false"
                                          id="PrintB"
                                          onclick="form.target = '_blank'"  
                                          value="#{userData.userDDs['PRINT']}" 
                                          actionListener="#{rscExtractUnitItemAmountMB.exportPDF}"
                                          title="#{userData.userDDs['PRINT']}"
                                          immediate="true" />

                        <p:commandButton  class="closeButton"
                                          title="#{userData.userDDs['BACK']}"
                                          id="CloseB"
                                          action="exit"
                                          value="#{userData.userDDs['BACK']}"/>

                        <h:commandLink class="sdcreenimg">  
                            <p:graphicImage name="/img/excel.jpg" width="24"/>  
                            <p:dataExporter type="xls"
                                            target="ContractorAccountViewTable" 
                                            fileName=" تقرير   "
                                            postProcessor="#{rscExtractUnitItemAmountMB.postProcessXLS}" />  
                        </h:commandLink>

                        <p:blockUI block="form" trigger="NewB search PrintB CloseB" animate="true" >

                            <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                        </p:blockUI> 


                    </h:panelGroup>

                </h:panelGrid>

            </p:fieldset>

            <p:fieldset  style="margin-top: 2%">
                <p:dataTable style="margin-top: 2%"
                             draggableColumns="true" 
                             paginator="true"
                             rows="20"
                             var="ContractorAccountViewTable" 
                             widgetVar="ContractorAccountViewTable"  
                             rowKey="#{ContractorAccountViewTable}"
                             rowIndexVar="index" 
                             value="#{rscExtractUnitItemAmountMB.extractUnitItemAmountViewBeanList}" 
                             dir="rtl" 
                             emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                             id="ContractorAccountViewTable">
                    

                    <p:column style="width:16px"   headerText="التفصيلي" >
                        <p:rowToggler   >
                            
                        </p:rowToggler>
                    </p:column>
                    <p:column   style="width: 8vh;text-align: right;font-size: 1.8vh" headerText="كود البند" 

                                filterBy="#{ContractorAccountViewTable.itemCode}" 
                                filterMatchMode="contains" 
                                sortBy="#{ContractorAccountViewTable.itemCode}"
                                filterable="false">

                        <h:outputText value="#{ContractorAccountViewTable.itemCode}" style="font-size: 1.5vh"/>
                    </p:column>

                    <p:column style="width: 12vh;text-align: right;font-size: 1.8vh" filterStyle="display:none"
                              headerText="البند" 

                              filterBy="#{ContractorAccountViewTable.itemName}" 
                              filterMatchMode="contains" 
                              sortBy="#{ContractorAccountViewTable.itemName}"
                              filterable="false">

                        <h:outputText value="#{ContractorAccountViewTable.itemName}" style="font-size: 1.5vh;width: 95%"/>
                    </p:column>
                    <p:column style="width: 12vh;text-align: right;font-size: 1.8vh" filterStyle="display:none"
                              headerText="اجمالى الاعمال" 

                              filterBy="#{ContractorAccountViewTable.netCost}" 
                              filterMatchMode="contains" 
                              sortBy="#{ContractorAccountViewTable.netCost}"
                              filterable="false">

                        <h:outputText value="#{ContractorAccountViewTable.netCost}" style="font-size: 1.5vh;width: 95%"/>
                    </p:column>
                    <p:rowExpansion>
                        <p:dataTable style="margin-top: 2%"
                                     draggableColumns="true" 
                                     paginator="true"
                                     rows="20"
                                     var="rscExtractRegisterDetialDTOView" 
                                     widgetVar="rscExtractRegisterDetialDTOView"  
                                     rowKey="#{rscExtractRegisterDetialDTOView}"
                                     rowIndexVar="index" 
                                     value="#{ContractorAccountViewTable.extractUnitItemAmountViewBeanList}" 
                                     dir="rtl" 
                                     emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                                     id="rscExtractRegisterDTOView">
                            <p:column   style="width: 8vh;text-align: right;font-size: 1.8vh;border-radius: 0px" headerText="تاريخ" 

                                        filterBy="#{rscExtractRegisterDetialDTOView.date}" 
                                        filterMatchMode="contains" 
                                        sortBy="#{rscExtractRegisterDetialDTOView.date}"
                                        filterable="false">

                                <h:outputText value="#{rscExtractRegisterDetialDTOView.date}" style="font-size: 1.5vh">
                                <f:convertDateTime pattern="yyyy/MM/dd" />
                                </h:outputText>
                            </p:column>
                            <p:column   style="width: 8vh;text-align: right;font-size: 1.8vh;border-radius: 0px" headerText="المشروع" 

                                        filterBy="#{rscExtractRegisterDetialDTOView.projectName}" 
                                        filterMatchMode="contains" 
                                        sortBy="#{rscExtractRegisterDetialDTOView.projectName}"
                                        filterable="false">

                                <h:outputText value="#{rscExtractRegisterDetialDTOView.projectName}" style="font-size: 1.5vh"/>
                            </p:column>
                            <p:column   style="width: 8vh;text-align: right;font-size: 1.8vh;border-radius: 0px" headerText="المقاول" 

                                        filterBy="#{rscExtractRegisterDetialDTOView.supplierName}" 
                                        filterMatchMode="contains" 
                                        sortBy="#{rscExtractRegisterDetialDTOView.supplierName}"
                                        filterable="false">

                                <h:outputText value="#{rscExtractRegisterDetialDTOView.supplierName}" style="font-size: 1.5vh"/>
                            </p:column>
                            <p:column   style="width: 8vh;text-align: right;font-size: 1.8vh;border-radius: 0px" headerText="الكمية المنفذه" 

                                        filterBy="#{rscExtractRegisterDetialDTOView.amount}" 
                                        filterMatchMode="contains" 
                                        sortBy="#{rscExtractRegisterDetialDTOView.amount}"
                                        filterable="false">

                                <h:outputText value="#{rscExtractRegisterDetialDTOView.amount}" style="font-size: 1.5vh"/>
                            </p:column>
                            <p:column   style="width: 8vh;text-align: right;font-size: 1.8vh;border-radius: 0px" headerText="سعر الوحده" 

                                        filterBy="#{rscExtractRegisterDetialDTOView.price}" 
                                        filterMatchMode="contains" 
                                        sortBy="#{rscExtractRegisterDetialDTOView.price}"
                                        filterable="false">

                                <h:outputText value="#{rscExtractRegisterDetialDTOView.price}" style="font-size: 1.5vh"/>
                            </p:column>
                            <p:column   style="width: 8vh;text-align: right;font-size: 1.8vh;border-radius: 0px" headerText="الصافي" 

                                        filterBy="#{rscExtractRegisterDetialDTOView.netCost}" 
                                        filterMatchMode="contains" 
                                        sortBy="#{rscExtractRegisterDetialDTOView.netCost}"
                                        filterable="false">

                                <h:outputText value="#{rscExtractRegisterDetialDTOView.netCost}" style="font-size: 1.5vh"/>
                            </p:column>
                        </p:dataTable>
                    </p:rowExpansion>
                </p:dataTable>
            </p:fieldset>
            <script>
                function clearDate() {
                    document.getElementById("form:dateFrom_input").value = null;
                    document.getElementById("form:dateTo_input").value = null;
                }
            </script>
        </h:form>
    </ui:define>
</ui:composition>
