<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/newTemplate.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">
        <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>

        <style >
            .colored {                
                background: #0064bc ;
                color: #fff ;
                font-size: 12px;
            }
            .ui-dialog {

                top: 0!important;
                left: 0px!important;

            }
        </style>
       
        <h:form id="form"  dir="#{userData.dir}"  style="margin-right: 20px">

            <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="width: 90px;background-image: none!important;z-index: 2" 
                                  class="viewButton searchButton"
                                  value="Hide/Show"/>  
            </div>

            <p:fieldset  legend="Tender Report"

                         style=" position: relative"> 

                <div  id="firstSegment" class="ui-g-12 ui-g-nopad firstset">

                    <div class="ui-g">


                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 70px" value="From Date"/>
                                </h:panelGroup> 
                                <h:panelGroup>
                                    <p:calendar pattern="dd/MM/yyyy" 
                                                value="#{rscTenderContractReportMB.tenderContractReportSearchBean.fromDate}"
                                                style="width: 56%"
                                                id="dateFrom">

                                    </p:calendar>
                                </h:panelGroup>

                            </h:panelGroup> 

                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 70px" value="To Date"/>
                                </h:panelGroup> 

                                <h:panelGroup>
                                    <p:calendar pattern="dd/MM/yyyy" 
                                                value="#{rscTenderContractReportMB.tenderContractReportSearchBean.toDate}"
                                                style="width: 56%"
                                                id="dateTo">

                                    </p:calendar>
                                </h:panelGroup>
                            </h:panelGroup> 

                        </div>

                    </div>

                </div>
                <paneGrid class="col-md-12 centerButtons" columns="1" >

                    <h:panelGroup   style="margin-top: 2%">


                        <p:commandButton    class="searchButton"
                                            title="#{userData.userDDs['SEARCH']}"
                                            action="#{rscTenderContractReportMB.search()}"
                                            id="saveB"
                                            value="#{userData.userDDs['SEARCH']}"
                                            update="detailViewTable" 
                                            icon="fa fa-search"  />

                        <p:commandButton  class="newButton"
                                          id="NewB"
                                          title="#{userData.userDDs['NEW']}" 
                                          immediate="true" 
                                          action="#{rscTenderContractReportMB.reset()}"
                                          update="@form"
                                          value="#{userData.userDDs['NEW']}"
                                          process="@this"
                                          icon="fa fa-plus"/>

                        <p:commandButton  class="PrintButton"
                                          id="PrintB"
                                          ajax="false"
                                          onclick="form.target = '_blank'"  
                                          icon="fa fa-fw fa-print"
                                          value="#{userData.userDDs['PRINT']}" 
                                          actionListener="#{rscTenderContractReportMB.exportPDF}"
                                          title="#{userData.userDDs['PRINT']}"
                                          immediate="true" />

                        <p:commandButton  class="closeButton"
                                          id="CloseB"
                                          icon="fa fa-fw fa-backward"  
                                          title="#{userData.userDDs['BACK']}"
                                          action="exit"
                                          value="#{userData.userDDs['BACK']}"/>
                        <h:commandLink>  
                            <p:graphicImage name="/img/excel.jpg" width="24"/>  
                            <p:dataExporter type="xls"
                                            target="detailViewTable" 
                                            fileName=" تقرير  العطاء"
                                            postProcessor="#{rscTenderContractReportMB.postProcessXLS}" />  
                        </h:commandLink>

                        <p:blockUI block="form" trigger="saveB NewB PrintB CloseB" animate="true" >

                            <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                        </p:blockUI> 


                    </h:panelGroup>
                </paneGrid>
            </p:fieldset>

            <p:fieldset id="reportDB">
                <p:dataTable 
                    paginator="true"
                    rows="20"
                    draggableColumns="true" 
                    var="detail" 
                    rowIndexVar="index" 
                    value="#{rscTenderContractReportMB.rscTenderContractReportViewList}" 
                    dir="rtl" 
                    id="detailViewTable"
                    >
                    <f:facet name="header">


                        <p:outputPanel>
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" onkeyup="PF('detailViewTable').filter()" style="width:150px" />
                        </p:outputPanel>

                    </f:facet>

                    <p:column   style="width: 10vh;text-align: right;font-size: 2.2vh" headerText="Contaractor Name" 

                                filterBy="#{detail.customerId}" 
                                filterMatchMode="contains" 
                                sortBy="#{detail.customerId}"
                                filterable="false">

                        <p:outputLabel value="#{detail.customerId}" />
                    </p:column>

                    <p:column   style="width: 8vh;text-align: right;font-size: 1.8vh" headerText="Tender Number" 

                                filterBy="#{detail.serial}" 
                                filterMatchMode="contains" 
                                sortBy="#{detail.serial}"
                                filterable="false">

                        <p:outputLabel value="#{detail.serial}" />
                    </p:column>
                    <p:column   style="width: 8vh;text-align: right;font-size: 1.8vh" headerText="Daftar Number" 

                                filterBy="#{detail.docNumber}" 
                                filterMatchMode="contains" 
                                sortBy="#{detail.docNumber}"
                                filterable="false">

                        <p:outputLabel value="#{detail.docNumber}" />
                    </p:column>
                    <p:column style="width: 12vh;text-align: right;font-size: 1.8vh" 
                              headerText="Date"

                              filterBy="#{detail.date}" 
                              filterMatchMode="contains" 
                              sortBy="#{detail.date}"
                              filterable="false">

                        <p:outputLabel value="#{detail.date}">
                            <f:convertDateTime type="date" pattern="dd-MM-yyyy"/>
                        </p:outputLabel>
                    </p:column>

                    <p:column style="width: 12vh;text-align: right;font-size: 1.8vh" filterStyle="display:none"
                              headerText="General Consultant"

                              filterBy="#{detail.generalConsultant}" 
                              filterMatchMode="contains" 
                              sortBy="#{detail.generalConsultant}"
                              filterable="false">

                        <p:outputLabel value="#{detail.generalConsultant}" />
                    </p:column>




                    <p:column style="width: 12vh;text-align: right;font-size: 1.8vh" 
                              headerText="Professional Business Consultant"

                              filterBy="#{detail.profissionalBussinessConsultant}" 
                              filterMatchMode="contains" 
                              sortBy="#{detail.profissionalBussinessConsultant}"
                              filterable="false">

                        <p:outputLabel value="#{detail.profissionalBussinessConsultant}" />
                    </p:column>
                    <p:column style="width: 12vh;text-align: right;font-size: 1.8vh" 
                              headerText="Project Manager"

                              filterBy="#{detail.projectManager}" 
                              filterMatchMode="contains" 
                              sortBy="#{detail.projectManager}"
                              filterable="false">

                        <p:outputLabel value="#{detail.projectManager}" />
                    </p:column>
                    <p:column style="width: 12vh;text-align: right;font-size: 1.8vh" 
                              headerText="Remarks"

                              filterBy="#{detail.remark}" 
                              filterMatchMode="contains" 
                              sortBy="#{detail.remark}"
                              filterable="false">

                        <p:outputLabel value="#{detail.remark}" />
                    </p:column>

                </p:dataTable>


            </p:fieldset>

            <script type="text/javascript">
                google.load("visualization", "1", {packages: ["corechart"]});
                google.charts.setOnLoadCallback(drawChart);
                function drawChart() {
                    var data = google.visualization.arrayToDataTable(
                #{purchaseOfItemsBySuppliersReportMB.pieChartsRows}
                    );
                    var options = {
                        title: 'مشتريات اصناف حسب الموردين',
                        height: 800,
                        seriesType: "bars",
                        vAxis: {
                            title: "الاجمالي"
                        },
                        hAxis: {
                            title: "اسم المورد",
                            slantedText: true, /* Enable slantedText for horizontal axis */
                            slantedTextAngle: 90 /* Define slant Angle */
                        },
                        'chartArea': {'width': '100%', height: '100%', top: '9%', left: '15%', right: '3%', bottom: '30%'} /* Adjust chart alignment to fit vertical labels for horizontal axis*/
                    };

                    var chart = new google.visualization.ComboChart(document.getElementById('donutchart'));
                    chart.draw(data, options);
                }
            </script>

        </h:form>

    </ui:define>
</ui:composition>
