<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form class='formmargin' id="form"  enctype="multipart/form-data"  dir="#{userData.dir}">
            <p:fieldset id="whole1" legend="التقاط الصورة" style="margin-bottom:20px">

                <div  id="firstLine" class="ui-g-12 ui-g-nopad">
                    <div class="ui-g">

                        <p:outputPanel id="photo">
                            <button  id="start-camera" type="button">Start Camera</button>
                            <video id="video"  width="320" height="240" autoplay="true"></video>
                            <button  id="click-photo" type="button">Click Photo</button>
                            <canvas id="canvas" width="320" height="240" ></canvas>

                        </p:outputPanel>
                        <script>
                            let camera_button = document.querySelector("#start-camera");
                            let video = document.querySelector("#video");
                            let click_button = document.querySelector("#click-photo");
                            let canvas = document.querySelector("#canvas");

                            camera_button.addEventListener('click', async function () {
                                let stream = await navigator.mediaDevices.getUserMedia({video: true, audio: false});
                                video.srcObject = stream;
                            });

                            click_button.addEventListener('click', function () {
                                canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                                let image_data_url = canvas.toDataURL('image/jpeg');

                                // data url of the image
                                document.getElementById("form:img").value = image_data_url;

                                console.log(image_data_url);
                            });
                        </script>
                        <p:inputText type="hidden" style="display: none"  id="img" value="#{gmSubscriptionsFormDTOMB.file}">
                            <p:ajax process="@this" />
                        </p:inputText>

                    </div>



                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <p:graphicImage url="#{gmSubscriptionsFormDTOMB.host.concat(gmSubscriptionsFormDTOMB.organizationSiteId.clientImage)}" library="demo"  style="max-width:80%;max-height:80%;object-fit: cover !important;"/>
                        </div>
                       
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 65px" value="صورة العميل"/>

                        </div>  
                    </div>
                </div>


                <panelGrid class="centerButtons col-md-12" style='display: block; text-align: center;'>

                    <h:panelGroup>
                        <p:blockUI block="form" trigger="saveB" animate="true" >

                            <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>
                        </p:blockUI> 
                    </h:panelGroup>
                </panelGrid>

            </p:fieldset>
            <p:fieldset legend="انشاءعميل جديد"  style="margin-bottom:20px">


                <div class="col-xs-12">
                    <p:messages autoUpdate="true"  id="msgopp" showDetail="true" closable="true" />
                </div>
                <div  id="firstLine" class="ui-g-12 ui-g-nopad">
                    <div class="ui-g">

                        <div class="ui-g-6 ui-xl-6">
                        
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText style="width: 35%!important" id="ad1" a:autofocus="true" value="#{gmSubscriptionsFormDTOMB.organizationSiteId.name}"/>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 85px;margin-right: 3%;" value="الاسم"/>

                                </div>
                            </div>

                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText style="width: 35%!important" id="ad2" value="#{gmSubscriptionsFormDTOMB.organizationSiteId.mobile}"/>

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 85px;" value="الجوال"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText style="width: 35%!important" id="ad3"  value="#{gmSubscriptionsFormDTOMB.organizationSiteId.address}"/>

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 85px;" value="العنوان "/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText style="width: 35%!important" id="ad4"  value="#{gmSubscriptionsFormDTOMB.organizationSiteId.nationId}"/>

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 85px;" value="رقم الهوية "/>

                                </div>
                            </div>
                               <div class="ui-g-12 ui-xl-12">
                                          <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText style="width: 35%!important" id="ad5" value="#{gmSubscriptionsFormDTOMB.organizationSiteId.nationIdSerial}"/>

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 85px;" value="طبعة الهوية"/>

                                </div>
                            </div>

                            <div class="ui-g-6 ui-xl-6">
                                <p:calendar id="dateFrom" 
                                            value="#{gmSubscriptionsFormDTOMB.organizationSiteId.birthdate}"
                                            pattern="dd/MM/yyyy"
                                            style="width:50%!important"/>
                            </div>
                            <div class="ui-g-6 ui-xl-6">
                                <p:outputLabel style="width: 95px; ;" value="تاريخ الميلاد"/>

                            </div>
                        </div>
                       
                        </div>                        
                    </div>
                </div>

            </p:fieldset>

            <div class="asmaa">
                <p:commandButton  class="saveButton"  
                                  id="saveB" 
                                  title="#{userData.userDDs['SAVE']}"
                                  value="#{userData.userDDs['SAVE']}" 
                                  style=""
                                  action="#{gmSubscriptionsFormDTOMB.addNewCustomer2()}" 
                                  update="@form"/>

                <p:commandButton  class="newButton" 
                                  id="newN"
                                  ajax="false"
                                  style=""
                                  value="#{userData.userDDs['NEW']}" 
                                  title="#{userData.userDDs['NEW']}"
                                  onclick="form.target = ''" 
                                  actionListener="#{gmSubscriptionsFormDTOMB.reset()}"/>



                <p:blockUI block="form" trigger="saveB" animate="true" >

                    <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                </p:blockUI> 

            </div>
        </h:form>
    </ui:define>
</ui:composition>
