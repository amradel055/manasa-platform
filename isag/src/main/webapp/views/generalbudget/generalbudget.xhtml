<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form id="branchListForm" dir="#{userData.dir}" class='formmargin'>
            <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                      margin-top: 22%;
                                      color: #035c70!important; 
                                      background-color: #223238!important;
                                      border: 1px solid #22323a!important;
                                      background: #22323a 50% 50% repeat-x!important;"
                                      icon="fa fa-fw fa-home"
                                      title="#{userData.userDDs['HOME']}"
                                      class="smhomeButton" 
                                      action="exit" />  
            </div>
            <p:fieldset legend="#{userData.userDDs['GENERAL_BUD_ITE_GUI']}" >
                <div >
                    <p:messages autoUpdate="true"  id="messages" showDetail="true" closable="true"/>  

                </div>

                <div>
                    <p:dataTable 
                        draggableColumns="true" draggableRows="true"
                        var="detail" widgetVar="detail"  rowIndexVar="index" 
                        value="#{generalBudgetGuideListBean.budgetGuideList}" 
                        paginator="true" emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                        id="generalBudgetTable">
                        <f:facet name="header" >
                            <p:commandButton class="saddButton" icon="fa fa-plus" 
                                             title="#{userData.userDDs['ADD']}"
                                             action="#{generalBudgetGuideListBean.goToAdd()}" 
                                             style="float:right" 
                                             rendered="#{userData.userScreens['generalbudget'].add or userData.isAdmin}"/>
                           
                            
                           
                            <p:outputPanel>
                                <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                                <p:inputText id="globalFilter" a:autofocus="true" onkeyup="PF('detail').filter()" style="height: 25px!important;width: 30%!important;" />
                            </p:outputPanel>
                        </f:facet>
                        <p:column   style="width: 6vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px" >
                            <p:outputLabel value="#{detail.number}" style="font-size: 1.5vh"/>
                        </p:column>
                        <p:column style="width: 15vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px"  
                                  filterStyle="display:none" filterBy="#{detail.nameAr}"  
                                  filterMatchMode="contains" headerText="#{userData.userDDs['IT_NAME']}" sortBy="#{detail.nameAr}" >
                            <p:outputLabel value="#{detail.nameAr}" style="font-size: 1.5vh;width:150%" />
                        </p:column>
                        <p:column style="width: 30vh;font-size: 1.8vh;border-radius: 0px"   
                                  filterStyle="display:none" filterBy="#{detail.nameEn}"  
                                  filterMatchMode="contains" headerText="#{userData.userDDs['ITEM_NAME_EN']}" sortBy="#{detail.nameEn}" >
                            <p:outputLabel value="#{detail.nameEn}" style=" ;font-size: 1.5vh" />
                        </p:column>

                        <p:column  style="width: 30vh;font-size: 1.8vh;border-radius: 0px" 
                                   filterMatchMode="contains" headerText="#{userData.userDDs['ITEM_SET']}" >
                            <p:selectOneMenu style="margin: 2px ;width:90%;float:right" id="accgrp" value="#{detail.accGroup}" required="true" requiredMessage="#{userData.userDDs['REQUIRED']}" >
                                <f:selectItems value="#{generalBudgetGuideListBean.accountGroups}" var="grop" itemLabel="#{userData.userDDs[''+= grop]}" itemValue="#{grop}" /> 
                            </p:selectOneMenu>
                        </p:column>
                        <p:column style="width: 10vh;font-size: 1.8vh;text-align: center;border-radius: 0px"  headerText="#{userData.userDDs['TRANSACTION']}" >

                            <p:commandButton class="seditButtons" update="@form" 
                                             icon="fa fa-fw fa-edit" 
                                             title="#{userData.userDDs['EDIT']}"
                                             
                                             action="#{generalBudgetGuideListBean.goToEdit()}" 
                                             rendered="#{userData.userScreens['generalbudget'].view or userData.userScreens['generalbudget'].edit or userData.isAdmin}" style="font-size: 1.5vh;background-color: #6a6967;border-radius: 3px;margin-bottom:3px">
                                <f:setPropertyActionListener value="#{detail.id}"  target="#{generalBudgetGuideListBean.budgetGuideId}" />
                            </p:commandButton>

                            <p:commandButton class="sdeleteButtons" update="@form" 
                                             icon="fa fa-remove" title="#{userData.userDDs['DELETE']}" 
                                            style="background-color: red;border-radius: 3px;margin-bottom:3px"
                                             
                                             action="#{generalBudgetGuideListBean.delete}" 
                                             rendered="#{userData.userScreens['generalbudget'].delete or userData.isAdmin}">
                                <f:setPropertyActionListener value="#{detail}" target="#{generalBudgetGuideListBean.budgetGuideSelect}" />
                                <p:confirm header="Confirmation" message="#{userData.userDDs['ARE_YOU_SURE']}" icon="ui-icon-alert" />
                            </p:commandButton>

                        </p:column>
                    </p:dataTable>
                    <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                        <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                        <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                    </p:confirmDialog>
                </div>
            </p:fieldset>
        </h:form>
    </ui:define>
</ui:composition>
