<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns="http://www.w3.org/1999/xhtml">

    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form id="form"  enctype="multipart/form-data"  dir="#{userData.dir}" class='formmargin'>
            <p:fieldset legend="#{userData.userDDs['GENERAL_BUD_ITE_GUI']}" >
                <p:messages autoUpdate="true" rendered="true" id="messages" showDetail="true" closable="true"/>
                <div class="ui-g-12 ui-g-nopad" id="pnl">
                    <div class="ui-g">

                        
                               	 <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
<p:inputText style="width: 35%!important"  id="SER" a:autofocus="true" value="#{generalBudgetFormBean.serial}" required="true" requiredMessage="#{userData.userDDs['REQUIRED']}" >
                                        <p:ajax event="keyup" update="msgSER" />
                                    </p:inputText>
                                    <p:message id="msgSER" for="SER"/>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel  style="width: 90px;margin-right: 4%;" value="#{userData.userDDs['CS_COD']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
 <p:inputText style="width: 35%!important"  id="nameAr" value="#{generalBudgetFormBean.nameAr}" required="true" requiredMessage="#{userData.userDDs['REQUIRED']}" >
                                        <p:ajax event="keyup" update="msgnameAr" />
                                    </p:inputText>
                                    <p:message id="msgnameAr" for="nameAr"/>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel  style="width: 25%;margin-right: 4%;"  value="#{userData.userDDs['ITEM_NAME_ARABIC']}"/>

                                </div>
                            </div>
                                  
                         
                        </div>
                        
                        <div class="ui-g-6 ui-xl-6">
                            
                                 <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
 <p:selectOneMenu  style="width: 35%;margin-right: 5px;height: 22px"  id="accgrp"  value="#{generalBudgetFormBean.groupItemEnum}" >
                                        <f:selectItems value="#{generalBudgetFormBean.accountGroups}" var="grop" itemLabel="#{userData.userDDs[''+= grop]}" itemValue="#{grop}" /> 
                                    </p:selectOneMenu>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 90px;margin-right: 4%;" class="generalbudoutlab" value="#{userData.userDDs['ITEM_SET']}" />

                                </div>
                            </div>
                                       <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText style="width: 35%!important"  id="nameEn" value="#{generalBudgetFormBean.nameEn}" />
                                    <p:message for="nameEn"/>

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 25%;margin-right: 4%;"  value="#{userData.userDDs['ITEM_NAME_EN']}"/>

                                </div>
                            </div>
                            
                            
                            
                        </div>
                        
                        
              
    
                       
                 
               
                    </div>
                </div>

                <h:panelGrid  class=" col-sm-12 centerButtons" columns="1"  style="margin-top: 2%">

                    <h:panelGroup>


                        <p:commandButton  class="editButtons" id="editB" title="#{userData.userDDs['SAVE']}" 
                                          value="#{userData.userDDs['SAVE']}" 
                                          rendered="#{userData.userScreens['generalbudget'].edit or  userData.userScreens['generalbudget'].add
                                                      or userData.isAdmin}"
                                          action="#{generalBudgetFormBean.save}"
                                          update="form"/>


                        <p:commandButton  class="closeButtons" 
                                          title="#{userData.userDDs['BACK']}" 
                                          immediate="true"
                                          value="#{userData.userDDs['BACK']}"
                                          action="#{generalBudgetFormBean.cancel}"   />

                    </h:panelGroup>

                </h:panelGrid>


            </p:fieldset>
            <p:blockUI block="form" trigger="editB" animate="true" >

                <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

            </p:blockUI>
        </h:form>
    </ui:define>
</ui:composition>
