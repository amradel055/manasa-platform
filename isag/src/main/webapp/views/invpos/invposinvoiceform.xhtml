                                <p:column  style="width: 13vh;text-align: -webkit-auto;border-radius: 0px" id="Unit"

                                        <p:confirm header="#{userData.userDDs['COFIGRATION']}"

                                    </p:commandButton>

                                        <p:commandButton title="#{userData.userDDs['YES']}" onclick="addIndexRow(indexRow);" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                                        <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                                    </p:confirmDialog>
                                </p:column>


                                <p:summaryRow>
                                    <p:column colspan="3" style="text-align:right">
                                        <h:outputText style="text-align:right" value="#{userData.userDDs['TOTAL']}  :" />

                                    <p:column />
                                    <p:column>
                                        <h:outputText id="totalQuantity" value="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.totalQuatity}"/>
                                    </p:column>
                                    <p:column>
                                        <h:outputText id="totalWeight" value="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.totalWeight}"/>
                                    </p:column>
                                    <p:column />
                                    <p:column />

                                    <p:column rendered="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.companyActivity eq 'Alumetal'}" />
                                    <p:column rendered="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.companyActivity eq 'Alumetal'}" />
                                    <p:column>
                                        <h:outputText id="totalNet" value="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.totalNet}"/>
                                    </p:column>
