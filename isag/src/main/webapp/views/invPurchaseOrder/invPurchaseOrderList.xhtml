<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/newTemplate.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form  class='formmargin' dir="#{userData.dir}">
            <div style=" position: absolute;left: 20px"> 

                    <p:commandButton  style="z-index: 2;
                                      margin-top: 24%;
                                      color: #035c70!important; 
                                      background-color: #223238!important;
                                      border: 1px solid #22323a!important;
                                      background: #22323a 50% 50% repeat-x!important;"
                                      icon="fa fa-fw fa-home"
                                      title="#{userData.userDDs['HOME']}"
                                      class="smhomeButton" 
                                      action="exit" />
                       
                </div>
            <p:fieldset legend="#{userData.userDDs['PURCHASE_ORDERS']}" >

                <div>
                    <p:dataTable 
                        draggableColumns="true" 
                        var="invPurchaseOrderTable" widgetVar="bTable"  rowIndexVar="index" 
                        value="#{invPurchaseOrderListMB.invPurchaseOrderEntitys}" rows="#{userData.rowListCount}" 
                        paginator="true" emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                        id="purchaseOrderTable">

                        <f:facet name="header" class="col-md-12">
                            <p:commandButton class="saddButton" icon="fa fa-plus" title="#{userData.userDDs['ADD']}" action="#{invPurchaseOrderListMB.goToAdd()}" style="float:right" rendered="#{userData.userScreens['invPurchaseOrder'].add or userData.isAdmin}"/>
                            
                            <p:outputPanel>
                                <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                                <p:inputText id="globalFilter" a:autofocus="true" onkeyup="PF('bTable').filter()" style="width:150px" />
                            </p:outputPanel>
                        </f:facet>

                        <p:column  style="width:3vh;font-size:1.8vh;text-align: right;border-radius: 0px"
                                   filterStyle="display:none" filterBy="#{invPurchaseOrderTable.serial}" 
                                   filterMatchMode="contains" headerText="#" >
                            <p:outputLabel value="#{invPurchaseOrderTable.serial}"  style="width: 12vh"/>
                        </p:column>

                        <p:column style="width:15vh;font-size:1.8vh;text-align: right;border-radius: 0px"
                                  filterStyle="display:none" filterBy="#{invPurchaseOrderTable.date}"  filterMatchMode="contains" headerText="#{userData.userDDs['DATEE']}" sortBy="#{invPurchaseOrderTable.date}" >
                            <p:outputLabel value="#{invPurchaseOrderTable.date}" >
                                <f:convertDateTime type="date" pattern="dd-MM-yyyy"/>
                            </p:outputLabel>                           
                        </p:column>
                       

                        <p:column style="width:15vh;font-size:1.8vh;text-align: right;border-radius: 0px"
                                  filterStyle="display:none"
                                  filterBy="#{invPurchaseOrderTable.supplierId}"
                                  filterMatchMode="contains"
                                  headerText="#{userData.userDDs['SUPPLIER']}" 
                                  sortBy="#{invPurchaseOrderTable.supplierId}" 
                                  >
                            <p:outputLabel value="#{invPurchaseOrderTable.supplierId}" />
                        </p:column>  
                        
                        <p:column style="width:15vh;font-size:1.8vh;text-align: right;border-radius: 0px"
                                   headerText="#{userData.userDDs['PURCHASES_DELEGATE']}"  >
                            <p:outputLabel />
                        </p:column>  

                        <p:column style="width:15vh;font-size:1.8vh;text-align: right;border-radius: 0px"
                                  filterStyle="display:none" filterBy="#{invPurchaseOrderTable.remarks}"
                                  filterMatchMode="contains" headerText="#{userData.userDDs['REMARK']}" sortBy="#{invPurchaseOrderTable.remarks}" >
                            <p:outputLabel value="#{invPurchaseOrderTable.remarks}" />
                        </p:column>
                       
                        

                        <p:column style="width:9vh;font-size:1.8vh;text-align: center;border-radius: 0px"
                                  headerText="#{userData.userDDs['TRANSACTION']}" >
                            <p:commandButton update="@form" icon="fa fa-fw fa-edit"
                                             class="seditButtons"
                                             title="#{userData.userDDs['EDIT']}"  style="background-color: #6a6967;border-radius: 3px;" action="#{invPurchaseOrderListMB.goToEdit()}" rendered="#{userData.userScreens['invPurchaseOrder'].edit or userData.isAdmin}">
                                <f:setPropertyActionListener value="#{invPurchaseOrderTable.id}"  target="#{invPurchaseOrderListMB.invPurchaseOrderSelected}" />
                            </p:commandButton>
                            <p:commandButton class="sdeleteButtons" update="@form" style="background-color: red;border-radius: 3px;" icon="fa fa-remove" title="#{userData.userDDs['DELETE']}"  action="#{invPurchaseOrderListMB.delete}" rendered="#{userData.userScreens['invPurchaseOrder'].delete or userData.isAdmin}">
                                <f:setPropertyActionListener value="#{invPurchaseOrderTable}" target="#{invPurchaseOrderListMB.invPurchaseOrderEntity}" />
                                <p:confirm header="Confirmation" message="#{userData.userDDs['ARE_YOU_SURE']}" icon="ui-icon-alert" />
                            </p:commandButton>
                            
                            <p:commandButton   class="sprintButtonf"  onclick="form.target = '_blank'"  ajax="false"
                                               icon="fa fa-fw fa-print" style="background-color: rgb(0, 74, 128);border-radius: 3px;"
                                               title="print" 
                                               action="#{invPurchaseOrderListMB.print()}" 
                                               rendered="#{userData.userScreens['invPurchaseOrder'].edit or userData.isAdmin}" >

                                <f:setPropertyActionListener value="#{invPurchaseOrderTable}" 
                                                             target="#{invPurchaseOrderListMB.invPurchaseOrderEntity}" />
                            </p:commandButton>
                        </p:column>

                    </p:dataTable> 
                    <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                        <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                        <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                    </p:confirmDialog>
                </div>
            </p:fieldset>
        </h:form>
    </ui:define>
</ui:composition>
