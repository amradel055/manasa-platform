<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/newTemplate.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">
        <style>
            .ui-selectcheckboxmenu .ui-selectcheckboxmenu-trigger {

                width: 24px;
            }
            .navbar-top-links li:last-child{

                margin-top: 25px!important
            }
        </style>

        <div class="col-xs-12">
            <p:messages autoUpdate="true"  showDetail="true" closable="true" rendered="true" />
        </div>



        <h:form id="form" dir="#{userData.dir}" class='formmargin'>


            <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                  margin-top: 12%;
                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;"
                                  icon="fa fa-fw fa-home"
                                  title="#{userData.userDDs['HOME']}"
                                  class="smhomeButton" 
                                  action="exit" />
                <p:commandButton  style="z-index: 2;
                                  margin-top: 9%!important;
                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;" 
                                  class="viewButton sminimize"
                                  icon="fa fa-window-minimize"
                                  title="إظهار/إخفاء"/> 
            </div>

            <p:fieldset legend="تقرير حد الطلب" 

                        style=" position: relative">



                <div  id="pnl" class="ui-g-12 ui-g-nopad firstset">
                    <div class="ui-g">

                        <div class="ui-g-12 ui-md-6">

                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 65px;margin-right: 6%;"  value="#{userData.userDDs['GROUP']}"/>
                                </h:panelGroup> 

                                <p:selectCheckboxMenu  style="width: 41%;height: 28px" id="groups" 
                                                       value="#{invItemOrderLimitReportMB.itemCardReportSerachBean.groupSelected}" 
                                                       label="#{userData.userDDs['GROUPS']}"
                                                       filter="true" filterMatchMode="startsWith" >
                                    <f:selectItems value="#{invItemOrderLimitReportMB.invGroupList}" 
                                                   var="group" itemLabel="#{group}" itemValue="#{group.id}" />
                                </p:selectCheckboxMenu>
                            </h:panelGroup> 
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <p:outputLabel style="width: 95px;margin-right: 6%;" id="purchId" value="كمية الأمان" />
                            <p:inputText style="width: 35%" 
                                         id="purchIdVal" 
                                         value="#{invItemOrderLimitReportMB.itemCardReportSerachBean.saveAmount}" />
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 65px;margin-right: 6%;" value="#{userData.userDDs['FROM_ITEM']}"/>
                                </h:panelGroup> 

                                <h:panelGroup>
                                    <p:autoComplete style="width:40%!important " 
                                                    dropdown="true"
                                                    converter="#{invItemOrderLimitReportMB.itemConverter}"
                                                    value="#{invItemOrderLimitReportMB.itemCardReportSerachBean.fromItem}"
                                                    var="item"
                                                    itemLabel="#{item}" 
                                                    itemValue="#{item}" 
                                                    forceSelection="true" 
                                                    completeMethod="#{invItemOrderLimitReportMB.completItem}" 
                                                    id="fromItem">
                                    </p:autoComplete>
                                </h:panelGroup> 
                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 65px" value="#{userData.userDDs['TO_ITEM']}"/>
                                </h:panelGroup> 

                                <h:panelGroup>
                                    <p:autoComplete style="width:40%!important " 
                                                    dropdown="true"
                                                    converter="#{invItemOrderLimitReportMB.itemConverter}"
                                                    value="#{invItemOrderLimitReportMB.itemCardReportSerachBean.toItem}"
                                                    var="item"
                                                    itemLabel="#{item}" 
                                                    itemValue="#{item}" 
                                                    forceSelection="true" 
                                                    completeMethod="#{invItemOrderLimitReportMB.completItem}"
                                                    id="toItem">
                                    </p:autoComplete>
                                </h:panelGroup> 
                            </h:panelGroup>

                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 65px" value="إحفاء الارصده الصفرية"/>
                                </h:panelGroup> 

                                <h:panelGroup>                        
                                    <p:selectBooleanCheckbox id="orderLimit" value="#{invItemOrderLimitReportMB.hiddenOrderLimit}">
                                        <p:ajax update="ItemMainDataByGroupViewTable" listener="#{invItemOrderLimitReportMB.search()}" />
                                    </p:selectBooleanCheckbox>
                                </h:panelGroup> 
                            </h:panelGroup>

                        </div>
                    </div>
                </div>
                <h:panelGrid  columns="1" class="col-md-12">

                    <h:panelGroup  class="centerButtons" style="margin-top: 2%"> 


                        <p:commandButton   class="searchButtons"
                                           title="#{userData.userDDs['SEARCH']}"
                                           action="#{invItemOrderLimitReportMB.search()}"
                                           id="saveB"
                                           value="#{userData.userDDs['SEARCH']}"
                                           update="ItemMainDataByGroupViewTable" 
                                           style="color: #fff!important;background-color: #2196F3;margin-left: 5px;" />

                        <p:commandButton  class="newButton"
                                          id="NewB"
                                          title="#{userData.userDDs['NEW']}" 
                                          immediate="true" 
                                          action="#{invItemOrderLimitReportMB.reset()}"
                                          update="form"
                                          value="#{userData.userDDs['NEW']}"
                                          style=""
                                          onclick="selectAll();"/>

                        <p:commandButton  class="printButtons" 
                                          id="PrintB"
                                          ajax="false"
                                          onclick="form.target = '_blank'"  
                                          style="color: #fff!important;background-color: rgb(1, 76, 134);margin-left: 5px;"
                                          value="#{userData.userDDs['PRINT']}" 
                                          actionListener="#{invItemOrderLimitReportMB.exportPDF}"

                                          title="#{userData.userDDs['PRINT']}"
                                          immediate="true" />

                        <p:commandButton  class="closeButton"
                                          style=""   
                                          id="CloseB"
                                          title="#{userData.userDDs['BACK']}"
                                          action="exit"
                                          value="#{userData.userDDs['BACK']}"/>
                        <h:commandLink  class="sdcreenimg" style="margin-right: 4px;">  

                            <p:graphicImage name="/img/excel.jpg" width="24"/>  

                            <p:dataExporter type="xls"
                                            target="ItemMainDataByGroupViewTable" 
                                            fileName=" تقرير البيانات الأساسية للأصناف حسب المجموعات"
                                            postProcessor="#{invItemOrderLimitReportMB.postProcessXLS}" />  
                        </h:commandLink>

                        <p:blockUI block="form" trigger="orderLimit saveB NewB PrintB CloseB" animate="true" >

                            <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                        </p:blockUI> 


                    </h:panelGroup> 

                </h:panelGrid>


            </p:fieldset>

            <p:fieldset style=" margin: 10px 0">
                <p:dataTable 
                    style="margin-top: 2%"
                    draggableColumns="true" 
                    var="ItemMainDataByGroupViewTable" 
                    widgetVar="ItemMainDataByGroupViewTable"  
                    rowKey="#{ItemMainDataByGroupViewTable}"
                    rowIndexVar="index" 
                    value="#{invItemOrderLimitReportMB.inventoryItemsQuantityList}" 
                    dir="rtl" 
                    emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                    id="ItemMainDataByGroupViewTable" 
                    paginator="true" 
                    rows="20">

                    <f:facet name="header" class="col-md-12">

                        <p:outputPanel>
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" onkeyup="PF('bTable').filter()" style="width:150px" />

                        </p:outputPanel>
                    </f:facet>

                    <p:columns value="#{invItemOrderLimitReportMB.columns}" var="column" columnIndexVar="colIndex" 
                               style="width: 9vh;font-size: 1.2vh;font-weight: bold;border-radius: 0px;"
                               sortBy="#{ItemMainDataByGroupViewTable[column.property]}"
                               filterBy="#{ItemMainDataByGroupViewTable[column.property]}" 
                               filterMatchMode="contains"
                               filterable="false" >

                        <f:facet name="header">
                            <h:outputText value="#{column.header}" />
                        </f:facet>
                        <h:outputText value="#{ItemMainDataByGroupViewTable[column.property]}" />
                    </p:columns>

                </p:dataTable>
            </p:fieldset>
            <script>
                function selectAll() {
                    $(':checkbox[id*="groups"]').prop('checked', true);
                    document.getElementById("form:fromItem_hinput").value = null;
                    document.getElementById("form:toItem_hinput").value = null;
                }

            </script>
        </h:form>
    </ui:define>
</ui:composition>
