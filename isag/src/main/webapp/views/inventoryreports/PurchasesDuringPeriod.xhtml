<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />

        <h:form  id="form" dir="#{userData.dir}"  class='formmargin'>
          




            <p:fieldset  legend="#{userData.userDDs['PURCHASES_DUR_PER']}" style=" position: relative"> 


                <div  id="firstSegment" class="ui-g-12 ui-g-nopad firstset">

                        <div class="ui-g-6 ui-xl-6">

                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:calendar pattern="dd/MM/yyyy" 
                                                value="#{purchasesDuringPeriodReportMB.purchasesDuringPeriodSearchBean.dateTo}"
                                                style="width: 50%">

                                    </p:calendar>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel  style="width: 100px" value="#{userData.userDDs['TO_DATE']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:calendar pattern="dd/MM/yyyy" 
                                                value="#{purchasesDuringPeriodReportMB.purchasesDuringPeriodSearchBean.dateFrom}"
                                                style="width: 50%">

                                    </p:calendar>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel  style="width: 100px" value="#{userData.userDDs['FROM_DATE']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:selectOneMenu style="width:50%;" filter="true" filterMatchMode="contains"   value="#{purchasesDuringPeriodReportMB.purchasesDuringPeriodSearchBean.topaymentType}"  >
                                        <f:selectItem itemLabel="#{userData.userDDs['CHOOSE']}" itemValue="0"/>
                                        <f:selectItem itemLabel="#{userData.userDDs['CASH']}"  itemValue="1" />
                                        <f:selectItem itemLabel="#{userData.userDDs['POSTPONE']}"  itemValue="2" />
                                        <f:selectItem itemLabel="#{userData.userDDs['DECOM_CREDIT']}"  itemValue="3" />
                                    </p:selectOneMenu>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 105px" value="#{userData.userDDs['TO_INVOI_TYP']}"/>

                                </div>
                            </div>
                             <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:autoComplete style="width:40%!important" 

                                                    dropdown="true"

                                                    converter="#{purchasesDuringPeriodReportMB.invOrgSiteConverter}"
                                                    value="#{purchasesDuringPeriodReportMB.purchasesDuringPeriodSearchBean.toorganizationName}"
                                                    var="organization"
                                                    itemLabel="#{organization}" 
                                                    itemValue="#{organization}"
                                                    forceSelection="true" 
                                                    completeMethod="#{purchasesDuringPeriodReportMB.completOrgSite}" >
                                    </p:autoComplete>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 105px" value="#{userData.userDDs['TO_SUPPLIER']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:autoComplete style="width:40%!important"
                                                    dropdown="true"
                                                    converter="#{purchasesDuringPeriodReportMB.invOrgSiteConverter}"
                                                    value="#{purchasesDuringPeriodReportMB.purchasesDuringPeriodSearchBean.fromorganizationName}"
                                                    var="organization"
                                                    itemLabel="#{organization}" 
                                                    itemValue="#{organization}"
                                                    forceSelection="true" 
                                                    completeMethod="#{purchasesDuringPeriodReportMB.completOrgSite}"

                                                    >

                                    </p:autoComplete>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 105px;" value="#{userData.userDDs['FROM_SUPPLIER']}"/>

                                </div>
                            </div>
                        </div>


                        <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:selectOneMenu style="width:50%;"  filter="true" filterMatchMode="contains"   value="#{purchasesDuringPeriodReportMB.purchasesDuringPeriodSearchBean.frompaymentType}" >
                                        <f:selectItem itemLabel="#{userData.userDDs['CHOOSE']}" itemValue="0"/>
                                        <f:selectItem itemLabel="#{userData.userDDs['CASH']}"  itemValue="1" />
                                        <f:selectItem itemLabel="#{userData.userDDs['POSTPONE']}"  itemValue="2" />
                                        <f:selectItem itemLabel="#{userData.userDDs['DECOM_CREDIT']}"  itemValue="3" />
                                    </p:selectOneMenu>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 105px;" value="#{userData.userDDs['FROM_INVOI_TYP']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:autoComplete id="purchaseIdTo"
                                                    style="width:34%!important " 
                                                    dropdown="true"

                                                    converter="#{purchasesDuringPeriodReportMB.invInvoicePurchaseConverter}"
                                                    value="#{purchasesDuringPeriodReportMB.purchasesDuringPeriodSearchBean.toserial}"

                                                    var="purchasePerson"
                                                    itemLabel="#{purchasePerson}" 
                                                    itemValue="#{purchasePerson}" 
                                                    forceSelection="true" 
                                                    completeMethod="#{purchasesDuringPeriodReportMB.completePurchaseInvoice}">
                                    </p:autoComplete>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 105px" value="#{userData.userDDs['TO_INVOI_NO']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:autoComplete id="purchaseIdFrom"
                                                    style="width:40%!important " 
                                                    dropdown="true"

                                                    converter="#{purchasesDuringPeriodReportMB.invInvoicePurchaseConverter}"
                                                    value="#{purchasesDuringPeriodReportMB.purchasesDuringPeriodSearchBean.fromserial}"

                                                    var="purchasePerson"
                                                    itemLabel="#{purchasePerson}" 
                                                    itemValue="#{purchasePerson}" 
                                                    forceSelection="true" 
                                                    completeMethod="#{purchasesDuringPeriodReportMB.completePurchaseInvoice}">
                                    </p:autoComplete>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 105px;" value="#{userData.userDDs['FROM_INVOI_NO']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:autoComplete style="width:40%!important" 

                                                    dropdown="true"
                                                    converter="#{purchasesDuringPeriodReportMB.invInventoryConverter}"
                                                    value="#{purchasesDuringPeriodReportMB.purchasesDuringPeriodSearchBean.toInventoryName}"
                                                    var="inventory"
                                                    itemLabel="#{inventory}" 
                                                    itemValue="#{inventory}"
                                                    forceSelection="true" 
                                                    completeMethod="#{purchasesDuringPeriodReportMB.completInventory}">
                                    </p:autoComplete>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 105px" value="#{userData.userDDs['TO_REPOS_NO']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:autoComplete style="width:40%!important"
                                                    dropdown="true"
                                                    converter="#{purchasesDuringPeriodReportMB.invInventoryConverter}"
                                                    value="#{purchasesDuringPeriodReportMB.purchasesDuringPeriodSearchBean.fromInventoryName}"
                                                    var="inventory"
                                                    itemLabel="#{inventory}" 
                                                    itemValue="#{inventory}"
                                                    forceSelection="true" 
                                                    completeMethod="#{purchasesDuringPeriodReportMB.completInventory}"
                                                    >

                                    </p:autoComplete>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 105px;" value="#{userData.userDDs['FROM_REPOS_NO']}"/>

                                </div>
                            </div>
                           
                        </div>






                    </div>
                </div>

                            <div id="buttunss" class="asmaa">

                        <p:commandButton   class="searchbuttons"
                                           title="#{userData.userDDs['SEARCH']}"
                                           action="#{purchasesDuringPeriodReportMB.search()}"
                                           id="saveB"
                                           value="#{userData.userDDs['SEARCH']}"
                                           update="PurchasesDuringPeriodViewTable" 
/>

                        <p:commandButton   class="newbutton"
                                           title="#{userData.userDDs['NEW']}" 
                                           id="NewB"
                                           immediate="true" 
                                           action="#{purchasesDuringPeriodReportMB.reset()}"
                                           update="form"
                                           value="#{userData.userDDs['NEW']}"
/>

                        <p:commandButton    class="printbuttons"
                                            ajax="false"
                                            id="PrintB"
                                            onclick="form.target = '_blank'"  
                                            value="#{userData.userDDs['PRINT']}" 
                                            actionListener="#{purchasesDuringPeriodReportMB.exportPDF}"
                                            title="#{userData.userDDs['PRINT']}"
                                            immediate="true" />

                        <p:commandButton  class="closeButtons"
                                          value="#{userData.userDDs['BACK']}"
                                          id="CloseB"
                                          title="#{userData.userDDs['BACK']}"
                                          action="exit"/>

                        <h:commandLink  class="sdcreenimg" style="margin-right: 4px;">  
                            <p:graphicImage name="/img/excel.jpg" width="24"/>  
                            <p:dataExporter type="xls"
                                            target="PurchasesDuringPeriodViewTable" 
                                            fileName="مشتريات خلال ال�?ترة"
                                            postProcessor="#{purchasesDuringPeriodReportMB.postProcessXLS}" />  
                        </h:commandLink>


                        <p:blockUI block="form" trigger="saveB NewB PrintB CloseB" animate="true" >

                            <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                        </p:blockUI> 
                            </div>
            </p:fieldset>

            <p:fieldset  style="margin-top: 2%">
                <p:dataTable 
                    paginator="true"
                    rows="20"
                    draggableColumns="true" 
                    var="PurchasesDuringPeriodViewTable" 
                    widgetVar="PurchasesDuringPeriodViewTable"  
                    rowKey="#{PurchasesDuringPeriodViewTable}"
                    rowIndexVar="index" 
                    value="#{purchasesDuringPeriodReportMB.purchasesDuringPeriodBeanList}" 
                    dir="rtl" 
                    emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                    id="PurchasesDuringPeriodViewTable">

                    <f:facet name="header">


                        <p:outputPanel>
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" onkeyup="PF('PurchasesDuringPeriodViewTable').filter()" style="width:150px" />
                        </p:outputPanel>

                    </f:facet>

                    <p:column   style="width: 10vh;text-align: right;font-size: 1.8vh;text-align: center;border-radius: 0px;" headerText="#{userData.userDDs['INVOICE_NO']}" 

                                filterBy="#{PurchasesDuringPeriodViewTable.serial}" 
                                filterMatchMode="contains" 
                                sortBy="#{PurchasesDuringPeriodViewTable.serial}"
                                filterable="false">

                        <h:outputText value="#{PurchasesDuringPeriodViewTable.serial}" style="font-size: 1.5vh"/>
                    </p:column>

                    <p:column style="width: 6vh;text-align: right;font-size: 1.8vh;text-align: center;border-radius: 0px;" filterStyle="display:none"
                              headerText="#{userData.userDDs['DATEE']}" 

                              filterBy="#{PurchasesDuringPeriodViewTable.date}" 
                              filterMatchMode="contains" 
                              sortBy="#{PurchasesDuringPeriodViewTable.date}"
                              filterable="false">

                        <p:outputLabel value="#{PurchasesDuringPeriodViewTable.date}">
                            <f:convertDateTime type="date" pattern="dd-MM-yyyy"/>
                        </p:outputLabel>
                    </p:column>


                    <p:column style="width: 6vh;text-align: right;font-size: 1.8vh;text-align: center;border-radius: 0px;" filterStyle="display:none"
                              headerText="#{userData.userDDs['TYPE']}" 


                              filterBy="#{PurchasesDuringPeriodViewTable.paymentTypeText}" 
                              filterMatchMode="contains" 
                              sortBy="#{PurchasesDuringPeriodViewTable.paymentTypeText}"
                              filterable="false">

                        <h:outputText value="#{PurchasesDuringPeriodViewTable.paymentTypeText}" style="font-size: 1.5vh;width: 95%"/>
                    </p:column>

                    <p:column style="width: 15vh;text-align: right;font-size: 1.8vh;text-align: center;border-radius: 0px;" 
                              headerText="#{userData.userDDs['SUPPLIER']}" 

                              filterBy="#{PurchasesDuringPeriodViewTable.organizationName}" 
                              filterMatchMode="contains" 
                              sortBy="#{PurchasesDuringPeriodViewTable.organizationName}"
                              filterable="false">

                        <h:outputText value="#{PurchasesDuringPeriodViewTable.organizationName}" style="font-size: 1.5vh;width: 95%"/>
                    </p:column>

                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh;text-align: center;border-radius: 0px;" 
                              headerText="#{userData.userDDs['TOTAL']}" 

                              filterBy="#{PurchasesDuringPeriodViewTable.net}" 
                              filterMatchMode="contains" 
                              sortBy="#{PurchasesDuringPeriodViewTable.net}"
                              filterable="false">

                        <p:inputNumber readonly="true" value="#{PurchasesDuringPeriodViewTable.net}" style="font-size: 1.5vh;width: 90%"/>
                    </p:column>
                    <p:columnGroup type="footer">
                        <p:row>
                            <p:column style="border-radius: 0px;" colspan="4" footerText="#{userData.userDDs['TOTAL']}  :" />
                            <p:column footerText="#{purchasesDuringPeriodReportMB.totalString}"  style="font-size: 1.4vh;border-radius: 0px;" />
                        </p:row>
                    </p:columnGroup>

                </p:dataTable>
            </p:fieldset>
        </h:form>

</ui:composition>
