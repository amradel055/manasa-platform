<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form  id="form" dir="#{userData.dir}"  class='formmargin'>

            <p:fieldset  legend="#{userData.userDDs['BASIC_DATA_CUSTOMERS']}"

                         style=" position: relative">


                <div  id="firstSegment" class="ui-g-12 ui-g-nopad firstset">
                    <div class="ui-g">

                        <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:autoComplete style="width:40%!important" 

                                                    dropdown="true"
                                                    converter="#{supplierDataReportMB.invOrgSiteConverter}"
                                                    value="#{supplierDataReportMB.supplierDataReportSearchBean.toorganizationName}"
                                                    var="organization"
                                                    itemLabel="#{organization}" 
                                                    itemValue="#{organization}"

                                                    forceSelection="true"
                                                    completeMethod="#{supplierDataReportMB.completOrgSite}" >
                                    </p:autoComplete>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 75px" value="#{userData.userDDs['TO_CUSTOM']}"/>

                                </div>
                            </div>
                        </div>

                        <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:autoComplete style="width:40%!important"
                                                    dropdown="true"
                                                    converter="#{supplierDataReportMB.invOrgSiteConverter}"
                                                    value="#{supplierDataReportMB.supplierDataReportSearchBean.fromorganizationName}"
                                                    var="organization"
                                                    itemLabel="#{organization}" 
                                                    itemValue="#{organization}"
                                                    forceSelection="true" 
                                                    completeMethod="#{supplierDataReportMB.completOrgSite}">

                                    </p:autoComplete>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 75px;" value="#{userData.userDDs['FROM_CUSTOM']}"/>

                                </div>
                            </div>
                        </div>





                    </div>
                </div>

                <div id="buttunss" class="asmaa">


                    <p:commandButton     class="searchButtons"
                                         title="#{userData.userDDs['SEARCH']}"
                                         action="#{supplierDataReportMB.search()}"
                                         id="saveB"
                                         value="#{userData.userDDs['SEARCH']}"
                                         update="CustomerDataViewTable" 
                                         />

                    <p:commandButton   class="newButton"
                                       id="NewB"
                                       title="#{userData.userDDs['NEW']}" 
                                       immediate="true" 
                                       action="#{supplierDataReportMB.reset()}"
                                       update="form"
                                       value="#{userData.userDDs['NEW']}"
                                       />



                    <p:commandButton   class="printButtons"
                                       id="PrintB"
                                       ajax="false"
                                       onclick="form.target = '_blank'"  
                                       value="#{userData.userDDs['PRINT']}" 
                                       actionListener="#{supplierDataReportMB.exportPDF}"
                                       title="#{userData.userDDs['PRINT']}"
                                       immediate="true" />

                    <p:commandButton class="closeButton"
                                     id="CloseB"
                                     value="#{userData.userDDs['BACK']}" 
                                     title="#{userData.userDDs['BACK']}"
                                     action="exit"/>

                    <h:commandLink  class="sdcreenimg" style="margin-right: 4px;">  
                        <p:graphicImage name="/img/excel.jpg" width="24"/>  
                        <p:dataExporter type="xls"
                                        target="CustomerDataViewTable" 
                                        fileName=" تقرير بيانات العملاء الأساسية"
                                        postProcessor="#{supplierDataReportMB.postProcessXLS}" />  
                    </h:commandLink>
                    
                    <p:commandButton   class="newButton"
                                       id="sendsms"
                                       title="ارسال رسائل" 
                                       immediate="true" 
                                       action="#{supplierDataReportMB.sendSmsForCustomer()}"
                                       value="ارسال SMS"
                                       />

                    <p:blockUI block="form" trigger="saveB NewB PrintB CloseB sendsms" animate="true" >

                        <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                    </p:blockUI> 


                </div>

            </p:fieldset>

            <p:fieldset  style="margin-top: 2%">
                <p:dataTable 
                    scrollable="true" 
                    scrollHeight="650"
                    var="CustomerDataViewTable" 
                    widgetVar="CustomerDataViewTable"  
                    rowKey="#{CustomerDataViewTable}"
                    rowIndexVar="index" 
                    value="#{supplierDataReportMB.supplierDataReportViewBeanList}" 
                    selection="#{supplierDataReportMB.supplierDataReportViewBeanListSelected}"
                    dir="rtl" 
                    emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                    id="CustomerDataViewTable">

                    <p:column  selectionMode="multiple" toggleable="false" style="width:1vh;background-color: #fff"  />

                    <f:facet name="header">


                        <p:outputPanel>
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" onkeyup="PF('CustomerDataViewTable').filter()" style="width:150px" />
                        </p:outputPanel>

                    </f:facet>

                    <p:column   style="width: 8vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" headerText="#{userData.userDDs['CUSTOM_CODE']}" 

                                filterBy="#{CustomerDataViewTable.code}" 
                                filterMatchMode="contains" 
                                sortBy="#{CustomerDataViewTable.code}"
                                filterable="false">

                        <h:outputText value="#{CustomerDataViewTable.code}" style="font-size: 1.5vh"/>
                    </p:column>



                    <p:column style="width: 12vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" filterStyle="display:none"
                              headerText="#{userData.userDDs['NAME']}" 

                              filterBy="#{CustomerDataViewTable.name}" 
                              filterMatchMode="contains" 
                              sortBy="#{CustomerDataViewTable.name}"
                              filterable="false">

                        <h:outputText value="#{CustomerDataViewTable.name}" style="font-size: 1.5vh;width: 95%"/>
                    </p:column>
                    <p:column style="width: 12vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" filterStyle="display:none"
                              headerText="#{userData.userDDs['Opening_Balance']}"

                              filterBy="#{CustomerDataViewTable.openBalance}" 
                              filterMatchMode="contains" 
                              sortBy="#{CustomerDataViewTable.openBalance}"
                              filterable="false">

                        <h:outputText value="#{CustomerDataViewTable.openBalance}" style="font-size: 1.5vh;width: 95%"/>
                    </p:column>

                    <p:column style="width: 12vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" filterStyle="display:none"
                              headerText="#{userData.userDDs['DATE']}" 

                              filterBy="#{CustomerDataViewTable.openBalanceDate}" 
                              filterMatchMode="contains" 
                              sortBy="#{CustomerDataViewTable.openBalanceDate}"
                              filterable="false">

                        <h:outputText value="#{CustomerDataViewTable.openBalanceDate}" style="font-size: 1.5vh;width: 95%"/>
                    </p:column>

                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" 
                              headerText="#{userData.userDDs['PHONE']}" 

                              filterBy="#{CustomerDataViewTable.phone}" 
                              filterMatchMode="contains" 
                              sortBy="#{CustomerDataViewTable.phone}"
                              filterable="false">

                        <h:outputText value="#{CustomerDataViewTable.phone}" style="font-size: 1.5vh;width: 95%"/>
                    </p:column>
                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" 
                              headerText="#{userData.userDDs['CREDIT_LIMIT']}" 

                              filterBy="#{CustomerDataViewTable.balanceLimit}" 
                              filterMatchMode="contains" 
                              sortBy="#{CustomerDataViewTable.balanceLimit}"
                              filterable="false">

                        <h:outputText value="#{CustomerDataViewTable.balanceLimit}" style="font-size: 1.5vh;width: 95%"/>
                    </p:column>
                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" 
                              headerText="#{userData.userDDs['ACCOUNT_NUMBER']}" 

                              filterBy="#{CustomerDataViewTable.accountName}" 
                              filterMatchMode="contains" 
                              sortBy="#{CustomerDataViewTable.accountName}"
                              filterable="false">

                        <h:outputText value="#{CustomerDataViewTable.accountName}" style="font-size: 1.5vh;width: 95%"/>

                    </p:column>  
                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" 
                              headerText="#{userData.userDDs['ACCOUNT_CODE']}" 

                              filterBy="#{CustomerDataViewTable.accountNumber}" 
                              filterMatchMode="contains" 
                              sortBy="#{CustomerDataViewTable.accountNumber}"
                              filterable="false">

                        <h:outputText value="#{CustomerDataViewTable.accountNumber}" style="font-size: 1.5vh;width: 95%"/>

                    </p:column>  

                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" 
                              headerText="#{userData.userDDs['NATIONAL_ID']}" 

                              filterBy="#{CustomerDataViewTable.nationId}" 
                              filterMatchMode="contains" 
                              sortBy="#{CustomerDataViewTable.nationId}"
                              filterable="false">

                        <h:outputText value="#{CustomerDataViewTable.nationId}" style="font-size: 1.5vh;width: 95%"/>

                    </p:column> 

                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" 
                              headerText="#{userData.userDDs['Guarantor1']}" 

                              filterBy="#{CustomerDataViewTable.sponsorName1}" 
                              filterMatchMode="contains" 
                              sortBy="#{CustomerDataViewTable.sponsorName1}"
                              filterable="false">

                        <h:outputText value="#{CustomerDataViewTable.sponsorName1}" style="font-size: 1.5vh;width: 95%"/>

                    </p:column> 

                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" 
                              headerText="#{userData.userDDs['PHONE1']}" 

                              filterBy="#{CustomerDataViewTable.sponsorPhone1}" 
                              filterMatchMode="contains" 
                              sortBy="#{CustomerDataViewTable.sponsorPhone1}"
                              filterable="false">

                        <h:outputText value="#{CustomerDataViewTable.sponsorPhone1}" style="font-size: 1.5vh;width: 95%"/>

                    </p:column> 

                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" 
                              headerText="#{userData.userDDs['Guarantor2']}" 

                              filterBy="#{CustomerDataViewTable.sponsorName2}" 
                              filterMatchMode="contains" 
                              sortBy="#{CustomerDataViewTable.sponsorName2}"
                              filterable="false">

                        <h:outputText value="#{CustomerDataViewTable.sponsorName2}" style="font-size: 1.5vh;width: 95%"/>

                    </p:column> 

                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" 
                              headerText="#{userData.userDDs['PHONE2']}" 

                              filterBy="#{CustomerDataViewTable.sponsorPhone2}" 
                              filterMatchMode="contains" 
                              sortBy="#{CustomerDataViewTable.sponsorPhone2}"
                              filterable="false">

                        <h:outputText value="#{CustomerDataViewTable.sponsorPhone2}" style="font-size: 1.5vh;width: 95%"/>

                    </p:column> 

                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" 
                              headerText="#{userData.userDDs['BANK_ACC_NO']}" 

                              filterBy="#{CustomerDataViewTable.accountBankNumber}" 
                              filterMatchMode="contains" 
                              sortBy="#{CustomerDataViewTable.accountBankNumber}"
                              filterable="false">

                        <h:outputText value="#{CustomerDataViewTable.accountBankNumber}" style="font-size: 1.5vh;width: 95%"/>

                    </p:column> 
                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" 
                              headerText="#{userData.userDDs['DELEGATOR']}" 

                              filterBy="#{CustomerDataViewTable.delegator}" 
                              filterMatchMode="contains" 
                              sortBy="#{CustomerDataViewTable.delegator}"
                              filterable="false">

                        <h:outputText value="#{CustomerDataViewTable.delegator}" style="font-size: 1.5vh;width: 95%"/>

                    </p:column>
                </p:dataTable>
            </p:fieldset>
        </h:form>
    </ui:define>
</ui:composition>
