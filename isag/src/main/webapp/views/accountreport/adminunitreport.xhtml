<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <link rel="stylesheet" type="text/css" href="../../resources/css/main.css" /> 
    <ui:define name="content">
        <div class="col-xs-12">
            <p:messages id="curmsg" showDetail="true" rendered="true" closable="true"/>   
        </div>
        <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:head>
            <title>#{userData.userDDs['ADMIN_UNIT_REPORT']}</title>
        </h:head>

        <h:body> 
            <h:form id="form" target="_blank" class='formmargin'  dir="#{userData.dir}">



                <p:fieldset style="position: relative" legend="#{userData.userDDs['ADMIN_UNIT_REPORT']}">



                    <div class="firstset">

                        <div class="ui-g">

                            <div class="ui-g-6 ui-xl-6">
                                  <div class="ui-g-12 ui-xl-12">

                                    <div class="ui-g-6 ui-xl-6">
                                        <p:autoComplete class="adminunitauto" id="ADMIN_UNIT_FROM" 
                                                        dropdown="true"
                                                        converter="#{adminUnitMBean.glAdminUnitConverter}"
                                                        value="#{adminUnitMBean.adminUnitSearchBean.unitCodeFrom}"

                                                        var="admin"
                                                        itemLabel="#{admin}" 
                                                        itemValue="#{admin}" 
                                                        forceSelection="true" 
                                                        completeMethod="#{adminUnitMBean.completeAdminUnit}" >
                                        </p:autoComplete>
                                    </div>
                                    <div class="ui-g-6 ui-xl-6">
                                        <p:outputLabel style="width: 76px;" value="#{userData.userDDs['CODE_FROM']}"/>

                                    </div>
                                  </div>


                                <div class="ui-g-12 ui-xl-12">

                                    <div class="ui-g-6 ui-xl-6">
                                        <p:autoComplete class="adminunitauto" id="ADMIN_UNIT_TO" 
                                                        dropdown="true"
                                                        converter="#{adminUnitMBean.glAdminUnitConverter}"
                                                        value="#{adminUnitMBean.adminUnitSearchBean.unitCodeTo}"

                                                        var="admin"
                                                        itemLabel="#{admin}" 
                                                        itemValue="#{admin}" 
                                                        forceSelection="true" 
                                                        completeMethod="#{adminUnitMBean.completeAdminUnit}" >
                                        </p:autoComplete>
                                    </div>
                                    <div class="ui-g-6 ui-xl-6">
                                        <p:outputLabel style="width: 76px;" value="#{userData.userDDs['CODE_TO']}" />

                                    </div>
                                </div>
                            </div>



                            <div class="ui-g-6 ui-xl-6">
                                  <div class="ui-g-12 ui-xl-12">

                                    <div class="ui-g-6 ui-xl-6">
                                        <p:inputText class="adminunitintext" value="#{adminUnitMBean.adminUnitSearchBean.unitName}" />

                                    </div>
                                    <div class="ui-g-6 ui-xl-6">
                                        <p:outputLabel style="" class="adminunitoutlab" value="#{userData.userDDs['UNIT_NAME']}"/>

                                    </div>
                                </div>
                            </div>




                        </div>
                    </div>

                    <h:panelGrid class="col-md-12 centerButtons"  columns="1" style="margin-top: 2%">
                        <h:panelGroup>


                            <p:commandButton class="searchButton"  
                                             id="searchA"
                                             value="#{userData.userDDs['SEARCH']}"
                                             action="#{adminUnitMBean.search()}" 
                                             update="adminUnitTable" />

                            <p:commandButton class="newButton" 
                                             id="newN"
                                             value="#{userData.userDDs['NEW']}"  
                                             update="adminUnitTable" />
                            <p:commandButton class="printButton"
                                             ajax="false" 
                                             value="#{userData.userDDs['PRINT']}"  actionListener="#{adminUnitMBean.exportPDF}" />
                            <h:commandLink  class="sdcreenimg">  
                                <p:graphicImage name="/img/excel.jpg" width="24"/>  
                                <p:dataExporter type="xls"
                                                target="adminUnitTable" 
                                                fileName="الوحدات الأدارية"
                                                postProcessor="#{adminUnitMBean.postProcessXLS}" />  
                            </h:commandLink> 
                        </h:panelGroup>
                    </h:panelGrid>

                    <p:blockUI block="form" trigger="searchA  newN" animate="true" >

                        <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                    </p:blockUI> 

                </p:fieldset>

                <p:fieldset>

                    <p:dataTable  id="adminUnitTable" 
                                  paginator="true"
                                  rows="20"
                                  value="#{adminUnitMBean.allAdminUnitsReport}" 
                                  var="admin" 
                                  widgetVar="adminUnitReport">

                        <f:facet name="header">


                            <p:outputPanel>
                                <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                                <p:inputText id="globalFilter" onkeyup="PF('adminUnitReport').filter()" style="width:150px" />
                            </p:outputPanel>

                        </f:facet>

                        <p:column style="width: 10vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px"  
                                  headerText="#{userData.userDDs['UNIT_CODE']}"

                                  filterBy="#{admin.code}" 
                                  filterMatchMode="contains" 
                                  sortBy="#{admin.code}"
                                  filterable="false">
                            <h:outputText value="#{admin.code}" style="font-size: 1.5vh"/>
                        </p:column>

                        <p:column style="width: 28vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px"  
                                  headerText="#{userData.userDDs['UNIT_NAME']}"

                                  filterBy="#{admin.name}" 
                                  filterMatchMode="contains" 
                                  sortBy="#{admin.name}"
                                  filterable="false">

                            <h:outputText value="#{admin.name}" style="font-size: 1.5vh"/>
                        </p:column>


                        <p:column  style="width: 24vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px"  
                                   headerText="#{userData.userDDs['UNIT_PARENT']}"

                                   filterBy="#{admin.parentName}" 
                                   filterMatchMode="contains" 
                                   sortBy="#{admin.parentName}"
                                   filterable="false">

                            <h:outputText value="#{admin.parentName}" style="font-size: 1.5vh"/>
                        </p:column>

                        <p:column style="width: 9vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px" 
                                  headerText="#{userData.userDDs['LEVEL']}"

                                  filterBy="#{admin.level}" 
                                  filterMatchMode="contains" 
                                  sortBy="#{admin.level}"
                                  filterable="false">

                            <h:outputText value="#{admin.level}" style="font-size: 1.5vh"/>
                        </p:column>

                        <p:column style="width: 7vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px"  
                                  headerText="#{userData.userDDs['STATUS']}"

                                  filterBy="#{admin.status}" 
                                  filterMatchMode="contains" 
                                  sortBy="#{admin.status}"
                                  filterable="false">

                            <h:outputText value="#{admin.status}" style="font-size: 1.5vh"/>
                        </p:column>
                    </p:dataTable>
                </p:fieldset>
            </h:form>
        </h:body>
    </ui:define>
</ui:composition>
