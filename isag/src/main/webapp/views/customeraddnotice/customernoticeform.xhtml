<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"

                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">
        <div class="col-xs-12"> 
            <p:messages id="curmsg" showDetail="true" rendered="true" closable="true"/>   
        </div>
        <h:form class='formmargin' id="form"  enctype="multipart/form-data"  dir="#{userData.dir}">


            <p:fieldset legend="#{userData.userDDs['ADD/DISC_NOTIFI']}">

                <div  id="firstLine" class="ui-g-12 ui-g-nopad">

                    <div class="ui-g">

                        <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <h:outputLabel   style="width:59.5%!important"  value="#{invNoticeFormMB.invNoticeEntity.serial}"/>

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 85px;" value="#{userData.userDDs['NUMB']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:fieldset  style="width: 68%;border-radius: 5px">
                                        <p:selectOneRadio  id="console"  value ="#{invNoticeFormMB.invNoticeEntity.type}" >
                                            <f:selectItem itemLabel="#{userData.userDDs['ADD_NOTIF']}" itemValue="0" />
                                            <f:selectItem itemLabel="#{userData.userDDs['DISC_NOTIF']}" itemValue="1" />
                                        </p:selectOneRadio>
                                    </p:fieldset>
                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:autoComplete style="width:35%!important" 
                                                    dropdown="true"
                                                    required="true"
                                                    converter="#{invNoticeFormMB.organizationSiteConvertor}"
                                                    value="#{invNoticeFormMB.invNoticeEntity.organizationSiteId}"

                                                    var="supplier"
                                                    itemLabel="#{supplier}" 
                                                    itemValue="#{supplier}" 
                                                    forceSelection="true" 
                                                    completeMethod="#{invNoticeFormMB.completeOrganizationSite}">
                                        <p:ajax update="@form"
                                                process="@form"
                                                event="itemSelect"
                                                listener="#{invNoticeFormMB.loadInstContract}" />
                                    </p:autoComplete>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 85px;" value="#{userData.userDDs['CORRES_CUSTO']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:autoComplete style="width: 35%" id="GlAccount_ID_to" 

                                                    dropdown="true"
                                                    converter="#{invNoticeFormMB.glAccountConverter}"
                                                    value="#{invNoticeFormMB.invNoticeEntity.accountId}"
                                                    var="account"
                                                    itemLabel="#{account}" 
                                                    itemValue="#{account}" 
                                                    forceSelection="false" 
                                                    completeMethod="#{invNoticeFormMB.completeGlAccount}" >
                                    </p:autoComplete>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 85px;" value="#{userData.userDDs['ACCOUNT_NO']}" />

                                </div>
                            </div>
                        </div>



                        <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:calendar required="true"
                                                value="#{invNoticeFormMB.invNoticeEntity.date}"
                                                pattern="dd/MM/yyyy" 
                                                style="width:50%"/>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 50px" value="#{userData.userDDs['DATEE']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText  style="width:35%!important"  required="true" value="#{invNoticeFormMB.invNoticeEntity.amount}" />

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 50px" value="#{userData.userDDs['AMOUNT']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText  style="width:35%!important" value="#{invNoticeFormMB.invNoticeEntity.remarks}" />

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 50px" value="#{userData.userDDs['REMARK']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:selectBooleanCheckbox value="#{invNoticeFormMB.installment}" style ="margin-right: 2%">
                                        <p:ajax   update="form" />
                                    </p:selectBooleanCheckbox>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 80px;font-size: 16px!important;"  value="#{userData.userDDs['INSTALLMENT']}"/>

                                </div>
                            </div>
                        </div>

















                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup rendered="#{invNoticeFormMB.installment}">
                                <h:panelGroup   id="instText">
                                    <p:outputLabel style="width: 80px;font-size: 16px!important;"  value="#{userData.userDDs['PREMIUMS']}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:autoComplete style="width:75%!important"
                                                    dropdown="true"
                                                    converter="#{invNoticeFormMB.instContractConverter}"
                                                    value="#{invNoticeFormMB.invNoticeEntity.instContract}"
                                                    var="instContract"
                                                    itemLabel="#{instContract}" 
                                                    itemValue="#{instContract}"
                                                    forceSelection="true" 
                                                    completeMethod="#{invNoticeFormMB.completInstContract}"
                                                    >
                                        <p:ajax update="@form"
                                                event="itemSelect"
                                                listener="#{invNoticeFormMB.updateInstContractDetails}" />
                                    </p:autoComplete>
                                </h:panelGroup> 
                            </h:panelGroup>
                        </div>

                        <div class="ui-g-12 ui-md-6">

                            <h:panelGroup rendered="#{invNoticeFormMB.installment}">
                                <h:panelGroup   id="instDetailText" 
                                                >
                                    <p:outputLabel style="width: 80px;font-size: 16px!important;"  value="#{userData.userDDs['PREM_DETAILS']}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:autoComplete style="width:75%!important"
                                                    dropdown="true"
                                                    converter="#{invNoticeFormMB.instTransactionTempConverter}"
                                                    value="#{invNoticeFormMB.invNoticeEntity.instTransactionTemp}"
                                                    var="instTransactionTemp"
                                                    itemLabel="#{instTransactionTemp}" 
                                                    itemValue="#{instTransactionTemp}"
                                                    forceSelection="true" 
                                                    completeMethod="#{invNoticeFormMB.completInstTransactionTemp}" 
                                                    >
                                        <p:ajax update="@form"
                                                event="itemSelect"
                                                listener="#{invNoticeFormMB.updateValueOfInstallment}" />
                                    </p:autoComplete>
                                </h:panelGroup> 
                            </h:panelGroup>
                        </div>
                        
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 90px;margin-right: 6%; margin-top: 3%;" value="مسمى الاشعار"/>
                                </h:panelGroup> 

                                <h:panelGroup>
                                    <p:selectOneMenu id="custFrom" style="width: 35%;" value="#{invNoticeFormMB.invNoticeEntity.noticeNaming}" 
                                                     converter="#{invNoticeFormMB.symbolDTOConverter}">
                                        <f:selectItem itemLabel="اختر" itemValue="" />
                                        <f:selectItems value="#{invNoticeFormMB.symbolDtoList}" var="noticeNaming" itemValue="#{noticeNaming}" itemLabel="#{noticeNaming}" />
                                    </p:selectOneMenu>
                                </h:panelGroup> 
                            </h:panelGroup>
                        </div>
                        
                    </div>
                </div>

                <h:panelGrid  class="col-md-12" columns="1">      

                    <h:panelGroup class="centerButtons"> 
                        <p:commandButton  class="saveButton"
                                          id="saveB" 
                                          title="#{userData.userDDs['SAVE']}" 
                                          value="#{userData.userDDs['SAVE']}" 
                                          action="#{invNoticeFormMB.save()}"
                                          update="form curmsg"/>

                        <p:commandButton  class="newButton" 
                                          id="newN"
                                          ajax="false"
                                          value="#{userData.userDDs['NEW']}" 
                                          title="#{userData.userDDs['NEW']}"
                                          onclick="form.target = ''" 
                                          actionListener="#{invNoticeFormMB.reset()}"/>


                        <p:commandButton  class="closeButton" 
                                          id="cancel"
                                          title="#{userData.userDDs['BACK']}"
                                          value="#{userData.userDDs['BACK']}" 
                                          action="#{invNoticeFormMB.exit()}"
                                          update="@form"/>

                        <p:blockUI block="form" trigger="saveB" animate="true" >

                            <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                        </p:blockUI> 
                    </h:panelGroup>

                </h:panelGrid>       

            </p:fieldset>




        </h:form>
    </ui:define>
</ui:composition>
