<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">

        <style>

            .ui-widget-content .ui-state-default, .ui-widget-header .ui-state-default {
                border: 1px solid #c5dbec;
                background:#fff;

            }
            .ui-dialog {
                position: absolute !important;
                left: 1vw!important;
                top: 25vh!important;}
            </style>
            <f:event listener="#{userData.authorize}" type="preRenderView" />
            <h:form id="form" dir="#{userData.dir}" class='formmargin' enctype="multipart/form-data" >
            <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                  margin-top: 24%;
                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;"
                                  icon="fa fa-fw fa-home"
                                  title="#{userData.userDDs['HOME']}"
                                  class="smhomeButton" 
                                  action="exit" />

            </div>
            <div >
                <p:messages id="curmsg" autoUpdate="true" showDetail="true" rendered="true" closable="true"/>   
            </div>

            <p:fieldset legend="#{userData.userDDs['STORE_INVENTORY']}"> 

                <div  id="firstSegment" class="ui-g-12 ui-g-nopad">

                    <div class="ui-g">
                        <h:panelGroup id="test">

                            <div class="ui-g-12 ui-md-6">
                                <h:panelGroup>

                                    <h:panelGroup>
                                        <p:outputLabel style="width: 95px; margin-right: 6%;" value="#{userData.userDDs['DATEE']}*"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:calendar id="dateFrom" 

                                                    value="#{invStripFormMB.invInvoiceDTO.date}"
                                                    pattern="dd/MM/yyyy"
                                                    style="width:50%!important"/>
                                    </h:panelGroup>

                                </h:panelGroup>
                            </div>

                            <div class="ui-g-12 ui-md-6">

                                <h:panelGroup>

                                    <p:outputLabel style="width: 95px;margin-right: 6%;" id="purchId" value="#{userData.userDDs['SERIAL']}" />
                                    <p:inputText style="width: 37%" 
                                                 id="purchIdVal" readonly="true"
                                                 value="#{invStripFormMB.invInvoiceDTO.serial}" />

                                </h:panelGroup>
                            </div>

                            <div class="ui-g-12 ui-md-6">
                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel style="width: 100px;margin-right: 6%;" value="#{userData.userDDs['DEPOSITORY']}"/>
                                    </h:panelGroup>

                                    <h:panelGroup>
                                        <p:autoComplete style="width:34%"  id="inventoryDTO" widgetVar="inventoryDTO"
                                                        dropdown="true"
                                                        converter="#{invStripFormMB.invInventoryDTOConverter}"
                                                        value="#{invStripFormMB.invInvoiceDTO.invInventoryId}"
                                                        var="inventoryDTO" 
                                                        itemLabel="#{inventoryDTO}" 
                                                        itemValue="#{inventoryDTO}" 
                                                        forceSelection="true" 
                                                        completeMethod="#{invStripFormMB.completeInventory}" >
                                        </p:autoComplete>
                                    </h:panelGroup>
                                </h:panelGroup>
                            </div>
                            
                            <div class="ui-g-12 ui-md-6">

                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel style="width: 95px; margin-right: 6%;" value="مستند الجرد"/>
                                    </h:panelGroup>

                                    <h:panelGroup>
                                        <p:inputText value="#{invStripFormMB.invInvoiceDTO.supplierInvoiceNumber}" 
                                                     style="width: 35%!important"/>
                                    </h:panelGroup>
                                </h:panelGroup>

                            </div>

                            <div class="ui-g-12 ui-md-12">

                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel style="width: 95px; margin-right: 3%;" value="#{userData.userDDs['NOTE']}"/>
                                    </h:panelGroup>

                                    <h:panelGroup>
                                        <p:inputText style="width:68%"  value="#{invStripFormMB.invInvoiceDTO.remarks}"
                                                     >
                                        </p:inputText>
                                    </h:panelGroup>
                                </h:panelGroup>
                            </div>
                        </h:panelGroup>
                    </div>
                </div>

            </p:fieldset>

                <p:fieldset  legend="ادخال الاصناف" id="glaccount"  style="margin-bottom:20px">
                <div id="glaccountloader" class="form-group col-md-12">

                    <p:fileUpload value="#{invStripFormMB.invItemFile}" mode="simple" onstart="disableChoosing()" 
                                  oncomplete="enableChoosing()" />
                </div>

                <div class="form-group col-md-12">
                    <p:commandButton id="btnglaccount"  actionListener="#{invStripFormMB.readInvItem()}" ajax="false" value="تحميل">
                        <f:ajax execute="@all" render="@form"/>
                        <p:ajax/>
                    </p:commandButton>
                </div>


            </p:fieldset>
                
                
            <p:fieldset id="fieldSetId" legend="#{userData.userDDs['STORE_INVENTORY']}"  style="margin:2% 0">


                <p:dataTable id="invPurchaseInvoiceDetailsTable"
                             widgetVar="invPurchaseInvoiceDetailsTable"
                             style="margin-bottom:20px"
                             var="invPurchaseInvoiceDetailsTable"
                             rowIndexVar="index"  rows="15"
                             dir="rtl" 
                             emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                             editable="true"
                             editMode="cell"
                             selectionMode="single" 
                             paginator="true" 
                             sortBy="#{1}"
                             rowKey="#{invPurchaseInvoiceDetailsTable.index}"
                             selection="#{invStripFormMB.invInvoiceDTO.invPurchaseInvoiceDetailsSelected}"
                             value="#{invStripFormMB.invInvoiceDTO.invPurchaseInvoiceDetailList}" >

                    <f:facet name="header" >
                        <p:commandButton  id="addnew"
                                          class="saddButton"
                                          icon="fa fa-plus"
                                          title="#{userData.userDDs['ADD']}" 

                                          actionListener="#{invStripFormMB.addInvDetail()}" 
                                          update=":form:fieldSetId"  
                                          oncomplete="PrimeFaces.focus('form:invPurchaseInvoiceDetailsTable:'+#{invStripFormMB.invInvoiceDTO.invPurchaseInvoiceDetailList.size()}+':invItemNameIn')"
                                          immediate="true"
                                          ajax="true"
                                          style="float:right"/>

                        <p:outputPanel>
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" onkeyup="PF('invPurchaseInvoiceDetailsTable').filter()" style="width:150px" />
                        </p:outputPanel>
                    </f:facet>

                    <p:column headerText="#" style="width: 4vh;text-align:center;border-radius: 0px" >
                        <h:outputText value="#{invPurchaseInvoiceDetailsTable.serial}"  />
                    </p:column>

                    <p:column style="width: 13vh;text-align: -webkit-auto;border-radius: 0px" id="itemName" headerText="#{userData.userDDs['ITEM']}" 
                              filterBy="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail}" 
                              filterMatchMode="contains" 
                              sortBy="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail}"
                              filterable="false">
                        <h:outputText 
                            rendered="#{invPurchaseInvoiceDetailsTable.isEdit}"
                            value="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail.name}"  />
                        <p:autoComplete id="invItemNameIn"  
                                        rendered="#{not invPurchaseInvoiceDetailsTable.isEdit}" 
                                        style="width:100%"
                                        converter="#{invStripFormMB.itemsBarcodesDetailsViewConverter}"
                                        value="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail}"
                                        maxResults="5"
                                        var="item"
                                        itemLabel="#{item}" 
                                        itemValue="#{item}" 
                                        forceSelection="true" 
                                        completeMethod="#{invStripFormMB.completeItemsDatas}" >
                            <p:ajax 
                                    event="itemSelect" listener="#{invStripFormMB.validateItems(invPurchaseInvoiceDetailsTable)}" />

                        </p:autoComplete>            
                    </p:column>
                                        
                    <p:column  style="width: 13vh;text-align: -webkit-auto;border-radius: 0px" id="actualQuantity"

                               filterBy="#{invPurchaseInvoiceDetailsTable.actualQuantity}" 
                               filterMatchMode="contains" 
                               sortBy="#{invPurchaseInvoiceDetailsTable.actualQuantity}"
                               filterable="false"
                               headerText="الفعلى">
                        <p:inputText id="actualValue"
                                     value="#{invPurchaseInvoiceDetailsTable.actualQuantity}" style="width: 95%" >
                            <p:ajax listener="#{invStripFormMB.validateActulQuantityColum(invPurchaseInvoiceDetailsTable)}" />
                        
                        </p:inputText>

                    </p:column>
                    
                    
                    <p:summaryRow>
                        <p:column />
                        <p:column />
                         <p:column />
                          <p:column />
                    </p:summaryRow>

                    <p:column 
                        style="width: 13vh;text-align: center;border-radius: 0px" 
                        headerText="#{userData.userDDs['TRANSACTION']}"
                        rendered="#{invStripFormMB.columnRender}"
                        >

                        <p:commandButton  id="b7" icon="fa fa-plus" 
                                          class="saddbuttonins" style="color: #fff!important;background-color: #00BCD4"
                                          title="#{userData.userDDs['ADD']}" 

                                          actionListener="#{invStripFormMB.addInvDetail()}" 
                                          update=":form:fieldSetId"  
                                          immediate="true"
                                          oncomplete="PrimeFaces.focus('form:invPurchaseInvoiceDetailsTable:'+#{invStripFormMB.invInvoiceDTO.invPurchaseInvoiceDetailList.size()}+':invItemNameIn')"
                                          ajax="true" />

                        <p:commandButton  update="invPurchaseInvoiceDetailsTable  "
                                          title="#{userData.userDDs['DELETE']}" 
                                          class="sdeleteButtons" style="color: #fff!important;background-color: red"

                                          action="#{invStripFormMB.deleteInvDetail(invPurchaseInvoiceDetailsTable)}"
                                          icon="fa fa-remove" >
                            <p:confirm header="#{userData.userDDs['COFIGRATION']}" 
                                       message="#{userData.userDDs['ARE_YOU_SURE']}"
                                       icon="ui-icon-alert" />
                        </p:commandButton>

                        <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                            <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                            <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                        </p:confirmDialog>
                    </p:column >

                </p:dataTable>

                <h:panelGrid  class="col-md-12" columns="1"  style="margin-top:2%">

                    <h:panelGroup  class="centerButtons">

                        <p:commandButton  id="saveB" 
                                          class="saveButton"
                                          title="#{userData.userDDs['SAVE']}"
                                          value="#{userData.userDDs['SAVE']}" 

                                          style="" 
                                          action="#{invStripFormMB.save()}"
                                          update="@form"/>

                        <p:commandButton 
                            id="newN"
                            ajax="false"
                            style=""
                            value="#{userData.userDDs['NEW']}" 
                            class="newButton"
                            onclick="form.target = ''" 
                            actionListener="#{invStripFormMB.reset()}"/>

                        
                        
                        <p:commandButton  class="closeButton" 
                                          id="cancel" 
                                          title="#{userData.userDDs['BACK']}" 
                                          value="#{userData.userDDs['BACK']}" 
                                          style=""  
                                          immediate="true"
                                          action="#{invStripFormMB.exit()}" 
                                          update="@form"/>

                        <h:commandLink  style="float:left" class="sdcreenimg">  
                            <p:graphicImage name="/img/excel.jpg" width="24" style='margin-right:25%;'/>  
                            <p:dataExporter type="xls"
                                            target="invPurchaseInvoiceDetailsTable" 
                                            fileName="جرد المخازن" preProcessor="#{invStripFormMB.preProcessXLS()}"
                                            postProcessor="#{invStripFormMB.postProcessXLS}" />  
                        </h:commandLink>

                        <p:blockUI block="form" trigger="saveB" animate="true" >

                            <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                        </p:blockUI> 


                    </h:panelGroup>

                </h:panelGrid>
            </p:fieldset>
        </h:form>


        <script>

            document.addEventListener("keydown", function (e) {
                console.log(e.which);
                if (e.which === 13) {
                    e.preventDefault();
                    return false;
                }
                ;
            });

        </script>
    </ui:define>
</ui:composition>
