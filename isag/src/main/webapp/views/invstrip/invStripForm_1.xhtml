<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/newTemplate.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form id="form"  enctype="multipart/form-data"  dir="#{userData.dir}" class='formmargin'>
            <div style=" position: absolute;left: 20px"> 

                    <p:commandButton  style="z-index: 2;
                                      margin-top: 24%;
                                      color: #035c70!important; 
                                      background-color: #223238!important;
                                      border: 1px solid #22323a!important;
                                      background: #22323a 50% 50% repeat-x!important;"
                                      icon="fa fa-fw fa-home"
                                      title="#{userData.userDDs['HOME']}"
                                      class="smhomeButton" 
                                      action="exit" />
                       
                </div>
            <p:fieldset  legend="#{userData.userDDs['STORE_INVENTORY']}">
                <div >
                    <p:messages id="curmsg" 
                                autoUpdate="true"
                                showDetail="true" 
                                rendered="true" closable="true"/>   
                </div>


                <div  id="firstLine" class="ui-g-12 ui-g-nopad">
                    <div class="ui-g">

                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel  style="width: 65px;margin-right: 6%;" value="رقم الحجز"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:inputText  style="width: 35%!important" readonly="true"  id="serialNo" value="#{invStripFormMB1.invStripEntity.serial}"/>
                                </h:panelGroup>

                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>

                                <h:panelGroup>
                                    <p:outputLabel  style="width: 70px" value="#{userData.userDDs['DATE']}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:calendar  style="width: 35%!important" required="true"
                                                 requiredMessage="يجب ادخال تاريخ"  value="#{invStripFormMB1.invStripEntity.stripDate}" pattern="dd/MM/yyyy" />
                                </h:panelGroup>

                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 70px;margin-right: 6%;" value="المخزن"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:autoComplete style="width:34%" 
                                                    dropdown="true"
                                                    readonly="#{invStripFormMB1.invStripEntity.id != null}"
                                                    converter="#{invStripFormMB1.invInventoryConverter}"
                                                    value="#{invStripFormMB1.invStripEntity.invInventory}"
                                                    required="true"
                                                    requiredMessage="يجب اختيار مخزن"
                                                    var="inventory"
                                                    itemLabel="#{inventory}" 
                                                    itemValue="#{inventory}" 
                                                    forceSelection="true" 
                                                    completeMethod="#{invStripFormMB1.completInventory}" >

                                        <p:ajax update="form curmsg"
                                                event="change"
                                                listener="#{invStripFormMB1.fillItemMap()}" />
                                        <p:ajax update="form curmsg"
                                                event="itemSelect"
                                                listener="#{invStripFormMB1.fillItemMap()}" />

                                    </p:autoComplete>
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>

                                <h:panelGroup>
                                    <p:outputLabel style="width: 70px" value="مستند الجرد"/>
                                </h:panelGroup>
                                <h:panelGroup >
                                    <h:panelGroup>
                                        <p:inputText style="width: 35%!important"  id="stripDocument" value="#{invStripFormMB1.invStripEntity.stripDocument}" />
                                    </h:panelGroup>
                                </h:panelGroup>

                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-12">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel  style="width: 65px;margin-right: 3%;"  value="#{userData.userDDs['NOTE']}"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:inputText style="width: 65.5% !important;"  id="ad11" value="#{invStripFormMB1.invStripEntity.remark}" />
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>
                    </div>
                </div>


            </p:fieldset>
            <p:fieldset  style="margin-bottom:20px">
                <p:dataTable var="invStripTable"
                             widgetVar="invStripTable"
                             rowIndexVar="index"
                             rowKey="#{invStripTable}"
                             selectionMode="single"
                             selection="#{invStripFormMB1.invStripDetailEntitySelection}"
                             dir="rtl"
                             sortBy="#{1}"
                             emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                             editable="true"
                             editMode="cell"
                             value="#{invStripFormMB1.invStripDetailEntityList}"
                             id="invStripTable"
                             rows="20"
                             paginator="true">

                    <f:facet name="header" class="col-md-12">
                       

                        <p:outputPanel>
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" onkeyup="PF('invStripTable').filter()" style="width:150px" />
                        </p:outputPanel>
                    </f:facet>


                    <p:column style="width: 8vh;text-align: -webkit-auto;font-size: 1.8vh;border-radius: 0px"   id="serail" 
                              headerText="#{userData.userDDs['SERIAL']}">
                        <h:outputText value="#{invStripTable.serial}"  />
                    </p:column>

                    <p:column style="width: 10vh;text-align: -webkit-auto;font-size: 1.8vh;border-radius: 0px" 
                              id="itemNumber" headerText="#{userData.userDDs['ITEM_NUMBER']}"

                              filterBy="#{invStripTable.itemCode}" 
                              filterMatchMode="contains" 
                              sortBy="#{invStripTable.itemCode}"
                              filterable="false">
                        <h:outputText value="#{invStripTable.itemCode}" />
                    </p:column>

                    <p:column style="width: 15vh;text-align: -webkit-auto;font-size: 1.8vh;border-radius: 0px"  
                              id="itemName" headerText="#{userData.userDDs['ITEM_NAME']}"

                              filterBy="#{invStripTable.itemName}" 
                              filterMatchMode="contains" 
                              sortBy="#{invStripTable.itemName}"
                              filterable="false">
                        <h:outputText value="#{invStripTable.itemName}" />
                    </p:column>

                    <p:column  style="width: 12vh;text-align: -webkit-auto;font-size: 1.8vh;border-radius: 0px"
                               id="Quantity" headerText="جرد فعلى"

                               filterBy="#{invStripTable.actualAmount}" 
                               filterMatchMode="contains" 
                               sortBy="#{invStripTable.actualAmount}"
                               filterable="false">

                        <p:inputText id="QuantityT" value="#{invStripTable.actualAmount}"
                                     rendered="#{invStripFormMB1.invStripEntity.id eq null}"
                                     style="width:95%">
                            <p:ajax listener="#{invStripFormMB1.updateDifference(invStripTable)}" 
                                    event="blur"
                                    update="difference totalQuantity totalNet"/>
                        </p:inputText>

                        <p:outputLabel value="#{invStripTable.actualAmount}" 
                                       rendered="#{invStripFormMB1.invStripEntity.id != null}" style="width:95%"/>

                    </p:column>


                    <p:column style="width: 10vh;text-align: -webkit-auto;font-size: 1.8vh;border-radius: 0px" id="balance" headerText="رصيد دفترى"

                              filterBy="#{invStripTable.bookBalance}" 
                              filterMatchMode="contains" 
                              sortBy="#{invStripTable.bookBalance}"
                              filterable="false">
                        <p:outputLabel id="balanceT" value="#{invStripTable.bookBalance}"  style="width:95%"/>
                    </p:column>

                    <p:column style="width: 6vh;text-align: -webkit-auto;font-size: 1.8vh;border-radius: 0px" id="Total" headerText="الفرق"

                              filterBy="#{invStripTable.difference}" 
                              filterMatchMode="contains" 
                              sortBy="#{invStripTable.difference}"
                              filterable="false">
                        <p:outputLabel id="difference" value="#{invStripTable.difference}" />
                    </p:column>

                    <p:summaryRow>
                        <p:column colspan="3" style="text-align:right"  >
                            <h:outputText style="text-align:right" value="#{userData.userDDs['TOTAL']}  :" />
                        </p:column>
                        <p:column>
                            <h:outputText id="totalQuantity" value="#{invStripFormMB1.totalQuantity}"/>
                        </p:column>
                        <p:column>
                            <h:outputText id="totalNet" value="#{invStripFormMB1.totalBalance}"/>
                        </p:column>

                        <p:column />
                        <p:column />
                    </p:summaryRow>

                    <p:column style="width: 6vh;text-align: center;font-size: 1.8vh;border-radius: 0px" exportable="false" >
                        <p:commandButton class="sdeleteButtons" update="invStripTable" title="#{userData.userDDs['DELETE']}"
                                         disabled="#{invStripFormMB1.invStripEntity.id != null}"
                                         action="#{invStripFormMB1.deleteInvStripDetail}" icon="fa fa-remove" >
                            <f:setPropertyActionListener value="#{invStripTable}"
                                                         target="#{invStripFormMB1.invStripDetailEntitySelection}"/>
                            <p:confirm header="#{userData.userDDs['COFIGRATION']}"
                                       message="#{userData.userDDs['ARE_YOU_SURE']}"
                                       icon="ui-icon-alert" />
                        </p:commandButton>

                        <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                            <p:commandButton title="#{userData.userDDs['YES']}" type="button"
                                             styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                            <p:commandButton title="#{userData.userDDs['NO']}" type="button" 
                                             styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                        </p:confirmDialog>
                    </p:column >

                </p:dataTable>

                <h:panelGroup class="centerButtons"  style="margin-top: 2%">
                    
                    <p:commandButton class="saveButton" id="saveB" 
                                     title="#{userData.userDDs['SAVE']}"
                                     disabled="#{invStripFormMB1.invStripEntity.id != null}"
                                     value="#{userData.userDDs['SAVE']}"
                                     style=""
                                     action="#{invStripFormMB1.save()}" 
                                     update="@form"/>
                    
                    <p:commandButton  class="newButton"
                                      id="newN"
                                      ajax="false"
                                      style=""
                                      title="#{userData.userDDs['NEW']}"
                                      value="#{userData.userDDs['NEW']}" 
                                      onclick="form.target = ''" 
                                      actionListener="#{invStripFormMB1.reset()}"/>
                    
                    <p:commandButton class="closeButton" 
                                     id="cancel" 
                                     title="#{userData.userDDs['BACK']}" 
                                     value="#{userData.userDDs['BACK']}"
                                     style="" 
                                     action="#{invStripFormMB1.exit()}" 
                                     update="@form"/>
                    <h:commandLink style="float: left;margin-right: 4px" class="sdcreenimg">  
                        <p:graphicImage name="/img/excel.jpg" width="24"/>  
                        <p:dataExporter type="xls"
                                        target="invStripTable" 
                                        fileName="جرد المخازن"
                                        postProcessor="#{invStripFormMB1.postProcessXLS}" />  
                    </h:commandLink>

                    <p:blockUI block="form" trigger="saveB" animate="true" >

                        <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                    </p:blockUI> 
                </h:panelGroup>

            </p:fieldset>
        </h:form>
    </ui:define>
</ui:composition>
