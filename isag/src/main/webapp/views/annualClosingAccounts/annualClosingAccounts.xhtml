<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />

        <div class="col-xs-12">
            <p:messages autoUpdate="true"  showDetail="true" closable="true" rendered="true" />
        </div>
        <h:form id="form" dir="#{userData.dir}" class='formmargin'>

            <p:fieldset legend="#{userData.userDDs['ANNUAL_CLOSING_ACCOUNT']}" >
                <div class="ui-g-12 ui-g-nopad" id="pnl">
                    <div class="ui-g">

                        <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:selectOneMenu class="selectonefinance" style="width: 35% !important;" value="#{annualClosingAccountsMB.glYearSelection}" converter="#{annualClosingAccountsMB.glYearConverter}"   >
                                        <f:selectItem itemLabel="#{userData.userDDs['CHOOSE']}"  itemValue="" />
                                        <f:selectItems value="#{annualClosingAccountsMB.glYearList}"  var="year" itemLabel="#{year.name}" itemValue="#{year}"/>
                                        <p:ajax listener="#{annualClosingAccountsMB.loadData()}" update="form" />
                                    </p:selectOneMenu>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel class="financeYear" style="width: 145px;" value="#{userData.userDDs['FINANCE_YEAR']}"/>

                                </div>

                            </div>


                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 60%!important"  value="  #{annualClosingAccountsMB.netProfit}"  />

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel  style="width: 135px"  value="#{userData.userDDs['PERIOD_NET_INCOME']}"/>

                                </div>

                            </div>

                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:calendar  style="width: 80%!important" 
                                                 id="dateFrom" 
                                                 value="#{annualClosingAccountsMB.dateOfOpeneingJournal}" 
                                                 pattern="dd/MM/yyyy" >
                                        <p:ajax listener="#{annualClosingAccountsMB.checkDate(true)}" 
                                                event="dateSelect" 
                                                update="dateFrom"/>
                                    </p:calendar>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel  style="width: 131px;"  value="#{userData.userDDs['DATE_OPENING_ENTRY']}"/>

                                </div>

                            </div>


                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 60%!important"  value="  #{annualClosingAccountsMB.netProfit}"  />

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel  style="width: 135px"  value="#{userData.userDDs['PERIOD_NET_INCOME']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:selectOneMenu class="selectonefinance" style="width: 35% !important;" value="#{annualClosingAccountsMB.glYearSelection}" converter="#{annualClosingAccountsMB.glYearConverter}"   >
                                        <f:selectItem itemLabel="#{userData.userDDs['CHOOSE']}"  itemValue="" />
                                        <f:selectItems value="#{annualClosingAccountsMB.glYearList}"  var="year" itemLabel="#{year.name}" itemValue="#{year}"/>
                                        <p:ajax listener="#{annualClosingAccountsMB.loadData()}" update="form" />
                                    </p:selectOneMenu>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel  style="width: 135px;" value="#{userData.userDDs['FINANCE_YEAR']}"/>

                                </div>
                            </div>
                        </div>

                        <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText  style="width: 60%!important;"  value="#{annualClosingAccountsMB.journalSerial}">
                                        <p:ajax event="blur" listener="#{annualClosingAccountsMB.fetchTheGneralJounralRow}"  />
                                    </p:inputText>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 112px"  value="#{userData.userDDs['ENTER_ENTRY_SERIAL']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:selectBooleanCheckbox value="#{annualClosingAccountsMB.journalExist}" style ="margin-right: 2%">
                                        <p:ajax   update="@form" />
                                    </p:selectBooleanCheckbox>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel  value="#{userData.userDDs['IS_OPEN_ENTRY']}"
                                                    />
                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel  value="#{annualClosingAccountsMB.nextOpeningYear}"  />

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel   style="width: 135px"  value="#{userData.userDDs['YEAR_OPEN']}"/>

                                </div>
                            </div>

                        </div>




                    </div>

                    </div>

                    <h:panelGrid class="col-md-12 centerButtons" columns="1">

                        <h:panelGroup> 

                            <p:commandButton 
                                class="saveButton"
                                action="#{annualClosingAccountsMB.prepareGeneralJournalHeadAndDetails}"
                                rendered="#{userData.userScreens['annualClosingAccounts'].add or userData.isAdmin}"
                                style=""
                                id="saveB"
                                value="#{userData.userDDs['SAVE']}"
                                update="@form"
                                disabled="#{annualClosingAccountsMB.glYearSelection.openning eq 1}"/>


                            <p:commandButton class="closeButton" 
                                             title="#{userData.userDDs['BACK']}" 
                                             immediate="true" 
                                             value="#{userData.userDDs['BACK']}" 
                                             style=""
                                             action="exit"   />
                        </h:panelGroup> 


                    </h:panelGrid>

                    <p:remoteCommand name="onCellEdit"  update="accountsDetails" />



                    <p:blockUI block="form" trigger="saveB " animate="true" >

                        <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                    </p:blockUI>

            </p:fieldset>

            <p:fieldset>

                <p:dataTable 
                    id="accountsDetails" 
                    dir="#{userData.dir}" 
                    value="#{annualClosingAccountsMB.annualClosingAccountsBeanList}"
                    var="annual"
                    rowIndexVar="index" 
                    paginator="true" 
                    editable="true"
                    editMode="cell"
                    sortBy="#{1}"
                    selectionMode="single"
                    selection="#{annualClosingAccountsMB.annualClosingAccountsBeanSelection}"
                    widgetVar="annual"
                    rowKey="#{annual}"
                    emptyMessage="#{userData.userDDs['EMPTY_TABLE']}" >


                    <f:facet name="header" class="col-md-12">

                        <p:commandButton   class="saddButton" icon="fa fa-plus" 
                                           style="float: left;color: #FFFFFF!important;"     
                                           title="#{userData.userDDs['ADD']}" 
                                           action="#{annualClosingAccountsMB.addClosingAccounts()}"
                                           id="plus"
                                           update="accountsDetails"
                                           disabled="#{annualClosingAccountsMB.glYearSelection.openning eq 1}"
                                           ajax="true"
                                           rendered="#{userData.userScreens['annualClosingAccounts'].add or userData.isAdmin}"
                                           />



                        <p:outputPanel >
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" a:autofocus="true"
                                         onkeyup="PF('closetable').filter()" style="width:150px" />
                        </p:outputPanel>
                    </f:facet>

                    <p:ajax event="cellEdit" listener="#{annualClosingAccountsMB.onCellEdit}" />
                    <p:column style="width: 5vh;font-size: 1.5vh;border-radius: 0px"  id="serail" headerText="#">
                        <h:outputText value="#{index + 1}"  />
                    </p:column> 
                    <p:column style="width: 27vh;font-size: 1.5vh;border-radius: 0px;" headerText="#{userData.userDDs['ACCOUNT_NAME']}" 

                              filterBy="#{annual.account.name}" 
                              filterMatchMode="contains" 
                              sortBy="#{annual.account.name}"
                              filterable="false">
                        <p:cellEditor>
                            <f:facet name="output">
                                <p:outputLabel value="#{annual.account.name}"/>
                            </f:facet>
                            <f:facet name="input">
                                <p:autoComplete style="width: 95%" id="GlAccount_ID" 
                                                dropdown="true"
                                                converter="#{annualClosingAccountsMB.accountConverter}"
                                                value="#{annual.account}"
                                                var="p"
                                                itemLabel="#{p}" 
                                                itemValue="#{p}" 
                                                forceSelection="false" 
                                                completeMethod="#{annualClosingAccountsMB.completeGlAccount}"
                                                rendered="#{ annualClosingAccountsMB.glYearSelection.openning eq null or annualClosingAccountsMB.glYearSelection.openning eq 0 }">
                                </p:autoComplete>
                                <h:outputText value="#{annual.account.name}" rendered="#{annualClosingAccountsMB.glYearSelection.openning eq 1}"/>
                            </f:facet>
                        </p:cellEditor>
                    </p:column>
                    <p:column style="width: 27vh;font-size: 1.5vh;border-radius: 0px" id="ratio" headerText="#{userData.userDDs['PERCENTAGE']}"

                              filterBy="#{annual.ratio}" 
                              filterMatchMode="contains" 
                              sortBy="#{annual.ratio}"
                              filterable="false">
                        <p:cellEditor>
                            <f:facet name="output">
                                <h:outputText  value="#{annual.ratio}"  />
                            </f:facet>
                            <f:facet name="input">
                                <p:inputText   style="width: 95%!important"
                                               value="#{annual.ratio}" 
                                               rendered="#{ annualClosingAccountsMB.glYearSelection.openning eq null or annualClosingAccountsMB.glYearSelection.openning eq 0 }">                                  
                                    <p:ajax event="blur" process="@this" listener="#{annualClosingAccountsMB.calculateAmountByRatioForList}" update="form"/>
                                </p:inputText>
                            </f:facet>
                        </p:cellEditor>
                    </p:column>
                    <p:column  style="width: 27vh;font-size: 1.5vh;border-radius: 0px" headerText="#{userData.userDDs['APPROPRIATION_NET_INCOME']}" id="amount" 
                               filterBy="#{annual.amount}" 
                               filterMatchMode="contains" 
                               sortBy="#{annual.amount}"
                               filterable="false">
                        <p:outputLabel  id="amount1" value="#{annual.amount}"  />
                    </p:column>
                    <p:columnGroup type="footer">
                        <p:row id="totalsum">
                            <p:column colspan="2" footerText=" #{userData.userDDs['NET_INCOME']} :  #{annualClosingAccountsMB.netProfit}" style="border-radius: 0px"/>
                            <p:column id="totalRatio" footerText="#{annualClosingAccountsMB.totalRetio}"  style="border-radius: 0px"/>
                            <p:column footerText=""  style="border-radius: 0px"/>
                            <p:column footerText=""  style="border-radius: 0px"/>
                        </p:row>
                    </p:columnGroup>
                    <p:column style="width: 8vh;text-align: center;font-size: 1.8vh;border-radius: 0px" headerText="#{userData.userDDs['TRANSACTION']}">
                        <p:commandButton class="scloseButtons" update="accountsDetails" title="#{userData.userDDs['DELETE']}"
                                         style="background-color: red;border-radius: 3px;"
                                         disabled="#{annualClosingAccountsMB.glYearSelection.openning eq 1}"
                                         action="#{annualClosingAccountsMB.deleteAll}" icon="fa fa-remove"
                                         rendered="#{userData.userScreens['annualClosingAccounts'].delete or userData.isAdmin}">
                            <f:setPropertyActionListener value="#{annual}" target="#{annualClosingAccountsMB.annualClosingAccountsBeanDeleteSelection}"/>
                        </p:commandButton>
                    </p:column>

                </p:dataTable>

            </p:fieldset>
        </h:form>

    </ui:define>
</ui:composition>
