<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="main.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content2">
        <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form  class='formmargin' id="form" dir="#{userData.dir}">
            <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                  margin-top: 24%;
                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;"
                                  icon="fa fa-fw fa-home"
                                  title="#{userData.userDDs['HOME']}"
                                  class="smhomeButton" 
                                  action="exit" />

            </div>
            <p:fieldset legend="بيانات العملاء المحتملين" >

                <div >
                    <p:messages id="curmsg" 
                                autoUpdate="true"
                                showDetail="true" 
                                rendered="true" closable="true"/>   
                </div>
                <div>
                    <p:dataTable 
                         id="organizationSiteTable"
                        draggableColumns="true"
                        var="organizationSiteTable" 
                        widgetVar="bTable" 
                        rowIndexVar="index" 
                        value="#{crmLeadsListMB.leadList}"    
                        rows="10"
                        paginator="true"
                        paginatorTemplate="{CurrentPageReport} {FirstPageLink}
                        {PreviousPageLink} {PageLinks} {NextPageLink}
                        {LastPageLink} {RowsPerPageDropdown}" 
                        emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                        >

                        <f:facet name="header" >
                            <p:commandButton  class="saddButton" icon="fa fa-plus" title="#{userData.userDDs['ADD']}" 
                                              id="addA"
                                              action="#{crmLeadsListMB.goToAdd()}" style="float:right"
                                              rendered="#{userData.userScreens['crmLeads'].add or userData.isAdmin}"/>

                            <p:blockUI block="form" trigger="addA" animate="true" >

                                <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                            </p:blockUI> 

                            <p:outputPanel  >
                                <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                                 <p:inputText id="globalFilter" a:autofocus="true" onkeyup="PF('bTable').filter()" style="width:150px" />
                            </p:outputPanel>
                        </f:facet>

                        <p:column style="width:13vh;font-size:1.8vh;text-align: right;border-radius: 0px "
                                  filterStyle="display:none"
                                  filterBy="#{organizationSiteTable.code}"
                                  filterMatchMode="contains" 
                                  headerText="#{userData.userDDs['CUSTOM_CODE']}"
                                  sortBy="#{organizationSiteTable.code}"  
                                  >
                            <p:outputLabel value="#{organizationSiteTable.code}" />
                        </p:column>

                        <p:column style="width:13vh;font-size:1.8vh;text-align: right;border-radius: 0px "
                                  filterStyle="display:none"
                                  filterBy="#{organizationSiteTable.name}"
                                  filterMatchMode="contains" 
                                  headerText="#{userData.userDDs['CUSTOM_NAME']}" sortBy="#{organizationSiteTable.name}" >
                            <p:outputLabel value="#{organizationSiteTable.name}" />
                        </p:column>
                        
                        <p:column style="width:15vh;font-size: 1.8vh;text-align: right;border-radius: 0px "
                                  filterStyle="display:none" 
                                  filterBy="#{organizationSiteTable.mobile}"
                                  filterMatchMode="contains" 
                                  headerText="الجوال"
                                  sortBy="#{organizationSiteTable.mobile}" 
                                  >
                            <p:outputLabel value="#{organizationSiteTable.mobile}" />
                        </p:column>
                        

                        <p:column style="width:10vh;font-size: 1.8vh;text-align: center;border-radius: 0px " headerText="#{userData.userDDs['TRANSACTION']}" >
                            <p:commandButton class="seditButtons" update="@form" icon="fa fa-fw fa-edit" style="background-color: #6a6967;border-radius: 3px;" 
                                             title="#{userData.userDDs['EDIT']}" action="#{crmLeadsListMB.goToEdit()}" rendered="#{userData.userScreens['customer'].edit or userData.isAdmin}">
                                <f:setPropertyActionListener value="#{organizationSiteTable.id}"  target="#{crmLeadsListMB.leadSelected}" />
                            </p:commandButton>
                            <p:commandButton  class="sdeleteButtons" update="@form" 
                                              icon="fa fa-remove" style="background-color: red;border-radius: 3px;"
                                              title="#{userData.userDDs['DELETE']}" 
                                              action="#{crmLeadsListMB.delete}"
                                              rendered="#{userData.userScreens['customer'].delete or userData.isAdmin}">
                                <f:setPropertyActionListener value="#{organizationSiteTable.id}"  target="#{crmLeadsListMB.leadSelected}" />
                                <p:confirm header="Confirmation" message="#{userData.userDDs['ARE_YOU_SURE']}" icon="ui-icon-alert" />
                            </p:commandButton>
                        </p:column>

                    </p:dataTable> 
                    <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                        <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                        <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                    </p:confirmDialog>
                </div>
            </p:fieldset>
        </h:form>
    </ui:define>
</ui:composition>
