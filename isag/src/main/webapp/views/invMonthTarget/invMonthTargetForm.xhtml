<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/newTemplate.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">

        <style>

            .ui-widget-content .ui-state-default, .ui-widget-header .ui-state-default {
                border: 1px solid #c5dbec;
                background:#fff;

            }
            .ui-dialog {
                position: absolute !important;
                left: 1vw!important;
                top: 25vh!important;}
            </style>
            <f:event listener="#{userData.authorize}" type="preRenderView" />
            <h:form id="form" dir="#{userData.dir}" class='formmargin'>
            <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                  margin-top: 24%;
                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;"
                                  icon="fa fa-fw fa-home"
                                  title="#{userData.userDDs['HOME']}"
                                  class="smhomeButton" 
                                  action="exit" />

            </div>
            <div >
                <p:messages id="curmsg" autoUpdate="true" showDetail="true" rendered="true" closable="true"/>   
            </div>

            <p:fieldset legend="المستهدف"> 

                <div  id="firstSegment" class="ui-g-12 ui-g-nopad">

                    <div class="ui-g">
                        <h:panelGroup id="test">
                            <div class="ui-g-12 ui-md-6" style="margin-top: -0.5%;">

                                <h:panelGroup>

                                    <p:outputLabel style="width: 95px;margin-right: 6%;" id="purchId" value="الرقم" />
                                    <p:inputText style="width: 35%" 
                                                 id="purchIdVal" readonly="true"
                                                 value="#{invMonthTargetFormMB.invInvoiceDTO.invMonthTargetDTO.code}" />

                                </h:panelGroup>
                            </div>
                            <div class="ui-g-12 ui-md-6">
                                <h:panelGroup>

                                    <h:panelGroup>
                                        <p:outputLabel style="width: 95px; margin-right: 6%;" value="الشهر"/>
                                    </h:panelGroup>
                                    <h:panelGroup>

                                        <p:selectOneMenu style="width:37%" value="#{invMonthTargetFormMB.invInvoiceDTO.invMonthTargetDTO.month}"  >
                                            <f:selectItem itemLabel="#{userData.userDDs['CHOOSE']}"  itemValue="" noSelectionOption="true" />
                                            <f:selectItem itemLabel="يناير" itemValue="0" />
                                            <f:selectItem itemLabel="فبراير" itemValue="1" />
                                            <f:selectItem itemLabel="مارس" itemValue="2" />
                                            <f:selectItem itemLabel="ابريل" itemValue="3" />
                                            <f:selectItem itemLabel="مايو" itemValue="4" />
                                            <f:selectItem itemLabel="يونيو" itemValue="5" />
                                            <f:selectItem itemLabel="يوليو" itemValue="6" />
                                            <f:selectItem itemLabel="اغسطس" itemValue="7" />
                                            <f:selectItem itemLabel="سبتمبر" itemValue="8" />
                                            <f:selectItem itemLabel="اكتوبر" itemValue="9" />
                                            <f:selectItem itemLabel="نوفمبر" itemValue="10" />
                                            <f:selectItem itemLabel="ديسمبر" itemValue="11" />
                                        </p:selectOneMenu>
                                    </h:panelGroup>

                                </h:panelGroup>
                            </div>
                            <div class="ui-g-12 ui-md-6" style="margin-top: 5px">
                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel style="width: 95px;margin-right: 6%;" value="النوع"/>
                                    </h:panelGroup> 

                                    <h:panelGroup>
                                        <p:selectOneMenu style="width:37%" value="#{invMonthTargetFormMB.invInvoiceDTO.invMonthTargetDTO.type}"  >
                                            <f:selectItem itemLabel="#{userData.userDDs['CHOOSE']}"  itemValue="" />
                                            <f:selectItem itemLabel="المبيعات" itemValue="1"/>


                                        </p:selectOneMenu>
                                    </h:panelGroup> 

                                </h:panelGroup>
                            </div>
                            <div class="ui-g-12 ui-md-6" style="margin-top: -3.5%;">

                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel style="width: 95px;margin-right: 6%;" value="المستهدف"/>
                                    </h:panelGroup> 

                                    <h:panelGroup>
                                        <p:inputNumber style="width:34%!important "  
                                                       value="#{invMonthTargetFormMB.invInvoiceDTO.invMonthTargetDTO.target}"

                                                       /> 
                                    </h:panelGroup> 
                                </h:panelGroup>
                            </div> 
                        </h:panelGroup>
                    </div>
                </div>
                <h:panelGrid  class="col-md-12" columns="1"  style="margin-top:2%">

                    <h:panelGroup  class="centerButtons">

                        <p:commandButton  id="saveB" 
                                          class="saveButton"
                                          title="#{userData.userDDs['SAVE']}"
                                          value="#{userData.userDDs['SAVE']}" 
                                          style="" 
                                          action="#{invMonthTargetFormMB.save()}"
                                          update="@form"/>

                        <p:commandButton 
                            id="newN"
                            ajax="false"
                            style=""
                            value="#{userData.userDDs['NEW']}" 
                            class="newButton"
                            onclick="form.target = ''" 
                            actionListener="#{invMonthTargetFormMB.reset()}"/>

                        <p:commandButton  class="closeButton" 
                                          id="cancel" 
                                          title="#{userData.userDDs['BACK']}" 
                                          value="#{userData.userDDs['BACK']}" 
                                          style=""  
                                          immediate="true"
                                          action="#{invMonthTargetFormMB.exit()}" 
                                          update="@form"/>

                        <p:blockUI block="form" trigger="saveB" animate="true" >

                            <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                        </p:blockUI> 


                    </h:panelGroup>

                </h:panelGrid>
            </p:fieldset>


        </h:form>
    </ui:define>
</ui:composition>
