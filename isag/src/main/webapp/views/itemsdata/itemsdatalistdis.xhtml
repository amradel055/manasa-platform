<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form id="form" dir="#{userData.dir}" class='formmargin'>


            <h:panelGrid  id="twelveSegment" columns="1" cellspacing="20" cellpadding="0" >
                <p:fieldset legend="#{userData.userDDs['ITEMS_DATA']}"  >

                    <div>
                        <p:messages autoUpdate="true"  id="msg" showDetail="true" closable="true" rendered="#{itemDataListMB.showMessageGeneral}"/>
                    </div>

                    <p:dataTable 
                        id="itemList" 
                        draggableColumns="true"
                        var="itemData" 
                        widgetVar="itemDataTable" 
                        rowIndexVar="index"
                        value="#{itemDataListMB.dataModel}" lazy="true"
                        rows="15" 
                        paginator="true"
                        paginatorTemplate="{CurrentPageReport} {FirstPageLink}
                        {PreviousPageLink} {PageLinks} {NextPageLink}
                        {LastPageLink} {RowsPerPageDropdown}"
                        emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"                         
                        >

                        <f:facet name="header">
                            <p:commandButton  class="saddButton" id="b2" icon="fa fa-plus" title="#{userData.userDDs['ADD']}" action="#{itemDataListMB.goToAdd()}" 
                                              style="float:right"
                                              rendered="#{userData.userScreens['itemsdata'].add or userData.isAdmin}" >
                            </p:commandButton>

                            <p:selectOneMenu id="inventory" value="#{itemDataListMB.invInventorySelection}"
                                             converter="#{itemDataListMB.invInventoryConverter}" 
                                             style="float:right;width: 20%!important;color:#fff;height: 30px!important;margin-right: 0.5%;">

                                <p:ajax listener="#{itemDataListMB.loadInventoryList()}" update="form" />
                                <f:selectItem itemLabel="#{userData.userDDs['ALL']}" itemValue="" />

                                <f:selectItems value="#{itemDataListMB.inventoryList}" 
                                               var="inventory" itemLabel="#{inventory.name}"
                                               itemValue="#{inventory}"/> 
                            </p:selectOneMenu>

                            <p:outputPanel >
                                <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large"/>
                                <p:inputText id="globalFilter" a:autofocus="true" onkeyup="PF('itemDataTable').filter()" style="width:150px" />
                            </p:outputPanel>
                        </f:facet>

                        <p:column style="width: 6vh;font-size: 1.4vh;text-align: -webkit-auto;border-radius: 0px" headerText="#" >
                            <h:outputText value="#{index + 1}"  />
                        </p:column>

                        <p:column headerText="#{userData.userDDs['CS_COD']}" style="text-align:right;width: 12vh;font-size: 1.4vh;border-radius: 0px" filterBy="#{itemData.code}" sortBy="#{itemData.code}" filterMatchMode="contains" filterStyle="display:none">
                            <h:outputText value="#{itemData.code}"  />
                        </p:column>
                        <p:column headerText="#{userData.userDDs['ITEM_NAME']}" style="width: 24vh;text-align: right;font-size: 1.4vh;border-radius: 0px" filterBy="#{itemData.name}" sortBy="#{itemData.name}" filterMatchMode="contains" filterStyle="display:none">
                            <h:outputText value="#{itemData.name}"/>
                        </p:column>

                        <p:column headerText="التكلفه" style="width: 24vh;text-align: right;font-size: 1.4vh;border-radius: 0px" filterBy="#{itemData.costAverage}" sortBy="#{itemData.costAverage}" filterMatchMode="contains" filterStyle="display:none">
                            <h:outputText value="#{itemData.costAverage}"/>
                        </p:column>
                        <p:column headerText=" السعر" style="width: 24vh;text-align: right;font-size: 1.4vh;border-radius: 0px" filterBy="#{itemData.sellPrice}" sortBy="#{itemData.sellPrice}" filterMatchMode="contains" filterStyle="display:none">
                            <h:outputText value="#{itemData.sellPrice}"/>
                        </p:column>
                        <p:column headerText=" الكمية المتاحه" style="width: 24vh;text-align: right;font-size: 1.4vh;border-radius: 0px" filterBy="#{itemData.storeQuantity}" sortBy="#{itemData.storeQuantity}" filterMatchMode="contains" filterStyle="display:none">
                            <h:outputText value="#{itemData.storeQuantity}"/>
                        </p:column>
                        <p:column style="width: 10vh;font-size: 1.4vh;border-radius: 0px;text-align: center"  headerText="#{userData.userDDs['TRANSACTION']}" >

                            <p:commandButton update="@form" 
                                             icon="fa fa-fw fa-edit"
                                             title="#{userData.userDDs['EDIT']}"
                                             style="background-color: #6a6967;border-radius: 3px;"
                                             class="seditButtons"
                                             action="#{itemDataListMB.goToEdit()}"
                                             rendered="#{userData.userScreens['itemsdata'].edit or userData.isAdmin}">
                                <f:setPropertyActionListener value="#{itemData.id}" 
                                                             target="#{itemDataListMB.itemDataEntityId}" />
                            </p:commandButton>

                            <p:commandButton  class="sdeleteButtons"  update="@form"
                                              title="#{userData.userDDs['DELETE']}" 
                                              action="#{itemDataListMB.delete()}"
                                              style="background-color: red;border-radius: 3px;"
                                              icon="fa fa-remove"
                                              rendered="#{userData.userScreens['itemsdata'].delete or userData.isAdmin}">
                                <f:setPropertyActionListener value="#{itemData.id}" 
                                                             target="#{itemDataListMB.itemDataEntityId}" />
                                <p:confirm header="#{userData.userDDs['COFIGRATION']}" message="#{userData.userDDs['ARE_YOU_SURE']}" icon="ui-icon-alert" />
                            </p:commandButton>

                            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                                <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                                <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                            </p:confirmDialog>
                        </p:column>

                    </p:dataTable>
                </p:fieldset>

            </h:panelGrid>

        </h:form>
    </ui:define>
</ui:composition>
