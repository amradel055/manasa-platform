<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/newTemplate.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">

        <h:form id="form" dir="#{userData.dir}" class='formmargin'>
            <div style=" position: absolute;left: 20px"> 
                <p:commandButton  style="z-index: 2;
                                  margin-top: 12%;
                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;"
                                  icon="fa fa-fw fa-home"
                                  title="#{userData.userDDs['HOME']}"
                                  class="smhomeButton" 
                                  action="exit" />  
            </div>

            <p:fieldset legend="-" style="margin-bottom:20px">

                <div class="col-xs-12">
                    <p:messages id="msg" showDetail="true" rendered="true" closable="true"/>   
                </div>

                <div   class="ui-g-12 ui-g-nopad" style="padding: 0px;">
                    <div class="ui-g">

                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width:115px;margin-right: 5%"  value="اسم " />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:inputText 
                                        style="width: 35%!important"  id="name" a:autofocus="true" value="#{hrSalaryEffectTypeFormMB.hrSalaryEffectTypeDTO.name}">
                                    </p:inputText>
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>

                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width:120px"  value=" مؤشر التاثير " />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:selectOneMenu id="type" style="width:35%" value="#{hrSalaryEffectTypeFormMB.hrSalaryEffectTypeDTO.type}" >
                                        <f:selectItem itemLabel="ايجابي" itemValue="0" noSelectionOption="true" />
                                        <f:selectItem itemLabel="سلبي" itemValue="1" noSelectionOption="true" /> 
                                    </p:selectOneMenu>
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>

                        <div class="ui-g-12 ui-md-6" style="margin-top: 7px;padding-bottom: 10px;">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width:120px; margin-right: 4%;"  value="نوع التاثير" />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:selectOneMenu id="effectType" style="width:36%" value="#{hrSalaryEffectTypeFormMB.hrSalaryEffectTypeDTO.effectType}" >
                                        <f:selectItem itemLabel="استحقاق" itemValue="0" noSelectionOption="true" />
                                        <f:selectItem itemLabel="استقطاع" itemValue="1" noSelectionOption="true" />
                                    </p:selectOneMenu>
                                </h:panelGroup>
                            </h:panelGroup>
                        </div> 
                    </div>
                </div>
            </p:fieldset>

            <h:panelGrid id="pn1"   class="centerButtons col-md-12" columns="1"  style="margin-top: 2%">
                <h:panelGroup>
                    <p:commandButton   class="saveButton"  
                                       id="saveB" 
                                       title="#{userData.userDDs['SAVE']}"
                                       value="#{userData.userDDs['SAVE']}" 
                                       style=""
                                       action="#{hrSalaryEffectTypeFormMB.save()}" 
                                       update="@form" />
                    <p:commandButton  class="newButton" 
                                      id="newS"
                                      ajax="false"
                                      style=""
                                      value="#{userData.userDDs['NEW']}" 
                                      title="#{userData.userDDs['NEW']}"
                                      onclick="form.target = ''" 
                                      actionListener="#{hrSalaryEffectTypeFormMB.reset()}"/>


                    <p:commandButton class="closeButton" 
                                     title="#{userData.userDDs['BACK']}" 
                                     immediate="true" 
                                     value="#{userData.userDDs['BACK']}" 
                                     style="color: #ecf0f1!important;border-radius: 5px;
                                     height: 30px;background-color: #93188b !important;margin-left: 5px;" 
                                     action="#{hrSalaryEffectTypeFormMB.exit()}"   />

                </h:panelGroup>
            </h:panelGrid>












        </h:form>
    </ui:define>

</ui:composition>
