<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">


        <h:form   class='formmargin' id="form" dir="#{userData.dir}">


            <p:fieldset legend="#{userData.userDDs['SAFES_TRANSFER']}">
                <div class="col-xs-12">
                    <p:messages id="curmsg" showDetail="true" rendered="true" closable="true"/>   
                </div>

                <div  id="firstLine" class="ui-g-12 ui-g-nopad">
                    <div class="ui-g">

                        <div class="ui-g-6 ui-xl-6">

                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText style="width: 37%" readonly="true" value="#{glBankTransactionFromMB.glBankTransactionEntity.serial}"/>

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel  style="width: 92px;" value="#{userData.userDDs['NUMB']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:calendar style="width: 37%!important"  value="#{glBankTransactionFromMB.glBankTransactionEntity.date}" 
                                                pattern="dd/MM/yyyy" >
                                        <p:ajax event="dateSelect" listener="#{glBankTransactionFromMB.updateDate(event)}" />
                                    </p:calendar>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 59px;" value="#{userData.userDDs['DATEE']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:fieldset legend="#{userData.userDDs['TRANS_TYPE']}" style="width:40%;margin: 1% 25%!important;">
                                        <p:selectOneRadio id="paymentType" 
                                                          value="#{glBankTransactionFromMB.glBankTransactionEntity.paymentType}"  >                                                             
                                            <f:selectItem itemLabel="#{userData.userDDs['CASH']}"  itemValue="0"  />
                                            <!--<f:selectItem itemLabel="شيك"  itemValue="1"  />-->
                                            <f:selectItem itemLabel="#{userData.userDDs['CHECK_LINEAR']}"  itemValue="2"  />

                                            <p:ajax update="form" listener="#{glBankTransactionFromMB.fillGlBanks()}" />
                                        </p:selectOneRadio>
                                    </p:fieldset>       
                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:autoComplete style="width: 37%!important" id="transferFromNumber" 
                                                    dropdown="true"
                                                    converter="#{glBankTransactionFromMB.glBankConverterFrom}"
                                                    value="#{glBankTransactionFromMB.glBankTransactionDetailEntity.bankFrom}"

                                                    var="bank"
                                                    itemLabel="#{bank}" 
                                                    itemValue="#{bank}" 
                                                    forceSelection="true" 
                                                    completeMethod="#{glBankTransactionFromMB.completeGlBankFrom}" >


                                        <p:ajax update="@form" event="itemSelect" listener="#{glBankTransactionFromMB.updateRateClosed}"/>
                                        <p:ajax update="@form" event="change" listener="#{glBankTransactionFromMB.updateRateClosed}"/>

                                    </p:autoComplete>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 92px;" value="#{userData.userDDs['TRANSFER_FROM']}" />

                                </div>
                            </div>
                           
                     
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:autoComplete style="width: 37%!important" id="Cost_Center_From" 
                                                    dropdown="true"
                                                    converter="#{glBankTransactionFromMB.glBankConverterTo}"
                                                    value="#{glBankTransactionFromMB.glBankTransactionDetailEntity.bankTo}"

                                                    var="bank"
                                                    itemLabel="#{bank}" 
                                                    itemValue="#{bank}" 
                                                    forceSelection="true" 
                                                    completeMethod="#{glBankTransactionFromMB.completeGlBankTo}" >

                                        <p:ajax update="@form"
                                                event="itemSelect"
                                                listener="#{glBankTransactionFromMB.updateRate}" />
                                        <p:ajax update="@form"
                                                event="change"
                                                listener="#{glBankTransactionFromMB.updateRate}"  />
                                    </p:autoComplete>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 92px;" value="#{userData.userDDs['SAFE_RECEIVED']}" />

                                </div>
                            </div>
                            
                        </div>


                        <div class="ui-g-6 ui-xl-6">
                                   <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputNumber style="width: 39%" required="true" requiredMessage="يجب ادخال المبلغ" id="amount" value="#{glBankTransactionFromMB.glBankTransactionDetailEntity.value}">
                                        <p:ajax event="keyup" listener="#{glBankTransactionFromMB.calculateLocalValue()}" update="currencyLocal"/>
                                    </p:inputNumber>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 60px;" value="#{userData.userDDs['AMOUNT']}"/>

                                </div>
                            </div>

                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputNumber style="width: 39%!important" id="rate" value="#{glBankTransactionFromMB.glBankTransactionEntity.rate}">
                                        <p:ajax event="keyup" listener="#{glBankTransactionFromMB.calculateLocalValue()}" update="currencyLocal" />
                                    </p:inputNumber>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 61px;" value="#{userData.userDDs['RATE']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel id="currency" value="#{glBankTransactionFromMB.glBankTransactionDetailEntity.bankFrom.currencyId.name}"/>

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 60px;" value="#{userData.userDDs['CURRENCY']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText  style="width: 36%"  id="currencyLocal" value="#{glBankTransactionFromMB.glBankTransactionDetailEntity.valueLocal}"/>

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 62px;" value="#{userData.userDDs['LOCAL_CURRENCY']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText style="width: 69%" id="note" value="#{glBankTransactionFromMB.glBankTransactionEntity.remark}"/>

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 55px;" value="#{userData.userDDs['NOTE']}"/>

                                </div>
                            </div>
                            
                              <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">

                                </div>
                                <div class="ui-g-6 ui-xl-6">

                                </div>
                            </div>
                              <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">

                                </div>
                                <div class="ui-g-6 ui-xl-6">

                                </div>
                            </div>
                              <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">

                                </div>
                                <div class="ui-g-6 ui-xl-6">

                                </div>
                            </div>
                              <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">

                                </div>
                                <div class="ui-g-6 ui-xl-6">

                                </div>
                            </div>
                             <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel  style="width: 150px;" id="accountTo" 
                                                    value="#{glBankTransactionFromMB.glBankTransactionDetailEntity.bankFrom.accountId.name}" />

                                </div>
                            </div>
                             
                            
                               <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">

                                </div>
                                <div class="ui-g-6 ui-xl-6">

                                </div>
                            </div>
                         
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 150px;" id="accountFrom" 
                                                   value="#{glBankTransactionFromMB.glBankTransactionDetailEntity.bankTo.accountId.name}" />

                                </div>
                            </div>

                        </div>


                    </div>
                </div>

                <h:panelGrid class="col-md-12 centerButtons">

                    <h:panelGroup >

                        <p:commandButton   class="saveButton"  
                                           id="saveB" 
                                           title="#{userData.userDDs['SAVE']}" 
                                           value="#{userData.userDDs['SAVE']}" 
                                           style=""
                                           disabled="#{glBankTransactionFromMB.disableSave or glBankTransactionFromMB.glBankTransactionEntity.postFlag == 1}"
                                           action="#{glBankTransactionFromMB.save}" 
                                           update="@form"
                                           rendered="#{userData.userScreens['glBankTransaction'].add or userData.userScreens['glBankTransaction'].edit or userData.isAdmin}"
                                           />

                        <p:commandButton class="newButton" 
                                         title="#{userData.userDDs['NEW']}" 
                                         immediate="true"
                                         value="#{userData.userDDs['NEW']}" 
                                         id="newA"
                                         style=""
                                         update="@form"
                                         actionListener="#"  
                                         rendered="#{userData.userScreens['glBankTransaction'].add or userData.isAdmin}"
                                         />

                        <p:commandButton  class="printButtons"
                                          ajax="false" onclick="form.target = '_blank'"  
                                          value="#{userData.userDDs['PRINT']}" 
                                          title="#{userData.userDDs['PRINT']}" 
                                          actionListener="#{glBankTransactionFromMB.exportPDF}"
                                          style="color: #fff!important;background-color: #553e41e6;margin-left: 5px"
                                          rendered="#{ glBankTransactionFromMB.glBankTransactionEntity.id gt 0 and(userData.userScreens['glBankTransaction'].view or userData.isAdmin)}"
                                          />

                        <p:commandButton class="closeButton" 
                                         id="cancel" 
                                         title="#{userData.userDDs['BACK']}"
                                         value="#{userData.userDDs['BACK']}" 
                                         style="" 
                                         action="#{glBankTransactionFromMB.exit()}" 
                                         update="@form"/>




                        <p:blockUI block="form" trigger="saveB" animate="true" >

                            <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                        </p:blockUI> 

                    </h:panelGroup>

                </h:panelGrid>

            </p:fieldset>



        </h:form>
    </ui:define>
</ui:composition>
