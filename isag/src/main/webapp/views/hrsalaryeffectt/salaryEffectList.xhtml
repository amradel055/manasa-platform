<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/newTemplate.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form id="form" dir="#{userData.dir}}" style="margin-right: 15px">
            <p:fieldset legend="بيانات المؤثرات" style="margin-bottom:20px">
                <p:messages autoUpdate="true"  id="messages" showDetail="true" closable="true"/>  
                <p:commandButton   icon="fa fa-fw fa-backward"  class="scloseButton"  style="float: left;margin: 1px 5px"  action="exit" />

                <div>
                    <p:dataTable 
                        draggableColumns="true" 
                        widgetVar="departmenttable"
                        var="effectData" 
                        value="#{salaryEffectTypeListMB.hrSalaryEffectDTOList}"
                        rowIndexVar="index" 
                        paginator="true" rows="15"
                        emptyMessage="#{userData.userDDs['EMPTY_TABLE']}" style="padding: 0px 5px">
                        <f:facet name="header" >
                            <p:commandButton title="#{userData.userDDs['ADD']}"   class="saddButton" 
                                             id="b2" icon="fa fa-fw fa-plus" action="#{salaryEffectTypeListMB.goToAdd()}"
                                             style="float:right;margin: 0" rendered="#{userData.userScreens['role'].add or userData.isAdmin}"  />
                            <p:outputPanel  >
                                <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                                <p:inputText id="globalFilter" a:autofocus="true" onkeyup="PF('roletable').filter()" style="width:150px" />
                            </p:outputPanel>
                        </f:facet>

                        <p:column style="width: 8vh;font-size: 1.4vh;text-align: center"  headerText="الاسم" >
                            <h:outputText value="#{effectData.name}" />
                        </p:column>
                        
                         <p:column style="width: 8vh;font-size: 1.9vh;text-align: center;border-radius: 0px"
                              headerText="#{userData.userDDs['TRANSACTION']}">
                        
                        <p:commandButton  class="seditButtons" 
                                          icon="fa fa-fw fa-edit" style="background-color: #6a6967;border-radius: 3px;"
                                          title="#{userData.userDDs['EDIT']}" 
                                          action="#{salaryEffectTypeListMB.goToEdit()}">
                            <f:setPropertyActionListener value="#{effectData}"  
                                                         target="#{salaryEffectTypeListMB.hrSalaryEffectDTOSelected}" />
                        </p:commandButton>
                        
                        <p:commandButton class="sdeleteButtons" update="@form" icon="fa fa-remove" style="background-color: red;border-radius: 3px;"
                                         title="#{userData.userDDs['DELETE']}"  action="#{salaryEffectTypeListMB.delete}">
                            <f:setPropertyActionListener value="#{effectData}" target="#{salaryEffectTypeListMB.hrSalaryEffectDTOSelected}" />
                            <p:confirm header="Confirmation" message="#{userData.userDDs['ARE_YOU_SURE']}" icon="ui-icon-alert" />
                        </p:commandButton>
                    </p:column>

                    </p:dataTable>
                </div>
            </p:fieldset>
            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
            </p:confirmDialog>

        </h:form>
    </ui:define>
</ui:composition>
