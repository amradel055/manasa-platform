<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/newTemplate.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form id="form" dir="#{userData.dir}" class='formmargin'>
            <div >
                <p:messages id="curmsg" autoUpdate="true" showDetail="true" rendered="true" closable="true"/>   
            </div>
            <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                  margin-top: 12%;
                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;"
                                  icon="fa fa-fw fa-home"
                                  title="#{userData.userDDs['HOME']}"
                                  class="smhomeButton" 
                                  action="exit" />  
            </div>

            <p:fieldset legend="-" style="margin-bottom:20px">
                <div   class="ui-g-12 ui-g-nopad" style="padding: 0px;">
                    <div class="ui-g">

                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">
                            <h:panelGroup>
                                <h:panelGroup>

                                    <p:outputLabel style="width:115px;margin-right: 5%"  value="اسم " />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:inputText 
                                        style="width: 35%!important"  id="name" a:autofocus="true" value="#{salaryEffectFormMB.salaryEffectTypeDTO.name}">
                                    </p:inputText>
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>

                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width:120px"  value=" مؤشر التاثير " />
                                </h:panelGroup>
                                <h:panelGroup>

                                    <p:selectOneMenu id="status" style="width:35%" value="#{salaryEffectFormMB.salaryEffectTypeDTO.impactIndicator}" >
                                        <f:selectItem itemLabel="ايجابي" itemValue="0" noSelectionOption="true" />
                                        <f:selectItem itemLabel="سلبي" itemValue="1" noSelectionOption="true" />

                                        <p:ajax update="@form"
                                                event="itemSelect"
                                                listener="#{salaryEffectFormMB.findSalaryEffectTypeList()}"
                                                />

                                    </p:selectOneMenu>


                                </h:panelGroup>
                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6" style="padding: 0px; margin-top: 5px;">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width:120px;margin-right: 5%"  value="نوع" />
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:selectOneMenu id="salaryEffectType" style="width:35%" value="#{salaryEffectFormMB.salaryEffectTypeDTO.type}" 
                                                     converter="#{salaryEffectFormMB.salaryEffectTypeConverter}">

                                        <f:selectItems value="#{salaryEffectFormMB.salaryEffectTypeList}" 
                                                       var="type" 
                                                       itemValue="#{type}" 
                                                       itemLabel="#{type}" />
                                    </p:selectOneMenu>

                                </h:panelGroup>
                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">

                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width:115px"  value="معامل التاثير باليوم   " />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:inputText  style="width: 35%!important" id="cofficientPerDay" a:autofocus="true" value="#{salaryEffectFormMB.salaryEffectTypeDTO.cofficientPerDay}">
                                    </p:inputText>
                                </h:panelGroup>

                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">

                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width:120px;margin-right: 4%"  value="معامل التاثير بالساعة" />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:inputText  style="width: 35%!important" id="cofficientPerHour" a:autofocus="true" value="#{salaryEffectFormMB.salaryEffectTypeDTO.cofficientPerHour}">
                                    </p:inputText>
                                </h:panelGroup>

                            </h:panelGroup>
                        </div>




                    </div>
                </div>
            </p:fieldset>

            <h:panelGrid id="pn1"   class="centerButtons col-md-12" columns="1"  style="margin-top: 2%">


                <h:panelGroup>


                    <p:commandButton   class="saveButton"  
                                       id="saveB" 
                                       title="#{userData.userDDs['SAVE']}"
                                       value="#{userData.userDDs['SAVE']}" 
                                       style=""
                                       action="#{salaryEffectFormMB.save()}" 
                                       update="@form" />
                    <p:commandButton  class="newButton" 
                                      id="newS"
                                      ajax="false"
                                      style=""
                                      value="#{userData.userDDs['NEW']}" 
                                      title="#{userData.userDDs['NEW']}"
                                      onclick="form.target = ''" 
                                      actionListener="#{salaryEffectFormMB.reset()}"/>


                    <p:commandButton class="closeButton" 
                                     title="#{userData.userDDs['BACK']}" 
                                     immediate="true" 
                                     value="#{userData.userDDs['BACK']}" 
                                     style="" 
                                     action="#{salaryEffectFormMB.exit()}"   />


                </h:panelGroup>
            </h:panelGrid>












        </h:form>
    </ui:define>

</ui:composition>
