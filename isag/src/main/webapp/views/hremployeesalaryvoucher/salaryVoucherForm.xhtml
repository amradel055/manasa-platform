<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/newTemplate.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form id="form" dir="#{userData.dir}" class='formmargin'>
            <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                  margin-top: 12%;
                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;"
                                  icon="fa fa-fw fa-home"
                                  title="#{userData.userDDs['HOME']}"
                                  class="smhomeButton" 
                                  action="exit" />  
            </div>
            <p:fieldset legend="-" style="margin-bottom:20px">
                <div   class="ui-g-12 ui-g-nopad" style="padding: 0px;">
                    <div class="ui-g">
                        <div class="ui-g-12 ui-md-6" style="padding: 0px; margin-bottom: 2px;">

                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width:90px;margin-right: 5%"  value="تاريخ الإدخال" />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <h:panelGroup>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:calendar pattern="dd/MM/yyyy" 
                                                    value="#{salaryStructureFormMB.salaryStructureDTO.dateFrom}"
                                                    style="width: 56%"
                                                    id="entryDate">
                                        </p:calendar>
                                    </h:panelGroup>
                                </h:panelGroup>

                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">

                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width:95px"  value="السنه الماليه " />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <h:panelGroup>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:calendar pattern="yyyy" 
                                                    value="#{salaryStructureFormMB.salaryStructureDTO.entryDate}"
                                                    style="width: 56%"
                                                    id="entryDate2">

                                        </p:calendar>
                                    </h:panelGroup>
                                </h:panelGroup>

                            </h:panelGroup>
                        </div>



                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width:95px;margin-right: 5%"  value="شهر" />
                                </h:panelGroup>
                                <h:panelGroup>

                                    <p:selectOneMenu id="months" style="width:35%" value="#{salaryStructureFormMB.salaryStructureDTO.months}"  >
                                        <f:selectItem itemLabel="يناير" itemValue="01"  />

                                        <f:selectItem itemLabel="فبراير" itemValue="02"  />

                                        <f:selectItem itemLabel="مارس" itemValue="03"  />

                                        <f:selectItem itemLabel="أبريل" itemValue="04"  />

                                        <f:selectItem itemLabel="مايو" itemValue="05"  />

                                        <f:selectItem itemLabel="يونيو" itemValue="06"  />

                                        <f:selectItem itemLabel="يوليو" itemValue="07"  />

                                        <f:selectItem itemLabel="أغسطس" itemValue="08"  />

                                        <f:selectItem itemLabel="سبتمبر" itemValue="09"  />

                                        <f:selectItem itemLabel="أكتوبر" itemValue="10"  />

                                        <f:selectItem itemLabel="نوفبر" itemValue="11"  />

                                        <f:selectItem itemLabel="ديسمبر" itemValue="12"  />



                                    </p:selectOneMenu>

                                </h:panelGroup>
                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">

                            <h:panelGroup>

                                <h:panelGroup>
                                    <p:outputLabel style="width:95px"  value="ملاحظات" />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:inputText  style="width: 35%!important"  id="relation"  value="#{salaryStructureFormMB.salaryStructureDTO.remark}">
                                    </p:inputText>
                                </h:panelGroup>

                            </h:panelGroup>
                        </div>
                    </div>
                </div>





            </p:fieldset>

            <p:fieldset legend="-" style="margin-bottom:20px">
                <div   class="ui-g-12 ui-g-nopad" style="padding: 0px;">
                    <div class="ui-g">
                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel style="width:100px;margin-right: 5%"  value="الموظف " />
                                    </h:panelGroup>

                                </h:panelGroup>

                            </h:panelGroup>

                            <h:panelGroup>
                                <p:autoComplete style="width:34%!important" 
                                                dropdown="true" 
                                                value="#{salaryStructureFormMB.salaryStructureDTO.employeeId}" 
                                                converter="#{salaryStructureFormMB.employeeDTOConverter}"
                                                completeMethod="#{salaryStructureFormMB.completeEmployee}"
                                                var="parent"
                                                itemLabel="#{parent.name}" 
                                                itemValue="#{parent}" 
                                                forceSelection="true" 
                                                >
                                    <p:ajax update="@form" process="@form"
                                            event="itemSelect"
                                            listener="#{salaryStructureFormMB.findEmployeeData()}"
                                            />

                                </p:autoComplete>

                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width:107px"  value="نشط" />
                                </h:panelGroup>
                                <h:panelGroup>

                                    <p:selectOneMenu id="status" style="width:35%" value="#{salaryStructureFormMB.salaryStructureDTO.active}" >
                                        <f:selectItem itemLabel="نعم" itemValue="0"  />
                                        <f:selectItem itemLabel="لا" itemValue="1"  />

                                    </p:selectOneMenu>

                                </h:panelGroup>
                            </h:panelGroup>
                        </div>



                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">

                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width:95px;margin-right: 5%"  value="اسم الموظف  " />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:inputText  style="width: 35%!important" readonly="true" id="name"  value="#{salaryStructureFormMB.salaryStructureDTO.employeeId.name}">
                                    </p:inputText>
                                </h:panelGroup>

                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">

                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width:105px"  value="المسمى الوظيفي" />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:inputText  style="width: 35%!important" readonly="true" id="designation"  value="#{salaryStructureFormMB.salaryStructureDTO.employeeId.designation}">
                                    </p:inputText>
                                </h:panelGroup>

                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">

                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width:95px;margin-right: 5%"  value="قسم " />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:inputText  style="width: 35%!important" readonly="true" id="department"  value="#{salaryStructureFormMB.salaryStructureDTO.employeeId.departmentId}">
                                    </p:inputText>
                                </h:panelGroup>

                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">

                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width:105px"  value="درجة  " />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:inputText  style="width: 35%!important" readonly="true" id="jobGrade"  value="#{salaryStructureFormMB.salaryStructureDTO.employeeId.jobGrade}">
                                    </p:inputText>
                                </h:panelGroup>

                            </h:panelGroup>
                        </div>



                    </div>
                </div>





            </p:fieldset>

            <p:fieldset legend="1.إجمالي المستحقات   " style="margin-bottom:20px">
                <p:messages autoUpdate="true"  id="messages" showDetail="true" closable="true"/>  

                <p:dataTable 
                    draggableColumns="true" 
                    widgetVar="generalJournaltable"
                    id="table" 
                    var="accural" 
                    dir="#{userData.dir}" 
                    selectionMode="single"   
                    sortBy="#{1}"
                    rowKey="#{accural.index}" 
                    value="#{salaryStructureFormMB.salaryStructureDTO.hrEmployeeAccuralDTOList}"                    

                    emptyMessage="#{userData.userDDs['EMPTY_TABLE']}" >


                    <f:facet name="header">
                        <p:commandButton id="b3" 
                                         class="saddButton"

                                         title="#{userData.userDDs['ADD']}" 
                                         icon="fa fa-plus"
                                         actionListener="#{salaryStructureFormMB.addAccuralRow()}" 
                                         style="float:right;margin: 0" 
                                         update="@form table" />
                        <p:outputPanel >
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" onkeyup="PF('rolestable').filter()" style="width:150px" />
                        </p:outputPanel>
                    </f:facet>

                    <p:column filterStyle="display:none" 
                              style="width: 20vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px"
                              sortBy="#{accural.accuralDeductionId}"
                              filterBy="#{accural.accuralDeductionId}" 
                              filterMatchMode="contains"
                              headerText=" نوع ">

                        <p:selectOneMenu disabled="#{accural.salaryText}"
                                         id="status" style="width:50%" value="#{accural.accuralDeductionId}" 
                                         converter="#{salaryStructureFormMB.acuuralConverter}">
                            <f:selectItems value="#{salaryStructureFormMB.accrualDTOList}" var="accural2" itemValue="#{accural2}" itemLabel="#{accural2.rscAccrualDeductionName}" />
                            <p:ajax update="@form"
                                    event="change"
                                    process="@form"  
                                    listener="#{salaryStructureFormMB.validateAccural()}"
                                    />
                            <p:ajax update="@form"
                                    process="@form"
                                    event="itemSelect"
                                    listener="#{salaryStructureFormMB.validateAccural()}"
                                    />
                        </p:selectOneMenu>
                    </p:column>
                    <p:column filterStyle="display:none" 
                              sortBy="#{accural.value}" 
                              filterBy="#{accural.value}" 
                              filterMatchMode="contains"  
                              style="width: 8vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px"
                              headerText=" ( مبلغ )">
                        <p:inputText id="SER" 
                                     value="#{accural.value}"
                                     style="width:100%">
                            <p:ajax event="blur" update=":form:table:totalAccu" listener="#{salaryStructureFormMB.calculateTotal}" />
                            <p:ajax event="blur" update=":form:totalIncome" listener="#{salaryStructureFormMB.calculateTotalIncome()}" />
                        </p:inputText>
                        <p:message id="msgSER" for="SER"/>
                    </p:column>
                    <p:column headerText="#{userData.userDDs['TRANSACTION']}" style="width: 10vh;font-size: 1.8vh;text-align: center;border-radius: 0px" >

                        <p:commandButton  class="scloseButtons" update="@form"
                                          title="#{userData.userDDs['DELETE']}" 
                                          action="#{salaryStructureFormMB.deleteAccural()}" 
                                          icon="fa fa-fw fa-remove" style="background-color: red;border-radius: 3px;"

                                          >
                            <f:setPropertyActionListener value="#{accural}" target="#{salaryStructureFormMB.accuralDTOSelected}" />

                        </p:commandButton>
                    </p:column>
                    <p:summaryRow>
                        <p:column colspan="1" style="text-align:right">
                            <h:outputText value="الإجمالي " />
                        </p:column>
                        <p:column>
                            <h:outputText id="totalAccu" value="#{salaryStructureFormMB.totalAccural}">
                                <f:convertNumber type="currency" currencySymbol="$" />
                            </h:outputText>
                        </p:column>

                    </p:summaryRow>

                </p:dataTable>




            </p:fieldset>

            <p:fieldset legend="1.إجمالي الإستقطاعات" style="margin-bottom:20px">
                <p:messages autoUpdate="true"  id="messagess" showDetail="true" closable="true"/>  

                <p:dataTable 
                    draggableColumns="true" 
                    widgetVar="generalJournaltable"
                    id="table2" 
                    var="deduction" 
                    dir="#{userData.dir}" 
                    selectionMode="single"   
                    rowKey="#{deduction.index}" 
                    sortBy="#{1}"
                    value="#{salaryStructureFormMB.salaryStructureDTO.hrEmployeeDeductionDTOList}"                    

                    emptyMessage="#{userData.userDDs['EMPTY_TABLE']}" >

                    <f:facet name="header">

                        <p:commandButton id="b2" 
                                         class="saddButton"

                                         title="#{userData.userDDs['ADD']}" 
                                         icon="fa fa-plus"
                                         actionListener="#{salaryStructureFormMB.addDeductionRow()}" 
                                         style="float:right;margin: 0" 
                                         update="@form" />
                        <p:outputPanel >
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" onkeyup="PF('rolestable').filter()" style="width:150px" />
                        </p:outputPanel>
                    </f:facet>

                    <p:column filterStyle="display:none" 
                              style="width: 25vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px"
                              sortBy="#{deduction}"
                              filterBy="#{deduction}" 
                              filterMatchMode="contains"
                              headerText=" نوع ">
                        <h:panelGroup>

                            <p:selectOneMenu id="status" style="width:50%" value="#{deduction.accuralDeductionId}" 
                                             converter="#{salaryStructureFormMB.deductionConverter}">
                                <f:selectItems value="#{salaryStructureFormMB.deductionDTOList}" 
                                               var="deduction2" itemValue="#{deduction2}" 
                                               itemLabel="#{deduction2.rscAccrualDeductionName}" />
                                <p:ajax update="@form"
                                        event="change"
                                        process="@form"  
                                        listener="#{salaryStructureFormMB.validateDeduction()}"
                                        />
                                <p:ajax update="@form"
                                        process="@form"
                                        event="itemSelect"
                                        listener="#{salaryStructureFormMB.validateDeduction()}"
                                        />
                            </p:selectOneMenu>

                        </h:panelGroup>
                    </p:column>
                    <p:column filterStyle="display:none" 
                              sortBy="#{deduction.value}" 
                              filterBy="#{deduction.value}" 
                              filterMatchMode="contains"  
                              style="width: 8vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px"
                              headerText=" ( مبلغ )">
                        <p:inputText id="SER" 
                                     value="#{deduction.value}"
                                     style="width:100%">
                            <p:ajax event="blur" update=":form:table2:totDeduc" listener="#{salaryStructureFormMB.calculateTotalDeduction()}" />
                            <p:ajax event="blur" update=":form:totalIncome" listener="#{salaryStructureFormMB.calculateTotalIncome()}" />
                        </p:inputText>
                        <p:message id="msgSER" for="SER"/>
                    </p:column>

                    <p:summaryRow>
                        <p:column colspan="1" style="text-align:right">
                            <h:outputText value="الإجمالي " />
                        </p:column>
                        <p:column>
                            <h:outputText id="totDeduc" value="#{salaryStructureFormMB.totalDeduction}">
                                <f:convertNumber type="currency" currencySymbol="$" />
                            </h:outputText>
                        </p:column>

                    </p:summaryRow>

                    <p:column headerText="#{userData.userDDs['TRANSACTION']}" style="width: 10vh;font-size: 1.8vh;text-align: center;border-radius: 0px" >

                        <p:commandButton  class="scloseButtons" update="@form"
                                          title="#{userData.userDDs['DELETE']}" 
                                          action="#{salaryStructureFormMB.deleteDeduction()}" 
                                          icon="fa fa-fw fa-remove" style="background-color: red;border-radius: 3px;" 

                                          >
                            <f:setPropertyActionListener value="#{deduction}" target="#{salaryStructureFormMB.deductionDTOSelected}" />

                        </p:commandButton>
                    </p:column>








                </p:dataTable>

            </p:fieldset>
            <p:fieldset legend="3.مؤثرات الراتب " style="margin-bottom:20px">
                <p:messages autoUpdate="true"  id="messagesss" showDetail="true" closable="true"/>  

                <p:dataTable 
                    draggableColumns="true" 
                    widgetVar="generalJournaltable"
                    id="table3" 
                    var="salaries" 
                    dir="#{userData.dir}" 
                    selectionMode="single"   
                    rowKey="#{salaries.index}" 
                    sortBy="#{1}"
                    value="#{salaryStructureFormMB.salaryStructureDTO.salariesEffectDTOList}"                    

                    emptyMessage="#{userData.userDDs['EMPTY_TABLE']}" >

                    <f:facet name="header">
                        <p:commandButton id="b4" 
                                         class="saddButton"

                                         title="#{userData.userDDs['ADD']}" 
                                         icon="fa fa-plus"
                                         actionListener="#{salaryStructureFormMB.addSalaryEffectRow()}" 
                                         style="float:right;margin: 0" 
                                         update="@form table3" />
                        <p:outputPanel >
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" onkeyup="PF('rolestable').filter()" style="width:150px" />
                        </p:outputPanel>
                    </f:facet>

                    <p:column filterStyle="display:none" 
                              style="width: 25vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px"
                              sortBy="#{salaries}"
                              filterBy="#{salaries}" 
                              filterMatchMode="contains"
                              headerText=" نوع تأثير الراتب ">
                        <h:panelGroup>

                            <p:selectOneMenu id="salaryEffectType" style="width:50%" value="#{salaries.effectType}" 
                                             converter="#{salaryStructureFormMB.salaryEffectTypeDTOConverter}">

                                <f:selectItem itemLabel="اختر" itemValue="" />
                                <f:selectItems value="#{salaryStructureFormMB.salaryEffectTypeDTOList}" 
                                               var="effectType" 
                                               itemValue="#{effectType}" 
                                               itemLabel="#{effectType.name}" />
                                <p:ajax listener="#{salaryStructureFormMB.finalTotal(salaries)}" update="form:totalIncome"/>
                            </p:selectOneMenu>

                        </h:panelGroup>
                    </p:column>
                    <p:column filterStyle="display:none" 
                              style="width: 25vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px"
                              sortBy="#{salaries}"
                              filterBy="#{salaries}" 
                              filterMatchMode="contains"
                              headerText=" نوع الوحده ">
                        <h:panelGroup>
                            <p:selectOneMenu id="salaryUnitType" style="width:50%" value="#{salaries.salaryEffectType}" >

                                <f:selectItem itemLabel="اختر" itemValue="" />
                                <f:selectItem itemLabel="باليوم" itemValue="0" />
                                <f:selectItem itemLabel="بالساعة" itemValue="1" />
                                <p:ajax listener="#{salaryStructureFormMB.finalTotal(salaries)}" update="form:totalIncome"/>
                            </p:selectOneMenu>

                        </h:panelGroup>


                    </p:column>
                    <p:column
                        headerText=" تاريخ " style="border-radius: 0px">
                        <h:panelGroup>
                            <h:panelGroup>
                                <p:calendar pattern="dd/MM/yyyy" 
                                            value="#{salaries.effectDate}"
                                            style="width: 25%"
                                            id="effectDate">

                                </p:calendar>
                            </h:panelGroup>
                        </h:panelGroup>
                    </p:column>

                    <p:column
                        headerText="عدد وحدات التاثير"
                        style="border-radius: 0px">

                        <h:panelGroup>
                            <h:panelGroup>
                                <p:inputText  style="width: 40%!important"  id="rate"  value="#{salaries.unitEffectCount}" >
                                    <p:ajax listener="#{salaryStructureFormMB.finalTotal(salaries)}" update="form:totalIncome"/>
                                </p:inputText>
                            </h:panelGroup>
                        </h:panelGroup>

                    </p:column>
                    <p:column
                        headerText=" الحاله"
                        style="border-radius: 0px" >

                        <h:panelGroup>
                            <p:selectOneMenu id="status2" style="width:100%" value="#{salaries.status}" >
                                <f:selectItem itemLabel="مسودة" itemValue="0"  />
                                <f:selectItem itemLabel="تمت الموافقة" itemValue="1"  />

                            </p:selectOneMenu>
                        </h:panelGroup>

                    </p:column>



                    <p:column headerText="#{userData.userDDs['TRANSACTION']}" style="width: 10vh;font-size: 1.8vh;text-align:center;border-radius: 0px" >

                        <p:commandButton  class="scloseButtons" update="@form"
                                          title="#{userData.userDDs['DELETE']}" 
                                          action="#{salaryStructureFormMB.deleteSalariesEffect()}" 
                                          icon="fa fa-fw fa-remove" style="background-color: red;border-radius: 3px;" 

                                          >
                            <f:setPropertyActionListener value="#{salaries}" target="#{salaryStructureFormMB.hrSalariesEffectDTOSelected}" />

                        </p:commandButton>
                    </p:column>




                </p:dataTable>

            </p:fieldset>
            <p:fieldset legend="-" style="margin-bottom:20px">
                <div   class="ui-g-12 ui-g-nopad" style="padding: 0px;">
                    <div class="ui-g">

                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">

                            <h:panelGroup>

                                <h:panelGroup>
                                    <p:outputLabel style="width:100px;margin-right: 5%"  value="صافي الدخل" />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:inputText  style="width: 34%!important"  id="totalIncome1"  value="#{salaryStructureFormMB.totalIncome}">
                                    </p:inputText>
                                </h:panelGroup>

                            </h:panelGroup>
                        </div>

                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">

                            <h:panelGroup>

                                <h:panelGroup>
                                    <p:outputLabel style="width:100px;margin-right: 5%"  value="صافي الدخل بعد المؤثرات" />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:inputText  style="width: 34%!important"  id="totalIncome"  value="#{salaryStructureFormMB.totalIncomeAfterEffect}">
                                    </p:inputText>
                                </h:panelGroup>

                            </h:panelGroup>
                        </div>
                    </div>
                </div>
            </p:fieldset>

            <h:panelGrid id="pn2"   class="centerButtons col-md-12" columns="1"  style="margin-top: 2%">

                <h:panelGroup>

                    <p:commandButton   class="saveButton"  
                                       id="saveB" 
                                       title="#{userData.userDDs['SAVE']}"
                                       value="#{userData.userDDs['SAVE']}" 
                                       style=""
                                       action="#{salaryStructureFormMB.save()}" 
                                       update="@form" />
                    <p:commandButton   class="newButton"  
                                       id="newN"
                                       ajax="false"
                                       style=""
                                       value="#{userData.userDDs['NEW']}" 
                                       title="#{userData.userDDs['NEW']}"
                                       action="#{salaryStructureFormMB.reset()}" 
                                       update="@form" />


                    <p:commandButton       class="closeButton"
                                           id="CloseB"
                                           style=""  
                                           title="#{userData.userDDs['BACK']}"
                                           action="exit"
                                           value="#{userData.userDDs['BACK']}"/>







                </h:panelGroup>
            </h:panelGrid>









        </h:form>
    </ui:define>

</ui:composition>
