<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/newTemplate.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form  id="form" dir="#{userData.dir}"  class='formmargin'>
            <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                      margin-top: 22%;
                                      color: #035c70!important; 
                                      background-color: #223238!important;
                                      border: 1px solid #22323a!important;
                                      background: #22323a 50% 50% repeat-x!important;"
                                      icon="fa fa-fw fa-home"
                                      title="#{userData.userDDs['HOME']}"
                                      class="smhomeButton" 
                                      action="exit" />
                  
            </div>
            <p:fieldset legend="#{userData.userDDs['INSU_COMPA_GU_REP']}"> 

                <div class="ui-g" id="firstSegment">

                    <div class="ui-g-12">

                        <h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel style="width: 45px;margin-right: 4%;" value="#{userData.userDDs['COMPANY']}"/>
                            </h:panelGroup> 

                            <h:panelGroup>
                                <p:autoComplete style="width:20%!important"
                                                dropdown="true"
                                                converter="#{hosPatientReportMB.patientRegistrationConvertor}"
                                                value="#{hosPatientReportMB.patientReportSearchBean.patient}"
                                                var="company"
                                                itemLabel="#{company}" 
                                                itemValue="#{company}"
                                                forceSelection="true" 
                                                completeMethod="#{hosPatientReportMB.completPatient}"
                                                >

                                </p:autoComplete>
                            </h:panelGroup> 
                        </h:panelGroup>


                    </div> 
                </div>

                <h:panelGroup>
                    <div  style="margin-top:1% ;margin-right:35%">

               
                        <p:commandButton   class="printButton" 
                                           ajax="false"
                                           onclick="form.target = '_blank'"  
                                            style="color: #ecf0f1!important;border-radius: 5px;
                                            background-color: grey !important;margin-left: 5px;"
                                           value="#{userData.userDDs['PRINT']}" 
                                           actionListener="#{hosPatientReportMB.exportPDF}"
                                           title="#{userData.userDDs['PRINT']}"
                                           immediate="true" />
                        
                        
                          <p:commandButton  class="printButtons"                                              
                                              ajax="false"
                                              onclick="form.target = '_blank'"  
                                              value="#{userData.userDDs['PRINT']}" 
                                              title="#{userData.userDDs['PRINT']}" 
                                              actionListener="#{gmSubscriptionsFormDTOMB.print}"                                
                                              update="@form"/>

                    </div>

                </h:panelGroup>

            </p:fieldset>
      
        </h:form>
    </ui:define>
</ui:composition>
