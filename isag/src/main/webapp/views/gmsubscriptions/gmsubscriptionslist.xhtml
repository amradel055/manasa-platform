<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form id="form"  dir="#{userData.dir}" class='formmargin'>
            <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                  margin-top: 24%;
                                  color: #035c70!important; 
                                  background-color: #223238!important; 
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;"
                                  icon="fa fa-fw fa-home"
                                  title="#{userData.userDDs['HOME']}"
                                  class="smhomeButton" 
                                  action="exit" />

            </div>
            <div class="col-xs-12">
                <p:messages id="curmsg" showDetail="true" rendered="true" closable="true"/>   
            </div>
            <p:fieldset   legend="#{userData.userDDs['SALES_INVOICES']}" >


                <p:dataTable id="invInvoicePurchaseTable"
                             var="invInvoicePurchaseTable" 
                             widgetVar="bTable" 
                             rowIndexVar="index" 
                             value="#{gmSubscriptionsListDTOMB.dataModel}"
                             paginator="true"
                             rows="10" 
                             lazy="true" 
                             paginatorTemplate="{CurrentPageReport} {FirstPageLink}
                             {PreviousPageLink} {PageLinks} {NextPageLink}
                             {LastPageLink} {RowsPerPageDropdown}" 
                             emptyMessage="#{userData.userDDs['EMPTY_TABLE']}" 
                             >

                    <f:facet name="header" >
                        <p:commandButton  icon="fa fa-plus" 
                                          class="saddButton"
                                          title="#{userData.userDDs['ADD']}" 
                                          action="#{gmSubscriptionsListDTOMB.goToAdd()}" 
                                          style="float:right" 
                                          rendered="#{(userData.userScreens['gmsubscriptions'].add)  or userData.isAdmin}"/>

                        <p:outputPanel  >
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" onkeyup="PF('bTable').filter()" style="width:150px" />
                        </p:outputPanel>
                    </f:facet>
                       <p:column  style="width: 10vh;font-size: 1.6vh;border-radius: 0px;"  filterStyle="display:none" 
                               filterBy="#{invInvoicePurchaseTable.organizationSiteId.name}" 
                               filterMatchMode="contains" 
                               headerText="اسم العميل"
                               sortBy="#{invInvoicePurchaseTable.organizationSiteId.name}"
                               >
                           <p:outputLabel value="#{invInvoicePurchaseTable.organizationSiteId.name}" />
                           
                    </p:column>
                       <p:column  style="width: 10vh;font-size: 1.6vh;border-radius: 0px;"  filterStyle="display:none" 
                               filterBy="#{invInvoicePurchaseTable.organizationSiteId.phone}" 
                               filterMatchMode="contains" 
                               headerText="رقم الهاتف"
                               sortBy="#{invInvoicePurchaseTable.organizationSiteId.phone}"
                               >
                           <p:outputLabel value="#{invInvoicePurchaseTable.organizationSiteId.phone}" />
                    </p:column>

                    <p:column  style="width: 10vh;font-size: 1.6vh;border-radius: 0px;"  filterStyle="display:none" 
                               filterBy="#{invInvoicePurchaseTable.serial}" 
                               filterMatchMode="contains" 
                               headerText="#{userData.userDDs['INVOICE_NO']}"
                               sortBy="#{invInvoicePurchaseTable.serial}"
                               >
                        <p:outputLabel value="#{invInvoicePurchaseTable.serial}" />
                    </p:column>



                    <p:column  style="width: 10vh;font-size: 1.6vh;border-radius: 0px;"  filterStyle="display:none" 
                               filterBy="#{invInvoicePurchaseTable.status}" 
                               filterMatchMode="contains" 
                               headerText="حالة الاشتراك"
                               sortBy="#{invInvoicePurchaseTable.status}"
                               >
                        <p:outputLabel value="#{invInvoicePurchaseTable.status eq false ? 'سارى' : 'معلق'}" />
                    </p:column>

                    <p:column style="width: 9vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px;" filterStyle="display:none" 
                              filterBy="#{invInvoicePurchaseTable.date}" 
                              filterMatchMode="contains"
                              headerText="#{userData.userDDs['DATEE']}"
                              sortBy="#{invInvoicePurchaseTable.date}" 
                              >
                        <p:outputLabel value="#{invInvoicePurchaseTable.date}" >
                            <f:convertDateTime type="date" pattern="dd-MM-yyyy"/>
                        </p:outputLabel>                           
                    </p:column>

                    <p:column style="width: 9vh;font-size: 1.8vh;border-radius: 0px;" filterStyle="display:none"
                              filterBy="#{invInvoicePurchaseTable.startDate}"
                              filterMatchMode="contains" 
                              headerText="بداية الاشتراك"
                              sortBy="#{invInvoicePurchaseTable.startDate}" 
                              >
                        <p:outputLabel value="#{invInvoicePurchaseTable.startDate}" >
                            <f:convertDateTime type="date" pattern="dd-MM-yyyy"/>
                        </p:outputLabel> 
                    </p:column>
                    <p:column style="width: 8vh;font-size: 1.8vh;border-radius: 0px;" filterStyle="display:none"
                              filterBy="#{invInvoicePurchaseTable.endDate}"
                              filterMatchMode="contains" 
                              headerText="نهاية الاشتراك"
                              sortBy="#{invInvoicePurchaseTable.endDate}" 
                              >
                        <p:outputLabel value="#{invInvoicePurchaseTable.endDate}" >
                            <f:convertDateTime type="date" pattern="dd-MM-yyyy"/>
                        </p:outputLabel> 
                    </p:column>

                    <p:column style="width: 8vh;font-size: 1.8vh;border-radius: 0px;" filterStyle="display:none"
                              filterBy="#{invInvoicePurchaseTable.dateAfterTagmeed}"
                              filterMatchMode="contains" 
                              headerText="نهاية الاشتراك بعد التمديد"
                              sortBy="#{invInvoicePurchaseTable.dateAfterTagmeed}" 
                              >
                        <p:outputLabel value="#{invInvoicePurchaseTable.dateAfterTagmeed}" >
                            <f:convertDateTime type="date" pattern="dd-MM-yyyy"/>
                        </p:outputLabel> 
                    </p:column>

                    <p:column style="width: 8vh;font-size: 1.8vh;border-radius: 0px;" filterStyle="display:none"
                              filterBy="#{invInvoicePurchaseTable.remainPeriod}"
                              filterMatchMode="contains" 
                              headerText="المدة المتبقية"
                              sortBy="#{invInvoicePurchaseTable.remainPeriod}" 
                              >
                        <p:outputLabel value="#{invInvoicePurchaseTable.remainPeriod}"/>
                    </p:column>

                    <p:column style="width: 10vh;font-size: 1.8vh;border-radius: 0px;" filterStyle="display:none"
                              filterBy="#{invInvoicePurchaseTable.remarks}"
                              filterMatchMode="contains" 
                              headerText="#{userData.userDDs['NOTE']}"
                              sortBy="#{invInvoicePurchaseTable.remarks}" >
                        <p:outputLabel value="#{invInvoicePurchaseTable.remarks}" />
                    </p:column>
                    <p:column  style="width: 12vh;font-size: 1.8vh;text-align:center;border-radius: 0px;" headerText="#{userData.userDDs['TRANSACTION']}" >
                        <p:commandButton   onclick="form.target = '_blank'"  ajax="false"
                                           update="@form" 
                                           class="smsearchButtons"
                                           icon="fa fa-fw fa-search-plus"  style="background-color: rgba(63, 81, 181, 0.88);border-radius: 3px;"
                                           title="#{userData.userDDs['VIEW']}" 
                                           action="#{gmSubscriptionsListDTOMB.goToEdit()}" 
                                           rendered="#{userData.userScreens['gmsubscriptions'].edit or userData.isAdmin}" >

                            <f:setPropertyActionListener value="#{invInvoicePurchaseTable}" 
                                                         target="#{gmSubscriptionsListDTOMB.gmSubscriptionsDTOSelected}" />
                        </p:commandButton>

                        <p:commandButton update="@form" 
                                         class="sdeleteButtons"
                                         icon="fa fa-remove" 
                                         style="background-color: red;border-radius: 3px;"
                                         title="#{userData.userDDs['DELETE']}" 
                                         action="#{gmSubscriptionsListDTOMB.delete()}" 
                                         rendered="#{(userData.userScreens['gmsubscriptions'].delete or userData.isAdmin)}">
                            <f:setPropertyActionListener value="#{invInvoicePurchaseTable}" target="#{gmSubscriptionsListDTOMB.gmSubscriptionsDTOSelected}" />
                            <p:confirm header="Confirmation" message="#{userData.userDDs['ARE_YOU_SURE']}" icon="ui-icon-alert" />

                        </p:commandButton>

                        <p:commandButton style="margin-right: 40%" update="@form"  value="تجميد"  action ="#{gmSubscriptionsListDTOMB.findCustomerData()}"> 
                            <f:setPropertyActionListener value="#{invInvoicePurchaseTable}" target="#{gmSubscriptionsListDTOMB.gmSubscriptionsDTOSelected}" />
                        </p:commandButton>
                        <p:commandButton style="margin-right: 40%" update="@form"  value="تمديد"  action ="#{gmSubscriptionsListDTOMB.goToresume()}"> 
                            <f:setPropertyActionListener value="#{invInvoicePurchaseTable}" target="#{gmSubscriptionsListDTOMB.gmSubscriptionsDTOSelected}" />
                        </p:commandButton>
                    </p:column>
                </p:dataTable>



                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                    <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                    <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                </p:confirmDialog>

            </p:fieldset>

            <div class="ui-g-12 ui-xl-12">
                <div class="ui-g-6 ui-xl-6"/>
                <div class="ui-g-6 ui-xl-6">

                    <p:dialog header="إضافة عميل جديد" widgetVar="dlg3" showEffect="explode" hideEffect="bounce" height="90%" width="90%">


                        <p:fieldset legend="انشاءعميل جديد"  style="margin-bottom:5px">

                            <div class="col-xs-12">
                                <p:messages autoUpdate="true"  id="msgopp" showDetail="true" closable="true" />
                            </div>
                            <div  id="firstLine" class="ui-g-12 ui-g-nopad">
                                <div class="ui-g">


                                    <div class="ui-g-6 ui-xl-6">
                                        <div class="ui-g-12 ui-xl-12">

                                            <div class="ui-g-6 ui-xl-6">
                                                <h:outputText style="width: 35%!important" id="ad0"  value="#{gmSubscriptionsListDTOMB.siteDTO.name}"/>
                                            </div>
                                            <div class="ui-g-6 ui-xl-6">
                                                <p:outputLabel style="width: 85px;margin-right: 3%;" value="اسم العميل"/>

                                            </div>
                                        </div>
                                           <div class="ui-g-12 ui-xl-12">

                                            <div class="ui-g-6 ui-xl-6">
                                                <h:outputText style="width: 35%!important" id="ad333"  value="#{gmSubscriptionsListDTOMB.siteDTO.phone}"/>
                                            </div>
                                            <div class="ui-g-6 ui-xl-6">
                                                <p:outputLabel style="width: 85px;margin-right: 3%;" value="رقم الهاتف"/>

                                            </div>
                                        </div>


                                        <div class="ui-g-12 ui-xl-12">

                                            <div class="ui-g-6 ui-xl-6">
                                                <p:outputLabel style="width: 35%!important" id="ad191"  value="#{gmSubscriptionsListDTOMB.siteDTO.birthdate}">
                                                    <f:convertDateTime type="date" pattern="dd-MM-yyyy hh:mm:ss"/>
                                                </p:outputLabel>
                                            </div>
                                            <div class="ui-g-6 ui-xl-6">
                                                <p:outputLabel style="width: 85px;margin-right: 3%;" value="تاريخ الميلاد">
                                                </p:outputLabel>

                                            </div>
                                        </div>
                                        <div class="ui-g-12 ui-xl-12">

                                            <div class="ui-g-6 ui-xl-6">
                                                <p:outputLabel style="width: 35%!important" id="ad211"  value="#{gmSubscriptionsListDTOMB.gmSubscriptionsDTOSelected.startDate}">
                                                    <f:convertDateTime type="date" pattern="dd-MM-yyyy hh:mm:ss"/>
                                                </p:outputLabel>
                                            </div>
                                            <div class="ui-g-6 ui-xl-6">
                                                <p:outputLabel style="width: 85px;margin-right: 3%;" value="تاريخ الاشتراك ">
                                                </p:outputLabel>
                                            </div>
                                        </div>
                                        <div class="ui-g-12 ui-xl-12">

                                            <div class="ui-g-6 ui-xl-6">
                                                <p:outputLabel style="width: 35%!important" id="ad131"  value="#{gmSubscriptionsListDTOMB.gmSubscriptionsDTOSelected.endDate}">
                                                    <f:convertDateTime type="date" pattern="dd-MM-yyyy hh:mm:ss"/>
                                                </p:outputLabel>
                                            </div>
                                            <div class="ui-g-6 ui-xl-6">
                                                <p:outputLabel style="width: 85px;margin-right: 3%;" value="تاريخ نهايه الاشتراك ">
                                                    
                                                </p:outputLabel>
                                            </div>
                                        </div>

                                        <div class="ui-g-12 ui-xl-12">

                                            <div class="ui-g-6 ui-xl-6">
                                                <h:outputText style="width: 35%!important" id="ad141"  value="#{gmSubscriptionsListDTOMB.gmSubscriptionsDTOSelected.gmItemDTO.name}"/>
                                            </div>
                                            <div class="ui-g-6 ui-xl-6">
                                                <p:outputLabel style="width: 85px;margin-right: 3%;" value="النشاط المشترك فيه  "/>

                                            </div>
                                        </div>
                                        
                                        <div class="ui-g-12 ui-xl-12">

                                            <div class="ui-g-6 ui-xl-6">
                                                <h:outputText style="width: 35%!important" id="ad1911"  value="#{gmSubscriptionsListDTOMB.gmSubscriptionsDTOSelected.status eq true ? 'مفعل':'غير مفعل '}"/>
                                            </div>
                                            <div class="ui-g-6 ui-xl-6">
                                                <p:outputLabel style="width: 85px;margin-right: 3%;" value="حاله الاشتراك  "/>

                                            </div>
                                        </div>
                                        <div class="ui-g-12 ui-xl-12">

                                            <div class="ui-g-6 ui-xl-6">
                                                <p:graphicImage url="#{gmSubscriptionsListDTOMB.host.concat(gmSubscriptionsListDTOMB.gmSubscriptionsDTOSelected.organizationSiteId.clientImage)}" library="demo"  style="max-width:80%;max-height:80%;object-fit: cover !important;"/>
                                            </div>

                                            <div class="ui-g-6 ui-xl-6">
                                                <p:outputLabel style="width: 65px" value="صورة العميل"/>
                                            </div>  
                                        </div>
                                        <div class="ui-g-12 ui-xl-12">

                                            <div class="ui-g-6 ui-xl-6">
                                                <p:inputText style="width: 35%!important" id="ad1"  value="#{gmSubscriptionsListDTOMB.gmFreezeDto.number}">
                                                    <p:ajax event="blur" listener="#{gmSubscriptionsListDTOMB.calcDate()}" update="dateto" />
                                                </p:inputText>
                                            </div>
                                            <div class="ui-g-6 ui-xl-6">
                                                <p:outputLabel style="width: 85px;margin-right: 3%;" value="ايام التجميد "/>

                                            </div>
                                        </div>
                                        <div class="ui-g-12 ui-xl-12">

                                            <div class="ui-g-6 ui-xl-6">
                                                <p:outputLabel style="width: 85px;margin-right: 3%;" value="#{gmSubscriptionsListDTOMB.gmFreezeDto.datefrom}">
                                                    <f:convertDateTime type="date" pattern="dd-MM-yyyy"/>
                                                </p:outputLabel>

                                            </div>
                                            <div class="ui-g-6 ui-xl-6">
                                                <p:outputLabel style="width: 75px;margin-right: 6%"  value="#{userData.userDDs['YEAR_FROM']}" />

                                            </div>
                                        </div>
                                        <div class="ui-g-12 ui-xl-12">

                                            <div class="ui-g-6 ui-xl-6">
                                                <p:outputLabel id="dateto" style="width: 85px;margin-right: 3%;" value="#{gmSubscriptionsListDTOMB.gmFreezeDto.dateto}">
                                                    <f:convertDateTime type="date" pattern="dd-MM-yyyy"/>
                                                </p:outputLabel>
                                            </div>
                                            <div class="ui-g-6 ui-xl-6">
                                                <p:outputLabel style="width: 75px;margin-right: 6%"  value="#{userData.userDDs['TO_DATE']}" />

                                            </div>
                                        </div>
                                        <div class="ui-g-12 ui-xl-12">

                                            <div class="ui-g-6 ui-xl-6">
                                                <p:outputLabel style="width: 85px;margin-right: 3%;" value="#{gmSubscriptionsListDTOMB.gmFreezeDto.mustDays}">

                                                </p:outputLabel>

                                            </div>
                                            <div class="ui-g-6 ui-xl-6">
                                                <p:outputLabel style="width: 75px;margin-right: 6%"  value="الايام المستحقة" />

                                            </div>
                                        </div>
                                        <div class="ui-g-12 ui-xl-12">

                                            <div class="ui-g-6 ui-xl-6">
                                                <p:outputLabel style="width: 85px;margin-right: 3%;" value="#{gmSubscriptionsListDTOMB.gmFreezeDto.takeDays}">

                                                </p:outputLabel>

                                            </div>
                                            <div class="ui-g-6 ui-xl-6">
                                                <p:outputLabel style="width: 75px;margin-right: 6%"  value="الايام تم تجميدها" />

                                            </div>
                                        </div>
                                        <div class="ui-g-12 ui-xl-12">

                                            <div class="ui-g-6 ui-xl-6">
                                                <p:outputLabel style="width: 85px;margin-right: 3%;" value="#{gmSubscriptionsListDTOMB.gmFreezeDto.remainDays}">

                                                </p:outputLabel>

                                            </div>
                                            <div class="ui-g-6 ui-xl-6">
                                                <p:outputLabel style="width: 75px;margin-right: 6%"  value="الايام المتبقية" />

                                            </div>
                                        </div>

                                    </div>                        
                                </div>
                            </div>






                        </p:fieldset>

                        <h:panelGroup>
                            <div class="asmaa">
                                <p:commandButton  class="saveButton"  
                                                  id="saveB" 
                                                  title="#{userData.userDDs['SAVE']}"
                                                  value="#{userData.userDDs['SAVE']}" 
                                                  style=""
                                                  action="#{gmSubscriptionsListDTOMB.saveFreeze()}" 
                                                  update="@form"/>





                            </div>

                        </h:panelGroup>

                    </p:dialog>
                </div>
            </div>
        </h:form>
    </ui:define>
</ui:composition>
