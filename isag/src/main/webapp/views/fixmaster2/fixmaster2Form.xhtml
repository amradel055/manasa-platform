<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/newTemplate.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <h:form class='formmargin' id="form"  enctype="multipart/form-data"  dir="#{userData.dir}">
            <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                  margin-top: 24%;
                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;"
                                  icon="fa fa-fw fa-home"
                                  title="#{userData.userDDs['HOME']}"
                                  class="smhomeButton" 
                                  action="exit" />

            </div>
            <p:fieldset legend="البيانات الاساسية لللأصول المالية" style="margin-bottom:20px">

                <p:messages autoUpdate="true" id="messages" showDetail="true" closable="true"/> 
                <div class="row">

                    <div class="col-sm-6">
                        <h:panelGrid id="pnl1" columns="2" cellspacing="20" cellpadding="0" >

                            <h:panelGroup>
                                <h:panelGroup> 
                                    <p:outputLabel style="width: 92px;margin-right: 4%;" value="رقم ملف الأصل"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <h:outputLabel  style="width: 48%" id="id1" value="" />
                                </h:panelGroup>
                            </h:panelGroup>
                        </h:panelGrid>
                    </div>
                    
                    <div class="col-sm-6">
                        <h:panelGrid id="pnl" columns="2" cellspacing="20" cellpadding="0" >

                            <h:panelGroup>
                                <h:panelGroup> 
                                    <p:outputLabel style="width: 92px;margin-right: 4%;" value="رقم الأصل"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <h:outputLabel style="width: 48%" id="id" value="" />
                                </h:panelGroup>
                            </h:panelGroup>
                        </h:panelGrid>
                    </div>

                    <div class="col-sm-12">
                        <h:panelGrid> 
                            <h:panelGroup> 
                                <h:panelGroup>
                                    <p:outputLabel style="width:95px;margin-right: 4%;" value="بيان الأصل"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:inputText   style="width: 48%!important" id="name" a:autofocus="true" value="#{invGroupFormBean.invGroupEntity.name}" />
                                </h:panelGroup>
                            </h:panelGroup> 
                        </h:panelGrid>
                    </div>
                    
                    <div class="col-sm-12">
                        <h:panelGrid> 
                            <h:panelGroup> 
                                <h:panelGroup>
                                    <p:outputLabel style="width:95px;margin-right: 4%;" value="تكلفة الأصل"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:inputNumber   style="width: 48%!important" id="name13" a:autofocus="true" value="#{invGroupFormBean.invGroupEntity.name}" />
                                </h:panelGroup>
                            </h:panelGroup> 
                        </h:panelGrid>
                    </div>
                    
                    <div class="ui-g-12 ui-md-12">
                                    <h:panelGroup>
                                        <h:panelGroup>
                                            <p:outputLabel  style="width: 89px;margin-right: 4%;" value="تاريخ بدء الخدمة"/>
                                        </h:panelGroup>
                                        <h:panelGroup>
                                            <p:calendar id="dateFrom" 
                                                        value="#{subAccountSummaryReportMB.subAccountSummarySearchBean.dateFrom}" 
                                                        pattern="dd/MM/yyyy" 
                                                        style="width:50%" 
                                                        showButtonPanel="true"
                                                        >
                                            </p:calendar>
                                        </h:panelGroup>
                                    </h:panelGroup>
                    </div>
                    
                    <div class="col-sm-12">
                        <h:panelGrid> 
                            <h:panelGroup> 
                                <h:panelGroup>
                                    <p:outputLabel style="width:95px;margin-right: 4%;" value="نسبة الاهلاك"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:inputText   style="width: 48%!important" id="name5" a:autofocus="true" value="#{invGroupFormBean.invGroupEntity.name}" />
                                </h:panelGroup>
                            </h:panelGroup> 
                        </h:panelGrid>
                    </div>
                    
                    <div class="col-sm-12">
                        <h:panelGrid> 
                            <h:panelGroup> 
                                <h:panelGroup> 
                                    <p:outputLabel  style="width:108px;margin-right: 2%;" value="مركز التكلفة"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:autoComplete style="width:38%" id="Cost_Center_From2" 
                                                    dropdown="true"
                                                    converter="#{invGroupFormBean.invGroupConverter}"
                                                    value="#{invGroupFormBean.invGroupEntity.invGroupParentId}"

                                                    var="group"
                                                    itemLabel="#{group}" 
                                                    itemValue="#{group}" 
                                                    forceSelection="true" 
                                                    completeMethod="#{invGroupFormBean.completeInvGroups}" >
                                    </p:autoComplete>
                                </h:panelGroup>
                            </h:panelGroup>
                        </h:panelGrid>
                    </div>
                    
                    <div class="col-sm-12">
                        <h:panelGrid> 
                            <h:panelGroup> 
                                <h:panelGroup> 
                                    <p:outputLabel  style="width:108px;margin-right: 2%;" value="الوحدة الادارية"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:autoComplete style="width:38%" id="Cost_Center_From3" 
                                                    dropdown="true"
                                                    converter="#{invGroupFormBean.invGroupConverter}"
                                                    value="#{invGroupFormBean.invGroupEntity.invGroupParentId}"

                                                    var="group"
                                                    itemLabel="#{group}" 
                                                    itemValue="#{group}" 
                                                    forceSelection="true" 
                                                    completeMethod="#{invGroupFormBean.completeInvGroups}" >
                                    </p:autoComplete>
                                </h:panelGroup>
                            </h:panelGroup>
                        </h:panelGrid>
                    </div>
                    
                    <div class="col-sm-12">
                        <h:panelGrid> 
                            <h:panelGroup> 
                                <h:panelGroup> 
                                    <p:outputLabel  style="width:108px;margin-right: 2%;" value="رصيد حساب الأصل"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:autoComplete style="width:38%" id="Cost_Center_From4" 
                                                    dropdown="true"
                                                    converter="#{invGroupFormBean.invGroupConverter}"
                                                    value="#{invGroupFormBean.invGroupEntity.invGroupParentId}"

                                                    var="group"
                                                    itemLabel="#{group}" 
                                                    itemValue="#{group}" 
                                                    forceSelection="true" 
                                                    completeMethod="#{invGroupFormBean.completeInvGroups}" >
                                    </p:autoComplete>
                                </h:panelGroup>
                            </h:panelGroup>
                        </h:panelGrid>
                    </div>
                    
                    <div class="col-sm-12">
                        <h:panelGrid> 
                            <h:panelGroup> 
                                <h:panelGroup> 
                                    <p:outputLabel  style="width:108px;margin-right: 2%;" value="رصيد حساب الاهلاك السنوي"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:autoComplete style="width:38%" id="Cost_Center_From5" 
                                                    dropdown="true"
                                                    converter="#{invGroupFormBean.invGroupConverter}"
                                                    value="#{invGroupFormBean.invGroupEntity.invGroupParentId}"

                                                    var="group"
                                                    itemLabel="#{group}" 
                                                    itemValue="#{group}" 
                                                    forceSelection="true" 
                                                    completeMethod="#{invGroupFormBean.completeInvGroups}" >
                                    </p:autoComplete>
                                </h:panelGroup>
                            </h:panelGroup>
                        </h:panelGrid>
                    </div>
                    
                    <div class="col-sm-12">
                        <h:panelGrid> 
                            <h:panelGroup> 
                                <h:panelGroup> 
                                    <p:outputLabel  style="width:108px;margin-right: 2%;" value="رصيد حساب مجمع الاهلاك"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:autoComplete style="width:38%" id="Cost_Center_From6" 
                                                    dropdown="true"
                                                    converter="#{invGroupFormBean.invGroupConverter}"
                                                    value="#{invGroupFormBean.invGroupEntity.invGroupParentId}"

                                                    var="group"
                                                    itemLabel="#{group}" 
                                                    itemValue="#{group}" 
                                                    forceSelection="true" 
                                                    completeMethod="#{invGroupFormBean.completeInvGroups}" >
                                    </p:autoComplete>
                                </h:panelGroup>
                            </h:panelGroup>
                        </h:panelGrid>
                    </div>
                    
                    <div class="col-sm-12">
                        <h:panelGrid> 
                            <h:panelGroup> 
                                <h:panelGroup> 
                                    <p:outputLabel  style="width:108px;margin-right: 2%;" value="رصيد حساب أ خ بيع الاصل"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:autoComplete style="width:38%" id="Cost_Center_From7" 
                                                    dropdown="true"
                                                    converter="#{invGroupFormBean.invGroupConverter}"
                                                    value="#{invGroupFormBean.invGroupEntity.invGroupParentId}"

                                                    var="group"
                                                    itemLabel="#{group}" 
                                                    itemValue="#{group}" 
                                                    forceSelection="true" 
                                                    completeMethod="#{invGroupFormBean.completeInvGroups}" >
                                    </p:autoComplete>
                                </h:panelGroup>
                            </h:panelGroup>
                        </h:panelGrid>
                    </div>
                   
                </div>


                <h:panelGrid  class="centerButtons col-md-12"  columns="1" >

                    <h:panelGroup > 
                        <p:commandButton   class="saveButtons" 
                                           id="saveB" 
                                           title="#{userData.userDDs['SAVE']}"
                                           value="#{userData.userDDs['SAVE']}" 
                                           style="color: #fff!important;background-color: #2196F3!important;margin-left: 5px"
                                           action="#{invGroupFormBean.save()}" 
                                           update="@form"/>

                        <p:commandButton  class="newButtons" 
                                          id="newN"
                                          ajax="false"
                                          style="color: #fff!important;background-color: #9c27b0d1!important;margin-left: 5px"
                                          value="#{userData.userDDs['NEW']}" 
                                          title="#{userData.userDDs['NEW']}" 
                                          onclick="form.target = ''" 
                                          actionListener="#{invGroupFormBean.reset()}"/>


                        <p:commandButton  class="closeButtons"
                                          title="#{userData.userDDs['CANCEL']}" 
                                          immediate="true"
                                          value="#{userData.userDDs['CANCEL']}"
                                          style="color: #fff!important;background-color: #035C70!important;margin-left: 5px"
                                          action="#{invGroupFormBean.exit()}"   />

                    </h:panelGroup> 

                    <p:blockUI block="pnl" trigger="saveB" animate="true" >

                        <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                    </p:blockUI> 

                </h:panelGrid>




            </p:fieldset>
