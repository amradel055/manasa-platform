<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/newTemplate.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <h:form id="ScreenAddEditForm" enctype="multipart/form-data" dir="#{userData.dir}" class='formmargin'>
            <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                  margin-top: 12%;
                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;"
                                  icon="fa fa-fw fa-home"
                                  title="#{userData.userDDs['HOME']}"
                                  class="smhomeButton" 
                                  action="exit" />  
            </div>
            <p:fieldset legend="تفاصيل النشاطات" style="margin-bottom:20px">

                <p:dataTable id="activities"
                             widgetVar="activities"
                             style="margin-bottom:20px"
                             var="activities"
                             rowIndexVar="index" 
                             dir="rtl" 
                             emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                             selectionMode="single"
                             sortBy="#{1}"
                             rowKey="#{activities.index}"
                             selection="#{crmLeadsEventFormDTOMB.invOrganizationSiteDTO.crmEventDTOSelected}"
                             value="#{crmLeadsEventFormDTOMB.invOrganizationSiteDTO.crmEventDTOList}" >

                    <p:column headerText="#" style="width: 4vh;text-align:center;border-radius: 0px" >
                        <h:outputText value="#{index + 1}"  />
                    </p:column>

                    <p:column style="width: 13vh;text-align: -webkit-auto;border-radius: 0px" id="subject" headerText="الموضوع" 
                              filterBy="#{activities.subject}" 
                              filterMatchMode="contains" 
                              sortBy="#{activities.subject}"
                              filterable="false">
                        <p:outputLabel value="#{activities.subject}" />            
                    </p:column>
                    <p:column style="width: 8vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px;" filterStyle="display:none" 
                              filterBy="#{activities.startDate}" 
                              filterMatchMode="contains"
                              headerText="تاريخ البداية"
                              sortBy="#{activities.startDate}" 
                              >
                        <p:outputLabel value="#{activities.startDate}" >
                            <f:convertDateTime type="date" pattern="dd-MM-yyyy"/>
                        </p:outputLabel>                           
                    </p:column>
                    <p:column style="width: 8vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px;" filterStyle="display:none" 
                              filterBy="#{activities.startDate}" 
                              filterMatchMode="contains"
                              headerText="توقيت البداية"
                              sortBy="#{activities.startDate}" 
                              >
                        <p:outputLabel value="#{activities.startDate}" >
                            <f:convertDateTime type="date" pattern="hh:mm:ss"/>
                        </p:outputLabel>                           
                    </p:column>
                    <p:column style="width: 13vh;text-align: -webkit-auto;border-radius: 0px" id="activityType" headerText="نوع النشاط" 
                              filterBy="#{activities.activityType.name}" 
                              filterMatchMode="contains" 
                              sortBy="#{activities.activityType.name}"
                              filterable="false">
                        <p:outputLabel value="#{activities.activityType.name}" />            
                    </p:column>
                    <p:column style="width: 13vh;text-align: -webkit-auto;border-radius: 0px" id="symbolPriority" headerText="الوصف" 
                              filterBy="#{activities.discription}" 
                              filterMatchMode="contains" 
                              sortBy="#{activities.discription}"
                              filterable="false">
                        <p:outputLabel value="#{activities.discription}" />            
                    </p:column>
                  
                    <p:column style="width: 13vh;text-align: center;border-radius: 0px" headerText="#{userData.userDDs['TRANSACTION']}">
                        <p:commandButton  
                            update="@form" 
                            class="smsearchButtons" onclick="form.target = '_blank'"  ajax="false"
                            icon="fa fa-fw fa-search-plus"  style="background-color: rgba(63, 81, 181, 0.88);border-radius: 3px;"
                            title="#{userData.userDDs['VIEW']}" 
                            action="#{crmLeadsEventFormDTOMB.goToEventEdit(activities.id)}"  >
                        </p:commandButton>
                    </p:column >

                </p:dataTable>

            </p:fieldset>

        </h:form>
    </ui:define>

</ui:composition>
