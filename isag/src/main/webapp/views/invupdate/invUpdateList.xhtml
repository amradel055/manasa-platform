<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form  class='formmargin' dir="#{userData.dir}"  id="form">
            <div style=" position: absolute;left: 20px"> 
                <p:commandButton  style="z-index: 2;
                                  margin-top: 24%;
                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;"
                                  icon="fa fa-fw fa-home"
                                  title="#{userData.userDDs['HOME']}"
                                  class="smhomeButton" 
                                  action="exit" />                       
            </div>
            <p:fieldset   legend="#{userData.userDDs['ADJUST_INV']}" >


                <p:dataTable
                    draggableColumns="true"
                    var="invUpdateTable" widgetVar="bTable"  rowIndexVar="index"
                    value="#{invUpdateListMB.invUpdateEntityList}" rows="#{userData.rowListCount}"
                    paginator="true" emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                    id="invUpdatenTable">

                    <f:facet name="header">

                        <p:commandButton class="saddButton"
                                         icon="fa fa-plus" 
                                         id="addA"
                                         title="#{userData.userDDs['ADD']}"
                                         action="#{invUpdateListMB.goToAdd()}" style="float:right"
                                         rendered="#{(userData.userScreens['invupdate'].add)  or userData.isAdmin}"/>

                        <p:blockUI block="form" trigger="addA" animate="true" >

                            <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                        </p:blockUI> 
                        <p:commandButton  icon="fa fa-plus" 
                                          class="saddButton"
                                          title="#{userData.userDDs['ADD']}"  value="سيراميك"
                                          action="#{invUpdateListMB.goToAddCeramic()}" 
                                          style="float:right" 
                                          rendered="#{(userData.userScreens['invupdate'].add and userData.userBranch.companyActivity eq 'CERAMIC') or userData.isAdmin}"/>

                        <p:outputPanel  >
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" onkeyup="PF('bTable').filter()" style="width:150px" />
                        </p:outputPanel>

                    </f:facet>

                    <p:column style="width: 4vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px" filterStyle="display:none" filterBy="#{invUpdateTable.serial}"
                              filterMatchMode="contains" headerText="#{userData.userDDs['TRANSACTION_NO']}" sortBy="#{invUpdateTable.serial}">
                        <p:outputLabel value="#{invUpdateTable.serial}" />
                    </p:column>

                    <p:column style="width: 5vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px" filterStyle="display:none" filterBy="#{invUpdateTable.updateDocument}"
                              filterMatchMode="contains" headerText="#{userData.userDDs['INVEN_DOC']}" sortBy="#{invUpdateTable.updateDocument}" >
                        <p:outputLabel value="#{invUpdateTable.updateDocument}"/>
                    </p:column>
                    <p:column style="width: 4vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px" filterStyle="display:none" filterBy="#{invUpdateTable.setCounter(counter)}"
                              filterMatchMode="contains" headerText="#{userData.userDDs['DATEE']}" sortBy="#{invUpdateTable.updateDate}" >
                        <p:outputLabel value="#{invUpdateTable.updateDate}" >
                            <f:convertDateTime type="date" pattern="dd-MM-yyyy"/>
                        </p:outputLabel>
                    </p:column>
                    <p:column style="width: 9vh;font-size: 1.8vh;border-radius: 0px" filterStyle="display:none"
                              filterBy="#{invUpdateTable.createdBy.name}"
                              filterMatchMode="contains" 
                              headerText="القائم على الحركة"
                              sortBy="#{invUpdateTable.createdBy.name}" >
                        <p:outputLabel value="#{invUpdateTable.createdBy.name}" />
                    </p:column>
                    <p:column style="width: 8vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px" filterStyle="display:none" filterBy="#{invUpdateTable.remark}"
                              filterMatchMode="contains" headerText="#{userData.userDDs['NOTE']}" sortBy="#{invUpdateTable.remark}" >
                        <p:outputLabel value="#{invUpdateTable.remark}" />
                    </p:column>


                    <p:column style="width: 4vh;font-size: 1.8vh;text-align: center;border-radius: 0px" headerText="#{userData.userDDs['TRANSACTION']}" >
                        <p:commandButton class="seditButtons" update="@form" icon="fa fa-fw fa-edit" title="#{userData.userDDs['EDIT']}" action="#{invUpdateListMB.goToEdit()}"
                                         rendered="#{(userData.userScreens['invupdate'].edit and userData.userBranch.companyActivity ne 'CERAMIC')  or userData.isAdmin}">
                            <f:setPropertyActionListener value="#{invUpdateTable.id}"  target="#{invUpdateListMB.invUpdateSelected}" />
                        </p:commandButton>
                        <p:commandButton class="seditButtons" update="@form" icon="fa fa-fw fa-edit" title="#{userData.userDDs['EDIT']}" action="#{invUpdateListMB.goToEditCeramic()}"
                                         rendered="#{(userData.userScreens['invupdate'].edit and userData.userBranch.companyActivity eq 'CERAMIC')  or userData.isAdmin}">
                            <f:setPropertyActionListener value="#{invUpdateTable.id}"  target="#{invUpdateListMB.invUpdateSelected}" />
                        </p:commandButton>
                        <p:commandButton class="sdeleteButtons" update="@form" icon="fa fa-remove" style="background-color: red;border-radius: 3px;" title="#{userData.userDDs['DELETE']}" 
                                         action="#{invUpdateListMB.delete}" rendered="#{userData.userScreens['invupdate'].delete or userData.isAdmin}">
                            <f:setPropertyActionListener value="#{invUpdateTable.id}" target="#{invUpdateListMB.invUpdateSelected}" />
                            <p:confirm header="Confirmation" message="#{userData.userDDs['ARE_YOU_SURE']}" icon="ui-icon-alert" />
                        </p:commandButton>
                    </p:column>

                </p:dataTable>
                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                    <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                    <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                </p:confirmDialog>
            </p:fieldset>
        </h:form>
    </ui:define>
</ui:composition>
