<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">

        <h:form class='formmargin' id="form"  enctype="multipart/form-data"  dir="#{userData.dir}">
            
            <p:fieldset legend="#{userData.userDDs['SALESPERSON_DATA']}" >    

                <div class="col-xs-12">
                    <p:messages autoUpdate="true" id="curmsg" showDetail="true" closable="true"/>   
                </div>

                <div  id="firstSegment" class="ui-g-12 ui-g-nopad">

                    <div class="ui-g">

                        <div class="ui-g-6 ui-xl-6">
                            
                              <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText style="width:50%!important" 
                                                 id="ad2"
                                                 a:autofocus="true"  
                                                 value="#{inventoryDelegatorFormBean.inventoryDelegator.name}"/>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width:70px;" value="#{userData.userDDs['DELEGATOR_NAME']}"/>

                                </div>
                            </div>
                           
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText style="width: 50%!important"
                                                 id="code" 
                                                 value="#{inventoryDelegatorFormBean.inventoryDelegator.code}">
                                        <p:ajax event="blur" listener="#{inventoryDelegatorFormBean.checkCodeExistence()}" update="form" />
                                    </p:inputText>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width:70px;" value="#{userData.userDDs['DELEGATOR_COD']}"/>

                                </div>
                            </div>
                            
                             <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText style="width: 50%!important" readonly="true" 
                                                 id="ad1" 
                                                 value="#{inventoryDelegatorFormBean.inventoryDelegator.id}"/>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width:70px;" value="#{userData.userDDs['DELEGATOR_NUMBER']}"/>

                                </div>
                            </div>
                            
                            
                          

                        </div>

                        <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText style="width:50%!important"  id="ad3" value="#{inventoryDelegatorFormBean.inventoryDelegator.mobile}"/>

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 70px;" value="#{userData.userDDs['PHONE']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText style="width:50%!important"  
                                                 id="ad4"
                                                 value="#{inventoryDelegatorFormBean.inventoryDelegator.commission}"/>
                                    <p:outputLabel value="%"/>

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 80px;" value="#{userData.userDDs['COMMISSION']}"/>

                                </div>
                            </div>
                        </div>







                    </div>
                </div>




                <h:panelGrid id="secondSegment" columns="1"  class="col-md-12"  >

                    <h:panelGroup class="centerButtons" style="margin-top: 1%">
                        <p:commandButton  class="saveButton" 
                                          id="saveB"
                                          title="#{userData.userDDs['SAVE']}"
                                          value="#{userData.userDDs['SAVE']}" 
                                          action="#{inventoryDelegatorFormBean.save()}" 
                                          update="@form"/>

                        <p:commandButton  class="newButton" 
                                          id="newN"
                                          ajax="false"
                                          value="#{userData.userDDs['NEW']}" 
                                          title="#{userData.userDDs['NEW']}" 
                                          onclick="form.target = ''" 
                                          actionListener="#{inventoryDelegatorFormBean.reset()}"/>


                        <p:commandButton class="closeButtons" 
                                         title="#{userData.userDDs['BACK']}"
                                         immediate="true" 
                                         value="#{userData.userDDs['BACK']}"
                                         action="#{inventoryDelegatorFormBean.cancel}"   />

                        <p:blockUI block="form" trigger="saveB" animate="true" >

                            <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                        </p:blockUI> 
                    </h:panelGroup>

                </h:panelGrid>

            </p:fieldset>
        </h:form>

    </ui:define>
</ui:composition>
