<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
      
 <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form  dir="#{userData.dir}" class='formmargin' id="form">
          
            <p:fieldset   legend="#{userData.userDDs['TENDER_PRICING']}" >

                 <div class="col-xs-12">
                    <p:messages id="curmsg" showDetail="true" rendered="true" closable="true"/>   
                </div>
                
                <p:dataTable 
                             var="rscTenderTable"
                             widgetVar="rscTenderTable" 
                             rowIndexVar="index"
                             value="#{rscPriceTenderListMB.rscPriceTenderDTOList}" 
                             rows="#{userData.rowListCount}"
                             paginator="true"
                             emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                             id="rscTenderTable">

                    <f:facet name="header" class="col-md-12">
                        <p:commandButton  class="saddButton" icon="fa fa-plus" title="#{userData.userDDs['ADD']}"
                                         id="addA"
                                         action="#{rscPriceTenderListMB.goToAdd()}" style="float:right"/>
                        <p:blockUI block="form" trigger="addA" animate="true" >

                            <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                        </p:blockUI> 

                        <p:outputPanel  >
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" onkeyup="PF('rscTenderTable').filter()" style="width:150px" />
                        </p:outputPanel>
                        
                    </f:facet>
        
                    <p:column  style="width: 5vh;font-size: 1.9vh;text-align:right;border-radius: 0px;" 
                               headerText="#" >
                        <p:outputLabel value="#{index +1}" />
                    </p:column>

                    <p:column style="width: 10vh;font-size: 1.9vh;text-align: -webkit-auto;border-radius: 0px;" 
                              filterStyle="display:none" filterBy="#{rscTenderTable.serial}"
                              filterMatchMode="contains" headerText="#{userData.userDDs['NUMB']}" sortBy="#{rscTenderTable.serial}">
                        <p:outputLabel value="#{rscTenderTable.serial}" />
                    </p:column>
                    <p:column style="width: 15vh;font-size: 1.9vh;text-align: -webkit-auto;border-radius: 0px;" filterStyle="display:none" filterBy="#{rscTenderTable.customerId}"
                              filterMatchMode="contains" headerText="#{userData.userDDs['OWNER']}" sortBy="#{rscTenderTable.customerId}">
                        <p:outputLabel value="#{rscTenderTable.customerId}"/>
                    </p:column>  
                    <p:column style="width: 15vh;font-size: 1.9vh;text-align: -webkit-auto;border-radius: 0px;" filterStyle="display:none" filterBy="#{rscTenderTable.date}"
                              filterMatchMode="contains" headerText="#{userData.userDDs['DATEE']}" sortBy="#{rscTenderTable.date}">
                        <p:outputLabel value="#{rscTenderTable.date}" >
                            <f:convertDateTime type="date" pattern="dd-MM-yyyy"/>
                        </p:outputLabel>
                    </p:column>
                    
                    <p:column style="width: 15vh;font-size: 1.9vh;text-align: -webkit-auto;border-radius: 0px;" filterStyle="display:none" filterBy="#{rscTenderTable.statusText}"
                              filterMatchMode="contains" headerText="#{userData.userDDs['STATUS']}" sortBy="#{rscTenderTable.statusText}">
                        <p:outputLabel value="#{rscTenderTable.statusText}"/>
                    </p:column>
                    <p:column style="width: 25vh;font-size: 1.9vh;text-align: -webkit-auto;border-radius: 0px;" filterStyle="display:none" filterBy="#{rscTenderTable.remark}"
                              filterMatchMode="contains" headerText="#{userData.userDDs['REMARK']}" sortBy="#{rscTenderTable.remark}">
                        <p:outputLabel value="#{rscTenderTable.remark}" />
                    </p:column>

                    <p:column style="width: 12vh;font-size: 1.9vh;text-align: centero;border-radius: 0px;" headerText="#{userData.userDDs['TRANSACTION']}">
                        
                        <p:commandButton  class="seditButtons" 
                                          icon="fa fa-fw fa-edit" 
                                          title="#{userData.userDDs['EDIT']}" style="background-color: #6a6967;border-radius: 3px;"
                                          action="#{rscPriceTenderListMB.goToEdit()}">
                            <f:setPropertyActionListener value="#{rscTenderTable}"  
                                                         target="#{rscPriceTenderListMB.rscPriceTenderDTOSelected}" />
                        </p:commandButton>
                        
                        <p:commandButton class="sdeleteButtons" update="@form" icon="fa fa-remove"
                                         title="#{userData.userDDs['DELETE']}" style="background-color: red;border-radius: 3px;" action="#{rscPriceTenderListMB.delete}"  disabled="#{rscTenderTable.active}">
                            <f:setPropertyActionListener value="#{rscTenderTable}" target="#{rscPriceTenderListMB.rscPriceTenderDTOSelected}" />
                            <p:confirm header="Confirmation" message="#{userData.userDDs['ARE_YOU_SURE']}" icon="ui-icon-alert" />
                        </p:commandButton>
                        <p:commandButton 
                                class="sprintButtons"
                                update="@form" onclick="form.target = '_blank'"  ajax="false"
                                icon="fa fa-fw fa-print" style="background-color: rgb(1, 76, 134)!important;border-radius: 3px;"
                                title="print" 
                                action="#{rscPriceTenderListMB.print()}" 
                                 >

                        <f:setPropertyActionListener value="#{rscTenderTable}" target="#{rscPriceTenderListMB.rscPriceTenderDTOSelected}" />
                            </p:commandButton>
                    </p:column>

                </p:dataTable> 
                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                    <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                    <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                </p:confirmDialog>
            </p:fieldset>
        </h:form>
    </ui:define>
</ui:composition>
