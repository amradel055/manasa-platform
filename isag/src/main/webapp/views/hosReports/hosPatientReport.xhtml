<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/newTemplate.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <link rel="stylesheet" type="text/css" href="../../resources/css/main.css" />
    <ui:define name="content">

        <h:body>
            <f:event listener="#{userData.authorize}" type="preRenderView" />
            <h:form  id="form" dir="#{userData.dir}"  class='formmargin'>
                <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                      margin-top: 22%;
                                      color: #035c70!important; 
                                      background-color: #223238!important;
                                      border: 1px solid #22323a!important;
                                      background: #22323a 50% 50% repeat-x!important;"
                                      icon="fa fa-fw fa-home"
                                      title="#{userData.userDDs['HOME']}"
                                      class="smhomeButton" 
                                      action="exit" />
                  
        </div>
                <p:fieldset  legend="#{userData.userDDs['PAT_GUIDE_REP']}"> 
                    
                   <div class="ui-g-12 ui-g-nopad">
                        <div class="ui-g" id="firstSegment">

                            <div class="ui-g-12">

                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel style="width: 45px;margin-right: 4%;" value="#{userData.userDDs['PATIENT']}"/>
                                    </h:panelGroup> 

                                    <h:panelGroup>
                                        <p:autoComplete style="width:20%!important"
                                                        dropdown="true"
                                                        converter="#{hosPatientReportMB.patientRegistrationConvertor}"
                                                        value="#{hosPatientReportMB.patientReportSearchBean.patient}"
                                                        var="patient"
                                                        itemLabel="#{patient}" 
                                                        itemValue="#{patient}"
                                                        forceSelection="true" 
                                                        completeMethod="#{hosPatientReportMB.completPatient}"
                                                        >

                                        </p:autoComplete>
                                    </h:panelGroup> 
                                </h:panelGroup>
                            </div>
                        </div>
                    </div>

                    <h:panelGroup>
                        <div  style="margin-top:1% ;margin-right:35%">

                            <p:commandButton   class="searchButton"
                                               title="#{userData.userDDs['SEARCH']}"
                                               action="#{hosPatientReportMB.search()}"
                                               id="saveB"
                                               value="#{userData.userDDs['SEARCH']}"
                                               update="PatientReportViewTable" 
                                               style="" />

                            <p:commandButton class="newButton"
                                             title="#{userData.userDDs['NEW']}" 
                                             immediate="true" 
                                             action="#{hosPatientReportMB.reset()}"
                                             update="form"
                                             value="#{userData.userDDs['NEW']}"
                                              style=""/>

                            <p:commandButton   class="printButton"  
                                               ajax="false"
                                               onclick="form.target = '_blank'"  
                                              style="color: #ecf0f1!important;border-radius: 5px;
background-color: grey !important;margin-left: 5px;"
                                               value="#{userData.userDDs['PRINT']}" 
                                               actionListener="#{hosPatientReportMB.exportPDF}"
                                               title="#{userData.userDDs['PRINT']}"
                                               immediate="true" />

                            <p:commandButton  class="closeButton" 
                                               style="" 
                                              title="#{userData.userDDs['BACK']}"
                                              action="exit"
                                              value="#{userData.userDDs['BACK']}"/>

                            <h:commandLink>  
                                <p:graphicImage name="/img/excel.jpg" width="24"/>  
                                <p:dataExporter type="xls"
                                                target="PatientReportViewTable" 
                                                fileName=" تقرير بيانات المرضى"
                                                postProcessor="#{hosPatientReportMB.postProcessXLS}" />  
                            </h:commandLink>
                        </div>

                    </h:panelGroup>

                </p:fieldset>
                <p:fieldset style="margin-top: 2%">

                    <p:dataTable style="margin-top: 2%"
                                 draggableColumns="true" 
                                 var="PatientReportViewTable" 
                                 widgetVar="PatientReportViewTable"  
                                 rowKey="#{PatientReportViewTable}"
                                 rowIndexVar="index" 
                                 value="#{hosPatientReportMB.patientReportViewBean}" 
                                 dir="rtl" 
                                 emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                                 id="PatientReportViewTable">
                        <f:facet name="header" class="col-md-12">

                            <p:outputPanel>
                                <h:outputText value="#{userData.userDDs['SEARCH']} : " 
                                              style="font-size: large;" />
                                <p:inputText id="globalFilter" 
                                             onkeyup="PF('PatientReportViewTable').filter()"
                                             style="width: 16%!important;" />
                            </p:outputPanel>
                        </f:facet>

                        <p:column   style="width: 8vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" headerText="#{userData.userDDs['PATIENT_CODE']}" >
                            <h:outputText value="#{PatientReportViewTable.code}" style="font-size: 1.5vh"/>
                        </p:column>



                        <p:column style="width: 12vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" filterStyle="display:none"
                                  headerText="#{userData.userDDs['NAME']}" >
                            <h:outputText value="#{PatientReportViewTable.name}" style="font-size: 1.5vh;width: 95%"/>
                        </p:column>

                        <p:column style="width: 10vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" 
                                  headerText="#{userData.userDDs['PHONE']}" >
                            <h:outputText value="#{PatientReportViewTable.phone}" style="font-size: 1.5vh;width: 95%"/>
                        </p:column>
                        <p:column style="width: 10vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" 
                                  headerText="#{userData.userDDs['ADDRESS']}" >
                            <h:outputText value="#{PatientReportViewTable.address}" style="font-size: 1.5vh;width: 95%"/>

                        </p:column> 
                        <p:column style="width: 10vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" 
                                  headerText="#{userData.userDDs['INSURANCE_COMP']}" >
                            <h:outputText value="#{PatientReportViewTable.parent}" style="font-size: 1.5vh;width: 95%"/>

                        </p:column>  

                    </p:dataTable>
                </p:fieldset>
            </h:form>
        </h:body>
    </ui:define>
</ui:composition>
