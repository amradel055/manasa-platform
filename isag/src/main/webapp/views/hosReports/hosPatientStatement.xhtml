<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/newTemplate.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />
      <h:form class='formmargin'  id="form" dir="#{userData.dir}">
         <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                      margin-top: 12%;
                                      color: #035c70!important; 
                                      background-color: #223238!important;
                                      border: 1px solid #22323a!important;
                                      background: #22323a 50% 50% repeat-x!important;"
                                      icon="fa fa-fw fa-home"
                                      title="#{userData.userDDs['HOME']}"
                                      class="smhomeButton" 
                                      action="exit" />
                <p:commandButton  style="z-index: 2;
                                      margin-top: 9%!important;
                                      color: #035c70!important; 
                                      background-color: #223238!important;
                                      border: 1px solid #22323a!important;
                                      background: #22323a 50% 50% repeat-x!important;" 
                                      class="viewButton sminimize"
                                      icon="fa fa-window-minimize"
                                      title="إظهار/إخفاء"/> 
            </div>
		<p:fieldset legend="#{userData.userDDs['PATIENT_ACC_STAT_REP']}" >
                
                <div class="col-xs-12">
                    <p:messages id="curmsg" showDetail="true" rendered="false" closable="true"/>   
                </div>


                <div class="ui-g-12 ui-g-nopad firstset">
                    <div class="ui-g"  style="margin-top: 1%"  id="firstSegment">

                        <div class="ui-g-12 ui-md-6">

                            <h:panelGroup>

                                <h:panelGroup> 
                                    <p:outputLabel style="width: 60px;margin-right: 6%;" value="#{userData.userDDs['FROM_CLINIC']}"  />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:autoComplete style="width: 34%" id="cli1" 
                                                    dropdown="true"
                                                    converter="#{hosDoctorTotalIncomeMB.hosClinicConverter}"
                                                    value="#{hosDoctorTotalIncomeMB.hosDoctorSearchBean.hosClinicIdFrom}"
                                                    immediate="true"

                                                    var="bank"
                                                    itemLabel="#{bank}" 
                                                    itemValue="#{bank}" 
                                                    forceSelection="true" 
                                                    completeMethod="#{hosDoctorTotalIncomeMB.completeClinicHosDoctor}" >
                                        <p:ajax update="form"
                                                event="change"
                                                listener="#{hosDoctorTotalIncomeMB.setSearchBeanInValidation}" />
                                        <p:ajax update="form"
                                                listener="#{hosDoctorTotalIncomeMB.setSearchBeanInValidation}"
                                                event="itemSelect"/>
                                    </p:autoComplete>
                                </h:panelGroup>

                            </h:panelGroup>  

                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>

                                <h:panelGroup > 
                                    <p:outputLabel style="width: 60px" value="#{userData.userDDs['TO_CLINIC']}"  />
                                </h:panelGroup>
                                <h:panelGroup  >
                                    <p:autoComplete style="width: 34%" id="cli2" 
                                                    dropdown="true"
                                                    converter="#{hosDoctorTotalIncomeMB.hosClinicConverter}"
                                                    value="#{hosDoctorTotalIncomeMB.hosDoctorSearchBean.hosClinicIdTo}"
                                                    immediate="true"
                                                    var="bank"
                                                    itemLabel="#{bank}" 
                                                    itemValue="#{bank}" 
                                                    forceSelection="true" 
                                                    completeMethod="#{hosDoctorTotalIncomeMB.completeClinicHosDoctor}" >
                                        <p:ajax update="form"
                                                event="change"
                                                listener="#{hosDoctorTotalIncomeMB.setSearchBeanInValidation}" />
                                        <p:ajax update="form"
                                                listener="#{hosDoctorTotalIncomeMB.setSearchBeanInValidation}"
                                                event="itemSelect"/>
                                    </p:autoComplete>

                                </h:panelGroup>

                            </h:panelGroup> 
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 60px;margin-right: 6%;" value="#{userData.userDDs['FROM_PATIENT']}"/>
                                </h:panelGroup> 

                                <h:panelGroup>
                                    <p:autoComplete style="width:34%!important"
                                                    dropdown="true"
                                                    converter="#{hosDoctorTotalIncomeMB.patientRegistrationConvertor}"
                                                    value="#{hosDoctorTotalIncomeMB.hosDoctorSearchBean.hosPatientIdFrom}"
                                                    var="patient"
                                                    itemLabel="#{patient}" 
                                                    itemValue="#{patient}"
                                                    forceSelection="true" 
                                                    completeMethod="#{hosDoctorTotalIncomeMB.completPatient}"
                                                    >
                                        <p:ajax update="form"
                                                event="change"
                                                listener="#{hosDoctorTotalIncomeMB.setSearchBeanInValidation}" />
                                        <p:ajax update="form"
                                                listener="#{hosDoctorTotalIncomeMB.setSearchBeanInValidation}"
                                                event="itemSelect"/>
                                    </p:autoComplete>
                                </h:panelGroup> 
                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 60px" value="#{userData.userDDs['TO_PATIENT']}"/>
                                </h:panelGroup> 

                                <h:panelGroup>
                                    <p:autoComplete style="width:34%!important"
                                                    dropdown="true"
                                                    converter="#{hosDoctorTotalIncomeMB.patientRegistrationConvertor}"
                                                    value="#{hosDoctorTotalIncomeMB.hosDoctorSearchBean.hosPatientIdTo}"
                                                    var="patient"
                                                    itemLabel="#{patient}" 
                                                    itemValue="#{patient}"
                                                    forceSelection="true" 
                                                    completeMethod="#{hosDoctorTotalIncomeMB.completPatient}"
                                                    >
                                        <p:ajax update="form"
                                                event="change"
                                                listener="#{hosDoctorTotalIncomeMB.setSearchBeanInValidation}" />
                                        <p:ajax update="form"
                                                listener="#{hosDoctorTotalIncomeMB.setSearchBeanInValidation}"
                                                event="itemSelect"/>
                                    </p:autoComplete>
                                </h:panelGroup> 
                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel  style="width: 55px;margin-right: 6%;" value="#{userData.userDDs['FROM_DATE']}"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:calendar pattern="dd/MM/yyyy" 
                                                value="#{hosDoctorTotalIncomeMB.hosDoctorSearchBean.dateFrom}"
                                                style="width: 50%">
                                        <p:ajax event="dateSelect" update="form" listener="#{hosDoctorTotalIncomeMB.setSearchBeanInValidation}" />

                                    </p:calendar>
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel  style="width: 55px" value="#{userData.userDDs['TO_DATE']}"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:calendar pattern="dd/MM/yyyy" 
                                                value="#{hosDoctorTotalIncomeMB.hosDoctorSearchBean.dateTo}"
                                                style="width: 50%">
                                        <p:ajax event="dateSelect" update="form" listener="#{hosDoctorTotalIncomeMB.setSearchBeanInValidation}" />

                                    </p:calendar>
                                </h:panelGroup>
                            </h:panelGroup>

                        </div>
                    </div>
                </div>

                <h:panelGrid class="col-md-12 centerButtons" columns="1">

                    <h:panelGroup>
                        <p:commandButton class="searchButton" 
                                         immediate="true"
                                         value="#{userData.userDDs['SEARCH']}"
                                         title="#{userData.userDDs['SEARCH']}" 
                                         action="#{hosDoctorTotalIncomeMB.search()}"
                                         id="searchS"
                                         update="form" 
                                         style=""/>

                        <p:commandButton   class="newButton" 
                                           title="#{userData.userDDs['NEW']}" 
                                           action="#{hosDoctorTotalIncomeMB.reset()}"
                                           update="form"
                                           value="#{userData.userDDs['NEW']}"
                                           style=""/>

                        <p:commandButton  class="printButton"
                                          ajax="false"
                                          onclick="form.target = '_blank'"  
                                       style="color: #ecf0f1!important;border-radius: 5px;
background-color: grey !important;margin-left: 5px;"
                                          value="#{userData.userDDs['PRINT']}" 
                                          actionListener="#{hosDoctorTotalIncomeMB.exportPDF}"
                                          title="#{userData.userDDs['PRINT']}"
                                          immediate="true" />
                        <p:commandButton  class="closeButton" 
                                               style="" 
                                              title="#{userData.userDDs['BACK']}"
                                              action="exit"
                                              value="#{userData.userDDs['BACK']}"/>
                    </h:panelGroup>
                </h:panelGrid>

            </p:fieldset>
            <p:fieldset>
                <p:dataTable 
                    id="dataTable" 
                     paginator="true"
                     rows="20"
                    widgetVar="HostDocTotIncom" value="#{hosDoctorTotalIncomeMB.hosReportEntityList}"
                    var="menu" sortBy="#{menu.patientName}" expandableRowGroups="true">
                     <f:facet name="header" class="col-md-12">

                        <p:outputPanel>
                            <h:outputText value="#{userData.userDDs['SEARCH']} : " 
                                          style="font-size: large;" />
                            <p:inputText id="globalFilter" 
                                         onkeyup="PF('HostDocTotIncom').filter()"
                                         style="width: 16%!important;" />
                        </p:outputPanel>
                    </f:facet>
                    <p:headerRow>
                        <p:column  style="width: 15vh;font-size: 1.8vh;border-radius: 0px;" colspan="4">
                            <h:outputText value="#{menu.patientName}" />
                        </p:column>

                    </p:headerRow>
                    <p:column style="width: 15vh;font-size: 1.8vh;border-radius: 0px;" headerText="#{userData.userDDs['DATEE']}"  >
                        <h:outputText value="#{menu.date}"   style="width: 15vh;font-size: 2vh;text-align: center!important" >
                            <f:convertDateTime type="date" pattern="dd-MM-yyyy"/>
                        </h:outputText>
                    </p:column>
                    <p:column  style="width: 15vh;font-size: 1.8vh;border-radius: 0px;" headerText="#{userData.userDDs['DOCTOR']}" >
                        <h:outputText value="#{menu.doctorName}" />
                    </p:column>
                    <p:column   style="width: 8vh;font-size: 1.8vh;border-radius: 0px;" headerText="#{userData.userDDs['SERVICE']}" >
                        <h:outputText value="#{menu.service}" style="font-size:12px" />
                    </p:column>
                    <p:column style="width: 15vh;font-size: 1.8vh;border-radius: 0px;" headerText="#{userData.userDDs['VALUE']}" >
                        <p:inputNumber readonly="true" value=" #{menu.value}"   style="width: 90%;" />
                    </p:column>
                    <p:summaryRow>
                        <p:column colspan="3" >
                            <h:outputText value="#{userData.userDDs['TOTAL']}"/>
                        </p:column>   
                        <p:column  >
                            <h:outputText value="#{menu.totalValue}"/>
                        </p:column>                   
                    </p:summaryRow>
                </p:dataTable> 
            </p:fieldset>
        </h:form>
    </ui:define>
</ui:composition>
