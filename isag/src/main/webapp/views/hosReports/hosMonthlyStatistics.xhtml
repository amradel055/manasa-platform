<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/newTemplate.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />
       <h:form class='formmargin'  id="form" dir="#{userData.dir}">
         <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                      margin-top: 12%;
                                      color: #035c70!important; 
                                      background-color: #223238!important;
                                      border: 1px solid #22323a!important;
                                      background: #22323a 50% 50% repeat-x!important;"
                                      icon="fa fa-fw fa-home"
                                      title="#{userData.userDDs['HOME']}"
                                      class="smhomeButton" 
                                      action="exit" />
                <p:commandButton  style="z-index: 2;
                                      margin-top: 9%!important;
                                      color: #035c70!important; 
                                      background-color: #223238!important;
                                      border: 1px solid #22323a!important;
                                      background: #22323a 50% 50% repeat-x!important;" 
                                      class="viewButton sminimize"
                                      icon="fa fa-window-minimize"
                                      title="إظهار/إخفاء"/>  
            </div>
	<p:fieldset id="head" legend="#{userData.userDDs['MONT_REVE_FOR_CLI']}" >
                <div class="col-xs-12">
                    <p:messages id="curmsg" showDetail="true" rendered="false" closable="true"/>   
                </div>

                <div class="ui-g-12 ui-g-nopad firstset" id="firstSegment">
                    <div class="ui-g"  style="margin-top: 1%"  >

                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 60px;margin-right: 6%;" value="#{userData.userDDs['FROM_CUSTOM']}"/>
                                </h:panelGroup> 

                                <h:panelGroup>
                                    <p:autoComplete style="width:34%!important"
                                                    dropdown="true"
                                                    converter="#{hosMonthlyStatisticsMB.hosClinicConverter}"
                                                    value="#{hosMonthlyStatisticsMB.hosDoctorSearchBean.hosDoctorIdFrom}"
                                                    var="organization"
                                                    itemLabel="#{organization}" 
                                                    itemValue="#{organization}"
                                                    forceSelection="true" 
                                                    completeMethod="#{hosMonthlyStatisticsMB.completeClinicHosDoctor}"
                                                    >

                                    </p:autoComplete>
                                </h:panelGroup> 
                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 60px" value="#{userData.userDDs['TO_CUSTOM']}"/>
                                </h:panelGroup> 

                                <h:panelGroup>
                                    <p:autoComplete style="width:34%!important"
                                                    dropdown="true"
                                                    converter="#{hosMonthlyStatisticsMB.hosClinicConverter}"
                                                    value="#{hosMonthlyStatisticsMB.hosDoctorSearchBean.hosDoctorIdTo}"
                                                    var="organization"
                                                    itemLabel="#{organization}" 
                                                    itemValue="#{organization}"
                                                    forceSelection="true" 
                                                    completeMethod="#{hosMonthlyStatisticsMB.completeClinicHosDoctor}"
                                                    >

                                    </p:autoComplete>
                                </h:panelGroup> 
                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel  style="width: 55px;margin-right: 6%;" value="#{userData.userDDs['FROM_DATE']}"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:calendar pattern="dd/MM/yyyy" 
                                                value="#{hosMonthlyStatisticsMB.hosDoctorSearchBean.dateFrom}"
                                                style="width: 50%">

                                    </p:calendar>
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel  style="width: 55px" value="#{userData.userDDs['TO_DATE']}"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:calendar pattern="dd/MM/yyyy" 
                                                value="#{hosMonthlyStatisticsMB.hosDoctorSearchBean.dateTo}"
                                                style="width: 50%">

                                    </p:calendar>
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>
                    </div>
                </div>

                <h:panelGrid class="col-md-12 centerButtons" columns="1">

                    <h:panelGroup>

                        <p:commandButton   
                            id="search"
                            class="searchButton"
                            title="#{userData.userDDs['SEARCH']}"
                            action="#{hosMonthlyStatisticsMB.search()}"
                            value="#{userData.userDDs['SEARCH']}"
                            update="form" 
                             style="" 
                            oncomplete="PF('generaltable').clearFilters()"/>



                        <p:commandButton ajax="false" 
                                         class="printButton"
                                         style="color: #ecf0f1!important;border-radius: 5px;
background-color: #175C52!important;margin-left: 5px;"
                                         onclick="form.target = '_blank'"
                                         title="#{userData.userDDs['PRINT']}"
                                         value="#{userData.userDDs['PRINT']}" actionListener="#{hosMonthlyStatisticsMB.exportPDF}"/>

                        <h:commandLink>  
                            <p:commandButton   class="closeButton"
                                               title="#{userData.userDDs['BACK']}"
                                               action="exit"
                                               value="#{userData.userDDs['BACK']}"/>
                            <p:graphicImage name="/img/excel.jpg" width="24;" />  
                            <p:dataExporter type="xls"
                                            target="table" 
                                            fileName="تقرير الدفعات الشهرية"
                                            postProcessor="#{hosMonthlyStatisticsMB.postProcessXLS}" />  
                        </h:commandLink>



                    </h:panelGroup>

                </h:panelGrid>
                <p:blockUI block="head" trigger="search" animate="true" >

                    <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                </p:blockUI> 

            </p:fieldset>
            <p:fieldset >
                <p:dataTable 
                    widgetVar="generaltable" id="table" var="generaltable" style="margin-bottom:20px"  
                    rowIndexVar="index" paginator="true" 
                    value="#{hosMonthlyStatisticsMB.purchaseByCategoriesOfItemsBeanList}" >
                    
                     <f:facet name="header" class="col-md-12">

                        <p:outputPanel>
                            <h:outputText value="#{userData.userDDs['SEARCH']} : " 
                                          style="font-size: large;" />
                            <p:inputText id="globalFilter" 
                                         onkeyup="PF('generaltable').filter()"
                                         style="width: 16%!important;" />
                        </p:outputPanel>
                    </f:facet>

                    <p:columns value="#{hosMonthlyStatisticsMB.columns}" style="border-radius: 0px;" var="column" columnIndexVar="colIndex" sortBy="#{generaltable[column.property]}">
                        <f:facet name="header">
                            <h:outputText value="#{column.header}" />
                        </f:facet>
                        <h:outputText value="#{generaltable[column.property]}" />
                    </p:columns>

                </p:dataTable>
            </p:fieldset>
        </h:form>
    </ui:define>
</ui:composition>
