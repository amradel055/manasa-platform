<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/newTemplate.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">
        <div class="col-xs-12">
            <p:messages id="curmsg" showDetail="true" rendered="false" closable="true"/>   
        </div>
        <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form class='formmargin' id="form" dir="#{userData.dir}">

        <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                      margin-top: 12%;
                                      color: #035c70!important; 
                                      background-color: #223238!important;
                                      border: 1px solid #22323a!important;
                                      background: #22323a 50% 50% repeat-x!important;"
                                      icon="fa fa-fw fa-home"
                                      title="#{userData.userDDs['HOME']}"
                                      class="smhomeButton" 
                                      action="exit" />
                <p:commandButton  style="z-index: 2;
                                      margin-top: 9%!important;
                                      color: #035c70!important; 
                                      background-color: #223238!important;
                                      border: 1px solid #22323a!important;
                                      background: #22323a 50% 50% repeat-x!important;" 
                                      class="viewButton sminimize"
                                      icon="fa fa-window-minimize"
                                      title="إظهار/إخفاء"/>  
        </div>
                <p:fieldset legend="#{userData.userDDs['CLI_REVE_REP']}" >


                <div class="ui-g-12 ui-g-nopad firstset">
                    <div class="ui-g"  style="margin-top: 1%"  id="firstSegment">

                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>

                                <h:panelGroup> 
                                    <p:outputLabel style="width: 60px;margin-right: 6%" value="#{userData.userDDs['FROM_CLINIC']}"  />
                                </h:panelGroup>
                                <h:panelGroup  >
                                    <p:autoComplete style="width:34%" id="cli1" 
                                                    dropdown="true"
                                                    converter="#{hosClinicReportMB.hosClinicConverter}"
                                                    value="#{hosClinicReportMB.hosDoctorSearchBean.hosClinicIdFrom}"

                                                    var="bank"
                                                    itemLabel="#{bank}" 
                                                    itemValue="#{bank}" 
                                                    forceSelection="true" 
                                                    completeMethod="#{hosClinicReportMB.completeClinicHosDoctor}" >
                                        <p:ajax update="form"
                                                event="change"
                                                listener="#{hosClinicReportMB.setSearchBeanInValidation}" />
                                        <p:ajax update="form"
                                                listener="#{hosClinicReportMB.setSearchBeanInValidation}"
                                                event="itemSelect"/>
                                    </p:autoComplete>
                                </h:panelGroup>

                            </h:panelGroup>  
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>

                                <h:panelGroup > 
                                    <p:outputLabel style="width: 60px" value="#{userData.userDDs['TO_CLINIC']}"  />
                                </h:panelGroup>
                                <h:panelGroup  >
                                    <p:autoComplete style="width:34%" id="cli2" 
                                                    dropdown="true"
                                                    converter="#{hosClinicReportMB.hosClinicConverter}"
                                                    value="#{hosClinicReportMB.hosDoctorSearchBean.hosClinicIdTo}"

                                                    var="bank"
                                                    itemLabel="#{bank}" 
                                                    itemValue="#{bank}" 
                                                    forceSelection="true" 
                                                    completeMethod="#{hosClinicReportMB.completeClinicHosDoctor}" >

                                        <p:ajax update="form"
                                                event="change"
                                                listener="#{hosClinicReportMB.setSearchBeanInValidation}" />
                                        <p:ajax update="form"
                                                listener="#{hosClinicReportMB.setSearchBeanInValidation}"
                                                event="itemSelect"/>
                                    </p:autoComplete>
                                </h:panelGroup>

                            </h:panelGroup>  
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel  style="width: 55px;margin-right: 6%;" value="#{userData.userDDs['FROM_DATE']}"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:calendar pattern="dd/MM/yyyy" 
                                                value="#{hosClinicReportMB.hosDoctorSearchBean.dateFrom}"
                                                style="width: 50%">
                                        <p:ajax event="dateSelect" update="form" listener="#{hosClinicReportMB.setSearchBeanInValidation}" />

                                    </p:calendar>
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel  style="width: 55px" value="#{userData.userDDs['TO_DATE']}"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:calendar pattern="dd/MM/yyyy" 
                                                value="#{hosClinicReportMB.hosDoctorSearchBean.dateTo}"
                                                style="width: 50%">
                                        <p:ajax event="dateSelect" update="form" listener="#{hosClinicReportMB.setSearchBeanInValidation}" />

                                    </p:calendar>
                                </h:panelGroup>
                            </h:panelGroup>

                        </div>
                    </div>
                </div>
                <h:panelGrid class="col-md-12" columns="1">
                    <h:panelGroup class="centerButtons">
                        <p:commandButton  class="searchButtons" 
                                          style="color: #fff!important;background-color: #2196F3;margin-left: 5px;"
                                          immediate="true"
                                          title="#{userData.userDDs['SEARCH']}"
                                          value="#{userData.userDDs['SEARCH']}" action="#{hosClinicReportMB.search()}"
                                          id="searchS"
                                          update="form"
                                          />

                        <p:commandButton  class="newButton" 
                                           style=""
                                          title="#{userData.userDDs['NEW']}" 
                                          action="#{hosClinicReportMB.reset()}"
                                          update="form"
                                          value="#{userData.userDDs['NEW']}"
                                          />

                        <p:commandButton   class="printButton"  
                                           ajax="false"
                                           onclick="form.target = '_blank'"  
                                            style="color: #ecf0f1!important;border-radius: 5px;
background-color:grey !important;margin-left: 5px;"
                                           value="#{userData.userDDs['PRINT']}" 
                                           actionListener="#{hosClinicReportMB.exportPDF}"
                                           title="#{userData.userDDs['PRINT']}"
                                           immediate="true" />
                        <p:commandButton  class="closeButton" 
                                               style="color: #ecf0f1!important;border-radius: 5px;
background-color: #9c27b0d1!important;" 
                                              title="#{userData.userDDs['BACK']}"
                                              action="exit"
                                              value="#{userData.userDDs['BACK']}"/>
                    </h:panelGroup>

                </h:panelGrid>
            </p:fieldset>

            <p:fieldset   style="margin-top: 2%">

                <p:dataTable id="accc" 
                              rows="20"
                              paginator="true"
                             draggableColumns="true" 
                             value="#{hosClinicReportMB.hosClinicReportBeanList}" 
                             var="hosClinicReport"
                             widgetVar="HostClinicReport">

                    <f:facet name="header" class="col-md-12">

                        <p:outputPanel>
                            <h:outputText value="#{userData.userDDs['SEARCH']} : " 
                                          style="font-size: large;" />
                            <p:inputText id="globalFilter" 
                                         onkeyup="PF('HostClinicReport').filter()"
                                         style="width:16%!important;" />
                        </p:outputPanel>
                    </f:facet>


                    <p:column style="width: 10vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px;" headerText="#{userData.userDDs['CLINIC_NAME']}">
                        <h:outputText value="#{hosClinicReport.clinicName}" style="font-size: 1.5vh"/>
                    </p:column>
                    <p:column style="width: 10vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px;" headerText="#{userData.userDDs['NO_OF_CASES']}">
                        <h:outputText value="#{hosClinicReport.casesNumber}" style="font-size: 1.5vh"/>
                    </p:column>
                    <p:column style="width: 10vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px;" headerText="#{userData.userDDs['NET_CASH_CASES']}">
                        <h:outputText value="#{hosClinicReport.netCachCases}" style="font-size: 1.5vh"/>
                    </p:column>                

                    <p:column style="width: 15vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px;"  headerText="#{userData.userDDs['NET_COMP_CASES']}">
                        <h:outputText value="#{hosClinicReport.netCompanyCases}"  style="font-size: 1.5vh"/>
                    </p:column>

                    <p:column style="width: 10vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px;" headerText="#{userData.userDDs['CASH_PAID']}">
                        <h:outputText value="#{hosClinicReport.cashPaid}"  style="font-size: 1.5vh"/>
                    </p:column>
                    <p:column style="width: 10vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px;" headerText="#{userData.userDDs['PAID_BY_CARD']}">
                        <h:outputText value="#{hosClinicReport.cardPaid}"  style="font-size: 1.5vh"/>
                    </p:column>
                    <p:column style="width: 10vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px;" headerText="#{userData.userDDs['CLI_REVE_FR_COMPA']}">
                        <h:outputText value="#{hosClinicReport.clincCompanyIncome}"  style="font-size: 1.5vh"/>
                    </p:column>
                    <p:column style="width: 10vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px;" headerText="#{userData.userDDs['NET']}">
                        <h:outputText value="#{hosClinicReport.net}"  style="font-size: 1.5vh"/>
                    </p:column>
                    <p:column style="width: 10vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px;" headerText="#{userData.userDDs['NO_OF_DOC']}">
                        <h:outputText value="#{hosClinicReport.docorsNumber}"  style="font-size: 1.5vh"/>
                    </p:column>

                </p:dataTable>

            </p:fieldset>
        </h:form>
    </ui:define>
</ui:composition>
