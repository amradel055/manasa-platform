<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/newTemplate.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <h:form id="ScreenAddEditForm" dir="#{userData.dir}" class='formmargin'>
 <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                      margin-top: 12%;
                                      color: #035c70!important; 
                                      background-color: #223238!important;
                                      border: 1px solid #22323a!important;
                                      background: #22323a 50% 50% repeat-x!important;"
                                      icon="fa fa-fw fa-home"
                                      title="#{userData.userDDs['HOME']}"
                                      class="smhomeButton" 
                                      action="exit" />  
            </div>

            <p:fieldset legend="المسميات الوظيفية" style="margin-bottom:20px">
                <div   class="ui-g-12 ui-g-nopad" style="padding: 0px;">
                    <div class="ui-g">
                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width:95px;margin-right: 5%"  value="المسمى الوظيفي" />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:inputText  style="width: 49%!important"  id="employeeName" a:autofocus="true" value="#{employeeFormMB.employeeDTO.name}">
                                    </p:inputText>
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>
                        
                        
                        
                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">
                            <h:panelGroup>
                                <p:outputLabel style="width:95px;margin-right: 5%"  value="القسم" />
                            </h:panelGroup>
                            <h:panelGroup>

                                <p:autoComplete style="width:40%!important" 
                                                dropdown="true" 
                                                value="#{employeeFormMB.employeeDTO.gender}" 
                                                converter="#{employeeFormMB.genderDTOConverter}"
                                                completeMethod="#{employeeFormMB.completeGender}"
                                                var="gender"
                                                itemLabel="#{gender.name}"
                                                itemValue="#{gender}" 
                                                forceSelection="true" 
                                                >

                                </p:autoComplete>

                            </h:panelGroup>
                        </div>
                        
                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">
                            <h:panelGroup>
                                <p:outputLabel style="width:95px;margin-right: 5%"  value="المدير المباشر" />
                            </h:panelGroup>
                            <h:panelGroup>

                                <p:autoComplete style="width:40%!important" 
                                                dropdown="true" 
                                                value="#{employeeFormMB.employeeDTO.gender}" 
                                                converter="#{employeeFormMB.genderDTOConverter}"
                                                completeMethod="#{employeeFormMB.completeGender}"
                                                var="gender"
                                                itemLabel="#{gender.name}"
                                                itemValue="#{gender}" 
                                                forceSelection="true" 
                                                >

                                </p:autoComplete>

                            </h:panelGroup>
                        </div>
                        
                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">
                            <h:panelGroup>
                                <p:outputLabel style="width:95px;margin-right: 5%"  value="المستوى الدراسي" />
                            </h:panelGroup>
                            <h:panelGroup>

                                <p:autoComplete style="width:40%!important" 
                                                dropdown="true" 
                                                value="#{employeeFormMB.employeeDTO.gender}" 
                                                converter="#{employeeFormMB.genderDTOConverter}"
                                                completeMethod="#{employeeFormMB.completeGender}"
                                                var="gender"
                                                itemLabel="#{gender.name}"
                                                itemValue="#{gender}" 
                                                forceSelection="true" 
                                                >

                                </p:autoComplete>

                            </h:panelGroup>
                        </div>
                        
                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">
                            <h:panelGroup>
                                <p:outputLabel style="width:95px;margin-right: 5%"  value="المؤهل الدراسي" />
                            </h:panelGroup>
                            <h:panelGroup>

                                <p:autoComplete style="width:40%!important" 
                                                dropdown="true" 
                                                value="#{employeeFormMB.employeeDTO.gender}" 
                                                converter="#{employeeFormMB.genderDTOConverter}"
                                                completeMethod="#{employeeFormMB.completeGender}"
                                                var="gender"
                                                itemLabel="#{gender.name}"
                                                itemValue="#{gender}" 
                                                forceSelection="true" 
                                                >

                                </p:autoComplete>

                            </h:panelGroup>
                        </div>
                        
                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width:95px;margin-right: 5%"  value="الوصف الوظيفي" />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:inputText  style="width: 49%!important"  id="employeeDescription" a:autofocus="true" value="#{employeeFormMB.employeeDTO.email}" >
                                    </p:inputText>
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>

                    </div>
                </div>
            </p:fieldset>
            <p:fieldset legend="عناصر التقييم" style="margin-bottom:20px">
                <div   class="ui-g-12 ui-g-nopad" style="padding: 0px;">
                    <div class="ui-g">
                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width:110px;margin-right: 5%"  value="المظهر" />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:inputNumber  style="width: 50%!important"  id="employeePerformance" a:autofocus="true" value="#{employeeFormMB.employeeDTO.idNumber}" >
                                    </p:inputNumber>
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>
                        
                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width:110px;margin-right: 5%"  value="الحضور" />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:inputNumber  style="width: 50%!important"  id="employeePresence" a:autofocus="true" value="#{employeeFormMB.employeeDTO.idNumber}" >
                                    </p:inputNumber>
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>
                        
                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width:110px;margin-right: 5%"  value="مهارات مطلوبة" />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:inputText  style="width: 50%!important"  id="employeeSkills" a:autofocus="true" value="#{employeeFormMB.employeeDTO.idNumber}" >
                                    </p:inputText>
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>
                        
                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width:110px;margin-right: 5%"  value="وقت التعيين" />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:inputNumber  style="width: 50%!important"  id="employeeDate" a:autofocus="true" value="#{employeeFormMB.employeeDTO.idNumber}" >
                                    </p:inputNumber>
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>

                    </div>
                </div>

            </p:fieldset>
            
           


            <h:panelGrid id="pn1"   class="centerButtons col-md-12" columns="1"  style="margin-top: 2%">


                <h:panelGroup>


                    <p:commandButton   class="saveButtons"  
                                       id="saveB" 
                                       title="#{userData.userDDs['SAVE']}"
                                       value="#{userData.userDDs['SAVE']}" 
                                       style="color: #ecf0f1!important;border-radius: 5px;
height: 30px;background-color: #270e80f0 !important;margin-left: 5px;"
                                       action="#{employeeFormMB.save()}" 
                                       update="@form" />
                    <p:commandButton  class="newButton" 
                                      id="newN"
                                      ajax="false"
                                   style="color: #ecf0f1!important;border-radius: 5px;
height: 30px;background-color: #035c70 !important;margin-left: 5px;"
                                      value="#{userData.userDDs['NEW']}" 
                                      title="#{userData.userDDs['NEW']}"
                                      onclick="form.target = ''" 
                                      actionListener="#{employeeFormMB.reset()}"/>

                    <p:commandButton class="closeButton" 
                                     title="#{userData.userDDs['CANCEL']}" 
                                     immediate="true" 
                                     value="#{userData.userDDs['CANCEL']}" 
                                   style="color: #ecf0f1!important;border-radius: 5px;
height: 30px;background-color: #93188b !important;margin-left: 5px;"
                                     action="#{employeeFormMB.exit()}"   />
                    
                    <p:commandButton   class="printButtons"  style=" background-color: #030570de !important;color: #fff!important;margin-left: 5px"
                                               ajax="false" 
                                               onclick="form.target = '_blank'" 
                                               value="#{userData.userDDs['PRINT']}"
                                               actionListener="#{subAccountSummaryReportMB.exportPDF}"/>




                </h:panelGroup>
            </h:panelGrid>
            <p:blockUI block="ScreenAddEditForm" trigger="saveB " animate="true" >

                <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>
            </p:blockUI>



            <p:dialog modal="true"
                      position='center,center'
                      minHeight="40" minWidth="100"
                      header="إضافة  " widgetVar="dlg1"
                      style="left: 50%;top: 50%;">



                <h:panelGroup>
                    <p:outputLabel style="width:65px"  value="كفيل جديد " />
                </h:panelGroup>
                <h:panelGroup>
                    <p:inputText  style="width: 40%!important"  
                                  id="newSponsor"
                                  value="#{employeeFormMB.hrSponsorName}">
                    </p:inputText>
                </h:panelGroup>

                <p:commandButton   class="saveButtons"  
                                   id="saveC"
                                   title="#{userData.userDDs['SAVE']}"
                                   value="#{userData.userDDs['SAVE']}" 
                                   style="color: #ecf0f1!important;border-radius: 5px;
height: 30px;background-color: #270e80f0 !important;margin-left: 5px;"

                                   action="#{employeeFormMB.saveDialog()}" 
                                   />


            </p:dialog>


        </h:form>
    </ui:define>

</ui:composition>
