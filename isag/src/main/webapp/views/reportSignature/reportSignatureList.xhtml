<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/newTemplate.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
       <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form id="form" dir="#{userData.dir}}" class='formmargin'>
            <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                      margin-top: 22%;
                                      color: #035c70!important; 
                                      background-color: #223238!important;
                                      border: 1px solid #22323a!important;
                                      background: #22323a 50% 50% repeat-x!important;"
                                      icon="fa fa-fw fa-home"
                                      title="#{userData.userDDs['HOME']}"
                                      class="smhomeButton" 
                                      action="exit" />  
            </div>
            <p:fieldset legend="#{userData.userDDs['Reports_Signatures']}" >
                <p:messages autoUpdate="true"  id="messages" showDetail="true" closable="true"/> 
               
                <p:dataTable id="invMonthTargetTable" 
                             draggableColumns="true" draggableRows="true"
                             var="reportSignatureTable" 
                             widgetVar="reportSignatureTable" 
                             rowIndexVar="index" 
                             selection="#{reportSignatureListMB.reportSignatureDTOSelected}"
                             selectionMode="single" 
                             rowKey="#{reportSignatureTable}"
                             value="#{reportSignatureListMB.reportSignatureDTOList}" 
                             paginator="true" 
                             emptyMessage="#{userData.userDDs['EMPTY_TABLE']}">

                    <f:facet name="header" class="col-md-12">
                        <p:commandButton  class="saddButton" id="add" title="#{userData.userDDs['ADD']}"  
                                          icon="fa fa-plus" actionListener="#{reportSignatureListMB.goToAdd()}"
                                         style="float:right;margin: 0" 
                                         rendered="#{userData.userScreens['reportSignature'].add or 
                                                     userData.isAdmin}"/>
                        <p:outputPanel >
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" a:autofocus="true"
                                         onkeyup="PF('reportSignatureTable').filter()" style="width:150px" />
                        </p:outputPanel>
                    </f:facet>

                    <p:column headerText="#" style="width: 5vh;text-align: right;font-size: 1.8vh;border-radius: 0px">
                        <h:outputText  value="#{index + 1}" style="font-size: 1.5vh"/>
                    </p:column>

                    <p:column filterStyle="display:none" 
                              style="width: 10vh;text-align: -webkit-auto;font-size: 1.8vh;border-radius: 0px"
                              sortBy="#{reportSignatureTable.screen}"
                              filterBy="#{reportSignatureTable.screen}" 
                              filterMatchMode="contains"
                              headerText="#{userData.userDDs['REPORTS']}"  > 

                        <h:outputText  value="#{reportSignatureTable.screenList.get(reportSignatureTable.screen)}" style="font-size: 1.5vh"/>
                         
                       
                    </p:column>

                    <p:column filterStyle="display:none" 
                              style="width: 12vh;text-align: -webkit-auto;font-size: 1.8vh;border-radius: 0px"
                              sortBy="#{reportSignatureTable.signature1}"
                              filterBy="#{reportSignatureTable.signature1}"  
                              filterMatchMode="contains" 
                              headerText="#{userData.userDDs['Signature']}1"> 
                        <h:outputText value="#{reportSignatureTable.signature1}"
                                      style="font-size: 1.5vh;border-radius: 0px" >
                        </h:outputText>   
                   </p:column>
                      <p:column filterStyle="display:none" 
                              style="width: 12vh;text-align: -webkit-auto;font-size: 1.8vh;border-radius: 0px"
                              sortBy="#{reportSignatureTable.signature2}"
                              filterBy="#{reportSignatureTable.signature2}"  
                              filterMatchMode="contains" 
                              headerText="#{userData.userDDs['Signature']}2"> 
                        <h:outputText value="#{reportSignatureTable.signature2}"
                                      style="font-size: 1.5vh;border-radius: 0px" >
                        </h:outputText>   
                   </p:column>
                      <p:column filterStyle="display:none" 
                              style="width: 12vh;text-align: -webkit-auto;font-size: 1.8vh;border-radius: 0px"
                              sortBy="#{reportSignatureTable.signature3}"
                              filterBy="#{reportSignatureTable.signature3}"  
                              filterMatchMode="contains" 
                              headerText="#{userData.userDDs['Signature']}3"> 
                        <h:outputText value="#{reportSignatureTable.signature3}"
                                      style="font-size: 1.5vh;border-radius: 0px" >
                        </h:outputText>   
                   </p:column>
                      <p:column filterStyle="display:none" 
                              style="width: 12vh;text-align: -webkit-auto;font-size: 1.8vh;border-radius: 0px"
                              sortBy="#{reportSignatureTable.signature4}"
                              filterBy="#{reportSignatureTable.signature4}"  
                              filterMatchMode="contains" 
                              headerText="#{userData.userDDs['Signature']}4"> 
                        <h:outputText value="#{reportSignatureTable.signature4}"
                                      style="font-size: 1.5vh;border-radius: 0px" >
                        </h:outputText>   
                   </p:column>
                      <p:column filterStyle="display:none" 
                              style="width: 12vh;text-align: -webkit-auto;font-size: 1.8vh;border-radius: 0px"
                              sortBy="#{reportSignatureTable.signature5}"
                              filterBy="#{reportSignatureTable.signature5}"  
                              filterMatchMode="contains" 
                              headerText="#{userData.userDDs['Signature']}5"> 
                        <h:outputText value="#{reportSignatureTable.signature5}"
                                      style="font-size: 1.5vh;border-radius: 0px" >
                        </h:outputText>   
                   </p:column>
                    
                   

                     <p:column style="width: 8vh;text-align: center;font-size: 1.8vh;border-radius: 0px"  headerText="#{userData.userDDs['TRANSACTION']}">
                        <p:commandButton class="seditButtons" update="@form" icon="fa fa-fw fa-edit" style="background-color: #6a6967;border-radius: 3px;" 
                                         title="#{userData.userDDs['EDIT']}" action="#{reportSignatureListMB.goToEdit()}" 
                                         rendered="#{userData.userScreens['reportSignature'].edit or userData.isAdmin}">
                            <f:setPropertyActionListener value="#{reportSignatureTable}"  target="#{reportSignatureListMB.reportSignatureDTOSelected}" />
                        </p:commandButton>
                        <p:commandButton class="sdeleteButtons" update="@form" icon="fa fa-remove" title="#{userData.userDDs['DELETE']}" 
                                         style="background-color: red;border-radius: 3px;"
                                         action="#{reportSignatureListMB.delete}" 
                                         rendered="#{userData.userScreens['reportSignature'].delete or userData.isAdmin}">
                            <f:setPropertyActionListener value="#{reportSignatureTable}"  target="#{reportSignatureListMB.reportSignatureDTOSelected}" />
                            <p:confirm header="Confirmation" message="#{userData.userDDs['ARE_YOU_SURE']}" icon="ui-icon-alert" />
                        </p:commandButton>
                    </p:column>
                </p:dataTable>
                <p:confirmDialog style="width: 100px; height: 100px" global="true" showEffect="fade" hideEffect="fade">
                    <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                    <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                </p:confirmDialog>  
            </p:fieldset>     
        </h:form>
    </ui:define>
</ui:composition>
