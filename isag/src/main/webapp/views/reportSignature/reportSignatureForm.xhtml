<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/newTemplate.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml" >
    <ui:define name="content">
        <!--        <f:event listener="#/{userData.authorize}" type="preRenderView" />-->
        <h:body>
            <h:form id="form" class='formmargin' >
                <div style=" position: absolute;left: 20px"> 

                    <p:commandButton  style="z-index: 2;
                                      margin-top: 12%;
                                      color: #035c70!important; 
                                      background-color: #223238!important;
                                      border: 1px solid #22323a!important;
                                      background: #22323a 50% 50% repeat-x!important;"
                                      icon="fa fa-fw fa-home"
                                      title="#{userData.userDDs['HOME']}"
                                      class="smhomeButton" 
                                      action="exit" />  
                </div>
                <p:fieldset legend="#{userData.userDDs['REP_SETTINGS']}">

                    <p:messages autoUpdate="true"  id="messages" showDetail="true" closable="true" escape="true"/>
                    <div class="row">
                        
                        <div class="col-sm-6">
                            <h:panelGrid id="pnl" class="col-md-12" columns="2"   >

                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel  value="#{userData.userDDs['Signature']}1" style="width: 79px;margin-right: 25px;"/>
                                    </h:panelGroup> 
                                    <h:panelGroup>
                                        <p:inputText style="width: 35%!important" value="#{reportSignatureFormMB.reportSignatureDTO.signature1}"  />
                                    </h:panelGroup>
                                </h:panelGroup>
                            </h:panelGrid>
                        </div>
                        
                        <div class="col-sm-6">
                            <h:panelGrid>

                                <h:panelGroup>
                                    <h:panelGroup> 
                                        <p:outputLabel  value="#{userData.userDDs['Report_Name']}" style="width: 83px;margin-right: 25px;"/>
                                    </h:panelGroup> 
                                    <h:panelGroup>
                                        <p:selectOneMenu style="width:35%" value="#{reportSignatureFormMB.reportSignatureDTO.screen}"  >
                                            <f:selectItem itemLabel="#{userData.userDDs['CHOOSE']}"  itemValue="" noSelectionOption="true" />
                                            <f:selectItems value="#{reportSignatureFormMB.reportSignatureDTO.screenList}" var="screen" itemLabel="#{screen}" itemValue="#{reportSignatureFormMB.reportSignatureDTO.screenList.indexOf(screen)}"   />
                                        </p:selectOneMenu>
                                    </h:panelGroup>
                                </h:panelGroup>
                            </h:panelGrid>
                        </div>
                        
                        <div class="col-sm-6" style="margin-top: 0.5%;">
                            <h:panelGrid>
                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel  value="#{userData.userDDs['Signature']}2" style="width: 78px;margin-right: 25px; "/>
                                    </h:panelGroup> 
                                    <h:panelGroup>
                                        <p:inputText style="width: 35%!important"  value="#{reportSignatureFormMB.reportSignatureDTO.signature2}"   />
                                    </h:panelGroup>
                                </h:panelGroup>

                            </h:panelGrid>
                        </div>
                        <div class="col-sm-6" style="margin-top: -3%;">
                            <h:panelGrid>
                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel value="#{userData.userDDs['Signature']}3" style="width: 79px;margin-right: 25px;"/>
                                    </h:panelGroup> 
                                    <h:panelGroup>
                                        <p:inputText style="width: 35%!important"  value="#{reportSignatureFormMB.reportSignatureDTO.signature3}" />
                                    </h:panelGroup>
                                </h:panelGroup>
                            </h:panelGrid>
                        </div>
                        <div class="col-sm-6">
                            <h:panelGrid>
                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel  value="#{userData.userDDs['Signature']}4" style="width: 78px;margin-right: 25px;"/>
                                    </h:panelGroup> 
                                    <h:panelGroup>
                                        <p:inputText style="width: 35%!important" value="#{reportSignatureFormMB.reportSignatureDTO.signature4}"  />
                                    </h:panelGroup>
                                </h:panelGroup>

                            </h:panelGrid>
                        </div>
                        <div class="col-sm-6" style="margin-top: -3%;">
                            <h:panelGrid>
                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel  value="#{userData.userDDs['Signature']}5" style="width: 79px;margin-right: 25px;margin-top: 8%;"/>
                                    </h:panelGroup> 
                                    <h:panelGroup>
                                        <p:inputText style="width: 35%!important"  value="#{reportSignatureFormMB.reportSignatureDTO.signature5}"   />
                                    </h:panelGroup>
                                </h:panelGroup>
                            </h:panelGrid>
                        </div> 
                    </div>


                    <h:panelGrid  class="centerButtons col-md-12" columns="1"  style="margin-top: 2%">

                        <h:panelGroup>


                            <p:commandButton class="saveButton" 
                                             id="saveB" 
                                             style=""
                                             title="#{userData.userDDs['SAVE']}"
                                             value="#{userData.userDDs['SAVE']}" 
                                             action="#{reportSignatureFormMB.save()}"
                                             update="@form" 
                                             rendered="#{userData.userScreens['reportSignature'].add or userData.isAdmin}"
                                             /> 

                            <p:commandButton class="newButton" 
                                             title="#{userData.userDDs['NEW']}" 
                                             immediate="true"
                                             value="#{userData.userDDs['NEW']}" 
                                             id="newA"
                                             style="" update="form"
                                             action="#{reportSignatureFormMB.loadThePageAgain()}" 
                                             rendered="#{userData.userScreens['reportSignature'].add or userData.isAdmin}"/>  

                            <p:commandButton 

                                class="closeButton"
                                style=""
                                title="#{userData.userDDs['BACK']}"
                                immediate="true" 
                                value="#{userData.userDDs['BACK']}" action="#{reportSignatureFormMB.exit()}"
                                />



                        </h:panelGroup>


                    </h:panelGrid>
                    <p:blockUI block="pnl" trigger="saveB" animate="true" >

                        <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                    </p:blockUI> 
                    <p:blockUI block="pnl" trigger="saveB" />


                </p:fieldset>
            </h:form>
        </h:body>
    </ui:define>
</ui:composition>
