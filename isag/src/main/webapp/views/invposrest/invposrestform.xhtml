<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/rest2.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <h:form class='formmargin' id="form" dir="#{userData.dir}">
            <div  >
                <p:messages id="curmsg" autoUpdate="true" showDetail="true" rendered="true" closable="true"/>   
            </div>

            <div class="ui-g-6 ui-xl-6">


                <div class="ui-g-12 ui-xl-12" style="">

                    <div class="ui-g-1 ui-xl-1">
                        <div class="ui-g-6 ui-xl-6">
                            <p:commandButton  value="إضافة" type="button" onclick="PF('dlg3').show();"/>
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:dialog header="إضافة عميل جديد" widgetVar="dlg3" showEffect="explode" hideEffect="bounce" height="500" width="500">

                                <h:panelGroup>
                                    <p:outputLabel style="width: 100px" value=" الإســم "/>
                                </h:panelGroup> 
                                <h:panelGroup>
                                    <p:inputText value="#{invPOSRestDTOMB.organizationSiteId.name}"/>  
                                </h:panelGroup>
                                <br/>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 100px" value="التليفون "/>
                                </h:panelGroup> 
                                <h:panelGroup>
                                    <p:inputText value="#{invPOSRestDTOMB.organizationSiteId.mobile}"/>  
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 100px" value="العنوان "/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:inputText value="#{invPOSRestDTOMB.organizationSiteId.address}"/>  
                                </h:panelGroup>
                                <h:panelGroup>
                                    <br/>
                                    <p:commandButton     class="saveButton"  
                                                         title="#{userData.userDDs['SAVE']}"
                                                         value="#{userData.userDDs['SAVE']}" 
                                                         icon="fa fa-fw fa-save" 
                                                         action="#{invPOSRestDTOMB.addNewCustomerForRest()}"
                                                         update="@form"
                                                         >
                                    </p:commandButton>
                                </h:panelGroup>

                            </p:dialog>
                        </div>
                    </div>



                    <div class="ui-g-1 ui-xl-1">

                    </div>

                    <div class="ui-g-1 ui-xl-1">

                    </div>

                    <div class="ui-g-1 ui-xl-1">
                        <h:panelGroup rendered="#{invPOSRestDTOMB.invInvoiceDTO.typeRest ne 1 or (invPOSRestDTOMB.invInvoiceDTO.typeRest eq 1 and invPOSRestDTOMB.invInvoiceDTO.id eq null)}">
                            <p:outputLabel style="width: 100%;text-align: right" value="#{invPOSRestDTOMB.invInvoiceDTO.organizationSiteId}"
                                           rendered="#{not invPOSRestDTOMB.invInvoiceDTO.showCustomerDate}"
                                           />
                            <p:autoComplete   rendered="#{invPOSRestDTOMB.invInvoiceDTO.showCustomerDate}"
                                              style=" width: 100px; clear: right;cursor: text;" 
                                              inputStyle = "width: 100%"
                                              dropdown="true"
                                              converter="#{invPOSRestDTOMB.organizationSiteDTOConvertor}"
                                              value="#{invPOSRestDTOMB.invInvoiceDTO.organizationSiteId}"
                                              var="supplier"
                                              itemLabel="#{supplier}" 
                                              itemValue="#{supplier}" 
                                              forceSelection="true" 
                                              completeMethod="#{invPOSRestDTOMB.completeCustomerFrom}" 
                                              >

                                <p:ajax update="@form"
                                        process="@form"
                                        event="itemSelect"
                                        listener="#{invPOSRestDTOMB.putCurrency()}" />


                            </p:autoComplete>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{invPOSRestDTOMB.invInvoiceDTO.typeRest eq 1 and invPOSRestDTOMB.invInvoiceDTO.id ne null}">
                            <p:outputLabel style="width: 100%;text-align: right" value="#{invPOSRestDTOMB.invInvoiceDTO.organizationSiteId}" />
                        </h:panelGroup>
                    </div>



                    <div class="ui-g-1 ui-xl-1">


                        <p:outputLabel style="" value="#{userData.userDDs['CUSTOMER']}"/>


                    </div>

                    <div class="ui-g-1 ui-xl-1">

                    </div>




                    <div class="ui-g-1 ui-xl-1">
                        <p:selectOneMenu value ="#{invPOSRestDTOMB.invInvoiceDTO.typeRest}" >
                            <f:selectItem itemLabel="#{userData.userDDs['CASH']}"  itemValue="0"  />                            
                            <f:selectItem itemLabel="صالة" itemValue="1" />
                            <f:selectItem itemLabel="دليفري" itemValue="2" />
                            <p:ajax update="test "/>
                        </p:selectOneMenu>
                    </div>
                    <div class="ui-g-1 ui-xl-1">

                    </div>
                    <div class="ui-g-1 ui-xl-1">
                        <p:outputLabel value="نوع الفاتوره"   />
                    </div>
                    <div class="ui-g-1 ui-xl-1">

                    </div>
                    <div class="ui-g-1 ui-xl-1">
                        <p:inputText style="width: 40px;" value="#{invPOSRestDTOMB.invInvoiceDTO.serial}" readonly="true" />  

                    </div>  
                    <div class="ui-g-1 ui-xl-1">
                        <p:outputLabel value="رقم الفاتوره"   />
                    </div>
                </div>





                <div class="ui-g-12 ui-xl-12" style="height: 7%">
                    <h:panelGroup id="test" >


                        <h:panelGroup rendered="#{invPOSRestDTOMB.invInvoiceDTO.typeRest eq 2}">

                            <div class="ui-g-2 ui-xl-2"  >
                                <p:autoComplete style=" width: 100%"
                                                inputStyle = "width: 50%"
                                                dropdown="true"
                                                converter="#{invPOSRestDTOMB.invDelegatorDTOConvertor}"
                                                value="#{invPOSRestDTOMB.invInvoiceDTO.invDelegatorId}"
                                                var="purchasePerson"
                                                itemLabel="#{purchasePerson}" 
                                                itemValue="#{purchasePerson}" 
                                                forceSelection="true" 
                                                completeMethod="#{invPOSRestDTOMB.completeDelegatorSales}"
                                                >

                                </p:autoComplete>
                            </div>
                            <div class="ui-g-2 ui-xl-2">
                                <p:outputLabel style="" value="الطيار"/>

                            </div>


                        </h:panelGroup>



                        <h:panelGroup rendered="#{invPOSRestDTOMB.invInvoiceDTO.typeRest eq 1}">


                            <div class="ui-g-2 ui-xl-2" rendered="#{invPOSRestDTOMB.invInvoiceDTO.typeRest eq 1}">
                                <p:selectOneMenu value ="#{invPOSRestDTOMB.invInvoiceDTO.tableNumberTo}"  >
                                    <f:selectItem itemLabel="اختر"  itemValue=""  /> 
                                    <f:selectItem itemLabel="1"  itemValue="1"  />                            
                                    <f:selectItem itemLabel="2" itemValue="2" />
                                    <f:selectItem itemLabel="3" itemValue="3" />
                                    <f:selectItem itemLabel="4"  itemValue="4"  />                            
                                    <f:selectItem itemLabel="5" itemValue="5" />
                                    <f:selectItem itemLabel="6" itemValue="6" />
                                    <f:selectItem itemLabel="7"  itemValue="7"  />                            
                                    <f:selectItem itemLabel="8" itemValue="8" />
                                    <f:selectItem itemLabel="9" itemValue="9" />
                                    <f:selectItem itemLabel="10"  itemValue="10"  />                            
                                    <f:selectItem itemLabel="11" itemValue="11" />
                                    <f:selectItem itemLabel="12" itemValue="12" />
                                    <p:ajax update="@form"
                                            process="@form"
                                            event="itemSelect"
                                            listener="#{invPOSRestDTOMB.transferTable()}" />
                                </p:selectOneMenu>
                            </div>


                            <div class="ui-g-2 ui-xl-2" rendered="#{invPOSRestDTOMB.invInvoiceDTO.typeRest eq 1}">
                                <p:outputLabel value="تحويل الي طاوله"   />
                            </div>



                            <div class="ui-g-2 ui-xl-2">
                                <p:selectOneMenu value ="#{invPOSRestDTOMB.invInvoiceDTO.tableNumber}"  >
                                    <f:selectItem itemLabel="1"  itemValue="1"  />                            
                                    <f:selectItem itemLabel="2" itemValue="2" />
                                    <f:selectItem itemLabel="3" itemValue="3" />
                                    <f:selectItem itemLabel="4"  itemValue="4"  />                            
                                    <f:selectItem itemLabel="5" itemValue="5" />
                                    <f:selectItem itemLabel="6" itemValue="6" />
                                    <f:selectItem itemLabel="7"  itemValue="7"  />                            
                                    <f:selectItem itemLabel="8" itemValue="8" />
                                    <f:selectItem itemLabel="9" itemValue="9" />
                                    <f:selectItem itemLabel="10"  itemValue="10"  />                            
                                    <f:selectItem itemLabel="11" itemValue="11" />
                                    <f:selectItem itemLabel="12" itemValue="12" />
                                    <p:ajax update="@form"
                                            process="@form"
                                            event="itemSelect"
                                            listener="#{invPOSRestDTOMB.selectTable()}" />
                                </p:selectOneMenu>
                            </div>
                            <div class="ui-g-2 ui-xl-2">
                                <p:outputLabel value="رقم الطاوله"   />
                            </div>



                        </h:panelGroup>

                    </h:panelGroup>


                </div>



                <div class="ui-g-12 ui-xl-12">

                    <p:dataTable id="invPurchaseInvoiceDetailsTable" 
                                 widgetVar="invPurchaseInvoiceDetailsTable"
                                 style="margin-bottom:20px; height: 60% "
                                 var="invPurchaseInvoiceDetailsTable"
                                 rowIndexVar="index" 
                                 dir="rtl" 
                                 emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                                 editMode="cell"
                                 selectionMode="single"
                                 scrollRows="10" scrollable="true" liveScroll="true" scrollHeight="350"  
                                 sortBy="#{1}"
                                 rowKey="#{invPurchaseInvoiceDetailsTable.index}"
                                 selection="#{invPOSRestDTOMB.invInvoiceDTO.invPurchaseInvoiceDetailsSelected}"
                                 value="#{invPOSRestDTOMB.invInvoiceDTO.invPurchaseInvoiceDetailList}" >



                        <p:column id="itemName" headerText="#{userData.userDDs['ITEM_NAME']}"  >
                            <p:outputLabel value="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail.name}" />
                        </p:column>

                        <p:column id="Quantity" headerText="#{userData.userDDs['NUMBER']}">

                            <p:outputLabel id="QuantityT"  value="#{invPurchaseInvoiceDetailsTable.quantity}" />
                            
                        </p:column>
                        <p:column  id="sellPrice" headerText="#{userData.userDDs['SELLING_PRICE']}">
                            <p:inputText id="sellPriceValue" readonly="true" 
                                         disabled="true"
                                         value="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail.sellPrice}"  />  

                        </p:column>

                        <p:column id="DISCOUNT" headerText="#{userData.userDDs['DISCOUNT']}">
                            <p:inputText id="discountT" 
                                         value="#{invPurchaseInvoiceDetailsTable.discount}" 
                                         disabled="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail == null}">
                                <p:ajax listener="#{invPOSRestDTOMB.validateDiscountColumn(invPurchaseInvoiceDetailsTable)}"
                                        update="discountT netId totalQuantity  totalNet :form:totalNetAfterDiscount "/>
                            </p:inputText>  
                        </p:column>


                        <p:column id="net" headerText="#{userData.userDDs['TOTAL']}" >
                            <p:outputLabel id="netId" value="#{invPurchaseInvoiceDetailsTable.net}"   />
                        </p:column>

                        <p:column  >
                            <p:commandButton  id="b7" icon="fa fa-remove" 
                                              class="sdeleteButtons" style="color: #fff!important;background-color: red"
                                              title="#{userData.userDDs['DELETE']}" 
                                              actionListener="#{invPOSRestDTOMB.deleteInvDetail(invPurchaseInvoiceDetailsTable)}" 
                                              update="@form"  
                                              immediate="true"
                                              ajax="true" />
                        </p:column>



                        <p:summaryRow>
                            <p:column style="text-align:right">
                                <h:outputText style="text-align:right" value="#{userData.userDDs['TOTAL']}  :" />
                            </p:column>
                            <p:column>
                                <h:outputText id="totalQuantity" value="#{invPOSRestDTOMB.invInvoiceDTO.totalQuatity}"/>
                            </p:column>
                            <p:column />                            
                            <p:column />
                            <p:column>
                                <h:outputText id="totalNet" value="#{invPOSRestDTOMB.invInvoiceDTO.totalNet}"/>
                            </p:column>
                            <p:column />
                        </p:summaryRow>
                    </p:dataTable>
                </div>

                <div class="ui-g-12 ui-xl-12">


                    <div class="ui-g-2 ui-xl-2">
                        <h:outputText id="totalNetAfterDiscount" 
                                      style="text-align:right" 
                                      value="#{invPOSRestDTOMB.invInvoiceDTO.totalNetAfterDiscount}" />
                    </div>
                    <div class="ui-g-2 ui-xl-2">
                        <p:outputLabel style="width: 155px;" value="#{userData.userDDs['TOT_AF_TOT_DIS']}"/>

                    </div>
                    <div class="ui-g-2 ui-xl-2">
                        <p:inputText id="discount" value="#{invPOSRestDTOMB.invInvoiceDTO.discount}"  
                                     style="width: 50%;display: inline!important" >
                            <p:ajax event="blur"

                                    listener="#{invPOSRestDTOMB.recalcHeadValues()}"
                                    update=" form:totalNetAfterDiscount "  />
                        </p:inputText>

                        <p:outputLabel id="per" style="display: inline!important" value="%"/>

                    </div>
                    <div class="ui-g-2 ui-xl-2">
                        <p:outputLabel style="width: 100px" value="#{userData.userDDs['DISC_ON_INVOICE']}"/>

                    </div>

                    <div class="ui-g-2 ui-xl-2">
                        <p:selectOneMenu style="width: 60%" id="PURCHASE_NUMBER" 

                                         value="#{invPOSRestDTOMB.invInvoiceDTO.discountType}"  >                                                             
                            <f:selectItem itemLabel="#{userData.userDDs['VALUE']}"  itemValue="0"  />
                            <f:selectItem itemLabel="#{userData.userDDs['RATIO']}"  itemValue="1"  />

                            <p:ajax 
                                update=" form:totalNetAfterDiscount "
                                listener="#{invPOSRestDTOMB.recalcHeadValues()}" />
                        </p:selectOneMenu>     
                    </div>
                    <div class="ui-g-2 ui-xl-2">
                        <p:outputLabel style="width: 70px;" value="#{userData.userDDs['DISCOUNT_TYPE']}"/>

                    </div>




                </div>

                <div class="ui-g-12 ui-xl-12">
                    <div class="ui-g-2 ui-xl-2">
                        <p:inputText style="width: 50px;" /> 
                    </div>
                    <div class="ui-g-2 ui-xl-2">
                        <p:outputLabel value="ملاحظات" style="width: 40px;" />  
                    </div>


                    <div class="ui-g-2 ui-xl-2">
                        <p:outputLabel id="remain" value="#{invPOSRestDTOMB.invInvoiceDTO.remain}" />

                    </div>

                    <div class="ui-g-2 ui-xl-2">
                        <p:outputLabel value="الباقي" />
                    </div>
                    <div class="ui-g-2 ui-xl-2">
                        <p:inputText  value="#{invPOSRestDTOMB.invInvoiceDTO.payed}" style="width: 50px">
                            <p:ajax listener="#{invPOSRestDTOMB.calculateRemainValue()}"
                                    update="remain"/>
                        </p:inputText>

                    </div>
                    <div class="ui-g-2 ui-xl-2">
                        <p:outputLabel value="نقدا" />
                    </div>
                </div>



                <div class="ui-g-12 ui-xl-12">
                    <div class="ui-g-1 ui-xl-1">
                        <p:commandButton    action="#{loginBean.logout}"   icon="fa fa-sign-out-alt" 
                                            id="logout"   ajax="false" style="background-color:#CC1C1C; border-radius: 50%; " class="material-icons" />
                    </div>
                    <div class="ui-g-2 ui-xl-2" >
                        <p:commandButton rendered="#{invPOSRestDTOMB.invInvoiceDTO.typeRest eq 1}" value="إغلاق الطاولة" update="@form"  action="#{invPOSRestDTOMB.closeTable()}" />
                    </div>

                    <div class="ui-g-1 ui-xl-1">
                        <p:commandButton value="جديدre"  action="#{invPOSRestDTOMB.resetRedirect()}"  update="@form" />
                    </div>

                    <div class="ui-g-1 ui-xl-1">
                        <p:commandButton value="جديد"  action="#{invPOSRestDTOMB.resetRest()}"  update="@form" />
                    </div>

                    <div class="ui-g-2 ui-xl-2">
                        <p:commandButton rendered="#{invPOSRestDTOMB.invInvoiceDTO.id ne null}" 
                                         ajax="false"
                                         onclick="form.target = '_blank'" 
                                         value="طباعة"  
                                         action="#{invPOSRestDTOMB.printRest()}" update="@form"/>
                    </div>
                    <div class="ui-g-2 ui-xl-2">
                        <p:commandButton rendered="#{invPOSRestDTOMB.invInvoiceDTO.id ne null and invPOSRestDTOMB.eating and invPOSRestDTOMB.invInvoiceDTO.inventorySetupDTO.printType ne null}" 
                                         ajax="false"
                                         onclick="form.target = '_blank'" 
                                         value="المأكولات"  
                                         action="#{invPOSRestDTOMB.printRest(1)}" update="@form"/>
                    </div>
                    <div class="ui-g-2 ui-xl-2">
                        <p:commandButton rendered="#{invPOSRestDTOMB.invInvoiceDTO.id ne null and invPOSRestDTOMB.drinking and invPOSRestDTOMB.invInvoiceDTO.inventorySetupDTO.printType ne null}" 
                                         ajax="false"
                                         onclick="form.target = '_blank'" 
                                         value="المشروبات"  
                                         action="#{invPOSRestDTOMB.printRest(2)}" update="@form"/>
                    </div>

                    <div class="ui-g-1 ui-xl-1">
                        <p:commandButton  id="saveB" rendered="#{(invPOSRestDTOMB.invInvoiceDTO.id eq null)}"
                                          class="saveButtons"
                                          title="#{userData.userDDs['SAVE']}"
                                          value="#{userData.userDDs['SAVE']}" 
                                          action="#{invPOSRestDTOMB.save()}"
                                          update="@form"/>
                    </div>
                </div>
            </div>
            <div class="ui-g-6 ui-xl-6">

                <div class="ui-g-6 ui-xl-6">
                    <div class="ui-g-12 ui-xl-6">


                        <p:dataTable id="itemTable" var="car" value="#{invPOSRestDTOMB.itemList}" selectionMode="single"
                                     scrollRows="20" scrollable="true" liveScroll="true" scrollHeight="450"  
                                     selection="#{invPOSRestDTOMB.itemSelected}" rowKey="#{car.id}">
                            <f:facet name="header">
                                الأصناف
                            </f:facet>
                            <p:column headerText="الصنف">
                                <h:outputText value="#{car.name}" />
                            </p:column>
                            <p:column headerText="السعر">
                                <h:outputText value="#{car.sellPrice}" />
                            </p:column>


                            <f:facet name="footer">
                                <p:commandButton process="itemTable" update=":form:invPurchaseInvoiceDetailsTable :form:totalNetAfterDiscount :form:amountScreen" icon="pi pi-search" value="إضافة" actionListener="#{invPOSRestDTOMB.addDetail()}" />
                            </f:facet>

                        </p:dataTable>


                    </div>


                </div>
                <div class="ui-g-6 ui-xl-6">
                    <div class="ui-g-12 ui-xl-12">

                        <p:dataTable id="groupTable" 
                                     widgetVar="groupTable"
                                     style="margin-bottom:20px"
                                     var="groupTable" scrollRows="20" scrollable="true" liveScroll="true" scrollHeight="300"
                                     rowIndexVar="index" 
                                     dir="rtl" 
                                     emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                                     selectionMode="single"
                                     sortBy="#{1}"
                                     rowKey="#{groupTable.id}"
                                     selection="#{invPOSRestDTOMB.groupSelected}"
                                     value="#{invPOSRestDTOMB.groupList}" >

                            <p:ajax event="rowSelect" listener="#{invPOSRestDTOMB.selectGroup()}" update="form:itemTable" />
                            <f:facet name="header">
                                المجموعات
                            </f:facet>
                            <p:column  >
                                <h:outputText value="#{groupTable.name}"  />
                            </p:column>
                        </p:dataTable>

                    </div>

                    <div class="ui-g-12 ui-xl-12" style="height: 15%">
                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-3 ui-xl-3">
                                <p:outputLabel value="العدد" style="width: 20px;" />  
                            </div>

                            <div class="ui-g-3 ui-xl-3">
                                <p:commandButton value="1" actionListener="#{invPOSRestDTOMB.concatAmount(1)}" update="amountScreen" />
                            </div>
                            <div class="ui-g-3 ui-xl-3">
                                <p:commandButton value="2" actionListener="#{invPOSRestDTOMB.concatAmount(2)}" update="amountScreen" /> 

                            </div>
                            <div class="ui-g-3 ui-xl-3">
                                <p:commandButton value="3" actionListener="#{invPOSRestDTOMB.concatAmount(3)}" update="amountScreen" />
                            </div>



                        </div>
                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-3 ui-xl-3">
                                <p:inputText id="amountScreen" style="width: 40px;" value="#{invPOSRestDTOMB.amount}" readonly="true" />  
                            </div>
                            <div class="ui-g-3 ui-xl-3">
                                <p:commandButton value="4" actionListener="#{invPOSRestDTOMB.concatAmount(4)}" update="amountScreen" />
                            </div>
                            <div class="ui-g-3 ui-xl-3">
                                <p:commandButton value="5" actionListener="#{invPOSRestDTOMB.concatAmount(5)}" update="amountScreen" /> 

                            </div>
                            <div class="ui-g-3 ui-xl-3">
                                <p:commandButton value="6" actionListener="#{invPOSRestDTOMB.concatAmount(6)}" update="amountScreen" />
                            </div>

                        </div>
                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-3 ui-xl-3">
                                <p:commandButton value="حذف" actionListener="#{invPOSRestDTOMB.removeAmount()}" update="amountScreen"/>
                            </div>
                            <div class="ui-g-3 ui-xl-3">
                                <p:commandButton value="7" actionListener="#{invPOSRestDTOMB.concatAmount(7)}" update="amountScreen" />
                            </div>
                            <div class="ui-g-3 ui-xl-3">
                                <p:commandButton value="8" actionListener="#{invPOSRestDTOMB.concatAmount(8)}" update="amountScreen" /> 

                            </div>
                            <div class="ui-g-3 ui-xl-3">
                                <p:commandButton value="9" actionListener="#{invPOSRestDTOMB.concatAmount(9)}" update="amountScreen" />
                            </div>
                        </div>
                        <div class="ui-g-12 ui-xl-12">

                            <div class="ui-g-4 ui-xl-4">
                                <p:commandButton value="1/2" actionListener="#{invPOSRestDTOMB.concatAmount(0.50)}" update="amountScreen" />
                            </div>
                            <div class="ui-g-4 ui-xl-4">
                                <p:commandButton value="0" actionListener="#{invPOSRestDTOMB.concatAmount(0)}" update="amountScreen" /> 
                            </div>
                            <div class="ui-g-4 ui-xl-4">
                                <p:commandButton value="1/4" actionListener="#{invPOSRestDTOMB.concatAmount(0.25)}" update="amountScreen" /> 

                            </div>
                        </div>
                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-4 ui-xl-4">
                                <p:commandButton value="1/3" actionListener="#{invPOSRestDTOMB.concatAmount(0.333)}" update="amountScreen" />
                            </div>

                            <div class="ui-g-4 ui-xl-4">
                                <p:commandButton value="1/8" actionListener="#{invPOSRestDTOMB.concatAmount(0.125)}" update="amountScreen" />
                            </div>
                            <div class="ui-g-4 ui-xl-4">
                                <p:commandButton value="3/4" actionListener="#{invPOSRestDTOMB.concatAmount(0.75)}" update="amountScreen" />
                            </div>

                        </div>

                    </div>



                </div>




            </div>






        </h:form>
    </ui:define>


</ui:composition>
