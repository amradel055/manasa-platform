<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">


        <h:form id="form" dir="#{userData.dir}" class='formmargin'>

            <div >
                <p:messages id="curmsg" autoUpdate="true" showDetail="true" rendered="true" closable="true"/>   
            </div>

            <p:fieldset  legend="البيانات"> 
                <div class="ui-g-6 ui-xl-6">

                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <p:inputText  style="width:69%"  value="#{invCreateBarcodeFormMB.invInvoiceDTO.loadedSerial}" >
                                <p:ajax listener="#{invCreateBarcodeFormMB.calcAfterPayNet()}"/>
                            </p:inputText>

                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel   style="width: 95px; " value=" رقم فاتوره التحميل "/>

                        </div>
                    </div>
                </div>
                <div class="ui-g-6 ui-xl-6">

                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <p:autoComplete style="width:37%"  id="inventoryDTO" widgetVar="inventoryDTO"
                                            dropdown="true"
                                            converter="#{invCreateBarcodeFormMB.invInventoryDTOConverter}"
                                            value="#{invCreateBarcodeFormMB.invInvoiceDTO.invInventoryId}"
                                            var="inventoryDTO" 
                                            itemLabel="#{inventoryDTO}" 
                                            itemValue="#{inventoryDTO}" 
                                            forceSelection="true" 
                                            completeMethod="#{invCreateBarcodeFormMB.completeInventory}" 
                                            >
                            </p:autoComplete>
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 100px;" value="#{userData.userDDs['DEPOSITORY']}"/>

                        </div>
                    </div>

                </div>
                <div style="text-align:center">
                    <p:commandButton  id="excute" 
                                      class="saveButtons"
                                      title="تنفيذ"
                                      value="تنفيذ" 
                                      action="#{invCreateBarcodeFormMB.loadInvPurchaseWithSerial()}"
                                      update="@form"/></div>
            </p:fieldset>

            <p:fieldset id="fieldSetId" legend="التفاصيل"  style="margin:2% 0">

                <h:panelGrid  class="col-md-12" columns="1"  style="margin-top:2%">

                    <h:panelGroup  class="centerButtons">


                        <p:dataTable id="invPurchaseInvoiceDetailsTable" class="salesInvoiceTable"
                                     widgetVar="invPurchaseInvoiceDetailsTable"
                                     style="margin-bottom:20px"
                                     var="invPurchaseInvoiceDetailsTable"
                                     rowIndexVar="index" 
                                     dir="rtl" 
                                     emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                                     editable="true"
                                     editMode="cell"
                                     selectionMode="single"
                                     sortBy="#{1}"
                                     rowKey="#{invPurchaseInvoiceDetailsTable.index}"
                                     selection="#{invCreateBarcodeFormMB.invInvoiceDTO.invPurchaseInvoiceDetailsSelected}"
                                     value="#{invCreateBarcodeFormMB.invInvoiceDTO.invPurchaseInvoiceDetailList}" >

                            <f:facet name="header" >
                                <p:commandButton  id="addnew"
                                                  class="saddButton"
                                                  icon="fa fa-plus"
                                                  title="#{userData.userDDs['ADD']}" 
                                                  actionListener="#{invCreateBarcodeFormMB.addInvDetail()}" 
                                                  update=":form:fieldSetId"  
                                                  oncomplete="PrimeFaces.focus('form:invPurchaseInvoiceDetailsTable:'+#{invCreateBarcodeFormMB.invInvoiceDTO.invPurchaseInvoiceDetailList.size()}+':invItemNameIn')"
                                                  immediate="true"
                                                  ajax="true"
                                                  style="float:right"/>

                                <p:commandButton   title="بحث" 
                                                   class="sreloadButtons" style="background-color:rgb(162, 46, 247);border-radius: 3px;margin-bottom:3px"

                                                   onclick="PF('dlg4').show();"
                                                   icon="fa fa-fw fa-search-plus" >
                                </p:commandButton>
                            </f:facet>

                            <p:column headerText="#" style="width: 4vh;text-align:center;border-radius: 0px" >
                                <h:outputText value="#{invPurchaseInvoiceDetailsTable.serial}"  />
                            </p:column>

                            <p:column style="width: 30vh;text-align: -webkit-auto;border-radius: 0px;font-size: 10px;" id="itemName" headerText="#{userData.userDDs['ITEM']}" 
                                      filterBy="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail}" 
                                      filterMatchMode="contains" 
                                      sortBy="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail}"
                                      filterable="false">
                                <p:outputLabel value="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail}" 
                                               rendered="#{invPurchaseInvoiceDetailsTable.isEdit}" />
                                <p:autoComplete id="invItemNameIn"  
                                                style="width:100%"
                                                rendered="#{not invPurchaseInvoiceDetailsTable.isEdit}"
                                                converter="#{autoComplete.itemsBarcodesDetailsViewConverter}"
                                                value="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail}"
                                                maxResults="20"
                                                var="item"
                                                itemLabel="#{item}" 
                                                itemValue="#{item}" 
                                                forceSelection="true" 
                                                completeMethod="#{autoComplete.completeItemsBarcodesDetailsView}" >
                                    <p:ajax update="costTt"
                                            event="itemSelect" listener="#{invCreateBarcodeFormMB.validateItems(invPurchaseInvoiceDetailsTable)}" />
                                </p:autoComplete>            
                            </p:column>


                            <p:column style="width: 8vh;text-align: -webkit-auto;border-radius: 0px"
                                      id="Quantity"
                                      headerText="#{userData.userDDs['NUMBER']}"
                                      filterBy="#{invPurchaseInvoiceDetailsTable.quantity}" 
                                      filterMatchMode="contains" 
                                      sortBy="#{invPurchaseInvoiceDetailsTable.quantity}"
                                      filterable="false">

                                <p:inputText id="QuantityT"  
                                             value="#{invPurchaseInvoiceDetailsTable.quantity}" 
                                             style="width:95%">
                                </p:inputText>        

                            </p:column>

                            <p:column style="width: 8vh;text-align: -webkit-auto;border-radius: 0px" id="COST" headerText="#{userData.userDDs['PRICE']}"
                                      >   
                                <p:outputLabel id="costTt" value="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail.sellPrice}"   />
                            </p:column>

                            <p:column  style="width: 13vh;text-align: -webkit-auto;border-radius: 0px" id="availableQuantityRow"

                                       filterBy="#{invPurchaseInvoiceDetailsTable.availableQuantityRow}" 
                                       filterMatchMode="contains" 
                                       sortBy="#{invPurchaseInvoiceDetailsTable.availableQuantityRow}"
                                       filterable="false"
                                       headerText="المتاح">
                                <p:outputLabel id="availableQuantityRowValue" value="#{invPurchaseInvoiceDetailsTable.availableQuantityRow}" style="width: 95%" />  

                            </p:column>

                            <p:column 
                                rendered="#{invCreateBarcodeFormMB.columnRender}"
                                style="width: 13vh;text-align: center;border-radius: 0px" 
                                headerText="#{userData.userDDs['TRANSACTION']}">

                                <p:commandButton  id="b7" icon="fa fa-plus" 
                                                  class="saddbuttonins" 
                                                  title="#{userData.userDDs['ADD']}" 
                                                   onkeyup="myFunction(this)"
                                         onkeydown="myFunction2(this)"
                                                  rendered="#{invCreateBarcodeFormMB.invInvoiceDTO.loadedSerial eq null}"
                                                  actionListener="#{invCreateBarcodeFormMB.addInvDetail()}" 
                                                  update=":form:fieldSetId"  
                                                  immediate="true"
                                                  oncomplete="PrimeFaces.focus('form:invPurchaseInvoiceDetailsTable:'+#{invCreateBarcodeFormMB.invInvoiceDTO.invPurchaseInvoiceDetailList.size()}+':invItemNameIn')"
                                                  ajax="true" />

                                <p:commandButton  update="invPurchaseInvoiceDetailsTable           "
                                                  title="#{userData.userDDs['DELETE']}" 
                                                  class="sdeleteButtons" 
                                                   onkeyup="myFunction(this)"
                                         onkeydown="myFunction2(this)"

                                                  action="#{invCreateBarcodeFormMB.deleteInvDetail(invPurchaseInvoiceDetailsTable)}"
                                                  icon="fa fa-remove" >
                                    <p:confirm header="#{userData.userDDs['COFIGRATION']}" 
                                               message="#{userData.userDDs['ARE_YOU_SURE']}"
                                               icon="ui-icon-alert" />
                                </p:commandButton>

                                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                                    <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                                    <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                                </p:confirmDialog>
                            </p:column >

                        </p:dataTable>



                    </h:panelGroup>

                </h:panelGrid>
            </p:fieldset>

            <p:commandButton  class="printButtons"
                              ajax="false"
                              onclick="form.target = '_blank'"  
                              title="#{userData.userDDs['PRINT']}"
                              value="#{userData.userDDs['PRINT']} Barcode380_125" 
                              actionListener="#{invCreateBarcodeFormMB.printBarcode380_125()}"/>
            <p:commandButton  class="printButtons"
                              ajax="false"
                              onclick="form.target = '_blank'"  
                              title="#{userData.userDDs['PRINT']}"
                              value="#{userData.userDDs['PRINT']} Barcode380_25" 
                              actionListener="#{invCreateBarcodeFormMB.printBarcode380_25()}"/>

            <div class="ui-g-6 ui-xl-6" >

                <p:dialog header="البحث عن صنف" widgetVar="dlg4" showEffect="explode" hideEffect="bounce" height="440" width="500" style="margin-top: 2%">

                    <h:panelGroup>
                        <p:outputLabel style="width: 10vh" value="الصنف"/>
                    </h:panelGroup> 
                    <h:panelGroup>
                        <p:inputText value="#{invCreateBarcodeFormMB.itemName}"/>  
                    </h:panelGroup>

                    <h:panelGroup style="margin-right: 6%">

                        <p:commandButton     class="saveButton"  
                                             title="#{userData.userDDs['SAVE']}"
                                             value="بحث" 
                                             icon="fa fa-fw fa-save" 
                                             action="#{invCreateBarcodeFormMB.findAllItemsBarcodesDetailsViewBranchId()}"
                                             update="@form"
                                             >
                        </p:commandButton>

                    </h:panelGroup>

                    <h:panelGroup>
                        <p:dataTable id="itemTable"
                                     draggableColumns="true" 
                                     var="itemTable" 
                                     style="margin-top: 5%"
                                     widgetVar="itemTable" 
                                     rowIndexVar="index" 
                                     dir="rtl" 
                                     selection="#{invCreateBarcodeFormMB.itemsBarcodesDetailsViewListForSearchSelected}"
                                     value="#{invCreateBarcodeFormMB.itemsBarcodesDetailsViewListForSearch}" 
                                     selectionMode="single"
                                     rowKey="#{itemTable.id}"  scrollable="true" scrollHeight="250"
                                     emptyMessage="#{userData.userDDs['EMPTY_TABLE']}">

                            <f:facet name="header" >
                                <p:outputPanel  >
                                    <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                                    <p:inputText id="globalFilter" onkeyup="PF('itemTable').filter()" style="width:150px" />
                                </p:outputPanel>
                            </f:facet>

                            <p:column style="width:2vw;font-size:0.8vw;text-align: right;border-radius: 0px"
                                      filterStyle="display:none"
                                      filterBy="#{itemTable.barcode}"
                                      filterMatchMode="contains"
                                      headerText="الكود" 
                                      sortBy="#{itemTable.barcode}" 
                                      >
                                <p:outputLabel value="#{itemTable.barcode}" />
                            </p:column>  

                            <p:column style="width:10vw;font-size:0.8vw;text-align: right;border-radius: 0px"
                                      filterStyle="display:none" filterBy="#{itemTable.name}"
                                      filterMatchMode="contains"
                                      headerText="الصنف" 
                                      sortBy="#{itemTable.name}" >
                                <p:outputLabel value="#{itemTable.name}" />
                            </p:column>  
                        </p:dataTable> 

                    </h:panelGroup>

                    <h:panelGroup>
                        <br/>
                        <p:commandButton     class="saveButton"  
                                             title="#{userData.userDDs['SAVE']}"
                                             value="تحميل" 
                                             icon="fa fa-fw fa-save" 
                                             action="#{invCreateBarcodeFormMB.putItemsBarcodesDetailsViewBranchId()}"
                                             update="@form"
                                             >
                        </p:commandButton>
                    </h:panelGroup>

                </p:dialog>



            </div>

        </h:form>


        <script>

            document.addEventListener("keydown", function (e) {
                console.log(e.which);
                if (e.which === 13) {
                    e.preventDefault();
                    return false;
                }
                ;
            });


        </script>
        <script>

            function myFunction(x) {
                x.style.background = "black";
            }
            function myFunction2(x) {
                x.style.background = "yellow";
            }
        </script>
    </ui:define>
</ui:composition>
