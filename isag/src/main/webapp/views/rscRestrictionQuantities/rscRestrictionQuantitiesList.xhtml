<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">

        <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form  dir="#{userData.dir}" id="form" class='formmargin'>
           
            <div class="col-xs-12">
                <p:messages id="curmsg" showDetail="true" rendered="true" closable="true"/>   
            </div>
            <p:fieldset   legend="#{userData.userDDs['Limit_Of_Quantity']}" >


                <p:dataTable 
                    var="rscRestrictionTable"
                    widgetVar="rscRestrictionTable" 
                    rowIndexVar="index"
                    value="#{rscRestrictionQuantitiesListMB.rscRestrictionQuantitiesDTOList}" 
                    rows="#{userData.rowListCount}"
                    paginator="true"
                    emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                    id="rscRestrictionTable">

                    <f:facet name="header" class="col-md-12">
                        <p:commandButton  class="saddButton" icon="fa fa-plus" title="#{userData.userDDs['ADD']}"
                                          id="addA"
                                          action="#{rscRestrictionQuantitiesListMB.goToAdd()}" style="float:right"/>
                        <p:blockUI block="form" trigger="addA" animate="true" >

                            <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                        </p:blockUI> 

                        <p:outputPanel  >
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" onkeyup="PF('rscRestrictionTable').filter()" style="width:150px" />
                        </p:outputPanel>
                    </f:facet>

                    <p:column  style="width: 5vh;font-size: 1.9vh;text-align: -webkit-auto;border-radius: 0px;" 
                               headerText="#" >
                        <p:outputLabel value="#{index +1}" />
                    </p:column>

                    <p:column style="width: 7vh;font-size: 1.9vh;text-align: -webkit-auto;border-radius: 0px;" 
                              filterStyle="display:none" filterBy="#{rscRestrictionTable.serial}"
                              filterMatchMode="contains" headerText="#{userData.userDDs['NUMB']}" sortBy="#{rscRestrictionTable.serial}">
                        <p:outputLabel value="#{rscRestrictionTable.serial}" />
                    </p:column>
                    <p:column style="width: 12vh;font-size: 1.9vh;text-align: -webkit-auto;border-radius: 0px;" filterStyle="display:none" 
                              filterBy="#{rscRestrictionTable.contractor.name}"
                              filterMatchMode="contains" headerText="المقاول" sortBy="#{rscRestrictionTable.contractor.name}">
                        <p:outputLabel value="#{rscRestrictionTable.contractor.name}"/>
                    </p:column>  
                    <p:column style="width: 9vh;font-size: 1.9vh;text-align: -webkit-auto;border-radius: 0px;" filterStyle="display:none" filterBy="#{rscRestrictionTable.date}"
                              filterMatchMode="contains" headerText="#{userData.userDDs['DATEE']}" sortBy="#{rscRestrictionTable.date}">
                        <p:outputLabel value="#{rscRestrictionTable.date}" >
                            <f:convertDateTime type="date" pattern="dd-MM-yyyy"/>
                        </p:outputLabel>
                    </p:column>



                    <p:column style="width: 5vh;font-size: 1.9vh;text-align: center;border-radius: 0px;"
                              headerText="#{userData.userDDs['TRANSACTION']}">

                        <p:commandButton  class="seditButtons" 
                                          icon="fa fa-fw fa-edit" 
                                          title="#{userData.userDDs['EDIT']}" style="background-color: #6a6967;border-radius: 3px;"
                                          action="#{rscRestrictionQuantitiesListMB.goToEdit()}" >
                            <f:setPropertyActionListener value="#{rscRestrictionTable}"  
                                                         target="#{rscRestrictionQuantitiesListMB.rscRestrictionQuantitiesDTOSelected}" />
                        </p:commandButton>

                        <p:commandButton class="sdeleteButtons" update="@form" icon="fa fa-remove" style="background-color: red;border-radius: 3px;"
                                         title="#{userData.userDDs['DELETE']}"  action="#{rscRestrictionQuantitiesListMB.delete}" disabled="#{rscRestrictionTable.active}">
                            <f:setPropertyActionListener value="#{rscRestrictionTable}" target="#{rscRestrictionQuantitiesListMB.rscRestrictionQuantitiesDTOSelected}" />
                            <p:confirm header="Confirmation" message="#{userData.userDDs['ARE_YOU_SURE']}" icon="ui-icon-alert" />
                        </p:commandButton>
                        <p:commandButton 
                            class="sprintButtons"
                            update="@form" onclick="form.target = '_blank'"  ajax="false"
                            icon="fa fa-fw fa-print" style="background-color: rgb(1, 76, 134)!important;border-radius: 3px;"
                            title="print" 
                            action="#{rscRestrictionQuantitiesListMB.print()}" 
                            >

                            <f:setPropertyActionListener value="#{rscRestrictionTable}" target="#{rscRestrictionQuantitiesListMB.rscRestrictionQuantitiesDTOSelected}" />
                        </p:commandButton>
                    </p:column>

                </p:dataTable> 
                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                    <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                    <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                </p:confirmDialog>
            </p:fieldset>
        </h:form>
    </ui:define>
</ui:composition>
