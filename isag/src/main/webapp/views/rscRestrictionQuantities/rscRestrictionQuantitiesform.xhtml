<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/newTemplate.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">

        <style>

            .ui-tabs.ui-tabs-top>.ui-tabs-nav {
                padding: 0;
            }
            .ui-tabs .ui-tabs-nav li a {
                border-radius: 10px;}
            .ui-tabs.ui-tabs-top>.ui-tabs-nav li {
                border-radius: 10px;
                top: 0;
            }
            .ui-tabs .ui-tabs-panel {
                padding: 10px 5px;
            }
            .ui-widget-content {

                background: inherit;}
            </style>
            <h:form  style="margin-right: 15px" dir="#{userData.dir}"  id="form">

                <p:fieldset id="extract" legend="حصر الكميات" style="font-size: 19px !important;">
                <div class="col-xs-12">
                    <p:messages id="curmsg" showDetail="true" rendered="true" closable="true"/>   
                </div>
                <div class="ui-g-12 ui-g-nopad">

                    <div class="ui-g">

                        <div class="ui-g-12 ui-md-6">

                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel  style="width: 95px; font-size: 17px !important;" value="الرقم"/>
                                </h:panelGroup> 

                                <h:panelGroup>

                                    <h:panelGroup>
                                        <p:outputLabel style="width: 50%" value="#{rscRestrictionQuantitiesFormMB.restrictionQuantitiesDTO.serial}"/>
                                    </h:panelGroup> 


                                </h:panelGroup> 
                            </h:panelGroup>

                        </div>

                        <div class="ui-g-12 ui-md-6"></div>


                       


                        <div class="ui-g-12 ui-md-6">

                            <p:outputLabel style="width: 95px; font-size: 17px !important;" value="التاريخ"/>
                            <p:calendar  pattern="dd/MM/yyyy" style="width: 50%"  id="date" value="#{rscRestrictionQuantitiesFormMB.restrictionQuantitiesDTO.date}"   
                                        />

                        </div>
                        


                      
                       
                        <div class="ui-g-12 ui-md-6">

                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel  style="width: 95px; font-size: 17px !important;" value=" المقاول"/>
                                </h:panelGroup> 

                                <h:panelGroup>

<!--                                    <h:panelGroup>
                                        <p:outputLabel style="width: 25%" value="#{rscRestrictionQuantitiesFormMB.restrictionQuantitiesDTO.contractId.siteId.code}"/>
                                    </h:panelGroup> -->

                                    <h:panelGroup>
                                        <p:outputLabel style="width: 50%; font-size: 15px !important;" value="#{rscRestrictionQuantitiesFormMB.restrictionQuantitiesDTO.contractId.siteId.name}"/>
                                    </h:panelGroup>


                                </h:panelGroup> 
                            </h:panelGroup>

                        </div>

                      

                    </div>
                </div>

            </p:fieldset>

    
            <p:fieldset id="contract" legend="العقد" style="font-size: 19px !important; margin-top: 2%;">
                <div class="ui-g-12 ui-md-6">

                    <h:panelGroup>
                        <h:panelGroup>
                            <p:outputLabel  style="width: 130px; font-size: 17px !important; " value="رقم العقد"/>
                        </h:panelGroup> 

                        <h:panelGroup>

                            <h:panelGroup>
                                <p:outputLabel id="contractnum" style="width: 50%; font-size: 15px !important;" value="#{rscRestrictionQuantitiesFormMB.restrictionQuantitiesDTO.contractId.id}"/>
                            </h:panelGroup> 


                        </h:panelGroup> 
                    </h:panelGroup>

                </div>
                <div class="ui-g-12 ui-md-6">

                    <h:panelGroup>
                        <h:panelGroup>
                            <p:outputLabel  style="width: 130px; font-size: 17px !important; " value="الرقم الدفترى للعقد"/>
                        </h:panelGroup> 

                        <h:panelGroup>

                            <h:panelGroup>
                                <p:outputLabel  id="contractdocnum" style="width: 50%; font-size: 15px !important;" value="#{rscRestrictionQuantitiesFormMB.restrictionQuantitiesDTO.contractId.documentNumber}"/>
                            </h:panelGroup> 


                        </h:panelGroup> 
                    </h:panelGroup>

                </div>

               
                <div class="ui-g-12 ui-md-6">

                    <h:panelGroup>
                        <h:panelGroup>
                            <p:outputLabel  style="width: 130px; font-size: 17px !important; " value="اجمالى فيمة العقد"/>
                        </h:panelGroup> 

                        <h:panelGroup>

                            <h:panelGroup>
                                <p:outputLabel id="totalValue" style="width: 60%; font-size: 15px !important;" value="#{rscRestrictionQuantitiesFormMB.restrictionQuantitiesDTO.contractId.contractTotal}"/>
                            </h:panelGroup> 


                        </h:panelGroup> 
                    </h:panelGroup>

                </div>
             

            </p:fieldset>



            <p:fieldset id="data" style=" margin-top: 2%">
                <p:dataTable id="detail"
                             var="detail"
                             dir="rtl" 
                             sortBy="#{1}"
                             rowKey="#{detail.index}"
                             rowIndexVar="index" 
                             emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                             widgetVar="detail"
                             value="#{rscRestrictionQuantitiesFormMB.restrictionQuantitiesDTO.rscRestrictionQuantitiesDetailDTOList}" >

                    <f:facet name="header" class="col-md-12">
                        <p:commandButton   class="saddButton" id="addnew"
                                           icon="fa fa-plus"
                                           title="#{userData.userDDs['ADD']}" 
                                           actionListener="#{rscRestrictionQuantitiesFormMB.addChild()}" 
                                           update="form"                                         
                                           ajax="true"
                                           style="float:right"/>
                        <p:outputPanel>
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" onkeyup="PF('detail').filter()" style="width:150px" />
                        </p:outputPanel>
                    </f:facet>
                    <p:column style="width: 17vh;text-align: -webkit-auto" id="itemName" headerText="البند" 
                              filterBy="#{detail.guideDTO}" 
                              filterMatchMode="contains" 
                              sortBy="#{detail.guideDTO}"
                              filterable="false">
                        <p:autoComplete id="itemNameIn"  
                                        style="width:95%"
                                        converter="#{rscRestrictionQuantitiesFormMB.rscWorkUnitsGuideDTOConverter}"
                                        value="#{detail.guideDTO}"
                                        var="item"
                                        itemLabel="#{item}" 
                                        itemValue="#{item}" 
                                        forceSelection="true"  
                                        completeMethod="#{rscRestrictionQuantitiesFormMB.completeWorkUnitsGuideDTO}" >
                            <p:ajax update="unitName contractQuantity" listener="#{rscRestrictionQuantitiesFormMB.validateUnitGuide()}"
                                    event="itemSelect"  />
                            <p:ajax update="unitName contractQuantity" listener="#{rscRestrictionQuantitiesFormMB.validateUnitGuide()}"
                                    event="change"  />

                        </p:autoComplete>            
                    </p:column>
                   
                    <p:column style="width: 17vh;font-size: 1.8vh;text-align: right" headerText="#{userData.userDDs['UNIT']}" >
                        <p:outputLabel  id="unitName" value="#{detail.guideDTO.unitName.name}"/>
                    </p:column>
                    <p:column style="width: 17vh;font-size: 1.8vh;text-align: right" headerText="الكمية بالعقد" >
                        <p:outputLabel  id="contractQuantity" value="#{detail.contractQty}"/>
                    </p:column>
                   
                    <p:column style="width: 10vh;font-size: 1.8vh;text-align: right"  headerText="#{userData.userDDs['TRANSACTION']}">

                        <p:commandButton  class="saddButton" id="addnew2"
                                          icon="fa fa-plus"
                                          title="#{userData.userDDs['ADD']}" 
                                          actionListener="#{rscRestrictionQuantitiesFormMB.addChild()}" 
                                          update="detail"                                         
                                          ajax="true"
                                          style="float:right"/>

                        <p:commandButton  class="sdeleteButton" update="detail"
                                          title="#{userData.userDDs['DELETE']}" 
                                          action="#{rscRestrictionQuantitiesFormMB.deleteRscExtractDetail()}"
                                          icon="fa fa-remove" >

                            <f:setPropertyActionListener value="#{detail}"
                                                         target="#{rscRestrictionQuantitiesFormMB.rscRestrictionQuantitiesDetailDTOSelected}"/>
                            <p:confirm header="#{userData.userDDs['COFIGRATION']}" 
                                       message="#{userData.userDDs['ARE_YOU_SURE']}"
                                       icon="ui-icon-alert" />
                        </p:commandButton>

                        <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                            <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                            <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                        </p:confirmDialog>
                    </p:column >





                </p:dataTable>

                <h:panelGroup>
                    <div class="centerButtons" style="margin-top:2%">

                        <p:commandButton class="saveButton" 
                                         title="#{userData.userDDs['SAVE']}"
                                         value="#{userData.userDDs['SAVE']}"
                                         icon="fa fa-fw fa-save"
                                         action="#{rscRestrictionQuantitiesFormMB.save()}" 
                                         id="saveB"
                                         update="@form"/>



                        <p:commandButton class="newButton" 
                                         value="#{userData.userDDs['NEW']}"
                                         title="#{userData.userDDs['NEW']}"
                                         icon="fa fa-fw fa-undo"  
                                         action="#{rscRestrictionQuantitiesFormMB.reset}" 
                                         update="form" id="undo"/>
                        <p:commandButton   class="reloadButton"
                                           id="loadL"  title="#{userData.userDDs['UPLOAD']}"
                                           value="#{userData.userDDs['UPLOAD']}" 
                                           icon="fa fa-fw fa-spinner"
                                           action="#{rscRestrictionQuantitiesFormMB.OpenDlg('dlg2')}"
                                           update="@form"/>
                         <p:commandButton  class="deleteButton" id="cancel" title="#{userData.userDDs['CANCEL']}"
                                          value="#{userData.userDDs['CANCEL']}" icon="fa fa-fw fa-backward"
                                          action="#{rscRestrictionQuantitiesFormMB.exit()}"
                                          update="form"/>
                           <p:commandButton  class="PrintButton"
                                          id="PrintB"
                                          ajax="false"
                                          onclick="form.target = '_blank'"  
                                          icon="fa fa-fw fa-print"
                                          value="#{userData.userDDs['PRINT']}" 
                                          actionListener="#{rscRestrictionQuantitiesFormMB.print()}"
                                          title="#{userData.userDDs['PRINT']}"
                                          immediate="true" />

                        <p:blockUI block="form" trigger="saveB  undo" animate="true" >

                            <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                        </p:blockUI>


                    </div>
                </h:panelGroup>

            </p:fieldset>
            <h:panelGrid columns="1" cellpadding="5">

                <h:panelGroup>




                    <p:dialog id="dlg2" header="تحميل العقود" widgetVar="dlg2" modal="true" style="height: fit-content;width: fit-content">

                        <p:tabView id="tabsBar">
                            <p:tab id="tab1" title="العقد"  >

                                <p:dataTable id="contractList"
                                             draggableColumns="true" 
                                             var="contract"
                                             widgetVar="contract"  
                                             rowIndexVar="index" 
                                             dir="rtl"  selectionMode="single"
                                             selection="#{rscRestrictionQuantitiesFormMB.restrictionQuantitiesDTO.contractId}"
                                             value="#{rscRestrictionQuantitiesFormMB.contractRegisterDTOList}" 
                                             rowKey="#{contract}"
                                             rows="#{userData.rowListCount}" 
                                             paginator="true" 
                                             emptyMessage="#{userData.userDDs['EMPTY_TABLE']}" >

                                    <p:column style="width: 12vh;font-size: 1.5vh;text-align: -webkit-auto" 
                                              filterStyle="display:none" filterBy="#{contract.serial}"
                                              filterMatchMode="contains" 
                                              headerText="رقم العقد"
                                              sortBy="#{contract.serial}">
                                        <p:outputLabel value="#{contract.serial}" />
                                    </p:column>


                                    <p:column style="width: 14vh;text-align:right;font-size: 1.8vh" 
                                              filterStyle="display:none"
                                              filterBy="#{contract.siteId.name}" 
                                              filterMatchMode="contains"
                                              headerText="المقاول" 
                                              sortBy="#{contract.siteId.name}">
                                        <p:outputLabel value="#{contract.siteId.name}" />
                                    </p:column>
                                    <p:column style="width: 14vh;text-align:right;font-size: 1.8vh" 
                                              filterStyle="display:none"
                                              filterBy="#{contract.contractTotal}" 
                                              filterMatchMode="contains"
                                              headerText="اجمالى قيمة العقد" 
                                              sortBy="#{contract.contractTotal}">
                                        <p:outputLabel value="#{contract.contractTotal}" />
                                    </p:column>
                                </p:dataTable> 
                            </p:tab>
                        </p:tabView>

                        <p:commandButton class="reloadButton" update="contract extract data" 
                                         icon="fa fa-fw fa-spinner" 
                                         action="#{rscRestrictionQuantitiesFormMB.loadcontract()}"
                                         title="#{userData.userDDs['UPLOAD']}"  >

                        </p:commandButton>


                    </p:dialog>

                </h:panelGroup>
              

            </h:panelGrid>

        </h:form>

    </ui:define>


</ui:composition>
