<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"

    <ui:define name="content">
        <h:form id="form" dir="#{userData.dir}" class='formmargin' enctype="multipart/form-data">


            <p:fieldset legend="#{userData.userDDs['TENDER']}">

                <div class="ui-g-12 ui-g-nopad">

                    <div class="ui-g">

                        <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:autoComplete style="width:37%!important" maxResults="10"
                                                    dropdown="true" 
                                                    value="#{rscTenderFormMB.tenderDTO.customerId}" 
                                                    converter="#{rscTenderFormMB.customerConverter}"
                                                    completeMethod="#{rscTenderFormMB.completeInvOrganizationSite}"
                                                    var="customer"
                                                    itemLabel="#{customer}" 
                                                    itemValue="#{customer}" 
                                                    forceSelection="true" 
                                                    >

                                    </p:autoComplete>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 120px;" value="#{userData.userDDs['OWNER']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText   class="tender-box" value="#{rscTenderFormMB.tenderDTO.docNumber}"/>

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel class="tender-doc-num" value="#{userData.userDDs['DOCUM_NO']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 115px;" value="#{userData.userDDs['TEXT_DATE']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:selectOneMenu id="tenderType" class="tender-box" value="#{rscTenderFormMB.tenderDTO.type}" >

                                        <f:selectItem itemLabel="#{userData.userDDs['SUB_CONTRACTOR']}" itemValue="1" noSelectionOption="true" />
                                    </p:selectOneMenu>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel class="tender-type"   value="#{userData.userDDs['TENDER_TYPE']}" />

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText class="tender-box" readonly="true" value="#{rscTenderFormMB.tenderDTO.serial}"/>

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel  class="tender-no" value="#{userData.userDDs['TENDER_NO']}"/>

                                </div>
                            </div>
                        </div>


                        <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 125px;"   value="#{rscTenderFormMB.tenderDTO.statusText}" />

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 125px;"   value="#{userData.userDDs['TENDER_STATUS']}" />

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:autoComplete style="width:38%!important" maxResults="10"
                                                    dropdown="true" 
                                                    converter="#{rscTenderFormMB.professionalBusinessConsultantConverter}"
                                                    completeMethod="#{rscTenderFormMB.completeProfessionalBusinessConsultant}"  
                                                    value="#{rscTenderFormMB.tenderDTO.profissionalBussinessConsultant}" 
                                                    var="profissionalBussinessConsultant"
                                                    itemLabel="#{profissionalBussinessConsultant}" 
                                                    itemValue="#{profissionalBussinessConsultant}" 
                                                    forceSelection="true">

                                    </p:autoComplete>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel class="spec-bus" value="#{userData.userDDs['SPEC_BUSI_CONS']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:autoComplete style="width:37%!important" maxResults="10"
                                                    dropdown="true" 
                                                    converter="#{rscTenderFormMB.generalConsultanConverter}" 
                                                    completeMethod="#{rscTenderFormMB.completegeneralConsultant}" 
                                                    value="#{rscTenderFormMB.tenderDTO.generalConsultant}" 
                                                    var="generalConsultant"
                                                    itemLabel="#{generalConsultant}" 
                                                    itemValue="#{generalConsultant}" 
                                                    forceSelection="true">

                                    </p:autoComplete>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 120px;" value="#{userData.userDDs['GENERAL_CONS']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:autoComplete style="width:37%!important" maxResults="10"
                                                    dropdown="true"
                                                    value="#{rscTenderFormMB.tenderDTO.projectManager}" 
                                                    converter="#{rscTenderFormMB.projectManagerConverter}"
                                                    completeMethod="#{rscTenderFormMB.completeProjectManager}"
                                                    var="projectManager"
                                                    itemLabel="#{projectManager}" 
                                                    itemValue="#{projectManager}" 
                                                    forceSelection="true" >

                                    </p:autoComplete>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel class="spec-bus" value="#{userData.userDDs['PROJ_MANAGER']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                        <p:inputText   class="sum-tender-box"  value="#{rscTenderFormMB.tenderDTO.remark}"/>

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel class="sum-tender" value="#{userData.userDDs['SUM_TEND_DESC']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 95px"   value="#{rscTenderFormMB.tenderDTO.contractorName}" />

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 95px"   value="المقاول" />

                                </div>
                            </div>
                        </div>




                    </div>
                </div>









            </p:fieldset>


            <p:fieldset id="data" style=" margin-top: 2%">
                <p:tabView> 
                    <p:tab class="firsttab" title="#{userData.userDDs['Bid_Details']}" >
                        <p:dataTable class="datatable-dir-en" id="detail"
                                     var="detail"
                                     dir="rtl" 
                                     sortBy="#{1}"
                                     rowKey="#{detail}"
                                     rowIndexVar="index" 
                                     emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                                     widgetVar="detail"
                                     value="#{rscTenderFormMB.tenderDTO.rscTenderDetailWorkUnitDTOList}" >

                            <f:facet name="header" class="col-md-12">
                                <p:commandButton   class="saddButton" id="addnew"
                                                   icon="fa fa-plus"
                                                   title="#{userData.userDDs['ADD']}" 
                                                   actionListener="#{rscTenderFormMB.addDetail()}" 
                                                   update="detail"                                         
                                                   ajax="true"
                                                   style="float:right"
                                                   rendered="#{!rscTenderFormMB.tenderDTO.active}"/>
                                <p:outputPanel>
                                    <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                                    <p:inputText id="globalFilter" onkeyup="PF('detail').filter()" style="width:150px" />
                                </p:outputPanel>
                            </f:facet>
                            <p:column style="width: 10vh;text-align: -webkit-auto;border-radius: 0px" id="itemName" headerText="#{userData.userDDs['ITEM']}"

                                      filterMatchMode="contains" 
                                      sortBy="#{detail.guideDTO}"
                                      filterable="false">
                                <p:autoComplete id="itemNameIn"  maxResults="10"
                                                style="width:95%"
                                                converter="#{rscTenderFormMB.rscWorkUnitsGuideDTOConverter}"
                                                value="#{detail.guideDTO}"
                                                var="item"
                                                itemLabel="#{item}" 
                                                itemValue="#{item}" 
                                                forceSelection="true"  
                                                completeMethod="#{rscTenderFormMB.completeWorkUnitsGuideDTO}" >
                                    <p:ajax update="unitName" listener="#{rscTenderFormMB.validateUnitGuide()}"
                                            event="itemSelect"  />
                                    <p:ajax update="unitName" listener="#{rscTenderFormMB.validateUnitGuide()}"
                                            event="change"  />

                                </p:autoComplete>            
                            </p:column>
                            <p:column style="width: 17vh;font-size: 1.8vh;text-align: center;border-radius: 0px" headerText="#{userData.userDDs['UNIT']}" >
                                <p:outputLabel  id="unitName" value="#{detail.guideDTO.unitName.name}"/>
                            </p:column>
                            <p:column style="width: 17vh;font-size: 1.8vh;text-align: center;border-radius: 0px" headerText="#{userData.userDDs['QUANTITY']}" >
                                <p:inputNumber value="#{detail.quantity}">
                                    <p:ajax event="blur" update="totalQuantity totalValue" listener="#{rscTenderFormMB.updateWorkUnitSummary()}" />
                                    <p:ajax event="blur" update="totalsUnit" listener="#{rscTenderFormMB.calculateTotalUnits()}" />
                                </p:inputNumber>
                            </p:column>
                            <p:column style="width: 17vh;font-size: 1.8vh;text-align: center;border-radius: 0px" headerText="#{userData.userDDs['Price']}" >
                                <p:inputNumber value="#{detail.price}">
                                    <p:ajax event="blur" update="totalsUnit totalValue" listener="#{rscTenderFormMB.calculateTotalUnits()}" />
                                </p:inputNumber>
                            </p:column>
                            <p:column style="width: 17vh;font-size: 1.8vh;text-align: center;border-radius: 0px" headerText="#{userData.userDDs['Total']}" >
                                <h:outputText id="totalsUnit" value="#{detail.total}" />
                            </p:column>
                            <p:column style="width: 17vh;font-size: 1.8vh;text-align: center;border-radius: 0px" headerText="#{userData.userDDs['Notes']}" >
                                <p:inputText value="#{detail.remarks}">
                                </p:inputText>
                            </p:column>


                            <p:column style="width: 14vh;font-size: 1.8vh;text-align: center;border-radius: 0px"  headerText="#{userData.userDDs['TRANSACTION']}"  rendered="#{!rscTenderFormMB.tenderDTO.active}">

                                <p:commandButton  class="saddButtons" id="addnew2"
                                                  icon="fa fa-plus"
                                                  title="#{userData.userDDs['ADD']}" 
                                                  actionListener="#{rscTenderFormMB.addDetail()}" 
                                                  update="detail"                                         
                                                  ajax="true" 
                                                  >

                                </p:commandButton>

                                <p:commandButton  class="sdeleteButtons" update="detail"
                                                  title="#{userData.userDDs['DELETE']}" 
                                                  action="#{rscTenderFormMB.deleteDetail}"
                                                  icon="fa fa-remove" >

                                    <f:setPropertyActionListener value="#{detail}"
                                                                 target="#{rscTenderFormMB.rscTenderDetailWorkUnitDTOSelected}"/>
                                    <p:confirm header="#{userData.userDDs['COFIGRATION']}" 
                                               message="#{userData.userDDs['ARE_YOU_SURE']}"
                                               icon="ui-icon-alert" />
                                </p:commandButton>

                                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                                    <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                                    <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                                </p:confirmDialog>
                            </p:column >




                            <p:summaryRow>
                                <p:column colspan="2" style="text-align:center">
                                    <h:outputText style="text-align:center" value="#{userData.userDDs['TOTAL']}  :" />
                                </p:column>
                                <p:column>
                                    <h:outputText id="totalQuantity" value="#{rscTenderFormMB.tenderDTO.totalAmount}"/>
                                </p:column>
                                <p:column>
                                    <h:outputText id="totalValue" value="#{rscTenderFormMB.tenderDTO.totalValue}"/>
                                </p:column>
                                <p:column  style="text-align:center">
                                    <h:outputText style="text-align:center" value="" />
                                </p:column>
                                <p:column  style="text-align:center">
                                    <h:outputText style="text-align:center" value="" />
                                </p:column>
                                <p:column  style="text-align:center"  rendered="#{!rscTenderFormMB.tenderDTO.active}">
                                    <h:outputText style="text-align:center" value="" />
                                </p:column>
                            </p:summaryRow>

                        </p:dataTable>
                    </p:tab>
                    <p:tab  title="#{userData.userDDs['Earnings']}" > 
                        <p:dataTable class="datatable-dir-en" id="accrual"
                                     var="accrual"
                                     dir="rtl" 
                                     sortBy="#{1}"
                                     rowKey="#{accrual}"
                                     rowIndexVar="index"  
                                     emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                                     widgetVar="accrual"
                                     value="#{rscTenderFormMB.tenderDTO.rscTenderRscAccrualDeductionDTOAccruaList}" >

                            <f:facet name="header" class="col-md-12">
                                <p:commandButton   class="saddButton" id="addnew"
                                                   icon="fa fa-plus"
                                                   title="#{userData.userDDs['ADD']}" 
                                                   actionListener="#{rscTenderFormMB.addAccrualDetail()}" 
                                                   update="accrual"                                         
                                                   ajax="true"
                                                   rendered="#{!rscTenderFormMB.tenderDTO.active}"/>
                                <p:outputPanel>
                                    <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                                    <p:inputText id="globalFilter" onkeyup="PF('accrual').filter()" style="width:150px" />
                                </p:outputPanel>
                            </f:facet>
                            <p:column style="width: 10vh;text-align: -webkit-auto;border-radius: 0px" headerText="#{userData.userDDs['Earnings']}" >
                                <p:autoComplete style="width:83%" maxResults="10"
                                                dropdown="true"
                                                required="true"
                                                converter="#{rscTenderFormMB.rscAccuralConverter}"
                                                value="#{accrual.rscAccrualDeductionId}"
                                                var="AccuralDeduction"
                                                itemLabel="#{AccuralDeduction}" 
                                                itemValue="#{AccuralDeduction}" 
                                                forceSelection="true" 
                                                completeMethod="#{rscTenderFormMB.completeAccural}" >
                                </p:autoComplete>
                            </p:column>
                            <p:column style="width: 17vh;font-size: 1.8vh;text-align: center;border-radius: 0px" headerText="#{userData.userDDs['Rate']}" >
                                <p:inputNumber value="#{accrual.percentage}">
                                    <p:ajax event="blur" update="totAccu" listener="#{rscTenderFormMB.updateAccuralSummary()}" />
                                </p:inputNumber> 
                            </p:column>

                            <p:column style="width: 14vh;font-size: 1.8vh;text-align: center;border-radius: 0px"  headerText="#{userData.userDDs['TRANSACTION']}"  rendered="#{!rscTenderFormMB.tenderDTO.active}">

                                <p:commandButton  class="saddButtons" id="addnew2"
                                                  icon="fa fa-plus"
                                                  title="#{userData.userDDs['ADD']}" 
                                                  actionListener="#{rscTenderFormMB.addAccrualDetail()}" 
                                                  update="accrual"                                         
                                                  ajax="true"
>
                                </p:commandButton>

                                <p:commandButton  class="sdeleteButtons" update="accrual"
                                                  title="#{userData.userDDs['DELETE']}" 
                                                  action="#{rscTenderFormMB.deleteAccrualDetail()}"
                                                  icon="fa fa-remove" >

                                    <f:setPropertyActionListener value="#{accrual}"
                                                                 target="#{rscTenderFormMB.rscTenderRscAccrualDeductionDTOSelected}"/>
                                    <p:confirm header="#{userData.userDDs['COFIGRATION']}" 
                                               message="#{userData.userDDs['ARE_YOU_SURE']}"
                                               icon="ui-icon-alert" />
                                </p:commandButton>

                                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                                    <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                                    <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                                </p:confirmDialog>
                            </p:column >
                            <p:summaryRow>
                                <p:column colspan="1" style="text-align:center;border-radius: 0px">
                                    <h:outputText value="#{userData.userDDs['Total']}" />
                                </p:column>
                                <p:column>
                                    <h:outputText id="totAccu" value="#{rscTenderFormMB.tenderDTO.totalAccural}">
                                        <f:convertNumber type="currency" />
                                    </h:outputText>
                                </p:column>
                                <p:column>

                                </p:column>

                            </p:summaryRow>
                        </p:dataTable> 
                    </p:tab>
                    <p:tab class="secondtab" title="#{userData.userDDs['Deduction']}" >
                        <p:dataTable class="datatable-dir-en" id="deduction"
                                     var="deduction"
                                     dir="rtl" 
                                     sortBy="#{1}"
                                     rowKey="#{deduction}"
                                     rowIndexVar="index"  
                                     emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                                     widgetVar="deduction"
                                     value="#{rscTenderFormMB.tenderDTO.rscTenderRscAccrualDeductionDTODeductionList}" >

                            <f:facet name="header" class="col-md-12">
                                <p:commandButton   class="saddButton" id="addnewDeduction"
                                                   icon="fa fa-plus"
                                                   title="#{userData.userDDs['ADD']}" 
                                                   actionListener="#{rscTenderFormMB.addDeductionDetail()}" 
                                                   update="deduction"                                         
                                                   ajax="true"
                                                   rendered="#{!rscTenderFormMB.tenderDTO.active}"/>
                                <p:outputPanel>
                                    <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                                    <p:inputText id="globalFilter" onkeyup="PF('deduction').filter()" style="width:150px" />
                                </p:outputPanel>
                            </f:facet>
                            <p:column style="width: 10vh;text-align: -webkit-auto;border-radius: 0px" headerText="الاستقطاعات" >
                                <p:autoComplete style="width:83%" maxResults="10"
                                                dropdown="true"
                                                required="true"
                                                converter="#{rscTenderFormMB.rscDeductionConverter}"
                                                value="#{deduction.rscAccrualDeductionId}"
                                                var="Deduction"
                                                itemLabel="#{Deduction}" 
                                                itemValue="#{Deduction}" 
                                                forceSelection="true" 
                                                completeMethod="#{rscTenderFormMB.completeDeduction}" >
                                </p:autoComplete>
                            </p:column>
                            <p:column style="width: 17vh;font-size: 1.8vh;text-align: center;border-radius: 0px" headerText="نسبه" >
                                <p:inputNumber value="#{deduction.percentage}">
                                    <p:ajax event="blur" update="totDeduc" listener="#{rscTenderFormMB.updateDeductionAccural()}" />
                                </p:inputNumber> 
                            </p:column>

                            <p:column style="width: 14vh;font-size: 1.8vh;text-align: center;border-radius: 0px"  headerText="#{userData.userDDs['TRANSACTION']}"  rendered="#{!rscTenderFormMB.tenderDTO.active}">

                                <p:commandButton  class="saddButtons" id="addnewDeduction2"
                                                  icon="fa fa-plus"
                                                  title="#{userData.userDDs['ADD']}" 
                                                  actionListener="#{rscTenderFormMB.addDeductionDetail()}" 
                                                  update="deduction"                                         
                                                  ajax="true"
>
                                </p:commandButton>

                                <p:commandButton  class="sdeleteButtons" update="deduction"
                                                  title="#{userData.userDDs['DELETE']}" 
                                                  action="#{rscTenderFormMB.deletedeDuctionDetail()}"
                                                  icon="fa fa-remove" >

                                    <f:setPropertyActionListener value="#{deduction}"
                                                                 target="#{rscTenderFormMB.rscTenderRscAccrualDeductionDTODeductionSelected}"/>
                                    <p:confirm header="#{userData.userDDs['COFIGRATION']}" 
                                               message="#{userData.userDDs['ARE_YOU_SURE']}"
                                               icon="ui-icon-alert" />
                                </p:commandButton>

                                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                                    <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                                    <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                                </p:confirmDialog>
                            </p:column >

                            <p:summaryRow>
                                <p:column colspan="1" style="text-align:center">
                                    <h:outputText value="الإجمالي " />
                                </p:column>
                                <p:column>
                                    <h:outputText id="totDeduc" value="#{rscTenderFormMB.tenderDTO.totalDeduction}">
                                        <f:convertNumber type="currency"  />
                                    </h:outputText>
                                </p:column>
                                <p:column  rendered="#{!rscTenderFormMB.tenderDTO.active}"> 

                                </p:column>
                            </p:summaryRow>

                        </p:dataTable> 
                    </p:tab>
                </p:tabView>  
                              <div id="buttunss" class="asmaa">

                        <p:commandButton class="saveButton"  update="form"
                                         title="#{userData.userDDs['SAVE']}"
                                         value="#{userData.userDDs['SAVE']}"
                                         action="#{rscTenderFormMB.save()}" 
                                         id="saveB"
                                         disabled="#{rscTenderFormMB.tenderDTO.active}"/>



                        <p:commandButton class="newButton" 
                                         value="#{userData.userDDs['NEW']}"
                                         title="#{userData.userDDs['NEW']}"
                                         action="#{rscTenderFormMB.reset}" 
                                         update="form" id="undo"/>
                        <p:commandButton  class="deleteButton" id="cancel" title="#{userData.userDDs['CANCEL']}"
                                          value="#{userData.userDDs['CANCEL']}"  action="#{rscTenderFormMB.exit()}"
                                          update="form"/>
                        <p:commandButton 
                            class="PrintButton"
                            update="@form" onclick="form.target = '_blank'"  ajax="false"
                            icon="fa fa-fw fa-print"
 
                            title="print" 
                            action="#{rscTenderFormMB.print()}" 
                            >
                            </p:commandButton>
                            
                        <p:commandButton  class="closeButton" id="cancel1" title="#{userData.userDDs['BACK']}"
