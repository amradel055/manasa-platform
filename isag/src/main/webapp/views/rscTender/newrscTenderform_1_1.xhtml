<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <h:form id="form" dir="#{userData.dir}" class='formmargin' enctype="multipart/form-data">


            <p:fieldset legend="الكشف"> 
                <p:messages id="messages" showDetail="true" autoUpdate="true"  rendered="true" closable="true"/> 
                
                <div class="ui-g-12 ui-g-nopad">

                    <div class="ui-g">

                        <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:autoComplete style="width:37%!important" maxResults="10"
                                                    dropdown="true" 
                                                    value="#{rscTenderFormMB.tenderDTO.customerId}" 
                                                    converter="#{rscTenderFormMB.customerConverter}"
                                                    completeMethod="#{rscTenderFormMB.completeInvOrganizationSite}"
                                                    var="customer"
                                                    itemLabel="#{customer}" 
                                                    itemValue="#{customer}" 
                                                    forceSelection="true" 
                                                    >

                                    </p:autoComplete>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 120px;" value="المؤسسة"/>

                                </div>
                            </div>

                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:calendar pattern="dd/MM/yyyy" class="tender-date-box"  id="effect" value="#{rscTenderFormMB.tenderDTO.date}"   
                                                required="true"  requiredMessage="#{userData.userDDs['DATE_SHOU_ADD']}"/>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 115px;" value="#{userData.userDDs['TEXT_DATE']}"/>

                                </div>
                            </div>
                        </div>


                    </div>
                </div>


                
                <div class="ui-g-12 ui-g-nopad" id="firstSegment" >
                    <div class="ui-g">
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>

                                <h:panelGroup>
                                    <p:outputLabel style="width: 90px;margin-right: 5%;" value="الرقـــم"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:inputText id="settelmentId" readonly="true" value="#{checkingUpFormMB.hosCheckingUpEntity.serial}"/>
                                </h:panelGroup>

                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>

                                <h:panelGroup>
                                    <p:outputLabel style="width: 55px" value="#{userData.userDDs['DATE']}"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:calendar  style="width:50%!important"  id="date" 
                                                 value="#{checkingUpFormMB.hosCheckingUpEntity.date}"
                                                 pattern="dd/MM/yyyy" >
                                    </p:calendar>
                                </h:panelGroup>

                            </h:panelGroup>             
                        </div>


                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>

                                <h:panelGroup > 
                                    <p:outputLabel style="width: 60px" value=" العيادة"  />
                                </h:panelGroup>
                                <h:panelGroup  >
                                    <p:autoComplete style="width: 40%" id="cli" 
                                                    dropdown="true"
                                                    converter="#{checkingUpFormMB.hosClinicConverter}"
                                                    value="#{checkingUpFormMB.hosCheckingUpEntity.hosClinic}"

                                                    var="clinic"
                                                    itemLabel="#{clinic}" 
                                                    itemValue="#{clinic}" 
                                                    forceSelection="true" 
                                                    completeMethod="#{checkingUpFormMB.completeClinicHosDoctor}" >

                                        <p:ajax 
                                            event="change"
                                            listener="#{checkingUpFormMB.showOrHideDialogForClinics()}" />
                                        <p:ajax 
                                            listener="#{checkingUpFormMB.showOrHideDialogForClinics()}"
                                            event="itemSelect"/>

                                    </p:autoComplete>
                                </h:panelGroup>

                            </h:panelGroup>  
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup > 
                                    <p:outputLabel style="width: 60px" value="المريض"  />
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:autoComplete style="width: 40%" id="MACUCode" 
                                                    dropdown="true"
                                                    converter="#{checkingUpFormMB.hosPatientRegistrationConvertor}"
                                                    value="#{checkingUpFormMB.hosCheckingUpEntity.hosPatientRegistration}"

                                                    var="bank"
                                                    itemLabel="#{bank}" 
                                                    itemValue="#{bank}" 
                                                    forceSelection="true" 
                                                    completeMethod="#{checkingUpFormMB.completeHosPatientRegistration}" >

                                        <p:ajax 
                                            event="change"

                                            listener="#{checkingUpFormMB.calculateTotalAfterDiscountsPerServiceForEach()}" />
                                        <!--                                            update="footerDetails"-->

                                        <p:ajax 
                                            listener="#{checkingUpFormMB.calculateTotalAfterDiscountsPerServiceForEach()}"

                                            event="itemSelect"/>
                                        <!--                                            update="footerDetails"-->
                                    </p:autoComplete>                      
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 90px;margin-right: 6%;" value="نوع الدفع" />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:selectOneMenu   style="width: 50%"  id="paymentType"  
                                                       value="#{checkingUpFormMB.hosCheckingUpEntity.paymentType}" >                                                             
                                        <f:selectItem itemLabel="نقدي" itemValue="0"  />
                                        <f:selectItem itemLabel="بطاقة" itemValue="1"  />
                                    </p:selectOneMenu>  

                                </h:panelGroup>

                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>

                                <h:panelGroup>
                                    <p:outputLabel style="width: 55px" value="#{userData.userDDs['NOTE']}"/>
                                </h:panelGroup>                   
                                <h:panelGroup>
                                    <p:inputText style="width: 50%" value="#{checkingUpFormMB.hosCheckingUpEntity.remark}"/>
                                </h:panelGroup>

                            </h:panelGroup>  
                        </div>
                    </div>
                </div>



            </p:fieldset>


            <p:fieldset id="data" style=" margin-top: 2%">
                <p:tabView> 
                    <p:tab class="firsttab" title="التفاصيل" >
                        <p:dataTable class="datatable-dir-en" id="detail"
                                     var="detail"
                                     dir="rtl" 
                                     sortBy="#{1}"
                                     rowKey="#{detail}"
                                     rowIndexVar="index" 
                                     emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                                     widgetVar="detail"
                                     value="#{rscTenderFormMB.tenderDTO.rscTenderDetailWorkUnitDTOList}" >

                            <f:facet name="header" class="col-md-12">
                                <p:commandButton   class="saddButton" id="addnew"
                                                   icon="fa fa-plus"
                                                   title="#{userData.userDDs['ADD']}" 
                                                   actionListener="#{rscTenderFormMB.addDetail()}" 
                                                   update="detail"                                         
                                                   ajax="true"
                                                   style="float:right"
                                                   rendered="#{!rscTenderFormMB.tenderDTO.active}"/>
                                <p:outputPanel>
                                    <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                                    <p:inputText id="globalFilter" onkeyup="PF('detail').filter()" style="width:150px" />
                                </p:outputPanel>
                            </f:facet>
                            <p:column style="width: 10vh;text-align: -webkit-auto;border-radius: 0px" id="itemName" headerText="#{userData.userDDs['ITEM']}" 
                                      filterBy="#{detail.guideDTO}" 
                                      filterMatchMode="contains" 
                                      sortBy="#{detail.guideDTO}"
                                      filterable="false">
                                <p:autoComplete id="itemNameIn"  maxResults="10"
                                                style="width:95%"
                                                converter="#{rscTenderFormMB.rscWorkUnitsGuideDTOConverter}"
                                                value="#{detail.guideDTO}"
                                                var="item"
                                                itemLabel="#{item}" 
                                                itemValue="#{item}" 
                                                forceSelection="true"  
                                                completeMethod="#{rscTenderFormMB.completeWorkUnitsGuideDTO}" >
                                    <p:ajax update="unitName" listener="#{rscTenderFormMB.validateUnitGuide()}"
                                            event="itemSelect"  />
                                    <p:ajax update="unitName" listener="#{rscTenderFormMB.validateUnitGuide()}"
                                            event="change"  />

                                </p:autoComplete>            
                            </p:column>
                            <p:column style="width: 17vh;font-size: 1.8vh;text-align: center;border-radius: 0px" headerText="#{userData.userDDs['UNIT']}" >
                                <p:outputLabel  id="unitName" value="#{detail.guideDTO.unitName.name}"/>
                            </p:column>
                            <p:column style="width: 17vh;font-size: 1.8vh;text-align: center;border-radius: 0px" headerText="#{userData.userDDs['Price']}" >
                                <p:inputNumber value="#{detail.price}">
                                </p:inputNumber>
                            </p:column>
                            <p:column style="width: 17vh;font-size: 1.8vh;text-align: center;border-radius: 0px" headerText="#{userData.userDDs['Notes']}" >
                                <p:inputText value="#{detail.remarks}">
                                </p:inputText>
                            </p:column>


                            <p:column style="width: 14vh;font-size: 1.8vh;text-align: center;border-radius: 0px"  headerText="#{userData.userDDs['TRANSACTION']}"  rendered="#{!rscTenderFormMB.tenderDTO.active}">

                                <p:commandButton  class="saddButtons" id="addnew2"
                                                  icon="fa fa-plus"
                                                  title="#{userData.userDDs['ADD']}" 
                                                  actionListener="#{rscTenderFormMB.addDetail()}" 
                                                  update="detail"                                         
                                                  ajax="true" 
                                                  >

                                </p:commandButton>

                                <p:commandButton  class="sdeleteButtons" update="detail"
                                                  title="#{userData.userDDs['DELETE']}" 
                                                  action="#{rscTenderFormMB.deleteDetail}"
                                                  icon="fa fa-remove" >

                                    <f:setPropertyActionListener value="#{detail}"
                                                                 target="#{rscTenderFormMB.rscTenderDetailWorkUnitDTOSelected}"/>
                                    <p:confirm header="#{userData.userDDs['COFIGRATION']}" 
                                               message="#{userData.userDDs['ARE_YOU_SURE']}"
                                               icon="ui-icon-alert" />
                                </p:commandButton>

                                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                                    <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                                    <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                                </p:confirmDialog>
                            </p:column >

                        </p:dataTable>
                    </p:tab>
                </p:tabView>  
                <div id="buttunss" class="asmaa">

                    <p:commandButton class="saveButton"  update="form"
                                     title="#{userData.userDDs['SAVE']}"
                                     value="#{userData.userDDs['SAVE']}"
                                     action="#{rscTenderFormMB.save()}" 
                                     id="saveB"/>
                    
                    <p:commandButton class="newButton" 
                                     value="#{userData.userDDs['NEW']}"
                                     title="#{userData.userDDs['NEW']}"
                                     action="#{rscTenderFormMB.reset}" 
                                     update="form" id="undo"/>
                    <p:commandButton  class="deleteButton" id="cancel" title="#{userData.userDDs['CANCEL']}"
                                      value="#{userData.userDDs['CANCEL']}"  action="#{rscTenderFormMB.exit()}"
                                      update="form"/>
                    <p:commandButton 
                        class="PrintButton"
                        update="@form" onclick="form.target = '_blank'"  ajax="false"
                        icon="fa fa-fw fa-print"

                        title="print" 
                        action="#{rscTenderFormMB.print()}" 
                        >
                    </p:commandButton>

                    <p:commandButton  class="closeButton" id="cancel1" title="#{userData.userDDs['BACK']}"
                                      value="#{userData.userDDs['BACK']}"  style="" action="#{rscTenderFormMB.exit()}"
                                      update="form"/>



                    <p:blockUI block="form" trigger="saveB  undo" animate="true" >

                        <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                    </p:blockUI>


                </div>
            </p:fieldset>

            <script type="text/javascript">
                function c() {
                    document.getElementById("form:j_idt559:document:upload").click();

                }
                function cl() {

                    document.getElementById("form:j_idt559:document:cl").click();
                }
            </script>
        </h:form>

    </ui:define>


</ui:composition>
