<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

            }
            .ui-tabs .ui-tabs-panel {
                padding: 10px 5px;
            }
            .ui-widget-content {

                background: inherit;
            }

            .firsttab{
                right: 500px!important; 
            }

        </style>
        <h:form  style="margin-right: 15px" dir="#{userData.dir}" enctype="multipart/form-data"  id="form">

            <p:fieldset legend="#{userData.userDDs['TENDER']}">

                    <div class="ui-g">

                        <div class="ui-g-12 ui-md-6">

                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel  style="width: 95px" value="#{userData.userDDs['TENDER_NO']}"/>
                                </h:panelGroup> 

                                <h:panelGroup>

                                    <h:panelGroup>
                                        <p:outputLabel style="width: 50%" value="#{rscTenderFormMB.tenderDTO.serial}"/>
                                    </h:panelGroup> 


                                </h:panelGroup> 
                            </h:panelGroup>

                        </div>

                        <div class="ui-g-12 ui-md-6"></div>


                        <div class="ui-g-12 ui-md-6">

                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 95px" value="#{userData.userDDs['DOCUM_NO']}"/>
                                </h:panelGroup> 

                                <h:panelGroup>

                                    <h:panelGroup>
                                        <p:inputText   style="width: 50%" value="#{rscTenderFormMB.tenderDTO.docNumber}"/>
                                    </h:panelGroup> 


                                </h:panelGroup> 
                            </h:panelGroup>

                        </div>


                        <div class="ui-g-12 ui-md-6">

                            <p:outputLabel style="width: 95px" value="#{userData.userDDs['TEXT_DATE']}"/>

                                        required="true"  requiredMessage="#{userData.userDDs['DATE_SHOU_ADD']}"/>

                        </div>

                        <div class="ui-g-12 ui-md-6">

                            <p:outputLabel style="width: 95px"   value="#{userData.userDDs['TENDER_STATUS']}" />

                                <f:selectItem itemLabel="#{userData.userDDs['NOT_AWARDED']}" itemValue="0" noSelectionOption="true" />
                                <f:selectItem itemLabel="#{userData.userDDs['AWARDED']}" itemValue="1" noSelectionOption="true" />
                                <p:ajax listener="#{rscTenderFormMB.updateSummary()}"/>
                                <p:ajax event="change" update="@form" listener="#{rscTenderFormMB.updateSelectedValue}" />
                            </p:selectOneMenu>

                        </div>


                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup id="contractor" rendered="#{rscTenderFormMB.updateSelectedValue}">
                                <h:panelGroup>
                                    <p:outputLabel style="width: 95px"   value="المقاول" />
                                </h:panelGroup> 
                                <h:panelGroup>

                                    <p:autoComplete style="width:71%!important" 
                                                    dropdown="true" 
                                                    value="#{rscTenderFormMB.tenderDTO.contractor}" 
                                                    converter="#{rscTenderFormMB.invOrganizationSiteDTOConverter}"
                                                    completeMethod="#{rscTenderFormMB.completeContructor}"
                                                    var="contractor"
                                                    itemLabel="#{contractor}" 
                                                    itemValue="#{contractor}" 
                                                    forceSelection="true" 
                                                    required="true"
                                                    requiredMessage="يجب ادخال مقاول"
                                                    >

                                    </p:autoComplete>
                                </h:panelGroup> 
                            </h:panelGroup> 
                        </div>


                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 95px" value="#{userData.userDDs['OWNER']}"/>
                                </h:panelGroup> 

                                <h:panelGroup>

                                    <p:autoComplete style="width:71%!important" 
                                                    dropdown="true" 
                                                    value="#{rscTenderFormMB.tenderDTO.customerId}" 
                                                    converter="#{rscTenderFormMB.invOrganizationSiteDTOConverter}"
                                                    completeMethod="#{rscTenderFormMB.completeInvOrganizationSite}"
                                                    var="customer"
                                                    itemLabel="#{customer}" 
                                                    itemValue="#{customer}" 
                                                    forceSelection="true" 
                                                    >

                                    </p:autoComplete>
                                </h:panelGroup> 
                            </h:panelGroup>
                        </div>

                        <div class="ui-g-12 ui-md-6">

                            <h:panelGroup>
                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel style="width: 95px" value="#{userData.userDDs['PROJ_MANAGER']}"/>
                                    </h:panelGroup> 

                                    <h:panelGroup>

                                        <p:autoComplete style="width:71%!important"
                                                        dropdown="true"
                                                        converter="#{rscTenderFormMB.symbolConverter}"
                                                        completeMethod="#{rscTenderFormMB.completeProjectManager}">

                                        </p:autoComplete>
                                    </h:panelGroup> 
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>

                        <div class="ui-g-12 ui-md-6">

                            <h:panelGroup>
                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel style="width: 95px" value="#{userData.userDDs['GENERAL_CONS']}"/>
                                    </h:panelGroup> 

                                    <h:panelGroup>

                                        <p:autoComplete style="width:71%!important"
                                                        dropdown="true" 
                                                        converter="#{rscTenderFormMB.symbolConverter}" 
                                                        completeMethod="#{rscTenderFormMB.completegeneralConsultant}" >

                                        </p:autoComplete>
                                    </h:panelGroup> 
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>

                        <div class="ui-g-12 ui-md-6">

                            <h:panelGroup>
                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel style="width: 95px;font-size: 1.5vh " value="#{userData.userDDs['SPEC_BUSI_CONS']}"/>
                                    </h:panelGroup> 

                                    <h:panelGroup>

                                        <p:autoComplete style="width:71%!important"
                                                        dropdown="true" 
                                                        converter="#{rscTenderFormMB.symbolConverter}"
                                                        completeMethod="#{rscTenderFormMB.completeProfessionalBusinessConsultant}"  >

                                        </p:autoComplete>
                                    </h:panelGroup> 
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>

                        <div class="ui-g-12 ui-md-6">

                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 95px" value="#{userData.userDDs['SUM_TEND_DESC']}"/>
                                </h:panelGroup> 

                                <h:panelGroup>

                                    <h:panelGroup>
                                        <p:inputText   style="width: 50%" value="#{rscTenderFormMB.tenderDTO.remark}"/>
                                    </h:panelGroup> 


                                </h:panelGroup> 
                            </h:panelGroup>

                        </div>

                    </div>
                </div>





                <div class="ui-g-12 ui-g-nopad">

                    <div class="ui-g">

                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>

                                <h:panelGroup>

                                </h:panelGroup>

                                <h:panelGroup style="">

                                </h:panelGroup>

                            </h:panelGroup>


                        </div>
                    </div>
                </div>



            </p:fieldset>


            <p:fieldset id="data" style=" margin-top: 2%">

                    <p:tab class="firsttab" title="تفاصيل العطاء" >
                        <p:dataTable id="detail"
                                     var="detail"
                                     dir="rtl" 
                                     sortBy="#{1}"
                                     rowKey="#{detail}"
                                     rowIndexVar="index" 
                                     emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                                     widgetVar="detail"
                                     value="#{rscTenderFormMB.tenderDTO.rscTenderDetailWorkUnitDTOList}" >

                            <f:facet name="header" class="col-md-12">
                                <p:commandButton   class="saddButton" id="addnew"
                                                   icon="fa fa-plus"
                                                   title="#{userData.userDDs['ADD']}" 
                                                   actionListener="#{rscTenderFormMB.addDetail()}" 
                                                   update="@form"                                         
                                                   ajax="true"
                                                   style="float:right"/>
                                <p:outputPanel>
                                    <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                                    <p:inputText id="globalFilter" onkeyup="PF('detail').filter()" style="width:150px" />
                                </p:outputPanel>
                            </f:facet>
                            <p:column style="width: 10vh;text-align: -webkit-auto" id="itemName" headerText="#{userData.userDDs['ITEM']}" 
                                      filterBy="#{detail.guideDTO}" 
                                      filterMatchMode="contains" 
                                      sortBy="#{detail.guideDTO}"
                                      filterable="false">
                                <p:autoComplete id="itemNameIn"  
                                                style="width:95%"
                                                converter="#{rscTenderFormMB.rscWorkUnitsGuideDTOConverter}"
                                                value="#{detail.guideDTO}"
                                                var="item"
                                                itemLabel="#{item}" 
                                                itemValue="#{item}" 
                                                forceSelection="true"  
                                                completeMethod="#{rscTenderFormMB.completeWorkUnitsGuideDTO}" >
                                    <p:ajax update="unitName" listener="#{rscTenderFormMB.validateUnitGuide()}"
                                            event="itemSelect"  />
                                    <p:ajax update="unitName" listener="#{rscTenderFormMB.validateUnitGuide()}"
                                            event="change"  />

                                </p:autoComplete>            
                            </p:column>
                            <p:column style="width: 17vh;font-size: 1.8vh;text-align: right" headerText="#{userData.userDDs['UNIT']}" >
                                <p:outputLabel  id="unitName" value="#{detail.guideDTO.unitName.name}"/>
                            </p:column>
                            <p:column style="width: 17vh;font-size: 1.8vh;text-align: right" headerText="#{userData.userDDs['QUANTITY']}" >
                                <p:inputNumber value="#{detail.quantity}">
                                    <p:ajax event="blur" update="totalQuantity" listener="#{rscTenderFormMB.updateSummary()}" />
                                </p:inputNumber>
                            </p:column>


                            <p:column style="width: 10vh;font-size: 1.8vh;text-align: right"  headerText="#{userData.userDDs['TRANSACTION']}">

                                <p:commandButton  class="saddButton" id="addnew2"
                                                  icon="fa fa-plus"
                                                  title="#{userData.userDDs['ADD']}" 
                                                  actionListener="#{rscTenderFormMB.addDetail()}" 
                                                  update="detail"                                         
                                                  ajax="true"
                                                  style="float:right">

                                </p:commandButton>

                                <p:commandButton  class="sdeleteButton" update="detail"
                                                  title="#{userData.userDDs['DELETE']}" 
                                                  action="#{rscTenderFormMB.deleteDetail}"
                                                  icon="fa fa-remove" >

                                    <f:setPropertyActionListener value="#{detail}"
                                                                 target="#{rscTenderFormMB.rscTenderDetailWorkUnitDTOSelected}"/>
                                    <p:confirm header="#{userData.userDDs['COFIGRATION']}" 
                                               message="#{userData.userDDs['ARE_YOU_SURE']}"
                                               icon="ui-icon-alert" />
                                </p:commandButton>

                                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                                    <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                                    <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                                </p:confirmDialog>
                            </p:column >




                            <p:summaryRow>
                                <p:column colspan="2" style="text-align:right">
                                    <h:outputText style="text-align:right" value="#{userData.userDDs['TOTAL']}  :" />
                                </p:column>
                                <p:column>
                                    <h:outputText id="totalQuantity" value="#{rscTenderFormMB.tenderDTO.totalAmount}"/>
                                </p:column>
                                <p:column  style="text-align:right">
                                    <h:outputText style="text-align:right" value="" />
                                </p:column>
                            </p:summaryRow>

                        </p:dataTable>
                    </p:tab>
                    <p:tab  title="الاستحقاقات" > 
                        <p:dataTable id="accrual"
                                     var="accrual"
                                     dir="rtl" 
                                     sortBy="#{1}"
                                     rowKey="#{accrual}"
                                     rowIndexVar="index"  
                                     emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                                     widgetVar="accrual"
                                     value="#{rscTenderFormMB.rscTenderRscAccrualDeductionDTOAccrualList}" >

                            <f:facet name="header" class="col-md-12">
                                <p:commandButton   class="saddButton" id="addnew"
                                                   icon="fa fa-plus"
                                                   title="#{userData.userDDs['ADD']}" 
                                                   actionListener="#{rscTenderFormMB.addAccrualDetail()}" 
                                                   update="@form"                                         
                                                   ajax="true"
                                                   style="float:right"/>
                                <p:outputPanel>
                                    <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                                    <p:inputText id="globalFilter" onkeyup="PF('accrual').filter()" style="width:150px" />
                                </p:outputPanel>
                            </f:facet>
                            <p:column style="width: 10vh;text-align: -webkit-auto" headerText="الاستحقاقات" >
                                <p:autoComplete style="width:83%" 
                                                dropdown="true"
                                                required="true"
                                                converter="#{rscTenderFormMB.rscAccuralConverter}"
                                                value="#{accrual.rscAccrualDeductionId}"
                                                var="AccuralDeduction"
                                                itemLabel="#{AccuralDeduction}" 
                                                itemValue="#{AccuralDeduction}" 
                                                forceSelection="true" 
                                                completeMethod="#{rscTenderFormMB.completeAccural}" >
                                </p:autoComplete>
                            </p:column>
                            <p:column style="width: 17vh;font-size: 1.8vh;text-align: right" headerText="نسبه" >
                                <p:inputNumber value="#{accrual.percentage}">
                                    <p:ajax event="blur" update="totAccu" listener="#{rscTenderFormMB.updatePercentage()}" />
                                </p:inputNumber> 
                            </p:column>

                            <p:column style="width: 10vh;font-size: 1.8vh;text-align: right"  headerText="#{userData.userDDs['TRANSACTION']}">

                                <p:commandButton  class="saddButton" id="addnew2"
                                                  icon="fa fa-plus"
                                                  title="#{userData.userDDs['ADD']}" 
                                                  actionListener="#{rscTenderFormMB.addAccrualDetail()}" 
                                                  update="accrual"                                         
                                                  ajax="true"
                                                  style="float:right">
                                </p:commandButton>

                                <p:commandButton  class="sdeleteButton" update="accrual"
                                                  title="#{userData.userDDs['DELETE']}" 
                                                  action="#{rscTenderFormMB.deleteAccrualDetail()}"
                                                  icon="fa fa-remove" >

                                    <f:setPropertyActionListener value="#{accrual}"
                                                                 target="#{rscTenderFormMB.rscTenderRscAccrualDeductionDTOSelected}"/>
                                    <p:confirm header="#{userData.userDDs['COFIGRATION']}" 
                                               message="#{userData.userDDs['ARE_YOU_SURE']}"
                                               icon="ui-icon-alert" />
                                </p:commandButton>

                                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                                    <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                                    <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                                </p:confirmDialog>
                            </p:column >
                            <p:summaryRow>
                                <p:column colspan="1" style="text-align:right">
                                    <h:outputText value="الإجمالي " />
                                </p:column>
                                <p:column>
                                    <h:outputText id="totAccu" value="#{rscTenderFormMB.totalAccural}">
                                        <f:convertNumber type="currency" currencySymbol="$" />
                                    </h:outputText>
                                </p:column>

                            </p:summaryRow>
                        </p:dataTable> 
                    </p:tab>
                    <p:tab class="secondtab" title="الاستقطاعات" >
                        <p:dataTable id="deduction"
                                     var="deduction"
                                     dir="rtl" 
                                     sortBy="#{1}"
                                     rowKey="#{deduction}"
                                     rowIndexVar="index"  
                                     emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                                     widgetVar="deduction"
                                     value="#{rscTenderFormMB.rscTenderRscAccrualDeductionDTODeductionList}" >

                            <f:facet name="header" class="col-md-12">
                                <p:commandButton   class="saddButton" id="addnew"
                                                   icon="fa fa-plus"
                                                   title="#{userData.userDDs['ADD']}" 
                                                   actionListener="#{rscTenderFormMB.addDeductionDetail()}" 
                                                   update="@form"                                         
                                                   ajax="true"
                                                   style="float:right"/>
                                <p:outputPanel>
                                    <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                                    <p:inputText id="globalFilter" onkeyup="PF('deduction').filter()" style="width:150px" />
                                </p:outputPanel>
                            </f:facet>
                            <p:column style="width: 10vh;text-align: -webkit-auto" headerText="الاستقطاعات" >
                                <p:autoComplete style="width:83%" 
                                                dropdown="true"
                                                required="true"
                                                converter="#{rscTenderFormMB.rscDeductionConverter}"
                                                value="#{deduction.rscAccrualDeductionId}"
                                                var="Deduction"
                                                itemLabel="#{Deduction}" 
                                                itemValue="#{Deduction}" 
                                                forceSelection="true" 
                                                completeMethod="#{rscTenderFormMB.completeDeduction}" >
                                </p:autoComplete>
                            </p:column>
                            <p:column style="width: 17vh;font-size: 1.8vh;text-align: right" headerText="نسبه" >
                                <p:inputNumber value="#{deduction.percentage}">
                                    <p:ajax event="blur" update="totDeduc" listener="#{rscTenderFormMB.calculateTotalDeduction()}" />
                                </p:inputNumber> 
                            </p:column>

                            <p:column style="width: 10vh;font-size: 1.8vh;text-align: right"  headerText="#{userData.userDDs['TRANSACTION']}">

                                <p:commandButton  class="saddButton" id="addnew2"
                                                  icon="fa fa-plus"
                                                  title="#{userData.userDDs['ADD']}" 
                                                  actionListener="#{rscTenderFormMB.addDeductionDetail()}" 
                                                  update="deduction"                                         
                                                  ajax="true"
                                                  style="float:right">
                                </p:commandButton>

                                <p:commandButton  class="sdeleteButton" update="deduction"
                                                  title="#{userData.userDDs['DELETE']}" 
                                                  action="#{rscTenderFormMB.deletedeDuctionDetail()}"
                                                  icon="fa fa-remove" >

                                    <f:setPropertyActionListener value="#{deduction}"
                                                                 target="#{rscTenderFormMB.rscTenderRscAccrualDeductionDTODeductionSelected}"/>
                                    <p:confirm header="#{userData.userDDs['COFIGRATION']}" 
                                               message="#{userData.userDDs['ARE_YOU_SURE']}"
                                               icon="ui-icon-alert" />
                                </p:commandButton>

                                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                                    <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                                    <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                                </p:confirmDialog>
                            </p:column >

                            <p:summaryRow>
                                <p:column colspan="1" style="text-align:right">
                                    <h:outputText value="الإجمالي " />
                                </p:column>
                                <p:column>
                                    <h:outputText id="totDeduc" value="#{rscTenderFormMB.totalDeduction}">
                                        <f:convertNumber type="currency" currencySymbol="$" />
                                    </h:outputText>
                                </p:column>

                            </p:summaryRow>

                        </p:dataTable> 
                    </p:tab>
                </p:tabView>  
                <h:panelGroup>
                    <div class="centerButtons" style="margin-top:2%">

                        <p:commandButton class="saveButton"  update="form"
                                         title="#{userData.userDDs['SAVE']}"
                                         value="#{userData.userDDs['SAVE']}"
                                         icon="fa fa-fw fa-save"
                                         action="#{rscTenderFormMB.save()}" 
                                         id="saveB"/>



                        <p:commandButton class="newButton" 
                                         value="#{userData.userDDs['NEW']}"
                                         title="#{userData.userDDs['NEW']}"
                                         icon="fa fa-fw fa-undo"  
                                         action="#{rscTenderFormMB.reset}" 
                                         update="form" id="undo"/>
                        <p:commandButton  class="deleteButton" id="cancel" title="#{userData.userDDs['CANCEL']}"
                                          value="#{userData.userDDs['CANCEL']}" icon="fa fa-fw fa-backward" action="#{rscTenderFormMB.exit()}"
                                          update="form"/>
                        <p:commandButton 
                            class="sprintButton"
                            update="@form" onclick="form.target = '_blank'"  ajax="false"
                            icon="fa fa-fw fa-print" 
                            title="print" 
                            action="#{rscTenderFormMB.print()}" 
                            >
                        </p:commandButton>


                        <p:blockUI block="form" trigger="saveB  undo" animate="true" >

                            <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                        </p:blockUI>


                    </div>
                </h:panelGroup>
            </p:fieldset>

            <script type="text/javascript">
                function c() {
                    document.getElementById("form:j_idt559:document:upload").click();

                }
                function cl() {

                    document.getElementById("form:j_idt559:document:cl").click();
                }
            </script>
        </h:form>

    </ui:define>


</ui:composition>
