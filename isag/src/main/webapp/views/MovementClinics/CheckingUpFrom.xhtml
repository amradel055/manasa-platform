<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">

        <h:form class='formmargin'  id="form" dir="#{userData.dir}">
            <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                  margin-top: 22%;
                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;"
                                  icon="fa fa-fw fa-home"
                                  title="#{userData.userDDs['HOME']}"
                                  class="smhomeButton" 
                                  action="exit" />

            </div>
            <p:fieldset legend="شاشة الحجز" id="whole" style="margin-bottom:20px">

                <div class="col-xs-12">
                    <p:messages id="curmsg" showDetail="true" rendered="true" closable="true"/>   
                </div>

                <div class="ui-g-12 ui-g-nopad" id="firstSegment" >
                    <div class="ui-g">
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>

                                <h:panelGroup>
                                    <p:outputLabel style="width: 90px;margin-right: 5%;" value="الرقـــم"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:inputText id="settelmentId" readonly="true" value="#{checkingUpFormMB.hosCheckingUpEntity.serial}"/>
                                </h:panelGroup>

                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>

                                <h:panelGroup>
                                    <p:outputLabel style="width: 55px" value="#{userData.userDDs['DATE']}"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:calendar  style="width:50%!important"  id="date" 
                                                 value="#{checkingUpFormMB.hosCheckingUpEntity.date}"
                                                 pattern="dd/MM/yyyy" >
                                    </p:calendar>
                                </h:panelGroup>

                            </h:panelGroup>             
                        </div>

                        <div class="ui-g-12 ui-md-6">

                            <h:panelGroup>

                                <h:panelGroup> 
                                    <p:outputLabel style="width: 90px;margin-right: 6%;" value="رقم الخزينة" />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:autoComplete style="width: 40%" id="bankacc" 
                                                    dropdown="true"
                                                    converter="#{checkingUpFormMB.glBankConverter}"
                                                    value="#{checkingUpFormMB.hosCheckingUpEntity.glBank}"

                                                    var="banknum"
                                                    itemLabel="#{banknum}" 
                                                    itemValue="#{banknum}" 
                                                    forceSelection="true" 
                                                    completeMethod="#{checkingUpFormMB.completeGlBank}" >

                                    </p:autoComplete>    

                                </h:panelGroup>   

                            </h:panelGroup>
                        </div>

                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>

                                <h:panelGroup > 
                                    <p:outputLabel style="width: 60px" value=" العيادة"  />
                                </h:panelGroup>
                                <h:panelGroup  >
                                    <p:autoComplete style="width: 40%" id="cli" 
                                                    dropdown="true"
                                                    converter="#{checkingUpFormMB.hosClinicConverter}"
                                                    value="#{checkingUpFormMB.hosCheckingUpEntity.hosClinic}"

                                                    var="clinic"
                                                    itemLabel="#{clinic}" 
                                                    itemValue="#{clinic}" 
                                                    forceSelection="true" 
                                                    completeMethod="#{checkingUpFormMB.completeClinicHosDoctor}" >

                                        <p:ajax 
                                            event="change"
                                            listener="#{checkingUpFormMB.showOrHideDialogForClinics()}" />
                                        <p:ajax 
                                            listener="#{checkingUpFormMB.showOrHideDialogForClinics()}"
                                            event="itemSelect"/>

                                    </p:autoComplete>
                                </h:panelGroup>

                            </h:panelGroup>  
                        </div>
                        
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 90px;margin-right: 6%;" value="نوع الدفع" />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:selectOneMenu   style="width: 50%"  id="paymentType"  
                                                       value="#{checkingUpFormMB.hosCheckingUpEntity.paymentType}" >                                                             
                                        <f:selectItem itemLabel="نقدي" itemValue="0"  />
                                        <f:selectItem itemLabel="بطاقة" itemValue="1"  />
                                    </p:selectOneMenu>  

                                </h:panelGroup>

                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>

                                <h:panelGroup>
                                    <p:outputLabel style="width: 55px" value="#{userData.userDDs['NOTE']}"/>
                                </h:panelGroup>                   
                                <h:panelGroup>
                                    <p:inputText style="width: 50%" value="#{checkingUpFormMB.hosCheckingUpEntity.remark}"/>
                                </h:panelGroup>

                            </h:panelGroup>  
                        </div>
                    </div>
                </div>

                <p:remoteCommand name="onCellEdit"  update="hosCheckDetail" />
                <div> 
                    <p:dataTable 

                        id="hosCheckDetail" 
                        dir="#{userData.dir}" 
                        value="#{checkingUpFormMB.hosCheckingUpDetailEntityList}"
                        var="hosCheckDetail"
                        rowIndexVar="index" 
                        paginator="true" 
                        editable="true"
                        editMode="cell"
                        sortBy="#{1}"
                        selectionMode="single"
                        selection="#{checkingUpFormMB.hosCheckingUpDetailEntitySelected}"
                        widgetVar="hosCheckDetail"
                        rowKey="#{hosCheckDetail}"
                        emptyMessage="#{userData.userDDs['EMPTY_TABLE']}" >



                        <f:facet name="header">

                            <p:commandButton  class="saddButton"  
                                              id="plus2"
                                              icon="fa fa-plus"
                                              title="#{userData.userDDs['ADD']}" 
                                              action="#{checkingUpFormMB.addClosingAccounts()}"
                                              update="form"
                                              ajax="true"
                                              style="float:right"/> 


                            <p:outputPanel>
                                <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                                <p:inputText id="globalFilter" onkeyup="PF('hosCheckDetail').filter()" style="width:150px" />
                            </p:outputPanel>

                        </f:facet>

                        <p:ajax  event="cellEdit" listener="#{checkingUpFormMB.onCellEdit}" />

                        <p:column style="width: 5vh;font-size: 1.5vh;border-radius: 0px;"  id="serail" headerText="#">
                            <h:outputText value="#{index + 1}"  />
                        </p:column> 
                        <p:column style="width: 20vh;font-size: 1.5vh;border-radius: 0px;" headerText="اسم الخدمة">

                            <p:cellEditor>
                                <f:facet name="output">
                                    <p:outputLabel value="#{hosCheckDetail.instProjectGuideId.name}"/>
                                </f:facet>
                                <f:facet name="input">
                                    <p:autoComplete style="width: 95%" id="serviceId" 
                                                    dropdown="true"
                                                    converter="#{checkingUpFormMB.rscWorkUnitsGuideDTOConverter}"
                                                    value="#{hosCheckDetail.instProjectGuideId}"
                                                    var="p"
                                                    itemLabel="#{p}" 
                                                    itemValue="#{p}" 
                                                    forceSelection="false" 
                                                    completeMethod="#{checkingUpFormMB.completeWorkUnitsGuideDTO}">
                                        <f:attribute name="varValue" value="#{hosCheckDetail}" />

                                        <p:ajax update="form"
                                                event="change"
                                                listener="#{checkingUpFormMB.validateUnitGuide}" />
                                        <p:ajax update="form"
                                                listener="#{checkingUpFormMB.validateUnitGuide}"
                                                event="itemSelect"/>
                                    </p:autoComplete>


                                </f:facet>
                            </p:cellEditor>
                        </p:column>
                        <p:column style="width: 15vh;font-size: 1.5vh;border-radius: 0px;" id="value" headerText="#{userData.userDDs['VALUE']}">
                            <p:cellEditor>
                                <f:facet name="output">
                                    <h:outputText  value="#{hosCheckDetail.value}"  />
                                </f:facet>
                                <f:facet name="input">
                                    <h:outputText   style="width: 95%!important"
                                                    value="#{hosCheckDetail.value}">
                                    </h:outputText>
                                </f:facet>
                            </p:cellEditor>
                        </p:column>
                        <p:column style="width: 15vh;font-size: 1.5vh;border-radius: 0px;" id="DISCOUNT_VALUE" headerText="نسبة الخصم">
                            <p:cellEditor>
                                <f:facet name="output">
                                    <h:outputText  value="#{hosCheckDetail.discountRatio}"  />
                                </f:facet>
                                <f:facet name="input">
                                    <h:outputText   style="width: 95%!important"
                                                    value="#{hosCheckDetail.discountRatio}">
                                    </h:outputText>
                                </f:facet>
                            </p:cellEditor>
                        </p:column>
                        <p:column style="width: 15vh;font-size: 1.5vh;border-radius: 0px;" id="BEAR_VALUE" headerText="نسبة التحمل">
                            <p:cellEditor>
                                <f:facet name="output">
                                    <h:outputText  value="#{hosCheckDetail.bearReatio}"  />
                                </f:facet>
                                <f:facet name="input">
                                    <p:inputNumber   style="width: 95%!important"
                                                     value="#{hosCheckDetail.bearReatio}">
                                        <f:attribute name="varValue" value="#{hosCheckDetail}" />
                                        <p:ajax event="blur" process="@this" listener="#{checkingUpFormMB.calculateTotalAfterDiscountsPerService}" update="form"/>
                                    </p:inputNumber>
                                </f:facet>
                            </p:cellEditor>
                        </p:column>
                        <p:column style="width: 15vh;font-size: 1.5vh;border-radius: 0px;" id="ONE_TOTAL" headerText="الاجمالي">
                            <p:cellEditor>
                                <f:facet name="output">
                                    <h:outputText  value="#{hosCheckDetail.total}"  />
                                </f:facet>
                                <f:facet name="input">
                                    <h:outputText   style="width: 95%!important"
                                                    value="#{hosCheckDetail.total}">
                                    </h:outputText>
                                </f:facet>
                            </p:cellEditor>
                        </p:column>
                        <p:column   style="width:10vh;font-size:1.6vh;text-align: right;border-radius: 0px;"  headerText="العمليات"  >

                            <p:commandButton  class="saddbuttonin" icon="fa fa-plus" title="#{userData.userDDs['ADD']}" 
                                              action="#{checkingUpFormMB.addClosingAccounts()}"
                                              id="plus"
                                              update="form"
                                              ajax="true"
                                              />  

                            <p:commandButton  class="sdeleteButton" update="hosCheckDetail" title="#{userData.userDDs['DELETE']}" 
                                              action="#{checkingUpFormMB.deleteCheckingUpDetail()}" icon="fa fa-remove" >
                                <f:setPropertyActionListener value="#{hosCheckDetail}" 
                                                             target="#{checkingUpFormMB.hosCheckingUpDetailEntitySelected}"/>
                                <p:confirm header="#{userData.userDDs['COFIGRATION']}"
                                           message="#{userData.userDDs['ARE_YOU_SURE']}" icon="ui-icon-alert" />
                            </p:commandButton>

                            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                                <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" 
                                                 icon="ui-icon-check" />
                                <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" 
                                                 icon="ui-icon-close" />
                            </p:confirmDialog>
                        </p:column >
                        <p:columnGroup type="footer">

                            <p:column style="border-radius: 0px;" colspan="5"  footerText="الاجمالي" /> 
                            <p:column style="border-radius: 0px;" colspan="2"  footerText="#{checkingUpFormMB.totalCach}" /> 
                        </p:columnGroup>
                    </p:dataTable>

                </div>

                <h:panelGroup  class="centerButtons" style="margin-top: 2%">


                    <p:commandButton  class="addnewpatient"
                                      style="color: #ecf0f1!important;border-radius: 5px;
                                      height: 30px;background-color:#035c70 !important;margin-left: 5px;"
                                      title="اضافة بيانات مريض جديد"
                                      immediate="true" 
                                      value="اضافة بيانات مريض جديد" 
                                      action="#{checkingUpFormMB.cancel}"   />



                    <p:commandButton  class="saveButton"  id="saveB" 
                                      title="#{userData.userDDs['SAVE']}" 
                                      value="#{userData.userDDs['SAVE']}" 
                                      style="color: #ecf0f1!important;border-radius: 5px;
                                      height: 30px;background-color: #3F51B5!important;margin-left: 5px;"
                                      action="#{checkingUpFormMB.save()}"
                                      update="@form"/>

                    <p:commandButton  class="printButton"
                                      id="PrintB"
                                      ajax="false"
                                      onclick="form.target = '_blank'"  
                                      style="color: #ecf0f1!important;border-radius: 5px;
                                      height: 30px;background-color: #2b07aae0 !important;margin-left: 5px;"
                                      update="@form"
                                      value="#{userData.userDDs['PRINT']}" 
                                      actionListener="#{checkingUpFormMB.exportPDF}"

                                      title="#{userData.userDDs['PRINT']}"
                                      immediate="true" />



                    <p:commandButton  class="newButton" title="#{userData.userDDs['RESET']}" 
                                      immediate="true"
                                      id="newA"
                                      style="color: #ecf0f1!important;border-radius: 5px;
                                      height: 30px;background-color: #175C52!important;margin-left: 5px;"
                                      value="#{userData.userDDs['NEW']}" 
                                      update="@form"
                                      actionListener="#{checkingUpFormMB.reset()}"
                                      resetValues="true"/>

                    <p:commandButton  class="deleteButton" id="cancel" title="#{userData.userDDs['CANCEL']}"
                                      value="#{userData.userDDs['CANCEL']}"    style="color: #ecf0f1!important;border-radius: 5px;
                                      height: 30px;background-color: #9c27b0d1!important;"
                                      action="#{checkingUpFormMB.exit()}"
                                      update="form"/>


                </h:panelGroup>

            </p:fieldset>
        </h:form>



    </ui:define>
</ui:composition>
