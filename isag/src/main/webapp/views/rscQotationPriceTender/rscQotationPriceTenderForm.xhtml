<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">

      
            <h:form  style="margin-right: 15px" dir="#{userData.dir}"  id="form">
            <div class="ui-g-12 ui-g-nopad">

                <div class="ui-g">

                    <div class="ui-g-12 ui-md-6">

                        <p:fieldset id="price" legend="#{userData.userDDs['OFFER_PRICE']}">

                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:autoComplete style="width: 50%!important"  id="subContractor"
                                                    dropdown="true"
                                                    scrollHeight="350"
                                                    value="#{rscQotationPriceTenderFormMB.priceTenderDTO.subContractor}"
                                                    converter="#{rscQotationPriceTenderFormMB.contractorConverter}"
                                                    var="subContractor"
                                                    itemLabel="#{subContractor}" 
                                                    itemValue="#{subContractor}" 
                                                    forceSelection="true" 
                                                    completeMethod="#{rscQotationPriceTenderFormMB.completeContructor}">

                                    </p:autoComplete>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel class="tender-pricing-title-Q" value="#{userData.userDDs['Sub_Contractor']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:calendar id="dateFrom" 
                                                value="#{rscQotationPriceTenderFormMB.priceTenderDTO.date}"
                                                pattern="dd/MM/yyyy"
                                                required="true"
                                                style="width: 50%"/>

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel class="tender-pricing-title1" value="#{userData.userDDs['TEXT_DATE']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText   style="width: 41%!important" value="#{rscQotationPriceTenderFormMB.priceTenderDTO.docNumber}"/>

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel class="tender-pricing-title-Q" value="#{userData.userDDs['DOCUM_NO']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText style="width: 41%!important" readonly="true" value="#{rscQotationPriceTenderFormMB.priceTenderDTO.serial}" />

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel class="tender-pricing-title-Q" value="#{userData.userDDs['PRICING_NO']}"/>

                                </div>
                            </div>

                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:selectOneMenu  style="width:41%" value="#{rscQotationPriceTenderFormMB.priceTenderDTO.status}">

                                        <f:selectItem itemLabel="#{userData.userDDs['CHOOSE']}" itemValue="" noSelectionOption="true" /> 
                                        <f:selectItem itemLabel="#{userData.userDDs['NOT_DONE']}" itemValue="0" noSelectionOption="true" />
                                        <f:selectItem itemLabel="#{userData.userDDs['DONE']}" itemValue="1" noSelectionOption="true" />
                                        <f:selectItems  />
                                    </p:selectOneMenu>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel class="pricing-status-Q" value="#{userData.userDDs['PRICING_STATUE']}"/>

                                </div>
                            </div>




                        </p:fieldset> 

                    </div>

                    <div class="ui-g-12 ui-md-6">

                        <p:fieldset id="data" legend="#{userData.userDDs['TENDER_DATA']}">

                              <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                            <p:inputText   readonly="true" style="width: 60%!important;" value="#{rscQotationPriceTenderFormMB.priceTenderDTO.rscGenaricLoad.remark}"/>

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                        <p:outputLabel  style="width: 60px;" value="#{userData.userDDs['DESCRIPTION']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                        <p:inputText    readonly="true" style="width: 60%!important;" value="#{rscQotationPriceTenderFormMB.priceTenderDTO.rscGenaricLoad.customerName}"/>

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                        <p:outputLabel    style="width:60px;" value="#{userData.userDDs['OWNER']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                            <p:outputLabel  style="width: 60%!important;" value="#{rscQotationPriceTenderFormMB.priceTenderDTO.rscGenaricLoad.serial}"/>

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                        <p:outputLabel  style="width:60px;" value="#{userData.userDDs['NUMB']}"/>

                                </div>
                            </div>

                            
                            


                        </p:fieldset> 

                    </div>

                    <div class="ui-g-12 ui-md-6">

                        <p:fieldset id="tenderPrice" legend="#{userData.userDDs['Tender_Pricing']}">

                            
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                            <p:inputText  readonly="true"  style="width: 50%!important;" value="#{rscQotationPriceTenderFormMB.priceTenderDTO.rscGenaricLoad.priceTenderSerial}"/>

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                        <p:outputLabel class="tender-pricing-title-Q" value="#{userData.userDDs['NUMB']}"/>

                                </div>
                            </div>
                            
                            
                 

                        </p:fieldset> 

                    </div>
                </div>  
            </div>



            <p:fieldset id="fieldSetId" legend="#{userData.userDDs['ITEMS']}"  style="margin-bottom:20px; margin-left: 3%">
                <p:dataTable class="datatable-dir-en" id="rscTenderPriceDetail"
                             var="rscTenderPriceDetail"
                             rowIndexVar="index" 
                             dir="rtl" 
                             emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                             editable="true"
                             editMode="cell"
                             sortBy="#{1}"
                             widgetVar="rscTenderPriceDetail"
                             rowKey="#{rscTenderPriceDetail}"
                             value="#{rscQotationPriceTenderFormMB.priceTenderDTO.rscQotationPriceTenderDetailWorkUnitDTOList}">


                    <f:facet name="header" class="col-md-12">

                        <p:commandButton icon="fa fa-plus" 
                                         title="#{userData.userDDs['ADD']}" 
                                         class="saddButton" update="rscTenderPriceDetail"
                                         action="#{rscQotationPriceTenderFormMB.addChild}" 
                                         style="float:right;margin: 0" 
                                         rendered="#{!rscQotationPriceTenderFormMB.priceTenderDTO.active}"/>
                        <p:outputPanel>
                            <h:outputText value="#{userData.userDDs['SEARCH']} : " 
                                          style="font-size: large" />
                            <p:inputText id="globalFilter" 
                                         onkeyup="PF('bTable').filter()" 
                                         style="width:150px" />

                        </p:outputPanel>


                    </f:facet>
                    <p:column headerText="#{userData.userDDs['ITEM']}"  style=" width: 14vh;border-radius: 0px;text-align: center;">
                        <p:autoComplete style="width:120px;" id="UnitIdd" 
                                        dropdown="true"
                                        scrollHeight="350"
                                        converter="#{rscQotationPriceTenderFormMB.rscWorkUnitsGuideDTOConverter}"
                                        value="#{rscTenderPriceDetail.guideDTO}"
                                        var="unit"
                                        itemLabel="#{unit}" 
                                        itemValue="#{unit}" 
                                        forceSelection="true" 
                                        completeMethod="#{rscQotationPriceTenderFormMB.completeWorkUnitsGuideDTO}" >
                            <p:ajax update=" nameText qtyUnits priceUnitt" listener="#{rscQotationPriceTenderFormMB.validateUnitGuide()}"
                                    event="itemSelect"  />
                            <p:ajax update=" nameText qtyUnits priceUnitt" listener="#{rscQotationPriceTenderFormMB.validateUnitGuide()}"
                                    event="change"  />
                        </p:autoComplete>
                    </p:column>

                    <p:column headerText="#{userData.userDDs['UNIT']}" style=" width: 12vh;border-radius: 0px;text-align: center;">
                        <h:outputText  id="nameText" value="#{rscTenderPriceDetail.guideDTO.unitName.name}"  />
                    </p:column>

                    <p:column headerText="#{userData.userDDs['QUANTITY']}" style=" width: 12vh;border-radius: 0px;text-align: center;">
                        <p:inputText id="qtyUnits" value="#{rscTenderPriceDetail.quantity}" >
                            <p:ajax  event="blur" listener="#{rscQotationPriceTenderFormMB.calculateTotalUnits()}"
                                     update="totalsUnit" />
                        </p:inputText> 
                    </p:column>

                    <p:column headerText="#{userData.userDDs['PRICE']}" style=" width: 12vh;border-radius: 0px;text-align: center;">
                        <p:inputText id="priceUnitt" value="#{rscTenderPriceDetail.price}">
                            <p:ajax  event="blur" listener="#{rscQotationPriceTenderFormMB.calculateTotalUnits()}"
                                     update="totalsUnit" />
                        </p:inputText> 
                    </p:column>
                    <p:column   headerText="#{userData.userDDs['TOT_COST_UNIT']}" style=" width: 12vh;border-radius: 0px;text-align: center;">
                        <h:outputText id="totalsUnit" value="#{rscTenderPriceDetail.total}" />
                    </p:column>




                    <p:column headerText="#{userData.userDDs['NOTE']}" style=" width: 12vh;border-radius: 0px;text-align: center;">
                        <p:inputText id="remarks" value="#{rscTenderPriceDetail.remark}" />
                    </p:column>

                    <p:column headerText="#{userData.userDDs['TRANSACTION']}" style=" width: 10vh;border-radius: 0px;text-align: center"  rendered="#{!rscQotationPriceTenderFormMB.priceTenderDTO.active}">
                        <p:commandButton class="saddbuttonins" update="rscTenderPriceDetail"
                                         icon="fa fa-fw fa-plus" style="background-color: rgb(42, 163, 218);border-radius: 3px;"
                                         title="#{userData.userDDs['ADD']}" 
                                         action="#{rscQotationPriceTenderFormMB.addChild()}"
                                         />

                        <p:commandButton  class="sdeleteButtons" update="rscTenderPriceDetail"
                                          title="#{userData.userDDs['DELETE']}" style="background-color: red;border-radius: 3px;" 
                                          action="#{rscQotationPriceTenderFormMB.deleteRscTenderDetail()}"
                                          icon="fa fa-remove" >

                            <f:setPropertyActionListener value="#{rscTenderPriceDetail}"
                                                         target="#{rscQotationPriceTenderFormMB.rscQotationPriceTenderDetailWorkUnitDTOSelected}"/>
                            <p:confirm header="#{userData.userDDs['COFIGRATION']}" 
                                       message="#{userData.userDDs['ARE_YOU_SURE']}"
                                       icon="ui-icon-alert" />
                        </p:commandButton>

                        <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                            <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                            <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                        </p:confirmDialog>



                    </p:column>


                </p:dataTable>     


                               <div id="buttunss" class="asmaa">


                        <p:commandButton class="saveButton" 
                                         title="#{userData.userDDs['SAVE']}"
                                         value="#{userData.userDDs['SAVE']}"
                                        
                                         action="#{rscQotationPriceTenderFormMB.save()}" update="@form" 
                                         id="saveB"
                                         disabled="#{rscQotationPriceTenderFormMB.priceTenderDTO.active}"/> 
                        <p:commandButton class="newButton" 
                                         value="#{userData.userDDs['NEW']}"
                                         title="#{userData.userDDs['NEW']}"
                                        
                                         action="#{rscQotationPriceTenderFormMB.reset}" 
                                         update="form" id="undo"/> 
                        <p:commandButton   class="reloadButton"
                                           id="loadL"  title="#{userData.userDDs['UPLOAD']}"
                                           value="#{userData.userDDs['UPLOAD']}" 
                                          
                                           action="#{rscQotationPriceTenderFormMB.OpenDlg('dlg2')}"
                                           update="@form"
                                           disabled="#{rscQotationPriceTenderFormMB.priceTenderDTO.active}"/>
                        <p:commandButton  class="deleteButton" id="cancel" title="#{userData.userDDs['CANCEL']}"
                                          value="#{userData.userDDs['CANCEL']}" 
                                          action="#{rscQotationPriceTenderFormMB.exit()}"
                                          update="form"/>




                        <p:blockUI block="form" trigger="saveB  undo" animate="true" >

                            <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                        </p:blockUI>
                        <p:commandButton 
                            class="printButton"
                            update="@form" onclick="form.target = '_blank'"  ajax="false"
                            
                            title="#{userData.userDDs['PRINT']}"
                            value="#{userData.userDDs['PRINT']}" 
                            action="#{rscQotationPriceTenderFormMB.print()}" 
                            >
                        </p:commandButton>




                    </div>

            </p:fieldset>





            <h:panelGrid columns="1" cellpadding="5">

                <h:panelGroup>




                    <p:dialog id="dlg" header="#{userData.userDDs['UPLOAD_TENDERS']}" widgetVar="dlg2" modal="true" style="height: fit-content;width: fit-content">

                        <p:tabView id="tabsBar">
                            <p:tab id="tab1" title="#{userData.userDDs['TENDER']}"  >

                                <p:dataTable id="tenderList"
                                             draggableColumns="true" 
                                             var="tender"
                                             widgetVar="tender"  
                                             rowIndexVar="index" 
                                             dir="rtl"  selectionMode="single"
                                             selection="#{rscQotationPriceTenderFormMB.priceTenderDTO.rscGenaricLoad}"
                                             value="#{rscQotationPriceTenderFormMB.priceTenderDTOList}" 
                                             rowKey="#{tender.index}"
                                             rows="#{userData.rowListCount}" 
                                             paginator="true" 
                                             emptyMessage="#{userData.userDDs['EMPTY_TABLE']}" >

                                    <p:column style="width: 12vh;font-size: 1.5vh;text-align: -webkit-auto;border-radius: 0px" 
                                              filterStyle="display:none" filterBy="#{tender.serial}"
                                              filterMatchMode="contains" 
                                              headerText="#{userData.userDDs['TENDER_NO']}"
                                              sortBy="#{tender.serial}">
                                        <p:outputLabel value="#{tender.serial}" />
                                    </p:column> 
                                    <p:column style="width: 14vh;text-align:center;font-size: 1.8vh;border-radius: 0px" 
                                              filterStyle="display:none"
                                              filterBy="#{tender.priceTenderSerial}" 
                                              filterMatchMode="contains"
                                              headerText="#{userData.userDDs['PRICING_NO']}" 
                                              sortBy="#{tender.priceTenderSerial}">
                                        <p:outputLabel value="#{tender.priceTenderSerial}" />
                                    </p:column>
                                    <p:column style="width: 14vh;text-align:center;font-size: 1.8vh;border-radius: 0px" 
                                              filterStyle="display:none"
                                              filterBy="#{tender.customerName}" 
                                              filterMatchMode="contains"
                                              headerText="#{userData.userDDs['CUSTOM_NAME']}" 
                                              sortBy="#{tender.customerName}">
                                        <p:outputLabel value="#{tender.customerName}" />
                                    </p:column> 
                                    <p:column style="width: 14vh;text-align:center;font-size: 1.8vh;border-radius: 0px" 
                                              filterStyle="display:none"
                                              filterBy="#{tender.tenderTypeName}" 
                                              filterMatchMode="contains"
                                              headerText="#{userData.userDDs['TENDER_TYPE']}" 
                                              sortBy="#{tender.tenderTypeName}">
                                        <p:outputLabel value="#{tender.tenderTypeName}" />
                                    </p:column>

                                </p:dataTable> 
                            </p:tab>
                        </p:tabView>

                        <p:commandButton class="reloadButtons" update="fieldSetId price data tenderPrice" 
                                         style="color: #ecf0f1!important;border-radius: 5px;
                                         background-color: #2d21b5e6 !important;margin-left: 5px;width: 10%;" 
                                         action="#{rscQotationPriceTenderFormMB.loadTender()}"
                                         title="#{userData.userDDs['UPLOAD']}"  > 
                        </p:commandButton>

                    </p:dialog>

                </h:panelGroup>



            </h:panelGrid>



        </h:form>



    </ui:define>


</ui:composition>
