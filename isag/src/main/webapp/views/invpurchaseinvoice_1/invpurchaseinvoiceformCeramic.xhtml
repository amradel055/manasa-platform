                                    </div>
                                    <div class="ui-g-6 ui-xl-6">
                                        <p:outputLabel   style="width: 95px; " value=" تمت المراجعه "/>

                                    </div>
                                </div>

                            <div class="ui-g-6 ui-xl-6">

                                        </p:selectOneMenu>

                                        <p:outputLabel  style="width: 95px; " value="#{userData.userDDs['BILL_SUPPLIER_DATE']}"/>

                             editable="true"

                             sortBy="#{1}"
                             rowKey="#{invPurchaseInvoiceDetailsTable.index}"

                              headerText="عدد الكسر"
                              filterBy="#{invPurchaseInvoiceDetailsTable.fractureNumber}"
