<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns="http://www.w3.org/1999/xhtml" >
    <ui:define name="content">

        <h:head>
            <title>#{userData.userDDs['PROJ_GUIDE']}</title>
        </h:head>
        <style>
            .ui-widget-content .ui-state-default, .ui-widget-header .ui-state-default {
                border: 1px solid #c5dbec;
                background:none;
            }

            .span.ui-treenode-label .ui-corner-all {
                font-size: 15px;
            }

        </style>
        <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form id="form" class='formmargin'>
            <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                  margin-top: 22%;
                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;"
                                  icon="fa fa-fw fa-home"
                                  title="#{userData.userDDs['HOME']}"
                                  class="smhomeButton" 
                                  action="exit" />
            </div>
            <p:fieldset styleClass="panelColumns" legend="#{userData.userDDs['PROJ_GUIDE']}" >
                <p:messages autoUpdate="true"  id="messages" showDetail="true" closable="true" rendered="true"/>   
                <div class="ui-g-12 ui-g-nopad" id="firstSegment" >
                    <div class="ui-g">

                        <div class="ui-g-12 ui-lg-8">

                            <h:panelGroup>
                                <p:fieldset legend="#{userData.userDDs['PROJ_GUIDE']}" style="margin-bottom:20px">
                                    <h:panelGrid id="projectGuideDetails" columns="1"  class="col-md-12">

                                        <h:panelGroup>

                                            <h:panelGroup>
                                                <p:outputLabel style="width: 135px;margin-right: 3%;font-size: 14px" id="parentAcc" value="#{userData.userDDs['MAIN_PROJ_GUID']}" />  
                                            </h:panelGroup>
                                            <h:panelGroup>
                                                <p:selectOneMenu style="width: 30%!important;margin-right: 1%;margin-top: 1%;font-size: 14px" id="parentProject" value="#{projectGuideMB.selectedParentId}"               
                                                                 required="false"  filterMatchMode="contains" filter="true" >
                                                    <p:ajax listener="#{projectGuideMB.selectParent}" update="level projectCode"  />
                                                    <f:selectItem itemLabel="#{userData.userDDs['ROOT']}"  />
                                                    <f:selectItems value="#{projectGuideMB.allProjectGuide}"  var="cs" itemLabel="#{cs.name} #{cs.code}" itemValue="#{cs.id}" />
                                                </p:selectOneMenu>
                                            </h:panelGroup>

                                        </h:panelGroup>

                                        <h:panelGroup>

                                            <h:panelGroup>
                                                <p:outputLabel style="width: 135px;margin-right: 3%;" value="#{userData.userDDs['CS_COD']}"  />  
                                            </h:panelGroup>
                                            <h:panelGroup>
                                                <p:inputText style="width: 30%!important"  id="projectCode" a:autofocus="true" value="#{projectGuideMB.selectedCS.code}" required="true" requiredMessage="#{userData.userDDs['REQUIRED']}">
                                                    <p:ajax  event="blur" listener="#{projectGuideMB.validateAccountNumberInputDublication}" update=":form:msgcode"  />
                                                </p:inputText>
                                                <p:message id="msgcode" for="projectCode"/>

                                            </h:panelGroup>


                                        </h:panelGroup>


                                        <h:panelGroup>

                                            <h:panelGroup>
                                                <p:outputLabel style="width: 135px;margin-right: 3%;" value="#{userData.userDDs['NAME']}" />  
                                            </h:panelGroup>
                                            <h:panelGroup>
                                                <p:inputText style="width: 30%!important"  id="projectName" value="#{projectGuideMB.selectedCS.name}" required="true" requiredMessage="#{userData.userDDs['REQUIRED']}">
                                                    <p:ajax  event="keyup" update=":form:msgname " />
                                                </p:inputText>  
                                                <p:message id="msgname" for="projectName"/>
                                            </h:panelGroup>


                                        </h:panelGroup>



                                        <h:panelGroup>

                                            <h:panelGroup>
                                                <p:outputLabel style="width: 135px;margin-right: 3%;" value="#{userData.userDDs['PRIC']}" />  
                                            </h:panelGroup>
                                            <h:panelGroup>
                                                <p:inputText style="width: 30%!important"  id="projectPrice" value="#{projectGuideMB.selectedCS.price}" /> 
                                            </h:panelGroup>


                                        </h:panelGroup>



                                        <h:panelGroup>

                                            <h:panelGroup>
                                                <p:outputLabel style="width: 135px;margin-right: 3%;" value="#{userData.userDDs['STATUS']}"/>
                                            </h:panelGroup>
                                            <h:panelGroup>
                                                <h:selectBooleanCheckbox style="width: 30%!important"  id="active" value="#{projectGuideMB.selectedCS.active}" />
                                            </h:panelGroup> 
                                            <h:panelGroup>
                                                <p:message for="active"/>
                                            </h:panelGroup>


                                        </h:panelGroup>
                                        <h:panelGroup> 
                                            <h:panelGroup>
                                                <p:outputLabel style="width: 135px;margin-right: 3%;" value="حاله الحجز"/>
                                            </h:panelGroup>
                                            <h:panelGroup>
                                                <h:selectBooleanCheckbox style="width: 30%!important"  id="reserved" value="#{projectGuideMB.selectedCS.reserved}" />
                                            </h:panelGroup> 
                                            <h:panelGroup>
                                                <p:message for="reserved"/>
                                            </h:panelGroup> 
                                        </h:panelGroup>
                                        <h:panelGroup>

                                            <h:panelGroup>
                                                <p:outputLabel style="width: 135px;margin-right: 3%;" value="#{userData.userDDs['ACCOUNT_NAME']}"/>
                                            </h:panelGroup>
                                            <h:panelGroup>
                                                <p:autoComplete style="width:30%!important" id="accountName" maxResults="10"
                                                                dropdown="true" 
                                                                value="#{projectGuideMB.selectedCS.accountId}" 
                                                                converter="#{projectGuideMB.glaccountConverter}"
                                                                completeMethod="#{projectGuideMB.completeGlAccount}"
                                                                var="accountName"
                                                                itemLabel="#{accountName}" 
                                                                itemValue="#{accountName}" 
                                                                forceSelection="true" 
                                                                >

                                                </p:autoComplete> 
                                            </h:panelGroup>  


                                        </h:panelGroup>
                                        <h:panelGroup>

                                            <h:panelGroup>
                                                <p:outputLabel style="width: 135px;margin-right: 3%;" value="حساب مبيعات التقسيط"/>
                                            </h:panelGroup>
                                            <h:panelGroup>
                                                <p:autoComplete style="width:30%!important" id="accountName2" maxResults="10"
                                                                dropdown="true" 
                                                                value="#{projectGuideMB.selectedCS.accountSaleId}" 
                                                                converter="#{projectGuideMB.glaccountConverter}"
                                                                completeMethod="#{projectGuideMB.completeGlAccount}"
                                                                var="accountName2"
                                                                itemLabel="#{accountName2}" 
                                                                itemValue="#{accountName2}" 
                                                                forceSelection="true" 
                                                                >

                                                </p:autoComplete> 
                                            </h:panelGroup>  


                                        </h:panelGroup>

                                        <h:panelGroup>

                                            <h:panelGroup>
                                                <p:outputLabel  style="width: 135px;margin-right: 3%;" value="#{userData.userDDs['LEVEL']}"/>
                                            </h:panelGroup>

                                            <h:panelGroup>
                                                <p:inputText  id="level" readonly="true" value="#{projectGuideMB.selectedCS.level}" style="width:30%!important"/>
                                            </h:panelGroup>

                                        </h:panelGroup>
                                        <h:panelGroup>

                                            <h:panelGroup>
                                                <p:outputLabel  style="width: 135px;margin-right: 3%;" value="المقاس"/>
                                            </h:panelGroup>

                                            <h:panelGroup>
                                                <p:selectOneMenu style="width: 37%; margin-top: 5px;" 
                                                                 id="console"
                                                                 value ="#{projectGuideMB.selectedCS.symbolSize}" 
                                                                 converter="#{projectGuideMB.symbolConverter}"  >  

                                                    <f:selectItems  value="#{projectGuideMB.symbolList}"
                                                                    var="symbol" 
                                                                    itemLabel="#{symbol}" 
                                                                    itemValue="#{symbol}" />
                                                </p:selectOneMenu>      
                                            </h:panelGroup>

                                        </h:panelGroup>


                                        <h:panelGroup  class="centerButtons"> 

                                            <p:commandButton  class="newButton" title="#{userData.userDDs['ADD']}"
                                                              value="#{userData.userDDs['ADD']}"
                                                              update=":form:projectGuideDetails" 
                                                              actionListener="#{projectGuideMB.add()}" 
                                                              style=""  
                                                              id="plus"/>

                                            <p:commandButton  class="saveButton" id="saveB"
                                                              value="#{userData.userDDs['SAVE']}" 
                                                              title="#{userData.userDDs['SAVE']}"   
                                                              style=""
                                                              action="#{projectGuideMB.save()}" 
                                                              update="@form"  
                                                              validateClient="true"/>

                                            <p:blockUI block="form" trigger="saveB plus" animate="true" >

                                                <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                                            </p:blockUI>
                                            <p:commandButton  class="deleteButton" 
                                                              value="#{userData.userDDs['DELETE']}"  
                                                              title="#{userData.userDDs['DELETE']}"  
                                                              update="@form"  
                                                              action="#{projectGuideMB.delete()}" 
                                                              style=""
                                                              >
                                                <p:confirm header="#{userData.userDDs['COFIGRATION']}" message="#{userData.userDDs['ARE_YOU_SURE']}" icon="ui-icon-alert" />
                                            </p:commandButton>
                                            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                                                <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                                                <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                                            </p:confirmDialog>

                                        </h:panelGroup>
                                        <p:blockUI block="saveB" trigger="saveB"/>
                                    </h:panelGrid>

                                </p:fieldset>
                            </h:panelGroup>
                        </div>

                        <div class="ui-g-12 ui-lg-4" style="margin-top:0.8%;">
                            <h:panelGroup style="font-size: 35px">
                                <p:tree  value="#{projectGuideMB.projectGuideHierarchy}" var="doc" dir="#{userData.dir}"
                                         selectionMode="single" selection="#{projectGuideMB.selectedProjectGuide}"
                                         dynamic="false" id="csTree">
                                    <p:ajax  event="select" update=":form:projectGuideDetails" listener="#{projectGuideMB.onNodeSelect}" />
                                    <p:treeNode expandedIcon="ui-icon-folder-open" collapsedIcon="ui-icon-folder-collapsed" >
                                        <h:outputText value="#{doc.name} #{doc.code}"/>
                                    </p:treeNode>
                                </p:tree>  
                            </h:panelGroup>
                        </div>
                    </div>
                </div>

            </p:fieldset>
        </h:form>
    </ui:define>
</ui:composition>
