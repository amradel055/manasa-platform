<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/newTemplate.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form  dir="#{userData.dir}" class='formmargin'>
            <div style=" position: absolute;left: 20px"> 

                    <p:commandButton  style="z-index: 2;
                                      margin-top: 24%;
                                      color: #035c70!important; 
                                      background-color: #223238!important;
                                      border: 1px solid #22323a!important;
                                      background: #22323a 50% 50% repeat-x!important;"
                                      icon="fa fa-fw fa-home"
                                      title="#{userData.userDDs['HOME']}"
                                      class="smhomeButton" 
                                      action="exit" />
                       
                </div>
            <p:fieldset   legend="#{userData.userDDs['SALES_RETURN']}" >

                <div >
                    <p:dataTable id="invReturnSalesTable"
                                 draggableColumns="true"
                                 draggableRows="true"
                                 var="invReturnSalesTable" 
                                 widgetVar="bTable" 
                                 rowIndexVar="index" 
                                 value="#{InvReturnSalesListMB.invReturnSalesList}"
                                 rows="#{userData.rowListCount}" 
                                 paginator="true"
                                 emptyMessage="#{userData.userDDs['EMPTY_TABLE']}" >

                        <f:facet name="header" class="col-md-12">
                            <p:commandButton class="saddButton" icon="fa fa-plus" 
                                             title="#{userData.userDDs['ADD']}" 
                                             action="#{InvReturnSalesListMB.goToAdd()}" 
                                             style="float:right" 
                                             rendered="#{userData.userScreens['invreturnsales'].add or userData.isAdmin}"/>
                            
                            <p:outputPanel  >
                                <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                                <p:inputText id="globalFilter" onkeyup="PF('bTable').filter()" style="width:150px" />
                            </p:outputPanel>
                        </f:facet>

                        <p:column  style="width: 10vh;font-size: 1.8vh;border-radius: 0px"  
                                   filterStyle="display:none" 
                                   filterBy="#{invReturnSalesTable.serial}" 
                                   filterMatchMode="contains" 
                                   headerText="#{userData.userDDs['RETU_NO']}"
                                   sortBy="#{invReturnSalesTable.serial}" >
                            <p:outputLabel value="#{invReturnSalesTable.serial}" />
                        </p:column>
                        
                        <p:column style="width: 7vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px" 
                                  headerText="#{userData.userDDs['Return_Type']}"  >
                             <p:outputLabel rendered="#{invReturnSalesTable.paymentType eq 0}" value="نقدي" />                         
                             <p:outputLabel rendered="#{invReturnSalesTable.paymentType eq 1}" value="أجل" />                         
                             <p:outputLabel rendered="#{invReturnSalesTable.paymentType eq 2}" value="إعتماد مستندي" />                         
                        </p:column>


                        <p:column style="width: 10vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px" filterStyle="display:none" 
                                  filterBy="#{invReturnSalesTable.date}" 
                                  filterMatchMode="contains"
                                  headerText="#{userData.userDDs['DATEE']}"
                                  sortBy="#{invReturnSalesTable.date}" 
                                  >
                            <p:outputLabel value="#{invReturnSalesTable.date}" >
                                <f:convertDateTime type="date" pattern="dd-MM-yyyy"/>
                            </p:outputLabel>                           
                        </p:column>

                        <p:column style="width: 10vh;font-size: 1.8vh;border-radius: 0px" filterStyle="display:none"
                                  filterBy="#{invReturnSalesTable.invInventoryId.name}"
                                  filterMatchMode="contains" 
                                  headerText="#{userData.userDDs['INVENTORY']}"
                                  sortBy="#{invReturnSalesTable.invInventoryId.name}" 
                                  >
                            <p:outputLabel value="#{invReturnSalesTable.invInventoryId.name}" />
                        </p:column>

                        <p:column style="width: 10vh;font-size: 1.8vh;border-radius: 0px" filterStyle="display:none"
                                  filterBy="#{invReturnSalesTable.supplierId.name}"
                                  filterMatchMode="contains" 
                                  headerText="#{userData.userDDs['SUPPLIER']}"
                                  sortBy="#{invReturnSalesTable.supplierId.name}" 
                                  >
                            <p:outputLabel value="#{invReturnSalesTable.supplierId.name}" />
                        </p:column>

                        <p:column style="width: 10vh;font-size: 1.8vh;border-radius: 0px" filterStyle="display:none"
                                  filterBy="#{invReturnSalesTable.glBankId.name}"
                                  filterMatchMode="contains" 
                                  headerText="#{userData.userDDs['SAFE']}"
                                  sortBy="#{invReturnSalesTable.glBankId.name}" 
                                  >
                            <p:outputLabel value="#{invReturnSalesTable.glBankId.name}" />
                        </p:column>
                         <p:column style="width: 10vh;font-size: 1.8vh;border-radius: 0px" filterStyle="display:none"
                                  filterBy="#{invReturnSalesTable.createdBy.name}"
                                  filterMatchMode="contains" 
                                  headerText="#{userData.userDDs['INVOI_ENTR']}"
                                  sortBy="#{invReturnSalesTable.createdBy.name}" >
                         <p:outputLabel value="#{invReturnSalesTable.createdBy.name}" />
                        </p:column>


                        <p:column  style="width: 7vh;font-size: 1.8vh;text-align:center;border-radius: 0px" headerText="#{userData.userDDs['TRANSACTION']}" >
                            <p:commandButton  class="seditButtons" update="@form" 
                                             icon="fa fa-fw fa-edit" style="background-color: #6a6967;border-radius: 3px;"
                                             title="#{userData.userDDs['EDIT']}" 
                                             action="#{InvReturnSalesListMB.goToEdit()}" 
                                             rendered="#{userData.userScreens['invreturnsales'].edit or userData.isAdmin}" >

                                <f:setPropertyActionListener value="#{invReturnSalesTable.id}" 
                                                             target="#{InvReturnSalesListMB.invReturnSalesIdSeclected}" />
                            </p:commandButton>

                            <p:commandButton class="sdeleteButtons" update="@form" 
                                             icon="fa fa-remove" style="background-color: red;border-radius: 3px;"
                                             title="#{userData.userDDs['DELETE']}" 
                                             action="#{InvReturnSalesListMB.delete}" 
                                             rendered="#{userData.userScreens['invreturnsales'].delete or userData.isAdmin}">
                                <f:setPropertyActionListener value="#{invReturnSalesTable}" target="#{InvReturnSalesListMB.invReturnPurchaseSelected}" />
                                <p:confirm header="Confirmation" message="#{userData.userDDs['ARE_YOU_SURE']}" icon="ui-icon-alert" />
                            </p:commandButton>
                        </p:column>

                    </p:dataTable> 
                    <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                        <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                        <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                    </p:confirmDialog>
                </div>
            </p:fieldset>
        </h:form>
    </ui:define>
</ui:composition>
