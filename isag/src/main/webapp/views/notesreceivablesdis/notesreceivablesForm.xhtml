<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="content">
        <style>

            body .ui-datatable tbody tr.ui-state-highlight .ui-inputfield {
                width: 100%;
            }

            body .ui-widget, body .ui-widget .ui-widget {

            }
            body .ui-datatable thead th:last-child {
                border-right: 1px solid #d8d8d8;
                display: inline-block;
            }
            body .ui-datatable tbody tr.ui-widget-content {
                border: 1px solid #d8d8d8;
                display: inline-block;
                width: 10%;
                padding: 5px;
                height: 60px;
                margin-top: 1%;
                margin-right: 1%    
            }
            body .ui-datatable tbody tr td {
                border: 0 none;
                padding: 1.1em 3.857em;
            }
        </style>

        <h:form style="margin-right: 20px" enctype="multipart/form-data" id="form" dir="#{userData.dir}">

            <p:fieldset id="fieldSetId11" legend="البنود"   style="margin:3% 0 0 0">                
                <p:dataTable id="invPurchaseInvoiceDetailsTable" class="salesInvoiceTable"
                             widgetVar="invPurchaseInvoiceDetailsTable"
                             style="margin-bottom:20px"
                             var="invPurchaseInvoiceDetailsTable"
                             rowIndexVar="index" 
                             dir="rtl" 
                             emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                             editable="true"
                             editMode="cell"
                             selectionMode="single"
                             sortBy="#{1}"
                             rowKey="#{invPurchaseInvoiceDetailsTable.id}"
                             selection="#{notesReceivablesFormMB.glBankTransactionDetailEntity.glItems}"
                             value="#{notesReceivablesFormMB.glItemsList}" >

                    <p:ajax event="rowSelect" listener="#{notesReceivablesFormMB.updateValue()}" update="@form"  process="invPurchaseInvoiceDetailsTable" />


                    <p:column style="" id="discountTotal" headerText="الاشتراك">
                        <p:outputLabel id="discountTotalT" 
                                       value="#{invPurchaseInvoiceDetailsTable.name}" 
                                       style="width:70%!important;display: inline!important">
                        </p:outputLabel>  
                    </p:column>

                </p:dataTable>

            </p:fieldset>



            <p:fieldset legend="#{userData.userDDs['CASH_REC']}" id="whole" style="margin-bottom:20px;font-size: 20px!important;">

                <div class="col-xs-12">
                    <p:messages id="curmsg" showDetail="true" rendered="true" closable="true"/>   
                </div>



                <div  id="firstSegment" class="ui-g-12 ui-g-nopad">
                    <div class="ui-g">

                        <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel id="settelmentId" value="#{notesReceivablesFormMB.glBankTransactionEntity.serial}"/>
                                    <p:inputText type="hidden" readonly="true" style="width: 60%" id="settelmentId2" value="#{notesReceivablesFormMB.glBankTransactionEntity.id}" />

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 120px;font-size: 16px!important;font-family: bold!important;" value="#{userData.userDDs['NUMB']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:calendar  style="width:70%!important"  id="date" 
                                                 value="#{notesReceivablesFormMB.glBankTransactionEntity.date}"
                                                 pattern="dd/MM/yyyy"
                                                 >

                                        <p:ajax event="dateSelect" update="form" listener="#{notesReceivablesFormMB.updateTransactionRate}" />
                                    </p:calendar>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 100px;font-size: 16px!important; " value="#{userData.userDDs['DATEE']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:selectOneMenu style="width:45%" id="MACUCode" 
                                                     filter="true" 
                                                     filterMatchMode="contains"
                                                     converter="#{notesReceivablesFormMB.bankConverter}"
                                                     value="#{notesReceivablesFormMB.glBankTransactionEntity.glBank}"> 

                                        <p:ajax listener="#{notesReceivablesFormMB.updateTransactionRate}" update="form" />

                                        <f:selectItems value="#{notesReceivablesFormMB.glBankList}"  
                                                       var="bank"
                                                       itemLabel="#{bank}"
                                                       itemValue="#{bank}"/>
                                    </p:selectOneMenu>  
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 100px;font-size: 16px!important; " value="#{userData.userDDs['SAFE_NUM']}" />

                                </div>
                            </div>

                        </div>

                        <div class="ui-g-6 ui-xl-6">

                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 6%;" id="value" value="#{notesReceivablesFormMB.glBankTransactionEntity.value}"/>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 105px;font-size: 16px!important;" value="#{userData.userDDs['AMOUNT']}"/>

                                </div>
                            </div>


                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText style="width: 45%!important" id="notes2"
                                                 value="#{notesReceivablesFormMB.glBankTransactionEntity.remark2}">

                                        <p:ajax event="blur" listener="#{notesReceivablesFormMB.catchValues()}" />
                                    </p:inputText>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width:96px;font-size: 16px!important;" value="#{userData.userDDs['HANDLING']}"/>

                                </div>
                            </div>

                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText style="width:69%!important;margin-top: 0% !important;" id="notes" 
                                                 value="#{notesReceivablesFormMB.glBankTransactionEntity.remark}">
                                        <p:ajax event="blur" listener="#{notesReceivablesFormMB.catchValues()}" />

                                    </p:inputText>
                                    <p:inputText type="hidden" style="width: 40%!important" id="hidden2"
                                                 value="#{notesReceivablesFormMB.glBankTransactionEntity.hiddenId}"/>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width:94px;font-size: 16px!important;" value="#{userData.userDDs['STATEMENT']}"/>

                                </div>
                            </div>

                        </div>
                    </div>
                </div>














                <h:panelGrid class="centerButtons" style="margin-top: 2%;margin-right: -15%;">
                    <h:panelGroup>

                        <p:commandButton  class="saveButton" id="saveB" 
                                          title="#{userData.userDDs['SAVE']}" 
                                          value="#{userData.userDDs['SAVE']}" 
                                          style=""
                                          action="#{notesReceivablesFormMB.save()}"
                                          disabled="#{notesReceivablesFormMB.glBankTransactionEntity.postFlag == 1 or  (not userData.isagUserRole.bankUpdate and notesReceivablesFormMB.glBankTransactionEntity.documentSerial ne null)}"
                                          update="@form"
                                          rendered="#{(userData.userScreens['notesreceivables'].add or userData.userScreens['notesreceivables'].edit) or userData.isAdmin}"/>

                        <p:commandButton class="newButton" 
                                         title="#{userData.userDDs['NEW']}" 
                                         immediate="true"
                                         value="#{userData.userDDs['NEW']}" 
                                         id="newA"
                                         style=""                                         update="@form"
                                         actionListener="#{notesReceivablesFormMB.loadThePageAgain}" 
                                         rendered="#{userData.userScreens['notesreceivables'].add or userData.isAdmin}"/>  



                        <p:commandButton  class="printButton"
                                          ajax="false" onclick="someFunc();
                                                  form.target = '_blank';"  
                                          value="#{userData.userDDs['PRINT']}" 
                                          title="#{userData.userDDs['PRINT']}"
                                          actionListener="#{notesReceivablesFormMB.exportPDF}"
                                          style=""
                                          rendered="#{ notesReceivablesFormMB.glBankTransactionEntity.id gt 0 or userData.userScreens['notesreceivables'].view or userData.isAdmin}" />


                        <p:commandButton class="closeButton" 
                                         title="#{userData.userDDs['BACK']}" 
                                         immediate="true"
                                         style=""
                                         value="#{userData.userDDs['BACK']}" 
                                         action="#{notesReceivablesFormMB.exit()}"   />


                    </h:panelGroup>

                </h:panelGrid>



            </p:fieldset> 

            <p:blockUI block="form" trigger="saveB newA " animate="true" >

                <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

            </p:blockUI> 

        </h:form>
        <script>
            function someFunc() {
                var ss = document.getElementById("form:settelmentId2").value;
                console.log(ss);
                sessionStorage.setItem(ss, ss);
                var field = document.getElementById("form:hidden2");
                field.value = sessionStorage.getItem(ss);
            }
        </script>

    </ui:define>
</ui:composition>
