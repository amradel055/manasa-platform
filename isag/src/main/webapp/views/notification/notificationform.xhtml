<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns="http://www.w3.org/1999/xhtml" >

    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form id="form"   dir="#{userData.dir}" style="margin-right: 20px">
            <p:fieldset legend="الاشعارات" style="margin-bottom:20px" rendered="#{userData.isAdmin}">

                <div >
                    <p:messages id="curmsg"
                                autoUpdate="true" 
                                showDetail="true" 
                                rendered="true" 
                                closable="true"/>   
                </div>
 
                
                <div  id="firstLine" class="ui-g-12 ui-g-nopad">
                    <div class="ui-g">
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width:75px;margin-right: 6%;" value="نوع الارسال"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:selectOneRadio id="sendType"    
                                                      value="#{notificationFormMB.notificationDTO.sendType}" rendered="#{userData.isAdmin}">                                                             
                                        <f:selectItem itemLabel="الكل"  itemValue="0"  />
                                        <f:selectItem itemLabel="متصل الان"  itemValue="1"  />
                                        <f:selectItem itemLabel="مستخدم معين"  itemValue="2"  />
                                        <p:ajax event="change" update="@form"/>
                                    </p:selectOneRadio>  

                                </h:panelGroup>
                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup id="users" rendered="#{notificationFormMB.notificationDTO.sendType eq 2}">
                                <h:panelGroup>
                                    <p:outputLabel style="width:75px;margin-right: 6%; margin-top: 4%;" value= "المستخدمين"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:selectOneMenu style="width: 40%!important;" id="user" rendered="#{userData.isAdmin}"  value="#{notificationFormMB.notificationDTO.isagUserDTOSelected}"               
                                                     filterMatchMode="contains" filter="true" converter="#{notificationFormMB.isagUserDTOConverter}">
                                        <f:selectItem itemLabel="#{userData.userDDs['CHOOSE']}" />
                                        <f:selectItems value="#{notificationFormMB.notificationDTO.isagUserDTOList}" var="user" itemLabel="#{user.name}" itemValue="#{user}" />
                                    </p:selectOneMenu>
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width:75px;margin-right: 6%;" value="العنوان"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:inputText style="width: 50%"
                                                 id="title"  
                                                 value="#{notificationFormMB.notificationDTO.title}"> 
                                    </p:inputText>
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width:70px;margin-right: 6%;" value="الرساله"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:inputText style="width: 40%" 
                                                 id="msg" 
                                                 value="#{notificationFormMB.notificationDTO.message}"/>
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 75px;margin-right: 6%;" value="الصوره"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:fileUpload rendered="#{userData.isAdmin}" fileUploadListener="#{notificationFormMB.uploadImage}" allowTypes="/(\.|\/)(jpe?g|png)$/" mode="advanced" skinSimple="true"/>
                                    <br />

                                </h:panelGroup> 
                                <h:panelGroup>
                                    <p:graphicImage id="image2" style="margin-right: 40%;margin-top: 2%;"
                                                    value="#{notificationFormMB.image}" />
                                </h:panelGroup>

                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 75px;margin-right: 6%;" value="ايقونه"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:fileUpload rendered="#{userData.isAdmin}" fileUploadListener="#{notificationFormMB.uploadIcon}" allowTypes="/(\.|\/)(jpe?g|png)$/" mode="advanced" skinSimple="true"/>

                                </h:panelGroup> 
                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 75px;margin-right: 6%;" value="صوره "/>

                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:commandButton   onclick="PF('switcher').previous();"
                                                       icon="pi pi-caret-left"   id="prev" actionListener="#{notificationFormMB.notficationImage(false)}"  style="margin-bottom: 5px"/>

                                    <p:commandButton   onclick="PF('switcher').next();"
                                                       icon="pi pi-caret-right" actionListener="#{notificationFormMB.notficationImage(true)}" id="next" style="margin-bottom: 5px"/>

                                    <p:imageSwitch    effect="wipe" widgetVar="switcher"    id="manuelSwitcher" class="manuelSwitcher"
                                                      slideshowAuto="false">
                                        <ui:repeat value="#{notificationFormMB.notificationDTO.images}"  var="image" id="manuelSwitcherImages">
                                            <p:graphicImage url="#{notificationFormMB.host.concat(image)}"  style="max-width:80%;max-height:80%;object-fit: cover !important;" id="image"/>                 

                                        </ui:repeat>

                                    </p:imageSwitch>
                                    <p:commandButton  
                                        class="cancelButton"
                                        title="اختيار الصوره" 
                                        immediate="true" 
                                        value="اختيار الصوره" 
                                        style="color: #fff!important;background-color:#035C70 !important; width: 20%; margin-right: 60%; margin-top: -8%; float: right;"
                                        action="#{notificationFormMB.selectImage()}" 
                                        rendered="#{userData.isAdmin}"/>


                                </h:panelGroup> 
                            </h:panelGroup>
                        </div>
  
                    </div>
                </div>
               
                
                <h:panelGrid  columns="1" class="col-md-12  " style="margin-bottom: 10%;"> 
                      
       <h:panelGroup class="ui-g partOne">
              <h:panelGroup class="ui-g-12 ui-md-12 centerButtons">
                                    <p:outputLabel style="font-size: x-large" value="اشعارات اون لاين"/>
                                </h:panelGroup>
           <h:panelGroup style="padding-bottom: 3%" class="ui-g-12 ui-md-12"> 
                       <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width:75px;margin-right: 6%;" value="الرساله"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:inputText style="width: 50%"
                                                 id="offLineTitle"  
                                                 value="#{notficationGlobal.msg}"
                                                 > 
                                    </p:inputText>
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width:70px;margin-right: 6%;" value="العنوان"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:inputText style="width: 40%" 
                                                 id="offLineMsg" 
                                                 value="#{notficationGlobal.title}"
                                                />
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>
                    </h:panelGroup>

                      </h:panelGroup>
                            
                  </h:panelGrid>
           

                <h:panelGrid  columns="1" class="col-md-12 centerButtons " >
                    <h:panelGroup>
                        <div style="margin-top: -10%; margin-right: 40%; width: 100%;" >

                            <p:commandButton  
                                class="cancelButton"
                                title="#{userData.userDDs['BACK']}" 
                                immediate="true" 
                                value="#{userData.userDDs['BACK']}" 
                                style="color: #fff!important;background-color:#035C70 !important;margin-left: 5px; width: 34%;"
                                action="exit"   />

                            <p:commandButton  
                                class="saveButton"
                                id="saveB" 
                                title="ارسال اشعار"
                                value="ارسال اشعار" 
                                style="color: #fff!important;background-color: #2196F3!important;margin-left: 0px; width: 37%; float: inherit;"
                                action="#{notificationFormMB.send()}" 
                                update="curmsg"
                                rendered="#{userData.isAdmin}"/>
                            <p:commandButton  
                                class="saveButton"
                                id="closeServer" 
                                title="غلق السيرفر"
                                value="غلق السيرفر"  
                                style="color: #fff!important; background-color: #8f0000!important; margin-left: -13%; width: 37%; margin-top: 0%; float: left;"
                                action="#{notificationFormMB.closeServer()}" 
                                update="curmsg"
                                rendered="#{userData.isAdmin}"
                                />
                            <p:commandButton   
                                id="closeServer2" 
                                title="غلق السيرفر"
                                value="غلق السيرفر"  
                                style="color: #fff!important; background-color: #8f0000!important; margin-left: -78%; width: 38%; margin-top: 0%;float: left; "
                                action="#{notficationGlobal.closeServer()}" 
                                update="curmsg"
                                rendered="#{userData.isAdmin}"
                                />
                            
                            <p:commandButton  
                                id="openServer" 
                                title="الغاء الرساله"
                                value="الغاء الرساله"  
                                style="color: #fff!important; background-color: green!important; margin-left: -118%; width: 38%; margin-top: 0%; float: left; "
                                action="#{notficationGlobal.openServer()}" 
                                update="curmsg"
                                rendered="#{userData.isAdmin}"
                                />
                              <p:commandButton  
                                id="sendServer" 
                                title="ارسال"
                                value="ارسال"  
                                style="color: #fff!important; background-color: green!important; margin-left: -158%; width: 38%; margin-top: 0%; float: left; "
                                action="#{notficationGlobal.sendMessage()}" 
                                update="curmsg"
                                rendered="#{userData.isAdmin}"
                                />
                         



                        </div>
                    </h:panelGroup>
                   
                </h:panelGrid>


                   

            </p:fieldset>
            
                         
        </h:form>
    </ui:define>

</ui:composition>
