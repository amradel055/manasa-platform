<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form class='formmargin' id="form" dir="#{userData.dir}">
            <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                  margin-top: 12%;
                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;"
                                  icon="fa fa-fw fa-home"
                                  title="#{userData.userDDs['HOME']}"
                                  class="smhomeButton" 
                                  action="exit" />  
            </div>
            <p:fieldset legend="شاشة التقسيط" id="whole" >

                <div class="col-xs-12">
                    <p:messages id="curmsg" showDetail="true" rendered="true" closable="true"/>   
                </div>


                <div  id="firstSegment" class="ui-g-12 ui-g-nopad">
                    <div class="ui-g">

                         <div class="ui-g-12 ui-md-6">

                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 100px;margin-right: 6%;" value="رقم العقد"/>
                                </h:panelGroup> 

                                <h:panelGroup>
                                    <p:inputText style="width:36%!important"
                                                  value="#{instContractFormMB.instContractEntity.serial}"
                                                    readonly="true"
                                                    disabled="true"
                                                    />
                                </h:panelGroup> 
                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">

                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 105px;" value="اسم العميل"/>
                                </h:panelGroup> 

                                <h:panelGroup>
                                    <p:autoComplete style="width:36%!important"
                                                    dropdown="true"
                                                    converter="#{instContractFormMB.invOrgSiteConverter}"
                                                    value="#{instContractFormMB.instContractEntity.invOrganizationSite}"
                                                    var="organization"
                                                    itemLabel="#{organization}" 
                                                    itemValue="#{organization}"
                                                    forceSelection="true" 
                                                    completeMethod="#{instContractFormMB.completOrgSite}"
                                                    >

                                    </p:autoComplete>
                                </h:panelGroup> 
                            </h:panelGroup>
                            
                        </div>
                        
                        
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width:105px;margin-right: 6%;" value="طريقه الدفع"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:selectOneMenu style="width:35%;" id="paymentMethod" 
                                                     value="#{instContractFormMB.instContractEntity.paymentMethod}"> 
                                       <f:selectItem itemLabel="#{userData.userDDs['CHOOSE']}"  itemValue="" noSelectionOption="true" />
                                        <f:selectItem itemLabel="نقدي"  itemValue="0"  />
                                        <f:selectItem itemLabel="شيك"  itemValue="1"  />
                                        <f:selectItem itemLabel="ايصال امانة"  itemValue="2"  />
                                    </p:selectOneMenu>                  
                                </h:panelGroup>

                            </h:panelGroup>

                        </div>
            
                        
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 104px" value="المشروع"/>
                                </h:panelGroup> 

                                <h:panelGroup>
                                    <p:autoComplete style="width:36%!important"
                                                    dropdown="true"
                                                    converter="#{instContractFormMB.instProjectGuideConverter}"
                                                    value="#{instContractFormMB.instContractEntity.instProjectGuide}"
                                                    var="organization"
                                                    itemLabel="#{organization}" 
                                                    itemValue="#{organization}"
                                                    forceSelection="true" 
                                                    completeMethod="#{instContractFormMB.completeInstProject}"
                                                    >
                                        <p:ajax update="totalValue"
                                                event="change"
                                                listener="#{instContractFormMB.updateTotalValue}" />
                                        <p:ajax update="totalValue"
                                                event="itemSelect"
                                                listener="#{instContractFormMB.updateTotalValue}" />
                                    </p:autoComplete>
                                </h:panelGroup> 
                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>

                                <h:panelGroup>
                                    <p:outputLabel style="width: 100px;margin-right: 6%;" value="تاريخ بداية الاقساط"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:calendar  style="width:50%!important" required="true" requiredMessage="يجب ادخال تاريخ" id="date" 
                                                 value="#{instContractFormMB.instContractEntity.startInstallment}"
                                                 pattern="dd/MM/yyyy" >
                                    </p:calendar>
                                </h:panelGroup>


                            </h:panelGroup>      
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>

                                <h:panelGroup>
                                    <p:outputLabel style="width: 100px" value="تاريخ العقد"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:calendar  style="width:49%!important"  id="contractDate" 
                                                 value="#{instContractFormMB.instContractEntity.date}"
                                                 pattern="dd/MM/yyyy" >
                                    </p:calendar>
                                </h:panelGroup>


                            </h:panelGroup>      
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>

                                <h:panelGroup>
                                    <p:outputLabel style="width: 100px;margin-right: 6%;" value="دفعة مقدمة"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:inputNumber id="downPay" style="width:35%!important"  value="#{instContractFormMB.instContractEntity.advancePayment}">
                                        <p:ajax listener="#{instContractFormMB.calcInstallmentValue}" update="installmentValue"/>
                                    </p:inputNumber>
                                </h:panelGroup>


                            </h:panelGroup>  
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>

                                <h:panelGroup>
                                    <p:outputLabel style="width: 100px;" value="دفعة عند الاستلام"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:inputNumber id="downCashPay" style="width:35%!important"  value="#{instContractFormMB.instContractEntity.deliveryPayment}">
                                        <p:ajax listener="#{instContractFormMB.calcInstallmentValue}" update="installmentValue"/>
                                    </p:inputNumber>
                                </h:panelGroup>


                            </h:panelGroup>      
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>

                                <h:panelGroup>
                                    <p:outputLabel style="width: 100px;margin-right: 6%;" value="العدد"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:inputNumber id="number" style="width:35%!important"  value="#{instContractFormMB.instContractEntity.amount}">
                                        <p:ajax listener="#{instContractFormMB.updateTotalValue}" update="installmentValue totalValue"/>
                                    </p:inputNumber>
                                </h:panelGroup>


                            </h:panelGroup>  
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>

                                <h:panelGroup>
                                    <p:outputLabel style="width: 100px" value="نسبة الربح"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:inputNumber id="profitRate" style="width:35%!important"  value="#{instContractFormMB.instContractEntity.murabahaRate}">
                                        <p:ajax listener="#{instContractFormMB.updateTotalValue}" update="installmentValue totalValue"/>
                                    </p:inputNumber>
                                </h:panelGroup>


                            </h:panelGroup>    
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>

                                <h:panelGroup>
                                    <p:outputLabel style="width: 99px;margin-right:6%;" value="مبلغ التقسيط"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:inputText id="installmentValue" readonly="true" style="width:37%!important"  value="#{instContractFormMB.instContractEntity.installmentValue}"/>
                                </h:panelGroup>


                            </h:panelGroup>  
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>

                                <h:panelGroup>
                                    <p:outputLabel style="width: 100px;" value="مبلغ وديعه الصيانه"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:inputNumber id="Maintenance_deposit"   style="width:37%!important"  value="#{instContractFormMB.instContractEntity.maintenanceDeposit}">
                                  <p:ajax listener="#{instContractFormMB.updateTotalValue}" update="installmentValue totalValue"/>
                                    </p:inputNumber>
                                </h:panelGroup>


                            </h:panelGroup>  
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>

                                <h:panelGroup>
                                    <p:outputLabel style="width: 99px;margin-right:6%;" value="عدد الاقساط"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:inputNumber id="installNumber" style="width:35%!important"   value="#{instContractFormMB.instContractEntity.installmentNumber}"/>
                                </h:panelGroup>


                            </h:panelGroup>    
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>

                                <h:panelGroup>
                                    <p:outputLabel style="width: 100px;" value="اجمالي المبلغ"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:inputNumber id="totalValue" style="width:35%!important"  value="#{instContractFormMB.instContractEntity.totalValue}">
                                        <p:ajax listener="#{instContractFormMB.calcInstallmentValue}" update="installmentValue"/>
                                    </p:inputNumber>
                                </h:panelGroup>


                            </h:panelGroup> 
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>

                                <h:panelGroup>
                                    <p:outputLabel style="width: 99px;margin-right:6%;" value="عدد الشهور"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:inputNumber id="monthNumber" style="width:35%!important"  value="#{instContractFormMB.instContractEntity.daysNumber}">

                                    </p:inputNumber>
                                </h:panelGroup>


                            </h:panelGroup>    
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>

                                <h:panelGroup>
                                    <p:outputLabel style="width: 100px;" value="ملاحظات"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:inputText id="remarks" style="width:37%!important"  value="#{instContractFormMB.instContractEntity.remark}">

                                    </p:inputText>
                                </h:panelGroup>


                            </h:panelGroup> 
                        </div>
                    </div>
                </div>

                <h:panelGrid columns="1" class="col-md-12">

                    <h:panelGroup  class="centerButtons">




                        <p:commandButton  class="saveButton" 
                                          id="save" 
                                          title="#{userData.userDDs['SAVE']}" 
                                          value="#{userData.userDDs['SAVE']}" 
                                          style=""
                                          action="#{instContractFormMB.save()}"
                                          update="form" disabled="#{instContractFormMB.instContractEntity.postFlag == 1 or (instContractFormMB.instContractEntity.disabled or instContractFormMB.instContractEntity.cancel)}"
                                                 />

                        <p:commandButton   class="newButton"
                                           id="newN"
                                           style=""
                                           value="#{userData.userDDs['NEW']}" 
                                           action="#{instContractFormMB.reset()}" 
                                           update="form"
                                           disabled="#{instContractFormMB.instContractEntity.cancel}"/>
                        
                       <p:commandButton  class="sureButtons"  id="process" 
                                          title="تأكيد" 
                                          value="تأكيد" 
                                          style="color: #fff!important;background-color: #b5212cdb;margin-left: 5px;"
                                          action="#{instContractFormMB.calculateInstallment()}"
                                          update="form"
                                          disabled="#{instContractFormMB.instContractEntity.cancel}"/>

                        <p:commandButton    class="contractprints"  
                                            ajax="false" onclick="form.target = '_blank'" 
                                            actionListener="#{instContractFormMB.exportPDF}" 
                                            style="color: #fff!important;background-color: rgb(1, 76, 134);margin-left: 5px;"
                                            value="طباعة العقد"
                                            />



                        <h:commandLink class="sdcreenimg">  
                            <p:graphicImage name="/img/excel.jpg" width="24"/>  
                            <p:dataExporter type="xls"
                                            target="instContractDetailsTable" 
                                            fileName="الاقساط"
                                            postProcessor="#{instContractFormMB.postProcessXLS}" />  
                        </h:commandLink> 

                        <p:commandButton   class="newButtons"
                                           id="canelInstallment"
                                           style="color: #fff!important;background-color: #9c27b0d1;margin-left: 5px;"
                                           value="الغاء العقد" 
                                           action="#{shiftingJournalMB_new.cancelInstallment()}" 
                                           update="form" 
                                           rendered="#{instContractFormMB.instContractEntity.id != null }"
                                           disabled="#{instContractFormMB.instContractEntity.cancel or instContractFormMB.instContractEntity.postFlag != 1}">

                            <f:setPropertyActionListener value="#{instContractFormMB.instContractEntity.id}"
                                                         target="#{shiftingJournalMB_new.selectedInstallmentId}"/>
                            <p:confirm header="#{userData.userDDs['COFIGRATION']}" 
                                       message="#{userData.userDDs['ARE_YOU_SURE']}"
                                       icon="ui-icon-alert" />
                        </p:commandButton>
                           <p:commandButton  class="closeButton" title="#{userData.userDDs['BACK']}" 
                                          immediate="true"
                                          value="#{userData.userDDs['BACK']}" 
                                          style=""
                                          action="#{instContractFormMB.exit()}"   />
                       
                          <p:blockUI block="form" trigger="save newN process canelInstallment" animate="true" >

                            <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                        </p:blockUI> 
                    </h:panelGroup>
                </h:panelGrid>

            </p:fieldset>
            <p:fieldset>
                <p:dataTable id="instContractDetailsTable"
                             reflow="true"
                             var="instContractDetailsTable"
                             rowIndexVar="index" 
                             dir="rtl" 
                             emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                             sortBy="#{1}"
                             selectionMode="single"
                             selection="#{instContractFormMB.instContractDetailsEntitySelected}"
                             widgetVar="instContractDetailsTable"
                             rowKey="#{instContractDetailsTable.index}"
                             value="#{instContractFormMB.instContractDetailsEntityList}" >

                    <f:facet name="header" class="col-md-12">
                        <p:commandButton   class="saddButton" id="addnew"
                                           icon="fa fa-plus"
                                           title="#{userData.userDDs['ADD']}" 
                                           actionListener="#{instContractFormMB.addNewDetail()}" 
                                           update=":form:curmsg instContractDetailsTable"                                         
                                           ajax="true"
                                           style="float:right"
                                           rendered="#{!instContractFormMB.instContractEntity.disabled}" 
                                           disabled="#{instContractFormMB.instContractEntity.cancel}"/>
                        <p:outputPanel>
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" onkeyup="PF('instContractDetailsTable').filter()" style="width:150px" />
                        </p:outputPanel>
                    </f:facet>

                    <p:ajax  event="rowSelect" 
                             listener="#{instContractFormMB.onRowSelectDetails}"                                
                             update="instContractDetailsTable"/>

                    <p:column headerText="م"  style="width: 3vh;font-size: 1.8vh;text-align: right;border-radius: 0px;">
                        <h:outputText value="#{instContractDetailsTable.index}"  />
                    </p:column>
                    <p:column  style="width: 8vh;font-size: 1.8vh;text-align: right;border-radius: 0px;" headerText="تاريخ القسط" >
                        <p:calendar class="dateDue"  style="width:50%!important"  id="dueDate1" 
                                     value="#{instContractDetailsTable.dueDate}"
                                     rendered="#{instContractDetailsTable.markEdit}"
                                     pattern="dd/MM/yyyy" >
                            <p:ajax event="dateSelect" update="form" listener="#{instContractFormMB.updateListDetailsOrder}" />
                        </p:calendar>
                        <p:outputLabel value="#{instContractDetailsTable.dueDate}" rendered="#{not instContractDetailsTable.markEdit}">
                            <f:convertDateTime type="date" pattern="dd-MM-yyyy"/>
                        </p:outputLabel>
                    </p:column>
                    <p:column style="width: 10%;font-size: 1.8vh;text-align: right;border-radius: 0px;" headerText="القيمة" >
                        <h:outputText value="#{instContractDetailsTable.value}" rendered="#{not instContractDetailsTable.markEdit}"  />
                        <p:inputNumber value="#{instContractDetailsTable.value}" rendered="#{instContractDetailsTable.markEdit}" >
                            <p:ajax event="blur" update="form" listener="#{instContractFormMB.updateValueTotal}" />
                        </p:inputNumber>
                    </p:column>
                    <p:column style="width: 37vh;font-size: 1.8vh;text-align: right;border-radius: 0px;" headerText="الملاحظات" >
                        <h:inputText class="notesText" value="#{instContractDetailsTable.remark}"  /> 
                    </p:column>


                    <p:columnGroup type="footer">
                        <p:row>
                            <p:column  style="border-radius: 0px;" colspan="2" footerText="#{userData.userDDs['TOTAL']} " />
                            <p:column  style="border-radius: 0px;" footerText="#{instContractFormMB.totalDetailValue}"/>
                            <p:column  style="border-radius: 0px;" rendered="#{!instContractFormMB.instContractEntity.disabled}"  footerText=""/>
                        </p:row>
                    </p:columnGroup>
                    <p:column style="width: 7vh;font-size: 1.8vh;text-align: right;border-radius: 0px;"  headerText="#{userData.userDDs['TRANSACTION']}" rendered="#{!instContractFormMB.instContractEntity.disabled}" >

                        <p:commandButton  class="saddbuttonins" id="addnew2"
                                          icon="fa fa-plus"  
                                          title="#{userData.userDDs['ADD']}" 
                                          actionListener="#{instContractFormMB.addNewDetail()}" 
                                          update=":form:curmsg instContractDetailsTable"                                         
                                          ajax="true"
                                          style="float:right;background-color: rgb(42, 163, 218);border-radius: 3px;"
                                          disabled="#{instContractFormMB.instContractEntity.cancel}"/>

                        <p:commandButton  class="sdeleteButtons" update="instContractDetailsTable"
                                          title="#{userData.userDDs['DELETE']}" style="background-color: red;border-radius: 3px;"
                                          action="#{instContractFormMB.deleteDetail}"
                                          icon="fa fa-remove" 
                                          disabled="#{instContractFormMB.instContractEntity.cancel}">

                            <f:setPropertyActionListener value="#{instContractDetailsTable}"
                                                         target="#{instContractFormMB.instContractDetailsEntitySelected}"/>
                            <p:confirm header="#{userData.userDDs['COFIGRATION']}" 
                                       message="#{userData.userDDs['ARE_YOU_SURE']}"
                                       icon="ui-icon-alert" />
                        </p:commandButton>

                        <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                            <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                            <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                        </p:confirmDialog>
                    </p:column >
                </p:dataTable>
            </p:fieldset>
        </h:form>
    </ui:define>
</ui:composition>
