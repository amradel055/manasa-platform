<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/newTemplate.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form  id="form" dir="#{userData.dir}"  class='formmargin'>
            <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                  margin-top: 12%;
                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;"
                                  icon="fa fa-fw fa-home"
                                  title="#{userData.userDDs['HOME']}"
                                  class="smhomeButton" 
                                  action="exit" />
                <p:commandButton  style="z-index: 2;
                                  margin-top: 9%!important;
                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;" 
                                  class="viewButton sminimize"
                                  icon="fa fa-window-minimize"
                                  title="إظهار/إخفاء"/>  
            </div>
            <p:fieldset  legend="تقرير بيانات العملاء المحتملين"

                         style=" position: relative">

                <div  id="firstSegment" class="ui-g-12 ui-g-nopad firstset">
                    <div class="ui-g">
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 75px;margin-right: 6%;" value="من موظف"/>
                                </h:panelGroup> 

                                <h:panelGroup>
                                    <p:selectOneMenu id="EVENTFrom" style="width: 35%;" value="#{crmLeadsDataMB.crmLeadsSearchBean.empFrom}" converter="#{crmLeadsDataMB.employeeDTOConverterFrom}">
                                        <f:selectItem itemLabel="اختر" itemValue="" />
                                        <f:selectItems value="#{crmLeadsDataMB.empFrom}" var="leads" itemValue="#{leads}" itemLabel="#{leads}" />
                                    </p:selectOneMenu>
                                </h:panelGroup> 
                            </h:panelGroup>
                        </div>

                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 75px" value="الى موظف"/>
                                </h:panelGroup> 

                                <h:panelGroup>
                                    <p:selectOneMenu id="eventTo" style="width: 35%;" value="#{crmLeadsDataMB.crmLeadsSearchBean.empTo}" converter="#{crmLeadsDataMB.employeeDTOConverterTo}">
                                        <f:selectItem itemLabel="اختر" itemValue="" />
                                        <f:selectItems value="#{crmLeadsDataMB.empTo}" var="leadsd" itemValue="#{leadsd}" itemLabel="#{leadsd}" />
                                    </p:selectOneMenu>
                                </h:panelGroup> 
                            </h:panelGroup>
                        </div>

                        <div class="ui-g-12 ui-md-6" style="margin-top: 1%;">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 75px;margin-right: 6%;" value="من مصدر"/>
                                </h:panelGroup> 

                                <h:panelGroup>
                                    <p:selectOneMenu id="srcFrom" style="width: 35%;" value="#{crmLeadsDataMB.crmLeadsSearchBean.sourceListFrom}" converter="#{crmLeadsDataMB.symbolConverterFrom}">
                                        <f:selectItem itemLabel="اختر" itemValue="" />
                                        <f:selectItems value="#{crmLeadsDataMB.sourceListFrom}" var="leads" itemValue="#{leads}" itemLabel="#{leads}" />
                                    </p:selectOneMenu>
                                </h:panelGroup> 
                            </h:panelGroup>
                        </div>

                        <div class="ui-g-12 ui-md-6" style="margin-top: 1%;">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 75px" value="الى مصدر"/>
                                </h:panelGroup> 

                                <h:panelGroup>
                                    <p:selectOneMenu id="srcsTo" style="width: 35%;" value="#{crmLeadsDataMB.crmLeadsSearchBean.sourceListTo}" converter="#{crmLeadsDataMB.symbolConverterTo}">
                                        <f:selectItem itemLabel="اختر" itemValue="" />
                                        <f:selectItems value="#{crmLeadsDataMB.sourcesListTo}" var="leadsd" itemValue="#{leadsd}" itemLabel="#{leadsd}" />
                                    </p:selectOneMenu>
                                </h:panelGroup> 
                            </h:panelGroup>
                        </div>

                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 75px;margin-right: 6%; margin-top: 3%;" value="#{userData.userDDs['FROM_CUSTOM']}"/>
                                </h:panelGroup> 

                                <h:panelGroup>
                                    <p:autoComplete style="width:34%!important" 
                                                    dropdown="true"
                                                    converter="#{crmLeadsDataMB.invOrganizationSiteDTOConverterFrom}"
                                                    value="#{crmLeadsDataMB.crmLeadsSearchBean.codeFrom}"
                                                    var="leads"
                                                    itemLabel="#{leads}" 
                                                    itemValue="#{leads}" 
                                                    forceSelection="true" 
                                                    completeMethod="#{crmLeadsDataMB.completeAllLeads}" 
                                                    >
                                    </p:autoComplete>
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 75px; margin-top: 3%;" value="#{userData.userDDs['TO_CUSTOM']}"/>
                                </h:panelGroup> 

                                <h:panelGroup>                                    
                                    <p:autoComplete style="width:34%!important" 
                                                    dropdown="true"
                                                    converter="#{crmLeadsDataMB.invOrganizationSiteDTOConverterFrom}"
                                                    value="#{crmLeadsDataMB.crmLeadsSearchBean.codeTo}"
                                                    var="leads"
                                                    itemLabel="#{leads}" 
                                                    itemValue="#{leads}" 
                                                    forceSelection="true" 
                                                    completeMethod="#{crmLeadsDataMB.completeAllLeads}" 
                                                    >
                                    </p:autoComplete>
                                </h:panelGroup> 
                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6 fromDate">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel  style="width: 70px;margin-right: 6%;" value="#{userData.userDDs['FROM_DATE']}"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:calendar pattern="dd/MM/yyyy" 
                                                value="#{crmLeadsDataMB.crmLeadsSearchBean.dateFrom}"
                                                style="width: 50%"
                                                id="dateFrom">

                                    </p:calendar>
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6 toDate">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel  style="width: 70px;" value="#{userData.userDDs['TO_DATE']}"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:calendar pattern="dd/MM/yyyy" 
                                                value="#{crmLeadsDataMB.crmLeadsSearchBean.dateTo}"
                                                style="width: 50%"
                                                id="dateTo">

                                    </p:calendar>
                                </h:panelGroup>
                            </h:panelGroup>

                        </div>
                    </div>
                </div>
                <h:panelGrid  columns="1"  class="col-md-12">

                    <h:panelGroup  class="centerButtons"  style="margin-top: 2%">


                        <p:commandButton     class="searchButtons"
                                             title="#{userData.userDDs['SEARCH']}"
                                             action="#{crmLeadsDataMB.search()}"
                                             id="saveB"
                                             value="#{userData.userDDs['SEARCH']}"
                                             update="CustomerDataViewTable" 
                                             style="color: #fff!important;background-color: #2196F3;margin-left: 5px;"   />

                        <p:commandButton   class="newButton"
                                           id="NewB"
                                           title="#{userData.userDDs['NEW']}" 
                                           immediate="true" 
                                           action="#{crmLeadsDataMB.reset()}"
                                           update="form"
                                           value="#{userData.userDDs['NEW']}"
                                           style=""/>



                        <p:commandButton class="closeButton"
                                         id="CloseB"
                                         style=""  
                                         value="#{userData.userDDs['BACK']}" 
                                         title="#{userData.userDDs['BACK']}"
                                         action="exit"/>
                        <p:commandButton  class="printButtons"
                                          ajax="false"
                                          onclick="form.target = '_blank'"  
                                          style="color: #fff!important;background-color: blue;margin-left: 5px" 
                                          value="#{userData.userDDs['PRINT']}" 
                                          title="#{userData.userDDs['PRINT']}" 
                                          actionListener="#{crmLeadsDataMB.print}"/>

                        <h:commandLink  class="sdcreenimg" style="margin-right: 4px;">  
                            <p:graphicImage name="/img/excel.jpg" width="24"/>  
                            <p:dataExporter type="xls"
                                            target="CustomerDataViewTable" 
                                            fileName=" تقرير بيانات العملاء الأساسية"
                                            postProcessor="#{supplierDataReportMB.postProcessXLS}" />  
                        </h:commandLink>

                        <p:blockUI block="form" trigger="saveB NewB CloseB" animate="true" >

                            <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                        </p:blockUI> 


                    </h:panelGroup>

                </h:panelGrid>

            </p:fieldset>

            <p:fieldset  style="margin-top: 2%">
                <p:dataTable 
                    rows="20"
                    paginator="true"
                    draggableColumns="true" 
                    var="CustomerDataViewTable" 
                    widgetVar="CustomerDataViewTable"  
                    rowKey="#{CustomerDataViewTable}"
                    rowIndexVar="index" 
                    value="#{crmLeadsDataMB.leadsReturn}" 
                    dir="rtl" 
                    emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                    id="CustomerDataViewTable">

                    <f:facet name="header">


                        <p:outputPanel>
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" onkeyup="PF('CustomerDataViewTable').filter()" style="width:150px" />
                        </p:outputPanel>

                    </f:facet>

                    <p:column   style="width: 8vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" headerText="#{userData.userDDs['CUSTOM_CODE']}" 

                                filterBy="#{CustomerDataViewTable.code}" 
                                filterMatchMode="contains" 
                                sortBy="#{CustomerDataViewTable.code}"
                                filterable="false">

                        <h:outputText value="#{CustomerDataViewTable.code}" style="font-size: 1.5vh"/>
                    </p:column>



                    <p:column style="width: 12vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" filterStyle="display:none"
                              headerText="#{userData.userDDs['NAME']}" 

                              filterBy="#{CustomerDataViewTable.name}" 
                              filterMatchMode="contains" 
                              sortBy="#{CustomerDataViewTable.name}"
                              filterable="false">

                        <h:outputText value="#{CustomerDataViewTable.name}" style="font-size: 1.5vh;width: 95%"/>
                    </p:column>

                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" 
                              headerText="#{userData.userDDs['PHONE']}" 

                              filterBy="#{CustomerDataViewTable.mobile}" 
                              filterMatchMode="contains" 
                              sortBy="#{CustomerDataViewTable.mobile}"
                              filterable="false">

                        <h:outputText value="#{CustomerDataViewTable.mobile}" style="font-size: 1.5vh;width: 95%"/>
                    </p:column>
                    <p:column style="width:13vh;font-size:1.8vh;text-align: right;border-radius: 0px "
                              filterStyle="display:none"
                              filterBy="#{CustomerDataViewTable.learnAboutCompanyFrom.name}"
                              filterMatchMode="contains" 
                              headerText="مصدر العميل" sortBy="#{CustomerDataViewTable.learnAboutCompanyFrom.name}" >
                        <p:outputLabel value="#{CustomerDataViewTable.learnAboutCompanyFrom.name}" />
                    </p:column>
                    <p:column style="width:13vh;font-size:1.8vh;text-align: right;border-radius: 0px "
                              filterStyle="display:none"
                              filterBy="#{CustomerDataViewTable.assignedTo.name}"
                              filterMatchMode="contains" 
                              headerText="المتابع له" sortBy="#{CustomerDataViewTable.assignedTo.name}" >
                        <p:outputLabel value="#{CustomerDataViewTable.assignedTo.name}" />
                    </p:column>
                    <p:column style="width:13vh;font-size:1.8vh;text-align: right;border-radius: 0px "
                              filterStyle="display:none"
                              filterBy="#{CustomerDataViewTable.projectName.name}"
                              filterMatchMode="contains" 
                              headerText="اسم المشروع" sortBy="#{CustomerDataViewTable.projectName.name}" >
                        <p:outputLabel value="#{CustomerDataViewTable.projectName.name}" />
                    </p:column>
                    <p:column style="width:13vh;font-size:1.8vh;text-align: right;border-radius: 0px "
                              filterStyle="display:none"
                              filterBy="#{CustomerDataViewTable.leadStatus.name}"
                              filterMatchMode="contains" 
                              headerText="الحاله" sortBy="#{CustomerDataViewTable.leadStatus.name}" >
                        <p:outputLabel value="#{CustomerDataViewTable.leadStatus.name}" />
                    </p:column>


                </p:dataTable>
            </p:fieldset>
        </h:form>
    </ui:define>
</ui:composition>
