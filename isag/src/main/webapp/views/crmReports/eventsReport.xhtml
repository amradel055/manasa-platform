<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/newTemplate.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form  id="form" dir="#{userData.dir}"  class='formmargin'>
            <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                  margin-top: 12%;
                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;"
                                  icon="fa fa-fw fa-home"
                                  title="#{userData.userDDs['HOME']}"
                                  class="smhomeButton" 
                                  action="exit" />
                <p:commandButton  style="z-index: 2;
                                  margin-top: 9%!important;
                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;" 
                                  class="viewButton sminimize"
                                  icon="fa fa-window-minimize"
                                  title="إظهار/إخفاء"/>  
            </div>
            <p:fieldset  legend="تقرير المهام والاحداث"

                         style=" position: relative">

                <div  id="firstSegment" class="ui-g-12 ui-g-nopad firstset">
                    <div class="ui-g">

                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 75px;margin-right: 6%;" value="من موظف"/>
                                </h:panelGroup> 

                                <h:panelGroup>
                                    <p:autoComplete style="width:34%!important " 
                                                    dropdown="true"
                                                    converter="#{crmEventsReportMB.employeeDTOConverterFrom}"
                                                    value="#{crmEventsReportMB.crmEventsReportSearchBean.empFrom}" 
                                                    var="emp"
                                                    itemLabel="#{emp}" 
                                                    itemValue="#{emp}" 
                                                    forceSelection="true" 
                                                    completeMethod="#{crmEventsReportMB.completeEmployeeDTOFrom}"
                                                    />  
                                </h:panelGroup> 
                            </h:panelGroup>
                        </div>

                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 75px" value="الى موظف"/>
                                </h:panelGroup> 

                                <h:panelGroup>
                                    <p:autoComplete style="width:34%!important " 
                                                    dropdown="true"
                                                    converter="#{crmEventsReportMB.employeeDTOConverterTo}"
                                                    value="#{crmEventsReportMB.crmEventsReportSearchBean.empTo}"
                                                    var="emp"
                                                    itemLabel="#{emp}" 
                                                    itemValue="#{emp}" 
                                                    forceSelection="true" 
                                                    completeMethod="#{crmEventsReportMB.completeEmployeeDTOTo}"
                                                    />   
                                </h:panelGroup> 
                            </h:panelGroup>
                        </div>

                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 75px;margin-right: 6%; margin-top: 4%;" value="من عميل"/>
                                </h:panelGroup> 

                                <h:panelGroup>

                                    <p:autoComplete style="width:34%!important " 
                                                    dropdown="true"
                                                    converter="#{crmEventsReportMB.invOrganizationSiteDTOConverterFrom}"
                                                    value="#{crmEventsReportMB.crmEventsReportSearchBean.leadsFrom}"

                                                    var="lead"
                                                    itemLabel="#{lead}" 
                                                    itemValue="#{lead}" 
                                                    forceSelection="true" 
                                                    completeMethod="#{crmEventsReportMB.completeInvOrganizationSiteDTOFrom}"
                                                    /> 

                                </h:panelGroup> 
                            </h:panelGroup>
                        </div>

                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 75px; margin-top: 4%;" value="الى عميل"/>
                                </h:panelGroup> 

                                <h:panelGroup>
                                    <p:autoComplete style="width:34%!important " 
                                                    dropdown="true"
                                                    converter="#{crmEventsReportMB.invOrganizationSiteDTOConverterTo}"
                                                    value="#{crmEventsReportMB.crmEventsReportSearchBean.leadsTo}" 

                                                    var="lead"
                                                    itemLabel="#{lead}" 
                                                    itemValue="#{lead}" 
                                                    forceSelection="true" 
                                                    completeMethod="#{crmEventsReportMB.completeInvOrganizationSiteDTOTo}"
                                                    /> 


                                </h:panelGroup> 
                            </h:panelGroup>
                        </div>


                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel  style="width: 70px;margin-right: 6%; margin-top: 4%;" value="#{userData.userDDs['FROM_DATE']}"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:calendar pattern="dd/MM/yyyy" 
                                                value="#{crmEventsReportMB.crmEventsReportSearchBean.dateFrom}"
                                                style="width: 50%"
                                                id="dateFromCRM">

                                    </p:calendar>
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel  style="width: 70px; margin-top: 4%;" value="#{userData.userDDs['TO_DATE']}"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:calendar pattern="dd/MM/yyyy" 
                                                value="#{crmEventsReportMB.crmEventsReportSearchBean.dateTo}"
                                                style="width: 50%"
                                                id="dateToCRM">

                                    </p:calendar>
                                </h:panelGroup>
                            </h:panelGroup>

                        </div>

                        <div class="ui-g-12 ui-md-6">
                            <p:outputLabel style="margin-top: 3%; margin-right: 6%; width: 75px;" for="@next" value="النوع" />
                            <p:selectOneMenu id="console" value="#{crmEventsReportMB.crmEventsReportSearchBean.type}" style="width:35%;">
                                <f:selectItem itemLabel="اختر" itemValue="" />
                                <f:selectItem itemLabel="حدث" itemValue="0" />
                                <f:selectItem itemLabel="مهمه" itemValue="1" />
                            </p:selectOneMenu>
                        </div>

                    </div>
                </div>
                <h:panelGrid  columns="1"  class="col-md-12">

                    <h:panelGroup  class="centerButtons"  style="margin-top: 2%">


                        <p:commandButton     class="searchButtons"
                                             title="#{userData.userDDs['SEARCH']}"
                                             action="#{crmEventsReportMB.search()}"
                                             id="saveB"
                                             value="#{userData.userDDs['SEARCH']}"
                                             update="CustomerDataViewTable" 
                                             style="color: #fff!important;background-color: #2196F3;margin-left: 5px;"   />

                        <p:commandButton   class="newButtons"
                                           id="NewB"
                                           title="#{userData.userDDs['NEW']}" 
                                           immediate="true" 
                                           action="#{crmEventsReportMB.reset()}"
                                           update="form"
                                           value="#{userData.userDDs['NEW']}"
                                           style="color: #fff!important;background-color: #9c27b0d1;margin-left: 5px;"/>



                        <p:commandButton class="closeButtons"
                                         id="CloseB"
                                         style="color: #fff!important;background-color: #035C70;margin-left: 5px;"  
                                         value="#{userData.userDDs['BACK']}" 
                                         title="#{userData.userDDs['BACK']}"
                                         action="exit"/>

                        <h:commandLink  class="sdcreenimg" style="margin-right: 4px;">  
                            <p:graphicImage name="/img/excel.jpg" width="24"/>  
                            <p:dataExporter type="xls"
                                            target="CustomerDataViewTable" 
                                            fileName=" تقرير بيانات العملاء الأساسية"
                                            postProcessor="#{supplierDataReportMB.postProcessXLS}" />  
                        </h:commandLink>

                        <p:blockUI block="form" trigger="saveB NewB CloseB" animate="true" >

                            <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                        </p:blockUI> 


                    </h:panelGroup>

                </h:panelGrid>

            </p:fieldset>

            <p:fieldset  style="margin-top: 2%">
                <p:dataTable 
                    rows="20"
                    paginator="true"
                    draggableColumns="true" 
                    var="CustomerDataViewTable" 
                    widgetVar="CustomerDataViewTable"  
                    rowKey="#{CustomerDataViewTable}"
                    rowIndexVar="index" 
                    value="#{crmEventsReportMB.serialReturn}" 
                    dir="rtl" 
                    emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                    id="CustomerDataViewTable">

                    <f:facet name="header">


                        <p:outputPanel>
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" onkeyup="PF('CustomerDataViewTable').filter()" style="width:150px" />
                        </p:outputPanel>

                    </f:facet>

                    <p:column   style="width: 8vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" headerText="مسلسل" 

                                filterBy="#{CustomerDataViewTable.serial}" 
                                filterMatchMode="contains" 
                                sortBy="#{CustomerDataViewTable.serial}"
                                filterable="false">

                        <h:outputText value="#{CustomerDataViewTable.serial}" style="font-size: 1.5vh"/>
                    </p:column>




                    <p:column style="width: 12vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" filterStyle="display:none"
                              headerText="العنوان" 

                              filterBy="#{CustomerDataViewTable.subject}" 
                              filterMatchMode="contains" 
                              sortBy="#{CustomerDataViewTable.subject}"
                              filterable="false">

                        <h:outputText value="#{CustomerDataViewTable.subject}" style="font-size: 1.5vh;width: 95%"/>
                    </p:column>

                    <p:column   style="width: 8vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" headerText="الموظف" 

                                filterBy="#{CustomerDataViewTable.assignedTo.name}" 
                                filterMatchMode="contains" 
                                sortBy="#{CustomerDataViewTable.assignedTo.name}"
                                filterable="false">

                        <h:outputText value="#{CustomerDataViewTable.assignedTo.name}" style="font-size: 1.5vh"/>
                    </p:column>


                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" 
                              headerText="اسم العميل" 

                              filterBy="#{CustomerDataViewTable.customerId.name}" 
                              filterMatchMode="contains" 
                              sortBy="#{CustomerDataViewTable.customerId.name}"
                              filterable="false">

                        <h:outputText value="#{CustomerDataViewTable.customerId.name}" style="font-size: 1.5vh;width: 95%"/>
                    </p:column>
                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" 
                              headerText="الحاله" 

                              filterBy="#{CustomerDataViewTable.status.name}" 
                              filterMatchMode="contains" 
                              sortBy="#{CustomerDataViewTable.status.name}"
                              filterable="false">

                        <h:outputText value="#{CustomerDataViewTable.status.name}" style="font-size: 1.5vh;width: 95%"/>
                    </p:column>

                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" 
                              headerText="التاريخ" 

                              filterBy="#{CustomerDataViewTable.createdDate}" 
                              filterMatchMode="contains" 
                              sortBy="#{CustomerDataViewTable.createdDate}"
                              filterable="false">

                        <h:outputText value="#{CustomerDataViewTable.createdDate}" style="font-size: 1.5vh;width: 95%"/>
                    </p:column>
                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" 
                              headerText="الموبايل" 

                              filterBy="#{CustomerDataViewTable.customerId.mobile}" 
                              filterMatchMode="contains" 
                              sortBy="#{CustomerDataViewTable.customerId.mobile}"
                              filterable="false">

                        <h:outputText value="#{CustomerDataViewTable.customerId.mobile}" style="font-size: 1.5vh;width: 95%"/>
                    </p:column>
                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" 
                              headerText="الوصف" 

                              filterBy="#{CustomerDataViewTable.discription}" 
                              filterMatchMode="contains" 
                              sortBy="#{CustomerDataViewTable.discription}"
                              filterable="false">

                        <h:outputText value="#{CustomerDataViewTable.discription}" style="font-size: 1.5vh;width: 95%"/>
                    </p:column>
                </p:dataTable>
            </p:fieldset>

        </h:form>
    </ui:define>
</ui:composition>
