<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">

        <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form  dir="#{userData.dir}" class='formmargin' id="form">
            <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                  margin-top: 24%;
                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;"
                                  icon="fa fa-fw fa-home"
                                  title="#{userData.userDDs['HOME']}"
                                  class="smhomeButton" 
                                  action="exit" />

            </div>
            <p:fieldset   legend="#{userData.userDDs['CONVERSION_BET_STORE']}" >

                <p:dataTable draggableColumns="true" 
                             var="invTransferTable"
                             widgetVar="bTable" 
                             rowIndexVar="index"
                             value="#{invTransferListMB.dataModel}"
                             lazy="true" 
                             rows="#{userData.rowListCount}"
                             paginator="true"
                             emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                             id="invTransfernTable">

                    <f:facet name="header" class="col-md-12">
                        <p:commandButton class="saddButton" icon="fa fa-plus" title="#{userData.userDDs['ADD']}"
                                         id="addA"
                                         action="#{invTransferListMB.goToAdd()}" style="float:right"/>
                        <p:blockUI block="form" trigger="addA" animate="true" >

                            <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                        </p:blockUI> 
                        <p:outputPanel  >
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" onkeyup="PF('bTable').filter()" style="width:150px" />
                        </p:outputPanel>
                    </f:facet>

                    <p:column  style="width: 5vh;font-size: 1.9vh;text-align: -webkit-auto;border-radius: 0px" 
                               headerText="#" >
                        <p:outputLabel value="#{index +1}" />
                    </p:column>

                    <p:column style="width: 15vh;font-size: 1.9vh;text-align: -webkit-auto;border-radius: 0px" 
                              filterStyle="display:none" filterBy="#{invTransferTable.serial}"
                              filterMatchMode="contains" headerText="#{userData.userDDs['CONVE_NO']}" sortBy="#{invTransferTable.serial}">
                        <p:outputLabel value="#{invTransferTable.serial}" />
                    </p:column>
                    <p:column style="width: 15vh;font-size: 1.9vh;text-align: -webkit-auto;border-radius: 0px" filterStyle="display:none" filterBy="#{invTransferTable.date}"
                              filterMatchMode="contains" headerText="#{userData.userDDs['CONVE_DATE']}" sortBy="#{invTransferTable.date}">
                        <p:outputLabel value="#{invTransferTable.date}" >
                            <f:convertDateTime type="date" pattern="dd-MM-yyyy"/>
                        </p:outputLabel>
                    </p:column>
                    <p:column style="width: 15vh;font-size: 1.9vh;text-align: -webkit-auto;border-radius: 0px" filterStyle="display:none" filterBy="#{invTransferTable.invInventoryNameFrom}"
                              filterMatchMode="contains" headerText="#{userData.userDDs['FROM_REPOS']}" sortBy="#{invTransferTable.invInventoryNameFrom}">
                        <p:outputLabel value="#{invTransferTable.invInventoryNameFrom}"/>
                    </p:column>  
                    <p:column style="width: 15vh;font-size: 1.9vh;text-align: -webkit-auto;border-radius: 0px" filterStyle="display:none" filterBy="#{invTransferTable.invInventoryNameTo}"
                              filterMatchMode="contains" headerText="#{userData.userDDs['TO_REPOS']}" sortBy="#{invTransferTable.invInventoryNameTo}">
                        <p:outputLabel value="#{invTransferTable.invInventoryNameTo}"/>
                    </p:column>
                    <p:column style="width: 15vh;font-size: 1.9vh;text-align: -webkit-auto;border-radius: 0px" filterStyle="display:none" filterBy="#{invTransferTable.remarks}"
                              filterMatchMode="contains" headerText="#{userData.userDDs['NOTE']}" sortBy="#{invTransferTable.remarks}">
                        <p:outputLabel value="#{invTransferTable.remarks}" />
                    </p:column>

                    <p:column style="width: 12vh;font-size: 1.9vh;text-align: center;border-radius: 0px" headerText="#{userData.userDDs['TRANSACTION']}">
                        <p:commandButton  class="seditButton" update="@form" icon="fa fa-fw fa-edit" style="background-color: #6a6967;border-radius: 3px;" title="#{userData.userDDs['EDIT']}" action="#{invTransferListMB.goToEdit()}">
                            <f:setPropertyActionListener value="#{invTransferTable.id}"  target="#{invTransferListMB.invTransferSelected}" />
                        </p:commandButton>
                        <p:commandButton class="sdeleteButton" update="@form" icon="fa fa-remove" style="background-color: red;border-radius: 3px;" title="#{userData.userDDs['DELETE']}"  action="#{invTransferListMB.delete}">
                            <f:setPropertyActionListener value="#{invTransferTable}" target="#{invTransferListMB.invTransferEntity}" />
                            <p:confirm header="Confirmation" message="#{userData.userDDs['ARE_YOU_SURE']}" icon="ui-icon-alert" />
                        </p:commandButton>
                    </p:column>

                </p:dataTable> 
                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                    <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                    <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                </p:confirmDialog>
            </p:fieldset>
        </h:form>
    </ui:define>
</ui:composition>
