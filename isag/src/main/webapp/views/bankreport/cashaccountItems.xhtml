<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="http://xmlns.jcp.org/jsf/core">
    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:head>
            <title>#{userData.userDDs['CASH_ACCOUNT_ITEMS']}</title>
        </h:head>
        <style >
            .ui-widget-content .ui-state-default, .ui-widget-header .ui-state-default {
                border: 1px solid #c5dbec;
                background:#fff;
            }
        </style>

        <h:body> 
            <h:form id="form" style="margin-right: 20px">     

              <div style=" position: absolute;left: 20px"> 

                    <p:commandButton  style="z-index: 2;
                                      margin-top: 12%;
                                      color: #035c70!important; 
                                      background-color: #223238!important;
                                      border: 1px solid #22323a!important;
                                      background: #22323a 50% 50% repeat-x!important;"
                                      icon="fa fa-fw fa-home"
                                      title="#{userData.userDDs['HOME']}"
                                      class="smhomeButton" 
                                      action="exit" />
                      <p:commandButton  style="z-index: 2;
                                      margin-top: 9%!important;
                                      color: #035c70!important; 
                                      background-color: #223238!important;
                                      border: 1px solid #22323a!important;
                                      background: #22323a 50% 50% repeat-x!important;" 
                                      class="viewButton sminimize"
                                      icon="fa fa-window-minimize"
                                      title="إظهار/إخفاء"/>  
                </div>

                <p:fieldset legend="#{userData.userDDs['Item_Account_Statement']}" id="whole" 
                            style=" position: relative">


                    <div class="col-xs-12">
                        <p:messages autoUpdate="true" id="msg" showDetail="true" closable="true" 
                                    rendered="#{cashAccountItemsMB.showMessageGeneral}"/>
                    </div>

                    <div  id="firstLine" class="ui-g-12 ui-g-nopad">

                        <div class="ui-g firstset">

                            <div class="ui-g-12 ui-md-6">

                                <h:panelGroup> 
                                    <h:panelGroup> 
                                        <p:outputLabel style="width: 75px;margin-right: 4%;" value="#{userData.userDDs['FROM_SAVE']}" />
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:selectOneMenu  style="width: 35%" id="MACUCode" 
                                                          filter="true" 
                                                          filterMatchMode="contains"
                                                          converter="#{cashAccountItemsMB.glBankConverter}"
                                                          value="#{cashAccountItemsMB.cashAccountSettlementSearchBean.glBankFrom}"> 

                                            <f:selectItems value="#{cashAccountItemsMB.glBankList}"  
                                                           var="bank"
                                                           itemLabel="#{bank}"
                                                           itemValue="#{bank}"/>
                                        </p:selectOneMenu> 

                                    </h:panelGroup>   
                                </h:panelGroup>
                            </div>

                            <div class="ui-g-12 ui-md-6">
                                <h:panelGroup>

                                    <h:panelGroup> 
                                        <p:outputLabel style="width: 75px;margin-right: 4%;"  value="#{userData.userDDs['TO_SAFE']}" />
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:selectOneMenu style="width: 35%" 
                                                         filter="true" 
                                                         filterMatchMode="contains"
                                                         converter="#{cashAccountItemsMB.glBankConverter}"
                                                         value="#{cashAccountItemsMB.cashAccountSettlementSearchBean.glBankTo}" > 

                                            <f:selectItems value="#{cashAccountItemsMB.glBankList}"  
                                                           var="bank"
                                                           itemLabel="#{bank}"
                                                           itemValue="#{bank}"/>
                                        </p:selectOneMenu> 

                                    </h:panelGroup>   

                                </h:panelGroup>

                            </div>
                            
                            <div class="ui-g-12 ui-md-6">

                                <h:panelGroup> 
                                    <h:panelGroup> 
                                        <p:outputLabel style="width:75px;margin-right: 4%;" value="#{userData.userDDs['From_Item']}" />
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:selectOneMenu  style="width: 35%" id="itemCode" 
                                                          filter="true" 
                                                          filterMatchMode="contains"
                                                          converter="#{cashAccountItemsMB.symbolConverterFrom}"
                                                          value="#{cashAccountItemsMB.cashAccountSettlementSearchBean.itemSerialFrom}"> 

                                            <f:selectItems value="#{cashAccountItemsMB.itemsFrom}"  
                                                           var="items"
                                                           itemLabel="#{items}"
                                                           itemValue="#{items}"/>
                                        </p:selectOneMenu> 

                                    </h:panelGroup>   
                                </h:panelGroup>
                            </div>

                            <div class="ui-g-12 ui-md-6">
                                <h:panelGroup>

                                    <h:panelGroup> 
                                        <p:outputLabel style="width: 75px;margin-right: 4%;"  value="#{userData.userDDs['To_Item']}" />
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:selectOneMenu style="width: 35%" 
                                                         filter="true" 
                                                         filterMatchMode="contains"
                                                         converter="#{cashAccountItemsMB.symbolConverterTo}"
                                                         value="#{cashAccountItemsMB.cashAccountSettlementSearchBean.itemSerialTo}" > 

                                            <f:selectItems value="#{cashAccountItemsMB.itemsTo}"  
                                                           var="itemsto"
                                                           itemLabel="#{itemsto}"
                                                           itemValue="#{itemsto}"/>
                                        </p:selectOneMenu> 

                                    </h:panelGroup>   

                                </h:panelGroup>

                            </div>
                            
                            
                            <div class="ui-g-12 ui-md-6">
                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel  style="width:70px;margin-right: 4%;" value="#{userData.userDDs['YEAR_FROM']}"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:calendar id="dateFrom" 
                                                    value="#{cashAccountItemsMB.cashAccountSettlementSearchBean.dateFrom}" 
                                                    pattern="dd/MM/yyyy" 
                                                    style="width:50%" showButtonPanel="true"
                                                    >
                                            <p:ajax listener="#{cashAccountItemsMB.checkDate(true)}" event="dateSelect" update="dateFrom"/>
                                        </p:calendar>
                                    </h:panelGroup>
                                </h:panelGroup>
                            </div>
                            <div class="ui-g-12 ui-md-6">

                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel  style="width:70px;margin-right: 4%;" value="#{userData.userDDs['YEAR_TO']}"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:calendar  style="width: 50%"  id="dateTo" 
                                                     value="#{cashAccountItemsMB.cashAccountSettlementSearchBean.dateTo}" 

                                                     pattern="dd/MM/yyyy">
                                            <p:ajax   listener="#{cashAccountItemsMB.checkDate(false)}" event="dateSelect" update="dateTo" />
                                        </p:calendar>
                                        <h:outputText value="">
                                            <f:convertDateTime pattern="MM/dd/yyyy" />
                                        </h:outputText>
                                    </h:panelGroup>      
                                </h:panelGroup>
                            </div>
                            
                            <div class="ui-g-12 ui-md-6">
                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel  style="width:75px;margin-right: 3%;" value="#{userData.userDDs['From_Bond_Number']}"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:inputNumber id="serialFrom" 
                                                       value="#{cashAccountItemsMB.cashAccountSettlementSearchBean.serialFrom}"  
                                                    style="width:50%"  
                                                    >
                                        </p:inputNumber>
                                    </h:panelGroup>
                                </h:panelGroup>
                            </div>
                            <div class="ui-g-12 ui-md-6">

                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel  style="width: 75px;margin-right: 3%;" value="#{userData.userDDs['To_Bond_Number']}"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:inputNumber  style="width: 50%"  id="serialTo" 
                                                        value="#{cashAccountItemsMB.cashAccountSettlementSearchBean.serialTo}" 
                                                     >
                                        </p:inputNumber>
                                    </h:panelGroup>      
                                </h:panelGroup>
                            </div>
                            
                            
                                 <div class="ui-g-12 ui-md-6">
                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel style="width:75px;margin-right: 4%;" value="#{userData.userDDs['Movement_Type']}"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:selectOneMenu style="width:35%;" id="transactionType" filter="true" filterMatchMode="startsWith" 
                                                         value="#{cashAccountItemsMB.cashAccountSettlementSearchBean.transactionType}"  >
                                            <f:selectItem itemLabel="#{userData.userDDs['CHOOSE']}"  itemValue="" />
                                            <f:selectItem itemLabel="سند صرف"  itemValue="1" />
                                            <f:selectItem itemLabel="سند قبض"  itemValue="2" />
                                        </p:selectOneMenu>
                                    </h:panelGroup>

                                </h:panelGroup>
                            </div>
                            <div class="ui-g-12 ui-md-6">
                             </div>
                            
                            <div class="ui-g-12 ui-md-6">

                                <h:panelGroup>
                                    <p:fieldset legend="#{userData.userDDs['SORT_BY']}" style="margin-bottom:20px; margin-right: 15px;">
                                        <p:selectOneRadio  value="#{cashAccountItemsMB.cashAccountSettlementSearchBean.orderBy}" >                                                             
                                            <f:selectItem    itemLabel="#{userData.userDDs['DATEE']}"  itemValue="0"  />
                                            <f:selectItem itemLabel="#{userData.userDDs['AMOUNT']}"  itemValue="1"  />

                                            <p:ajax update="cashAccount" listener="#{cashAccountItemsMB.search()}" />
                                        </p:selectOneRadio>  
                                    </p:fieldset>
                                </h:panelGroup>

                            </div>
                            <div class="ui-g-12 ui-md-6">

                                <h:panelGroup>
                                    <p:fieldset legend="#{userData.userDDs['DATA_PRESENTATION']}" style="margin-bottom:20px; margin-right: 5px;">
                                        <p:selectOneRadio value="#{cashAccountItemsMB.cashAccountSettlementSearchBean.type}" >                                                             
                                            <f:selectItem itemLabel="#{userData.userDDs['ALL']}"  itemValue="3"  />
                                            <f:selectItem itemLabel="#{userData.userDDs['IMPORT']}"  itemValue="1"  />
                                            <f:selectItem itemLabel="#{userData.userDDs['EXPORT']}"  itemValue="0"  />

                                            <p:ajax update="cashAccount" listener="#{cashAccountItemsMB.search()}" />

                                        </p:selectOneRadio>  
                                    </p:fieldset>
                                </h:panelGroup>
                            </div>
                        </div>
                    </div>

                </p:fieldset>

                <p:fieldset  style=" margin: 10px 0">

                    <h:panelGrid class="col-md-12 centerButtons" columns="12">

                        <h:panelGroup>


                            <p:commandButton class="searchButtons"
                                             
                                             style="color: #fff!important;background-color: #9813e4e6;margin-left: 5px"
                                             id="searchS"
                                             value="#{userData.userDDs['SEARCH']}"
                                             action="#{cashAccountItemsMB.search()}" 
                                             update="cashAccount"
                                             />

                            <p:commandButton  class="newButtons" style="color: #fff!important;background-color:#035C70 !important;margin-left: 5px" 
                                              value="#{userData.userDDs['NEW']}" 
                                              action="#{cashAccountItemsMB.reset}"
                                              id="newN"
                                              update="@form cashAccount" />
                            <p:commandButton   class="printButtons" 
                                               style="color: #fff!important;background-color: #3800ffd6;margin-left: 5px" 
                                               ajax="false" 
                                               onclick="form.target = '_blank'" 
                                               value="#{userData.userDDs['PRINT']}"
                                               actionListener="#{cashAccountItemsMB.exportPDF}"/>
                            <h:commandLink class="sdcreenimg">  
                                <p:graphicImage name="/img/excel.jpg" width="24"/>  
                                <p:dataExporter type="xls"
                                                target="cashAccount" 
                                                fileName="#{userData.userDDs['SAFE_ACCOUNT_BANK']}"
                                                postProcessor="#{cashAccountItemsMB.postProcessXLS}" />  
                            </h:commandLink>

                            <p:blockUI block="form" trigger="searchS  newN" animate="true" >

                                <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                            </p:blockUI> 


                        </h:panelGroup>

                    </h:panelGrid>

                </p:fieldset>

                <p:fieldset>
                    <p:dataTable id="cashAccount" 
                                 draggableColumns="true"
                                
                                 paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {Exporters}"
                                 value="#{cashAccountItemsMB.cashAccountSettlementReports}"
                                 var="subaccReport"
                                 widgetVar="cashSett"
                                 sortBy="#{subaccReport.bankId}" expandableRowGroups="true"
                                 
                                  paginator="true"
                                 rows="20">

                        <f:facet name="header" class="col-md-12">

                            <p:outputPanel>
                                <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large;" />
                                <p:inputText   id="globalFilter"   onkeyup="PF('cashSett').filter()" style="width: 50%important" />
                            </p:outputPanel>

                        </f:facet>

                        <p:headerRow>
                            <p:column  style="width: 15vh;font-size: 2vh;text-align: center;border-radius: 0px"  >
                                <h:outputText value="#{subaccReport.code}" />
                            </p:column>
                            <p:column  style="width: 15vh;font-size: 2vh;text-align: center;border-radius: 0px" >
                                <h:outputText value="#{subaccReport.bankName}" />
                            </p:column>
                            <p:column  style="width: 15vh;font-size: 2vh;text-align: center;border-radius: 0px" >
                                <h:outputText value="#{userData.userDDs['CURRENCY']}" />
                            </p:column>
                            <p:column  style="width: 15vh;font-size: 2vh;text-align: center;border-radius: 0px" >
                                <h:outputText value="#{subaccReport.currencyName}" />
                            </p:column>
                            <p:column  style="width: 15vh;font-size: 2vh;text-align: center;border-radius: 0px" colspan="3" >
                                <h:outputText value="#{userData.userDDs['START_BALANCE']}" rendered="#{subaccReport.openingBalance gt 0}" />
                            </p:column>
                            <p:column  style="width: 15vh;font-size: 2vh;text-align: center;border-radius: 0px" >
                                <h:outputText value="#{subaccReport.openingBalance}" />
                            </p:column>
                             <p:column  style="width: 15vh;font-size: 2vh;text-align: center;border-radius: 0px" >
                                <h:outputText value=""  />
                            </p:column>
                        </p:headerRow>
                        <p:column style="width:10vh ;text-align: center;font-size:1.8vh;border-radius: 0px"
                                  filterBy="#{subaccReport.date}"  filterMatchMode="contains" sortBy="#{subaccReport.date}" filterable="false"
                                  headerText="#{userData.userDDs['DATEE']}">
                            <h:outputText value="#{subaccReport.date}">
                                <f:convertDateTime id="datee"  pattern="dd-MM-yyyy"  />
                            </h:outputText>
                        </p:column>

                        <p:column style="width: 10vh;text-align: center;font-size:1.8vh;border-radius: 0px" 
                                  filterBy="#{subaccReport.serial}"  filterMatchMode="contains" sortBy="#{subaccReport.serial}" filterable="false"
                                  headerText="#{userData.userDDs['DOCUMENT_NUMBER']}">
                            <h:outputText value="#{subaccReport.serial}" style="font-size: 12px"/>
                        </p:column>                     


                        <p:column style="width: 10vh;text-align: center;font-size:1.8vh;border-radius: 0px" 
                                  filterBy="#{subaccReport.transactionType}"  filterMatchMode="contains" sortBy="#{subaccReport.transactionType}" filterable="false"
                                  headerText="#{userData.userDDs['MOVMENT_TYPE']}">
                            <h:outputText value="#{subaccReport.transactionType}" style="font-size: 12px"/>
                        </p:column>                     

                        <p:column style="width:12vh; text-align: center;font-size:15px;border-radius: 0px"
                                  filterBy="#{subaccReport.remark2}"  filterMatchMode="contains" sortBy="#{subaccReport.remark2}" filterable="false"
                                  headerText="#{userData.userDDs['HANDLING']}">
                            <h:outputText value="#{subaccReport.remark2}" style="font-size: 12px"/>
                        </p:column>

                        <p:column style="width:15vh; text-align: center;font-size:15px;border-radius: 0px"
                                  filterBy="#{subaccReport.remark}"  filterMatchMode="contains" sortBy="#{subaccReport.remark}" filterable="false"
                                  headerText="#{userData.userDDs['STATEMENT']}">
                            <h:outputText value="#{subaccReport.remark}" style="font-size: 12px"/>
                        </p:column>


                        <p:column style="width: 10vh;text-align: center;font-size:1.8vh;border-radius: 0px" 
                                  filterBy="#{subaccReport.debitAmount}"  filterMatchMode="contains" sortBy="#{subaccReport.debitAmount}" filterable="false"
                                  headerText="#{userData.userDDs['DEBIT']}">
                            <h:outputText value="#{subaccReport.debitAmount}" style="font-size: 12px"/>
                        </p:column>

                        <p:column style="width: 10vh;text-align: center;font-size:1.8vh;border-radius: 0px" 
                                  filterBy="#{subaccReport.creditAmount}"  filterMatchMode="contains" sortBy="#{subaccReport.creditAmount}" filterable="false"
                                  headerText="#{userData.userDDs['CREDIT']}">
                            <h:outputText value="#{subaccReport.creditAmount}" style="font-size: 12px"/>
                        </p:column>

                        <p:column style="width: 10vh;text-align: center;font-size:1.8vh;border-radius: 0px"
                                  filterBy="#{subaccReport.balance}"  filterMatchMode="contains" sortBy="#{subaccReport.balance}" filterable="false"
                                  headerText="#{userData.userDDs['BALANCE']}">
                            <h:outputText value="#{subaccReport.balance}" style="font-size: 12px"/>
                        </p:column>
                         <p:column style="width: 10vh; text-align: center;font-size:1.8vh;border-radius: 0px"  rendered="#{userData.userScreens['cashaccountItems'].edit or userData.isAdmin}" 
                                   headerText="#{userData.userDDs['TRANSACTION']}"
                                   >
                            <p:commandButton class="seditButtonss" update="@form"
                                             icon="fa fa-fw fa-edit" onclick="form.target = '_blank'" ajax="false"
                                             title="#{userData.userDDs['EDIT']}" 
                                             action="#{cashAccountItemsMB.goToEdit()}" > 
                                <f:setPropertyActionListener value="#{subaccReport.id}" 
                                                             target="#{cashAccountItemsMB.glBankTransactionIdSeclected}"/>
                                <f:setPropertyActionListener value="#{subaccReport}"
                                                             target="#{cashAccountItemsMB.glBankTransactionTypeSeclected}"/>
                            </p:commandButton>
                        </p:column>
                        <p:summaryRow>
                            <p:column colspan="5" >
                                <h:outputText  style="text-align: center" value="#{userData.userDDs['TOTAL']}"/>
                            </p:column>   
                            <p:column style="text-align: center">
                                <h:outputText style="text-align: center" value="#{subaccReport.totalDebit}"/>
                            </p:column>    
                            <p:column style="text-align: center">
                                <h:outputText style="text-align: center" value="#{subaccReport.totalCredit}"/>
                            </p:column>     

                            <p:column >
                            </p:column> 
                             <p:column >
                            </p:column> 

                        </p:summaryRow>                    

                    </p:dataTable>
                </p:fieldset>
            </h:form>

           

        </h:body>
    </ui:define>
</ui:composition>
