<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/newTemplate.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="http://xmlns.jcp.org/jsf/core">
    <link rel="stylesheet" type="text/css" href="../../resources/css/main.css" /> 
    <ui:define name="content">

        <h:head>
            <title>#{userData.userDDs['ACCOUNT_REPORT']}</title>
        </h:head>
        <style >
            .ui-widget-content .ui-state-default, .ui-widget-header .ui-state-default {
                border: 1px solid #c5dbec;
                background:#fff;
            }
        </style>
        <f:event listener="#{userData.authorize}" type="preRenderView" />

        <h:body> 
            <h:form id="form" class='formmargin'>     

                <div style=" position: absolute;left: 20px"> 

                    <p:commandButton  style="z-index: 2;
                                      margin-top: 12%;
                                      color: #035c70!important; 
                                      background-color: #223238!important;
                                      border: 1px solid #22323a!important;
                                      background: #22323a 50% 50% repeat-x!important;"
                                      icon="fa fa-fw fa-home"
                                      title="#{userData.userDDs['HOME']}"
                                      class="smhomeButton" 
                                      action="exit" />
                    <p:commandButton  style="z-index: 2;
                                      margin-top: 9%!important;
                                      color: #035c70!important; 
                                      background-color: #223238!important;
                                      border: 1px solid #22323a!important;
                                      background: #22323a 50% 50% repeat-x!important;" 
                                      class="viewButton sminimize"
                                      icon="fa fa-window-minimize"
                                      title="إظهار/إخفاء"/>  
                </div>

                <p:fieldset legend="#{userData.userDDs['SAFE_ACCOUNT_BANK']}" id="whole" 
                            style=" position: relative">


                    <div class="col-xs-12">
                        <p:messages autoUpdate="true" id="msg" showDetail="true" closable="true" rendered="true"/>
<!--                                    #/{CashAccountSettlementMB.showMessageGeneral}-->
                    </div>

                    <div  id="firstLine" class="ui-g-12 ui-g-nopad">

                        <div class="ui-g firstset">

                            <div class="ui-g-12 ui-md-6">

                                <h:panelGroup> 
                                    <h:panelGroup> 
                                        <p:outputLabel style="width: 80px;margin-right: 4%;" value="#{userData.userDDs['FROM_SAVE']}" />
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:selectOneMenu  style="width: 35%" id="MACUCode" 
                                                          filter="true" 
                                                          filterMatchMode="startsWith" 
                                                          converter="#{CashAccountSettlementMB.glBankConverter}"
                                                          value="#{CashAccountSettlementMB.cashAccountSettlementSearchBean.glBankFrom}"> 

                                            <f:selectItems value="#{CashAccountSettlementMB.glBankList}"  
                                                           var="bank"
                                                           itemLabel="#{bank}"
                                                           itemValue="#{bank}"/>
                                            <p:ajax event="change"  listener="#{CashAccountSettlementMB.checkClosePeriodBank()}"/>
                                        </p:selectOneMenu> 

                                    </h:panelGroup>   
                                </h:panelGroup>
                            </div>

                            <div class="ui-g-12 ui-md-6">
                                <h:panelGroup>

                                    <h:panelGroup> 
                                        <p:outputLabel style="width: 80px;margin-right: 4%;"  value="#{userData.userDDs['TO_SAFE']}" />
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:selectOneMenu style="width: 35%" 
                                                         filter="true" 
                                                         filterMatchMode="startsWith"
                                                         converter="#{CashAccountSettlementMB.glBankConverter}" 
                                                         value="#{CashAccountSettlementMB.cashAccountSettlementSearchBean.glBankTo}"> 

                                            <f:selectItems value="#{CashAccountSettlementMB.glBankList}"  
                                                           var="bank"
                                                           itemLabel="#{bank}"
                                                           itemValue="#{bank}"/>
                                            <p:ajax event="change"  listener="#{CashAccountSettlementMB.checkClosePeriodBank()}" />

                                        </p:selectOneMenu> 

                                    </h:panelGroup>   

                                </h:panelGroup>

                            </div>
                            <div class="ui-g-12 ui-md-6">
                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel  style="width:75px;margin-right: 4%;" value="#{userData.userDDs['YEAR_FROM']}"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:calendar id="dateFrom" 
                                                    value="#{CashAccountSettlementMB.cashAccountSettlementSearchBean.dateFrom}" 
                                                    pattern="dd/MM/yyyy" 
                                                    style="width:50%" showButtonPanel="true"
                                                    >
                                        </p:calendar>
                                    </h:panelGroup>
                                </h:panelGroup>
                            </div>
                            <div class="ui-g-12 ui-md-6">

                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel  style="width:75px;margin-right: 4%;" value="#{userData.userDDs['YEAR_TO']}"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:calendar  style="width: 50%"  id="dateTo" 
                                                     value="#{CashAccountSettlementMB.cashAccountSettlementSearchBean.dateTo}" 

                                                     pattern="dd/MM/yyyy">
                                        </p:calendar>
                                        <h:outputText value="">
                                            <f:convertDateTime pattern="MM/dd/yyyy" />
                                        </h:outputText>
                                    </h:panelGroup>      
                                </h:panelGroup>
                            </div>
                            <div class="ui-g-12 ui-md-6">
                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel style="width:80px;margin-right: 4%;" value="#{userData.userDDs['CURRENCY']}"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:selectOneMenu style="width:35%;" id="paymentType" 
                                                         value="#{CashAccountSettlementMB.cashAccountSettlementSearchBean.currencyType}">                                                             
                                            <f:selectItem itemLabel="#{userData.userDDs['LOCAL_CURRENCY']}"  itemValue="0"  />
                                            <f:selectItem itemLabel="#{userData.userDDs['FOREIGN_CURRENCY']}"  itemValue="1"  />

                                            <p:ajax update="cashAccount" listener="#{CashAccountSettlementMB.search()}" />
                                        </p:selectOneMenu>                  
                                    </h:panelGroup>

                                </h:panelGroup>

                            </div>
                            <div class="ui-g-12 ui-md-6">


                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel style="width: 80px;margin-right: 4%;" value="#{userData.userDDs['FINANCE_YEAR']}"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:selectOneMenu style="width:35%;" id="year" filter="true" filterMatchMode="startsWith" 
                                                         value="#{CashAccountSettlementMB.glYearSelection}" converter="#{CashAccountSettlementMB.glYearConverter}"  >
                                            <p:ajax update="dateFrom dateTo" listener="#{CashAccountSettlementMB.pushGlYearSelection()}" />
                                            <f:selectItem itemLabel="#{userData.userDDs['CHOOSE']}"  itemValue="" />
                                            <f:selectItems value="#{CashAccountSettlementMB.glYearList}"  var="year" itemLabel="#{year.name}" itemValue="#{year}"/>
                                        </p:selectOneMenu>
                                    </h:panelGroup>

                                </h:panelGroup>
                            </div>

                            <div class="ui-g-12 ui-md-6">
                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel  style="width:74px;margin-right: 4%;" value="من رقم سند"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:inputNumber id="serialFrom" 
                                                       value="#{CashAccountSettlementMB.cashAccountSettlementSearchBean.serialFrom}"  
                                                       style="width:35%"  
                                                       >
                                        </p:inputNumber>
                                    </h:panelGroup>
                                </h:panelGroup>
                            </div>
                            <div class="ui-g-12 ui-md-6">

                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel  style="width: 81px;margin-right: 3%;" value="الي رقم سند"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:inputNumber  style="width: 35%"  id="serialTo" 
                                                        value="#{CashAccountSettlementMB.cashAccountSettlementSearchBean.serialTo}" 
                                                        >
                                        </p:inputNumber>
                                    </h:panelGroup>      
                                </h:panelGroup>
                            </div>
                            <div class="ui-g-12 ui-md-6">
                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel style="width:80px;margin-right: 4%;" value="من مستخدم"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:selectOneMenu style="width: 35%" 
                                                         filter="true" 
                                                         filterMatchMode="startsWith"
                                                         converter="#{CashAccountSettlementMB.isagUserConverter}"
                                                         value="#{CashAccountSettlementMB.cashAccountSettlementSearchBean.isagUserFrom}" > 
                                            <f:selectItem itemLabel="#{userData.userDDs['CHOOSE']}"  itemValue="" />
                                            <f:selectItems value="#{CashAccountSettlementMB.users}"  
                                                           var="userTo"
                                                           itemLabel="#{userTo.name}"
                                                           itemValue="#{userTo.name}"/>
                                        </p:selectOneMenu> 

                                    </h:panelGroup>

                                </h:panelGroup>
                            </div>
                            <div class="ui-g-12 ui-md-6">
                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel style="width: 80px;margin-right: 4%;" value="الي مستخدم"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:selectOneMenu style="width: 35%" 
                                                         filter="true" 
                                                         filterMatchMode="startsWith"
                                                         converter="#{CashAccountSettlementMB.isagUserConverter}"
                                                         value="#{CashAccountSettlementMB.cashAccountSettlementSearchBean.isagUserTo}" > 
                                            <f:selectItem itemLabel="#{userData.userDDs['CHOOSE']}"  itemValue="" />
                                            <f:selectItems value="#{CashAccountSettlementMB.users}"  
                                                           var="userFrom"
                                                           itemLabel="#{userFrom.name}"
                                                           itemValue="#{userFrom.name}"/>
                                        </p:selectOneMenu> 
                                    </h:panelGroup>

                                </h:panelGroup>
                            </div>

                            <div class="ui-g-12 ui-md-6" style="margin-top: 5px;">
                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel style="width:80px;margin-right: 4%;" value="نوع الحركه"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:selectOneMenu style="width:35%;" id="transactionType" filter="true" filterMatchMode="startsWith" 
                                                         value="#{CashAccountSettlementMB.cashAccountSettlementSearchBean.transactionType}"  >
                                            <f:selectItem itemLabel="#{userData.userDDs['CHOOSE']}"  itemValue="" />
                                            <f:selectItem itemLabel="رصيد افتتاحي"  itemValue="0" />
                                            <f:selectItem itemLabel="سند صرف"  itemValue="1" />
                                            <f:selectItem itemLabel="سند قبض"  itemValue="2" />
                                            <f:selectItem itemLabel="تحويل صادر"  itemValue="3" />
                                            <f:selectItem itemLabel="تحويل وارد"  itemValue="4" />
                                            <f:selectItem itemLabel="فاتورة مشتريات"  itemValue="5" />
                                            <f:selectItem itemLabel="فاتورة مبيعات"  itemValue="6" />
                                            <f:selectItem itemLabel="مردود مشتريات"  itemValue="7" />
                                            <f:selectItem itemLabel="مردود مبيعات"  itemValue="8" />
                                        </p:selectOneMenu>
                                    </h:panelGroup>

                                </h:panelGroup>
                            </div>
                            <div class="ui-g-12 ui-md-6">
                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel style="width:80px;margin-right: 4%;" value="غلق الفتره"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:selectBooleanCheckbox value="#{CashAccountSettlementMB.cashAccountSettlementSearchBean.sessionClose}"  >
                                            <p:ajax  event="change" listener="#{CashAccountSettlementMB.checkClosePeriodBank()}" process="@this"/>
                                        </p:selectBooleanCheckbox>
                                        <p:outputLabel style="width:80px;margin-right: 4%;" value="رقم الملف "/>
                                        <p:outputLabel id="documenSerial" style="width: 81px;margin-right: 3%;" value="#{CashAccountSettlementMB.cashAccountSettlementSearchBean.documentSerial}"/>
                                    </h:panelGroup>

                                </h:panelGroup>
                            </div>
                             <div class="ui-g-12 ui-md-6">
                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel  style="width:74px;margin-right: 4%;" value="من رقم كشف"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:inputNumber id="documentSerialFrom" 
                                                       value="#{CashAccountSettlementMB.cashAccountSettlementSearchBean.fromDocumentSerial}"  
                                                       style="width:35%"  
                                                       >
                                        </p:inputNumber>
                                    </h:panelGroup>
                                </h:panelGroup>
                            </div>
                               <div class="ui-g-12 ui-md-6">
                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel  style="width:74px;margin-right: 4%;" value="الي رقم كشف"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:inputNumber id="documentSerialTo" 
                                                       value="#{CashAccountSettlementMB.cashAccountSettlementSearchBean.toDocumentSerial}"  
                                                       style="width:35%"  
                                                       >
                                        </p:inputNumber>
                                    </h:panelGroup>
                                </h:panelGroup>
                            </div>
                            <div class="ui-g-12 ui-md-6">

                                <h:panelGroup>
                                    <p:fieldset legend="#{userData.userDDs['SORT_BY']}" style="margin-bottom:20px;margin-right: 15px;">
                                        <p:selectOneRadio  value="#{CashAccountSettlementMB.cashAccountSettlementSearchBean.orderBy}" >                                                             
                                            <f:selectItem    itemLabel="#{userData.userDDs['DATEE']}"  itemValue="0"  />
                                            <f:selectItem itemLabel="#{userData.userDDs['AMOUNT']}"  itemValue="1"  />
                                            <f:selectItem itemLabel="رقم السند"  itemValue="2"  />
                                        </p:selectOneRadio>  
                                    </p:fieldset>
                                </h:panelGroup>

                            </div>
                            <div class="ui-g-12 ui-md-6">

                                <h:panelGroup>
                                    <p:fieldset legend="#{userData.userDDs['DATA_PRESENTATION']}" style="margin-bottom:20px;margin-right: 5px;">
                                        <p:selectOneRadio value="#{CashAccountSettlementMB.cashAccountSettlementSearchBean.type}" >                                                             
                                            <f:selectItem itemLabel="#{userData.userDDs['ALL']}"  itemValue="3"  />
                                            <f:selectItem itemLabel="#{userData.userDDs['IMPORT']}"  itemValue="1"  />
                                            <f:selectItem itemLabel="#{userData.userDDs['EXPORT']}"  itemValue="0"  />

                                            <!--<p:ajax update="cashAccount" listener="#\{CashAccountSettlementMB.search()}" />-->

                                        </p:selectOneRadio>  
                                    </p:fieldset>
                                </h:panelGroup>
                            </div>
                        </div>
                    </div>

                </p:fieldset>

                <p:fieldset  style=" margin: 10px 0">

                    <h:panelGrid class="col-md-12 centerButtons" columns="12">

                        <h:panelGroup>


                            <p:commandButton class="searchButtons"
                                             style="color: #fff!important;background-color: #9813e4e6;margin-left: 5px" 
                                             id="searchS"
                                             value="#{userData.userDDs['SEARCH']}"
                                             action="#{CashAccountSettlementMB.search()}" 
                                             update="cashAccount documenSerial"
                                             />

                            <p:commandButton  class="newButtons"  style="color: #fff!important;background-color:#035C70 !important;margin-left: 5px"
                                              value="#{userData.userDDs['NEW']}" 
                                              action="#{CashAccountSettlementMB.reset}"
                                              id="newN"
                                              update="form cashAccount" />
                            <p:commandButton   class="printButtons" 
                                               style="color: #fff!important;background-color: #3800ffd6;margin-left: 5px" 
                                               ajax="false" 
                                               onclick="form.target = '_blank'" 
                                               value="#{userData.userDDs['PRINT']}"
                                               actionListener="#{CashAccountSettlementMB.exportPDF}"/>
                            <h:commandLink class="sdcreenimg">  
                                <p:graphicImage name="/img/excel.jpg" width="24"/>  
                                <p:dataExporter type="xls"
                                                target="cashAccount" 
                                                fileName="#{userData.userDDs['SAFE_ACCOUNT_BANK']}"
                                                postProcessor="#{CashAccountSettlementMB.postProcessXLS}" />  
                            </h:commandLink>

                            <p:blockUI block="form" trigger="searchS  newN" animate="true" >

                                <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                            </p:blockUI> 


                        </h:panelGroup>

                    </h:panelGrid>

                </p:fieldset>

                <p:fieldset>
                    <p:dataTable id="cashAccount" 
                                 draggableColumns="true"

                                 paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {Exporters}"
                                 value="#{CashAccountSettlementMB.cashAccountSettlementReports}"
                                 var="subaccReport"
                                 widgetVar="cashSett"
                                 sortBy="#{subaccReport.bankId}" expandableRowGroups="true"

                                 paginator="true"
                                 rows="20">

                        <f:facet name="header" class="col-md-12">

                            <p:outputPanel>
                                <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large;" />
                                <p:inputText   id="globalFilter"   onkeyup="PF('cashSett').filter()" style='width:16%!important;' />
                            </p:outputPanel>

                        </f:facet>

                        <p:headerRow>
                            <p:column  style="width: 15vh;font-size: 2vh;text-align: center;border-radius: 0px"  >
                                <h:outputText value="#{subaccReport.code}" />
                            </p:column>
                            <p:column colspan="2" style="width: 15vh;font-size: 2vh;text-align: center;border-radius: 0px" >
                                <h:outputText value="#{subaccReport.bankName}" />
                            </p:column>
                            <p:column  style="width: 15vh;font-size: 2vh;text-align: center;border-radius: 0px" >
                                <h:outputText value="#{userData.userDDs['CURRENCY']}" />
                            </p:column>
                            <p:column  style="width: 15vh;font-size: 2vh;text-align: center;border-radius: 0px" >
                                <h:outputText value="#{subaccReport.currencyName}" />
                            </p:column>
                            <p:column  style="width: 15vh;font-size: 2vh;text-align: center;border-radius: 0px"  rendered="#{CashAccountSettlementMB.companyActivity eq 'Installment'}" >
                                <h:outputText value="" />
                            </p:column>           
                            <p:column  style="width: 15vh;font-size: 2vh;text-align: center;border-radius: 0px" colspan="3" >
                                <h:outputText value="#{userData.userDDs['START_BALANCE']}" rendered="#{subaccReport.openingBalance gt 0}" />
                            </p:column>
                            <p:column  style="width: 15vh;font-size: 2vh;text-align: center;border-radius: 0px" >
                                <h:outputText value="#{subaccReport.startBalance}" />
                            </p:column>
                            <p:column  style="width: 15vh;font-size: 2vh;text-align: center;border-radius: 0px" >
                                <h:outputText value=""  />
                            </p:column>

                        </p:headerRow>
                        <p:column style="width:10vh ;text-align: center;font-size:1.8vh;border-radius: 0px"
                                  filterBy="#{subaccReport.date}"  filterMatchMode="contains" sortBy="#{subaccReport.date}" filterable="false"
                                  headerText="#{userData.userDDs['DATEE']}">
                            <h:outputText value="#{subaccReport.date}">
                                <f:convertDateTime id="datee"  pattern="dd-MM-yyyy"  />
                            </h:outputText>
                        </p:column>

                        <p:column style="width: 10vh;text-align: center;font-size:1.8vh;border-radius: 0px" 
                                  filterBy="#{subaccReport.serial}"  filterMatchMode="contains" sortBy="#{subaccReport.serial}" filterable="false"
                                  headerText="#{userData.userDDs['DOCUMENT_NUMBER']}">
                            <h:outputText value="#{subaccReport.serial}" style="font-size: 12px"/>
                        </p:column>                     
                        <p:column  style="width: 10vh;text-align: center;font-size:1.8vh;border-radius: 0px" 
                                   filterBy="#{subaccReport.documentSerial}"  filterMatchMode="contains" sortBy="#{subaccReport.documentSerial}" filterable="false"
                                   headerText="رقم الفتره"   >
                            <h:outputText value="#{subaccReport.documentSerial}" style="font-size: 12px"/>
                        </p:column>   

                        <p:column style="width: 10vh;text-align: center;font-size:1.8vh;border-radius: 0px" 
                                  filterBy="#{subaccReport.transactionType}"  filterMatchMode="contains" sortBy="#{subaccReport.transactionType}" filterable="false"
                                  headerText="#{userData.userDDs['MOVMENT_TYPE']}">
                            <h:outputText value="#{subaccReport.transactionType}" style="font-size: 12px"/>
                        </p:column>                     
                        <p:column  style="width: 10vh;text-align: center;font-size:1.8vh;border-radius: 0px" 
                                   filterBy="#{subaccReport.contractSerial}"  filterMatchMode="contains" sortBy="#{subaccReport.contractSerial}" filterable="false"
                                   headerText="رقم العقد"  rendered="#{CashAccountSettlementMB.companyActivity eq 'Installment'}" 
                                   >
                            <h:outputText value="#{subaccReport.contractSerial}" style="font-size: 12px"/>
                        </p:column>    
                        <p:column style="width:11vh; text-align: center;font-size:15px;border-radius: 0px"
                                  filterBy="#{subaccReport.remark2}"  filterMatchMode="contains" sortBy="#{subaccReport.remark2}" filterable="false"
                                  headerText="#{userData.userDDs['HANDLING']}">
                            <h:outputText value="#{subaccReport.remark2}" style="font-size: 12px"/>
                        </p:column>

                        <p:column style="width:14vh; text-align: center;font-size:15px;border-radius: 0px"
                                  filterBy="#{subaccReport.remark}"  filterMatchMode="contains" sortBy="#{subaccReport.remark}" filterable="false"
                                  headerText="#{userData.userDDs['STATEMENT']}">
                            <h:outputText value="#{subaccReport.remark}" style="font-size: 12px"/>
                        </p:column>


                        <p:column style="width: 10vh;text-align: center;font-size:1.8vh;border-radius: 0px" 
                                  filterBy="#{subaccReport.debitAmount}"  filterMatchMode="contains" sortBy="#{subaccReport.debitAmount}" filterable="false"
                                  headerText="#{userData.userDDs['DEBIT']}">
                            <h:outputText value="#{subaccReport.debitAmount}" style="font-size: 12px"/>
                        </p:column>

                        <p:column style="width: 10vh;text-align: center;font-size:1.8vh;border-radius: 0px" 
                                  filterBy="#{subaccReport.creditAmount}"  filterMatchMode="contains" sortBy="#{subaccReport.creditAmount}" filterable="false"
                                  headerText="#{userData.userDDs['CREDIT']}">
                            <h:outputText value="#{subaccReport.creditAmount}" style="font-size: 12px"/>
                        </p:column>

                        <p:column style="width: 8%;text-align: center;font-size:1.8vh;border-radius: 0px"
                                  filterBy="#{subaccReport.balance}"  filterMatchMode="contains" sortBy="#{subaccReport.balance}" filterable="false"
                                  headerText="#{userData.userDDs['BALANCE']}">
                            <h:outputText value="#{subaccReport.balance}" style="font-size: 12px"/>
                        </p:column>
                        <p:column  style="width: 14vh;font-size: 2vh;text-align: center;border-radius: 0px" 
                                   filterBy="#{subaccReport.balance}"  filterMatchMode="contains" sortBy="#{subaccReport.createdBy}" filterable="false"
                                   headerText="مستخدم">
                            <h:outputText value="#{subaccReport.createdBy}" style="font-size: 12px"/>
                        </p:column>
