<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/newTemplate.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form id="ScreenAddEditForm" dir="#{userData.dir}" class='formmargin'>
            <div >
                <p:messages id="curmsg" autoUpdate="true" showDetail="true" rendered="true" closable="true"/>   
            </div>
            <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                  margin-top: 12%;
                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;"
                                  icon="fa fa-fw fa-home"
                                  title="#{userData.userDDs['HOME']}"
                                  class="smhomeButton" 
                                  action="exit" />  
            </div>
            <p:fieldset legend="الأقسام" style="margin-bottom:20px">
                <h:panelGrid  id="pnl"  class="col-md-12" columns="2" > 

                    <h:panelGroup>
                        <h:panelGroup>
                            <p:outputLabel style="width:65px"  value="أسم القسم" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <p:inputText  style="width: 35%!important"  id="departmentName" a:autofocus="true" value="#{departmentFormMB.departmentDTO.name}" requiredMessage="#{userData.userDDs['REQUIRED']}" >
                                <p:ajax event="keyup" update="msgdepatmentName" />
                            </p:inputText>
                            <p:message id="msgdepatmentName" for="departmentName"  />
                        </h:panelGroup>
                        <h:panelGroup>
                            <p:outputLabel style="width:65px"  value="كود القسم" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <p:inputText  style="width: 35%!important"  id="departmentCode" a:autofocus="true" value="#{departmentFormMB.departmentDTO.code}" requiredMessage="#{userData.userDDs['REQUIRED']}" >
                                <p:ajax event="keyup" update="msgdepartmentCode" />
                            </p:inputText>
                            <p:message id="msgdepartmentCode" for="departmentCode"  />
                        </h:panelGroup>

                    </h:panelGroup>


                </h:panelGrid>

                <h:panelGrid   class="centerButtons col-md-12" columns="1"  style="margin-top: 2%">


                    <h:panelGroup>


                        <p:commandButton   class="saveButton"  
                                           id="saveB" 
                                           title="#{userData.userDDs['SAVE']}"
                                           value="#{userData.userDDs['SAVE']}" 
                                           style=""
                                           action="#{departmentFormMB.save()}" 
                                           update="@form" />

                        <p:commandButton class="newButton" 
                                         title="#{userData.userDDs['NEW']}" 
                                         immediate="true"
                                         value="#{userData.userDDs['NEW']}" 
                                         id="newA"
                                         style=""
                                         update="@form" process="@this"
                                         action="#{departmentFormMB.reset()}"    />

                        <p:commandButton  class="closeButton" 
                                          title="#{userData.userDDs['BACK']}" 
                                          immediate="true"
                                          value="#{userData.userDDs['BACK']}" 
                                          style=""
                                          action="#{departmentFormMB.cancel()}"   />



                    </h:panelGroup>


                </h:panelGrid>




                <p:blockUI block="pnl" trigger="saveB" animate="true" >

                    <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>
                </p:blockUI>
            </p:fieldset>
        </h:form>
    </ui:define>

</ui:composition>
