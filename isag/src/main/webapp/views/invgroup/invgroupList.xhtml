<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form id="invgroupListForm" dir="#{userData.dir}" class='formmargin'>
                         <p:fieldset legend="#{userData.userDDs['ITEMS_GROUP']}" style="margin-bottom:20px">
                <div >
                    <p:messages autoUpdate="true"  id="messages" showDetail="true" closable="true"/>   
                </div>

                <p:dataTable 
                    draggableColumns="true" 
                    draggableRows="true"
                    var="invgroupTable" 
                    widgetVar="iTable"  
                    rowIndexVar="index" 
                    value="#{invGroupListBean.invGroupEntityList}" 
                    rows="#{userData.rowListCount}" 
                    paginator="true" 
                    emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                    id="invgroupListForm">
                    <f:facet name="header">
                        <p:commandButton  class="saddButton" style="float:right" icon="fa fa-plus" title="#{userData.userDDs['ADD']}" action="#{invGroupListBean.goToAdd()}" 
                                          rendered="#{userData.userScreens['invgroup'].add or userData.isAdmin}"/>

                        <p:outputPanel  >
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" a:autofocus="true" onkeyup="PF('iTable').filter()" style="width:150px" />
                        </p:outputPanel>
                    </f:facet>
                    <p:column headerText="#"  style="width: 6vh; text-align: right;font-size:1.8vh;border-radius: 0px" >
                        <p:outputLabel value="#{index + 1}" style="font-size:1.8vh"/>
                    </p:column>
                    <p:column style="text-align: right;font-size: 15px;border-radius: 0px"  filterStyle="display:none" filterBy="#{invgroupTable.code}"  filterMatchMode="contains" headerText="#{userData.userDDs['CS_COD']}" sortBy="#{invgroupTable.code}">
                        <p:outputLabel value="#{invgroupTable.code}" />
                    </p:column>
                    <p:column style="text-align: right;font-size: 15px;border-radius: 0px"  filterStyle="display:none" filterBy="#{invgroupTable.name}"  filterMatchMode="contains" headerText="#{userData.userDDs['NAME']}" sortBy="#{invgroupTable.name}">
                        <p:outputLabel value="#{invgroupTable.name}" />
                    </p:column>
                    <p:column style="text-align: right;font-size: 15px;border-radius: 0px"  filterStyle="display:none" filterBy="#{invgroupTable.parentName}"  filterMatchMode="contains" headerText="#{userData.userDDs['MAIN_GROP']}" sortBy="#{invgroupTable.parentName}" >
                        <p:outputLabel value="#{invgroupTable.parentName}" />
                    </p:column>
                    <p:column style="width:16vh;text-align: center;font-size: 15px;border-radius: 0px"  headerText="#{userData.userDDs['TRANSACTION']}">
                        <p:commandButton update="@form" icon="fa fa-fw fa-edit"
                                         class="seditButtons" 
                                         
                                         title="#{userData.userDDs['EDIT']}" action="#{invGroupListBean.goToEdit()}"
                                         rendered="#{userData.userScreens['invgroup'].edit or userData.isAdmin}">
                            <f:setPropertyActionListener value="#{invgroupTable.id}"  target="#{invGroupListBean.invGroupSelected}" />
                        </p:commandButton>
                        <p:commandButton  class="sdeleteButtons" update="@form" icon="fa fa-remove" 
                                          title="#{userData.userDDs['DELETE']}"  action="#{invGroupListBean.delete()}" 
                                          rendered="#{userData.userScreens['invgroup'].delete or userData.isAdmin}">
                            <f:setPropertyActionListener value="#{invgroupTable.id}" target="#{invGroupListBean.invGroupSelected}" />
                            <p:confirm header="Confirmation" message="#{userData.userDDs['ARE_YOU_SURE']}" icon="ui-icon-alert" />
                        </p:commandButton>

                    </p:column>
                </p:dataTable>
                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                    <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                    <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                </p:confirmDialog>

            </p:fieldset>
        </h:form>
    </ui:define>
</ui:composition>
