<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <h:form class='formmargin' id="form"  enctype="multipart/form-data"  dir="#{userData.dir}">

            <p:fieldset legend="#{userData.userDDs['ITEMS_TYPES']}" style="margin-bottom:20px">

                <p:messages autoUpdate="true" id="messages" showDetail="true" closable="true"/> 


                <div class="ui-g-6 ui-xl-6">
                    <div class="ui-g-12 ui-xl-12">  

                        <div class="ui-g-6 ui-xl-6">
                            <p:inputText required="true" requiredMessage="#{userData.userDDs['CO_MUST_BE_ADD']}" style="width: 48%" id="id" value="#{invGroupFormBean.invGroupEntity.code}" />
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 92px;margin-right: 4%;" value="#{userData.userDDs['GROP_COD']}"/>
                        </div>
                    </div>
                    
                </div>
                <div class="ui-g-6 ui-xl-6">
                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <p:inputText   style="width: 48%!important" id="name" a:autofocus="true" value="#{invGroupFormBean.invGroupEntity.name}" />
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width:95px;margin-right: 4%;" value="#{userData.userDDs['NAME']}"/>
                        </div>
                    </div>
                    
                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <p:autoComplete style="width:38%" id="Cost_Center_From" 
                                            dropdown="true"
                                            converter="#{invGroupFormBean.invGroupConverter}"
                                            value="#{invGroupFormBean.invGroupEntity.invGroupParentId}"

                                            var="group"
                                            itemLabel="#{group}" 
                                            itemValue="#{group}" 
                                            forceSelection="true" 
                                            completeMethod="#{invGroupFormBean.completeInvGroups}" >
                            </p:autoComplete>
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel  style="width:108px;margin-right: 2%;" value="#{userData.userDDs['MAIN_GROP']}"/>
                        </div>
                    </div>
                </div>



                       


            </p:fieldset>
              <div id="buttunss" class="asmaa">

                        <p:commandButton   class="saveButton" 
                                           id="saveB" 
                                           title="#{userData.userDDs['SAVE']}"
                                           value="#{userData.userDDs['SAVE']}" 
                                           action="#{invGroupFormBean.save()}" 
                                           update="@form"/>

                        <p:commandButton  class="newButton" 
                                          id="newN"
                                          ajax="false"
                                          value="#{userData.userDDs['NEW']}" 
                                          title="#{userData.userDDs['NEW']}" 
                                          onclick="form.target = ''" 
                                          actionListener="#{invGroupFormBean.reset()}"/>


                        <p:commandButton  class="closeButton"
                                          title="#{userData.userDDs['BACK']}" 
                                          immediate="true"
                                          value="#{userData.userDDs['CANCEL']}"
                                          action="#{invGroupFormBean.exit()}"   />


                    <p:blockUI block="" trigger="saveB" animate="true" >

                        <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                    </p:blockUI> 

                         </div>

        </h:form>

    </ui:define>
</ui:composition>
