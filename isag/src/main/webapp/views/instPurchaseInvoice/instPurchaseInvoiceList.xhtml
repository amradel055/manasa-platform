<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form id="form" dir="#{userData.dir}" style="margin-right: 20px">
            <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                  margin-top: 12%;
                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;"
                                  icon="fa fa-fw fa-home"
                                  title="#{userData.userDDs['HOME']}"
                                  class="smhomeButton" 
                                  action="exit" />
            </div>
            <p:fieldset  legend="شاشه " id="whole"  style="margin-bottom:20px">
                <div class="col-xs-12">
                    <p:messages id="curmsg" showDetail="true" rendered="true" closable="true"/>   
                </div>
                <div>
                    <p:dataTable 
                        draggableColumns="true" 
                        widgetVar="instPurchaseInvoice"
                        var="instPurchaseInvoice"
                        value="#{instPurchaseInvoiceListMB.dataModel}" 
                        rowIndexVar="index"  
                        emptyMessage="#{userData.userDDs['EMPTY_TABLE']}" 
                        style="padding: 0px 5px"
                        lazy="true" 
                        rows="10"
                        paginator="true"
                        paginatorTemplate="{CurrentPageReport} {FirstPageLink}
                        {PreviousPageLink} {PageLinks} {NextPageLink}
                        {LastPageLink} {RowsPerPageDropdown}" 
                        >
                        <f:facet name="header" >
                            <p:commandButton title="#{userData.userDDs['ADD']}"   class="saddButton" 
                                             id="b2" icon="fa fa-fw fa-plus" action="#{instPurchaseInvoiceListMB.goToAdd()}"
                                             style="float:right;margin: 0" 
                                             rendered="#{userData.userScreens['instPurchaseInvoice'].add or userData.isAdmin}"  />
                            <p:outputPanel  >
                                <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                                <p:inputText id="globalFilter" a:autofocus="true" onkeyup="PF('instPurchaseInvoice').filter()" style="width:150px" />
                            </p:outputPanel>
                        </f:facet>
                        <p:column headerText="#" style="width: 6vh;font-size: 1.8vh;text-align: right;border-radius: 0px" >
                            <h:outputText value="#{index + 1}" style="font-size: 1.5vh;"  />
                        </p:column>

                        <p:column filterStyle="display:none" style="width: 40vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px" sortBy="#{instPurchaseInvoice.serial}" filterBy="#{instPurchaseInvoice.serial}"  filterMatchMode="contains" headerText="رقم المستند" >
                            <h:outputText value="#{instPurchaseInvoice.serial}"    style="font-size: 1.5vh; text-align: center;"  />
                        </p:column>

                        <p:column filterStyle="display:none" style="width: 10vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px" sortBy="#{instPurchaseInvoice.date}" filterBy="#{instPurchaseInvoice.date}"  filterMatchMode="contains" headerText="تاريخ" >
                            <h:outputText value="#{instPurchaseInvoice.date}" style="font-size: 1.5vh;"  >
                                <f:convertDateTime type="date" pattern="dd/MM/yyyy"/>
                            </h:outputText>
                        </p:column>


                        <p:column headerText="#{userData.userDDs['TRANSACTION']}" style="width: 10vh;font-size: 1.8vh;text-align: center;border-radius: 0px" >

                            <p:commandButton  class="seditButtons" update="form" 
                                              title="#{userData.userDDs['EDIT']}" 
                                              action="#{instPurchaseInvoiceListMB.goToEdit()}" 
                                              icon="fa fa-fw fa-edit" style="background-color: #6a6967;border-radius: 3px;"
                                              rendered="#{userData.userScreens['instPurchaseInvoice'].edit or userData.isAdmin}">
                                <f:setPropertyActionListener value="#{instPurchaseInvoice}" target="#{instPurchaseInvoiceListMB.instPurchaseInvoiceDTOSelected}" />

                            </p:commandButton>

                            <p:commandButton  class="scloseButtons" update="@form"
                                              title="#{userData.userDDs['DELETE']}" 
                                              action="#{instPurchaseInvoiceListMB.delete()}" 
                                              icon="fa fa-fw fa-remove"  style="background-color: red;border-radius: 3px;"
                                              rendered="#{userData.userScreens['instPurchaseInvoice'].delete or userData.isAdmin}">
                                <f:setPropertyActionListener value="#{instPurchaseInvoice}" target="#{instPurchaseInvoiceListMB.instPurchaseInvoiceDTOSelected}" />
                                <p:confirm header="#{userData.userDDs['COFIGRATION']}" message="#{userData.userDDs['ARE_YOU_SURE']}" icon="ui-icon-alert" />
                            </p:commandButton>



                        </p:column>
                    </p:dataTable>
                </div>
            </p:fieldset>
            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
            </p:confirmDialog>

        </h:form>
    </ui:define>
</ui:composition>
