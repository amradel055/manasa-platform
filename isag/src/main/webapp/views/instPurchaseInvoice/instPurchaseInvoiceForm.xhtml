<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form style="margin-right: 20px"  id="form" dir="#{userData.dir}">
            <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                  margin-top: 12%;
                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;"
                                  icon="fa fa-fw fa-home"
                                  title="#{userData.userDDs['HOME']}"
                                  class="smhomeButton" 
                                  action="exit" />  
            </div>
            <p:fieldset legend="شاشة " id="whole" style="margin-bottom:20px">

                <div class="col-xs-12">
                    <p:messages id="msg" showDetail="true" rendered="true" closable="true"/>   
                </div>


                <div  id="firstSegment" class="ui-g-12 ui-g-nopad">
                    <div class="ui-g">
                        <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:calendar  style="width:49%!important"  id="date" 
                                                 value="#{instPurchaseInvoiceFormMB.instPurchaseInvoiceDTO.date}"
                                                 pattern="dd/MM/yyyy" >
                                    </p:calendar>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 50px" value="تاريخ"/>

                                </div>
                            </div>
                        </div>

                        <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText style="width: 50%" readonly="true" value="#{instPurchaseInvoiceFormMB.instPurchaseInvoiceDTO.serial}"/>

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 100px" value="رقم المستند"/>

                                </div>
                            </div>
                        </div>


                    </div>
                </div>

                         <div id="buttunss" class="asmaa">

                        <p:commandButton  class="saveButton" id="save" 
                                          title="#{userData.userDDs['SAVE']}" 
                                          value="#{userData.userDDs['SAVE']}" 
                                          action="#{instPurchaseInvoiceFormMB.save()}"
                                          update="@form"
                                          />

                        <p:commandButton   class="newButton"
                                           id="newN"
                                           value="#{userData.userDDs['NEW']}" action="#{instPurchaseInvoiceFormMB.reset()}" update="@form" />




                        <p:commandButton    class="printButtons"  
                                            ajax="false" onclick="form.target = '_blank'" 
                                            actionListener="#{instPurchaseInvoiceFormMB.exportPDF}" 
                                            value="طباعة"
                                            />
                        
                        <p:commandButton   class="closeButton"
                                                 
                                            style="" 
                                            title="#{userData.userDDs['BACK']}"
                                            action="exit"
                                            value="#{userData.userDDs['BACK']}"/>

                         </div>

            </p:fieldset>
            <p:fieldset >
                <p:dataTable id="instPurchaseInvoiceDetailsTable"
                             var="instPurchaseInvoiceDetailsTable"
                             dir="#{userData.dir}" 
                             emptyMessage="#{userData.userDDs['EMPTY_TABLE']}" 
                             widgetVar="instPurchaseInvoiceDetailsTable"
                             rowKey="#{instPurchaseInvoiceDetailsTable}"
                             value="#{instPurchaseInvoiceFormMB.instPurchaseInvoiceDetailDTOList}" 
                             rowIndexVar="index" 
                             paginator="true" 
                             selection="#{instPurchaseInvoiceFormMB.instPurchaseInvoiceDetailDTOSelected}"
                             selectionMode="single" 
                             sortBy="#{1}"
                             >

                    <p:ajax  event="rowSelect"   listener="#{instPurchaseInvoiceFormMB.onRowSelect}"  update="instPurchaseInvoiceDetailsTable"/>

                    <f:facet name="header" class="col-md-12">
                        <p:commandButton   class="saddButton" id="addnew"
                                           icon="fa fa-plus"
                                           title="#{userData.userDDs['ADD']}" 
                                           actionListener="#{instPurchaseInvoiceFormMB.addNewDetail()}" 
                                           update=":form:msg instPurchaseInvoiceDetailsTable"                                         
                                           ajax="true"
                                           style="float:right"/>
                        <p:outputPanel>
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" onkeyup="PF('instPurchaseInvoiceDetailsTable').filter()" style="width:150px" />
                        </p:outputPanel>
                    </f:facet>
                    <p:column headerText="#" style="width: 6vh;font-size: 1.8vh;text-align: right;border-radius: 0px" >
                        <h:outputText value="#{index + 1}" style="font-size: 1.5vh;"  /> 
                    </p:column>

                    <p:column filterStyle="display:none" style="width: 17vh;font-size: 1.8vh;text-align: right;border-radius: 0px" 
                              sortBy="#{instPurchaseInvoiceDetailsTable.itemId}" filterBy="#{instPurchaseInvoiceDetailsTable.itemId}" 
                              filterMatchMode="contains" headerText="السلعه"  >     
                        <p:autoComplete
                            style="width:100%!important" 
                            converter="#{instPurchaseInvoiceFormMB.invItemInstProjectGuideViewDTOConverter}"
                            completeMethod="#{instPurchaseInvoiceFormMB.completeInvItemInstProjectGuideViewDTO}"
                            value="#{instPurchaseInvoiceDetailsTable.itemId}"
                            var="item"
                            itemLabel="#{item}" 
                            itemValue="#{item}"
                            rendered="#{instPurchaseInvoiceDetailsTable.markEdit}" 
                            forceSelection="true" 

                            />

                        <h:outputText value="#{instPurchaseInvoiceDetailsTable.itemId.name}"     rendered="#{not instPurchaseInvoiceDetailsTable.markEdit}" />
                    </p:column>
                    <p:column filterStyle="display:none" style="width: 17vh;font-size: 1.8vh;text-align: right;border-radius: 0px" sortBy="#{instPurchaseInvoiceDetailsTable.quantity}" filterBy="#{instPurchaseInvoiceDetailsTable.quantity}"  filterMatchMode="contains"  headerText="الكميه" >
                        <h:outputText value="#{instPurchaseInvoiceDetailsTable.quantity}"  rendered="#{not instPurchaseInvoiceDetailsTable.markEdit}" />
                        <p:inputNumber value="#{instPurchaseInvoiceDetailsTable.quantity}" rendered="#{instPurchaseInvoiceDetailsTable.markEdit}">
                            <p:ajax event="blur" 
                                    listener="#{instPurchaseInvoiceFormMB.updateValueTotal()}"
                                    update="quantity total amount"
                                    />
                        </p:inputNumber>
                    </p:column>
                    <p:column  filterStyle="display:none" style="width: 17vh;font-size: 1.8vh;text-align: right;border-radius: 0px" sortBy="#{instPurchaseInvoiceDetailsTable.unitPrice}" filterBy="#{instPurchaseInvoiceDetailsTable.unitPrice}"  filterMatchMode="contains"  headerText="سعر الوحده" >
                        <p:inputNumber value="#{instPurchaseInvoiceDetailsTable.unitPrice}" rendered="#{instPurchaseInvoiceDetailsTable.markEdit}">
                            <p:ajax event="blur" 
                                    listener="#{instPurchaseInvoiceFormMB.updateValueTotal()}"
                                    update="total amount"   
                                    />
                        </p:inputNumber> 
                        <h:outputText value="#{instPurchaseInvoiceDetailsTable.unitPrice}" rendered="#{not instPurchaseInvoiceDetailsTable.markEdit}"  />
                    </p:column>
                    <p:column filterStyle="display:none" style="width: 17vh;font-size: 1.8vh;text-align: right;border-radius: 0px"  sortBy="#{instPurchaseInvoiceDetailsTable.total}" filterBy="#{instPurchaseInvoiceDetailsTable.total}"  filterMatchMode="contains" headerText="الإجمالي" >
                        <h:outputText id="amount" value="#{instPurchaseInvoiceDetailsTable.total}"   /> 
                    </p:column>
                    <p:column style="width: 10vh;font-size: 1.8vh;text-align: center;border-radius: 0px"  headerText="#{userData.userDDs['TRANSACTION']}">

                        <p:commandButton  class="saddButtons" id="addnew2"
                                          icon="fa fa-plus"
                                          title="#{userData.userDDs['ADD']}" 
                                          actionListener="#{instPurchaseInvoiceFormMB.addNewDetail()}" 
                                          update=":form:msg instPurchaseInvoiceDetailsTable"        
                                          style="float:right;background-color: rgb(42, 163, 218);border-radius: 3px;"
                                          ajax="true"/>

                        <p:commandButton   class="sdeleteButtons" update="instPurchaseInvoiceDetailsTable"
                                           title="#{userData.userDDs['DELETE']}"  style="background-color: red;border-radius: 3px;"
                                           action="#{instPurchaseInvoiceFormMB.deleteDetail}"
                                           icon="fa fa-remove" >
                            <f:setPropertyActionListener value="#{instPurchaseInvoiceDetailsTable}" target="#{instPurchaseInvoiceFormMB.instPurchaseInvoiceDetailDTOSelected}" />
                            <p:confirm header="#{userData.userDDs['COFIGRATION']}" message="#{userData.userDDs['ARE_YOU_SURE']}" icon="ui-icon-alert" />
                        </p:commandButton>
                    </p:column >
                    <p:summaryRow>
                        <p:column  style="border-radius: 0px" colspan="2" >
                            <h:outputText  value="#{userData.userDDs['TOTAL']}"/>
                        </p:column>
                        <p:column style="border-radius: 0px"  > 
                            <h:outputText id="quantity" value="#{instPurchaseInvoiceFormMB.quantityDetailValue}"/>
                        </p:column>
                        <p:column style="border-radius: 0px"  > 
                            <h:outputText value=""/>
                        </p:column>
                        <p:column style="border-radius: 0px" >
                            <h:outputText id="total" value="#{instPurchaseInvoiceFormMB.totalDetailValue}"/>
                        </p:column>
                        <p:column style="border-radius: 0px"  > 
                            <h:outputText value=""/>
                        </p:column>
                    </p:summaryRow>
                </p:dataTable>
            </p:fieldset>
            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
            </p:confirmDialog>
        </h:form>
    </ui:define>
</ui:composition>
