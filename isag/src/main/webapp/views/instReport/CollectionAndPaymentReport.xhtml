<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />

        


        <h:form  id="form" dir="#{userData.dir}"  class='formmargin'>
            <p:fieldset legend="#{userData.userDDs['COLL_PAY_REP']}"> 


                <div class="ui-g-12 ui-g-nopad  firstset" id="firstSegment" >
                    <div class="ui-g">
                        <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:selectOneMenu style="width:50%;"  filter="true" filterMatchMode="contains"   value="#{collectionAndPaymentReportMB.collectionAndPaymentReportSearchBean.status}" >

                                        <f:selectItem itemLabel="#{userData.userDDs['CHOOSE']}" />
                                        <f:selectItem itemLabel="#{userData.userDDs['NOT_PAID']}"  itemValue="0" />
                                        <f:selectItem itemLabel="#{userData.userDDs['PAID']}"  itemValue="1" />
                                        <f:selectItem itemLabel="#{userData.userDDs['PAID_PART']}"  itemValue="2" />                               
                                    </p:selectOneMenu>

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 65px;" value="#{userData.userDDs['INSTALL_CASE']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:calendar pattern="dd/MM/yyyy" 
                                                value="#{collectionAndPaymentReportMB.collectionAndPaymentReportSearchBean.toDate}"
                                                style="width: 50%">

                                    </p:calendar>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel  style="width: 60px" value="#{userData.userDDs['TO_DATE']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:calendar pattern="dd/MM/yyyy" 
                                                value="#{collectionAndPaymentReportMB.collectionAndPaymentReportSearchBean.fromDate}"
                                                style="width: 50%">

                                    </p:calendar>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel  style="width: 60px;" value="#{userData.userDDs['FROM_DATE']}"/>

                                </div>
                            </div>
                        </div>

                        <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:autoComplete style="width:40%!important" 

                                                    dropdown="true"
                                                    converter="#{collectionAndPaymentReportMB.instProjectGuideConverter}"
                                                    value="#{collectionAndPaymentReportMB.collectionAndPaymentReportSearchBean.projectGuideTo}"
                                                    var="projectGuideName"
                                                    itemLabel="#{projectGuideName}" 
                                                    itemValue="#{projectGuideName}"
                                                    forceSelection="true" 
                                                    completeMethod="#{collectionAndPaymentReportMB.completProjectGuide}">
                                    </p:autoComplete>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 65px" value="#{userData.userDDs['TO_PROJECT']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:autoComplete style="width:40%!important" 

                                                    dropdown="true"
                                                    converter="#{collectionAndPaymentReportMB.instProjectGuideConverter}"
                                                    value="#{collectionAndPaymentReportMB.collectionAndPaymentReportSearchBean.projectGuideFrom}"
                                                    var="projectGuideName"
                                                    itemLabel="#{projectGuideName}" 
                                                    itemValue="#{projectGuideName}"
                                                    forceSelection="true" 
                                                    completeMethod="#{collectionAndPaymentReportMB.completProjectGuide}">
                                    </p:autoComplete>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 65px;" value="#{userData.userDDs['FROM_PROJECT']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:autoComplete style="width:40%!important" 

                                                    dropdown="true"
                                                    converter="#{collectionAndPaymentReportMB.invOrgSiteConverter}"
                                                    value="#{collectionAndPaymentReportMB.collectionAndPaymentReportSearchBean.orgNameTo}"
                                                    var="orgName"
                                                    itemLabel="#{orgName}" 
                                                    itemValue="#{orgName}"
                                                    forceSelection="true" 
                                                    completeMethod="#{collectionAndPaymentReportMB.completOrgSite}">
                                    </p:autoComplete>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 65px" value="#{userData.userDDs['TO_CUSTOM']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:autoComplete style="width:40%!important" 

                                                    dropdown="true"
                                                    converter="#{collectionAndPaymentReportMB.invOrgSiteConverter}"
                                                    value="#{collectionAndPaymentReportMB.collectionAndPaymentReportSearchBean.orgNameFrom}"
                                                    var="orgName"
                                                    itemLabel="#{orgName}" 
                                                    itemValue="#{orgName}"
                                                    forceSelection="true" 
                                                    completeMethod="#{collectionAndPaymentReportMB.completOrgSite}">
                                    </p:autoComplete>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 65px;" value="#{userData.userDDs['FROM_CUSTOM']}"/>

                                </div>
                            </div>
                        </div>
                    </div>





                </div>
                

                            <div id="buttunss" class="asmaa">

                        <p:commandButton     class="searchButtons"
                                             title="#{userData.userDDs['SEARCH']}"
                                             action="#{collectionAndPaymentReportMB.search()}"
                                             id="saveB"
                                             value="#{userData.userDDs['SEARCH']}"
                                             update="@form" 
/>

                        <p:commandButton    class="newButtons"
                                            title="#{userData.userDDs['NEW']}" 
                                            immediate="true" 
                                            action="#{collectionAndPaymentReportMB.reset()}"
                                            update="form"
                                            value="#{userData.userDDs['NEW']}"
                                            resetValues="true"
                                            id="NewB"/>

                        <p:commandButton    class="printButtons"
                                            ajax="false"
                                            onclick="form.target = '_blank'"  
                                            value="#{userData.userDDs['PRINT']}" 
                                            actionListener="#{collectionAndPaymentReportMB.exportPDF}"
                                            title="#{userData.userDDs['PRINT']}"
                                            immediate="true" 
                                            id="PrintB"/>

                        <p:commandButton    class="closeButtons"
                                            title="#{userData.userDDs['CANCEL']}"
                                            action="exit"
                                            value="#{userData.userDDs['BACK']}"
                                            id="CloseB"/>
                        <h:commandLink  class="sdcreenimg" style="margin-right: 4px;">   
                            <p:graphicImage name="/img/excel.jpg" width="24;"/>  
                            <p:dataExporter type="xls"
                                            target="CollectionAndPaymentEntity" 
                                            fileName="تقرير التحصيلات والسداد"
                                            postProcessor="#{collectionAndPaymentReportMB.postProcessXLS}" />  
                        </h:commandLink>

                        <p:blockUI block="form" trigger="saveB NewB PrintB CloseB" animate="true" >

                            <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                        </p:blockUI> 

                        </div>
            </p:fieldset>

            <p:fieldset id="reportDB" style="margin-top: 2%">


                <p:dataTable id="CollectionAndPaymentEntity"
                             draggableColumns="true" 
                             rows="20"
                             paginator="true"
                             value="#{collectionAndPaymentReportMB.collectionAndPaymentReportEntityList}" 
                             var="CollectionAndPaymentReportEntity" 
                             sortBy="#{CollectionAndPaymentReportEntity.progId}" expandableRowGroups="true">  
                    <f:facet name="header" class="col-md-12">

                        <p:outputPanel>
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" onkeyup="PF('bTable').filter()" style="width:150px" />

                        </p:outputPanel>
                    </f:facet>

                    <p:headerRow>
                        <p:column colspan="2" style="width: 15vh;font-size: 2vh;border-radius: 0px;" >
                            <h:outputText value="#{CollectionAndPaymentReportEntity.progId}" />
                        </p:column>
                        <p:column colspan="3" style="width: 15vh;font-size: 2vh;border-radius: 0px;" >
                            <h:outputText value="#{CollectionAndPaymentReportEntity.progName}" />
                        </p:column>
                        <p:column colspan="5"/>
                    </p:headerRow>
                    <p:column style="width:1vh;border-radius: 0px;">
                        <p:rowToggler />
                    </p:column>

                    <p:column  style="width: 7vh;text-align: center;font-size: 1.6vh;border-radius: 0px;" headerText="#{userData.userDDs['SERIAL']}">
                        <h:outputText value="#{CollectionAndPaymentReportEntity.serial}"  style="text-align: center;"/>
                    </p:column>
                    <p:column  style=" width: 8vh;text-align: center;font-size: 1.6vh;border-radius: 0px;" headerText="#{userData.userDDs['CUSTOMER']}"  

                               sortBy="#{CollectionAndPaymentReportEntity.orgName}"
                               filterBy="#{CollectionAndPaymentReportEntity.orgName}" 
                               filterMatchMode="contains"
                               filterable="false" >

                        <h:outputText value="#{CollectionAndPaymentReportEntity.orgName}"  style="text-align: center;"/>
                    </p:column>

                    <p:column style="width: 10vh;text-align: center;font-size:1.6vh;border-radius: 0px;" 
                              headerText="#{userData.userDDs['DUE_DATE']}"

                              sortBy="#{CollectionAndPaymentReportEntity.dueDate}"
                              filterBy="#{CollectionAndPaymentReportEntity.dueDate}" 
                              filterMatchMode="contains"
                              filterable="false" >

                        <p:outputLabel value="#{CollectionAndPaymentReportEntity.dueDate}">
                            <f:convertDateTime type="date" pattern="dd-MM-yyyy"/>
                        </p:outputLabel>
                    </p:column>
                    <p:column style="width: 9vh;text-align: center;font-size: 1.6vh;border-radius: 0px;" 
                              headerText="#{userData.userDDs['PAYMENT_DATE']}"

                              sortBy="#{CollectionAndPaymentReportEntity.paymentDate}"
                              filterBy="#{CollectionAndPaymentReportEntity.paymentDate}" 
                              filterMatchMode="contains"
                              filterable="false" >

                        <p:outputLabel value="#{CollectionAndPaymentReportEntity.paymentDate}">
                            <f:convertDateTime type="date" pattern="dd-MM-yyyy"/>
                        </p:outputLabel>
                    </p:column>


                    <p:column  style="width:8vh;font-size: 1.6vh;text-align: -webkit-auto;border-radius: 0px;" 
                               headerText="#{userData.userDDs['PHONE']}"

                               sortBy="#{CollectionAndPaymentReportEntity.phone}"
                               filterBy="#{CollectionAndPaymentReportEntity.phone}" 
                               filterMatchMode="contains"
                               filterable="false" >

                        <h:outputText value="#{CollectionAndPaymentReportEntity.phone}"
                                      style="font-size: 1.4vh; width: 80vh"/>
                    </p:column>

                    <p:column style="width: 10vh;text-align: center;font-size: 1.6vh;border-radius: 0px;"
                              headerText="#{userData.userDDs['AMOUNT_DUE']}"

                              sortBy="#{CollectionAndPaymentReportEntity.dueamount}"
                              filterBy="#{CollectionAndPaymentReportEntity.dueamount}" 
                              filterMatchMode="contains"
                              filterable="false" >

                        <h:outputText value="#{CollectionAndPaymentReportEntity.dueamount}" 
                                      style="text-align: center;"/>
                    </p:column>

                    <p:column style=" width: 8vh;text-align: center;font-size: 1.6vh;border-radius: 0px;" headerText="#{userData.userDDs['PAID']}"

                              sortBy="#{CollectionAndPaymentReportEntity.payee}"
                              filterBy="#{CollectionAndPaymentReportEntity.payee}" 
                              filterMatchMode="contains"
                              filterable="false" >

                        <h:outputText value="#{CollectionAndPaymentReportEntity.payee}"  style="text-align: center;"/>
                    </p:column>


                    <p:column style="width: 8vh;text-align: center;font-size: 1.6vh;border-radius: 0px;"
                              headerText="#{userData.userDDs['REMAINING']}"

                              sortBy="#{CollectionAndPaymentReportEntity.remain}"
                              filterBy="#{CollectionAndPaymentReportEntity.remain}" 
                              filterMatchMode="contains"
                              filterable="false" >

                        <h:outputText value="#{CollectionAndPaymentReportEntity.remain}"  style="text-align: center;"/>
                    </p:column>


                    <p:column style="width:8vh;text-align: center;font-size: 1.6vh;border-radius: 0px;"
                              headerText="#{userData.userDDs['INSTALL_CASE']}"

                              sortBy="#{CollectionAndPaymentReportEntity.status}"
                              filterBy="#{CollectionAndPaymentReportEntity.status}" 
                              filterMatchMode="contains"
                              filterable="false" >

                        <h:outputText value="#{CollectionAndPaymentReportEntity.status}" 
                                      style="text-align: center;"/>
                    </p:column>

                    <p:rowExpansion>
                        <p:dataTable id="dataTableInside" 

                                     draggableColumns="true" 
                                     value="#{CollectionAndPaymentReportEntity.GLBankEntityList}"
                                     var="GLBankEntityDetail">
                            <p:column style="width:9vh;text-align: center;font-size:1.6vh;border-radius: 0px;" 
                                      headerText="#{userData.userDDs['PAYMENT_DATE']}" 

                                      sortBy="#{GLBankEntityDetail.paymentDate}"
                                      filterBy="#{GLBankEntityDetail.paymentDate}" 
                                      filterMatchMode="contains"
                                      filterable="false" >

                                <p:outputLabel value="#{GLBankEntityDetail.paymentDate}">
                                    <f:convertDateTime type="date" pattern="dd-MM-yyyy"/>
                                </p:outputLabel>
                            </p:column>

                            <p:column style="width: 9v;text-align: center;font-size:1.6vh;border-radius: 0px;"
                                      headerText="#{userData.userDDs['PAID']}"
                                      sortBy="#{GLBankEntityDetail.payee}"
                                      filterBy="#{GLBankEntityDetail.payee}" 
                                      filterMatchMode="contains"
                                      filterable="false" >

                                <h:outputText value="#{GLBankEntityDetail.payee}"  style="text-align: center;"/>
                            </p:column>

                        </p:dataTable>
                    </p:rowExpansion>
                    <p:columnGroup type="footer">
                        <p:row>
                            <p:column colspan="4" style="text-align:right" 
                                      footerText="#{userData.userDDs['TOTAL']}  :" />
                            <p:column style="border-radius: 0px;"/>
                            <p:column style="border-radius: 0px;"/>
                            <p:column footerText="#{collectionAndPaymentReportMB.allAmount}"  style="font-size: 1.4vh;border-radius: 0px;"/>
                            <p:column footerText="#{collectionAndPaymentReportMB.allPayee}" style="font-size: 1.4vh;border-radius: 0px;"/>
                            <p:column footerText="#{collectionAndPaymentReportMB.allRemain}" style="font-size: 1.4vh;border-radius: 0px;"/>

                            <p:column  style="font-size: 1.4vh;border-radius: 0px;" />
                        </p:row>
                    </p:columnGroup>
                </p:dataTable>

            </p:fieldset>
        </h:form>
    </ui:define>
</ui:composition>
