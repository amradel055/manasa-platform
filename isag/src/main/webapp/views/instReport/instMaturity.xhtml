<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />

       

        <h:form class='formmargin'  id="form" dir="#{userData.dir}">
            <p:fieldset legend="#{userData.userDDs['PREMIU_ACCU_PERI']}" id="whole">


                <div class="col-xs-12">
                    <p:messages id="curmsg" showDetail="true" rendered="false" closable="true"/>   
                </div>
                <div class="ui-g-12 ui-g-nopad firstset" id="firstSegment" >
                    <div class="ui-g"    id="firstSegment">

                        <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:calendar pattern="dd/MM/yyyy" 
                                                value="#{instMaturityMB.collectionAndPaymentReportSearchBean.toDate}"
                                                style="width: 50%">

                                    </p:calendar>   
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel  style="width: 70px" value="#{userData.userDDs['TO_DATE']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:autoComplete style="width:40%!important" id="projectTo"
                                                    dropdown="true"
                                                    converter="#{instMaturityMB.instProjectGuideConverter}"
                                                    value="#{instMaturityMB.collectionAndPaymentReportSearchBean.projectGuideTo}"
                                                    var="organization"
                                                    itemLabel="#{organization}" 
                                                    itemValue="#{organization}"
                                                    forceSelection="true" 
                                                    completeMethod="#{instMaturityMB.completeInstProject}"
                                                    >
                                        <p:ajax update="projectFrom"
                                                event="blur" listener="#{instMaturityMB.hishis()}" />
                                    </p:autoComplete>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 75px" value="#{userData.userDDs['TO_PROJECT']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:autoComplete style="width:40%!important" id="projectFrom"
                                                    dropdown="true"
                                                    converter="#{instMaturityMB.instProjectGuideConverter}"
                                                    value="#{instMaturityMB.collectionAndPaymentReportSearchBean.projectGuideFrom}"
                                                    var="organization"
                                                    itemLabel="#{organization}" 
                                                    itemValue="#{organization}"
                                                    forceSelection="true" 
                                                    completeMethod="#{instMaturityMB.completeInstProject}"
                                                    >
                                        <p:ajax update="projectTo"
                                                event="blur" listener="#{instMaturityMB.hishis()}" />
                                    </p:autoComplete>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 75px;" value="#{userData.userDDs['FROM_PROJECT']}"/>

                                </div>
                            </div>
                        </div>                        
                        <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:calendar pattern="dd/MM/yyyy" 
                                                value="#{instMaturityMB.collectionAndPaymentReportSearchBean.fromDate}"
                                                style="width: 50%">

                                    </p:calendar>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel  style="width: 70px;" value="#{userData.userDDs['FROM_DATE']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:autoComplete style="width:40%!important"
                                                    dropdown="true"
                                                    converter="#{instMaturityMB.invOrgSiteFromConverter}"
                                                    value="#{instMaturityMB.collectionAndPaymentReportSearchBean.orgNameTo}"
                                                    var="organization"
                                                    itemLabel="#{organization}" 
                                                    itemValue="#{organization}"
                                                    forceSelection="true" 
                                                    completeMethod="#{instMaturityMB.completOrgSiteFrom}"
                                                    >

                                    </p:autoComplete>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 75px" value="#{userData.userDDs['TO_CUSTOM']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:autoComplete style="width:40%!important"
                                                    dropdown="true"
                                                    converter="#{instMaturityMB.invOrgSiteFromConverter}"
                                                    value="#{instMaturityMB.collectionAndPaymentReportSearchBean.orgNameFrom}"
                                                    widgetVar="organization"
                                                    var="organization"
                                                    itemLabel="#{organization}" 
                                                    itemValue="#{organization}"
                                                    forceSelection="true" 
                                                    completeMethod="#{instMaturityMB.completOrgSiteFrom}"

                                                    >

                                    </p:autoComplete>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 75px;" value="#{userData.userDDs['FROM_CUSTOM']}"/>

                                </div>
                            </div>
                        </div>        





                    </div>
                </div>

                              <div id="buttunss" class="asmaa">


                        <p:commandButton  class="searchButtons"
                                          value="#{userData.userDDs['SEARCH']}" 
                                          action="#{instMaturityMB.search}"
                                          id="searchS"
                                          update="form" />
                        <p:commandButton  class="newButtons"
                                          value="#{userData.userDDs['NEW']}" 
                                          action="#{instMaturityMB.reset}"
                                          id="reset"
                                          update="form" />
                        <p:commandButton  class="printButtons"
                                          ajax="false" onclick="form.target = '_blank'"  
                                          value="#{userData.userDDs['PRINT']} " 
                                          actionListener="#{instMaturityMB.exportPDF}"/>
                        <p:commandButton    class="closeButton"
                                            style=""   
                                            title="#{userData.userDDs['BACK']}"
                                            action="exit"
                                            value="#{userData.userDDs['BACK']}"
                                            id="CloseB"/>

                        <h:commandLink  style="float:left" class="sdcreenimg">  
                            <p:graphicImage name="/img/excel.jpg" width="24" style='margin-right:25%;'/>  
                            <p:dataExporter type="xls"
                                            target="accc" 
                                            fileName="#{userData.userDDs['PREMIU_ACCU_PERI']}"
                                            postProcessor="#{instMaturityMB.postProcessXLS}" />  
                        </h:commandLink>

                        </div>
            </p:fieldset>


            <p:fieldset>

                <p:dataTable id="accc" 
                             rows="20"
                             paginator="true"
                             draggableColumns="true" 
                             value="#{instMaturityMB.instMaturityBeanList}" 
                             var="instMaturity"
                             sortBy="#{instMaturity.projectId}" expandableRowGroups="true">

                    <f:facet name="header" class="col-md-12">

                        <p:outputPanel>
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" onkeyup="PF('bTable').filter()" style="width:150px" />

                        </p:outputPanel>
                    </f:facet>

                    <p:headerRow>
                        <p:column colspan="1" style="width: 15vh;font-size: 2vh;border-radius: 0px;" >
                            <h:outputText value="#{instMaturity.projectId}" />
                        </p:column>
                        <p:column colspan="2" style="width: 15vh;font-size: 2vh;border-radius: 0px;" >
                            <h:outputText value="#{instMaturity.projectName}" />
                        </p:column>
                        <p:column colspan="2"/>
                    </p:headerRow>

                    <p:column style="width: 10vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px;" headerText="#{userData.userDDs['SERIAL']}"

                              sortBy="#{instMaturity.serial}"
                              filterBy="#{instMaturity.serial}" 
                              filterMatchMode="contains"
                              filterable="false" >

                        <h:outputText value="#{instMaturity.serial}" style="font-size: 1.5vh"/>
                    </p:column>
                    <p:column style="width: 10vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px;" headerText="#{userData.userDDs['CUSTOMER']}"

                              sortBy="#{instMaturity.customer}"
                              filterBy="#{instMaturity.customer}" 
                              filterMatchMode="contains"
                              filterable="false" >

                        <h:outputText value="#{instMaturity.customer}" style="font-size: 1.5vh"/>
                    </p:column>

                    <p:column style="width: 20vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px;" headerText="#{userData.userDDs['DATEE']}"

                              sortBy="#{instMaturity.date}"
                              filterBy="#{instMaturity.date}" 
                              filterMatchMode="contains"
                              filterable="false" >

                        <h:outputText value="#{instMaturity.date}" style="font-size: 1.5vh">
                            <f:convertDateTime type="date" pattern="dd-MM-yyyy"/>
                        </h:outputText>
                    </p:column>

                    <p:column style="width: 15vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px;"  headerText="#{userData.userDDs['CONTRACT_CLAUSE']}"

                              sortBy="#{instMaturity.totalValue}"
                              filterBy="#{instMaturity.totalValue}" 
                              filterMatchMode="contains"
                              filterable="false" >

                        <h:outputText value="#{instMaturity.totalValue}"  style="font-size: 1.5vh"/>
                    </p:column>

                    <p:column style="width: 10vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px;" headerText="#{userData.userDDs['INSTALLMENT']}"

                              sortBy="#{instMaturity.installmentValue}"
                              filterBy="#{instMaturity.installmentValue}" 
                              filterMatchMode="contains"
                              filterable="false" >

                        <h:outputText value="#{instMaturity.installmentValue}"  style="font-size: 1.5vh"/>
                    </p:column>

                    <p:columnGroup type="footer">
                        <p:row>
                            <p:column  style="border-radius: 0px;" footerText=""  />
                            <p:column  style="border-radius: 0px;" footerText="" /> 
                            <p:column  style="border-radius: 0px;" footerText="" /> 
                            <p:column  style="border-radius: 0px;" footerText="#{userData.userDDs['TOTAL']} " />
                            <p:column  style="border-radius: 0px;" footerText="#{instMaturityMB.totalValue} " />
                        </p:row>
                    </p:columnGroup>
                </p:dataTable>


            </p:fieldset>


        </h:form>
    </ui:define>
</ui:composition>
