<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <link rel="stylesheet" type="text/css" href="../../resources/css/main.css" />
    <ui:define name="content">
        <div class="col-xs-12">
            <p:messages id="curmsg" showDetail="true" rendered="false" closable="true"/>   
        </div>

        <h:head>
            <title>#{userData.userDDs['PROJ_GUID_REP']}</title>
        </h:head>
        <style>
            .ui-widget-content .ui-state-default, .ui-widget-header .ui-state-default {
                border: 1px solid #c5dbec;
                background:#fff;
            }
        </style>
        <style type="text/css">
            .sell {
                background-color: red !important;
                background-image: none !important;

            }
            .reserved{
                background-color: yellowgreen !important;
                background-image: none !important;
            }
        </style>
        <h:body>
            <!--            <f:event listener="#/{userData.authorize}" type="preRenderView" />-->

            <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                  margin-top: 12%;
                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;"
                                  icon="fa fa-fw fa-home"
                                  title="#{userData.userDDs['HOME']}"
                                  class="smhomeButton" 
                                  action="exit" />
                <p:commandButton  style="z-index: 2;
                                  margin-top: 9%!important;
                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;" 
                                  class="viewButton sminimize"
                                  icon="fa fa-window-minimize"
                                  title="إظهار/إخفاء"/>  
            </div>


            <h:form id="form" class='formmargin' dir="#{userData.dir}">

                <p:fieldset legend="#{userData.userDDs['PROJ_GUID_REP']}">


                    <div class="ui-g-12 ui-g-nopad firstset" id="firstSegment">

                        <div class="ui-g-12 ui-md-12">


                            <div class="ui-g-12 ui-md-6">
                                <h:panelGroup>
                                    <h:panelGroup> 
                                        <p:outputLabel style="width: 105px;margin-right: 6%;" value="البند الفرعي" />
                                    </h:panelGroup>
                                    <p:selectCheckboxMenu id="sub" value="#{projectGuideSellTypeReportMB.projectGuideSearchBean.projectGuideListSelected}"
                                                          converter="#{projectGuideSellTypeReportMB.projectGuideCildDTOConverter}"
                                                          label="البند الفرعي" style="width: 15rem"
                                                          filter="true" filterMatchMode="contains" panelStyle="width: 15rem" scrollHeight="250">
                                        <f:selectItems value="#{projectGuideSellTypeReportMB.projectGuideDTOChildList}"/>
                                    </p:selectCheckboxMenu>
                                </h:panelGroup>
                            </div>


                            <div class="ui-g-12 ui-md-6">
                                <h:panelGroup>
                                    <h:panelGroup> 
                                        <p:outputLabel style="width: 105px;margin-right: 6%;" value="البند الرئيسي" />
                                    </h:panelGroup>
                                    <p:selectCheckboxMenu id="main" value="#{projectGuideSellTypeReportMB.projectGuideDTOParentListSelected}"
                                                          converter="#{projectGuideSellTypeReportMB.projectGuideDTOConverter}"
                                                          label="البند الرئيسي" style="width: 15rem"
                                                          filter="true" filterMatchMode="contains" panelStyle="width: 15rem" scrollHeight="250">
                                        <f:selectItems value="#{projectGuideSellTypeReportMB.projectGuideDTOParentList}"/>
                                        <p:ajax  listener="#{projectGuideSellTypeReportMB.findProjectGuideDTOChildList()}" event="change" update="@form" />
                                    </p:selectCheckboxMenu>
                                </h:panelGroup>
                            </div>

                        </div>
                        <div class="ui-g-12 ui-xl-12">

                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:calendar id="dateFrom" 
                                                value="#{projectGuideSellTypeReportMB.projectGuideSearchBean.startDate}" 
                                                pattern="dd/MM/yyyy" 
                                                style="width:50%" showButtonPanel="true"
                                                >
                                    </p:calendar>        
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel  style="width:75px;" value="من تاريخ"/>

                                </div>
                            </div>

                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:calendar id="dateTo" 
                                                value="#{projectGuideSellTypeReportMB.projectGuideSearchBean.endDate}"
                                                pattern="dd/MM/yyyy" 
                                                style="width:50%" showButtonPanel="true"
                                                >
                                    </p:calendar>        
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel  style="width:75px;" value="إلى تاريخ"/>

                                </div>
                            </div>

                        </div>
                    </div>

                    <h:panelGrid class="col-md-12" columns="1">

                        <h:panelGroup class="centerButtons" style="margin-top: 2%">

                            <p:commandButton  class="searchButtons"
                                              style="color: #fff!important;background-color: #2196F3;margin-left: 5px;" 
                                              value="#{userData.userDDs['SEARCH']}"  id="searchA"
                                              action="#{projectGuideSellTypeReportMB.searchNew()}" update="projectGuideDataTable"  />              

                            <p:commandButton   class="newButton"    style="color: #fff!important;background-color: #9c27b0d1;margin-left: 5px;" id="newB" 
                                               value="#{userData.userDDs['NEW']}" action="#{projectGuideSellTypeReportMB.reset()}" update="@form" />

                            <p:commandButton  class="printButtons"
                                              style="color: #fff!important;background-color: rgb(1, 76, 134);margin-left: 5px;"
                                              ajax="false" onclick="form.target = '_blank'"  value="#{userData.userDDs['PRINT']}"
                                              actionListener="#{projectGuideSellTypeReportMB.exportPDF}"  id="printC"/>
                            <p:commandButton    class="closeButton"
                                                style=""   
                                                title="#{userData.userDDs['BACK']}"
                                                action="exit"
                                                value="#{userData.userDDs['BACK']}"
                                                id="CloseC"/>


                            <h:commandLink class="sdcreenimg" style="margin-right: 4px;">  
                                <p:graphicImage name="/img/excel.jpg" width="24"/>  
                                <p:dataExporter type="xls"
                                                target="projectGuideDataTable" 
                                                fileName="تقرير دليل المشاريع"
                                                postProcessor="#{projectGuideSellTypeReportMB.postProcessXLS}" />  
                            </h:commandLink> 

                        </h:panelGroup>

                        <p:blockUI block="form" trigger="searchA  newB  printC" animate="true" >

                            <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                        </p:blockUI> 

                    </h:panelGrid>




                </p:fieldset>

                <p:fieldset>

                    <p:dataTable 
                        draggableColumns="true" 
                        id="projectGuideDataTable"  
                        value="#{projectGuideSellTypeReportMB.projectGuideBeanList}" 
                        var="projectGuideDTB" 
                        rows="15" 
                        paginator="true"
                        paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}" 
                        rowsPerPageTemplate="10, 20 ,30 , 40 , 50 "
                        rowStyleClass="#{projectGuideDTB.sellType ? 'sell' : projectGuideDTB.reserved ? 'reserved' : null}">>

                        <f:facet name="header" class="col-md-12">

                            <p:outputPanel>
                                <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                                <p:inputText id="globalFilter" 
                                             onkeyup="PF('bTable').filter()" 
                                             style="width:150px" />

                            </p:outputPanel>
                        </f:facet>

                        <p:column style="width: 7vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px;" headerText="#{userData.userDDs['CS_COD']}" 

                                  sortBy="#{projectGuideDTB.code}"
                                  filterBy="#{projectGuideDTB.code}" 
                                  filterMatchMode="contains"
                                  filterable="false" >
                            <h:outputText style="font-size: 1.5vh;" value="#{projectGuideDTB.code}"/>
                        </p:column>

                        <p:column style="width: 20vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px;" headerText="#{userData.userDDs['NAME']}"

                                  sortBy="#{projectGuideDTB.name}"
                                  filterBy="#{projectGuideDTB.name}" 
                                  filterMatchMode="contains"
                                  filterable="false">
                            <h:outputText style="font-size: 1.5vh;"  value="#{projectGuideDTB.name}"/>
                        </p:column>

                        <p:column style="width: 25vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px;"  headerText="#{userData.userDDs['MAIN_PROJ_GUIDE']}"

                                  sortBy="#{projectGuideDTB.parent}"
                                  filterBy="#{projectGuideDTB.parent}" 
                                  filterMatchMode="contains"
                                  filterable="false">
                            <h:outputText style="font-size: 1.5vh;"  value="#{projectGuideDTB.parent}"/>
                        </p:column>

                        <p:column style="width: 8vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px;" headerText="اسم العميل"

                                  sortBy="#{projectGuideDTB.customerName}"
                                  filterBy="#{projectGuideDTB.customerName}" 
                                  filterMatchMode="contains"
                                  filterable="false">

                            <h:outputText style="font-size: 1.5vh;" value="#{projectGuideDTB.customerName}"/>
                        </p:column>
                    </p:dataTable>
                </p:fieldset>

            </h:form>
        </h:body>
    </ui:define>
</ui:composition>
