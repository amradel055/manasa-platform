<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <link rel="stylesheet" type="text/css" href="../../resources/css/main.css" />
    <ui:define name="content">
        <div class="col-xs-12">
            <p:messages id="curmsg" showDetail="true" rendered="false" closable="true"/>   
        </div>

        <h:head>
            <title>#{userData.userDDs['PROJ_GUID_REP']}</title>
        </h:head>
       
        <h:body>
            <f:event listener="#{userData.authorize}" type="preRenderView" />

            


            <h:form id="form" class='formmargin' dir="#{userData.dir}">
                <p:fieldset legend="#{userData.userDDs['PROJ_GUID_REP']}">


                    <div class="ui-g-12 ui-g-nopad firstset" id="firstSegment">
                        <div class="ui-g">
                            <div class="ui-g-6 ui-xl-6">
                                <div class="ui-g-12 ui-xl-12">

                                    <div class="ui-g-6 ui-xl-6">
                                        <p:autoComplete  style="width: 40%!important" id="projectGuideTO" 
                                                         dropdown="true"
                                                         converter="#{projectGuideReportMB.projectGuideConverter}"
                                                         value="#{projectGuideReportMB.projectGuideSearchBean.projectGuideIdTo}"

                                                         var="project"
                                                         itemLabel="#{project}" 
                                                         itemValue="#{project}" 
                                                         forceSelection="true" 
                                                         completeMethod="#{projectGuideReportMB.completeProjectGuide}" >
                                        </p:autoComplete>
                                    </div>
                                    <div class="ui-g-6 ui-xl-6">
                                        <p:outputLabel style="width: 105px" value="#{userData.userDDs['TO_PROJ_GUIDE']}"/>

                                    </div>
                                </div>
                            </div>

                            <div class="ui-g-6 ui-xl-6">
                                <div class="ui-g-12 ui-xl-12">

                                    <div class="ui-g-6 ui-xl-6">
                                        <p:autoComplete  id="projectGuideFrom" 
                                                         dropdown="true"
                                                         converter="#{projectGuideReportMB.projectGuideConverter}"
                                                         value="#{projectGuideReportMB.projectGuideSearchBean.projectGuideIdFrom}"
                                                         style="width: 40%!important"
                                                         var="guide"
                                                         itemLabel="#{guide}" 
                                                         itemValue="#{guide}" 
                                                         forceSelection="true" 
                                                         completeMethod="#{projectGuideReportMB.completeProjectGuide}" >
                                        </p:autoComplete>
                                    </div>
                                    <div class="ui-g-6 ui-xl-6">
                                        <p:outputLabel style="width: 105px;" value="#{userData.userDDs['FROM_PROJ_GUIDE']}" />

                                    </div>
                                </div>
                            </div>





                        </div>

                    </div>

                    <h:panelGrid class="col-md-12" columns="1">

                        <h:panelGroup class="centerButtons" style="margin-top: 2%">

                            <p:commandButton  class="searchButtons"
                                              value="#{userData.userDDs['SEARCH']}"  id="searchA"
                                              action="#{projectGuideReportMB.search()}" update="projectGuideDataTable"  />              

                            <p:commandButton   class="newButtons"    id="newB" 
                                               value="#{userData.userDDs['NEW']}" action="#{projectGuideReportMB.reset()}" update="@form" />

                            <p:commandButton  class="printButtons"
                                              ajax="false" onclick="form.target = '_blank'"  value="#{userData.userDDs['PRINT']}"
                                              actionListener="#{projectGuideReportMB.exportPDF}"  id="printC"/>
                            <p:commandButton    class="closeButton"
                                            style=""   
                                            title="#{userData.userDDs['BACK']}"
                                            action="exit"
                                            value="#{userData.userDDs['BACK']}"
                                            id="CloseC"/>


                            <h:commandLink class="sdcreenimg" style="margin-right: 4px;">  
                                <p:graphicImage name="/img/excel.jpg" width="24"/>  
                                <p:dataExporter type="xls"
                                                target="projectGuideDataTable" 
                                                fileName="تقرير دليل المشاريع"
                                                postProcessor="#{projectGuideReportMB.postProcessXLS}" />  
                            </h:commandLink> 

                        </h:panelGroup>

                        <p:blockUI block="form" trigger="searchA  newB  printC" animate="true" >

                            <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                        </p:blockUI> 

                    </h:panelGrid>




                </p:fieldset>

             
            </h:form>
        </h:body>
    </ui:define>
</ui:composition>
