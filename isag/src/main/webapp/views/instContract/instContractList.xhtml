<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form  dir="#{userData.dir}" class='formmargin'>
            <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                      margin-top: 12%;
                                      color: #035c70!important; 
                                      background-color: #223238!important;
                                      border: 1px solid #22323a!important;
                                      background: #22323a 50% 50% repeat-x!important;"
                                      icon="fa fa-fw fa-home"
                                      title="#{userData.userDDs['HOME']}"
                                      class="smhomeButton" 
                                      action="exit" />
        </div>
            <p:fieldset legend="#{userData.userDDs['INSTALL_SCREEN']}">
                <div class="col-xs-12">
                    <p:messages id="curmsg" showDetail="true" rendered="true" closable="true"/>   
                </div>
               
                <div>
                    <p:dataTable id="instContactTable"
                                 
                                 draggableColumns="true" draggableRows="true"
                                 var="instContactTable"
                                 widgetVar="bTable"  
                                 rowIndexVar="index" 
                                 value="#{instContactListMB.dataModel}"
                                 lazy="true" 
                                 rows="10"
                                 paginator="true"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink}
                                 {PreviousPageLink} {PageLinks} {NextPageLink}
                                 {LastPageLink} {RowsPerPageDropdown}"
                                 emptyMessage="#{userData.userDDs['EMPTY_TABLE']}" >

                        <f:facet name="header" class="col-md-12">
                            <p:commandButton  class="saddButton" icon="fa fa-plus" title="#{userData.userDDs['ADD']}" action="#{instContactListMB.goToAdd()}" style="float:right"/>

                            <p:outputPanel  >
                                <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                                <p:inputText id="globalFilter" onkeyup="PF('bTable').filter()" style="width:150px" />
                            </p:outputPanel>
                        </f:facet>
                        
                        <p:column style="width: 8vh;text-align: center;font-size: 1.8vh;border-radius: 0px;" 
                                  filterStyle="display:none"
                                  filterBy="#{instContactTable.serial}" 
                                  filterMatchMode="contains"
                                  headerText="رقم العقد" 
                                  sortBy="#{instContactTable.serial}" 
                                  >
                            <p:outputLabel value="#{instContactTable.serial}" />
                        </p:column>

                        <p:column style="width: 15vh;text-align: center;font-size: 1.8vh;border-radius: 0px;"
                                  filterStyle="display:none"
                                  filterBy="#{instContactTable.totalValue}" 
                                  filterMatchMode="contains"
                                  headerText="#{userData.userDDs['TOTAL_AMOUNT']}" 
                                  sortBy="#{instContactTable.totalValue}" 
                                  >
                            <p:outputLabel value="#{instContactTable.totalValue}" />
                        </p:column>


                        <p:column style="width: 10vh;text-align: center;font-size: 1.8vh;border-radius: 0px;"
                                  filterStyle="display:none"
                                  filterBy="#{instContactTable.date}" 
                                  filterMatchMode="contains"
                                  headerText="#{userData.userDDs['DATEE']}" 
                                  sortBy="#{instContactTable.date}" 
                                  >
                            <p:outputLabel value="#{instContactTable.date}" >
                                <f:convertDateTime type="date" pattern="dd-MM-yyyy"/>
                            </p:outputLabel>
                        </p:column>
                        <p:column style="width: 10vh;text-align: center;font-size: 1.8vh;border-radius: 0px;"
                                  filterStyle="display:none"
                                  filterBy="#{instContactTable.startInstallment}" 
                                  filterMatchMode="contains"
                                  headerText="#{userData.userDDs['INIT_INSTALLMENT']}" 
                                  sortBy="#{instContactTable.startInstallment}" 
                                  >
                            <p:outputLabel value="#{instContactTable.startInstallment}" >
                                <f:convertDateTime type="date" pattern="dd-MM-yyyy"/>
                            </p:outputLabel>
                        </p:column>


                        <p:column style="width: 9vh;text-align: center;font-size: 1.8vh;border-radius: 0px;"
                                  filterStyle="display:none"
                                  filterBy="#{instContactTable.installmentNumber}" 
                                  filterMatchMode="contains"
                                  headerText="#{userData.userDDs['NO_INSTALLMENT']}" 
                                  sortBy="#{instContactTable.installmentNumber}" 
                                  >
                            <p:outputLabel value="#{instContactTable.installmentNumber}" />
                        </p:column>


                        <p:column style="width: 15vh;text-align: center;font-size: 1.8vh;border-radius: 0px;"
                                  filterStyle="display:none"
                                  filterBy="#{instContactTable.customerName}" 
                                  filterMatchMode="contains"
                                  headerText="#{userData.userDDs['FROM_CUSTOM']}" 
                                  sortBy="#{instContactTable.customerName}" 
                                  >
                            <p:outputLabel value="#{instContactTable.customerName}" />
                        </p:column>


                        <p:column style="width: 12vh;text-align: center;font-size: 1.8vh;border-radius: 0px;"
                                  filterStyle="display:none"
                                  filterBy="#{instContactTable.installmentValue}" 
                                  filterMatchMode="contains"
                                  headerText="#{userData.userDDs['INSTALLMENT_AMOUNT']}" 
                                  sortBy="#{instContactTable.installmentValue}" 
                                  >
                            <p:outputLabel value="#{instContactTable.installmentValue}" />
                        </p:column>

                        <p:column style="width: 12vh;text-align: center;font-size: 1.8vh;border-radius: 0px;"
                                  filterStyle="display:none"
                                  filterBy="#{instContactTable.advancePayment}" 
                                  filterMatchMode="contains"
                                  headerText="#{userData.userDDs['ADVANCE_PAY']}" 
                                  sortBy="#{instContactTable.advancePayment}" 
                                  >
                            <p:outputLabel value="#{instContactTable.advancePayment}" />
                        </p:column>


                        <p:column style="width: 15vh;text-align: center;font-size: 1.8vh;border-radius: 0px;"
                                  headerText="#{userData.userDDs['TRANSACTION']}" >
                            <p:commandButton class="seditButtonss" update="@form"
                                             icon="fa fa-fw fa-edit" style="background-color: #6a6967;border-radius: 3px;margin-bottom:3px"
                                             title="#{userData.userDDs['EDIT']}" 
                                             action="#{instContactListMB.goToEdit()}" 
                                             >
                                <f:setPropertyActionListener value="#{instContactTable.id}" 
                                                             target="#{instContactListMB.instContractEntityIdSelected}" />
                            </p:commandButton>
                             
                               <p:commandButton 
                                    class="sprintButtons"
                                    update="@form" onclick="form.target = '_blank'"  ajax="false"
                                    icon="fa fa-fw fa-print" style="background-color: rgb(1, 76, 134)!important;border-radius: 3px;"
                                    title="print" 
                                    actionListener="#{instContractFormMBnew.exportPDFFromList(instContactTable.id)}" 
                                    rendered="#{userData.userScreens['instContract'].edit or userData.isAdmin }">
                                </p:commandButton>
                            <p:commandButton  class="sdeleteButtons" update="@form" icon="fa fa-remove" title="#{userData.userDDs['DELETE']}" style="background-color: red;border-radius: 3px;margin-bottom:3px"  action="#{instContactListMB.delete}" disabled="#{instContactTable.disabled}">
                                <f:setPropertyActionListener value="#{instContactTable}" target="#{instContactListMB.instContractEntitySelected}" />
                                <p:confirm header="Confirmation" message="#{userData.userDDs['ARE_YOU_SURE']}" icon="ui-icon-alert" />
                            </p:commandButton>
                        </p:column>

                    </p:dataTable> 
                    <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                        <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                        <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                    </p:confirmDialog>
                </div>
            </p:fieldset>
        </h:form>
    </ui:define>
</ui:composition>
