<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <h:form id="form"  dir="#{userData.dir}" class='formmargin'>
            <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                  margin-top: 24%;
                                  color: #035c70!important; 
                                  background-color: #223238!important; 
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;"
                                  icon="fa fa-fw fa-home"
                                  title="#{userData.userDDs['HOME']}"
                                  class="smhomeButton" 
                                  action="exit" />
            </div>
            <div class="col-xs-12">
                <p:messages id="curmsg" showDetail="true" rendered="true" closable="true"/>   
            </div>




            <p:dataTable id="invInvoicePurchaseTable"
                         var="invInvoicePurchaseTable" 
                         widgetVar="bTable" 
                         rowIndexVar="index" 
                         value="#{shortageReport.reportsList}"
                         paginator="true"
                         rows="10" 
                         lazy="true" 
                         paginatorTemplate="{CurrentPageReport} {FirstPageLink}
                         {PreviousPageLink} {PageLinks} {NextPageLink}
                         {LastPageLink} {RowsPerPageDropdown}" 
                         emptyMessage="#{userData.userDDs['EMPTY_TABLE']}" 
                         >
                <f:facet name="header">


                    <p:outputPanel>
                        <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                        <p:inputText id="globalFilter" onkeyup="PF('bTable').filter()" style="width:150px" />
                    </p:outputPanel>

                </f:facet>
                <p:column  style="width: 10vh;font-size: 1.6vh;border-radius: 0px;"  filterStyle="display:none" 
                           filterBy="#{index +1}" 
                           filterMatchMode="contains" 
                           headerText="#"
                           sortBy="#{index +1}" >
                    <p:outputLabel value="#{index +1}" />
                </p:column>

                <p:column  style="width: 10vh;font-size: 1.6vh;border-radius: 0px;"  filterStyle="display:none" 
                           filterBy="#{invInvoicePurchaseTable.quantity}" 
                           filterMatchMode="contains" 
                           headerText="كمية الصنف في المخزن  "
                           sortBy="#{invInvoicePurchaseTable.quantity}" >
                    <p:outputLabel value="#{invInvoicePurchaseTable.quantity}" />
                </p:column>
                <p:column  style="width: 10vh;font-size: 1.6vh;border-radius: 0px;"  filterStyle="display:none" 
                           filterBy="#{invInvoicePurchaseTable.high}" 
                           filterMatchMode="contains" 
                           headerText="أعلي كمية للصنف   "
                           sortBy="#{invInvoicePurchaseTable.high}" >
                    <p:outputLabel value="#{invInvoicePurchaseTable.high}" />
                </p:column>
                <p:column  style="width: 10vh;font-size: 1.6vh;border-radius: 0px;"  filterStyle="display:none" 
                           filterBy="#{invInvoicePurchaseTable.low}" 
                           filterMatchMode="contains" 
                           headerText=" اقل كمية للصنف  "
                           sortBy="#{invInvoicePurchaseTable.low}" >
                    <p:outputLabel value="#{invInvoicePurchaseTable.low}" >
                    </p:outputLabel>

                </p:column>
                <p:column  style="width: 10vh;font-size: 1.6vh;border-radius: 0px;"  filterStyle="display:none" 
                           filterBy="#{invInvoicePurchaseTable.different}" 
                           filterMatchMode="contains" 
                           headerText="العجز "
                           sortBy="#{invInvoicePurchaseTable.different}" >
                    <p:outputLabel value="#{invInvoicePurchaseTable.different}" />
                </p:column>





            </p:dataTable> 

        </h:form>
    </ui:define>
</ui:composition>
