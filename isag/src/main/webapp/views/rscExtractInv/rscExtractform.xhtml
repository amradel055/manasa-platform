<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">

        <h:form  dir="#{userData.dir}" class='formmargin' id="form">
            <p:fieldset id="extract" legend="المستخلص" style="font-size: 17px !important;">
                <div class="col-xs-12">
                    <p:messages id="curmsg" showDetail="true" rendered="true" closable="true"/>   
                </div>
                <div class="ui-g-12 ui-g-nopad">

                    <div class="ui-g">

                        <div class="ui-g-6 ui-xl-6">

                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:autoComplete style="width: 34%!important"  id="supplier"
                                                    dropdown="true"
                                                    scrollHeight="350"
                                                    value="#{rscExtractFormMB.extractRegisterDTO.siteId}"
                                                    converter="#{rscExtractFormMB.contractorConverter}"
                                                    var="supplier"
                                                    itemLabel="#{supplier}" 
                                                    itemValue="#{supplier}" 
                                                    forceSelection="true" 
                                                    completeMethod="#{rscExtractFormMB.completeSupplierAndContractorTo}"
                                                    rendered="#{not rscExtractFormMB.idLoaded and rscRestrictionQuantitiesFormMB.organizationType eq 1}"
                                                    disabled="#{rscExtractFormMB.extractRegisterDTO.postFlag eq 1}" 
                                                    >

                                    </p:autoComplete>
                                    <p:outputLabel class="tender-pricing-title-Q"  
                                                   rendered="#{rscExtractFormMB.idLoaded}"
                                                   style="width: 97px; ;" value="#{rscExtractFormMB.extractRegisterDTO.siteId}"/>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel value="مورد / مقاول" />
                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:autoComplete style="width:34%!important" maxResults="10"
                                                    dropdown="true" 
                                                    value="#{rscExtractFormMB.extractRegisterDTO.customerId}" 
                                                    converter="#{rscExtractFormMB.customerConverter}"
                                                    completeMethod="#{rscExtractFormMB.completeInvOrganizationSite}"
                                                    var="customer"
                                                    itemLabel="#{customer}" 
                                                    itemValue="#{customer}" 
                                                    forceSelection="true" 
                                                    rendered="#{not rscExtractFormMB.idLoaded}"
                                                    disabled="#{rscExtractFormMB.extractRegisterDTO.postFlag eq 1}" 
                                                    >

                                    </p:autoComplete>
                                    <p:outputLabel class="tender-pricing-title-Q" 
                                                   rendered="#{rscExtractFormMB.idLoaded}"
                                                   value="#{rscExtractFormMB.extractRegisterDTO.customerId}"/>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel class="tender-pricing-title-Q" value="#{userData.userDDs['CUSTOMER']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:calendar  pattern="dd/MM/yyyy" style="width: 50%" disabled="#{rscExtractFormMB.extractRegisterDTO.postFlag eq 1}"  id="date" value="#{rscExtractFormMB.extractRegisterDTO.date}"   
                                                 />
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 112px; " value="#{userData.userDDs['TEXT_DATE']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText disabled="#{rscExtractFormMB.extractRegisterDTO.postFlag eq 1}"  style="width: 35%" value="#{rscExtractFormMB.extractRegisterDTO.docNumber}"/>

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 115px; " value="#{userData.userDDs['DOCUM_NO']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText style="width: 35%" readonly="true" value="#{rscExtractFormMB.extractRegisterDTO.serial}"/>

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel  style="width: 115px; " value="رقم المستخلص"/>

                                </div>
                            </div>
                        </div>

                        <div class="ui-g-6 ui-xl-6">

                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText   style="width: 68%" disabled="#{rscExtractFormMB.extractRegisterDTO.postFlag eq 1}"  value="#{rscExtractFormMB.extractRegisterDTO.remarks}"/>

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 112px; margin-right: 2.5%;"  value="#{userData.userDDs['STATEMENT']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputNumber  style="width: 35%"  disabled="#{rscExtractFormMB.extractRegisterDTO.postFlag eq 1}"  value="#{rscExtractFormMB.extractRegisterDTO.percentage}">
                                        <p:ajax update="form:totalDetailExtract form:totalAccural form:totalDeductions form:NetExtract" event="blur" listener="#{rscExtractFormMB.calculateExtractValues()}"/>
                                    </p:inputNumber>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 112px; " value="#{userData.userDDs['PERCENTAGE']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:autoComplete style="width:34%!important"
                                                    dropdown="true"
                                                    converter="#{rscExtractFormMB.instProjectGuideDTOConverter}"
                                                    value="#{rscExtractFormMB.extractRegisterDTO.instProjectGuideDTO}"
                                                    var="organization"
                                                    itemLabel="#{organization}" 
                                                    itemValue="#{organization}"
                                                    forceSelection="true" 
                                                    maxResults="10"
                                                    completeMethod="#{rscExtractFormMB.completeInstProjectDTOAllWithOutLevel}"
                                                    rendered="#{not rscExtractFormMB.idLoaded}"
                                                    disabled="#{rscExtractFormMB.extractRegisterDTO.postFlag eq 1}" 
                                                    >  
                                    </p:autoComplete>
                                    <p:outputLabel rendered="#{rscExtractFormMB.idLoaded}" class="tender-pricing-title-Q" value="#{rscExtractFormMB.extractRegisterDTO.instProjectGuideDTO}"/>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel class="tender-pricing-title-Q" value="المشروع"/>

                                </div>
                            </div>
                        </div>


                    </div>
                </div>

            </p:fieldset>

            <p:fieldset id="data" style=" margin-top: 2%">


                <p:tabView id="tabsBar1">
                    <p:tab id="tab11" title="تفاصيل المستخلص" >

                        <p:dataTable id="detail"
                                     style="margin-bottom:20px"
                                     editable="true"
                                     editMode="cell"
                                     selectionMode="single"
                                     sortBy="#{1}"
                                     draggableColumns="true"
                                     var="detail"
                                     dir="rtl" 
                                     rows="#{userData.rowListCount}"
                                     rowKey="#{detail}"
                                     rowIndexVar="index" 
                                     paginator="true"
                                     emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                                     widgetVar="detail"
                                     selection="#{rscExtractFormMB.rscExtractRegisterDetailDTOSelected}"
                                     value="#{rscExtractFormMB.extractRegisterDTO.rscExtractRegisterDetailDTOList}" 
                                     >



                            <f:facet name="header" class="col-md-12">
                                <p:commandButton   class="saddButton" id="addnew1"
                                                   icon="fa fa-plus"
                                                   title="#{userData.userDDs['ADD']}" 
                                                   actionListener="#{rscExtractFormMB.addChildDetail()}" 
                                                   update="form"                                         
                                                   ajax="true"
                                                   style="float:right"
                                                   disabled="#{rscExtractFormMB.extractRegisterDTO.postFlag eq 1}" />
                                <p:outputPanel>
                                    <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                                    <p:inputText id="globalFilter" onkeyup="PF('detail').filter()" style="width:150px" />
                                </p:outputPanel>
                            </f:facet>
                            <p:column style="width: 20vh;text-align: -webkit-auto;border-radius: 0px" id="itemName" headerText="البند" 
                                      filterBy="#{detail.guideDTO}" 
                                      filterMatchMode="contains" 
                                      sortBy="#{detail.guideDTO}"
                                      filterable="false">
                                <p:autoComplete id="itemNameIn" class="itemName1" 
                                                style="width:95%"
                                                converter="#{rscExtractFormMB.rscWorkUnitsGuideDTOConverter}"
                                                value="#{detail.guideDTO}"
                                                var="item"
                                                itemLabel="#{item}" 
                                                itemValue="#{item}" 
                                                forceSelection="true"  
                                                completeMethod="#{rscExtractFormMB.completeWorkUnitsGuideDTO}"
                                                rendered="#{not rscExtractFormMB.idLoaded}"
                                                disabled="#{rscExtractFormMB.extractRegisterDTO.postFlag eq 1}" >
                                    <p:ajax update="code unitName   excuteQty  total form:NetExtract form:totalDetailExtract" listener="#{rscExtractFormMB.validateUnitGuide()}"
                                            event="itemSelect"  />
                                    <p:ajax update="code unitName   excuteQty  total form:NetExtract form:totalDetailExtract" listener="#{rscExtractFormMB.validateUnitGuide()}"
                                            event="change"  />

                                </p:autoComplete>
                                <p:outputLabel rendered="#{rscExtractFormMB.idLoaded}" class="tender-pricing-title-Q" value="#{detail.guideDTO}"/>
                            </p:column>
                            <p:column style="width: 10vh;font-size: 1.8vh;text-align: right;border-radius: 0px" headerText="الكود" >
                                <p:outputLabel  id="code" value="#{detail.guideDTO.code}"/>
                            </p:column>
                            <p:column style="width: 9vh;font-size: 1.8vh;text-align: right;border-radius: 0px" headerText="#{userData.userDDs['UNIT']}" >
                                <p:outputLabel  id="unitName" value="#{detail.guideDTO.unitName.name}"/>
                            </p:column> 
                            <p:column style="width: 10vh;font-size: 1.8vh;text-align: right;border-radius: 0px" headerText="الكمية المنفذه" >
                                <p:inputNumber rendered="#{not rscExtractFormMB.staticText}" decimalPlaces="3"
                                               id="excuteQty" value="#{detail.excuteQty}"
                                               disabled="#{rscExtractFormMB.extractRegisterDTO.postFlag eq 1}" >
                                    <p:ajax  event="blur" listener="#{rscExtractFormMB.calculateExtractDetailValues(detail)}"
                                             update=" total    form:NetExtract form:totalDetailExtract" />
                                </p:inputNumber> 
                            </p:column>
                            <p:column style="width: 10vh;font-size: 1.8vh;text-align: right;border-radius: 0px" headerText="سعر البيع" >
                                <p:inputNumber  id="sellPrice" value="#{detail.priceSell}"
                                                disabled="#{rscExtractFormMB.extractRegisterDTO.postFlag eq 1}" >
                                    <p:ajax  event="blur" listener="#{rscExtractFormMB.calculateExtractDetailValues(detail)}"
                                             update=" total    form:NetExtract form:totalDetailExtract" />
                                </p:inputNumber>
                            </p:column> 
                            <p:column style="width: 10vh;font-size: 1.8vh;text-align: right;border-radius: 0px" headerText="الاجمالى" >
                                <p:outputLabel  id="total" value="#{detail.currentValue}"/>
                            </p:column>
                            <p:column style="width: 10vh;font-size: 1.8vh;text-align: right;border-radius: 0px" headerText="خصم قيمة" >
                                <p:inputText  id="discountVal" value="#{detail.discountValue}"
                                              disabled="#{rscExtractFormMB.extractRegisterDTO.postFlag eq 1}" >
                                    <p:ajax  event="blur" listener="#{rscExtractFormMB.calculateExtractDetailValues(detail)}"
                                             update="discountPer total net totalDetailNet form:NetExtract form:totalDetailExtract" />
                                    <p:ajax  event="blur" listener="#{rscExtractFormMB.calculateExtractDetailValues(detail)}"
                                             update="discountPer total net totalDetailNet form:NetExtract form:totalDetailExtract" />
                                </p:inputText> 
                            </p:column>
                            <p:column style="width: 10vh;font-size: 1.8vh;text-align: right;border-radius: 0px" headerText="خصم نسبة" > 
                                <p:inputText  id="discountPer" value="#{detail.discountPercentage}"
                                              disabled="#{rscExtractFormMB.extractRegisterDTO.postFlag eq 1}" >
                                    <p:ajax  event="blur" listener="#{rscExtractFormMB.calculateExtractDetailPercentage(detail)}"
                                             update="discountVal total net totalDetailNet form:NetExtract form:totalDetailExtract" />
                                    <p:ajax  event="blur" listener="#{rscExtractFormMB.calculateExtractDetailPercentage(detail)}"
                                             update="discountVal total net totalDetailNet form:NetExtract form:totalDetailExtract" />
                                </p:inputText> 
                            </p:column>
                            <p:column style="width: 17vh;font-size: 1.8vh;text-align: right;border-radius: 0px" headerText="صافى بند المستخلص " >
                                <p:outputLabel  id="net" value="#{detail.netCost}">

                                </p:outputLabel>
                            </p:column>
                            <p:column style="width: 50vh;font-size: 1.8vh;text-align: right;border-radius: 0px" headerText="الملاحظات" >
                                <p:inputText  id="remark" value="#{detail.remarks}" style="width: 100% !important;"
                                              disabled="#{rscExtractFormMB.extractRegisterDTO.postFlag eq 1}" />
                            </p:column>
                            <p:summaryRow>
                                <p:column colspan="17" style="text-align:right;border-radius: 0px">
                                    <h:outputText style="text-align:right" value="#{userData.userDDs['TOTAL']}  :" />
                                </p:column>

                                <p:column style="border-radius: 0px">
                                    <h:outputText id="totalDetailNet" value="#{rscExtractFormMB.extractRegisterDTO.totalDetailNet}"/>
                                </p:column>
                                <p:column style="border-radius: 0px"/>
                                <p:column style="border-radius: 0px"/>
                            </p:summaryRow>

                            <p:column style="width: 12vh;font-size: 1.8vh;text-align: center;border-radius: 0px"  headerText="#{userData.userDDs['TRANSACTION']}"
                                      rendered="#{!rscExtractFormMB.extractRegisterDTO.closed}">

                                <p:commandButton  class="saddButtons" id="addnew2"
                                                  icon="fa fa-plus" style="border-radius: 3px;float:right"
                                                  title="#{userData.userDDs['ADD']}" 
                                                  actionListener="#{rscExtractFormMB.addChildDetail()}" 
                                                  update="detail"                                         
                                                  ajax="true"
                                                  disabled="#{rscExtractFormMB.extractRegisterDTO.postFlag eq 1}" 
                                                  />

                                <p:commandButton  class="sdeleteButtons" update="detail form:NetExtract  form:totalDeductions form:totalAccural form:totalDetailExtract "
                                                  title="#{userData.userDDs['DELETE']}" 
                                                  action="#{rscExtractFormMB.deleteRscExtractDetail()}"
                                                  icon="fa fa-remove" disabled="#{rscExtractFormMB.extractRegisterDTO.postFlag eq 1}"  >

                                    <f:setPropertyActionListener value="#{detail}"
                                                                 target="#{rscExtractFormMB.rscExtractRegisterDetailDTOSelected}"/>
                                    <p:confirm header="#{userData.userDDs['COFIGRATION']}" 
                                               message="#{userData.userDDs['ARE_YOU_SURE']}"
                                               icon="ui-icon-alert" />
                                </p:commandButton>

                                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                                    <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                                    <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                                </p:confirmDialog>
                            </p:column >
                        </p:dataTable>
                    </p:tab>
                    <p:tab id="tab2" title="الاستحقاقات"   >
                        <p:dataTable id="rscextractaccrual"
                                     style="margin-bottom:20px"
                                     editable="true"
                                     editMode="cell"
                                     selectionMode="single"
                                     sortBy="#{1}"

                                     draggableColumns="true"
                                     var="rscextractaccrual"
                                     dir="rtl" 
                                     rows="#{userData.rowListCount}"
                                     rowKey="#{rscextractaccrual}"
                                     rowIndexVar="index" 
                                     paginator="true"
                                     emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                                     widgetVar="rscextractaccrual"
                                     selection="#{rscExtractFormMB.rscExtractAccrualDTOSelected}"
                                     value="#{rscExtractFormMB.extractRegisterDTO.rscExtractAccuralList}" >


                            <f:facet name="header" class="col-md-12">
                                <p:commandButton   class="saddButton" id="addnew3"
                                                   icon="fa fa-plus"
                                                   title="#{userData.userDDs['ADD']}" 
                                                   actionListener="#{rscExtractFormMB.addChildAccrual()}" 
                                                   update="form"                                         
                                                   ajax="true"
                                                   style="float:right"/>
                                <p:outputPanel>
                                    <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                                    <p:inputText id="globalFilter" onkeyup="PF('rscextractaccrual').filter()" style="width:150px" />
                                </p:outputPanel>
                            </f:facet>
                            <p:column style="width: 10vh;text-align: -webkit-auto;border-radius: 0px" id="rscaccrual" headerText="الاستحقاق" 
                                      filterBy="#{rscextractaccrual.rscAccrualDeductionDTO}" 
                                      filterMatchMode="contains" 
                                      sortBy="#{rscextractaccrual.rscAccrualDeductionDTO}"
                                      filterable="false">
                                <p:autoComplete id="rscaccrualId"  
                                                style="width:95%"
                                                converter="#{rscExtractFormMB.rscAccuralConverter}"
                                                value="#{rscextractaccrual.rscAccrualDeductionDTO}"
                                                var="accrual"
                                                itemLabel="#{accrual}" 
                                                itemValue="#{accrual}" 
                                                forceSelection="true"  
                                                completeMethod="#{rscExtractFormMB.completeAccural}" >
                                    <p:ajax update="value" listener="#{rscExtractFormMB.validateAccrual()}"
                                            event="itemSelect"  />
                                    <p:ajax update="value" listener="#{rscExtractFormMB.validateAccrual()}"
                                            event="change"  />

                                </p:autoComplete>            
                            </p:column>
                            <p:column style="width: 17vh;font-size: 1.8vh;text-align: right;border-radius: 0px" headerText="القيمة" >
                                <p:inputText  id="value" value="#{rscextractaccrual.rscAccuralDeductionValue}">
                                    <p:ajax event="blur"  listener="#{rscExtractFormMB.calculateAccrualPercentage()}"
                                            update="@form" />
                                    <p:ajax event="blur"  listener="#{rscExtractFormMB.allUpdateSummition()}"
                                            update="@form" />

                                </p:inputText> 
                            </p:column>

                            <p:column style="width: 17vh;font-size: 1.8vh;text-align: right;border-radius: 0px" headerText="النسبة" >
                                <p:inputText   id="percentage" value="#{rscextractaccrual.rscAccuralDeductionPercentage}">
                                    <p:ajax  event="blur" listener="#{rscExtractFormMB.calculateAccrualValue()}"
                                             update="@form" />
                                    <p:ajax event="blur"  listener="#{rscExtractFormMB.allUpdateSummition()}"
                                            update="totalaccrualNet totalaccrualNetPer form:totalAccural" />

                                </p:inputText>
                            </p:column>
                            <p:summaryRow>
                                <p:column colspan="1" style="text-align:right;border-radius: 0px">
                                    <h:outputText style="text-align:right" value="#{userData.userDDs['TOTAL']}  :" />
                                </p:column>

                                <p:column >
                                    <h:outputText id="totalaccrualNet" value="#{rscExtractFormMB.extractRegisterDTO.totalAccrualNetvalue}"/>
                                </p:column>
                                <p:column>
                                    <h:outputText id="totalaccrualNetPer" value="#{rscExtractFormMB.extractRegisterDTO.totalAccrualNetpercentage}"/>
                                </p:column>

                            </p:summaryRow>

                            <p:column style="width: 10vh;font-size: 1.8vh;text-align: center;border-radius: 0px"  headerText="#{userData.userDDs['TRANSACTION']}">

                                <p:commandButton  class="saddButton" id="addnew4"
                                                  icon="fa fa-plus"
                                                  title="#{userData.userDDs['ADD']}" 
                                                  actionListener="#{rscExtractFormMB.addChildAccrual()}" 
                                                  update="rscextractaccrual"                                         
                                                  ajax="true" style="background-color: #6a6967;border-radius: 3px;float:right"
                                                  />
                                <p:commandButton  class="sdeleteButton" update="rscextractaccrual"
                                                  title="#{userData.userDDs['DELETE']}" style="background-color: red;border-radius: 3px;" 
                                                  action="#{rscExtractFormMB.deleteRscAccrual()}"
                                                  icon="fa fa-remove" >

                                    <f:setPropertyActionListener value="#{rscextractaccrual}"
                                                                 target="#{rscExtractFormMB.rscExtractAccrualDTOSelected}"/>
                                    <p:confirm header="#{userData.userDDs['COFIGRATION']}" 
                                               message="#{userData.userDDs['ARE_YOU_SURE']}"
                                               icon="ui-icon-alert" />
                                </p:commandButton>



                                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                                    <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                                    <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                                </p:confirmDialog>
                            </p:column >
                        </p:dataTable>
                    </p:tab>
                    <p:tab id="tab3" title="الاستقطاعات"  >
                        <p:dataTable id="rscextractdeduction"
                                     style="margin-bottom:20px"
                                     editable="true"
                                     editMode="cell"
                                     selectionMode="single"
                                     sortBy="#{1}"
                                     draggableColumns="true"
                                     var="rscextractdeduction"
                                     dir="rtl" 
                                     rows="#{userData.rowListCount}"
                                     rowKey="#{rscextractdeduction}"
                                     rowIndexVar="index" 
                                     paginator="true"
                                     emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                                     widgetVar="rscextractdeduction"
                                     selection="#{rscExtractFormMB.rscExtractDeductionDTOSelected}"
                                     value="#{rscExtractFormMB.extractRegisterDTO.rscExtractDeductionList}" >

                            <f:facet name="header" class="col-md-12">
                                <p:commandButton   class="saddButton" id="addnew5"
                                                   icon="fa fa-plus"
                                                   title="#{userData.userDDs['ADD']}" 
                                                   actionListener="#{rscExtractFormMB.addChildDeduction()}" 
                                                   update="form"                                         
                                                   ajax="true"
                                                   style="float:right"/>
                                <p:outputPanel>
                                    <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                                    <p:inputText id="globalFilter" onkeyup="PF('rscextractdeduction').filter()" style="width:150px" />
                                </p:outputPanel>
                            </f:facet>
                            <p:column style="width: 10vh;text-align: -webkit-auto;border-radius: 0px" id="rscdeduction" headerText="الاستقطاع" 
                                      filterBy="#{rscextractdeduction.rscAccrualDeductionDTO}" 
                                      filterMatchMode="contains" 
                                      sortBy="#{rscextractdeduction.rscAccrualDeductionDTO}"
                                      filterable="false">
                                <p:autoComplete id="rscdeductionId"  
                                                style="width:95%"
