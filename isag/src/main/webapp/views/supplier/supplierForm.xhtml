<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">

        <h:form id="form" dir="#{userData.dir}" class='formmargin'>

            <p:fieldset id="whole" legend="#{userData.userDDs['SUPPLIERS_DATA']}" >





                <div class="ui-g-6 ui-xl-6">



                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <p:autoComplete style="width:41.5%" 
                                            dropdown="true"
                                            converter="#{organizationSiteFormMB.regionConverter}"
                                            value="#{organizationSiteFormMB.invOrganizationSiteEntity.regionId}"

                                            var="region"
                                            itemLabel="#{region}" 
                                            itemValue="#{region}" 
                                            forceSelection="true" 
                                            completeMethod="#{organizationSiteFormMB.completeRegion}" >

                            </p:autoComplete>
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 122px" value="#{userData.userDDs['AREA']}"/>

                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <p:inputText style="width:52%" id="zip" value="#{organizationSiteFormMB.invOrganizationSiteEntity.zip}"/>

                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width:116px" value="#{userData.userDDs['P.B']}"/>

                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <p:inputText style="width: 52%" id="ADDRESS" value="#{organizationSiteFormMB.invOrganizationSiteEntity.address}"/>

                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 116px" value="#{userData.userDDs['ADDRESS']}"/>

                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <p:inputText style="width: 52%" id="EMAIL" value="#{organizationSiteFormMB.invOrganizationSiteEntity.email}"/>

                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 116px"  value="#{userData.userDDs['EMAIL']}"/>

                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <p:inputText style="width: 52% "  id="NOTM" value="#{organizationSiteFormMB.invOrganizationSiteEntity.contactPerson}"/>

                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 116px;"  value="#{userData.userDDs['NAME_OF THE_MANAGER']}"/>

                        </div>
                    </div>

                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <p:inputText style="width: 52%" id="crdtLmt" 
                                         value="#{organizationSiteFormMB.invOrganizationSiteEntity.balanceLimit}"
                                         rendered="#{organizationSiteFormMB.supplier or organizationSiteFormMB.supplierAndCustomer }"/>

                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 116px" value="#{userData.userDDs['CREDIT_LIMIT']}"
                                           rendered="#{organizationSiteFormMB.supplier or
                                                       organizationSiteFormMB.supplierAndCustomer}"/>

                        </div>
                    </div>

                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <p:inputText style="width: 52%" id="NOTE" value="#{organizationSiteFormMB.invOrganizationSiteEntity.remarks}"/>

                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 116px" value="#{userData.userDDs['NOTE']}" />

                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width:120px " 
                                           value="#{userData.userDDs['DELEGATE_CUSTOMER']}"
                                           rendered="#{organizationSiteFormMB.customer and not organizationSiteFormMB.supplierAndCustomer}" />

                            <p:autoComplete style="width: 40%" 

                                            dropdown="true"
                                            converter="#{organizationSiteFormMB.salesConverter}"
                                            value="#{organizationSiteFormMB.invOrganizationSiteEntity.salesPerson}" required="true"
                                            requiredMessage="يجب اختيار مندوب مشتريات"
                                            var="person"
                                            itemLabel="#{person}" 
                                            itemValue="#{person}" 
                                            forceSelection="true" 
                                            completeMethod="#{organizationSiteFormMB.completeSalesPerson}" >


                            </p:autoComplete>
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width:120px "
                                           value="#{userData.userDDs['CUSTOMER/SUPPLIER']}"
                                           rendered="#{organizationSiteFormMB.supplierAndCustomer}"/>
                        </div>


                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width:120px "
                                           value="#{userData.userDDs['PURCH_DELE_NO']}"
                                           rendered="#{organizationSiteFormMB.supplier and not organizationSiteFormMB.supplierAndCustomer}"/>
                        </div>
                    </div>
         
                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <p:inputText style="width: 50%" id="POST_BOX" value="#{organizationSiteFormMB.invOrganizationSiteEntity.postBox}"/>

                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width:115px" value="#{userData.userDDs['POST_BOX']}"/>

                        </div>
                    </div>
                    
                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <p:inputText style="width: 50%" id="FAX" value="#{organizationSiteFormMB.invOrganizationSiteEntity.fax}"/>

                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel  style="width: 115px" value="#{userData.userDDs['FAX']}"/>

                        </div>
                    </div>

                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <p:inputText style="width: 50%" id="MOBILE" value="#{organizationSiteFormMB.invOrganizationSiteEntity.mobile}"/>

                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 115px" value="#{userData.userDDs['MOBILE']}"/>

                        </div>
                    </div>

                </div>


                <div class="ui-g-6 ui-xl-6">
                    <div class="ui-g-12 ui-xl-12">

                        <p:fieldset style="width: 73%;border-radius: 5px">
                            <p:selectOneRadio id="console"  value ="#{organizationSiteFormMB.invOrganizationSiteEntity.type}" >

                                <f:selectItem itemLabel="#{userData.userDDs['SUPPLIER']}" itemValue="1" />
                                <f:selectItem itemLabel="#{userData.userDDs['CUSTOMER_SUPPLIER']}" itemValue="2" />
                                <p:ajax  listener="#{organizationSiteFormMB.checkVisability}" update="form" />
                            </p:selectOneRadio>
                        </p:fieldset>

                    </div>
                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <p:inputText style="width: 30%"
                                         id="SNOSName"
                                         a:autofocus="true"
                                         required="true"
                                         requiredMessage="#{userData.userDDs['CUST_CO_MU_ADD']}"
                                         value="#{organizationSiteFormMB.invOrganizationSiteEntity.code}">
                                <p:ajax event="blur" listener="#{organizationSiteFormMB.validateCode()}"/>
                            </p:inputText>



                        </div>
                        

                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 116px;" value="رمز المورد"/>

                        </div>
                    </div>

                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <p:inputText style="width: 20%" 
                                         id="SNOSCode"
                                         required="true"
                                         requiredMessage="#{userData.userDDs['CUST_NA_MU_ADD']}"
                                         value="#{organizationSiteFormMB.invOrganizationSiteEntity.name}" />
                        </div>
                        
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 116px;" value="اسم المورد"/>

                        </div>

                    </div>

                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <p:autoComplete id="GlAccount_ID" 
                                            style="width: 41.5%" 
                                            dropdown="true"
                                            converter="#{organizationSiteFormMB.accountConverter}"
                                            value="#{organizationSiteFormMB.invOrganizationSiteEntity.accountId}"
                                            required="true"
                                            var="account"
                                            itemLabel="#{account}" 
                                            itemValue="#{account}" 
                                            forceSelection="true" 
                                            completeMethod="#{organizationSiteFormMB.completeGlAccount}" >

                            </p:autoComplete>
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 122px" value="#{userData.userDDs['ACCOUNT_NUMBER']}"
                                           rendered="#{organizationSiteFormMB.supplier or organizationSiteFormMB.supplierAndCustomer}"/>
                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <p:autoComplete style="width: 41.5%" 

                                            dropdown="true"
                                            converter="#{organizationSiteFormMB.supplierTypeConverter}"
                                            value="#{organizationSiteFormMB.invOrganizationSiteEntity.supplierType}"

                                            var="supplier"
                                            itemLabel="#{supplier}" 
                                            itemValue="#{supplier}" 
                                            forceSelection="true" 
                                            completeMethod="#{organizationSiteFormMB.completeSupplierType}" >

                            </p:autoComplete>
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 122px"
                                           value="#{userData.userDDs['SUPPLIER_TYPE']}"
                                           rendered="#{organizationSiteFormMB.supplier}"/>
                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <p:inputText style="width: 49%" id="OPBACR" readonly="true"
                                         value="#{organizationSiteFormMB.invOrganizationSiteEntity.openBalanceCredit}"
                                         rendered="#{organizationSiteFormMB.supplier or organizationSiteFormMB.supplierAndCustomer }"/>

                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width:120px" value="#{userData.userDDs['OPENING_BALANCE_CREDIT']}" 
                                           rendered="#{organizationSiteFormMB.supplier or organizationSiteFormMB.supplierAndCustomer}"/>

                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <p:inputText style="width: 52%" id="OPBD" readonly="true"
                                         value="#{organizationSiteFormMB.invOrganizationSiteEntity.openBalanceDebit}"
                                         rendered="#{organizationSiteFormMB.supplier or organizationSiteFormMB.supplierAndCustomer }"/>

                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width:116px"  value="#{userData.userDDs['OPENING_BALANCE_DEBIT']}" 
                                           rendered="#{organizationSiteFormMB.supplier or organizationSiteFormMB.supplierAndCustomer }"/>

                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <p:autoComplete id="Currency_ID" 
                                            style="width: 40%" 
                                            dropdown="true"
                                            converter="#{organizationSiteFormMB.currencyConverter}"
                                            value="#{organizationSiteFormMB.invOrganizationSiteEntity.currencyId}"

                                            var="currency"
                                            itemLabel="#{currency}" 
                                            itemValue="#{currency}" 
                                            forceSelection="true" 
                                            completeMethod="#{organizationSiteFormMB.completeCurrency}">

                            </p:autoComplete>
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 120px" value="#{userData.userDDs['CURRENCY']}"
                                           rendered="#{organizationSiteFormMB.supplier or organizationSiteFormMB.supplierAndCustomer}"/>
                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <p:selectOneMenu style="width: 50%"  id="active" 
                                             value="#{organizationSiteFormMB.invOrganizationSiteEntity.active}" >
                                <f:selectItem itemLabel="#{userData.userDDs['INACTIVE']}" itemValue="0" />
                                <f:selectItem itemLabel="#{userData.userDDs['CS_ACTIVE']}" itemValue="1" />
                                <f:selectItem itemLabel="#{userData.userDDs['BLACK_LIST']}" itemValue="2" />
                            </p:selectOneMenu>
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 120px" value="#{userData.userDDs['CS_ACTIVE']}" />

                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <p:inputText  style="width:50%" id="PHONE1" value="#{organizationSiteFormMB.invOrganizationSiteEntity.phone1}"/>

                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel  style="width:115px" value="#{userData.userDDs['PHONE1']}"/>

                        </div>
                    </div>

                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <p:inputText style="width: 50%" id="PHONEt" value="#{organizationSiteFormMB.invOrganizationSiteEntity.phone2}"/>

                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 115px" value="#{userData.userDDs['PHONE2']}"/>

                        </div>
                    </div>

                </div>






                <div class="ui-g-12 ui-xl-12">

                    <h:panelGrid class="centerButtons col-md-12" columns="1">

                        <h:panelGroup>
                            <p:commandButton class="saveButtons" 
                                             id="saveB" 
                                             title="#{userData.userDDs['SAVE']}" 
                                             value="#{userData.userDDs['SAVE']}"
                                             action="#{organizationSiteFormMB.save()}" 
                                             update="@form"/>

                            <p:commandButton  class="newButtons" 
                                              id="newN"
                                              ajax="false"
                                              value="#{userData.userDDs['NEW']}" 
                                              title="#{userData.userDDs['NEW']}"
                                              onclick="form.target = ''" 
                                              actionListener="#{organizationSiteFormMB.reset()}"/>


                            <p:commandButton class="closeButtons"
                                             title="#{userData.userDDs['CANCEL']}" 
                                             immediate="true" 
                                             value="#{userData.userDDs['CANCEL']}" 
                                             action="#{organizationSiteFormMB.exit()}"   />


                        </h:panelGroup>

                    </h:panelGrid>

                </div>
            </p:fieldset>          
        </h:form>
    </ui:define>
</ui:composition>
