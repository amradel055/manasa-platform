services:
  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: isag2019
      MYSQL_DATABASE: isag
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pisag2019"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./manasaapi
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8180:8080"
      - "4848:4848"

  react:
    build: ./manasa_react
    ports:
      - "3500:3000"
    depends_on:
      - api

volumes:
  db_data:
