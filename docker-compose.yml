services:
  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: isag2019
      MYSQL_DATABASE: isag
    ports:
      # Defaults to the original 3308; override MYSQL_PORT in .env on a machine
      # where that port is unavailable (Windows reserves 3254-3453).
      - "${MYSQL_PORT:-3308}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pisag2019"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./manasaapi
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8180:8080"
      - "4848:4848"

  react:
    build: ./manasa_react
    ports:
      - "3500:3000"
    environment:
      # Unset by default, so the app uses the paths in properties.json. Set them
      # in .env to point this machine at a different gateway address.
      # Live-reload bind mounts live in docker-compose.override.yml (dev only).
      - REACT_APP_API_PATH
      - REACT_APP_AUTH_PATH
    depends_on:
      - api

volumes:
  db_data:
