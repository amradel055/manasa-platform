<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">

        <h:form id="form" dir="#{userData.dir}">
            <p:fieldset id="whole" legend=" اضافة سؤال " style="margin-bottom:20px; margin-right: 30px">

                <div class="col-xs-12">
                    <p:messages autoUpdate="true"  id="msg" showDetail="true" closable="true" />
                </div>
                <div  id="firstSegment" class="ui-g-12 ui-g-nopad">
                    <div class="ui-g">
                        <div class="ui-g-6 ui-xl-6">

                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText style="width: 36%!important" id="nameAr" value="#{teacherQuestionsFormMB.questionCommonDTO.text}" >
                                    </p:inputText>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 85px" value="ادخل النص  " />

                                </div>
                            </div>

                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <h:panelGroup style="background-color: #FFFFFF!important;">
                                        <p:fileUpload style="width: 37%;margin-right: 28%; margin-top: -5%;" id="logo"                                          
                                                      label="#{userData.userDDs['CHOOSE']} "
                                                      dragDropSupport="true"  
                                                      cancelLabel="#{userData.userDDs['CANCEL']}" 
                                                      uploadLabel="#{userData.userDDs['UPLOAD']}"  
                                                      fileUploadListener="#{teacherQuestionsFormMB.upload}"
                                                      mode="advanced" 
                                                      update="image"
                                                      allowTypes="/(\.|\/)(gif|jpe?g|png|doc|docx|xls|xlsx|pdf|txt)$/"
                                                      />
                                        <p:message for="logo"/>
                                    </h:panelGroup>




                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 85px" value="اضافة صورة  " />

                                </div>
                            </div>


                        </div>
                    </div>

                </div>





                <h:panelGrid class="centerButtons col-md-12" columns="1">

                    <h:panelGroup>
                        <p:commandButton class="saveButton" 
                                         id="saveB" 
                                         title="#{userData.userDDs['SAVE']}" 
                                         value="#{userData.userDDs['SAVE']}"
                                         icon="fa fa-fw fa-save" 
                                         action="#{teacherQuestionsFormMB.save()}" 
                                         update="@form"/>

                    </h:panelGroup>

                </h:panelGrid>

            </p:fieldset>        

        </h:form>
    </ui:define>
</ui:composition>
