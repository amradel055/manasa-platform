<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/newTemplate.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <h:form id="branchListForm" dir="#{userData.dir}" class='formmargin' >

            <div style=" position: absolute;left: 20px">
                <p:commandButton  icon="fa fa-fw fa-home"
                                  title="#{userData.userDDs['HOME']}"
                                  class="smhomeButton"  
                                  style="z-index: 2;

                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;

                                  background: #22323a 50% 50% repeat-x!important;" 
                                  action="exit" />

            </div>
            <p:fieldset legend="إدارة التذاكر" style="margin-bottom:20px">
                <div >
                    <p:messages autoUpdate="true"  id="messages" showDetail="true" closable="true"/>   
                </div>

                <div >

                    <p:dataTable 
                        var="isagsupport" 
                        widgetVar="isagsupport"  
                        rowIndexVar="index" 
                        value="#{isagSupportListMB.isagsupportList}" rows="15" 
                        paginator="true" emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                        id="isagsupport">
                        
                        <f:facet name="header" class="col-md-12">
                            <p:commandButton icon="fa fa-plus" title="#{userData.userDDs['ADD']}" 
                                             class="saddButton"
                                             action="#{isagSupportListMB.goToAdd()}" 
                                             style="float:right;margin: 0" />
                            <p:outputPanel  >
                                <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large;" />
                                <p:inputText id="globalFilter" a:autofocus="true" onkeyup="PF('isagsupport').filter()" style="width: 35% !important;" />
                            </p:outputPanel>
                        </f:facet>

                        <p:column   headerText="#"  style="width: 5vh; font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px;">
                            <p:outputLabel value="#{isagsupport.id}"  style="font-size: 1.5vh"/>
                        </p:column>

                        

                        <p:column filterStyle="display:none" style="width: 11vh;font-size: 1.8vh;border-radius: 0px;" filterBy="#{isagsupport.branchId}"  
                                  filterMatchMode="contains" headerText="" sortBy="#{isagsupport.branchId}" >
                            <f:facet name="filter">
                                <p:selectCheckboxMenu  label="الفرع" value="#{isagSupportListMB.isagSupportDTOSearch.branchSelected}" 
                                                      converter="#{isagSupportListMB.aPIBranchConverter}"
                                                      scrollHeight="150" styleClass="custom-filter">
                                    <f:selectItems value="#{isagSupportListMB.branchListDTO}" var="branch" itemValue="#{branch}" itemLabel="#{branch.nameAr}" />
                                    <p:ajax update="isagsupport"
                                            event="change"
                                            listener="#{isagSupportListMB.search()}" />
                                </p:selectCheckboxMenu>
                            </f:facet>
                            <p:outputLabel value="#{isagsupport.branchName}" style="font-size: 1.5vh" />
                        </p:column>
                        <p:column filterStyle="display:none" style="width: 15vh;font-size: 1.8vh;border-radius: 0px;" filterBy="#{isagsupport.employeeName}"  
                                  filterMatchMode="contains" headerText="" sortBy="#{isagsupport.employeeName}" >
                            <f:facet name="filter">
                                <p:selectCheckboxMenu  label="المستخدم" value="#{isagSupportListMB.isagSupportDTOSearch.isagUserDTOSelected}" 
                                                      converter="#{isagSupportListMB.isagUserDTOConverter}"
                                                      scrollHeight="150" styleClass="custom-filter">
                                    <f:selectItems value="#{isagSupportListMB.isagUserDTOList}" var="user" itemValue="#{user}" itemLabel="#{user}" />
                                    <p:ajax update="isagsupport"
                                            event="change"
                                            listener="#{isagSupportListMB.search()}" />
                                </p:selectCheckboxMenu>
                            </f:facet>
                            <p:outputLabel value="#{isagsupport.employeeName}" style="font-size: 1.5vh" />
                        </p:column>
                        <p:column filterStyle="display:none" style="width: 13vh;font-size: 1.8vh;border-radius: 0px;" filterBy="#{isagsupport.screen.moduleAr}"  
                                  filterMatchMode="contains" headerText="" sortBy="#{isagsupport.screen.moduleAr}" >
                            <f:facet name="filter">
                                <p:selectCheckboxMenu id="screen" label="الموديول"  style="width:100%; " 
                                                      value="#{isagSupportListMB.isagSupportDTOSearch.screenSelected}" 
                                                      converter="#{isagSupportListMB.isagScreenConverter}"  >
                                    <f:selectItem itemLabel="#{userData.userDDs['CHOOSE']}"  itemValue="" />
                                    <f:selectItems  value="#{isagSupportListMB.isagScreenList}" var="screen" itemLabel="#{screen.moduleAr}" itemValue="#{screen}" />
                                    <p:ajax update="isagsupport"
                                            event="change"
                                            listener="#{isagSupportListMB.search()}" />
                                </p:selectCheckboxMenu>
                            </f:facet>
                            <p:outputLabel value="#{isagsupport.screen.moduleAr}" style="font-size: 1.5vh" />
                        </p:column>
                        <p:column filterStyle="display:none" style="width: 13vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px;" filterBy="#{isagsupport.title}"
                                  filterMatchMode="contains" headerText="العنوان" sortBy="#{isagsupport.title}" >
                            
                            <p:outputLabel value="#{isagsupport.title}"  style="font-size: 1.5vh" />
                        </p:column>
                        <p:column filterStyle="display:none" style="width: 50vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px;" filterBy="#{isagsupport.description}"
                                  filterMatchMode="contains" headerText="الوصف" sortBy="#{isagsupport.description}" >
                            
                            <p:outputLabel value="#{isagsupport.description}"  style="font-size: 1.5vh" >
                                <p:ajax update="isagsupport"
                                        event="blur"
                                        listener="#{isagSupportListMB.search()}" />
                            </p:outputLabel>
                        </p:column>
                        <p:column filterStyle="display:none" style="width: 17vh;font-size: 1.8vh;border-radius: 0px;" filterBy="#{isagsupport.status}"  
                                  filterMatchMode="contains" headerText="" sortBy="#{isagsupport.status}" >
                            <f:facet name="filter">
                                <p:selectCheckboxMenu  label="الحالة" id="status" style="width:100%;" 
                                                       value="#{isagSupportListMB.isagSupportDTOSearch.statusSelected}"  converter="javax.faces.Integer" >
                                    <f:selectItem itemLabel="تحت التنفيذ"  itemValue="0" />
                                    <f:selectItem itemLabel="تم التنفيذ"  itemValue="1" />
                                    <f:selectItem itemLabel="مغلقة"  itemValue="2" />
                                    <p:ajax update="isagsupport"
                                            event="change"
                                            listener="#{isagSupportListMB.search()}" />
                                </p:selectCheckboxMenu>
                            </f:facet>
                            <p:selectOneMenu id="status2" style="width:100%" value="#{isagsupport.status}" >
                                <f:selectItem itemLabel="تحت التنفيذ"  itemValue="0" />
                                <f:selectItem itemLabel="تم التنفيذ"  itemValue="1" />
                                <f:selectItem itemLabel="مغلقة"  itemValue="2" />
                            </p:selectOneMenu>
                        </p:column>
                        
                        <p:column filterStyle="display:none" style="width: 16vh;font-size: 1.8vh;border-radius: 0px;" filterBy="#{isagsupport.assignTo}"  
                                  filterMatchMode="contains" headerText=" " sortBy="#{isagsupport.assignTo}" >
                            <f:facet name="filter">
                                <p:selectCheckboxMenu id="assigntos" label="المحال إليه"  style="width:100%; " 
                                                      value="#{isagSupportListMB.isagSupportDTOSearch.assignToSelected}" 
                                                      converter="#{isagSupportListMB.employeeDTOConverter}"  >
                                    <f:selectItem itemLabel="#{userData.userDDs['CHOOSE']}"  itemValue="" />
                                    <f:selectItems  value="#{isagSupportListMB.employeeDTOIsagList}" var="assignto" 
                                                    itemLabel="#{assignto}" itemValue="#{assignto}" />
                                    <p:ajax update="isagsupport"
                                            event="change"
                                            listener="#{isagSupportListMB.search()}" />
                                </p:selectCheckboxMenu>
                            </f:facet>
                            <p:autoComplete id="employeedf"  
                                            style="width:100%"
                                            converter="#{isagSupportListMB.employeeDTOConverter}"
                                            value="#{isagsupport.assignTo}"
                                            maxResults="5"
                                            var="employee"
                                            itemLabel="#{employee}" 
                                            itemValue="#{employee}" 
                                            forceSelection="true" 
                                            completeMethod="#{isagSupportListMB.completeEmployeeIsag}" >
                            </p:autoComplete> 
                        </p:column>
                        <p:column style="width: 15vh;font-size: 1.4vh;text-align: center" 
                                  filterFunction="#{isagSupportListMB.filterByDate}" filterStyle="display:none" sortBy="#{isagsupport.transferDate}"  
                                  filterBy="#{isagsupport.transferDate}"  filterMatchMode="contains" headerText="تاريخ الاحالة " >  
                            
                            <p:calendar  style="display:block;width: 100% "  value="#{isagsupport.transferDate}"  disabled="true"
                                         pattern="dd/MM/yyyy"  />                        
                        </p:column>

                        <p:column filterStyle="display:none" style="width: 25vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px;" filterBy="#{isagsupport.reply}"
                                  filterMatchMode="contains" headerText="الرد الفنى" sortBy="#{isagsupport.reply}" >
                            
                            <p:inputTextarea value="#{isagsupport.reply}"  style="font-size: 1.5vh; min-height: 50px !important; width: 95%;" />
                        </p:column>
                        <p:column style="width: 15vh;font-size: 1.4vh;text-align: center" 
                                  filterFunction="#{isagSupportListMB.filterByDate}" filterStyle="display:none" sortBy="#{isagsupport.ticketSolveDate}"  
                                  filterBy="#{isagsupport.ticketSolveDate}"  filterMatchMode="contains" headerText="تاريخ الحل " >  
                           
                            <p:calendar  style="display:block;width: 100% "   value="#{isagsupport.ticketSolveDate}"  disabled="true"
                                         pattern="dd/MM/yyyy"  />                        
                        </p:column>

                        <p:column headerText="#{userData.userDDs['TRANSACTION']}"  style="width: 7vh;font-size: 1.8vh;text-align: center;border-radius: 0px;">

                            <p:commandButton   class="ssaveButton" update="@form" 
                                               title="#{userData.userDDs['SAVE']}"
                                               action="#{isagSupportListMB.save()}" 
                                               icon="fa fa-fw fa-save" >
                                <f:setPropertyActionListener value="#{isagsupport}" target="#{isagSupportListMB.isagSupportDTOSelected}" />
                            </p:commandButton>
                        </p:column>
                    </p:dataTable>
                </div>
            </p:fieldset>
        </h:form>
    </ui:define>
</ui:composition>
