<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">

        <h:form class='formmargin' id="form"  enctype="multipart/form-data"  dir="#{userData.dir}">

            <p:fieldset legend="انشاء خط السير"  style="margin-bottom:20px">


                <div class="col-xs-12">
                    <p:messages autoUpdate="true"  id="msgopp" showDetail="true" closable="true" />
                </div>
                <div  id="firstLine" class="ui-g-12 ui-g-nopad">
                    <div class="ui-g">

                        <div class="ui-g-6 ui-xl-6">

                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText style="width: 35%!important" id="ad1" a:autofocus="true" value="#{trafficFormMB.remTrafficDTO.code}"/>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 85px;margin-right: 3%;" value="#{userData.userDDs['CODE']}"/>
                                </div>
                            </div>

                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText style="width: 35%!important" id="ad2" value="#{trafficFormMB.remTrafficDTO.name}"/>

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 85px;" value="اسم المسار"/>

                                </div>
                            </div>


                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:autoComplete style="width:36%!important"
                                                    dropdown="true" maxResults="10"
                                                    converter="#{trafficFormMB.remCompanyDTOConverter}"
                                                    value="#{trafficFormMB.remTrafficDTO.remCompanyDTO}"
                                                    var="remCompany"
                                                    itemLabel="#{remCompany}" 
                                                    itemValue="#{remCompany}"
                                                    forceSelection="true" 
                                                    completeMethod="#{trafficFormMB.completeRemCompany}"
                                                    >

                                    </p:autoComplete>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 111px;" value="اسم المؤسسة"/>

                                </div>
                            </div>




                        </div>                        
                    </div>
                </div>

            </p:fieldset>

            <div class="asmaa">
                <p:commandButton  class="saveButton"  
                                  id="saveB" 
                                  title="#{userData.userDDs['SAVE']}"
                                  value="#{userData.userDDs['SAVE']}" 
                                  style=""
                                  action="#{trafficFormMB.save()}" 
                                  update="@form"/>

                <p:commandButton  class="newButton" 
                                  id="newN"
                                  ajax="false"
                                  style=""
                                  value="#{userData.userDDs['NEW']}" 
                                  title="#{userData.userDDs['NEW']}"
                                  onclick="form.target = ''" 
                                  actionListener="#{trafficFormMB.reset()}"/>

                <p:commandButton class="closeButton" 
                                 title="#{userData.userDDs['BACK']}" 
                                 immediate="true" 
                                 value="#{userData.userDDs['BACK']}" 
                                 style="" 
                                 action="#{trafficFormMB.exit()}"   />



                <p:blockUI block="form" trigger="saveB" animate="true" >

                    <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                </p:blockUI> 

            </div>

            <div class="ui-g-12 ui-xl-12">


                <p:dataTable id="trafficDetailsTable" draggableRows="true"
                             reflow="true"
                             var="trafficDetailsTable"
                             rowIndexVar="index" 
                             dir="rtl" 
                             emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                             sortBy="#{1}"
                             selectionMode="single"
                             selection="#{trafficFormMB.remTrafficDTO.remTrafficDetailDTOSelected}"
                             widgetVar="trafficDetailsTable"
                             rowKey="#{trafficDetailsTable.index}"
                             value="#{trafficFormMB.remTrafficDTO.remTrafficDetailDTOList}" >

                    <f:facet name="header" class="col-md-12">
                        <p:commandButton   class="saddButton" id="addnew"
                                           icon="fa fa-plus"
                                           title="#{userData.userDDs['ADD']}" 
                                           actionListener="#{trafficFormMB.addNewDetail()}" 
                                           update=":form:msgopp trafficDetailsTable"                                         
                                           ajax="true"
                                           style="float:right" />
                        <p:outputPanel>
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" onkeyup="PF('trafficDetailsTable').filter()" style="width:150px" />
                        </p:outputPanel>
                    </f:facet>

                    <p:column headerText="#">
                        #{index + 1}
                    </p:column>

                    <p:column width="300" style="width: 70vh;font-size: 1.8vh;text-align: right;border-radius: 0px;" headerText="النقطة" 
                              filterStyle="display:none"
                              filterBy="#{trafficDetailsTable.pointId}"  filterMatchMode="contains" 
                              sortBy="#{trafficDetailsTable.pointId}"
                              >

                        <p:autoComplete id="point"  
                                        style="width:100%"
                                        converter="#{trafficFormMB.remPointsDTOConverter}"
                                        value="#{trafficDetailsTable.pointId}"
                                        maxResults="10"
                                        var="point"
                                        itemLabel="#{point}" 
                                        itemValue="#{point}" 
                                        forceSelection="true" 
                                        completeMethod="#{trafficFormMB.completeRemPoints}" >
                        </p:autoComplete>   

                    </p:column>



                    <p:column  >
                        <p:commandButton  id="b7" icon="fa fa-remove" 
                                          class="sdeleteButtons" style="color: #fff!important;background-color: red"
                                          title="#{userData.userDDs['DELETE']}" 
                                          actionListener="#{trafficFormMB.deleteDetail(trafficDetailsTable)}" 
                                          update="@form"  
                                          immediate="true"
                                          ajax="true" />
                        <p:commandButton   class="saddButton" id="addnew2"
                                           icon="fa fa-plus"
                                           title="#{userData.userDDs['ADD']}" 
                                           actionListener="#{trafficFormMB.addNewDetail()}" 
                                           update=":form:msgopp trafficDetailsTable"                                         
                                           ajax="true"
                                           style="float:right" />
                    </p:column>


                </p:dataTable>
            </div>

        </h:form>
    </ui:define>
</ui:composition>
