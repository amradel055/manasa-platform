<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">

        <h:form>
            <p:fieldset legend="تسجيل يدوي للموظف" style="margin-bottom:20px ; text-align: right">

                <div class="ui-g-6 ui-xl-6">
                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:autoComplete 
                                dropdown="true" maxResults="10"
                                converter="#{autoComplete.remCompanyDTOConverter}"
                                value="#{registerEmployeeMB.remCompanyDTOSelected}"
                                var="Company"
                                itemLabel="#{Company}" 
                                itemValue="#{Company}"
                                forceSelection="true" 
                                completeMethod="#{autoComplete.completeRemCompany}"
                                >
                            </p:autoComplete>
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 75px;font-size: 2.4vh;" value="الشركة" />

                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:autoComplete
                                dropdown="true" maxResults="10"
                                converter="#{autoComplete.employeeDTOConverter}"
                                value="#{registerEmployeeMB.employeeDTOSelected}"
                                var="Employee"
                                itemLabel="#{Employee}" 
                                itemValue="#{Employee}"
                                forceSelection="true" 
                                completeMethod="#{autoComplete.completeRemEmployee}"
                                >


                            </p:autoComplete> 
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 75px;font-size: 2.4vh;" value="الموظف" />

                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:autoComplete 
                                dropdown="true" maxResults="10"
                                converter="#{autoComplete.remTrafficDTOConverter}"
                                value="#{registerEmployeeMB.remTrafficDTOSelected}"
                                var="Traffic"
                                itemLabel="#{Traffic}" 
                                itemValue="#{Traffic}"
                                forceSelection="true" 
                                completeMethod="#{autoComplete.completeRemTraffic2}"
                                >

                            </p:autoComplete>  
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 75px;font-size: 2.4vh;" value="خط السير" /> 
                        </div>
                    </div>
                </div>
                    <div class="ui-g-6 ui-xl-6">
                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:autoComplete 
                                dropdown="true" maxResults="10"
                                converter="#{autoComplete.remPointsDTOConverter}"
                                value="#{registerEmployeeMB.remPointsDTOSelected}"
                                var="Point"
                                itemLabel="#{Point}" 
                                itemValue="#{Point}"
                                forceSelection="true" 
                                completeMethod="#{autoComplete.completeRemPoints}"
                                >

                            </p:autoComplete>   
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 75px;font-size: 2.4vh;" value="النقط" />

                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:calendar id="dateFrom"  
                                        pattern="dd/MM/yyyy   HH:mm:ss"  showButtonPanel="true"  value="#{registerEmployeeMB.apiRemRegisterEmployeeDTO.dateArrival}"
                                        style=""/>
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 75px;font-size: 2.4vh;" value="من تاريخ " />

                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:autoComplete 
                                dropdown="true" maxResults="10"
                                converter="#{autoComplete.remBusesDTOConverter}"
                                value="#{registerEmployeeMB.busSelected}"
                                var="busesTo"
                                itemLabel="#{busesTo}" 
                                itemValue="#{busesTo}"
                                forceSelection="true" 
                                completeMethod="#{autoComplete.completeRemBuses}"
                                >

                            </p:autoComplete>
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 75px;font-size: 2.4vh;" value="اتوبيس" />
                        </div>
                    </div>
                      <div class="ui-g-12 ui-xl-12">
                          <div class="ui-g-6 ui-xl-6">
                                 <p:selectOneMenu id="console" value="#{registerEmployeeMB.apiRemRegisterEmployeeDTO.type}" style="width:125px">
                        <f:selectItem itemLabel="ذهاب" itemValue="0" />
                        <f:selectItem itemLabel="عوده" itemValue="1" />
                    </p:selectOneMenu> 
                          </div>
                          <div class="ui-g-6 ui-xl-6">
                              <p:outputLabel style="width: 75px;font-size: 2.4vh;" value="نوع المسار" />
                          </div>
                      </div>
                </div>




               

                <div align="center">

                    <h:panelGrid  columns="1"  class="col-md-12 " >

                        <h:panelGroup  class="centerButtons"  >


                            <p:commandButton  class="saveButton"  
                                              id="saveB" 
                                              title="#{userData.userDDs['SAVE']}"
                                              value="#{userData.userDDs['SAVE']}" 
                                              style=""
                                              action="#{registerEmployeeMB.save()}" 
                                              update="@form"/>

                        </h:panelGroup>

                    </h:panelGrid>
                </div>



            </p:fieldset>


        </h:form>
    </ui:define>
</ui:composition>
