<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">

        <h:form id="form" dir="#{userData.dir}}" class='formmargin'>

            <p:fieldset  legend="تقرير السائقين "

                         style=" position: relative; text-align: right; font-size: 2.4vh;">

                <div class="ui-g">

                    <div class="ui-g-12 ui-md-6">
                        <h:panelGroup>


                            <h:panelGroup>
                                <p:autoComplete style="width:36%!important"
                                                dropdown="true" maxResults="10"
                                                converter="#{autoComplete.remBusesDTOConverter}"
                                                value="#{remBusesReportMB.remBusesDTOToSelected}"
                                                var="busesTo"
                                                itemLabel="#{busesTo}" 
                                                itemValue="#{busesTo}"
                                                forceSelection="true" 
                                                completeMethod="#{autoComplete.completeRemBuses}"
                                                >

                                </p:autoComplete>

                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel style="width: 75px;margin-right: 6%;font-size: 2.4vh;" value="إلى اتوبيس" />
                            </h:panelGroup> 

                        </h:panelGroup>
                    </div>

                    <div class="ui-g-12 ui-md-6">
                        <h:panelGroup>


                            <h:panelGroup>
                                <p:autoComplete style="width:36%!important"
                                                dropdown="true" maxResults="10"
                                                converter="#{autoComplete.remBusesDTOConverter}"
                                                value="#{remBusesReportMB.remBusesDTOFromSelected}"
                                                var="busesFrom"
                                                itemLabel="#{busesFrom}" 
                                                itemValue="#{busesFrom}"
                                                forceSelection="true" 
                                                completeMethod="#{autoComplete.completeRemBuses}"
                                                >

                                </p:autoComplete>

                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel style="width: 75px;margin-right: 6%;font-size: 2.4vh;" value="من اتوبيس" />
                            </h:panelGroup> 

                        </h:panelGroup>
                    </div>


                </div>
            </p:fieldset>

            <div align="center">


                <p:commandButton  class="newButton" 
                                  id="newN"
                                  ajax="false"
                                  style=""
                                  value="#{userData.userDDs['NEW']}" 
                                  title="#{userData.userDDs['NEW']}"
                                  onclick="form.target = ''" 
                                  actionListener="#{remBusesReportMB.reset()}"/>


                <p:commandButton     class="searchButtons"
                                     title="#{userData.userDDs['SEARCH']}"
                                     action="#{remBusesReportMB.search()}"
                                     id="searchS"
                                     value="#{userData.userDDs['SEARCH']}"
                                     update="@form"
                                     style="color: #fff!important;background-color: #F9A825;margin-left: 5px;"   />





                <p:blockUI block="form" trigger="searchS" animate="true" >

                    <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                </p:blockUI> 

            </div>


            <p:fieldset legend="بيانات الاتوبيس" style="margin-bottom:20px; text-align: right; font-size: 2.4vh;">


                <div>
                    <p:dataTable var="car" value="#{remBusesReportMB.remBusesDTOList}">
                        <p:column   style=" font-size: 2.4vh; text-align: right " headerText="كود">
                            <h:outputText value="#{car.code}" />
                        </p:column>

                        <p:column style=" font-size: 2.4vh; text-align: right " headerText="الاسم">
                            <h:outputText value="#{car.name}" />
                        </p:column>
                        <p:column style=" font-size: 2.4vh; text-align: right " headerText="عدد المقاعد">
                            <h:outputText value="#{car.chairNumber}" />
                        </p:column>


                    </p:dataTable>
                </div>
            </p:fieldset>


        </h:form>
    </ui:define>
</ui:composition>
