<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns="http://www.w3.org/1999/xhtml" >

    <ui:define name="content">
         <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form id="form" dir="#{userData.dir}" style="margin-right: 20px">
            <p:fieldset legend="تفاصيل #{userData.userDDs['USER']}" style="margin-bottom:20px">

                <div >
                    <p:messages id="curmsg"
                                autoUpdate="true" 
                                showDetail="true" 
                                rendered="true" 
                                closable="true"/>   
                </div>
                <div class="ui-g-6 ui-xl-6">
                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">
                                <p:password   style="width: 50%"  value="#{UserProfileFormBean.oldPassword}"/>
                            </div>
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">
                                <p:outputLabel class="app-style" value="الباسورد الحالى"/>
                            </div>
                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">
                                <p:password  style="width: 50%" value="#{UserProfileFormBean.newUserPassword}">
                                <p:ajax event="blur" update="curmsg"/>
                            </p:password>
                            </div>
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">
                                <p:outputLabel class="app-style" value="الباسورد الجديد"/>
                            </div>
                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">
                                <p:password  style="width: 50%" value="#{UserProfileFormBean.newPasswordConfirm}">
                            <p:ajax event="blur" update="curmsg" listener="#{UserProfileFormBean.validateNewPasswordConfirm}" />
                        </p:password>
                            </div>
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">
                                <p:outputLabel class="app-style" value="تأكيد الباسورد "/>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="ui-g-6 ui-xl-6">
                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">
                                <p:outputLabel style="width: 70%" id="userName"
                                           value="#{UserProfileFormBean.userName}"/>
                            </div>
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">
                                <p:outputLabel class="app-style" value="#{userData.userDDs['USER_NAME']}*"/>
                            </div>
                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">
                                <p:outputLabel value="#{UserProfileFormBean.userCode}" />
                            </div>
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">
                                <p:outputLabel class="app-style" value="#{userData.userDDs['USER_CODE']}"/>
                            </div>
                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">
                                 <p:outputLabel style="width: 50%" value="#{UserProfileFormBean.userLang}"/>
                            </div>
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">
                                <p:outputLabel class="app-style" value="#{userData.userDDs['USER_LANGUAGE']}* "/>
                            </div>
                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">
                                 <p:outputLabel value="#{UserProfileFormBean.email}" />
                            </div>
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">
                                 <p:outputLabel class="app-style" value="الايميل"/>
                            </div>
                        </div>
                    </div>
                </div>
                        
                        
                <div class="asmaa" >

                            <p:commandButton 
                                             class="cancelButton"
                                             title="#{userData.userDDs['CANCEL']}" 
                                             immediate="true" 
                                             value="#{userData.userDDs['CANCEL']}" 
                                             icon="fa fa-fw fa-cancel"
                                             action="#{UserProfileFormBean.cancel}"   />

                            <p:commandButton 
                                             class="saveButton"
                                             id="saveB" 
                                             title="#{userData.userDDs['SAVE']}"
                                             value="#{userData.userDDs['SAVE']}" 
                                             action="#{UserProfileFormBean.save}"
                                             update="curmsg"/>
                            
                            <p:commandButton style=""
                                             class="cancelButton"
                                             title="#{userData.userDDs['BACK']}" 
                                             immediate="true" 
                                             value="#{userData.userDDs['BACK']}" 
                                             action="#{UserProfileFormBean.cancel}"   />

                            <p:commandButton 
                                             class="closeButton" icon="fa fa-fw fa-close"   
                                             title="#{userData.userDDs['EXIT']}" 
                                             action="exit" value="اغلاق"/>



                        </div>
                <p:blockUI block="form" trigger="saveB"/>
            </p:fieldset>
        </h:form>
    </ui:define>

</ui:composition>
