<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form id="ScreenAddEditForm" dir="#{userData.dir}" class='formmargin'>
            <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                  margin-top: 12%;
                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;"
                                  icon="fa fa-fw fa-home"
                                  title="#{userData.userDDs['HOME']}"
                                  class="smhomeButton" 
                                  action="exit" />  
            </div>
            <p:fieldset legend="#{userData.userDDs['ROLES']}" >
                <h:panelGrid  id="pnl"  class="col-md-12" columns="2" > 

                    <h:panelGroup>
                        <h:panelGroup>
                            <p:outputLabel style="width:120px;margin-right: 25px;"  value="#{userData.userDDs['ROLE_NAME']}*" />
                        </h:panelGroup>
                        <h:panelGroup>
                            <p:inputText  style="width: 20%!important"  id="roleName" a:autofocus="true" value="#{RoleFormBean.roleName}" required="true" requiredMessage="#{userData.userDDs['REQUIRED']}" >
                                <p:ajax event="keyup" update="msgroleName" />
                            </p:inputText>
                            <p:message id="msgroleName" for="roleName"  />
                        </h:panelGroup>

                    </h:panelGroup>
                    <h:panelGroup>

                        <h:panelGroup>            
                            <p:outputLabel  style="width:120px;margin-right: 25px;"  value="#{userData.userDDs['COMPANY_NAME']} " rendered="#{userData.isAdmin}" />
                        </h:panelGroup>

                        <h:panelGroup>

                            <p:selectOneMenu  style="width: 20%!important"  id="com" value="#{RoleFormBean.companyId}"  rendered="#{userData.isAdmin}" >
                                <p:ajax listener="#{RoleFormBean.onCompanyListChange()}"  />
                                <f:selectItem itemLabel="#{userData.userDDs['CHOOSE']}" itemValue="" noSelectionOption="true"  />
                                <f:selectItems value="#{RoleFormBean.userCompany}" var="com" itemLabel="#{com.name}" itemValue="#{com.id}" /> 
                            </p:selectOneMenu>

                            <p:message for="com"/>

                        </h:panelGroup>


                    </h:panelGroup>


                </h:panelGrid>
                <div id="buttunss" class="asmaa">
                            <p:commandButton   class="saveButton"  
                                               id="saveB" 
                                               title="#{userData.userDDs['SAVE']}"
                                               value="#{userData.userDDs['SAVE']}"
                                               action="#{RoleFormBean.save()}"
                                               rendered="#{userData.userScreens['role'].add or userData.userScreens['role'].edit  or userData.isAdmin}"
                                               />

                            <p:commandButton class="newButton"
                                             title="#{userData.userDDs['NEW']}" 
                                             immediate="true"
                                             value="#{userData.userDDs['NEW']}" 
                                             id="newA"
                                             actionListener="#"   
                                             rendered="#{userData.userScreens['role'].add or userData.isAdmin}"/>

                            <p:commandButton  class="closeButton" 
                                              title="#{userData.userDDs['CANCEL']}" 
                                              immediate="true"
                                              value="#{userData.userDDs['CANCEL']}" 
                                              action="#{RoleFormBean.cancel}"   />



                </div>


                <p:blockUI block="pnl" trigger="saveB" animate="true" >

                    <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>
                </p:blockUI>
            </p:fieldset>
        </h:form>
    </ui:define>

</ui:composition>
