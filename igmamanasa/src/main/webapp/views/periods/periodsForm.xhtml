<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">

        <h:form id="form" dir="#{userData.dir}">
            <p:fieldset id="whole" legend="تسجيل الفترات " style="margin-bottom:20px; margin-right: 30px">

                <div class="col-xs-12">
                    <p:messages autoUpdate="true"  id="msg" showDetail="true" closable="true" />
                </div>
                <div  id="firstSegment" class="ui-g-12 ui-g-nopad">
                    <div class="ui-g">
                        <div class="ui-g-6 ui-xl-6">
                            
                             <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText style="width: 36%!important" id="nameAr76" value="#{periodsFormMB.periodsDTO.name}" >
                                    </p:inputText>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 85px" value="اسم الفترة " />

                                </div>
                            </div>

                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:selectOneMenu style="width: 75%"  id="stage11" 
                                                     value="#{periodsFormMB.schoolStagesGuideDTO}"
                                                     converter="#{periodsFormMB.schoolStagesGuideDTOConverter}"
                                                     >
                                        <p:ajax listener="#{periodsFormMB.fillMaterialList()}" update="@form" />
                                        <f:selectItem itemLabel="choose" itemValue="" />
                                        <f:selectItems value="#{periodsFormMB.schoolStagesGuideDTOList}" var="stage11" itemLabel="#{stage11.name}" itemValue="#{stage11}" />
                                    </p:selectOneMenu>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 85px" value="اختر المرحلة " />

                                </div>
                            </div>

                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:selectOneMenu style="width: 75%"  id="material12" 
                                                     value="#{periodsFormMB.periodsDTO.materialId}"
                                                     >
                                        <p:ajax listener="#{periodsFormMB.fillParentList()}" update="@form" />

                                        <f:selectItem itemLabel="choose" itemValue="" />
                                        <f:selectItems value="#{periodsFormMB.materialsDTOList}" var="material" itemLabel="#{material.name}" itemValue="#{material.id}" />
                                    </p:selectOneMenu>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 85px" value="اختر المادة " />

                                </div>
                            </div>

                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:selectOneMenu style="width: 75%"  id="parent333" 
                                                     value="#{periodsFormMB.periodsDTO.parent}"
                                                     >
                                        <f:selectItem itemLabel="choose" itemValue="" />
                                        <f:selectItems value="#{periodsFormMB.periodsDTOParentList}" var="parent" itemLabel="#{parent.name}" itemValue="#{parent.id}" />
                                    </p:selectOneMenu>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 85px" value="اختر الفترات  " />

                                </div>
                            </div>


                        </div>
                    </div>

                </div>

                <h:panelGrid  styleClass="centerButtons col-md-12"  columns="1" >

                    <h:panelGroup > 

                        <p:commandButton  class="saveButton"  
                                          id="saveB" 
                                          title="#{userData.userDDs['SAVE']}"
                                          value="#{userData.userDDs['SAVE']}" 
                                          style=""
                                          action="#{periodsFormMB.save()}" 
                                          update="@form"/>

                        <p:commandButton  class="newButton" 
                                          id="newN"
                                          update="@form"
                                          ajax="false"
                                          style=""
                                          value="#{userData.userDDs['NEW']}" 
                                          title="#{userData.userDDs['NEW']}"
                                          onclick="form.target = ''" 
                                          actionListener="#{periodsFormMB.reset()}"/>

                        <p:commandButton class="closeButton" 
                                         title="#{userData.userDDs['BACK']}" 
                                         immediate="true" 
                                         value="#{userData.userDDs['BACK']}" 
                                         style="" 
                                         action="#{periodsFormMB.exit()}"   />

                    </h:panelGroup> 



                </h:panelGrid>







            </p:fieldset>        


        </h:form>
    </ui:define>
</ui:composition>
