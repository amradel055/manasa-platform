<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <h:form id="question" dir="#{userData.dir}"  styleClass='formmargin'>


            <p:fieldset legend="الفترات " style="margin-bottom:20px">

                <p:dataTable 
                    draggableColumns="true" 
                    draggableRows="true"
                    var="periods" 
                    widgetVar="periods"  
                    rowIndexVar="index" 
                    value="#{periodsListMB.periodsDTOList}"
                    rows="#{userData.rowListCount}" 
                    paginator="true" 
                    selection="#{periodsListMB.periodsDTOSelected}"
                    rowKey="#{periods.index}"
                    sortBy="#{1}"
                    emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                    id="periods">
                    <f:facet name="header">
                        <p:commandButton  styleClass="saddButton" style="float:right" icon="fa fa-plus" title="#{userData.userDDs['ADD']}" action="#{periodsListMB.goToAdd()}" 
                                          />

                        <p:outputPanel  >
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" a:autofocus="true" onkeyup="PF('periods').filter()" style="width:150px" />
                        </p:outputPanel>
                    </f:facet>
                    
                        <p:column headerText="#" style="width: 6vh;font-size: 1.8vh;text-align:right;border-radius: 0px;border-radius: 0px;">
                            <h:outputText value="#{index + 1}"  style="font-size: 1.5vh" />
                        </p:column>

                    <p:column style="text-align: right;font-size: 15px;border-radius: 0px"  
                              filterStyle="display:none" filterBy="#{periods.name}"  
                              filterMatchMode="contains" headerText="اسم الفترة" sortBy="#{periods.name}">
                        <p:outputLabel value="#{periods.name}" />
                    </p:column>
                    <p:column style="text-align: right;font-size: 15px;border-radius: 0px"  
                              filterStyle="display:none" filterBy="#{periods.materialName}"  
                              filterMatchMode="contains" headerText="اسم الماده " sortBy="#{periods.materialName}">
                        <p:outputLabel value="#{periods.materialName}" />
                    </p:column>
                 
                    <p:column style="width:16vh;text-align: center;font-size: 15px;border-radius: 0px"  headerText="#{userData.userDDs['TRANSACTION']}">
                        <p:commandButton update="@form" icon="fa fa-fw fa-edit"
                                         styleClass="seditButtons" style="background-color: #6a6967;border-radius: 3px;margin-bottom:3px"
                                         title="#{userData.userDDs['EDIT']}" action="#{periodsListMB.goToEdit()}"
                                         >
                            <f:setPropertyActionListener value="#{periods.id}"  target="#{periodsListMB.periodsDTOSelected}" />
                        </p:commandButton>
                        <p:commandButton  styleClass="sdeleteButtons" update="question:periods" icon="fa fa-remove" style="background-color: red;border-radius: 3px;margin-bottom:3px"   
                                          title="#{userData.userDDs['DELETE']}"  action="#{periodsListMB.delete()}" 
                                          >
                            <f:setPropertyActionListener value="#{periods}" target="#{periodsListMB.periodsDTO}" />
                            <p:confirm header="Confirmation" message="#{userData.userDDs['ARE_YOU_SURE']}" icon="ui-icon-alert" />
                        </p:commandButton>
                    </p:column>
                </p:dataTable>
                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                    <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                    <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                </p:confirmDialog>

            </p:fieldset>
        </h:form>
    </ui:define>
</ui:composition>
