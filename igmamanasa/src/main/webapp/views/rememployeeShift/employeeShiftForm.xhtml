<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">

        <h:form class='formmargin' id="form"  enctype="multipart/form-data"  dir="#{userData.dir}">

            <p:fieldset legend="تسكين الموظفين بخطوط السير والاتوبيسات"  >


                <div class="col-xs-12">
                    <p:messages autoUpdate="true"  id="msgopp" showDetail="true" closable="true" />
                </div>
                <div  id="firstLine" class="ui-g-12 ui-g-nopad">
                    <div class="ui-g">

                        <div class="ui-g-6 ui-xl-6">

                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText style="width: 35%!important" id="ad1" a:autofocus="true" value="#{employeeShiftFormMB1.remEmployeeShiftDTO.code}"/>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 85px;margin-right: 3%;" value="#{userData.userDDs['CODE']}"/>

                                </div>
                            </div>

                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText style="width: 35%!important" id="ad2" value="#{employeeShiftFormMB1.remEmployeeShiftDTO.name}"/>

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 85px;" value="اسم المسار"/>

                                </div>
                            </div>




                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:autoComplete style="width:36%!important"
                                                    dropdown="true" maxResults="10"
                                                    converter="#{employeeShiftFormMB1.remCompanyDTOConverter}"
                                                    value="#{employeeShiftFormMB1.remEmployeeShiftDTO.remCompanyId}"
                                                    var="remCompany"
                                                    itemLabel="#{remCompany}" 
                                                    itemValue="#{remCompany}"
                                                    forceSelection="true" 
                                                    completeMethod="#{employeeShiftFormMB1.completeRemCompany}"
                                                    >
                                        <p:ajax update="@form"
                                                event="change"
                                                process="@form"
                                                listener="#{employeeShiftFormMB1.updateRemCompany}" />
                                        <p:ajax update="@form"
                                                process="@form"
                                                event="itemSelect"
                                                listener="#{employeeShiftFormMB1.updateRemCompany()}" />
                                    </p:autoComplete>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 111px;" value="اسم المؤسسة"/>

                                </div>
                            </div>



                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:autoComplete style="width:36%!important"
                                                    dropdown="true" maxResults="10"
                                                    converter="#{employeeShiftFormMB1.remTrafficDTOConverter}"
                                                    value="#{employeeShiftFormMB1.remEmployeeShiftDTO.remTrafficId}"
                                                    var="rememployeeShift"
                                                    itemLabel="#{rememployeeShift}" 
                                                    itemValue="#{rememployeeShift}"
                                                    forceSelection="true" 
                                                    completeMethod="#{employeeShiftFormMB1.completeRemTrafficByRemCompanyId1}"
                                                    >

                                    </p:autoComplete>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 111px;" value="خط السير"/>

                                </div>
                            </div>


                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                   <p:autoComplete style="width:36%!important"
                                                        dropdown="true" maxResults="10"
                                                        converter="#{employeeShiftFormMB1.remBusesDTOConverter}"
                                                        value="#{employeeShiftFormMB1.remEmployeeShiftDTO.remBusesId}"
                                                        var="rembuses"
                                                        itemLabel="#{rembuses}" 
                                                        itemValue="#{rembuses}"
                                                        forceSelection="true" 
                                                        completeMethod="#{employeeShiftFormMB1.completeRemBuses}"
                                                        >
                                        </p:autoComplete>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                        <p:outputLabel style="width: 111px" value="الاتوبيس"/>

                                </div>
                            </div>

                          

                        </div>                        
                    </div>
                </div>

            </p:fieldset>

            <div class="asmaa">
                <p:commandButton  class="saveButton"  
                                  id="saveB" 
                                  title="#{userData.userDDs['SAVE']}"
                                  value="#{userData.userDDs['SAVE']}" 
                                  style=""
                                  action="#{employeeShiftFormMB1.save()}" 
                                  update="@form"/>

                <p:commandButton  class="newButton" 
                                  id="newN"
                                  ajax="false"
                                  style=""
                                  value="#{userData.userDDs['NEW']}" 
                                  title="#{userData.userDDs['NEW']}"
                                  onclick="form.target = ''" 
                                  actionListener="#{employeeShiftFormMB1.reset()}"/>

                <p:commandButton class="closeButton" 
                                 title="#{userData.userDDs['BACK']}" 
                                 immediate="true" 
                                 value="#{userData.userDDs['BACK']}" 
                                 style="" 
                                 action="#{employeeShiftFormMB1.exit()}"   />



                <p:blockUI block="form" trigger="saveB" animate="true" >

                    <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                </p:blockUI> 

            </div>

            <div class="ui-g-12 ui-xl-12">


                <p:dataTable id="employeeShiftDetailsTable"
                             reflow="true"
                             var="employeeShiftDetailsTable"
                             rowIndexVar="index" 
                             dir="rtl" 
                             emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                             sortBy="#{1}"
                             selectionMode="single"
                             selection="#{employeeShiftFormMB1.remEmployeeShiftDTO.remEmployeeShiftDetailSelected}"
                             widgetVar="employeeShiftDetailsTable"
                             rowKey="#{employeeShiftDetailsTable.index}"
                             value="#{employeeShiftFormMB1.remEmployeeShiftDTO.remEmployeeShiftDetailList}" >

                    <f:facet name="header" class="col-md-12">
                        <p:commandButton   class="saddButton" id="addnew"
                                           icon="fa fa-plus"
                                           title="#{userData.userDDs['ADD']}" 
                                           actionListener="#{employeeShiftFormMB1.addNewDetail()}" 
                                           update=":form:msgopp employeeShiftDetailsTable"                                         
                                           ajax="true"
                                           style="float:right" />
                        <p:outputPanel>
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" onkeyup="PF('employeeShiftDetailsTable').filter()" style="width:150px" />
                        </p:outputPanel>
                    </f:facet>



                    <p:column style="width: 70vh;font-size: 1.8vh;text-align: right;border-radius: 0px;" headerText="الموظف" >

                        <p:autoComplete id="point"  
                                        style="width:100%"
                                        converter="#{employeeShiftFormMB1.employeeDTOConverter}"
                                        value="#{employeeShiftDetailsTable.employeeId}"
                                        maxResults="10"
                                        var="employee"
                                        itemLabel="#{employee}" 
                                        itemValue="#{employee}" 
                                        forceSelection="true" 
                                        completeMethod="#{employeeShiftFormMB1.completeRemEmployee1}" >
                            <p:ajax listener="#{employeeShiftFormMB1.validateEmployee(employee)}"/>
                        </p:autoComplete>   

                    </p:column>



                    <p:column  >
                        <p:commandButton  id="b7" icon="fa fa-remove" 
                                          class="sdeleteButtons" style="color: #fff!important;background-color: red;"
                                          title="#{userData.userDDs['DELETE']}" 
                                          actionListener="#{employeeShiftFormMB1.deleteDetail(employeeShiftDetailsTable)}" 
                                          update="@form"  
                                          immediate="true"
                                          ajax="true" />
                    </p:column>


                </p:dataTable>
            </div>

        </h:form>
    </ui:define>
</ui:composition>
