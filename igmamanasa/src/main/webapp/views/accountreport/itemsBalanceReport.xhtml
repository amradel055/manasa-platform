<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <p:messages id="curmsg" autoUpdate="true" showDetail="true" showSummary="true" rendered="true" closable="true"/>   
        <f:event listener="#{userData.authorize}" type="preRenderView" />

        <h:form   id="form" dir="#{userData.dir}">


            <p:fieldset legend="أرصدة البنود" id="whole" >

                <div class="ui-g-6 ui-xl-6">
                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <p:selectOneMenu style="width: 51%" 
                                             filter="true" 
                                             filterMatchMode="startsWith"
                                             converter="#{itemsBalanceReportMB.glBankConverter}"
                                             value="#{itemsBalanceReportMB.glBankTo}" > 

                                <f:selectItems value="#{itemsBalanceReportMB.bankTransactionViewLocalList}"  
                                               var="bank"
                                               itemLabel="#{bank}"
                                               itemValue="#{bank}"/>
                            </p:selectOneMenu> 
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 81px;margin-right: 6%"  value="#{userData.userDDs['TO_SAFE']}" />
                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <p:selectOneMenu style="width: 51%" 
                                             filter="true" 
                                             filterMatchMode="startsWith"
                                             converter="#{itemsBalanceReportMB.itemConverterTo}"
                                             value="#{itemsBalanceReportMB.itemTo}" > 
                                <f:selectItems value="#{itemsBalanceReportMB.itemsTo}"  
                                               var="item"
                                               itemLabel="#{item}"
                                               itemValue="#{item}"/>
                            </p:selectOneMenu> 
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 81px;margin-right: 6%"   value="إلى بند" />
                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <p:calendar style="width: 50%"  id="dateTo"
                                        value="#{itemsBalanceReportMB.commonSearchBean.dateTo}"
                                        pattern="dd/MM/yyyy"  showButtonPanel="true" >
                                <p:ajax listener="#{itemsBalanceReportMB.checkDate(false)}" event="dateSelect" update="dateTo"/>
                            </p:calendar>
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 81px;margin-right: 4%"  value="#{userData.userDDs['TO_DATE']}" />
                        </div>
                    </div>
                </div>
                <div class="ui-g-6 ui-xl-6">
                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <p:selectOneMenu  style="width: 51%" id="MACUCode" 
                                              filter="true" 
                                              filterMatchMode="startsWith"
                                              converter="#{itemsBalanceReportMB.glBankConverter}"
                                              value="#{itemsBalanceReportMB.glBankFrom}"> 

                                <f:selectItems value="#{itemsBalanceReportMB.bankTransactionViewLocalList}"  
                                               var="bank"
                                               itemLabel="#{bank}"
                                               itemValue="#{bank}"/>
                            </p:selectOneMenu> 
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 80px;margin-right: 6%" value="#{userData.userDDs['FROM_SAVE']}" />
                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <p:selectOneMenu  style="width: 51%" id="itemfrom" 
                                              filter="true" 
                                              filterMatchMode="startsWith"
                                              converter="#{itemsBalanceReportMB.itemConverterFrom}"
                                              value="#{itemsBalanceReportMB.itemFrom}"> 
                                <f:selectItems value="#{itemsBalanceReportMB.itemsFrom}"  
                                               var="item"
                                               itemLabel="#{item}"
                                               itemValue="#{item}"/>
                            </p:selectOneMenu> 
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 80px;margin-right: 6%"  value="من بند" />
                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <p:calendar style="width: 60%"  id="dateFrom"
                                        value="#{itemsBalanceReportMB.commonSearchBean.dateFrom}"
                                        pattern="dd/MM/yyyy"  showButtonPanel="true" >
                                <p:ajax listener="#{itemsBalanceReportMB.checkDate(true)}" event="dateSelect" update="dateFrom" />
                            </p:calendar>
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 75px;margin-right: 6%"  value="#{userData.userDDs['YEAR_FROM']}" />
                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <p:selectOneMenu style="width:51%;" id="year" filter="true" filterMatchMode="contains"   value="#{itemsBalanceReportMB.glYearSelection}" converter="#{itemsBalanceReportMB.glYearConverter}"   >
                                <p:ajax update=" dateTo" listener="#{itemsBalanceReportMB.pushGlYearSelection()}" />
                                <f:selectItem itemLabel="#{userData.userDDs['CHOOSE']}"  itemValue="" />
                                <f:selectItems value="#{itemsBalanceReportMB.glYearList}"  var="year" itemLabel="#{year.name}" itemValue="#{year}"/>
                            </p:selectOneMenu>
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 80px;margin-right: 6%" value="#{userData.userDDs['Gl_year']}"/>
                        </div>
                    </div>
                </div>


                <div class="centerButtons">

                    <p:commandButton  class="searchButtons"
                                      value="#{userData.userDDs['SEARCH']}"
                                      id="saveB"
                                      action="#{itemsBalanceReportMB.search()}" 
                                      update="dataTable"/>

                    <p:commandButton class="printButtons" 
                                     ajax="false" 
                                     onclick="form.target = '_blank'" 
                                     value="#{userData.userDDs['PRINT']}"
                                     actionListener="#{itemsBalanceReportMB.exportPDF}"/>
                    <h:commandLink class="sdcreenimg">  
                        <p:graphicImage name="/img/excel.jpg" width="24"/>  
                        <p:dataExporter type="xls"
                                        target="dataTable" 
                                        fileName="#{userData.userDDs['SAFES_BANK_BALANCES']}"
                                        postProcessor="#{itemsBalanceReportMB.postProcessXLS}" />  
                    </h:commandLink>
                </div>
                <p:blockUI block="form" trigger="saveB" animate="true" >

                    <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                </p:blockUI> 

            </p:fieldset>

            <p:fieldset>

                <p:dataTable 
                    id="dataTable"  value="#{itemsBalanceReportMB.bankBalanceReportBeanList}" 
                    var="menu"
                    rows="20"
                    paginator="true"
                    widgetVar="bankBalanc">         
                    <f:facet name="header" class="col-md-12">

                        <p:outputPanel>
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large;" />
                            <p:inputText   id="globalFilter"   onkeyup="PF('bankBalanc').filter()" style="width: 50%important" />
                        </p:outputPanel>

                    </f:facet>

                    <p:columnGroup type="header">
                        <p:row>
                            <p:column  style="width: 15vh;border-radius: 0px" rowspan="2" headerText="كود البند"
                                       filterBy="#{menu.bankId}"  filterMatchMode="contains" sortBy="#{menu.itemSerial}" filterable="false"/>
                            <p:column  style="width: 20vh;border-radius: 0px" rowspan="2" headerText="البنـــــد"
                                       filterBy="#{menu.itemName}"  filterMatchMode="contains" sortBy="#{menu.itemName}" filterable="false"/>
                            <p:column style="width: 30vh;border-radius: 0px" colspan="2" headerText="#{userData.userDDs['TRANS_TYPE']}" />
                            <p:column style="width: 20vh;border-radius: 0px" rowspan="2" headerText="#{userData.userDDs['BALANCE']}" />
                        </p:row>
                        <p:row>
                            <p:column style="border-radius: 0px" headerText="#{userData.userDDs['IMPORT']}" 
                                      filterBy="#{menu.debit}"  filterMatchMode="contains" sortBy="#{menu.debit}" filterable="false"/>
                            <p:column style="border-radius: 0px" headerText="#{userData.userDDs['EXPORT']}" 
                                      filterBy="#{menu.credit}"  filterMatchMode="contains" sortBy="#{menu.credit}" filterable="false"/>
                        </p:row>
                    </p:columnGroup>

                    <p:column  style="width: 15vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px">
                        <h:outputText value=" #{menu.itemSerial}" style="font-size:12px"/>
                    </p:column>
                    <p:column style="width: 20vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px">
                        <h:outputText value=" #{menu.itemName}" style="font-size:12px"/>
                    </p:column>
                    <p:column  style="width: 15vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px">
                        <h:outputText value="#{menu.debit}" style="font-size:12px"/>
                    </p:column>
                    <p:column    style="width: 15vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px">
                        <h:outputText value="#{menu.credit}" style="font-size:12px"/>
                    </p:column>

                    <p:column  style="width: 20vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px">
                        <h:outputText value="#{menu.balance}" style="font-size:12px"/>
                    </p:column>
                </p:dataTable> 
            </p:fieldset>
        </h:form>
    </ui:define>
</ui:composition>
