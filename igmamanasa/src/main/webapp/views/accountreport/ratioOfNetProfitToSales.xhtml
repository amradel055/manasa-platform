<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/newTemplate.xhtml"
                xmlns:p="http://primefaces.org/ui"

                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <link rel="stylesheet" type="text/css" href="../../resources/css/main.css" /> 
    <link rel="stylesheet" type="text/css" href="./../../resources/css/custom.css" /> 
    <link rel="stylesheet" href="//cdn.jsdelivr.net/chartist.js/latest/chartist.min.css"/>
    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form id="form" dir="#{userData.dir}" class='formmargin'>
            <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                      margin-top: 22%;
                                      color: #035c70!important; 
                                      background-color: #223238!important;
                                      border: 1px solid #22323a!important;
                                      background: #22323a 50% 50% repeat-x!important;"
                                      icon="fa fa-fw fa-home"
                                      title="#{userData.userDDs['HOME']}"
                                      class="smhomeButton" 
                                      action="exit" />  
            </div>
            <p:fieldset legend="#{userData.userDDs['RAT_NET_PROF_SALES']}">


                <div>
                    <p:messages autoUpdate="true"  id="cupmsg" showDetail="true" closable="true" rendered="true" />   
                </div>
                <div class="ui-g-12 ui-g-nopad back">
                    <div class="ui-g">

                        <div class="ui-g-12 ui-md-6">

                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel  style="width:80px;margin-right: 4%;"  value="#{userData.userDDs['FROM_DATE']}"/>
                                </h:panelGroup>
                                <p:calendar  style="width:50%"  id="dateFrom" value="#{ratioOfNetProfitToSalesMB.commonSearchBean.dateFrom}" pattern="dd/MM/yyyy">
                                    <p:ajax listener="#{ratioOfNetProfitToSalesMB.checkDate(true)}" event="dateSelect" update="form dateFrom"/>
                                </p:calendar>
                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel  style="width:80px;margin-right: 4%;"  value="#{userData.userDDs['TO_DATE']}"/>
                                </h:panelGroup>
                                <p:calendar  style="width:50%"  id="dateTo" value="#{ratioOfNetProfitToSalesMB.commonSearchBean.dateTo}" pattern="dd/MM/yyyy">
                                    <p:ajax listener="#{ratioOfNetProfitToSalesMB.checkDate(false)}" event="dateSelect" update="form dateTo"/>
                                </p:calendar>
                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>

                                <h:panelGroup>
                                    <p:outputLabel style="width:85px;margin-right: 4%;" value="#{userData.userDDs['FINANCE_YEAR']}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:selectOneMenu style="width:51%" id="year" filter="true" filterMatchMode="contains"   value="#{ratioOfNetProfitToSalesMB.glYearSelection}" converter="#{ratioOfNetProfitToSalesMB.glYearConverter}"   >
                                        <p:ajax update=" dateTo dateFrom" listener="#{ratioOfNetProfitToSalesMB.pushGlYearSelection()}" />
                                        <f:selectItem itemLabel="#{userData.userDDs['CHOOSE']}"  itemValue="" />
                                        <f:selectItems value="#{ratioOfNetProfitToSalesMB.glYearList}"  var="year" itemLabel="#{year.name}" itemValue="#{year}"/>
                                    </p:selectOneMenu>
                                </h:panelGroup>

                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">


                            <h:panelGroup></h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">


                            <h:panelGroup></h:panelGroup>
                        </div>
                    </div>
                </div>
                 <div class="ui-g-12 ui-g-nopad back">
                     <div class="ui-g">
                    <div class="ui-g-12 ui-md-6">
                
                    <h:panelGroup>

                        <h:panelGroup>
                            <p:outputLabel   style = "width:85px;font-size: 30px;margin-right: 4%;"  value="#{userData.userDDs['TARGET']}"/>
                        </h:panelGroup>
                        <h:panelGroup>
                            <p:outputLabel    value="#{userData.userDDs['EXP_HW_SUS_COM_COL']}"/>
                        </h:panelGroup>

                    </h:panelGroup>
                        </div>
               
                </div>
                </div>

                <div class="ui-g-12 ui-g-nopad back center-block">
                    <div class="ui-g">

                        <div class="ui-g-12">

                            <h:panelGroup>
                                <div id="piechartOfNetProfitToSales" style="width: 400px; height: 400px; "></div>
                            </h:panelGroup>

                        </div>
                         </div>
                     </div>

                        <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
                        <script type="text/javascript">
                            google.charts.load('current', {'packages': ['corechart']});
                            google.charts.setOnLoadCallback(drawChart);

                            function drawChart() {

                                var data = google.visualization.arrayToDataTable([
                                    ['', ''],
                                    ["#{userData.userDDs['NET_INCOME']}", #{ratioOfNetProfitToSalesMB.totalBalance}],
                                    ["#{userData.userDDs['NET_SALES']}", #{ratioOfNetProfitToSalesMB.valueOfNetSales}]
                                ]);

                                var options = {
                                    title: "#{userData.userDDs['RAT_NET_PROF_SALES']}" + '\n' + "#{userData.userDDs['RESULT']}: %" +#{ratioOfNetProfitToSalesMB.totalRatio},
                                    is3D: true,
                                };
                                var chart = new google.visualization.PieChart(document.getElementById('piechartOfNetProfitToSales'));

                                chart.draw(data, options);
                            }
                        </script>


                        </p:fieldset>
                        </h:form>
                        </ui:define>
                        </ui:composition>
