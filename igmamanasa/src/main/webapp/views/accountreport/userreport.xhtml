<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <link rel="stylesheet" type="text/css" href="../../resources/css/main.css" /> 
    <ui:define name="content">
        <h:body> 
            <f:event listener="#{userData.authorize}" type="preRenderView" />
            <div class="col-xs-12">
                <p:messages autoUpdate="true"  showDetail="true" closable="true" rendered="true" />
                  
            </div>
            
            <h:form  id="form" target="_blank" class='formmargin' dir="#{userData.dir}">
                <p:fieldset legend="#{userData.userDDs['USERS_REPORT']}" >
                    
                    <div class="ui-g-6 ui-xl-6">
                        <div class="ui-g-12 ui-xl-12">
                            
                            <div class="ui-g-8 ui-xl-8">
                                <div class="ui-g-12 ui-xl-12">
                                 <p:inputText style="width:50%!important" id="usercode" value="#{reportsManagedBean.userCode}"/>
                                </div>
                                
                                
                            </div>
                            <div class="ui-g-4 ui-xl-4">
                                <div class="ui-g-12 ui-xl-12">
                                
                                 <p:outputLabel style="width:95px;margin-right: 25px;" value="#{userData.userDDs['USER_CODE']} "/>
                                </div>
                            </div>

                        </div>
                        
                        
                    </div>
                    
                    
                    
                    
                    
                      <div class="ui-g-6 ui-xl-6">
                        <div class="ui-g-12 ui-xl-12">
                            
                            <div class="ui-g-8 ui-xl-8">
                                <div class="ui-g-12 ui-xl-12">
                                        <p:inputText  style="width: 50%!important" id="userN" a:autofocus="true" value="#{reportsManagedBean.userName}" />
                                </div>
                            </div>
                            <div class="ui-g-4 ui-xl-4">
                                 <div class="ui-g-12 ui-xl-12">
                                  <p:outputLabel style="width:95px;margin-right: 25px;" value="#{userData.userDDs['USER_NAME']}"/>
                                 </div>
                            </div>

                        </div>
                        
                        
                    </div>
                   

                          

                             
                                  

                              

                              
                            

                           

                          
                       
                           

                        

                                   

                           

                         
                                   

                           

                   
                 

  <div class="ui-g-12 ui-xl-12 asmaa">
                            <p:commandButton  class="searchButton spacebtweenbutton" 
                                              id="saveB" 
                                              value="#{userData.userDDs['SEARCH']}" 
                                              rendered="#{userData.userScreens['userreport'].view or userData.isAdmin}"
                                              action="#{reportsManagedBean.filter}" update="users" />
                            <p:commandButton  class="newButton spacebtweenbutton" id="new"  
                                              value="#{userData.userDDs['NEW']}"  
                                              action="#" update=""/>
                            <p:commandButton  class="printButton spacebtweenbutton"  
                                              ajax="false"
                                              value="#{userData.userDDs['PRINT']}"  
                                              actionListener="#{reportsManagedBean.exportPDF}"/>
                            
 

                            <h:commandLink  class="sdcreenimg spacebtweenbutton"  >  
                                <p:graphicImage name="/img/excel.jpg" width="24"/>  
                                <p:dataExporter type="xls"
                                                target="users" 
                                                fileName="تقرير المستخدمين"
                                                postProcessor="#{reportsManagedBean.postProcessXLS}" />  
                            </h:commandLink>
  </div>

                            <p:blockUI block="form" trigger="saveB new" animate="true" >

                                <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                            </p:blockUI>

   

             

                </p:fieldset>

                <p:fieldset>

                    <p:dataTable  id="users" value="#{reportsManagedBean.users}" var="user" >

                        <f:facet name="header" class="col-md-12">
                            <p:commandButton icon="fa fa-plus" 
                                             title="#{userData.userDDs['ADD']}" 
                                             class="saddButton"
                                             action="#{branchListBean.goToAdd()}" 
                                             style="float:right;margin: 0"
                                             rendered="#{userData.userScreens['branch'].add or userData.isAdmin}"/>
                            <p:outputPanel  >
                                <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large;" />
                                <p:inputText id="globalFilter" a:autofocus="true" onkeyup="PF('user').filter()" style="width: 16%!important;" />
                            </p:outputPanel>
                        </f:facet>

                        <p:column style="text-align: right;font-size: 15px;border-radius: 0px"  headerText="#{userData.userDDs['USER_NAME']}">
                            <h:outputText style="text-align: right;font-size: 12px"  value="#{user.name}"/>
                        </p:column>
                        <p:column style="text-align: right;font-size: 15px;border-radius: 0px"  headerText="#{userData.userDDs['USER_CODE']}">
                            <h:outputText style="text-align: right;font-size: 12px" value="#{user.userCode}"/>
                        </p:column>
                    </p:dataTable>
                </p:fieldset>
            </h:form>
        </h:body>
    </ui:define>
</ui:composition>
