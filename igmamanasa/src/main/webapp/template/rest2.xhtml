<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      lang="en">
    <script src="https://kit.fontawesome.com/d696a84704.js" crossorigin="anonymous"></script>

    <h:head>
        <f:facet name="first">
            <meta http-equiv="X-UA-Compatible" content="IE=edge" />
            <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
            <meta name="apple-mobile-web-app-capable" content="yes" />
        </f:facet>
        <p:idleMonitor timeout="1200001" >
            <p:ajax event="idle" listener="#{loginBean.logout}"/>
        </p:idleMonitor>
        <title><ui:insert name="title">IGMA</ui:insert></title>
        <h:outputScript name="js/nanoscroller.js" library="serenity-layout" />
        <h:outputScript name="js/layout.js" library="serenity-layout" />
        <h:outputScript name="js/ripple.js" library="serenity-layout" />
        <ui:insert name="head"/>
    </h:head>

    <h:body>

        <div class="layout-wrapper #{guestPreferences.orientationRTL ? 'layout-rtl' : null} #{guestPreferences.horizontal ? 'layout-menu-horizontal' : null}">
            <ui:include src="./sidebar_1.xhtml" />

            <div class="layout-main">
                <ui:include src="./topbar_1.xhtml" />

                
                <div class="layout-content">
                    <ui:insert name="content"/>
                </div>

                <ui:include src="./config_1.xhtml" />

                <ui:include src="./footer_1.xhtml" />

                <div class="layout-main-mask"></div>
            </div>
        </div>

        <p:ajaxStatus style="width:32px;height:32px;position:fixed;right:7px;bottom:7px">
            <f:facet name="start">
                <i class="fa fa-circle-o-notch fa-spin ajax-loader" aria-hidden="true"></i>
            </f:facet>

            <f:facet name="complete">
                <h:outputText value="" />
            </f:facet>
        </p:ajaxStatus>
        <h:outputStylesheet name="css/nanoscroller.css" library="serenity-layout" />
        <h:outputStylesheet name="css/ripple.css" library="serenity-layout" />
        <h:outputStylesheet name="css/layout-#{guestPreferences.layout}.css" library="serenity-layout" />
        <link href="#{request.contextPath}/resources/customcss/#{userData.dir.equalsIgnoreCase('RTL') ? 'custom2.css' : 'customEN2.css'}" rel="stylesheet"/>
    </h:body>

</html>
