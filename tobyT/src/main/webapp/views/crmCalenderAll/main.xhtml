<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns="http://www.w3.org/1999/xhtml" >
    <ui:define name="content">
        <h:head>
            <title>#{userData.userDDs['SERVICES_DIRECT']}</title>
        </h:head>
        <style type="text/css">
            .value {
                width: 1000px;
            }
        </style>


        <h:form>
            <p:growl id="messages" showDetail="true" />
            
            <h:panelGrid columnClasses="value">
                <p:schedule id="schedule" value="#{CrmCalenderAll.eventModel}" widgetVar="myschedule" >
                    <p:ajax event="dateSelect" listener="#{CrmCalenderAll.onDateSelect}" update="dialogueCRM" oncomplete="PF('dialogueCRM').show();" />
                    <p:ajax event="eventSelect" listener="#{CrmCalenderAll.onEventSelect}"   update="dialogueCRM" oncomplete="PF('dialogueCRM').show();" />

                </p:schedule>
            </h:panelGrid>


            <p:dialog class="dialogueCRM" id="dialogueCRM" header="إضافة مهمة جديدة" widgetVar="dialogueCRM" minHeight="40">

                <p:commandButton id="t1"  style="z-index: 2;
                                 margin-top: 3%;
                                 color: #035c70!important; 
                                 background-color: #{CrmCalenderAll.crmEventDTO.type eq 0 ? '#CCCCCC!important' : '#223238'};
                                 border: 1px solid #22323a!important;
                                 background: #{CrmCalenderAll.crmEventDTO.type eq 0 ? '#CCCCCC!important' : '#22323a'} 50% 50% repeat-x!important;"
                                 value="إضافة مهمة" update="t1 t2"
                                 title="إضافة مهمة" rendered="#{CrmCalenderAll.crmEventDTO.id eq null}"
                                 class="addnewwidget" 
                                 action="#{CrmCalenderAll.updateTODOValue()}" />  

                <p:commandButton id="t2" style="z-index: 2;
                                 margin-top: 3%;
                                 color: #035c70!important; 
                                 background-color: #{CrmCalenderAll.crmEventDTO.type eq 1 ? '#CCCCCC!important' : '#223238'};
                                 border: 1px solid #22323a!important;
                                 background: #{CrmCalenderAll.crmEventDTO.type eq 1 ? '#CCCCCC!important' : '#22323a'} 50% 50% repeat-x!important;"
                                 value="إضافة جديد" update="t1 t2"
                                 title="إضافة جديد" rendered="#{CrmCalenderAll.crmEventDTO.id eq null}"
                                 class="addnewwidget" 
                                 action="#{CrmCalenderAll.updateEventValue()}" />

                <div class="ui-g-12 ui-g-nopad"  >
                    <div class="ui-g">

                        <div class="ui-g-12 ui-md-6">

                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 97px;margin-right: 4%;" value="الموضوع"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:inputText  style="width: 50%!important"  id="employeeName"  
                                                  rendered="#{CrmCalenderAll.crmEventDTO.id eq null}"
                                                  value="#{CrmCalenderAll.crmEventDTO.subject}">
                                    </p:inputText>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:outputLabel style="width: 52%!important" 
                                                   rendered="#{CrmCalenderAll.crmEventDTO.id ne null}"
                                                   value="#{CrmCalenderAll.crmEventDTO.subject}"/>
                                </h:panelGroup>
                            </h:panelGroup>

                        </div>




                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 73px;margin-right: 4%;" value="اسم المتابع"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:autoComplete style="width:36.5%!important " 
                                                    rendered="#{CrmCalenderAll.crmEventDTO.id eq null}"
                                                    dropdown="true"
                                                    converter="#{CrmCalenderAll.employeeDTOConverter}"
                                                    value="#{CrmCalenderAll.crmEventDTO.assignedTo}"
                                                    var="employee"
                                                    itemLabel="#{employee}" 
                                                    itemValue="#{employee}" 
                                                    forceSelection="true" 
                                                    completeMethod="#{CrmCalenderAll.completeEmployeeFollowDTO}"
                                                    >

                                    </p:autoComplete>

                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 52%!important" 
                                                   rendered="#{CrmCalenderAll.crmEventDTO.id ne null}"
                                                   value="#{CrmCalenderAll.crmEventDTO}"/>
                                </h:panelGroup>
                            </h:panelGroup>



                        </div>

                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">
                            <h:panelGroup>
                                <p:outputLabel style="margin-right: 5%;" value="تاريخ  وتوقيت  البداية" />
                                <h:panelGroup>
                                    <p:outputLabel style="width: 52%!important" 
                                                   rendered="#{CrmCalenderAll.crmEventDTO.id ne null}"
                                                   value="#{CrmCalenderAll.crmEventDTO.startDate}">
                                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm:ss" />
                                    </p:outputLabel>
                                </h:panelGroup>

                                <p:calendar id="datetime1" 
                                            rendered="#{CrmCalenderAll.crmEventDTO.id eq null}"
                                            value="#{CrmCalenderAll.crmEventDTO.startDate}" pattern="MM/dd/yyyy HH:mm:ss" />


                            </h:panelGroup>
                        </div>

                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">
                            <h:panelGroup>
                                <p:outputLabel style="margin-right: 5%;" value="تاريخ  وتوقيت  النهاية" />
                                <p:outputLabel style="width: 52%!important" 
                                               rendered="#{CrmCalenderAll.crmEventDTO.id ne null}"
                                               value="#{CrmCalenderAll.crmEventDTO.endDate}">
                                    <f:convertDateTime pattern="dd/MM/yyyy HH:mm:ss" />
                                </p:outputLabel>
                                <p:calendar id="datetime11" 
                                            rendered="#{CrmCalenderAll.crmEventDTO.id eq null}"
                                            value="#{CrmCalenderAll.crmEventDTO.endDate}" pattern="MM/dd/yyyy HH:mm:ss" />

                            </h:panelGroup>
                        </div>

                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width:105px;margin-right: 5%"  value="الحاله" />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 52%!important" 
                                                   rendered="#{CrmCalenderAll.crmEventDTO.id ne null}"
                                                   value="#{CrmCalenderAll.crmEventDTO.status}"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:autoComplete style="width:36.5%!important " 
                                                    rendered="#{CrmCalenderAll.crmEventDTO.id eq null}"
                                                    dropdown="true"
                                                    converter="#{CrmCalenderAll.leadStatusDTOconverter}"
                                                    value="#{CrmCalenderAll.crmEventDTO.status}"
                                                    var="leadStatus"
                                                    itemLabel="#{leadStatus}" 
                                                    itemValue="#{leadStatus}" 
                                                    forceSelection="true" 
                                                    completeMethod="#{CrmCalenderAll.completeLeadStatus}"
                                                    >

                                    </p:autoComplete>
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>

                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">
                            <h:panelGroup >
                                <h:panelGroup>
                                    <p:outputLabel style="width:105px;margin-right: 5%"  value="نوع النشاط" />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 52%!important" 
                                                   rendered="#{CrmCalenderAll.crmEventDTO.id ne null}"
                                                   value="#{CrmCalenderAll.crmEventDTO.activityType}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:autoComplete style="width:36.5%!important " 
                                                    rendered="#{CrmCalenderAll.crmEventDTO.id eq null}"
                                                    dropdown="true"
                                                    converter="#{CrmCalenderAll.activityTypeDTOconverter}"
                                                    value="#{CrmCalenderAll.crmEventDTO.activityType}"
                                                    var="activityType"
                                                    itemLabel="#{activityType}" 
                                                    itemValue="#{activityType}" 
                                                    forceSelection="true" 
                                                    completeMethod="#{CrmCalenderAll.completeActivityType}"
                                                    >

                                    </p:autoComplete>
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>

                        <div>
                            <panelGrid class="centerButtons col-md-12">

                                <h:panelGroup>
                                    <p:commandButton   class="saveButtons"  
                                                       rendered="#{CrmCalenderAll.crmEventDTO.id eq null}"
                                                       id="saveB" 
                                                       title="#{userData.userDDs['SAVE']}"
                                                       value="#{userData.userDDs['SAVE']}" 
                                                       style="color: #ecf0f1!important;border-radius: 5px;
                                                       height: 30px;background-color: #270e80f0 !important;margin-left: 5px;"
                                                       action="#{CrmCalenderAll.saveEventToDO()}" 
                                                       update="@form" />
                                    <p:commandButton  class="closeButton" id="cancelC" 
                                                      title="#{userData.userDDs['CANCEL']}" 
                                                      value="#{userData.userDDs['CANCEL']}" onclick="PF('dlg1').hide();" 
                                                      style="color: #ecf0f1!important;background-color: #009688!important;margin-left: 5px" 
                                                      update="@form"/>

                                    <p:commandButton  class="fullButton" id="cancelC1" 
                                                      title="استمارة كاملة" ajax="false"
                                                      onclick="form.target = '_blank'"
                                                      value="استمارة كاملة" action="#{CrmCalenderAll.goToEdit()}" 
                                                      style="color: #ecf0f1!important;background-color: #22323a!important;margin-left: 5px" 
                                                      update="@form"/>



                                </h:panelGroup>
                            </panelGrid>
                        </div>

                    </div>


                </div>


            </p:dialog>

        </h:form>






    </ui:define>
</ui:composition>
