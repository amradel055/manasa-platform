<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
                >
    <ui:define name="content">
        <h:body>

            <h:form dir="RTL" style="margin-right: 20px" id="form" >
                <p:fieldset  legend="حركه اوامر الشغل" id="stages"  style="margin-bottom:20px">
                    <div class="ui-g-6 ui-xl-6">
                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">
                                <p:selectOneMenu  value="#{proProductionTransactionListMB.proProductionId}" 
                                                  converter="#{proProductionTransactionListMB.proProductionStagesDTOConverter}"
                                                  >
                                    <f:selectItems  var="stages"  value="#{proProductionTransactionListMB.proProductionStagesDTOs}"                                                     
                                                    itemLabel="#{stages.name}"
                                                    itemValue="#{stages}" />
                                    <p:ajax  listener="#{proProductionTransactionListMB.check()}" update="@form" />
                                </p:selectOneMenu>

                            </div>
                            <div class="ui-g-6 ui-xl-6">


                                <p:outputLabel style="width: 50px;margin-right: 1%" value=" مراحل الانتاج"/>


                            </div>
                        </div>
                    </div>

                   
                </p:fieldset>
                <p:fieldset  legend="الفواتيرالتابعه للمرحله" id="whole"  style="margin-bottom:20px">
                    <p:dataTable  id="table1"
                                  var="table1"
                                  value="#{proProductionTransactionListMB.proProductionTransactionDTOList}"
                                  paginator="true"
                                  rows="7"
                                  widgetVar="table1"
                                  rowIndexVar="index" 
                                  emptyMessage="EMPTY_TABLE"
                                  selectionMode="single"
                                  selection="#{proProductionTransactionListMB.proProductionTransactionDTO}"
                                  rowKey="#{table1.invPurchaseInvoiceId}"

                                  >
                        <p:ajax event="rowSelect"  listener="#{proProductionTransactionListMB.selectUserRole1}" update="@form" />
                        <f:facet name="header" class="col-md-12">
                            <p:outputPanel  >
                                <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large;" />
                                <p:inputText id="globalFilter" onkeyup="PF('table1').filter()" style="width: 50%important" />
                            </p:outputPanel>
                        </f:facet>
                        <p:column headerText="رقم الفاتورة" style="width: 10vh;text-align: center!important;font-size: 1.8vh"
                                  filterStyle="display:none"
                                  filterBy="#{table1.serial}"  
                                  filterMatchMode="contains" 
                                  sortBy="#{table1.serial}" 
                                  >
                            <h:outputText value="#{table1.serial}" />
                        </p:column>
                        
                        <p:column headerText="كود المعرض" style="width: 10vh;text-align: center!important;font-size: 1.8vh"
                                  filterStyle="display:none"
                                  filterBy="#{table1.gallaryCode}"  
                                  filterMatchMode="contains" 
                                  sortBy="#{table1.gallaryCode}" 
                                  >
                            <h:outputText value="#{table1.gallaryCode}" />
                        </p:column>
                        
                        <p:column headerText="اسم المعرض" style="width: 10vh;text-align: center!important;font-size: 1.8vh"
                                  filterStyle="display:none"
                                  filterBy="#{table1.gallaryName}"  
                                  filterMatchMode="contains" 
                                  sortBy="#{table1.gallaryName}" 
                                  >
                            <h:outputText value="#{table1.gallaryName}" />
                        </p:column>
                        
                        <p:column  style="width: 12vh;font-size: 1.8vh;text-align:center;border-radius: 0px;" headerText="#{userData.userDDs['TRANSACTION']}" >
                            <p:commandButton  
                                class="smsearchButtons"
                                icon="fa fa-fw fa-search-plus"  
                                style="background-color: rgba(63, 81, 181, 0.88);border-radius: 3px;"
                                onclick="form.target = '_blank'"  ajax="false"
                                title="#{userData.userDDs['VIEW']}" 
                                action="#{proProductionTransactionListMB.goToDetail()}"  >

                                <f:setPropertyActionListener value="#{table1}" 
                                                             target="#{proProductionTransactionListMB.proProductionTransactionDTO}" />
                            </p:commandButton>

                        </p:column>




                    </p:dataTable>
                </p:fieldset>



                <p:fieldset  legend="الثياب"   style="margin-bottom:20px">

                    <p:dataTable  id="table2"
                                  var="table2"
                                  value="#{proProductionTransactionListMB.productNumberDTOList}"
                                  draggableColumns="true"
                                  paginator="true" 
                                  widgetVar="table2" 
                                  rows="7"
                                  rowIndexVar="index" 
                                  emptyMessage="EMPTY_TABLE"
                                  selectionMode="single"
                                  selection="#{proProductionTransactionListMB.proProductionProductNumberDTO}"
                                  rowKey="#{table2.index}"
                                  >
                        <p:ajax event="rowSelect"  listener="#{proProductionTransactionListMB.selectUserRole3}" update="@form " />
                        <p:column headerText="ثوب رقم" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{table2.productNumber}" />
                        </p:column>

                    </p:dataTable>
                </p:fieldset>

                <h:panelGroup>
                    <h:panelGroup>
                        <p:outputLabel style="width: 50px;margin-right: 1%" value="من  ثوب"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <p:inputText  style="width: 50px;margin-right: 1%" value="#{proProductionTransactionListMB.fromNumber}"/>
                    </h:panelGroup>
                </h:panelGroup>
                <h:panelGroup>
                    <h:panelGroup>
                        <p:outputLabel style="width: 50px;margin-right: 1%" value="الي  ثوب"/>
                    </h:panelGroup>
                    <h:panelGroup>
                        <p:inputText style="width: 50px;margin-right: 1%"  value="#{proProductionTransactionListMB.toNumber}"/>
                    </h:panelGroup>
                </h:panelGroup>
                <h:panelGroup>
                    <p:commandButton     class="saveButton"  
                                         title="تنفيذ"
                                         value="تنفيذ" 
                                         icon="fa fa-fw fa-save" 
                                         action="#{proProductionTransactionListMB.saveAll()}" 
                                         update=":form:messages table4 table2"
                                         >

                        <f:setPropertyActionListener value="#{table4}"
                                                     target="#{proProductionTransactionListMB.proProductionTransactionDetailDetailViewDTOSelected}" >


                        </f:setPropertyActionListener>

                    </p:commandButton> 
                </h:panelGroup>

                <p:messages id="messages" showDetail="true" closable="true"/> 
                <p:fieldset  legend="الاصناف"   style="margin-bottom:20px">

                    <p:dataTable  id="table4"
                                  var="table4"
                                  value="#{proProductionTransactionListMB.detailDetailDetailViewDTOList}"
                                  draggableColumns="true"
                                  paginator="true" 
                                  widgetVar="table4" 
                                  rows="7"
                                  selection="#{proProductionTransactionListMB.proProductionTransactionDetailDetailViewDTOSelected}"
                                  rowIndexVar="index" 
                                  emptyMessage="EMPTY_TABLE"
                                  rowKey="#{table4.index}"
                                  >
                        <p:column id="invItem" headerText="صنف" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{table4.invItemName}"/>  



                        </p:column>
                        <p:column id="quantity" headerText="العدد" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{table4.quantity}"/> 
                        </p:column>
                        <p:column id="numberRemain" headerText="الكميه المتبقيه " style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{table4.numberRemain}" />
                        </p:column>
                        <p:column headerText="الكميه المنفذه " style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:inputText value="#{table4.numberExcute}" rendered="#{table4.numberRemain > 0}"  />
                        </p:column>
                        <p:column headerText="الحركة " style="width: 10vh;text-align: -webkit-auto" >
                            <p:commandButton     class="saveButton"  
                                                 style="width: 10vh;text-align: -webkit-auto"
                                                 title="تم الانتهاء"
                                                 value="تم النتهاء" 
                                                 icon="fa fa-fw fa-save" 
                                                 action="#{proProductionTransactionListMB.save()}" 
                                                 update=":form:messages table4"
                                                 >

                                <f:setPropertyActionListener value="#{table4}"
                                                             target="#{proProductionTransactionListMB.proProductionTransactionDetailDetailViewDTOSelected}" >


                                </f:setPropertyActionListener>

                            </p:commandButton> 


                        </p:column>

                    </p:dataTable>
                </p:fieldset>
            </h:form>
        </h:body>
    </ui:define>
</ui:composition>
