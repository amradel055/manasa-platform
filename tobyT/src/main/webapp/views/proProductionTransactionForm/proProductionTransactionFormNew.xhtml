<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
                >
    <ui:define name="content">
        <h:body>

            <h:form dir="RTL" style="margin-right: 20px" id="form" >
                <p:fieldset  legend="حركه اوامر الشغل" id="stages"  style="margin-bottom:20px">

                    <div class="ui-g-6 ui-xl-6">
                        <div class="ui-g-12 ui-xl-12">

                            <div class="ui-g-6 ui-xl-6">

                                <p:selectOneMenu id="advanced" value="#{proProductionTransactionFormMBNew.proProductionStagesDTOSelected}" 
                                                 converter="#{proProductionTransactionFormMBNew.proProductionStagesDTOConverter}"
                                                 filter="true" filterMatchMode="contains" style="width: 59%">

                                    <f:selectItems value="#{proProductionTransactionFormMBNew.proProductionStagesDTOList}" var="country"
                                                   itemLabel="#{country.name}" itemValue="#{country}"/>
                                </p:selectOneMenu>

                            </div>

                            <div class="ui-g-6 ui-xl-6">
                                <p:outputLabel style="width: 50px;" value=" مراحل الانتاج"/>

                            </div>

                        </div>
                    </div>

                    <div class="ui-g-6 ui-xl-6">
                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">    
                                <div class="p-field p-col-6 p-md-6">
                                    <p:selectOneMenu id="user" filter="true" filterMatchMode="contains" value="#{proProductionTransactionFormMBNew.tobyUserDTOSelected}"
                                                     converter="#{proProductionTransactionFormMBNew.tobyUserDTOConverter}">
                                        <f:selectItem itemLabel="اختر العامل" itemValue=""/>
                                        <f:selectItems var="user" itemLabel="#{user}" itemValue="#{user}" value="#{proProductionTransactionFormMBNew.tobyUserDTOList}"/>
                                        <p:ajax event="itemSelect" listener="#{proProductionTransactionFormMBNew.changeUser()}" update="advanced" />
                                    </p:selectOneMenu>
                                </div>

                            </div>
                            <div class="ui-g-6 ui-xl-6">
                                <p:outputLabel style="width: 50px;" value="العامل"/>
                            </div>
                        </div>
                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">
                                <p:inputText value="#{proProductionTransactionFormMBNew.invInvoiceSerial}" />
                            </div>
                            <div class="ui-g-6 ui-xl-6">
                                <p:outputLabel style="width: 50px;" value="رقم الفاتورة"/>
                            </div>
                        </div>
                    </div>

                    <div class="ui-g-12 ui-xl-12" style="text-align: center">
                        <p:commandButton     class="saveButton"  
                                             title="بحث"
                                             value="بحث" 
                                             icon="fa fa-fw fa-save" 
                                             action="#{proProductionTransactionFormMBNew.updateDetailItems()}" 
                                             update="table4"
                                             >
                        </p:commandButton> 
                        <p:commandButton     class="saveButton"   id="saveB"
                                                 value="حفظ الكل" 
                                                 icon="fa fa-fw fa-save" 
                                                 action="#{proProductionTransactionFormMBNew.saveAll()}" 
                                                 update="@form"
                                                 style="float:right"
                                                 />
                    </div>








                </p:fieldset>

                <p:messages id="messages" showDetail="true" closable="true"/> 
                <p:fieldset  legend="الاصناف"   style="margin-bottom:20px">

                    <p:dataTable  id="table4"
                                  var="table4"
                                  value="#{proProductionTransactionFormMBNew.detailDetailDetailViewDTOList}"
                                  draggableColumns="true"
                                  paginator="true" 
                                  widgetVar="table4" 
                                  rows="7"
                                  selection="#{proProductionTransactionFormMBNew.proProductionTransactionDetailDetailViewDTOSelected}"
                                  rowIndexVar="index" 
                                  emptyMessage="EMPTY_TABLE"
                                  rowKey="#{table4.index}"
                                  >

                        <f:facet name="header" > 
                            
                        </f:facet>

                        <p:column id="invItem" headerText="صنف" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{table4.invItemName}"/> 
                        </p:column>
                        <p:column id="quantity" headerText="العدد" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{table4.quantity}"/> 
                        </p:column>
                        <p:column id="numberRemain" headerText="الكميه المتبقيه " style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{table4.numberRemain}" />
                        </p:column>
                        <p:column headerText="الكميه المنفذه " style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:inputText value="#{table4.numberExcute}" rendered="#{table4.numberRemain > 0}"  />
                        </p:column>
                        <p:column headerText="الحركة " style="width: 10vh;text-align: -webkit-auto" >
                            <p:commandButton     class="saveButton"  
                                                 style="width: 10vh;text-align: -webkit-auto"
                                                 title="تم الانتهاء"
                                                 value="تم النتهاء" 
                                                 icon="fa fa-fw fa-save" 
                                                 rendered="#{table4.numberRemain > 0 }"
                                                 action="#{proProductionTransactionFormMBNew.save()}" 
                                                 update=":form:messages table4"
                                                 >

                                <f:setPropertyActionListener value="#{table4}"
                                                             target="#{proProductionTransactionFormMBNew.proProductionTransactionDetailDetailViewDTOSelected}" >


                                </f:setPropertyActionListener>

                            </p:commandButton> 


                        </p:column>

                    </p:dataTable>
                </p:fieldset>
                <p:blockUI block="form" trigger="saveB" animate="true" >

                    <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                </p:blockUI> 
            </h:form>
        </h:body>
    </ui:define>
</ui:composition>
