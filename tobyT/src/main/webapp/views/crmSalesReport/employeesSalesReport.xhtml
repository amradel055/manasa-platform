<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns="http://www.w3.org/1999/xhtml" >
    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />   

        <h:head>
            <title>تقييم مبيعات الموظفين</title>
            <a href="dashboard.xhtml"></a>
        </h:head>
        <style>

            .ui-widget-content .ui-state-default, .ui-widget-header .ui-state-default {
                border: 1px solid #c5dbec;
                background:none;
            }
            .z-index{
                z-index: 999999 !important;
            }
        </style>
        <h:form id="form" class='formmargin'>



            <div style=" position: absolute;left: 20px">

                <p:commandButton  style="z-index: 2;
                                  margin-top: 3%;
                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;"
                                  icon="fa fa-fw fa-home"
                                  title="#{userData.userDDs['HOME']}"
                                  class="smhomeButton" 
                                  action="exit" />

            </div>

            <p:fieldset styleClass="panelColumns" legend="تقييم مبيعات الموظفين">
                <p:messages autoUpdate="true"  id="messages" showDetail="true" closable="true" /> 
                <div id="content2" class="content" dir="#{userData.dir}"  >  
                    <ui:insert name="content2">
                        <div class="ui-g-12 ui-g-nopad"  >
                            <div class="ui-g partThree">
                                <div class="ui-g-12 ui-md-12 fromDate">
                                    <p:outputLabel style="width:99px;margin-right: 3%"  value="من تاريخ" />
                                    <p:calendar id="datetime11" value="#{crmGlobalChart.fromDate}"  pattern="dd/MM/yyyy">
                                        <p:ajax  event="dateSelect" listener="#{crmGlobalChart.filterSearch()}" update="pieModelAssignedTo pieModelAssignedTo2 pieModelAssignedToAndStatus pieModelAssignedToAndStatus2 pieModelEventAssignedTo pieModelEventAssignedTo2 pieModelEventAssignedToAndStatus pieModelEventAssignedToAndStatus2 barModelContract"/>
                                        <p:ajax  event="change" listener="#{crmGlobalChart.filterSearch()}" update="pieModelAssignedTo pieModelAssignedTo2 pieModelAssignedToAndStatus pieModelAssignedToAndStatus2 pieModelEventAssignedTo pieModelEventAssignedTo2 pieModelEventAssignedToAndStatus pieModelEventAssignedToAndStatus2 barModelContract"/>
                                    </p:calendar>
                                </div>
                                <div class="ui-g-12 ui-md-6 toDate" style="margin-top: -1%;padding-bottom: 2%;">
                                    <p:outputLabel style="width:99px;margin-right: 6%"  value="الي تاريخ" />
                                    <p:calendar id="datetime2"  value="#{crmGlobalChart.toDate}" pattern="dd/MM/yyyy">
                                        <p:ajax  event="dateSelect" listener="#{crmGlobalChart.filterSearch()}" update="pieModelAssignedTo pieModelAssignedTo2 pieModelAssignedToAndStatus pieModelAssignedToAndStatus2 pieModelEventAssignedTo pieModelEventAssignedTo2 pieModelEventAssignedToAndStatus pieModelEventAssignedToAndStatus2 barModelContract"/>
                                        <p:ajax  event="change" listener="#{crmGlobalChart.filterSearch()}" update="pieModelAssignedTo pieModelAssignedTo2 pieModelAssignedToAndStatus pieModelAssignedToAndStatus2 pieModelEventAssignedTo pieModelEventAssignedTo2 pieModelEventAssignedToAndStatus pieModelEventAssignedToAndStatus2 barModelContract"/>
                                    </p:calendar>
                                </div>
                                <div class="ui-g-12 ui-md-6">
                                    <p:selectOneMenu   style="width:55%!important;right: 22%; "  value="#{crmGlobalChart.status}"    converter="#{crmLeadsFormDTOMB.leadStatusDTOconverter}">
                                        <f:selectItems value="#{crmLeadsFormDTOMB.leadStatusDTOList}" var="status" itemLabel="#{status}" itemValue="#{status}"/> 
                                        <p:ajax listener="#{crmGlobalChart.createPieModelByAssignedToAndStatus()}" update="pieModelAssignedToAndStatus pieModelAssignedToAndStatus2"  />
                                    </p:selectOneMenu>
                                </div>


                                <p:chart type="pie" id="pieModelAssignedTo" model="#{crmGlobalChart.pieModelAssignedTo}" style="width:320px;height:320px;display:block;margin: 0 auto;" />
                                <p:commandButton  
                                    class="smsearchButtons"
                                    icon="fa fa-fw fa-search-plus"  style="background-color: rgba(63, 81, 181, 0.88);border-radius: 3px;"
                                    title="#{userData.userDDs['VIEW']}" 
                                    onclick="PF('pieModelAssignedToVar').show();" />
                                <p:dialog widgetVar="pieModelAssignedToVar" class="z-index" >
                                    <p:chart type="pie" id="pieModelAssignedTo2" model="#{crmGlobalChart.pieModelAssignedTo}" style="width:600px;height:800px;display:block;margin: 0 auto;" />
                                </p:dialog>
                                <p:chart type="pie" id="pieModelAssignedToAndStatus" model="#{crmGlobalChart.pieModelAssignedToAndStatus}" style="width:320px;height:320px;display:block;margin: 0 auto;" />
                                <p:commandButton  
                                    class="smsearchButtons"
                                    icon="fa fa-fw fa-search-plus"  style="background-color: rgba(63, 81, 181, 0.88);border-radius: 3px;"
                                    title="#{userData.userDDs['VIEW']}" 
                                    onclick="PF('pieModelAssignedToAndStatusVar').show();" />
                                <p:dialog widgetVar="pieModelAssignedToAndStatusVar" class="z-index" >
                                    <p:chart type="pie" id="pieModelAssignedToAndStatus2" model="#{crmGlobalChart.pieModelAssignedToAndStatus}" style="width:600px;height:800px;display:block;margin: 0 auto;" />
                                </p:dialog>

                                <div class="ui-g-12 ui-md-12">
                                    <p:selectOneMenu   style="width:27%!important; float: left; left: 11%; "    value="#{crmGlobalChart.eventStatus}"    converter="#{crmLeadsFormDTOMB.eventStatusDTOconverter}">
                                        <f:selectItems value="#{crmLeadsFormDTOMB.eventStatusDTOList}" var="status" itemLabel="#{status}" itemValue="#{status}"/> 
                                        <p:ajax listener="#{crmGlobalChart.createPieModelByEventAssignedToAndStatus()}" update="pieModelEventAssignedToAndStatus pieModelEventAssignedToAndStatus2"  />
                                    </p:selectOneMenu>
                                </div>

                                <p:chart type="pie" id="pieModelEventAssignedTo" model="#{crmGlobalChart.pieModelEventAssignedTo}" style="width:320px;height:320px;display:block;margin: 0 auto;" />
                                <p:commandButton  
                                    class="smsearchButtons"
                                    icon="fa fa-fw fa-search-plus"  style="background-color: rgba(63, 81, 181, 0.88);border-radius: 3px;"
                                    title="#{userData.userDDs['VIEW']}" 
                                    onclick="PF('pieModelEventAssignedTovar').show();" />
                                <p:dialog widgetVar="pieModelEventAssignedTovar" class="z-index" >
                                    <p:chart type="pie" id="pieModelEventAssignedTo2" model="#{crmGlobalChart.pieModelEventAssignedTo}" style="width:600px;height:800px;display:block;margin: 0 auto;" />
                                </p:dialog>

                                <p:chart type="pie" id="pieModelEventAssignedToAndStatus" model="#{crmGlobalChart.pieModelEventAssignedToAndStatus}" style="width:320px;height:320px;display:block;margin: 0 auto;" responsive="true" />
                                <p:commandButton  
                                    class="smsearchButtons"
                                    icon="fa fa-fw fa-search-plus"  style="background-color: rgba(63, 81, 181, 0.88);border-radius: 3px;"
                                    title="#{userData.userDDs['VIEW']}" 
                                    onclick="PF('pieModelEventAssignedToAndStatusVar').show();" />
                                <p:dialog widgetVar="pieModelEventAssignedToAndStatusVar" class="z-index" >
                                    <p:chart type="pie" id="pieModelEventAssignedToAndStatus2" model="#{crmGlobalChart.pieModelEventAssignedToAndStatus}" style="width:600px;height:800px;display:block;margin: 0 auto;" responsive="true" />
                                </p:dialog>
                            </div>
                            <p:chart type="bar" id="pieModelEventAssignedTo3" model="#{crmGlobalChart.barModelEventAssignedTo}" style="width:1100px;height:320px;display:block;margin: 0 auto;direction: ltr" />
                      
                            <p:chart type="bar" id="barModelContract" model="#{crmGlobalChart.barModelContract}" style="width:1100px;height:320px;display:block;margin: 0 auto;direction: ltr" />

                        </div>


                    </ui:insert>


                </div>

            </p:fieldset> 
        </h:form>
    </ui:define>
</ui:composition>
