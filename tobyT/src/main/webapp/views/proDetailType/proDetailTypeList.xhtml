<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form id="proDetailTypeListForm" dir="#{userData.dir}" class='formmargin'>
         
            <p:fieldset legend="#{userData.userDDs['ITEMS_GROUP']}" style="margin-bottom:20px">
                <div >
                    <p:messages autoUpdate="true"  id="messages" showDetail="true" closable="true"/>   
                </div>

                <p:dataTable 
                    draggableColumns="true" 
                    draggableRows="true"
                    var="proDetailTypeTable" 
                    widgetVar="proDetailTypeTable"  
                    rowIndexVar="index" 
                    value="#{proDetailTypeListBean.proDetailTypeDTOList}"
                    rows="#{userData.rowListCount}" 
                    paginator="true" 
                    selection="#{proDetailTypeListBean.proDetailTypeDTO}"
                    rowKey="#{proDetailTypeTable.index}"
                    sortBy="#{1}"
                    emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                    id="proDetailTypeTable">
                    <f:facet name="header">
                        <p:commandButton  class="saddButton" style="float:right" icon="fa fa-plus" title="#{userData.userDDs['ADD']}" action="#{proDetailTypeListBean.goToAdd()}" 
                                          rendered="#{userData.userScreens['proDetailType'].add or userData.isAdmin}"/>

                        <p:outputPanel  >
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" a:autofocus="true" onkeyup="PF('proDetailTypeTable').filter()" style="width:150px" />
                        </p:outputPanel>
                    </f:facet>
                    
                    <p:column style="text-align: right;font-size: 15px;border-radius: 0px"  
                              filterStyle="display:none" filterBy="#{proDetailTypeTable.code}"  
                              filterMatchMode="contains" headerText="#{userData.userDDs['CODE']}" sortBy="#{proDetailTypeTable.code}">
                        <p:outputLabel value="#{proDetailTypeTable.code}" />
                    </p:column>
                    <p:column style="text-align: right;font-size: 15px;border-radius: 0px"  
                              filterStyle="display:none" filterBy="#{proDetailTypeTable.name}"  
                              filterMatchMode="contains" headerText="#{userData.userDDs['NAME']}" sortBy="#{proDetailTypeTable.name}">
                        <p:outputLabel value="#{proDetailTypeTable.name}" />
                    </p:column>

                    <p:column style="width:16vh;text-align: center;font-size: 15px;border-radius: 0px"  headerText="#{userData.userDDs['TRANSACTION']}">
                        <p:commandButton update="@form" icon="fa fa-fw fa-edit"
                                         class="seditButtons" style="background-color: #6a6967;border-radius: 3px;margin-bottom:3px"
                                         title="#{userData.userDDs['EDIT']}" action="#{proDetailTypeListBean.goToEdit()}"
                                         rendered="#{userData.userScreens['proDetailType'].edit or userData.isAdmin}">
                            <f:setPropertyActionListener value="#{proDetailTypeTable.id}"  target="#{proDetailTypeListBean.proDetailTypeSelected}" />
                        </p:commandButton>
                        <p:commandButton  class="sdeleteButtons" update="proDetailTypeListForm:proDetailTypeTable" icon="fa fa-remove" style="background-color: red;border-radius: 3px;margin-bottom:3px"   
                                          title="#{userData.userDDs['DELETE']}"  action="#{proDetailTypeListBean.delete()}" 
                                          rendered="#{userData.userScreens['proDetailType'].delete or userData.isAdmin}">
                            <f:setPropertyActionListener value="#{proDetailTypeTable}" target="#{proDetailTypeListBean.proDetailTypeDTO}" />
                            <p:confirm header="Confirmation" message="#{userData.userDDs['ARE_YOU_SURE']}" icon="ui-icon-alert" />
                        </p:commandButton>
                    </p:column>
                </p:dataTable>
                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                    <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                    <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                </p:confirmDialog>

            </p:fieldset>
        </h:form>
    </ui:define>
</ui:composition>
