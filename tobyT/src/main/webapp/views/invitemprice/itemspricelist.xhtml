<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form id="form" dir="#{userData.dir}" style="margin-right: 15px">


            <h:panelGrid  id="twelveSegment" columns="1" cellspacing="20" cellpadding="0" >


                <p:fieldset legend="#{userData.userDDs['ITEMS_DATA']}">


                    <p:dataTable 
                        id="itemData" 
                        draggableColumns="true"
                        var="itemData" 
                        widgetVar="itemData" 
                        rowIndexVar="index"
                        value="#{invItemPriceListMB.dataModel}" lazy="true"
                        rows="15" 
                        paginator="true"
                        paginatorTemplate="{CurrentPageReport} {FirstPageLink}
                        {PreviousPageLink} {PageLinks} {NextPageLink}
                        {LastPageLink} {RowsPerPageDropdown}"
                        emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"                         
                        >

                        <f:facet name="header">
                            <p:commandButton  class="saddButton" id="b2" icon="fa fa-plus" title="#{userData.userDDs['ADD']}" action="#{invItemPriceListMB.goToAdd()}" 
                                              style="float:right"
                                              rendered="#{userData.userScreens['itemsdata'].add or userData.isAdmin}" >
                            </p:commandButton>

                            <p:selectOneMenu id="inventory" value="#{invItemPriceListMB.gallaryDTOSelect}"
                                             converter="#{invItemPriceListMB.gallaryDTOConverters}" 
                                             style="float:right;width: 20%!important;color:#fff;height: 30px!important;margin-right: 0.5%;">

                                <p:ajax listener="#{invItemPriceListMB.load()}" update="form" />
                                <f:selectItem itemLabel="#{userData.userDDs['ALL']}" itemValue="" />

                                <f:selectItems value="#{invItemPriceListMB.gallaryLists}" 
                                               var="inventory" itemLabel="#{inventory.name}"
                                               itemValue="#{inventory}"/> 
                            </p:selectOneMenu>
                            <p:outputPanel >
                                <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large"/>
                                <p:inputText id="globalFilter" a:autofocus="true" onkeyup="PF('itemData').filter()" style="width:150px" />
                            </p:outputPanel>
                        </f:facet>

                        <p:column style="width: 6vh;font-size: 1.4vh;text-align: -webkit-auto" headerText="#" >
                            <h:outputText value="#{index + 1}"  />
                        </p:column>

                        <p:column headerText="#{userData.userDDs['CS_COD']}" style="text-align:right;width: 12vh;font-size: 1.4vh" filterBy="#{itemData.code}" sortBy="#{itemData.code}" filterMatchMode="contains" filterStyle="display:none">
                            <h:outputText value="#{itemData.itemId.code}"  />
                        </p:column>
                        <p:column headerText="#{userData.userDDs['ITEM_NAME']}" style="width: 24vh;text-align: right;font-size: 1.4vh" filterBy="#{itemData.name}" sortBy="#{itemData.name}" filterMatchMode="contains" filterStyle="display:none">
                            <h:outputText value="#{itemData.itemId.name}"/>
                        </p:column>

                        <p:column headerText="التكلفة" style="width: 24vh;text-align: right;font-size: 1.4vh" 
                                  filterBy="#{itemData.itemId.lastCost}" sortBy="#{itemData.lastCost}" 
                                  filterMatchMode="contains" filterStyle="display:none">
                            <h:outputText value="#{itemData.itemId.lastCost}"/>
                        </p:column>

                        <p:column headerText="أعلى سعر رجالى" style="width: 24vh;text-align: right;font-size: 1.4vh" 
                                  filterBy="#{itemData.maxPriceMen}" sortBy="#{itemData.maxPriceMen}" 
                                  filterMatchMode="contains" filterStyle="display:none">
                            <h:outputText value="#{itemData.maxPriceMen}"/>
                        </p:column>


                        <p:column style="width: 10vh;font-size: 1.4vh"  headerText="#{userData.userDDs['TRANSACTION']}" >
                            <p:commandButton 
                                class="sprintButtons"
                                update="@form" 
                                onclick="form.target = '_blank'" 
                                ajax="false"
                                icon="fa fa-fw fa-print" 
                                style="background-color: rgb(0, 74, 128);border-radius: 3px;"
                                title="print Barcode" 
                                action="#{invItemPriceListMB.printBarcode()}"  >
                                <f:setPropertyActionListener value="#{itemData}" 
                                                             target="#{invItemPriceListMB.invItemPriceDTOSelected}" />
                            </p:commandButton>
                            <p:commandButton update="@form" 
                                             icon="fa fa-fw fa-edit"
                                             title="#{userData.userDDs['EDIT']}"
                                             class="seditButton"
                                             action="#{invItemPriceListMB.goToEdit()}"
                                             rendered="#{userData.userScreens['itemsdata'].edit or userData.isAdmin}">
                                <f:setPropertyActionListener value="#{itemData}" 
                                                             target="#{invItemPriceListMB.invItemPriceDTOSelected}" />
                            </p:commandButton>

                            <p:commandButton  class="sdeleteButton"  update="@form"
                                              title="#{userData.userDDs['DELETE']}" 
                                              action="#{invItemPriceListMB.delete()}"
                                              icon="fa fa-remove"
                                              rendered="#{userData.userScreens['itemsdata'].delete or userData.isAdmin}">
                                <f:setPropertyActionListener value="#{itemData}" 
                                                             target="#{invItemPriceListMB.invItemPriceDTOSelected}" />
                                <p:confirm header="#{userData.userDDs['COFIGRATION']}" message="#{userData.userDDs['ARE_YOU_SURE']}" icon="ui-icon-alert" />
                            </p:commandButton>

                            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                                <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                                <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                            </p:confirmDialog>
                        </p:column>

                    </p:dataTable>
                </p:fieldset>

            </h:panelGrid>

        </h:form>
    </ui:define>
</ui:composition>
