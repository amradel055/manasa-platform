<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">

        <h:form id="form" dir="#{userData.dir}" style="margin-right: 15px">
            <p:fieldset id="whole" style="margin-bottom:20px">

                <p:outputLabel value="#{invItemPriceFormMB.invItemPriceDTO.itemId}" rendered="#{invItemPriceFormMB.invItemPriceDTO.id ne null}" />
                <p:autoComplete id="invItemNameIn"  
                                style="width:100%"
                                rendered="#{invItemPriceFormMB.invItemPriceDTO.id eq null}"
                                converter="#{autoComplete.itemDTOConverter}"
                                value="#{invItemPriceFormMB.invItemPriceDTO.itemId}"
                                maxResults="50"
                                var="item"
                                itemLabel="#{item}" 
                                itemValue="#{item}" 
                                forceSelection="true" 
                                completeMethod="#{autoComplete.completeItemsData}" 
                                >
                </p:autoComplete> 

                <p:selectOneMenu id="inventory" value="#{invItemPriceFormMB.invItemPriceDTO.gallaryId}"
                                 converter="#{invItemPriceFormMB.gallaryDTOConverters}" 
                                 style="float:right;width: 20%!important;height: 30px!important;margin-right: 0.5%;">

                    <f:selectItems value="#{invItemPriceFormMB.gallaryLists}" 
                                   var="inventory" itemLabel="#{inventory.name}"
                                   itemValue="#{inventory}"/> 
                </p:selectOneMenu>


                <div class="ui-g-6 ui-xl-6">


                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">

                            <p:inputText style="width:48%" value="#{invItemPriceFormMB.invItemPriceDTO.maxPriceYoung}" />

                        </div>
                        <div class="ui-g-6 ui-xl-6">

                            <p:outputLabel style="width:70px" value=" أعلى سعر ولادى "/>



                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">

                            <p:inputText style="width:48%" value="#{invItemPriceFormMB.invItemPriceDTO.maxPriceMen}" />

                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width:70px" value=" أعلى سعر رجالى "/>




                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">

                            <p:inputText style="width:48%" value="#{invItemPriceFormMB.invItemPriceDTO.minPriceYoung}" />

                        </div>
                        <div class="ui-g-6 ui-xl-6">

                            <p:outputLabel style="width:70px" value=" اقل سعر ولادى "/>



                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">

                            <p:inputText style="width:48%" value="#{invItemPriceFormMB.invItemPriceDTO.minPriceMen}" />

                        </div>
                        <div class="ui-g-6 ui-xl-6">



                            <p:outputLabel style="width:70px" value=" اقل سعر رجالى "/>

                        </div>
                    </div>

                </div>

                <p:commandButton    value="حفظ" 
                                    action="#{invItemPriceFormMB.save()}" ajax="false" />
            </p:fieldset>   

        </h:form>
    </ui:define>
</ui:composition>
