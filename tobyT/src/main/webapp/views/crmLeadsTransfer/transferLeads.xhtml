<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
            <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form  class='formmargin' enctype="multipart/form-data" id="form" dir="#{userData.dir}">
            <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                  margin-top: 24%;
                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;"
                                  icon="fa fa-fw fa-home"
                                  title="#{userData.userDDs['HOME']}"
                                  class="smhomeButton" 
                                  action="exit" />

            </div>
            <p:fieldset legend="تحويل العملاء المحتملين" >

                <div >
                    <p:messages id="curmsg" 
                                autoUpdate="true"
                                showDetail="true" 
                                rendered="true" closable="true"
                                escape="false"/>   
                </div>

                <div>
                    <p:dataTable 
                        id="organizationSiteTable"
                        draggableColumns="true"
                        var="organizationSiteTable" 
                        widgetVar="bTable" 
                        rowIndexVar="index" 
                        value="#{crmLeadsListMB.dataModelInvOrganization}"     
                        rows="25"
                        lazy="true"
                        paginator="true"
                        paginatorTemplate="{CurrentPageReport} {FirstPageLink}
                        {PreviousPageLink} {PageLinks} {NextPageLink}
                        {LastPageLink} {RowsPerPageDropdown}" 
                        emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                        >

                        <f:facet name="header" >

                            <p:commandButton  class="saveButton"  
                                              id="saveB"  title="#{userData.userDDs['SAVE']}" 
                                              value="#{userData.userDDs['SAVE']}" 
                                              action="#{crmLeadsListMB.saveTransferLeads()}" 
                                              rendered="#{userData.userScreens['crmLeads'].add or userData.isAdmin}" 
                                              style="float:right;color: #fff!important;background-color: red"
                                              update="@form"
                                              >
                                <p:confirm header="#{userData.userDDs['COFIGRATION']}" 
                                           message="هل انت متاكد من الحفظ"
                                           icon="ui-icon-alert" /> 
                            </p:commandButton>



                            <p:outputPanel >
                                <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                                <p:inputText id="globalFilter" a:autofocus="true" onkeyup="PF('bTable').filter()" style="width:150px" />
                            </p:outputPanel>


                        </f:facet>

                        <p:column headerText="#" style="width: 2%;font-size: 15px;text-align: -webkit-auto;" >

                            <h:outputText value="#{index + 1}" style="width: 5%;font-size: 12px;" />

                        </p:column>
                        <p:column style="width:6vh;font-size:1.8vh;text-align: right;border-radius: 0px "
                                  filterStyle="display:none"
                                  filterBy="#{organizationSiteTable.code}"
                                  filterMatchMode="contains" 
                                  headerText="#{userData.userDDs['CUSTOM_CODE']}"
                                  sortBy="#{organizationSiteTable.code}"  
                                  >
                            <p:outputLabel value="#{organizationSiteTable.code}" />
                        </p:column>

                        <p:column style="width:15vh;font-size:1.8vh;text-align: right;border-radius: 0px "
                                  filterStyle="display:none"
                                  filterBy="#{organizationSiteTable.name}"
                                  filterMatchMode="contains" 
                                  headerText="#{userData.userDDs['CUSTOM_NAME']}" sortBy="#{organizationSiteTable.name}" >
                            <p:outputLabel value="#{organizationSiteTable.name}" />
                        </p:column>

                        <p:column style="width:10vh;font-size: 1.8vh;text-align: right;border-radius: 0px "
                                  filterStyle="display:none" 
                                  filterBy="#{organizationSiteTable.mobile}"
                                  filterMatchMode="contains" 
                                  headerText="الموبايل"
                                  sortBy="#{organizationSiteTable.mobile}" 
                                  >
                            <p:outputLabel value="#{organizationSiteTable.mobile}" />
                        </p:column>
                        <p:column style="width:10vh;font-size: 1.8vh;text-align: right;border-radius: 0px "
                                  filterStyle="display:none" 
                                  filterBy="#{organizationSiteTable.createdDate}"
                                  filterMatchMode="contains" 
                                  headerText="تاريخ الادخال"
                                  sortBy="#{organizationSiteTable.createdDate}" 
                                  >
                            <p:outputLabel value="#{organizationSiteTable.createdDate}" >
                                <f:convertDateTime type="date" pattern="dd-MM-yyyy"/>
                            </p:outputLabel>
                        </p:column>
                        <p:column style="width:13vh;font-size:1.8vh;text-align: right;border-radius: 0px "
                                  filterStyle="display:none"
                                  filterBy="#{organizationSiteTable.globalFilter}"
                                  filterMatchMode="contains" 
                                  headerText="" sortBy="#{organizationSiteTable.assignedTo.name}" >
                            <f:facet name="filter">
                                <p:selectOneMenu  label="المتابع له" id="employee" style="width:100%"
                                                  converter="#{crmLeadsListMB.employeeDTOConverter}"
                                                  value="#{crmLeadsListMB.leadSearch.assignedTo}"  > 
                                    <f:selectItem itemLabel="المتابع له"  itemValue="" />
                                    <f:selectItems  value="#{crmLeadsListMB.employeeDTOList}" 
                                                    var="employee" itemLabel="#{employee}" itemValue="#{employee}" />

                                    <p:ajax update="organizationSiteTable"
                                            event="change"
                                            listener="#{crmLeadsListMB.search()}" />
                                </p:selectOneMenu>
                            </f:facet>
                            <p:outputLabel value="#{organizationSiteTable.assignedTo.name}" />
                        </p:column>

                        <p:column style="width:13vh;font-size:1.8vh;text-align: right;border-radius: 0px "
                                  filterStyle="display:none"
                                  filterBy="#{organizationSiteTable.globalFilter}"
                                  filterMatchMode="contains" 
                                  headerText="المحول له" sortBy="#{organizationSiteTable.transferTo.name}" >
                          
                            <p:selectOneMenu  label="المحول له"  style="width:100%"
                                              converter="#{crmLeadsListMB.employeeDTOTransferConverter}"
                                              value="#{organizationSiteTable.transferTo}"  > 
                                <f:selectItem itemLabel="المحول له"  itemValue="" />
                                <f:selectItems  value="#{crmLeadsListMB.employeeDTOTransferList}" 
                                                var="employee" itemLabel="#{employee}" itemValue="#{employee}" />
                                <p:ajax 
                                    event="change"
                                    listener="#{crmLeadsListMB.transfer(organizationSiteTable)}" />

                            </p:selectOneMenu>
                        </p:column>
                    </p:dataTable> 

                    <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                        <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                        <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                    </p:confirmDialog>


                </div>
            </p:fieldset>
        </h:form>
    </ui:define>
</ui:composition>
