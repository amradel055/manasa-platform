<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="content">

        <h:form id="form" dir="#{userData.dir}" class='formmargin'>

            <p:fieldset legend="القيد المحاسبي" id="whole" >

                <div class="col-xs-12">
                    <p:messages id="curmsg" showDetail="true" rendered="true" autoUpdate="true" closable="true"/>   
                </div>

                <div class="ui-g-6 ui-xl-6">
                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <p:calendar id="date" 
                                        value="#{settlementDeedVoucherFormMB.glBankTransactionEntity.date}"
                                        pattern="dd/MM/yyyy"
                                        style="width:50%">

                                <p:ajax event="dateSelect" update="form" listener="#{settlementDeedVoucherFormMB.updateTransactionRate}" />
                            </p:calendar>
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width:80px" value="#{userData.userDDs['DATEE']}"/>
                        </div>
                    </div>

                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:inputText value="#{settlementDeedVoucherFormMB.dayHijriFrom}" /> يوم
                            <p:inputText value="#{settlementDeedVoucherFormMB.monthHijriFrom}" />  شهر
                            <p:inputText value="#{settlementDeedVoucherFormMB.yearHijriFrom}" />  سنة
                            <p:commandButton     class="saveButton" id="excuteFrom" 
                                                 value="تنفيذ" 
                                                 icon="fa fa-fw fa-save"
                                                 action="#{settlementDeedVoucherFormMB.convertDateFrom()}"
                                                 update="date"
                                                 />
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 50px"  value="من تاريخ هجري" />
                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <p:inputText style="width: 38%!important" id="notes2"
                                         value="#{settlementDeedVoucherFormMB.glBankTransactionEntity.remark2}">

                                <p:ajax event="blur" listener="#{settlementDeedVoucherFormMB.catchValues()}" />
                            </p:inputText>
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width:85px" value="#{userData.userDDs['HANDLING']}"/>
                        </div>
                    </div>
                    

                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:autoComplete style="width: 85%" id="running_GlAccount_ID" 
                                            immediate="true"
                                            dropdown="true"
                                            converter="#{settlementDeedVoucherFormMB.runningAccountDTOConverter}"
                                            value="#{settlementDeedVoucherFormMB.glBankTransactionEntity.costAccount}"
                                            var="p"
                                            itemLabel="#{p}" 
                                            itemValue="#{p}" 
                                            forceSelection="true" 
                                            completeMethod="#{settlementDeedVoucherFormMB.completeRunningGlAccount}" >
                                <p:ajax 
                                    event="itemSelect"
                                    listener="#{SettlementDeedFormMB.fillCostCenter()}" update="form" />
                            </p:autoComplete>
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 65px" value="رقم الحساب الدائن" rendered="#{not settlementDeedVoucherFormMB.organizationSiteView}"/>

                        </div>
                    </div>
                    
                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:autoComplete style="width: 110%;font-size: 1.8vh;text-align: right;border-radius: 0px; " id="Cost_Center_From" 

                                            converter="#{settlementDeedVoucherFormMB.costCenterConverter}"
                                            value="#{settlementDeedVoucherFormMB.glBankTransactionEntity.costCenterDTO}"
                                            var="cost"
                                            itemLabel="#{cost}" 
                                            itemValue="#{cost}" 
                                            forceSelection="true" 
                                            completeMethod="#{settlementDeedVoucherFormMB.completeCostCenter}"
                                            widgetVar="cost">
                                <p:ajax 
                                    event="itemSelect"
                                    listener="#{SettlementDeedFormMB.forHashasa()}" />
                            </p:autoComplete>
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width:64px;" value="مركز التكلفة"/>

                        </div>
                    </div>
                </div>
                <div class="ui-g-6 ui-xl-6">
                    <div class="ui-g-12 ui-xl-12">

                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel  style="width: 50%" id="settelmentId" value="#{settlementDeedVoucherFormMB.glBankTransactionEntity.serial}"/>
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width:65px;margin-right: 6%" value="#{userData.userDDs['SERIAL']}"/>
                        </div>
                    </div>

                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:inputText style="width: 38%!important" id="notes"
                                         value="#{settlementDeedVoucherFormMB.glBankTransactionEntity.remark}">
                                <p:ajax event="blur" listener="#{settlementDeedVoucherFormMB.catchValues()}" />

                            </p:inputText>
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width:64px;margin-right: 6%;" value="#{userData.userDDs['STATEMENT']}"/>
                        </div>
                    </div>
                    
                </div>
            </p:fieldset>



            <!-- begin table -->
            <p:fieldset legend="بيانات القيد المحاسبي"  style="margin:20px 1px">


                <div class="col-xs-12">
                    <p:messages id="curmsg2" showDetail="true" rendered="true" autoUpdate="true" closable="true"/>   
                </div>

                <p:dataTable id="glBankTransactionDetailsTable"

                             var="glBankTransactionDetailsTable"
                             rowIndexVar="index" 
                             dir="rtl" 
                             emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                             sortBy="#{1}"
                             selectionMode="single"
                             selection="#{settlementDeedVoucherFormMB.glBankTransactionDetailEntitySelected}"
                             widgetVar="glBankTransactionDetailsTable"
                             rowKey="#{glBankTransactionDetailsTable.index}"
                             value="#{settlementDeedVoucherFormMB.glBankTransactionDetailEntityList}" >


                    <f:facet name="header" class="col-md-12">
                        <p:commandButton id="addnew"
                                         class="saddButton"
                                         icon="fa fa-plus"
                                         title="#{userData.userDDs['ADD']}" 
                                         actionListener="#{settlementDeedVoucherFormMB.addGlBankTransactionDetail()}" 
                                         update=":form:curmsg glBankTransactionDetailsTable" 
                                         disabled="#{settlementDeedVoucherFormMB.glBankTransactionEntity.postFlag == 1}"
                                         oncomplete="PrimeFaces.focus('form:glBankTransactionDetailsTable:'+#{settlementDeedVoucherFormMB.glBankTransactionDetailEntityList.size()}+':GlAccount_ID_from')"

                                         ajax="true"
                                         style="float:right"/>
                        <p:outputPanel>
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" onkeyup="PF('glBankTransactionDetailsTable').filter()" style="width:150px" />
                        </p:outputPanel>
                    </f:facet>

                    <p:ajax  event="rowSelect" 
                             listener="#{settlementDeedVoucherFormMB.onRowSelectDetails}"                                
                             update="glBankTransactionDetailsTable"/>


                    <p:ajax  event="rowUnselect" listener="#{settlementDeedVoucherFormMB.onRowUnselect}" update="glBankTransactionDetailsTable" />

                    <p:column headerText="#{userData.userDDs['SERIES1']}"  style="width: 8vh;font-size: 1.8vh;text-align: right;border-radius: 0px">
                        <h:outputText value="#{glBankTransactionDetailsTable.serial}"  />
                    </p:column>


                    <p:column  style="width: 17vh;font-size: 1.8vh;text-align: right;border-radius: 0px" 
                               filterBy="#{glBankTransactionDetailsTable.glAccount.name}"  
                               filterMatchMode="contains" sortBy="#{glBankTransactionDetailsTable.glAccount.name}" filterable="false"
                               headerText="كود الحساب" >

                        <h:outputText id="accountCode" value="#{glBankTransactionDetailsTable.glAccount.accNumber}"  style="width: auto"/>
                    </p:column>

                    <p:column  style="width: 17vh;font-size: 1.8vh;text-align: right;border-radius: 0px" 
                               filterBy="#{glBankTransactionDetailsTable.glAccount.name}"  
                               filterMatchMode="contains" sortBy="#{glBankTransactionDetailsTable.glAccount.name}" filterable="false"
                               headerText="#{userData.userDDs['ACCOUNT_NAM']}" rendered="#{settlementDeedVoucherFormMB.accounts}">

                        <p:autoComplete style="width: 200%;font-size: 1.8vh;text-align: right"  id="GlAccount_ID_from" 

                                        converter="#{settlementDeedVoucherFormMB.glAccountConverter}"
                                        value="#{glBankTransactionDetailsTable.glAccount}"
                                        var="p"
                                        itemLabel="#{p}" 
                                        itemValue="#{p}" 
                                        forceSelection="true" 
                                        completeMethod="#{settlementDeedVoucherFormMB.completeGlAccount}" 
                                        rendered="#{glBankTransactionDetailsTable.markEdit}"
                                        widgetVar="p"
                                        >
                            <f:attribute name="varValue" value="#{glBankTransactionDetailsTable}" />

                            <p:ajax 
                                event="itemSelect" update="accountCode"
                                listener="#{settlementDeedVoucherFormMB.notLoseData}" />
                        </p:autoComplete>  
                        <h:outputText value="#{glBankTransactionDetailsTable.glAccount.name}"  rendered="#{not glBankTransactionDetailsTable.markEdit}" style="width: auto"/>
                    </p:column>

                    <p:column  style="width: 18vh;font-size: 1.8vh;text-align: right;border-radius: 0px" 
                               id="value"  headerText="#{userData.userDDs['AMOUNT']}">


                        <p:inputNumber id="valueT" value="#{glBankTransactionDetailsTable.value}" 
                                       rendered="#{glBankTransactionDetailsTable.markEdit}" style="width: 25em;">
                            <p:ajax event="blur" 
                                    listener="#{settlementDeedVoucherFormMB.updateAllSummations}"
                                    />
                        </p:inputNumber>
                        <h:outputText value="#{glBankTransactionDetailsTable.value}"
                                      rendered="#{not glBankTransactionDetailsTable.markEdit}"/>

                    </p:column>
                    <p:column  style="width: 18vh;font-size: 1.8vh;text-align: right;border-radius: 0px" 
                               id="commition"  headerText="العمولة">


                        <p:inputNumber id="commitionT" value="#{glBankTransactionDetailsTable.bankCommition}" 
                                       rendered="#{glBankTransactionDetailsTable.markEdit}" style="width: 25em;">
                            <p:ajax event="blur" 
                                    listener="#{settlementDeedVoucherFormMB.updateAllSummations}"
                                    />
                        </p:inputNumber>
                        <h:outputText value="#{glBankTransactionDetailsTable.bankCommition}"
                                      rendered="#{not glBankTransactionDetailsTable.markEdit}"/>

                    </p:column>
                    <p:column  style="width: 17vh;font-size: 1.8vh;text-align: right;border-radius: 0px"  id="costCode" 
                               filterBy="#{glBankTransactionDetailsTable.costCenter.name}"  
                               filterMatchMode="contains" sortBy="#{glBankTransactionDetailsTable.costCenter.name}" filterable="false"
                               headerText="#{userData.userDDs['COST_COD']}" >


                        <p:autoComplete style="width: 200%;font-size: 1.8vh;text-align: right;border-radius: 0px" id="Cost_Center_From" 

                                        converter="#{settlementDeedVoucherFormMB.costCenterConverter}"
                                        value="#{glBankTransactionDetailsTable.costCenter}"
                                        var="cost"
                                        itemLabel="#{cost}" 
                                        itemValue="#{cost}" 
                                        forceSelection="true" 
                                        completeMethod="#{settlementDeedVoucherFormMB.completeCostCenter}"
                                        rendered="#{glBankTransactionDetailsTable.markEdit}"
                                        widgetVar="cost">
                            <p:ajax 
                                event="itemSelect"
                                listener="#{settlementDeedVoucherFormMB.notLoseData}" />
                        </p:autoComplete>
                        <h:outputText value="#{glBankTransactionDetailsTable.costCenter.name}"  rendered="#{not glBankTransactionDetailsTable.markEdit}"/>

                    </p:column>




                    <p:column  style="width: 12vh;font-size: 1.8vh;text-align: right;border-radius: 0px"  id="Unit" headerText="#{userData.userDDs['UNIT_CODE']}">
                        <p:autoComplete style="width: 200%;font-size: 1.8vh;text-align: right"  id="ADMIN_UNIT_FROM" 

                                        converter="#{settlementDeedVoucherFormMB.glAdminUnitConverter}"
                                        value="#{glBankTransactionDetailsTable.glAdminUnit}"

                                        var="admin"
                                        itemLabel="#{admin}" 
                                        itemValue="#{admin}" 
                                        forceSelection="true" 

                                        completeMethod="#{settlementDeedVoucherFormMB.completeAdminUnit}"
                                        rendered="#{glBankTransactionDetailsTable.markEdit}"
                                        widgetVar="admin">

                            <p:ajax 
                                event="itemSelect"
                                listener="#{settlementDeedVoucherFormMB.notLoseData}" />
                        </p:autoComplete>
                        <h:outputText value="#{glBankTransactionDetailsTable.glAdminUnit.name}"  rendered="#{not glBankTransactionDetailsTable.markEdit}"/>

                    </p:column>


                    <p:column  style="width: 14vh;font-size: 1.8vh;text-align: right;border-radius: 0px" id="remarks"  headerText="#{userData.userDDs['STATEMENT']}">

                        <p:inputText id="note" value="#{glBankTransactionDetailsTable.remarks}"
                                     style="width:100%" rendered="#{glBankTransactionDetailsTable.markEdit}"
                                     >

                            <p:ajax event="blur" 
                                    listener="#{settlementDeedVoucherFormMB.notLoseData}"                                      
                                    />
                        </p:inputText>
                        <h:outputText value="#{glBankTransactionDetailsTable.remarks}"
                                      rendered="#{not glBankTransactionDetailsTable.markEdit}"/>

                    </p:column>





                    <p:columnGroup id="footer1" type="footer" >
                        <p:row >
                            <p:column colspan="5" style="text-align:right;border-radius: 0px" footerText="#{userData.userDDs['TOTAL']}  :" />
                            <p:column style="border-radius: 0px" rendered="#{settlementDeedVoucherFormMB.organizationSiteView}"/>
                            <p:column  style="border-radius: 0px" rendered="#{settlementDeedVoucherFormMB.organizationSiteView}" />
                            <p:column style="border-radius: 0px" id="valueSummary2" footerText="#{settlementDeedVoucherFormMB.valueSummary}" />
                            <p:column  style="border-radius: 0px"/>

                        </p:row>
                    </p:columnGroup>


                    <p:column style="width: 10vh;font-size: 1.8vh;text-align: right;border-radius: 0px" 
                              headerText="#{userData.userDDs['TRANSACTION']}">

                        <p:commandButton 
                            class="printButtons"
                            id="b71" value="كشف حساب" 
                            title="كشف الحساب" onclick="form.target = '_blank'" 
                            ajax="false"
                            rendered="#{glBankTransactionDetailsTable.invOrganizationSite ne null}"
                            actionListener="#{settlementDeedVoucherFormMB.goTOrganizationSiteacoount(glBankTransactionDetailsTable.invOrganizationSite.id)}"  
                            />

                        <p:commandButton 
                            class="saddButtons"
                            id="b7" icon="fa fa-plus"
                            title="#{userData.userDDs['ADD']}" 
                            oncomplete="PrimeFaces.focus('form:glBankTransactionDetailsTable:'+#{settlementDeedVoucherFormMB.glBankTransactionDetailEntityList.size()}+':GlAccount_ID_from')"
                            actionListener="#{settlementDeedVoucherFormMB.addGlBankTransactionDetail()}"  
                            disabled="#{settlementDeedVoucherFormMB.glBankTransactionEntity.postFlag == 1}"
                            update=":form:curmsg glBankTransactionDetailsTable" 
                            ajax="true" />

                        <p:commandButton  class="sdeleteButtons"
                                          update="glBankTransactionDetailsTable"
                                          title="#{userData.userDDs['DELETE']}" 
                                          style=""
                                          action="#{settlementDeedVoucherFormMB.deleteGlBankTransactionDetail()}"
                                          disabled="#{settlementDeedVoucherFormMB.glBankTransactionEntity.postFlag == 1}"
                                          icon="fa fa-remove" >

                            <f:setPropertyActionListener value="#{glBankTransactionDetailsTable}"
                                                         target="#{settlementDeedVoucherFormMB.glBankTransactionDetailEntitySelected}"/>
                            <p:confirm header="#{userData.userDDs['COFIGRATION']}" 
                                       message="#{userData.userDDs['ARE_YOU_SURE']}"
                                       icon="ui-icon-alert" />
                        </p:commandButton>

                        <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                            <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                            <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                        </p:confirmDialog>
                    </p:column >
                </p:dataTable>


                <h:panelGrid columns="1" class="centerButtons">

                    <h:panelGroup>

                        <p:commandButton  class="saveButton" id="saveB" 
                                          title="#{userData.userDDs['SAVE']}" 
                                          value="#{userData.userDDs['SAVE']}" 
                                          update="@form settelmentId"
                                          action="#{settlementDeedVoucherFormMB.save()}"
                                          rendered="#{(userData.userScreens['settlementdeed'].add or userData.userScreens['settlementdeed'].edit) or userData.isAdmin}"
                                          />
                        <p:commandButton  class="newButton" title="#{userData.userDDs['RESET']}" 
                                          immediate="true" update="@form"
                                          id="newA"
                                          style=""
                                          value="#{userData.userDDs['NEW']}"
                                          actionListener="#{settlementDeedVoucherFormMB.reset()}"   />



                        <p:commandButton class="printButtons"
                                         ajax="false" 
                                         onclick="form.target = '_blank'" 
                                         title="#{userData.userDDs['PRINT']}"
                                         value="#{userData.userDDs['PRINT']}" 
                                         actionListener="#{settlementDeedVoucherFormMB.exportPDFVoutcher}" 
                                         rendered="#{settlementDeedVoucherFormMB.glBankTransactionEntity.serial gt 0}"/>


                        <p:commandButton  class="closeButton" title="#{userData.userDDs['BACK']}" 
                                          immediate="true"
                                          value="#{userData.userDDs['BACK']}" 
                                          style=""
                                          action="#{settlementDeedVoucherFormMB.exit()}"   />
                        <br/>

                    </h:panelGroup>
                </h:panelGrid>



                <p:blockUI block="form" trigger="saveB newA" animate="true" >

                    <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                </p:blockUI> 
            </p:fieldset>
        </h:form>
        <script>

            document.addEventListener("keydown", function (e) {
                console.log(e.which);
                if (e.which === 13) {
                    e.preventDefault();

                    //                    var ss = document.getElementById("form:settelmentId2").value;
                    //                    console.log(ss);
                    //                    sessionStorage.setItem(ss, ss);
                    //                    var field = document.getElementById("form:hidden2");
                    //                    field.value = sessionStorage.getItem(ss);
                    //console.log(field);
                    //sessionStorage.clear();
                    return false;
                }
                ;
            });

            function someFunc() {
                var ss = document.getElementById("form:settelmentId2").value;
                console.log(ss);
                sessionStorage.setItem(ss, ss);
                var field = document.getElementById("form:hidden2");
                field.value = sessionStorage.getItem(ss);
            }
        </script>
    </ui:define>
</ui:composition>
