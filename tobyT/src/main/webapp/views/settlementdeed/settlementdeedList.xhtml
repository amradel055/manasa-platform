<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form  dir="#{userData.dir}" class='formmargin'  enctype="multipart/form-data">
           
            <p:fieldset legend="#{userData.userDDs['BILL_EXCHANG']}" style="margin-bottom:20px">
                <div class="col-xs-12">
                    <p:messages id="curmsg" showDetail="true" rendered="true" closable="true"/>   
                </div>
                <div>
                    <p:dataTable id="glBankTransactionTable"
                                 draggableColumns="true" draggableRows="true"
                                 var="glBankTransactionTable"
                                 widgetVar="bTable"  
                                 rowIndexVar="index" 
                                 value="#{settlementDeedListMB.dataModel}" lazy="true" 
                                 rows="10"
                                 paginator="true"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink}
                                 {PreviousPageLink} {PageLinks} {NextPageLink}
                                 {LastPageLink} {RowsPerPageDropdown}"
                                 emptyMessage="#{userData.userDDs['EMPTY_TABLE']}" >

                        <f:facet name="header" class="col-md-12">
                            <p:commandButton  class="saddButton" icon="fa fa-plus" title="#{userData.userDDs['ADD']}" action="#{settlementDeedListMB.goToAdd()}" style="float:right" rendered="#{userData.userScreens['settlementdeed'].add or userData.isAdmin}"/>

                            <p:outputPanel  >
                                <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                                <p:inputText id="globalFilter" onkeyup="PF('bTable').filter()" style="width:150px" />
                            </p:outputPanel>


                            <p:fileUpload style="margin-right: 80%; margin-top: -2%;" value="#{notesReceivablesFormMB.contractFile}" mode="simple" onstart="disableChoosing()" 
                                          oncomplete="enableChoosing()" />

                            <p:commandButton class="notesUpload" id="btncustomer" widgetVar="btn" ajax="false" onclick="PF('pbAjax').start();PF('pbAjax').getJQ().css('display', 'block');" action="#{notesReceivablesFormMB.readCashTasahel()}"  value="تحميل">
                                <p:ajax  delay="100"  onstart="PF('btn').disable();" />                          
                            </p:commandButton>
                        </f:facet>

                        <p:column style="width: 11vh;text-align: center;font-size: 1.8vh;border-radius: 0px" 
                                  filterStyle="display:none"
                                  filterBy="#{glBankTransactionTable.serial}" 
                                  filterMatchMode="contains"
                                  headerText="#{userData.userDDs['BOND_NUM']}" 
                                  sortBy="#{glBankTransactionTable.serial}" 
                                  >
                            <p:outputLabel value="#{glBankTransactionTable.serial}" />
                        </p:column>

                        <p:column style="width: 11vh; text-align: right;font-size:1.8vh" filterStyle="display:none"
                                  filterBy="#{glBankTransactionTable.glBankId.name}" 
                                  filterMatchMode="contains"
                                  headerText="" 
                                  sortBy="#{glBankTransactionTable.glBankId.name}" 
                                  >
                            <f:facet name="filter">
                                <p:selectOneMenu  label="#{userData.userDDs['SAFE']}" id="safe" style="width:100%"
                                                  converter="#{settlementDeedListMB.bankConverter}"
                                                  value="#{settlementDeedListMB.selectGlBank}"  > 
                                    <f:selectItem itemLabel="#{userData.userDDs['SAFE']}"  itemValue="" />
                                    <f:selectItems  value="#{settlementDeedListMB.glBankList}" 
                                                    var="safe" itemLabel="#{safe}" itemValue="#{safe}" />

                                    <p:ajax update="glBankTransactionTable"
                                            event="change"
                                            />
                                </p:selectOneMenu>
                            </f:facet>
                            <p:outputLabel value="#{glBankTransactionTable.glBankId.name}" />
                        </p:column>

                        <p:column style="width: 13vh;text-align: center;font-size: 1.8vh;border-radius: 0px"
                                  filterStyle="display:none"
                                  filterBy="#{glBankTransactionTable.paymentTypeName}" 
                                  filterMatchMode="contains"
                                  headerText="#{userData.userDDs['PAYMENT_METHOD']}" 
                                  sortBy="#{glBankTransactionTable.paymentTypeName}" 
                                  >
                            <p:outputLabel value="#{glBankTransactionTable.paymentTypeName}" />
                        </p:column>


                        <p:column style="width: 10vh;text-align: center;font-size: 1.8vh;border-radius: 0px"
                                  filterStyle="display:none"
                                  filterBy="#{glBankTransactionTable.date}" 
                                  filterMatchMode="contains"
                                  headerText="#{userData.userDDs['DATEE']}" 
                                  sortBy="#{glBankTransactionTable.date}" 
                                  >
                            <p:outputLabel value="#{glBankTransactionTable.date}" >
                                <f:convertDateTime type="date" pattern="dd-MM-yyyy"/>
                            </p:outputLabel>
                        </p:column>


                        <p:column style="width: 10vh;text-align: center;font-size: 1.8vh;border-radius: 0px"
                                  filterStyle="display:none"
                                  filterBy="#{glBankTransactionTable.value}" 
                                  filterMatchMode="contains"
                                  headerText="#{userData.userDDs['AMOUNT']}" 
                                  sortBy="#{glBankTransactionTable.value}" 
                                  >
                            <p:outputLabel value="#{glBankTransactionTable.value}" />
                        </p:column>


                        <p:column style="width: 14vh;text-align: center;font-size: 1.8vh;border-radius: 0px"
                                  filterStyle="display:none"
                                  filterBy="#{glBankTransactionTable.valueLocal}" 
                                  filterMatchMode="contains"
                                  headerText="#{userData.userDDs['LOCAL_AMOUNT']}" 
                                  sortBy="#{glBankTransactionTable.valueLocal}" 
                                  >
                            <p:outputLabel value="#{glBankTransactionTable.valueLocal}" />
                        </p:column>


                        <p:column style="width: 12vh;text-align: center;font-size: 1.8vh;border-radius: 0px"
                                  filterStyle="display:none"
                                  filterBy="#{glBankTransactionTable.remark}" 
                                  filterMatchMode="contains"
                                  headerText="#{userData.userDDs['STATEMENT']}" 
                                  sortBy="#{glBankTransactionTable.remark}" 
                                  >
                            <p:outputLabel value="#{glBankTransactionTable.remark}" />
                        </p:column>





                        <p:column style="width: 14vh;text-align: center;font-size: 1.8vh;border-radius: 0px"
                                  headerText="#{userData.userDDs['TRANSACTION']}" >
                            <p:commandButton update="@form"
                                             class="seditButtons"
                                             icon="fa fa-fw fa-edit"
                                             title="#{userData.userDDs['EDIT']}" 
                                             action="#{settlementDeedListMB.goToEdit()}" 
                                             rendered="#{userData.userScreens['settlementdeed'].edit or userData.isAdmin}">
                                <f:setPropertyActionListener value="#{glBankTransactionTable.id}" 
                                                             target="#{settlementDeedListMB.glBankTransactionIdSeclected}" />
                            </p:commandButton>

                            <p:commandButton  class="sdeleteButtons" update="@form" icon="fa fa-remove"  title="#{userData.userDDs['DELETE']}" style="background-color: red;border-radius: 3px;margin-bottom:3px"  action="#{settlementDeedListMB.delete}" 
                                              rendered="#{userData.userScreens['settlementdeed'].delete or userData.isAdmin}"
                                              disabled="#{glBankTransactionTable.postFlag == 1 or  (not userData.isagUserRole.bankUpdate and glBankTransactionTable.documentSerial ne null   )}">
                                <f:setPropertyActionListener value="#{glBankTransactionTable}" target="#{settlementDeedListMB.glBankTransactionEntitySelected}" />
                                <p:confirm header="Confirmation" message="#{userData.userDDs['ARE_YOU_SURE']}" icon="ui-icon-alert" />
                            </p:commandButton>

                            <p:commandButton   class="sprintButtons"  ajax="false" onclick="form.target = '_blank'" 
                                               icon="fa fa-fw fa-print" style="background-color: rgb(1, 76, 134);border-radius: 3px;margin-bottom:3px"
                                               actionListener="#{settlementDeedListMB.exportPDF}" >
                                <f:attribute name="varValue" value="#{glBankTransactionTable}" />
                            </p:commandButton>
                        </p:column>

                    </p:dataTable> 
                    <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                        <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                        <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                    </p:confirmDialog>
                </div>
            </p:fieldset>
            <p:dialog header="رسالة" widgetVar="sucesses" minHeight="40">
                <h:outputText value="تم الح�?ظ بنجاح" />
            </p:dialog>
        </h:form>
    </ui:define>
</ui:composition>
