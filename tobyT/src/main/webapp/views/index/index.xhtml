<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">
    <h:head>
        <title>Facelet Title</title>
    </h:head>
    <h:body>
        <h:form>
            <h:panelGrid columns="4" cellpadding="5">
                <h:outputLabel for="name" value="Total:" style="font-weight:bold" />
                <p:inputText id="name" value="#{price.total}" />
                <p:commandButton value="Submit" action="#{price.calc}" update="@form" icon="pi pi-check" />
                <br></br>
                <h:outputLabel value="month6" style="font-weight:bold" />
                <h:outputText id="display" value="#{price.month6}" />
                <h:outputLabel value="month12" style="font-weight:bold" />
                <h:outputText id="display2" value="#{price.month12}" />
                <h:outputLabel value="month18" style="font-weight:bold" />
                <h:outputText id="display3" value="#{price.month18}" />
            </h:panelGrid>
        </h:form>
    </h:body>
</html>
