<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
                >
    <ui:define name="content">
        <h:body>

            <h:form dir="RTL" style="margin-right: 20px" id="form" >
                <p:fieldset  legend="حركه اوامر الشغل" id="stages"  style="margin-bottom:20px">
                    <div class="ui-g-6 ui-xl-6">
                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">
                                <p:selectOneMenu  value="#{proProductionTransactionFormMBNew.tobyUserDTOSelected}"  filter="true" filterMatchMode="contains"
                                                  converter="#{proProductionTransactionFormMBNew.tobyUserDTOConverter}"
                                                  >
                                    <f:selectItems  var="tobyuser"  
                                                    value="#{proProductionTransactionFormMBNew.tobyUserDTOList}"                                                     
                                                    itemLabel="#{tobyuser}"
                                                    itemValue="#{tobyuser}" />
                                    <p:ajax event="itemSelect"  listener="#{proProductionTransactionFormMBNew.changeUser(tobyuser)}" update="@form" />
                                </p:selectOneMenu>

                            </div>
                            <div class="ui-g-6 ui-xl-6">


                                <p:outputLabel style="width: 50px;margin-right: 1%" value="العامل"/>


                            </div>
                        </div>
                    </div>

                    <div class="ui-g-6 ui-xl-6">
                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">
                                <p:selectOneMenu  value="#{proProductionTransactionFormMBNew.tobyUserProproductionDTOSelected}" 
                                                  converter="#{proProductionTransactionFormMBNew.tobyUserProproductionDTOConverter}"
                                                  >
                                    <f:selectItems  var="stages"  value="#{proProductionTransactionFormMBNew.tobyUserProproductionDTOList}"                                                     
                                                    itemLabel="#{stages}"
                                                    itemValue="#{stages}" />
                                </p:selectOneMenu>

                            </div>
                            <div class="ui-g-6 ui-xl-6">


                                <p:outputLabel style="width: 50px;margin-right: 1%" value=" مراحل الانتاج"/>


                            </div>
                        </div>
                    </div>

                    <div class="ui-g-6 ui-xl-6">
                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">
                                <p:inputText value="#{proProductionTransactionFormMBNew.invInvoiceSerial}" />
                            </div>
                            <div class="ui-g-6 ui-xl-6">
                                <p:outputLabel style="width: 50px;margin-right: 1%" value="رقم الفاتورة"/>
                            </div>
                        </div>
                    </div>

                    <h:panelGroup>
                        <p:commandButton     class="saveButton"  
                                             title="بحث"
                                             value="بحث" 
                                             icon="fa fa-fw fa-save" 
                                             action="#{proProductionTransactionFormMBNew.updateDetailItems()}" 
                                             update="@form"
                                             >
                        </p:commandButton> 
                    </h:panelGroup>
                </p:fieldset>

                <p:messages id="messages" showDetail="true" closable="true"/> 
                <p:fieldset  legend="الاصناف"   style="margin-bottom:20px">

                    <p:dataTable  id="table4"
                                  var="table4"
                                  value="#{proProductionTransactionFormMBNew.detailDetailDetailViewDTOList}"
                                  draggableColumns="true"
                                  paginator="true" 
                                  widgetVar="table4" 
                                  rows="7"
                                  selection="#{proProductionTransactionFormMBNew.proProductionTransactionDetailDetailViewDTOSelected}"
                                  rowIndexVar="index" 
                                  emptyMessage="EMPTY_TABLE"
                                  rowKey="#{table4.index}"
                                  >
                        <p:column id="invItem" headerText="صنف" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{table4.invItemName}"/>  



                        </p:column>
                        <p:column id="quantity" headerText="العدد" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{table4.quantity}"/> 
                        </p:column>
                        <p:column id="numberRemain" headerText="الكميه المتبقيه " style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{table4.numberRemain}" />
                        </p:column>
                        <p:column headerText="الكميه المنفذه " style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:inputText value="#{table4.numberExcute}" rendered="#{table4.numberRemain > 0}"  />
                        </p:column>
                        <p:column headerText="الحركة " style="width: 10vh;text-align: -webkit-auto" >
                            <p:commandButton     class="saveButton"  
                                                 style="width: 10vh;text-align: -webkit-auto"
                                                 title="تم الانتهاء"
                                                 value="تم النتهاء" 
                                                 icon="fa fa-fw fa-save" 
                                                 action="#{proProductionTransactionFormMBNew.save()}" 
                                                 update=":form:messages table4"
                                                 >

                                <f:setPropertyActionListener value="#{table4}"
                                                             target="#{proProductionTransactionFormMBNew.proProductionTransactionDetailDetailViewDTOSelected}" >


                                </f:setPropertyActionListener>

                            </p:commandButton> 


                        </p:column>

                    </p:dataTable>
                </p:fieldset>
            </h:form>
        </h:body>
    </ui:define>
</ui:composition>
