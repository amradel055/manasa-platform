<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="./../../template/newTemplate.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <link rel="stylesheet" type="text/css" href="../../resources/css/main.css" /> 
    <link rel="stylesheet" type="text/css" href="./../../resources/css/custom.css" /> 
    <link rel="stylesheet" href="//cdn.jsdelivr.net/chartist.js/latest/chartist.min.css"/>
    <ui:define name="content">
         <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form  class='formmargin'  id="form" dir="#{userData.dir}">
            <div style=" position: absolute;left: 20px"> 

                    <p:commandButton  style="z-index: 2;
                                      margin-top: 24%;
                                      color: #035c70!important; 
                                      background-color: #223238!important;
                                      border: 1px solid #22323a!important;
                                      background: #22323a 50% 50% repeat-x!important;"
                                      icon="fa fa-fw fa-home"
                                      title="#{userData.userDDs['HOME']}"
                                      class="smhomeButton" 
                                      action="exit" />
                       
                </div>
            <div>

                <p:messages autoUpdate="true"  id="cupmsg" showDetail="true" closable="true" rendered="true" />   
            </div>
            <p:fieldset legend="#{userData.userDDs['ACCOUNT_SETTINGS']}" style="margin-bottom:20px">

                <p:dataTable id="subaccc" 
                             value="#{monitoringSettingMB.glAnalyticsList}"
                             var="glAnalytic"
                             selection="#{monitoringSettingMB.glAnalyticsAccounts}" 
                             selectionMode="single"
                             rowKey="#{glAnalytic}"
                             widgetVar="glAnalytic">
                    <f:facet name="header" class="col-md-12">
                       
                         <p:outputPanel>
                                <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large;" />
                                <p:inputText   id="globalFilter"   onkeyup="PF('glAnalytic').filter()" style='width: 30%!important;' />
                            </p:outputPanel>

                    </f:facet>
                    <p:column style="width:40vh;font-size: 1.5vh;text-align: -webkit-auto ;border-radius: 0px"
                              filterBy="#{userData.userDDs[''+= glAnalytic.code]}" 
                              filterMatchMode="contains" sortBy="#{userData.userDDs[''+= glAnalytic.code]}" filterable="false" >
                        <h:outputLabel value="#{userData.userDDs[''+= glAnalytic.code]}"   style="font-size: 1.2vh"/>
                    </p:column>
                    <p:column style="width:40vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px"  headerText="#{userData.userDDs['ACCOUNT']}">
                        <p:autoComplete id="GlAccount_ID" 
                                        style="width: 47%" 
                                        dropdown="true"
                                        converter="#{monitoringSettingMB.glaccountConverter}"
                                        value="#{glAnalytic.accountId}"
                                        var="p"
                                        itemLabel="#{p}" 
                                        itemValue="#{p}" 
                                        forceSelection="true" 
                                        completeMethod="#{monitoringSettingMB.completeGlAccount}" >
                            <f:attribute name="varValue" value="#{glAnalytic}" />
                            <p:ajax event="itemSelect" listener="#{monitoringSettingMB.selectAccountNumber}" /> 


                        </p:autoComplete>
                    </p:column>

                </p:dataTable>
                <h:panelGroup class="centerButtons" style="margin-top: 1%">
                     <p:commandButton  class="saveallButtons" id="b3" title="#{userData.userDDs['SAVE_ALL']}"  value="#{userData.userDDs['SAVE_ALL']}" 
                                         style="color: #fff!important;background-color: #8b00ff;margin-left: 5px" 
                                         actionListener="#{monitoringSettingMB.saveAll}" 
                                         rendered="#{userData.userScreens['shiftingJournalsettings'].add or userData.isAdmin}">
                        </p:commandButton>
                    
                    <p:commandButton class="closeButtons" 
                                         title="#{userData.userDDs['BACK']}" 
                                         immediate="true" 
                                         value="#{userData.userDDs['BACK']}" 
                                         style="color: #fff!important;background-color: #0034ffeb;margin-left: 5px" 
                                         action="exit"   />

                        <p:blockUI block="form" trigger="b3" animate="true" >

                            <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                        </p:blockUI> 
                </h:panelGroup>
            </p:fieldset>
        </h:form>
    </ui:define>
</ui:composition>
