<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <h:form id="form"  dir="#{userData.dir}" class='formmargin'>

            <div class="col-xs-12">
                <p:messages id="curmsg" showDetail="true" rendered="true" closable="true"/>   
            </div>
            <p:fieldset   legend="فواتير اوامر الشغل" >


                <p:dataTable id="invInvoicePurchaseTable"
                             var="invInvoicePurchaseTable" 
                             widgetVar="bTable" 
                             rowIndexVar="index" 
                             value="#{invPurchaseInvoiceListDTOMB.dataModel}"
                             paginator="true"
                             rows="10" 
                             lazy="true" 
                             paginatorTemplate="{CurrentPageReport} {FirstPageLink}
                             {PreviousPageLink} {PageLinks} {NextPageLink}
                             {LastPageLink} {RowsPerPageDropdown}" 
                             emptyMessage="#{userData.userDDs['EMPTY_TABLE']}" 
                             >

                    <f:facet name="header" >
                        <p:commandButton  icon="fa fa-plus" 
                                          class="saddButton"
                                          title="#{userData.userDDs['ADD']}" 
                                          action="#{invPurchaseInvoiceListDTOMB.goToAdd()}" 
                                          style="float:right" 
                                          rendered="#{userData.userScreens['proworkorder'].add or userData.isAdmin}"/>

                        <p:selectOneMenu id="inventory" value="#{invPurchaseInvoiceListDTOMB.invGallarySelection}"
                                         converter="#{invPurchaseInvoiceListDTOMB.gallaryDTOConverter}" 
                                         style="float:right;width: 20%!important;color:#fff;height: 30px!important;margin-right: 0.5%;">

                            <p:ajax listener="#{invPurchaseInvoiceListDTOMB.loadGallaryList()}" update="form" />
                            <f:selectItem itemLabel="#{userData.userDDs['ALL']}" itemValue="" />

                            <f:selectItems value="#{invPurchaseInvoiceListDTOMB.gallaryList}" 
                                           var="inventory" itemLabel="#{inventory.name}"
                                           itemValue="#{inventory}"/> 
                        </p:selectOneMenu>


                        <div class="ui-g-6 ui-xl-6">
                            <p:autoComplete style="width:37%!important"
                                            dropdown="true"
                                            converter="#{invPurchaseInvoiceListDTOMB.organizationSiteDTOConvertor}"
                                            value="#{invPurchaseInvoiceListDTOMB.invInvoiceDTO.organizationSiteId}"
                                            var="supplier"
                                            itemLabel="#{supplier}" 
                                            itemValue="#{supplier}" 
                                            forceSelection="true" 
                                            completeMethod="#{invPurchaseInvoiceListDTOMB.completeCustomerFrom}" 
                                            >
                            </p:autoComplete>
                        </div>


                        <p:outputPanel  >
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" onkeyup="PF('bTable').filter()" style="width:150px" />
                        </p:outputPanel>
                    </f:facet>

                    <p:column  style="width: 10vh;font-size: 1.6vh;border-radius: 0px;"  filterStyle="display:none" 
                               filterBy="#{invInvoicePurchaseTable.serialTax}" 
                               filterMatchMode="contains" 
                               headerText="#{userData.userDDs['INVOICE_NO']}"
                               sortBy="#{invInvoicePurchaseTable.serialTax}"
                               >
                        <p:outputLabel value="#{invInvoicePurchaseTable.serialTax}" />
                    </p:column>


                    <p:column style="width: 9vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px;" filterStyle="display:none" 
                              filterBy="#{invInvoicePurchaseTable.date}" 
                              filterMatchMode="contains"
                              headerText="#{userData.userDDs['DATEE']}"
                              sortBy="#{invInvoicePurchaseTable.date}" 
                              >
                        <p:outputLabel value="#{invInvoicePurchaseTable.date}" >
                            <f:convertDateTime type="date" pattern="dd-MM-yyyy"/>
                        </p:outputLabel>                           
                    </p:column>

                    <p:column style="width: 9vh;font-size: 1.8vh;border-radius: 0px;" filterStyle="display:none"
                              filterBy="#{invInvoicePurchaseTable.invInventoryId.name}"
                              filterMatchMode="contains" 
                              headerText="#{userData.userDDs['DEPOSITORY']}"
                              sortBy="#{invInvoicePurchaseTable.invInventoryId.name}" 
                              >
                        <p:outputLabel value="#{invInvoicePurchaseTable.invInventoryId.name}" />
                    </p:column>

                    <p:column style="width: 8vh;font-size: 1.8vh;border-radius: 0px;" filterStyle="display:none"
                              filterBy="#{invInvoicePurchaseTable.organizationSiteName}"
                              filterMatchMode="contains" 
                              headerText="العميل"
                              sortBy="#{invInvoicePurchaseTable.organizationSiteName}" 
                              >
                        <p:outputLabel value="#{invInvoicePurchaseTable.organizationSiteName}" />
                    </p:column>

                    <p:column style="width: 9vh;font-size: 1.8vh;border-radius: 0px;" filterStyle="display:none"
                              filterBy="#{invInvoicePurchaseTable.invDelegatorName}"
                              filterMatchMode="contains" 
                              headerText="#{userData.userDDs['DELEGATOR']}"
                              sortBy="#{invInvoicePurchaseTable.invDelegatorName}" 
                              >
                        <p:outputLabel value="#{invInvoicePurchaseTable.invDelegatorName}" />
                    </p:column>
                    <p:column style="width: 10vh;font-size: 1.8vh;border-radius: 0px;" filterStyle="display:none"
                              filterBy="#{invInvoicePurchaseTable.paymentType}"
                              filterMatchMode="contains" 
                              headerText="#{userData.userDDs['INVO_TYP']}"
                              sortBy="#{invInvoicePurchaseTable.paymentType}" >
                        <p:outputLabel value="#{invInvoicePurchaseTable.paymentType == 0 ? userData.userDDs['CASH'] : invInvoicePurchaseTable.paymentType == 1 ? userData.userDDs['POSTPONE']  :  invInvoicePurchaseTable.paymentType == 2 ? userData.userDDs['CREDIT_DOCUMENT'] : invInvoicePurchaseTable.paymentType}" />
                    </p:column>
                    <p:column style="width: 10vh;font-size: 1.8vh;border-radius: 0px;" filterStyle="display:none"
                              filterBy="#{invInvoicePurchaseTable.createdByName}"
                              filterMatchMode="contains" 
                              headerText="#{userData.userDDs['INVOI_ENTR']}"
                              sortBy="#{invInvoicePurchaseTable.createdByName}" >
                        <p:outputLabel value="#{invInvoicePurchaseTable.createdByName}" />
                    </p:column>
                    <p:column style="width: 10vh;font-size: 1.8vh;border-radius: 0px;" filterStyle="display:none"
                              filterBy="#{invInvoicePurchaseTable.remarks}"
                              filterMatchMode="contains" 
                              headerText="#{userData.userDDs['NOTE']}"
                              sortBy="#{invInvoicePurchaseTable.remarks}" >
                        <p:outputLabel value="#{invInvoicePurchaseTable.remarks}" />
                    </p:column>
                    <p:column  style="width: 12vh;font-size: 1.8vh;text-align:center;border-radius: 0px;" headerText="#{userData.userDDs['TRANSACTION']}" >
                        <p:commandButton  
                            update="@form" 
                            class="smsearchButtons"
                            icon="fa fa-fw fa-search-plus"  style="background-color: rgba(63, 81, 181, 0.88);border-radius: 3px;"
                            title="#{userData.userDDs['VIEW']}" 
                            action="#{invPurchaseInvoiceListDTOMB.goToEdit()}" 
                            rendered="#{userData.userScreens['proworkorder'].view or userData.isAdmin}" >

                            <f:setPropertyActionListener value="#{invInvoicePurchaseTable}" 
                                                         target="#{invPurchaseInvoiceListDTOMB.invInvoiceDTOSelected}" />
                        </p:commandButton>

                        <p:commandButton update="@form" 
                                             class="sdeleteButtons"
                                             icon="fa fa-remove" 
                                             style="background-color: red;border-radius: 3px;"
                                             title="#{userData.userDDs['DELETE']}" 
                                             action="#{invPurchaseInvoiceListDTOMB.delete()}" 
                                             rendered="#{userData.userScreens['proworkorder'].edit or userData.isAdmin}">
                                <f:setPropertyActionListener value="#{invInvoicePurchaseTable}" target="#{invPurchaseInvoiceListDTOMB.invInvoiceDTOSelected}" />
                                <p:confirm header="Confirmation" message="#{userData.userDDs['ARE_YOU_SURE']}" icon="ui-icon-alert" />

                            </p:commandButton>

                        <p:commandButton 
                            class="sprintButtons"
                            update="@form" onclick="form.target = '_blank'"  ajax="false"
                            icon="fa fa-fw fa-print" style="background-color: rgb(0, 74, 128);border-radius: 3px;"
                            title="print" 
                            action="#{invPurchaseInvoiceListDTOMB.printList()}" 
                            rendered="#{userData.userScreens['proworkorder'].view or userData.isAdmin}" >


                            <f:setPropertyActionListener value="#{invInvoicePurchaseTable}" 
                                                         target="#{invPurchaseInvoiceListDTOMB.invInvoiceDTOSelected}" />
                        </p:commandButton>

                    </p:column>
                    <f:facet name="footer"   >

                    </f:facet>
                </p:dataTable> 
                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                    <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                    <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                </p:confirmDialog>

            </p:fieldset>
            
            <p:fieldset   legend="بحث بالعميل" >


                <p:dataTable id="invInvoicePurchaseTable2"
                             draggableColumns="true"
                             draggableRows="true"
                             var="invInvoicePurchaseTable2" 
                             widgetVar="bTable2" 
                             rowIndexVar="index" 
                             value="#{invPurchaseInvoiceListDTOMB.invInvoiceList}"
                             paginator="true"
                             rows="10" 
                             paginatorTemplate="{CurrentPageReport} {FirstPageLink}
                             {PreviousPageLink} {PageLinks} {NextPageLink}
                             {LastPageLink} {RowsPerPageDropdown}" 
                             emptyMessage="#{userData.userDDs['EMPTY_TABLE']}" 
                             >

                    <f:facet name="header" >

                        <div class="ui-g-6 ui-xl-6">
                            <p:autoComplete style="width:37%!important"
                                            dropdown="true"
                                            converter="#{invPurchaseInvoiceListDTOMB.organizationSiteDTOConvertor}"
                                            value="#{invPurchaseInvoiceListDTOMB.invInvoiceDTO.organizationSiteId}"
                                            var="supplier"
                                            itemLabel="#{supplier}" 
                                            itemValue="#{supplier}" 
                                            forceSelection="true" 
                                            completeMethod="#{invPurchaseInvoiceListDTOMB.completeCustomerFrom}" 
                                            >
                                <p:ajax event="itemSelect" listener="#{invPurchaseInvoiceListDTOMB.search()}" update="invInvoicePurchaseTable2"  />
                            </p:autoComplete>
                        </div>
                        العميل
                    </f:facet>

                    <p:column  style="width: 10vh;font-size: 1.6vh;border-radius: 0px;"  filterStyle="display:none" 
                               filterBy="#{invInvoicePurchaseTable2.serial}" 
                               filterMatchMode="contains" 
                               headerText="#{userData.userDDs['INVOICE_NO']}"
                               sortBy="#{invInvoicePurchaseTable2.serial}"
                               >
                        <p:outputLabel value="#{invInvoicePurchaseTable2.serial}" />
                    </p:column>


                    <p:column style="width: 9vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px;" filterStyle="display:none" 
                              filterBy="#{invInvoicePurchaseTable2.date}" 
                              filterMatchMode="contains"
                              headerText="#{userData.userDDs['DATEE']}"
                              sortBy="#{invInvoicePurchaseTable2.date}" 
                              >
                        <p:outputLabel value="#{invInvoicePurchaseTable2.date}" >
                            <f:convertDateTime type="date" pattern="dd-MM-yyyy"/>
                        </p:outputLabel>                           
                    </p:column>

                    <p:column style="width: 9vh;font-size: 1.8vh;border-radius: 0px;" filterStyle="display:none"
                              filterBy="#{invInvoicePurchaseTable2.invInventoryId.name}"
                              filterMatchMode="contains" 
                              headerText="#{userData.userDDs['DEPOSITORY']}"
                              sortBy="#{invInvoicePurchaseTable2.invInventoryId.name}" 
                              >
                        <p:outputLabel value="#{invInvoicePurchaseTable2.invInventoryId.name}" />
                    </p:column>

                    <p:column style="width: 8vh;font-size: 1.8vh;border-radius: 0px;" filterStyle="display:none"
                              filterBy="#{invInvoicePurchaseTable2.organizationSiteName}"
                              filterMatchMode="contains" 
                              headerText="العميل"
                              sortBy="#{invInvoicePurchaseTable2.organizationSiteName}" 
                              >
                        <p:outputLabel value="#{invInvoicePurchaseTable2.organizationSiteName}" />
                    </p:column>

                    <p:column style="width: 9vh;font-size: 1.8vh;border-radius: 0px;" filterStyle="display:none"
                              filterBy="#{invInvoicePurchaseTable2.invDelegatorName}"
                              filterMatchMode="contains" 
                              headerText="#{userData.userDDs['DELEGATOR']}"
                              sortBy="#{invInvoicePurchaseTable2.invDelegatorName}" 
                              >
                        <p:outputLabel value="#{invInvoicePurchaseTable2.invDelegatorName}" />
                    </p:column>
                    <p:column style="width: 10vh;font-size: 1.8vh;border-radius: 0px;" filterStyle="display:none"
                              filterBy="#{invInvoicePurchaseTable2.paymentType}"
                              filterMatchMode="contains" 
                              headerText="#{userData.userDDs['INVO_TYP']}"
                              sortBy="#{invInvoicePurchaseTable2.paymentType}" >
                        <p:outputLabel value="#{invInvoicePurchaseTable2.paymentType == 0 ? userData.userDDs['CASH'] : invInvoicePurchaseTable2.paymentType == 1 ? userData.userDDs['POSTPONE']  :  invInvoicePurchaseTable2.paymentType == 2 ? userData.userDDs['CREDIT_DOCUMENT'] : invInvoicePurchaseTable2.paymentType}" />
                    </p:column>
                    <p:column style="width: 10vh;font-size: 1.8vh;border-radius: 0px;" filterStyle="display:none"
                              filterBy="#{invInvoicePurchaseTable2.createdByName}"
                              filterMatchMode="contains" 
                              headerText="#{userData.userDDs['INVOI_ENTR']}"
                              sortBy="#{invInvoicePurchaseTable2.createdByName}" >
                        <p:outputLabel value="#{invInvoicePurchaseTable2.createdByName}" />
                    </p:column>
                    <p:column style="width: 10vh;font-size: 1.8vh;border-radius: 0px;" filterStyle="display:none"
                              filterBy="#{invInvoicePurchaseTable2.remarks}"
                              filterMatchMode="contains" 
                              headerText="#{userData.userDDs['NOTE']}"
                              sortBy="#{invInvoicePurchaseTable2.remarks}" >
                        <p:outputLabel value="#{invInvoicePurchaseTable2.remarks}" />
                    </p:column>
                    <p:column  style="width: 12vh;font-size: 1.8vh;text-align:center;border-radius: 0px;" headerText="#{userData.userDDs['TRANSACTION']}" >
                        <p:commandButton  
                            update="@form" 
                            class="smsearchButtons"
                            icon="fa fa-fw fa-search-plus"  style="background-color: rgba(63, 81, 181, 0.88);border-radius: 3px;"
                            title="#{userData.userDDs['VIEW']}" 
                            action="#{invPurchaseInvoiceListDTOMB.goToEdit()}"  >
                            <f:setPropertyActionListener value="#{invInvoicePurchaseTable2}" 
                                                         target="#{invPurchaseInvoiceListDTOMB.invInvoiceDTOSelected}" />
                        </p:commandButton>



                        <p:commandButton 
                            class="sprintButtons"
                            update="@form" onclick="form.target = '_blank'"  ajax="false"
                            icon="fa fa-fw fa-print" style="background-color: rgb(0, 74, 128);border-radius: 3px;"
                            title="print" 
                            action="#{invPurchaseInvoiceListDTOMB.printList()}"  >
                            <f:setPropertyActionListener value="#{invInvoicePurchaseTable2}" 
                                                         target="#{invPurchaseInvoiceListDTOMB.invInvoiceDTOSelected}" />
                        </p:commandButton>

                    </p:column>
                    <f:facet name="footer"   >

                    </f:facet>
                </p:dataTable> 
                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                    <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                    <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                </p:confirmDialog>

            </p:fieldset>
        </h:form>
    </ui:define>
</ui:composition>
