                                   filterMatchMode="contains" 
                                   sortBy="#{invPurchaseInvoiceDetailsTable.clothNumber}"

                                         value="#{invPurchaseInvoiceDetailsTable.clothNumber}" style="width: 95%" >
                                <p:ajax listener="#{invPurchaseInvoiceFormDTOMB.checkProof(invPurchaseInvoiceDetailsTable)}" update="proof2 proof" />
                            </p:inputText>  

                        </p:column>
