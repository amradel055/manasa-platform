<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <title>Facelet Title</title>
    </h:head>
    <h:body>
        <h:form id="screenActionForm" dir="#{userData.dir}" >
            <p:fieldset legend="#{userData.userDDs['PRIVILEGE_MANAGEMENT']}">
                <p:outputLabel  value="Basic"/>
                <p:selectOneMenu id="roles" value="#{privilegeBean.selectedRoleId}" 
                                            converter="#{privilegeBean.tobyRoleDTOConverter}" >
                    <f:selectItem itemLabel="Select One" itemValue=""/>
                    <f:selectItems value="#{privilegeBean.roles}" var="role" itemValue="#{role}" itemLabel="#{role.name}"/>
                </p:selectOneMenu>
            </p:fieldset> 
        </h:form>
    </h:body>
</html>
