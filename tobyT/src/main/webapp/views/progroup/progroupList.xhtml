<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form id="progroupListForm" dir="#{userData.dir}" class='formmargin'>
            <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                  margin-top: 24%;
                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;"
                                  icon="fa fa-fw fa-home"
                                  title="#{userData.userDDs['HOME']}"
                                  class="smhomeButton" 
                                  action="exit" />

            </div>
            <p:fieldset legend="#{userData.userDDs['ITEMS_GROUP']}" style="margin-bottom:20px">
                <div >
                    <p:messages autoUpdate="true"  id="messages" showDetail="true" closable="true"/>   
                </div>

                <p:dataTable 
                    draggableColumns="true" 
                    draggableRows="true"
                    var="progroupTable" 
                    widgetVar="progroupTable"  
                    rowIndexVar="index" 
                    value="#{proGroupListBean.proGroupDTOList}"
                    rows="#{userData.rowListCount}" 
                    paginator="true" 
                    selection="#{proGroupListBean.proGroupDTO}"
                    rowKey="#{progroupTable.index}"
                    sortBy="#{1}"
                    emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                    id="progroupTable">
                    <f:facet name="header">
                        <p:commandButton  class="saddButton" style="float:right" icon="fa fa-plus" title="#{userData.userDDs['ADD']}" action="#{proGroupListBean.goToAdd()}" 
                                          rendered="#{userData.userScreens['progroup'].add or userData.isAdmin}"/>

                        <p:outputPanel  >
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" a:autofocus="true" onkeyup="PF('progroupTable').filter()" style="width:150px" />
                        </p:outputPanel>
                    </f:facet>
                    
                    <p:column style="text-align: right;font-size: 15px;border-radius: 0px"  
                              filterStyle="display:none" filterBy="#{progroupTable.serial}"  
                              filterMatchMode="contains" headerText="#{userData.userDDs['CODE']}" sortBy="#{progroupTable.serial}">
                        <p:outputLabel value="#{progroupTable.serial}" />
                    </p:column>
                    <p:column style="text-align: right;font-size: 15px;border-radius: 0px"  
                              filterStyle="display:none" filterBy="#{progroupTable.name}"  
                              filterMatchMode="contains" headerText="#{userData.userDDs['NAME']}" sortBy="#{progroupTable.name}">
                        <p:outputLabel value="#{progroupTable.name}" />
                    </p:column>

                    <p:column style="width:16vh;text-align: center;font-size: 15px;border-radius: 0px"  headerText="#{userData.userDDs['TRANSACTION']}">
                        <p:commandButton update="@form" icon="fa fa-fw fa-edit"
                                         class="seditButtons" style="background-color: #6a6967;border-radius: 3px;margin-bottom:3px"
                                         title="#{userData.userDDs['EDIT']}" action="#{proGroupListBean.goToEdit()}"
                                         rendered="#{userData.userScreens['progroup'].edit or userData.isAdmin}">
                            <f:setPropertyActionListener value="#{progroupTable.id}"  target="#{proGroupListBean.proGroupSelected}" />
                        </p:commandButton>
                        <p:commandButton  class="sdeleteButtons" update="progroupListForm:progroupTable" icon="fa fa-remove" style="background-color: red;border-radius: 3px;margin-bottom:3px"   
                                          title="#{userData.userDDs['DELETE']}"  action="#{proGroupListBean.delete()}" 
                                          rendered="#{userData.userScreens['progroup'].delete or userData.isAdmin}">
                            <f:setPropertyActionListener value="#{progroupTable}" target="#{proGroupListBean.proGroupDTO}" />
                            <p:confirm header="Confirmation" message="#{userData.userDDs['ARE_YOU_SURE']}" icon="ui-icon-alert" />
                        </p:commandButton>
                    </p:column>
                </p:dataTable>
                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                    <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                    <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                </p:confirmDialog>

            </p:fieldset>
        </h:form>
    </ui:define>
</ui:composition>
