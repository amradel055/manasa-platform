<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <h:form id="ScreenAddEditForm" dir="#{userData.dir}" class='formmargin'>
            <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                  margin-top: 12%;
                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;"
                                  icon="fa fa-fw fa-home"
                                  title="#{userData.userDDs['HOME']}"
                                  class="smhomeButton" 
                                  action="exit" />  
            </div>

            <p:fieldset legend="  بيانات العميل" style="margin-bottom:20px" id="dlgeventaddsetcustomer" >

                <div class="ui-g-6 ui-md-6" >
                    <div class="ui-g-12 ui-md-6" >
                        <div class="ui-g-6 ui-md-6" >
                            <p:outputLabel   id="employeeNameevent"  value="#{crmEventFormDTOMB.crmEventDTO.customerId.name}"/>
                        </div>
                        <div class="ui-g-6 ui-md-6" >
                            <p:outputLabel   value="الاسم" />
                        </div>
                    </div>

                    <div class="ui-g-12 ui-md-6">
                        <div class="ui-g-6 ui-md-6" >
                            <p:outputLabel   id="mobileevent"  value="#{crmEventFormDTOMB.crmEventDTO.customerId.mobile}"/>

                        </div>
                        <div class="ui-g-6 ui-md-6">
                            <p:outputLabel   value="الموبايل" />
                        </div>
                    </div>

                    <div class="ui-g-12 ui-md-6" >

                        <div class="ui-g-6 ui-md-6" >
                            <p:outputLabel    id="employeeCode2event" value="#{crmEventFormDTOMB.crmEventDTO.customerId.email}" />
                        </div>
                        <div class="ui-g-6 ui-md-6">
                            <p:outputLabel  value="البريد الالكتروني" />
                        </div>
                    </div>
                </div>


                <div class="ui-g-6 ui-md-6" style="padding: 0px;">
                    <div class="ui-g-12 ui-md-12" style="padding: 0px;">
                        <div class="ui-g-6 ui-md-6" style="padding: 0px;">
                            <p:outputLabel    id="employeeCode2event" value="#{crmEventFormDTOMB.crmEventDTO.gallarySelected.name}" />

                        </div>
                        <div class="ui-g-6 ui-md-6" style="padding: 0px;">
                            <p:outputLabel style="width:99px;margin-right: 2.5%"  value="المعرض" />
                        </div>

                    </div>

                    <div class="ui-g-12 ui-md-12" style="padding: 0px;">
                        <div class="ui-g-6 ui-md-6" style="padding: 0px;">
                            <p:outputLabel    id="employeeCode2event" value="#{crmEventFormDTOMB.crmEventDTO.customerId.code}" />

                        </div>
                        <div class="ui-g-6 ui-md-6" style="padding: 0px;">
                            <p:outputLabel style="width:99px;margin-right: 2.5%"  value="كود العميل" />
                        </div>
                    </div>

                    <div class="ui-g-12 ui-md-12" style="padding: 0px;">
                        <div class="ui-g-6 ui-md-6" style="padding: 0px;">
                            <p:outputLabel    id="employeeCode2event" value="#{crmEventFormDTOMB.crmEventDTO.invoiceId}" />

                        </div>
                        <div class="ui-g-6 ui-md-6" style="padding: 0px;">
                            <p:outputLabel style="width:99px;margin-right: 2.5%"  value="رقم الفاتورة" />
                        </div>

                    </div>
                </div>
            </p:fieldset>

            <p:fieldset legend="تفاصيل  الشكوى" style="margin-bottom:20px" id="dlgeventaddset" >

                <div   class="ui-g-6 ui-g-nopad" style="padding: 0px;">


                    <div class="ui-g-12 ui-md-6" style="padding: 0px;">

                        <div class="ui-g-6 ui-md-6" style="padding: 0px;">
                            <p:outputLabel    id="employeeCode2event" value="#{crmEventFormDTOMB.crmEventDTO.assignedTo.name}" />

                        </div>
                        <div class="ui-g-6 ui-md-6" style="padding: 0px;">
                            <p:outputLabel style="width:104px;margin-right: 5%"  value="المتابع" />
                        </div>
                    </div>


                    <div class="ui-g-12 ui-md-6" style="padding: 0px;">

                        <div class="ui-g-6 ui-md-6" style="padding: 0px;">
                            <p:outputLabel    id="employeeCode2event" value="#{crmEventFormDTOMB.crmEventDTO.crmType.name}" />

                        </div>
                        <div class="ui-g-6 ui-md-6" style="padding: 0px;">
                            <p:outputLabel style="width:104px;margin-right: 5%"  value="نوع الشكاوي" />
                        </div>
                    </div>


                    <div class="ui-g-12 ui-md-6" style="padding: 0px;">

                        <div class="ui-g-6 ui-md-6" style="padding: 0px;">
                            <p:outputLabel    id="employeeCode2event" value="#{crmEventFormDTOMB.crmEventDTO.symbolPriority.name}" />
                        </div>
                        <div class="ui-g-6 ui-md-6" style="padding: 0px;">
                            <p:outputLabel style="width:104px;margin-right: 5%"  value="الأولوية" />
                        </div>
                    </div>


                </div>
                <div   class="ui-g-6 ui-g-nopad" style="padding: 0px;">
                    <div class="ui-g-12 ui-md-6" style="padding: 0px;">

                        <div class="ui-g-6 ui-md-6" style="padding: 0px;">
                            <p:outputLabel    id="employeeCode2event" value="#{crmEventFormDTOMB.crmEventDTO.subject}" />

                        </div>
                        <div class="ui-g-6 ui-md-6" style="padding: 0px;">
                            <p:outputLabel style="width:104px;margin-right: 5%"  value="عنوان الشكوي" />
                        </div>
                    </div>


                    <div class="ui-g-12 ui-md-6" style="padding: 0px;">

                        <div class="ui-g-6 ui-md-6" style="padding: 0px;">
                            <p:outputLabel    id="employeeCode2event" value="#{crmEventFormDTOMB.crmEventDTO.discription}" />

                        </div>
                        <div class="ui-g-6 ui-md-6" style="padding: 0px;">
                            <p:outputLabel style="width:104px;margin-right: 5%"  value="نص الشكوي" />
                        </div>
                    </div>
                </div>
            </p:fieldset>

            <p:fieldset>
                     <div class="ui-g-12 ui-md-6" style="padding: 0px;">

                            <div class="ui-g-6 ui-md-6" style="padding: 0px;">
                                <p:selectOneMenu value="#{crmEventFormDTOMB.eventResponseDTO.assignedTo}" converter="#{globalMB.employeeDTOConverter}" effect="fold" >
                                    <f:selectItems value="#{crmEventFormDTOMB.employeeDTOList}" var="employeeevent" itemLabel="#{employeeevent}" itemValue="#{employeeevent}" />
                                 
                                </p:selectOneMenu>
                            </div>
                            <div class="ui-g-6 ui-md-6" style="padding: 0px;">
                                <p:outputLabel style="width:104px;margin-right: 5%"  value="المتابع" />
                            </div>
                        </div>
                 <div class="ui-g-12 ui-md-6" style="padding: 0px;">

                            <div class="ui-g-6 ui-md-6" style="padding: 0px;">
                               <p:inputText style="width:34%!important " 
                                            value="#{crmEventFormDTOMB.eventResponseDTO.comment}"
                                             >
                                </p:inputText>
                            </div>
                            <div class="ui-g-6 ui-md-6" style="padding: 0px;">
                                <p:outputLabel style="width:104px;margin-right: 5%"  value="التعليق" />
                            </div>
                        </div>
                
                    <h:panelGroup>
                    <p:commandButton   class="saveButton"  
                                       id="saveB" 
                                       title="#{userData.userDDs['SAVE']}"
                                       value="#{userData.userDDs['SAVE']}" 
                                       style=""
                                       action="#{crmEventFormDTOMB.save()}" 
                                       update="@form"
                                       />
                </h:panelGroup>
                
                
            </p:fieldset>

            <h:panelGrid id="pn1"   class="centerButtons col-md-12" columns="1"  style="margin-top: 2%">


            
            </h:panelGrid>
            <p:blockUI block="ScreenAddEditForm" trigger="saveB newN " animate="true" >

                <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>
            </p:blockUI>

            <p:dialog id="dialog1"  widgetVar="dlg12" >
                <p:fieldset legend="تفاصيل الشكوي" style="margin-bottom:20px">

                    <p:dataTable id="activities"
                                 widgetVar="activities"
                                 style="margin-bottom:20px"
                                 var="activities"
                                 rowIndexVar="index" 
                                 dir="rtl" 
                                 emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                                 selectionMode="single"
                                 sortBy="#{1}"
                                 rowKey="#{activities.index}"
                                 value="#{crmEventFormDTOMB.eventResponseDTOList}" >

                        <p:column headerText="#" style="width: 4vh;text-align:center;border-radius: 0px" >
                            <h:outputText value="#{index + 1}"  />
                        </p:column>

                        <p:column style="width: 13vh;text-align: -webkit-auto;border-radius: 0px" id="subject" headerText="منشء الفاتورة" 
                                  filterBy="#{activities.createdByName}" 
                                  filterMatchMode="contains" 
                                  sortBy="#{activities.createdByName}"
                                  filterable="false">
                            <p:outputLabel value="#{activities.createdByName}" />            
                        </p:column>
                        <p:column style="width: 8vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px;" filterStyle="display:none" 
                                  filterBy="#{activities.assignToName}" 
                                  filterMatchMode="contains"
                                  headerText="المتابع"
                                  sortBy="#{activities.assignToName}" 
                                  >
                            <p:outputLabel value="#{activities.assignToName}" >
                            </p:outputLabel>                           
                        </p:column>
                        <p:column style="width: 8vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px;" filterStyle="display:none" 
                                  filterBy="#{activities.comment}" 
                                  filterMatchMode="contains"
                                  headerText="التعليق"
                                  sortBy="#{activities.comment}" 
                                  >
                            <p:outputLabel value="#{activities.comment}" >
                            </p:outputLabel>                           
                        </p:column>
                    </p:dataTable>
                </p:fieldset>
            </p:dialog>
        </h:form>
    </ui:define>

</ui:composition>
