<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">

        <h:form id="ScreenAddEditForm" dir="#{userData.dir}" class='formmargin'>
            <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                  margin-top: 12%;
                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;"
                                  icon="fa fa-fw fa-home"
                                  title="#{userData.userDDs['HOME']}"
                                  class="smhomeButton" 
                                  action="exit" />  
            </div>
            
             <p:fieldset legend="  بيانات العميل" style="margin-bottom:20px" id="dlgeventaddsetcustomer" >

                    <div class="ui-g-6 ui-md-6" >
                        <div class="ui-g-12 ui-md-6" >
                            <div class="ui-g-6 ui-md-6" >
                                <p:outputLabel   id="employeeNameevent"  value="#{crmEventFormDTOMB.crmEventDTO.customerId.name}"/>
                            </div>
                            <div class="ui-g-6 ui-md-6" >
                                <p:outputLabel   value="الاسم" />
                            </div>
                        </div>

                        <div class="ui-g-12 ui-md-6">
                            <div class="ui-g-6 ui-md-6" >
                                <p:outputLabel   id="mobileevent"  value="#{crmEventFormDTOMB.crmEventDTO.customerId.mobile}"/>

                            </div>
                            <div class="ui-g-6 ui-md-6">
                                <p:outputLabel   value="الموبايل" />
                            </div>
                        </div>

                        <div class="ui-g-12 ui-md-6" >

                            <div class="ui-g-6 ui-md-6" >
                                <p:outputLabel    id="employeeCode2event" value="#{crmEventFormDTOMB.crmEventDTO.customerId.email}" />
                            </div>
                            <div class="ui-g-6 ui-md-6">
                                <p:outputLabel  value="البريد الالكتروني" />
                            </div>
                        </div>
                    </div>


                    <div class="ui-g-6 ui-md-6" style="padding: 0px;">
                        <div class="ui-g-12 ui-md-12" style="padding: 0px;">
                            <div class="ui-g-6 ui-md-6" style="padding: 0px;">
                             
                            </div>
                            <div class="ui-g-6 ui-md-6" style="padding: 0px;">
                                <p:outputLabel style="width:99px;margin-right: 2.5%"  value="المعرض" />
                            </div>

                        </div>

                        <div class="ui-g-12 ui-md-12" style="padding: 0px;">
                            <div class="ui-g-6 ui-md-6" style="padding: 0px;">
                                <p:inputText  style="width: 35%!important"  id="employeeCodeevent"  value="#{crmEventFormDTOMB.customerCode}" >
                                    <p:ajax listener="#{crmEventFormDTOMB.findCustomer()}" update="dlgeventaddsetcustomer"  event="blur" />
                                </p:inputText>
                            </div>
                            <div class="ui-g-6 ui-md-6" style="padding: 0px;">
                                <p:outputLabel style="width:99px;margin-right: 2.5%"  value="كود العميل" />
                            </div>
                        </div>

                        <div class="ui-g-12 ui-md-12" style="padding: 0px;">
                            <div class="ui-g-6 ui-md-6" style="padding: 0px;">
                                <p:selectOneMenu value="#{crmEventFormDTOMB.crmEventDTO.invoiceId}"  effect="fold" >
                                    <f:selectItem itemLabel="اختر فاتورة" itemValue=""/>
                                    <f:selectItems value="#{crmEventFormDTOMB.customerInvoiceList}" 
                                                   var="customerInvoice" itemLabel="#{customerInvoice.serial}"
                                                   itemValue="#{customerInvoice.id}"/> 
                                    <p:ajax listener="#{crmEventFormDTOMB.hishis()}" />
                                </p:selectOneMenu>
                            </div>
                            <div class="ui-g-6 ui-md-6" style="padding: 0px;">
                                <p:outputLabel style="width:99px;margin-right: 2.5%"  value="المعرض" />
                            </div>

                        </div>
                    </div>
                </p:fieldset>

                     <p:fieldset legend="تفاصيل  الشكوى" style="margin-bottom:20px" id="dlgeventaddset" >

                    <div   class="ui-g-6 ui-g-nopad" style="padding: 0px;">


                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">

                            <div class="ui-g-6 ui-md-6" style="padding: 0px;">
                                <p:selectOneMenu value="#{crmEventFormDTOMB.crmEventDTO.assignedTo}" converter="#{crmEventFormDTOMB.crmEmployeeConverter}" effect="fold" >
                                    <f:selectItems value="#{crmEventFormDTOMB.crmEmployeeList}" var="employeeevent" itemLabel="#{employeeevent}" itemValue="#{employeeevent}" />
                                    <p:ajax listener="#{crmEventFormDTOMB.hishis()}" />
                                </p:selectOneMenu>
                            </div>
                            <div class="ui-g-6 ui-md-6" style="padding: 0px;">
                                <p:outputLabel style="width:104px;margin-right: 5%"  value="المتابع" />
                            </div>
                        </div>


                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">

                            <div class="ui-g-6 ui-md-6" style="padding: 0px;">
                                <p:selectOneMenu value="#{crmEventFormDTOMB.crmEventDTO.crmType}" converter="#{crmEventFormDTOMB.crmTypeConverter}" effect="fold" >
                                    <f:selectItems value="#{crmEventFormDTOMB.crmCRMTypeList}" var="statusevent" itemLabel="#{statusevent}" itemValue="#{statusevent}" />
                                    <p:ajax listener="#{crmEventFormDTOMB.hishis()}" />
                                </p:selectOneMenu>
                            </div>
                            <div class="ui-g-6 ui-md-6" style="padding: 0px;">
                                <p:outputLabel style="width:104px;margin-right: 5%"  value="نوع الشكاوي" />
                            </div>
                        </div>


                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">

                            <div class="ui-g-6 ui-md-6" style="padding: 0px;">
                                <p:selectOneMenu value="#{crmEventFormDTOMB.crmEventDTO.symbolPriority}" converter="#{crmEventFormDTOMB.crmPeriorityConverter}" effect="fold" >
                                    <f:selectItems value="#{crmEventFormDTOMB.crmPeriorityList}" var="periorityevent" itemLabel="#{periorityevent}" itemValue="#{periorityevent}" />
                                    <p:ajax listener="#{crmEventFormDTOMB.hishis()}" />
                                </p:selectOneMenu>
                            </div>
                            <div class="ui-g-6 ui-md-6" style="padding: 0px;">
                                <p:outputLabel style="width:104px;margin-right: 5%"  value="الأولوية" />
                            </div>
                        </div>


                    </div>
                    <div   class="ui-g-6 ui-g-nopad" style="padding: 0px;">
                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">

                            <div class="ui-g-6 ui-md-6" style="padding: 0px;">
                                <p:inputText style="width:34%!important " 
                                             value="#{crmEventFormDTOMB.crmEventDTO.subject}"
                                             >
                                    <p:ajax listener="#{crmEventFormDTOMB.hishis()}" />
                                </p:inputText>

                            </div>
                            <div class="ui-g-6 ui-md-6" style="padding: 0px;">
                                <p:outputLabel style="width:104px;margin-right: 5%"  value="عنوان الشكوي" />
                            </div>
                        </div>


                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">

                            <div class="ui-g-6 ui-md-6" style="padding: 0px;">
                                <p:inputTextarea style="width:34%!important " 
                                                 value="#{crmEventFormDTOMB.crmEventDTO.discription}"
                                                 >
                                    <p:ajax listener="#{crmEventFormDTOMB.hishis()}" />
                                </p:inputTextarea>
                            </div>
                            <div class="ui-g-6 ui-md-6" style="padding: 0px;">
                                <p:outputLabel style="width:104px;margin-right: 5%"  value="نص الشكوي" />
                            </div>
                        </div>
                    </div>
                </p:fieldset>



            <h:panelGrid id="pn1"   class="centerButtons col-md-12" columns="1"  style="margin-top: 2%">


                <h:panelGroup>


                    <p:commandButton   class="saveButton"  
                                       id="saveB" 
                                       rendered="#{crmEventFormDTOMB.crmEventDTO.status.serial ne 0}"
                                       title="#{userData.userDDs['SAVE']}"
                                       value="#{userData.userDDs['SAVE']}" 
                                       style=""
                                       action="#{crmEventFormDTOMB.save()}" 
                                       update="@form"
                                       disabled="#{crmEventFormDTOMB.crmEventDTO.closeEvent}"/>




                </h:panelGroup>
            </h:panelGrid>
            <p:blockUI block="ScreenAddEditForm" trigger="saveB newN " animate="true" >

                <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>
            </p:blockUI>

            <p:dialog id="dialog1"  widgetVar="dlg12" >
                <p:fieldset legend="تفاصيل النشاطات" style="margin-bottom:20px">

                    <p:dataTable id="activities"
                                 widgetVar="activities"
                                 style="margin-bottom:20px"
                                 var="activities"
                                 rowIndexVar="index" 
                                 dir="rtl" 
                                 emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                                 selectionMode="single"
                                 sortBy="#{1}"
                                 rowKey="#{activities.index}"
                                 selection="#{crmEventFormDTOMB.invOrganizationSiteDTO.crmEventDTOSelected}"
                                 value="#{crmEventFormDTOMB.invOrganizationSiteDTO.crmEventDTOList}" >

                        <p:column headerText="#" style="width: 4vh;text-align:center;border-radius: 0px" >
                            <h:outputText value="#{index + 1}"  />
                        </p:column>

                        <p:column style="width: 13vh;text-align: -webkit-auto;border-radius: 0px" id="subject" headerText="الموضوع" 
                                  filterBy="#{activities.subject}" 
                                  filterMatchMode="contains" 
                                  sortBy="#{activities.subject}"
                                  filterable="false">
                            <p:outputLabel value="#{activities.subject}" />            
                        </p:column>
                        <p:column style="width: 8vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px;" filterStyle="display:none" 
                                  filterBy="#{activities.startDate}" 
                                  filterMatchMode="contains"
                                  headerText="تاريخ البداية"
                                  sortBy="#{activities.startDate}" 
                                  >
                            <p:outputLabel value="#{activities.startDate}" >
                                <f:convertDateTime type="date" pattern="dd-MM-yyyy"/>
                            </p:outputLabel>                           
                        </p:column>
                        <p:column style="width: 8vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px;" filterStyle="display:none" 
                                  filterBy="#{activities.startDate}" 
                                  filterMatchMode="contains"
                                  headerText="توقيت البداية"
                                  sortBy="#{activities.startDate}" 
                                  >
                            <p:outputLabel value="#{activities.startDate}" >
                                <f:convertDateTime type="date" pattern="hh:mm:ss"/>
                            </p:outputLabel>                           
                        </p:column>
                        <p:column style="width: 13vh;text-align: -webkit-auto;border-radius: 0px" id="activityType" headerText="نوع النشاط" 
                                  filterBy="#{activities.activityType.name}" 
                                  filterMatchMode="contains" 
                                  sortBy="#{activities.activityType.name}"
                                  filterable="false">
                            <p:outputLabel value="#{activities.activityType.name}" />            
                        </p:column>
                        <p:column style="width: 13vh;text-align: -webkit-auto;border-radius: 0px" id="symbolPriority" headerText="الوصف" 
                                  filterBy="#{activities.discription}" 
                                  filterMatchMode="contains" 
                                  sortBy="#{activities.discription}"
                                  filterable="false">
                            <p:outputLabel value="#{activities.discription}" />            
                        </p:column>

                        <p:column style="width: 13vh;text-align: center;border-radius: 0px" headerText="#{userData.userDDs['TRANSACTION']}">
                            <p:commandButton  
                                update="@form" 
                                class="smsearchButtons" onclick="form.target = '_blank'"  ajax="false"
                                icon="fa fa-fw fa-search-plus"  style="background-color: rgba(63, 81, 181, 0.88);border-radius: 3px;"
                                title="#{userData.userDDs['VIEW']}" 
                                action="#{crmLeadsEventFormDTOMB.goToEventEdit(activities.id)}"  >
                            </p:commandButton>
                        </p:column >

                    </p:dataTable>

                </p:fieldset>
            </p:dialog>
        </h:form>
    </ui:define>

</ui:composition>
