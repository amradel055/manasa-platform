<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">


        <h:form style="margin-right: 20px"  id="form" dir="#{userData.dir}">
            <p:fieldset legend="#{userData.userDDs['CASH_REC']}" id="whole" style="margin-bottom:20px;font-size: 20px!important;">

                <div class="col-xs-12">
                    <p:messages id="curmsg" showDetail="true" rendered="true" closable="true"/>   
                </div>



                <div  id="firstSegment" class="ui-g-12 ui-g-nopad">
                    <div class="ui-g">

                        <div class="ui-g-4 ui-xl-4">

                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel value="#{notesReceivablesFormMB.glBankTransactionEntity.date}">
                                        <f:convertDateTime type="date" pattern="dd-MM-yyyy  hh:mm:ss"/>
                                    </p:outputLabel>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 90px;font-size: 14px!important;" value="#{userData.userDDs['DATEE']}"/>
                                </div>
                            </div>

                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:autoComplete id="organization" 
                                                    style="width:37%!important" 
                                                    dropdown="true"
                                                    converter="#{notesReceivablesFormMB.invOrganizationSiteDTOConverter}"
                                                    value="#{notesReceivablesFormMB.glBankTransactionDetailEntity.invOrganizationSite}"
                                                    var="supplier"
                                                    itemLabel="#{supplier}" 
                                                    itemValue="#{supplier}" 
                                                    forceSelection="true" 
                                                    completeMethod="#{notesReceivablesFormMB.completeCustomerFrom}" 
                                                    >
                                        <p:ajax 
                                            process="@form"
                                            event="itemSelect"
                                            listener="#{notesReceivablesFormMB.check()}" update="@form"/>
                                    </p:autoComplete>

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 65px;font-size: 14px!important;" value="رقم العميل ورقم المورد"  />
                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">

                                    <p:outputLabel id="accountStatement" value="#{notesReceivablesFormMB.glBankTransactionEntity.accountStatement}"/>

                                </div>
                                <div class="ui-g-6 ui-xl-6">


                                    <p:outputLabel style="width: 65px;font-size: 16px!important;" value="اجمالي رصيد العميل"  />


                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">

                                    <p:selectBooleanCheckbox value="#{notesReceivablesFormMB.isPreviosBalance}" label="رصيد سابق"/>
                                </div>
                                <div class="ui-g-6 ui-xl-6">


                                    <p:outputLabel style="width: 65px;font-size: 16px!important;" value="رصيد سابق"  />


                                </div>
                            </div>

                        </div>
                        <div class="ui-g-4 ui-xl-4">
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText style="width:100%!important;" id="notes" 
                                                 value="#{notesReceivablesFormMB.glBankTransactionEntity.remark}">
                                        <p:ajax event="blur" listener="#{notesReceivablesFormMB.catchValues()}" />

                                    </p:inputText>
                                    <p:inputText type="hidden" style="width: 40%!important" id="hidden2"
                                                 value="#{notesReceivablesFormMB.glBankTransactionEntity.hiddenId}"/>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width:90px;font-size: 14px!important;" value="#{userData.userDDs['STATEMENT']}"/>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>






                <h:panelGrid class=" centerButtons" style="margin-top: 2%; margin-right: 30%">
                    <h:panelGroup>

                        <p:commandButton  class="saveButton" id="saveB" 
                                          title="#{userData.userDDs['SAVE']}" 
                                          value="#{userData.userDDs['SAVE']}" 
                                          icon="fa fa-fw fa-save"
                                          action="#{notesReceivablesFormMB.save()}"

                                          update="@form"/>

                        <p:commandButton 
                            class="printButtons"
                            id="b71" value="كشف حساب" 
                            title="كشف الحساب" onclick="form.target = '_blank'" 
                            ajax="false"
                            rendered="#{notesReceivablesFormMB.glBankTransactionDetailEntity.invOrganizationSite ne null}"
                            actionListener="#{notesReceivablesFormMB.goTOrganizationSiteacoount(notesReceivablesFormMB.glBankTransactionDetailEntity.invOrganizationSite.id)}"  
                            />

                        <p:commandButton class="newButton" 
                                         title="#{userData.userDDs['NEW']}" 
                                         immediate="true"
                                         value="#{userData.userDDs['NEW']}" 
                                         id="newA"
                                         icon="fa fa-plus"
                                         update="@form"
                                         actionListener="#{notesReceivablesFormMB.loadThePageAgain}"   />  

                        <p:commandButton   class="reloadButton"
                                           id="loadL"  
                                           title="#{userData.userDDs['UPLOAD']}"
                                           value="#{userData.userDDs['UPLOAD']}" 
                                           icon="fa fa-fw fa-spinner"
                                           action="#{notesReceivablesFormMB.loadDialog()}"
                                           update="@form"/>

                        <p:commandButton  class="printButton"
                                          ajax="false" onclick="someFunc();
                                                  form.target = '_blank';"  
                                          value="#{userData.userDDs['PRINT']}" 
                                          title="#{userData.userDDs['PRINT']}"
                                          actionListener="#{notesReceivablesFormMB.exportPDF}"
                                          icon="fa fa-fw fa-print"

                                          rendered="#{ notesReceivablesFormMB.glBankTransactionEntity.id gt 0}" />



                        <p:commandButton class="closeButton" 
                                         title="#{userData.userDDs['CANCEL']}" 
                                         immediate="true"
                                         value="#{userData.userDDs['CANCEL']}" 
                                         icon="fa fa-fw fa-backward"
                                         action="#{notesReceivablesFormMB.exit()}"   />

                    </h:panelGroup>

                </h:panelGrid>


                <p:dataTable id="dlgTable"
                             draggableColumns="true" 
                             var="detail"
                             widgetVar="detail"  
                             rowIndexVar="index" 
                             dir="rtl" 
                             selectionMode="single"
                             selection="#{notesReceivablesFormMB.glPayDTOSelection}"
                             value="#{notesReceivablesFormMB.glPayDTOList}" 
                             rowKey="#{detail}"
                             paginator="true" 
                             emptyMessage="#{userData.userDDs['EMPTY_TABLE']}" >

                    <p:column style="width: 12vh;font-size: 1.5vh;text-align: -webkit-auto" 
                              headerText="رقم السند">
                        <p:outputLabel value="#{detail.serial}" />
                    </p:column>

                    <p:column style="width: 12vh;font-size: 1.5vh;text-align: -webkit-auto" 
                              headerText="الخزينة">
                        <p:outputLabel value="#{detail.bank}" />
                    </p:column>

                    <p:column style="width: 9vh; text-align: right;font-size:1.8vh" 
                              headerText="رقم الفاتورة" 
                              >
                        <p:selectOneMenu  id="invoice" style="width:100%"  rendered="#{not notesReceivablesFormMB.isEdit}"
                                          value="#{detail.invoiceId}">
                            <f:selectItem itemLabel="اختر الفاتوره "/>
                            <f:selectItems  var="inninvoice"
                                            value="#{notesReceivablesFormMB.glBankTransactionInvoiceViewList}"
                                            itemLabel="#{inninvoice.serial}"
                                            itemValue="#{inninvoice.invoiceId}"/>
                            <p:ajax event="change" listener="#{notesReceivablesFormMB.calculateRemainTable()}" update="dlgTable"/>
                        </p:selectOneMenu>
                    </p:column>


                    <p:column style="width: 9vh; text-align: right;font-size:1.8vh" 
                              headerText="المتبقى" 
                              >
                        <p:outputLabel value="#{detail.remain}" />
                    </p:column>

                    <p:column style="width: 9vh; text-align: right;font-size:1.8vh" 
                              headerText="المدفوع" 
                              >
                        <p:outputLabel value="#{detail.value}" />
                    </p:column>

                    <p:column 
                        rendered="#{invPurchaseInvoiceFormDTOMB.columnRender  }"
                        style="width: 18vh;text-align: center;border-radius: 0px" 
                        headerText="#{userData.userDDs['TRANSACTION']}">

                        <p:commandButton  class="printButton"
                                          ajax="false" onclick="someFunc();
                                                  form.target = '_blank';"  
                                          value="#{userData.userDDs['PRINT']}" 
                                          title="#{userData.userDDs['PRINT']}"
                                          actionListener="#{notesReceivablesFormMB.exportPDFAll}"
                                          icon="fa fa-fw fa-print"

                                          rendered="#{ detail.id gt 0}" />
                    </p:column >

                </p:dataTable> 

            </p:fieldset> 


            <p:blockUI block="form" trigger="saveB newA" animate="true" >

                <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

            </p:blockUI> 

        </h:form>
        <script>
            function someFunc() {
                var ss = document.getElementById("form:settelmentId2").value;
                console.log(ss);
                sessionStorage.setItem(ss, ss);
                var field = document.getElementById("form:hidden2");
                field.value = sessionStorage.getItem(ss);
            }
        </script>

    </ui:define>
</ui:composition>
