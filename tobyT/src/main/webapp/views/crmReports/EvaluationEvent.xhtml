<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">
<!--        <f:event listener="#/{userData.authorize}" type="preRenderView" />-->
        <h:form  id="form" dir="#{userData.dir}"  class='formmargin'>
            <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                  margin-top: 12%;
                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;"
                                  icon="fa fa-fw fa-home"
                                  title="#{userData.userDDs['HOME']}"
                                  class="smhomeButton" 
                                  action="exit" />
                <p:commandButton  style="z-index: 2;
                                  margin-top: 9%!important;
                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;" 
                                  class="viewButton sminimize"
                                  icon="fa fa-window-minimize"
                                  title="إظهار/إخفاء"/>  
            </div>
            <p:fieldset  legend="تقرير المهام والاحداث"

                         style=" position: relative">

                <div  id="firstSegment" class="ui-g-12 ui-g-nopad firstset">
                    <div class="ui-g">

                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 75px;margin-right: 6%;" value="من موظف"/>
                                </h:panelGroup> 

                                <h:panelGroup>
                                    <p:selectOneMenu id="EVENTFrom" style="width: 35%;" value="#{crmEventsReportMB.crmEventsReportSearchBean.empFrom}" converter="#{crmEventsReportMB.employeeDTOConverterFrom}">
                                        <f:selectItem itemLabel="اختر" itemValue="" />
                                        <f:selectItems value="#{crmEventsReportMB.empFrom}" var="leads" itemValue="#{leads}" itemLabel="#{leads}" />
                                    </p:selectOneMenu>
                                </h:panelGroup> 
                            </h:panelGroup>
                        </div>
                        
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 75px" value="الى موظف"/>
                                </h:panelGroup> 

                                <h:panelGroup>
                                    <p:selectOneMenu id="eventTo" style="width: 35%;" value="#{crmEventsReportMB.crmEventsReportSearchBean.empTo}" converter="#{crmEventsReportMB.employeeDTOConverterTo}">
                                        <f:selectItem itemLabel="اختر" itemValue="" />
                                        <f:selectItems value="#{crmEventsReportMB.empTo}" var="leadsd" itemValue="#{leadsd}" itemLabel="#{leadsd}" />
                                    </p:selectOneMenu>
                                </h:panelGroup> 
                            </h:panelGroup>
                        </div>
                        
                         <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 75px;margin-right: 6%; margin-top: 4%;" value="من عميل"/>
                                </h:panelGroup> 

                                <h:panelGroup>
                                    <p:selectOneMenu id="custFrom" style="width: 35%;" value="#{crmEventsReportMB.crmEventsReportSearchBean.leadsFrom}" converter="#{crmEventsReportMB.invOrganizationSiteDTOConverterFrom}">
                                        <f:selectItem itemLabel="اختر" itemValue="" />
                                        <f:selectItems value="#{crmEventsReportMB.customerIdFrom}" var="leadse" itemValue="#{leadse}" itemLabel="#{leadse}" />
                                    </p:selectOneMenu>
                                </h:panelGroup> 
                            </h:panelGroup>
                        </div>
                        
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 75px; margin-top: 4%;" value="الى عميل"/>
                                </h:panelGroup> 

                                <h:panelGroup>
                                    <p:selectOneMenu id="custTo" style="width: 35%;" value="#{crmEventsReportMB.crmEventsReportSearchBean.leadsTo}" converter="#{crmEventsReportMB.invOrganizationSiteDTOConverterTo}">
                                        <f:selectItem itemLabel="اختر" itemValue="" />
                                        <f:selectItems value="#{crmEventsReportMB.customerIdTo}" var="leadsde" itemValue="#{leadsde}" itemLabel="#{leadsde}" />
                                    </p:selectOneMenu>
                                </h:panelGroup> 
                            </h:panelGroup>
                        </div>


                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel  style="width: 70px;margin-right: 6%; margin-top: 4%;" value="#{userData.userDDs['FROM_DATE']}"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:calendar pattern="dd/MM/yyyy" 
                                                value="#{crmEventsReportMB.crmEventsReportSearchBean.dateFrom}"
                                                style="width: 50%"
                                                id="dateFromCRM">

                                    </p:calendar>
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel  style="width: 70px; margin-top: 4%;" value="#{userData.userDDs['TO_DATE']}"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:calendar pattern="dd/MM/yyyy" 
                                                value="#{crmEventsReportMB.crmEventsReportSearchBean.dateTo}"
                                                style="width: 50%"
                                                id="dateToCRM">

                                    </p:calendar>
                                </h:panelGroup>
                            </h:panelGroup>

                        </div>
                        
                        <div class="ui-g-12 ui-md-6">
                            <p:outputLabel style="margin-top: 3%; margin-right: 6%; width: 75px;" for="@next" value="النوع" />
                            <p:selectOneMenu id="console" value="#{crmEventsReportMB.crmEventsReportSearchBean.type}" style="width:35%;">
                                <f:selectItem itemLabel="اختر" itemValue="" />
                                 <f:selectItem itemLabel="حدث" itemValue="0" />
                                <f:selectItem itemLabel="مهمه" itemValue="1" />
                            </p:selectOneMenu>
                        </div>
                        
                    </div>
                </div>
                <h:panelGrid  columns="1"  class="col-md-12">

                    <h:panelGroup  class="centerButtons"  style="margin-top: 2%">


                        <p:commandButton     class="searchButtons"
                                             title="#{userData.userDDs['SEARCH']}"
                                             action="#{crmEventsReportMB.evaluationSearch()}"
                                             id="saveB"
                                             value="#{userData.userDDs['SEARCH']}"
                                             update="crmEventEvaluationTable" 
                                             style="color: #fff!important;background-color: #2196F3;margin-left: 5px;"   />

                        <p:commandButton   class="newButtons"
                                           id="NewB"
                                           title="#{userData.userDDs['NEW']}" 
                                           immediate="true" 
                                           action="#{crmEventsReportMB.reset()}"
                                           update="form"
                                           value="#{userData.userDDs['NEW']}"
                                           style="color: #fff!important;background-color: #9c27b0d1;margin-left: 5px;"/>



                        <p:commandButton class="closeButtons"
                                         id="CloseB"
                                         style="color: #fff!important;background-color: #035C70;margin-left: 5px;"  
                                         value="#{userData.userDDs['BACK']}" 
                                         title="#{userData.userDDs['BACK']}"
                                         action="exit"/>

                        <h:commandLink  class="sdcreenimg" style="margin-right: 4px;">  
                            <p:graphicImage name="/img/excel.jpg" width="24"/>  
                            <p:dataExporter type="xls"
                                            target="crmEventEvaluationTable" 
                                            fileName=" تقرير بيانات العملاء الأساسية"
                                            postProcessor="#{supplierDataReportMB.postProcessXLS}" />  
                        </h:commandLink>

                        <p:blockUI block="form" trigger="saveB NewB CloseB" animate="true" >

                            <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                        </p:blockUI> 


                    </h:panelGroup>

                </h:panelGrid>

            </p:fieldset>

            <p:fieldset  style="margin-top: 2%">
                <p:dataTable 
                    rows="20"
                    paginator="true"
                    draggableColumns="true" 
                    var="crmEventEvaluationTable" 
                    widgetVar="crmEventEvaluationTable"  
                    rowKey="#{crmEventEvaluationTable}"
                    rowIndexVar="index" 
                    value="#{crmEventsReportMB.crmEventEvaluationDTOList}" 
                    dir="rtl" 
                    emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                    id="crmEventEvaluationTable">

                    <f:facet name="header">


                        <p:outputPanel>
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" onkeyup="PF('crmEventEvaluationTable').filter()" style="width:150px" />
                        </p:outputPanel>

                    </f:facet>
                   
            <p:row >
                   <p:column style="width: 12vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" filterStyle="display:none"
                             headerText="#{crmEventEvaluationTable.assignedToName}"

                              filterBy="#{crmEventEvaluationTable.startDate}" 
                              filterMatchMode="contains" 
                              sortBy="#{crmEventEvaluationTable.startDate}"
                              filterable="false"/> 
               
              
                
            </p:row> 
                    <p:column style="width: 12vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" filterStyle="display:none"
                              headerText="التاريخ" 

                              filterBy="#{crmEventEvaluationTable.startDate}" 
                              filterMatchMode="contains" 
                              sortBy="#{crmEventEvaluationTable.startDate}"
                              filterable="false">

                        <h:outputText value="#{crmEventEvaluationTable.startDate}" style="font-size: 1.5vh;width: 95%"/>
                    </p:column>

                    <p:column   style="width: 8vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" headerText="الموظف" 

                                filterBy="#{crmEventEvaluationTable.statusName}" 
                                filterMatchMode="contains" 
                                sortBy="#{crmEventEvaluationTable.statusName}"
                                filterable="false">

                        <h:outputText value="#{crmEventEvaluationTable.statusName}" style="font-size: 1.5vh"/>
                    </p:column>

                    
                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" 
                              headerText="اسم العميل" 

                              filterBy="#{crmEventEvaluationTable.counter}" 
                              filterMatchMode="contains" 
                              sortBy="#{crmEventEvaluationTable.counter}"
                              filterable="false">

                        <h:outputText value="#{crmEventEvaluationTable.counter}" style="font-size: 1.5vh;width: 95%"/>
                    </p:column>
                </p:dataTable>
            </p:fieldset>

        </h:form>
    </ui:define>
</ui:composition>
