<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">

        <h:form  id="form" dir="#{userData.dir}"  class='formmargin'>
            <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                  margin-top: 12%;
                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;"
                                  icon="fa fa-fw fa-home"
                                  title="#{userData.userDDs['HOME']}"
                                  class="smhomeButton" 
                                  action="exit" />
                <p:commandButton  style="z-index: 2;
                                  margin-top: 9%!important;
                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;" 
                                  class="viewButton sminimize"
                                  icon="fa fa-window-minimize"
                                  title="إظهار/إخفاء"/>  
            </div>
            <p:fieldset  legend="تقرير العملاء "

                         style=" position: relative">

                <div  id="firstSegment" class="ui-g-12 ui-g-nopad firstset">
                    <div class="ui-g">
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel  style="width: 70px;margin-right: 6%; margin-top: 4%;" value="#{userData.userDDs['FROM_DATE']}"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:calendar pattern="dd/MM/yyyy" 
                                                value="#{usersAndDelegatesReport.dateFrom}"
                                                style="width: 50%"
                                                id="dateFromCRM">

                                    </p:calendar>
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel  style="width: 70px; margin-top: 4%;" value="#{userData.userDDs['TO_DATE']}"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:calendar pattern="dd/MM/yyyy" 
                                                value="#{usersAndDelegatesReport.dateTo}"
                                                style="width: 50%"
                                                id="dateToCRM">

                                    </p:calendar>
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>
                    </div>
                </div>
                <div class="ui-g-12 ui-md-6">

                    <p:selectCheckboxMenu style="width: 90%" 
                                          value="#{usersAndDelegatesReport.invInventoryList}"
                                          converter="#{usersAndDelegatesReport.invInventoryDTOConverter}"
                                          label="المعارض">
                        <f:selectItems value="#{usersAndDelegatesReport.invInventoryDTOList}" 
                                       var="invInventory" 
                                       itemLabel="#{invInventory}"
                                       itemValue="#{invInventory}"/>
                    </p:selectCheckboxMenu>
                </div>


                <div class="ui-g-12 ui-md-6">
                    <p:selectCheckboxMenu style="width: 90%" 
                                          value="#{usersAndDelegatesReport.tobyUserList}"
                                          converter="#{usersAndDelegatesReport.tobyUserDTOConverter}"
                                          label="المستخدمين">
                        <f:selectItems value="#{usersAndDelegatesReport.tobyUserDTOList}" 
                                       var="TobyUser" 
                                       itemLabel="#{TobyUser}"
                                       itemValue="#{TobyUser}"/>
                    </p:selectCheckboxMenu>
                </div>

                <div class="ui-g-12 ui-md-6">

                    <p:selectCheckboxMenu style="width: 90%" 
                                          value="#{usersAndDelegatesReport.inventoryDelegatorList}"
                                          converter="#{usersAndDelegatesReport.invDelegatorDTOConvertor}"
                                          label="مندوب">
                        <f:selectItems value="#{usersAndDelegatesReport.inventoryDelegatorDTOList}" 
                                       var="TobyUser" 
                                       itemLabel="#{TobyUser}"
                                       itemValue="#{TobyUser}"/>
                    </p:selectCheckboxMenu>
                </div>


                <h:panelGrid  columns="1"  class="col-md-12">
                    <h:panelGroup  class="centerButtons"  style="margin-top: 2%">
                        <p:commandButton     class="searchButtons"
                                             title="#{userData.userDDs['SEARCH']}"
                                             action="#{usersAndDelegatesReport.search()}"
                                             id="saveB"
                                             value="#{userData.userDDs['SEARCH']}"
                                             update="usersAndDelegatesTable" 
                                             style="color: #fff!important;background-color: #2196F3;margin-left: 5px;"   />
                    </h:panelGroup>
                </h:panelGrid>
            </p:fieldset>
            <p:fieldset  style="margin-top: 2%">
                <p:dataTable 
                    rows="20"
                    paginator="true"
                    draggableColumns="true" 
                    var="usersAndDelegatesTable" 
                    widgetVar="usersAndDelegatesTable"  
                    rowKey="#{usersAndDelegatesTable}"
                    rowIndexVar="index" 
                    value="#{usersAndDelegatesReport.clientReportDTOList}" 
                    dir="rtl" 
                    emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                    id="usersAndDelegatesTable">

                    <f:facet name="header">


                        <p:outputPanel>
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" onkeyup="PF('usersAndDelegatesTable').filter()" style="width:150px" />
                        </p:outputPanel>

                    </f:facet>

                    <p:column   style="width: 8vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" headerText="الكود" 

                                filterBy="#{usersAndDelegatesTable.code}" 
                                filterMatchMode="contains" 
                                sortBy="#{usersAndDelegatesTable.code}"
                                filterable="false">

                        <h:outputText value="#{usersAndDelegatesTable.code}" style="font-size: 1.5vh"/>
                    </p:column>






                    <p:column   style="width: 8vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" headerText="الاسم" 

                                filterBy="#{usersAndDelegatesTable.name}" 
                                filterMatchMode="contains" 
                                sortBy="#{usersAndDelegatesTable.name}"
                                filterable="false">

                        <h:outputText value="#{usersAndDelegatesTable.name}" style="font-size: 1.5vh"/>
                    </p:column>


                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" 
                              headerText=" الموبايل" 

                              filterBy="#{usersAndDelegatesTable.mobile}" 
                              filterMatchMode="contains" 
                              sortBy="#{usersAndDelegatesTable.mobile}"
                              filterable="false">

                        <h:outputText value="#{usersAndDelegatesTable.mobile}" style="font-size: 1.5vh;width: 95%"/>
                    </p:column>
                </p:dataTable>
            </p:fieldset>

        </h:form>
    </ui:define>
</ui:composition>
