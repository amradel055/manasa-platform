<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">

        <h:body>
            <h:form id="form" dir="RTL" >

                <p:fieldset  legend=" مراحل الانتاج" >

                    <div class="ui-g-6 ui-xl-6">
                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">
                                <p:inputText value="#{proProductionStagesMB.proProductionStagesDTO.price}" />

                            </div>
                            <div class="ui-g-6 ui-xl-6">
                                <h:outputText value="السعر" />

                            </div>
                        </div>
                    </div>
                    <div class="ui-g-6 ui-xl-6">
                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">
                                <p:inputText value="#{proProductionStagesMB.proProductionStagesDTO.name}" />

                            </div>
                            <div class="ui-g-6 ui-xl-6">
                                <h:outputText value="الاسم" />

                            </div>
                        </div>
                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">
                                <p:inputText value="#{proProductionStagesMB.proProductionStagesDTO.nameEn}" />

                            </div>
                            <div class="ui-g-6 ui-xl-6">
                                <h:outputText value="الاسم انجليزي" />

                            </div>
                        </div>

                    </div>
                    <div class="ui-g-12 ui-xl-12" style="text-align: center">
                        <p:commandButton value="حفظ" action="#{proProductionStagesMB.save()}"  />

                    </div>

                </p:fieldset>
            </h:form>
        </h:body>

    </ui:define>
</ui:composition>
