<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">


        <h:form id="form" dir="#{userData.dir}" class='formmargin'>

            <div >
                <p:messages id="curmsg" autoUpdate="true" showDetail="true" rendered="true" closable="true"/>   
            </div>


            <p:fieldset  legend="#{userData.userDDs['CONVERSION_BET_STORE']}"> 

                <div  id="firstSegment" class="ui-g-12 ui-g-nopad">

                    <div class="ui-g">

                        <div class="ui-g-6 ui-xl-6">

                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText style="width: 37%" 
                                                 id="purchIdVal" readonly="true"
                                                 value="#{invTransferFormMB1.invInvoiceDTO.serial}" />
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 95px;" id="purchId" value="#{userData.userDDs['INVOICE_NO']}" />

                                </div>
                            </div>

                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:autoComplete style="width:37%"  id="inventoryDTO2" widgetVar="inventoryDTO2"
                                                    dropdown="true"
                                                    converter="#{invTransferFormMB1.invInventoryDTOConverterTO}"
                                                    value="#{invTransferFormMB1.invInvoiceDTO.invInventoryIdTo}"
                                                    var="inventoryDTO2" 
                                                    itemLabel="#{inventoryDTO2}" 
                                                    itemValue="#{inventoryDTO2}" 
                                                    forceSelection="true" 
                                                    completeMethod="#{invTransferFormMB1.completeInventoryTo}" 
                                                    >
                                        <p:ajax update="invPurchaseInvoiceDetailsTable curmsg inventoryDTO inventoryDTO2" event="itemSelect"
                                                listener="#{invTransferFormMB1.fillInventoryItem()}" />
                                    </p:autoComplete>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 75px" value="#{userData.userDDs['TO_REPOS']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:calendar id="dateFrom" 
                                                value="#{invTransferFormMB1.invInvoiceDTO.date}"
                                                pattern="dd/MM/yyyy"
                                                style="width:50%!important"/>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 95px; " value="#{userData.userDDs['DATEE']}*"/>

                                </div>
                            </div>
                        </div>

                        <div class="ui-g-6 ui-xl-6">

                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:autoComplete style="width:37%"  id="inventoryDTO" widgetVar="inventoryDTO"
                                                    dropdown="true"
                                                    converter="#{invTransferFormMB1.invInventoryDTOConverter}"
                                                    value="#{invTransferFormMB1.invInvoiceDTO.invInventoryId}"
                                                    var="inventoryDTO" 
                                                    itemLabel="#{inventoryDTO}" 
                                                    itemValue="#{inventoryDTO}" 
                                                    forceSelection="true" 
                                                    completeMethod="#{invTransferFormMB1.completeInventory}" 
                                                    >
                                        <p:ajax update="invPurchaseInvoiceDetailsTable curmsg inventoryDTO inventoryDTO2" event="itemSelect"
                                                listener="#{invTransferFormMB1.fillInventoryItem()}" />
                                        <p:ajax update="invPurchaseInvoiceDetailsTable curmsg inventoryDTO inventoryDTO2" event="change" 
                                                listener="#{invTransferFormMB1.fillInventoryItem()}" />
                                    </p:autoComplete>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 100px;" value="#{userData.userDDs['FROM_REPOS']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText readonly="true" style="width:69%"  value="#{invTransferFormMB1.invInvoiceDTO.loadedSerial}"
                                                 />
                                </div>
                                <div class="ui-g-6 ui-xl-6" rendered="#{invTransferFormMB1.invInvoiceDTO.loadedSerial  ne null}">
                                    <p:outputLabel   style="width: 95px; " value="رقم فاتورة التحميل"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText style="width:69%"  value="#{invTransferFormMB1.invInvoiceDTO.remarks}"
                                                 />
                                </div>
                                <div class="ui-g-6 ui-xl-6" rendered="#{invTransferFormMB1.invInvoiceDTO.loadedSerial  ne null}">
                                    <p:outputLabel style="width: 95px; " value="#{userData.userDDs['NOTE']}"/>

                                </div>
                            </div>
                        </div>

                        <h:panelGroup id="test">


                        </h:panelGroup>
                    </div>
                </div>

            </p:fieldset>

            <p:fieldset id="fieldSetId" legend="#{userData.userDDs['DET_CONV_BET_STO']}"   style="margin:2% 0">
                <div >
                    <p:messages id="curmsg2" autoUpdate="true" showDetail="true" rendered="true" closable="true"/>   
                </div>

                <p:dataTable id="invPurchaseInvoiceDetailsTable"
                             widgetVar="invPurchaseInvoiceDetailsTable"
                             style="margin-bottom:20px"
                             var="invPurchaseInvoiceDetailsTable"
                             rowIndexVar="index" 
                             dir="rtl" 
                             emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                             editable="true"
                             editMode="cell"
                             selectionMode="single"
                             sortBy="#{1}"
                             rowKey="#{invPurchaseInvoiceDetailsTable.index}"
                             selection="#{invTransferFormMB1.invInvoiceDTO.invPurchaseInvoiceDetailsSelected}"
                             value="#{invTransferFormMB1.invInvoiceDTO.invPurchaseInvoiceDetailList}" >

                    <f:facet name="header" >
                        <p:commandButton  id="addnew"
                                          class="saddButton"
                                          icon="fa fa-plus"
                                          title="#{userData.userDDs['ADD']}" 
                                          rendered="#{invTransferFormMB1.invInvoiceDTO.loadedSerial eq null}"
                                          actionListener="#{invTransferFormMB1.addInvDetail()}" 
                                          update=":form:fieldSetId"  
                                          oncomplete="PrimeFaces.focus('form:invPurchaseInvoiceDetailsTable:'+#{invTransferFormMB1.invInvoiceDTO.invPurchaseInvoiceDetailList.size()}+':invItemNameIn')"
                                          immediate="true"
                                          ajax="true"
                                          style="float:right"/>

                        <p:commandButton   title="بحث" 
                                           class="sreloadButtons" style="background-color:rgb(162, 46, 247);border-radius: 3px;margin-bottom:3px"

                                           onclick="PF('dlg4').show();"
                                           icon="fa fa-fw fa-search-plus" >
                        </p:commandButton>
                    </f:facet>

                    <p:column headerText="#"  style="width: 4vh;text-align:center;border-radius: 0px" >
                        #{index + 1}
                    </p:column>

                    <p:column headerText="#" style="width: 4vh;text-align:center;border-radius: 0px" >
                        <h:outputText value="#{invPurchaseInvoiceDetailsTable.serial}"  />
                    </p:column>

                    <p:column style="width: 13vh;text-align: -webkit-auto;border-radius: 0px" id="itemName" headerText="#{userData.userDDs['ITEM']}" 
                              filterBy="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail}" 
                              filterMatchMode="contains" 
                              sortBy="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail}"
                              filterable="false">
                        <p:outputLabel value="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail}" 
                                       rendered="#{invPurchaseInvoiceDetailsTable.isEdit}" />
                    
                        
                        <p:autoComplete id="invItemNameIn"  
                                            style="width:100%"
                                            rendered="#{not invPurchaseInvoiceDetailsTable.isEdit}"
                                            converter="#{autoComplete.itemsBarcodesDetailsViewConverter}"
                                            value="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail}"
                                            maxResults="30"

                                            var="item"
                                            itemLabel="#{item}" 
                                            itemValue="#{item}" 
                                            forceSelection="true" 
                                            completeMethod="#{autoComplete.completeItemsBarcodesDetailsView}" 
                                            >
                            <p:ajax update="unitvalue length paintColor      
                                    totalQuantity totalWeight availableQuantityRow         
                                    availableQuantityRowValue "
                                        event="itemSelect" listener="#{invTransferFormMB1.validateItems(invPurchaseInvoiceDetailsTable)}" />
                            </p:autoComplete>  
                        
                    </p:column>

                    <p:column  style="width: 13vh;text-align: -webkit-auto;border-radius: 0px" id="Unit"

                               filterBy="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail.unitName}" 
                               filterMatchMode="contains" 
                               sortBy="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail.unitName}"
                               filterable="false"
                               headerText="#{userData.userDDs['UNIT_NUMBER']}">
                        <p:inputText id="unitvalue" readonly="true" 
                                     disabled="true"
                                     value="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail.unitName}" style="width: 95%" />  

                    </p:column>

                    <p:column style="width: 12vh;text-align: -webkit-auto;border-radius: 0px" id="tall" headerText="الطول"
                              rendered="#{invTransferFormMB1.invInvoiceDTO.companyActivity eq 'Alumetal'}"
                              filterBy="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail.length}" 
                              filterMatchMode="contains" 
                              sortBy="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail.length}"
                              filterable="false" >
                        <p:inputText style="width:99%" 
                                     disabled="true" 
                                     id="length" readonly="true"  
                                     value="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail.length}"/>
                    </p:column>

                    <p:column style="width: 12vh;text-align: -webkit-auto;border-radius: 0px" id="color" headerText="اللون"
                              rendered="#{invTransferFormMB1.invInvoiceDTO.companyActivity eq 'Alumetal'}"
                              filterBy="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail.paintColorName}" 
                              filterMatchMode="contains" 
                              sortBy="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail.paintColorName}"
                              filterable="false" >
                        <p:inputText style="width:99%" 
                                     disabled="true" 
                                     id="paintColor" readonly="true"  
                                     value="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail.paintColorName}"/>
                    </p:column>


                    <p:column style="width: 13vh;text-align: -webkit-auto;border-radius: 0px"
                              id="Quantity"
                              headerText="الكمية"
                              filterBy="#{invPurchaseInvoiceDetailsTable.quantity}" 
                              filterMatchMode="contains" 
                              sortBy="#{invPurchaseInvoiceDetailsTable.quantity}"
                              filterable="false">

                        <p:inputText id="QuantityT"  
                                     value="#{invPurchaseInvoiceDetailsTable.quantity}" 

                                     style="width:95%">
                            <p:ajax listener="#{invTransferFormMB1.validateQuantityColum(invPurchaseInvoiceDetailsTable)}" 
                                    process="@this"
                                    update=" totalQuantity totalWeight        invItemNameIn Quantity QuantityT"/>
                        </p:inputText>        

                    </p:column>

                    <p:column  style="width: 13vh;text-align: -webkit-auto;border-radius: 0px" id="availableQuantityRow"

                               filterBy="#{invPurchaseInvoiceDetailsTable.availableQuantityRow}" 
                               filterMatchMode="contains" 
                               sortBy="#{invPurchaseInvoiceDetailsTable.availableQuantityRow}"
                               filterable="false"
                               headerText="المتاح">
                        <p:inputText id="availableQuantityRowValue" readonly="true" 
                                     disabled="true"
                                     value="#{invPurchaseInvoiceDetailsTable.availableQuantityRow}" style="width: 95%" />  

                    </p:column>

                    <p:summaryRow>
                        <p:column colspan="3" style="text-align:right">
                            <h:outputText style="text-align:right" value="#{userData.userDDs['TOTAL']}  :" />
                        </p:column>
                        <p:column>
                            <h:outputText id="totalQuantity" value="#{invTransferFormMB1.invInvoiceDTO.totalQuatity}"/>
                        </p:column>
                        <p:column>
                            <h:outputText id="totalWeight" value="#{invTransferFormMB1.invInvoiceDTO.totalWeight}"/>
                        </p:column>
                        <p:column rendered="#{invTransferFormMB1.invInvoiceDTO.companyActivity eq 'Alumetal'}" />
                        <p:column rendered="#{invTransferFormMB1.invInvoiceDTO.companyActivity eq 'Alumetal'}" />
                        <p:column rendered="#{invTransferFormMB1.invInvoiceDTO.companyActivity eq 'Alumetal'}" />

                        <p:column />
                    </p:summaryRow>

                    <p:column 
                        rendered="#{invTransferFormMB1.columnRender}"
                        style="width: 13vh;text-align: center;border-radius: 0px" 
                        headerText="#{userData.userDDs['TRANSACTION']}">

                        <p:commandButton  id="b7" icon="fa fa-plus" 
                                          class="saddbuttonins"
                                          title="#{userData.userDDs['ADD']}" 
                                          rendered="#{invTransferFormMB1.invInvoiceDTO.loadedSerial eq null}"
                                          actionListener="#{invTransferFormMB1.addInvDetail()}" 
                                          update=":form:fieldSetId"  
                                          immediate="true"
                                          oncomplete="PrimeFaces.focus('form:invPurchaseInvoiceDetailsTable:'+#{invTransferFormMB1.invInvoiceDTO.invPurchaseInvoiceDetailList.size()}+':invItemNameIn')"
                                          ajax="true" />

                        <p:commandButton  update="invPurchaseInvoiceDetailsTable  totalQuantity  totalWeight       "
                                          title="#{userData.userDDs['DELETE']}" 
                                          class="sdeleteButtons" 

                                          action="#{invTransferFormMB1.deleteInvDetail(invPurchaseInvoiceDetailsTable)}"
                                          icon="fa fa-remove" >
                            <p:confirm header="#{userData.userDDs['COFIGRATION']}" 
                                       message="#{userData.userDDs['ARE_YOU_SURE']}"
                                       icon="ui-icon-alert" />
                        </p:commandButton>

                        <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                            <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                            <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                        </p:confirmDialog>
                    </p:column >

                </p:dataTable>

                <h:panelGrid  class="col-md-12" columns="1"  style="margin-top:2%">

                    <h:panelGroup  class="centerButtons">

                        <p:commandButton  id="saveB" 
                                          class="saveButtons"
                                          title="#{userData.userDDs['SAVE']}"
                                          value="#{userData.userDDs['SAVE']}" 
                                          action="#{invTransferFormMB1.save()}"
                                          update="@form"/>

                        <p:commandButton 
                            id="newN"
                            ajax="false"
                            value="#{userData.userDDs['NEW']}" 
                            class="newButtons"
                            onclick="form.target = ''" 
                            actionListener="#{invTransferFormMB1.reset()}"/>

                        <p:commandButton  
                            class="reloadButtons"
                            id="loadL"
                            title="#{userData.userDDs['UPLOAD']}"
                            value="#{userData.userDDs['UPLOAD']}" 
                            rendered="#{invTransferFormMB1.invInvoiceDTO.id == null}"
                            action="#{invTransferFormMB1.loadDailogue()}"
                            update="loaddlg"/>
                        <p:commandButton  class="printButtons"
                                          ajax="false"
                                          onclick="form.target = '_blank'"  
                                          rendered="#{invTransferFormMB1.invInvoiceDTO.id != null}"
                                          value="#{userData.userDDs['PRINT']}" 
                                          title="#{userData.userDDs['PRINT']}" 
                                          actionListener="#{invTransferFormMB1.print}"/>
                        <p:commandButton  class="printButtons"
                                          ajax="false"
                                          onclick="form.target = '_blank'"  
                                          title="#{userData.userDDs['PRINT']}"
                                          value="#{userData.userDDs['PRINT']} Barcode" 
                                          actionListener="#{invTransferFormMB1.printBarcode()}"/>

                        <p:commandButton  class="deleteButtons" 
                                          id="cancel" 
                                          title="#{userData.userDDs['BACK']}" 
                                          value="#{userData.userDDs['BACK']}" 
                                          immediate="true"
                                          action="#{invTransferFormMB1.exit()}" 
                                          update="@form"/>

                        <h:commandLink  style="float:left" class="sdcreenimg" rendered="#{invTransferFormMB1.invInvoiceDTO.id ne null}">  
                            <p:graphicImage name="/img/excel.jpg" width="24" style='margin-right:25%;'/>  
                            <p:dataExporter type="xls"
                                            target="invPurchaseInvoiceDetailsTable" 
                                            fileName="فاتورة المبيعات"
                                            preProcessor="#{invTransferFormMB1.preProcessXLS()}"
                                            postProcessor="#{invTransferFormMB1.postProcessXLS}" />  
                        </h:commandLink>

                        <p:blockUI block="form" trigger="saveB" animate="true" >

                            <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                        </p:blockUI> 


                    </h:panelGroup>

                </h:panelGrid>

            </p:fieldset>



            <h:panelGrid columns="1" cellpadding="5">

                <h:panelGroup>


                    <p:dialog id="loaddlg" header="#{userData.userDDs['PURCHASE_OR_NO']}" 
                              widgetVar="loaddlg" modal="true">


                        <div class="ui-g-12 ui-md-6">

                            <h:panelGroup>

                                <p:outputLabel style="width: 95px;" id="loadedSerial1" value="رقم الفاتورة المراد تحميلها" />
                                <p:inputText style="width: 37%" 
                                             id="loadedSerial" 
                                             value="#{invTransferFormMB1.invInvoiceDTO.needLoadedSerial}" />

                            </h:panelGroup>
                        </div> 
                        <div style="padding-top: 60px;"> 
                            <p:messages id="loadMsg"
                                        autoUpdate="true" 
                                        showDetail="true" 
                                        closable="true"/>   
                        </div>
                        <p:dataTable id="dlgTable"
                                     draggableColumns="true" 
                                     var="dlgTable" 
                                     widgetVar="dlgTable" 
                                     rowIndexVar="index" 
                                     dir="rtl" 
                                     selection="#{invTransferFormMB1.invInvoiceDTO.invDailogeDataSelected}"
                                     value="#{invTransferFormMB1.dataModelInvDailogueData}" 
                                     rows="10"  selectionMode="single"
                                     rowKey="#{dlgTable.index}"
                                     paginator="true" 
                                     lazy="true" 
                                     paginatorTemplate="{CurrentPageReport} {FirstPageLink}
                                     {PreviousPageLink} {PageLinks} {NextPageLink}
                                     {LastPageLink} {RowsPerPageDropdown}"
                                     emptyMessage="#{userData.userDDs['EMPTY_TABLE']}">

                            <f:facet name="header" >
                                <p:outputPanel  >
                                    <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                                    <p:inputText id="globalFilter" onkeyup="PF('dlgTable').filter()" style="width:150px" />
                                </p:outputPanel>
                            </f:facet>


                            <p:column style="width:15vw;font-size:1.8vw;text-align: right;border-radius: 0px" 
                                      filterStyle="display:none"
                                      filterBy="#{dlgTable.serial}" 
                                      filterMatchMode="contains"
                                      headerText="#{userData.userDDs['DELEGATOR_NUMBER']}"
                                      sortBy="#{dlgTable.serial}"
                                      >
                                <p:outputLabel value="#{dlgTable.serial}" />
                            </p:column>

                            <p:column style="width:15vw;font-size:1.8vw;text-align: right;border-radius: 0px"
                                      filterStyle="display:none"
                                      filterBy="#{dlgTable.organizationSiteName}"
                                      filterMatchMode="contains"
                                      headerText="#{userData.userDDs['SUPPLIER']}" 
                                      sortBy="#{dlgTable.organizationSiteName}" 
                                      >
                                <p:outputLabel value="#{dlgTable.organizationSiteName}" />
                            </p:column>  

                            <p:column style="width:15vw;font-size:1.8vw;text-align: right;border-radius: 0px"
                                      filterStyle="display:none" filterBy="#{dlgTable.remarks}"
                                      filterMatchMode="contains"
                                      headerText="#{userData.userDDs['REMARK']}" 
                                      sortBy="#{dlgTable.remarks}" >
                                <p:outputLabel value="#{dlgTable.remarks}" />
                            </p:column>  
                            <p:column style="width:15vw;font-size:1.8vw;text-align: right;border-radius: 0px"
                                      filterStyle="display:none"
                                      filterBy="#{dlgTable.date}" 
                                      filterMatchMode="contains" 
                                      headerText="#{userData.userDDs['DATEE']}" 
                                      sortBy="#{dlgTable.date}" >
                                <p:outputLabel value="#{dlgTable.date}" >
                                    <f:convertDateTime type="date" pattern="dd-MM-yyyy"/>
                                </p:outputLabel>                           
                            </p:column>


                        </p:dataTable> 

                        <p:commandButton  update="invPurchaseInvoiceDetailsTable test "  
                                          class="reloadButtons"
                                          style="color: #fff!important;background-color: #00BCD4"   
                                          action="#{invTransferFormMB1.loadDlg()}" 
                                          title="#{userData.userDDs['UPLOAD']}"  >

                        </p:commandButton>

                    </p:dialog>


                </h:panelGroup>



            </h:panelGrid>
            
            <div class="ui-g-6 ui-xl-6" >

                <p:dialog header="البحث عن صنف" widgetVar="dlg4" showEffect="explode" hideEffect="bounce" height="440" width="500" style="margin-top: 2%">

                    <h:panelGroup>
                        <p:outputLabel style="width: 10vh" value="الصنف"/>
                    </h:panelGroup> 
                    <h:panelGroup>
                        <p:inputText value="#{invTransferFormMB1.itemName}"/>  
                    </h:panelGroup>

                    <h:panelGroup style="margin-right: 6%">

                        <p:commandButton     class="saveButton"  
                                             title="#{userData.userDDs['SAVE']}"
                                             value="بحث" 
                                             icon="fa fa-fw fa-save" 
                                             action="#{invTransferFormMB1.findAllItemsBarcodesDetailsViewBranchId()}"
                                             update="itemTable"
                                             >
                        </p:commandButton>

                    </h:panelGroup>

                    <h:panelGroup>
                        <p:dataTable id="itemTable"
                                     draggableColumns="true" 
                                     var="itemTable" 
                                     style="margin-top: 5%"
                                     widgetVar="itemTable" 
                                     rowIndexVar="index" 
                                     dir="rtl" 
                                     selection="#{invTransferFormMB1.itemsBarcodesDetailsViewListForSearchSelected}"
                                     value="#{invTransferFormMB1.itemsBarcodesDetailsViewListForSearch}" 
                                     selectionMode="single"
                                     rowKey="#{itemTable.id}"  scrollable="true" scrollHeight="250"
                                     emptyMessage="#{userData.userDDs['EMPTY_TABLE']}">

                            <f:facet name="header" >
                                <p:outputPanel  >
                                    <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                                    <p:inputText id="globalFilter" onkeyup="PF('itemTable').filter()" style="width:150px" />
                                </p:outputPanel>
                            </f:facet>

                            <p:column style="width:2vw;font-size:0.8vw;text-align: right;border-radius: 0px"
                                      filterStyle="display:none"
                                      filterBy="#{itemTable.barcode}"
                                      filterMatchMode="contains"
                                      headerText="الكود" 
                                      sortBy="#{itemTable.barcode}" 
                                      >
                                <p:outputLabel value="#{itemTable.barcode}" />
                            </p:column>  

                            <p:column style="width:10vw;font-size:0.8vw;text-align: right;border-radius: 0px"
                                      filterStyle="display:none" filterBy="#{itemTable.name}"
                                      filterMatchMode="contains"
                                      headerText="الصنف" 
                                      sortBy="#{itemTable.name}" >
                                <p:outputLabel value="#{itemTable.name}" />
                            </p:column>  
                        </p:dataTable> 

                    </h:panelGroup>

                    <h:panelGroup>
                        <br/>
                        <p:commandButton     class="saveButton"  
                                             title="#{userData.userDDs['SAVE']}"
                                             value="تحميل" 
                                             icon="fa fa-fw fa-save" 
                                             action="#{invTransferFormMB1.putItemsBarcodesDetailsViewBranchId()}"
                                             update="@form"
                                             >
                        </p:commandButton>
                    </h:panelGroup>

                </p:dialog>



            </div>
