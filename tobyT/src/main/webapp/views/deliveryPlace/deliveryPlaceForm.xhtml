<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <h:form id="form"  dir="#{userData.dir}" class='formmargin'>
            <p:fieldset id="whole" style="margin-bottom:20px">

                <div class="ui-g-12 ui-xl-12">
                    <div class="ui-g-6 ui-xl-6">
                        <p:inputText style="width:48%" value="#{invPurchaseInvoiceDeliveryPalace.serial}" >
                        </p:inputText>
                    </div>
                    <div class="ui-g-6 ui-xl-6">
                        <p:outputLabel style="width:70px" value="رقم الفاتورة"/>
                    </div>
                </div>
                <div class="ui-g-12 ui-xl-12">
                    <p:commandButton  class="searchButtons"
                                      value="#{userData.userDDs['SEARCH']}"                                      
                                      action="#{invPurchaseInvoiceDeliveryPalace.search()}" 
                                      update="@form"/>
                </div>

                <div class="ui-g-12 ui-xl-12">
                    <div class="ui-g-6 ui-xl-6">
                        <p:outputLabel style="width: 20%" value="#{invPurchaseInvoiceDeliveryPalace.invInvoiceDTO.date}">
                            <f:convertDateTime type="date" pattern="dd-MM-yyyy hh:mm:ss"/>
                        </p:outputLabel>

                    </div>
                    <div class="ui-g-6 ui-xl-6">

                        <p:outputLabel  style="width: 45px" value="تاريخ الفاتورة "/>
                    </div>
                </div>
                <div class="ui-g-12 ui-xl-12">
                    <div class="ui-g-6 ui-xl-6">

                        <p:outputLabel style="width: 20%" value="#{invPurchaseInvoiceDeliveryPalace.invInvoiceDTO.organizationSiteName}"/>

                    </div>
                    <div class="ui-g-6 ui-xl-6">
                        <p:outputLabel  style="width: 45px" value="اسم العميل "/>

                    </div>
                </div>
                <div class="ui-g-12 ui-xl-12">
                    <div class="ui-g-6 ui-xl-6">
                        <p:selectOneMenu style="width: 70%" id="groupid111" 
                                         filter="true" filterMatchMode="contains"   
                                         value="#{invPurchaseInvoiceDeliveryPalace.invInvoiceDTO.deliveryPlace}" 
                                         converter="#{invPurchaseInvoiceDeliveryPalace.invInventoryDTOConverter}"   >
                            <f:selectItem itemLabel="#{userData.userDDs['CHOOSE']}"  itemValue="" />
                            <f:selectItems value="#{invPurchaseInvoiceDeliveryPalace.invInventoryDTOList}"  
                                           var="invoice" itemLabel="#{invoice}" itemValue="#{invoice}"/>
                        </p:selectOneMenu>

                    </div>
                    <div class="ui-g-6 ui-xl-6">
                        <p:outputLabel style="width: 55px" value="المخازن  "/>
                    </div>
                </div>
                <div class="ui-g-12 ui-xl-12">
                    <p:commandButton  id="saveB" 
                                      class="saveButtons"
                                      title="#{userData.userDDs['SAVE']}"
                                      value="#{userData.userDDs['SAVE']}" 
                                      action="#{invPurchaseInvoiceDeliveryPalace.save()}"
                                      update="@form"   />
                </div>
                </p:fieldset>
        </h:form>
    </ui:define>
</ui:composition>
