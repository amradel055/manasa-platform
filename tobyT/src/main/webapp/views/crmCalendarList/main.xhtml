<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns="http://www.w3.org/1999/xhtml" >
    <ui:define name="content">

        <h:head>
            <title>#{userData.userDDs['SERVICES_DIRECT']}</title>
        </h:head>
        <style>

            .ui-widget-content .ui-state-default, .ui-widget-header .ui-state-default {
                border: 1px solid #c5dbec;
                background:none;
            }

        </style>

        <h:form  style="margin-right: 20px" dir="#{userData.dir}">
            <p:fieldset legend="قائمة المهام" style="margin-bottom:20px">
                <div class="col-xs-12">
                    <p:messages id="curmsg" showDetail="true" rendered="true" closable="true"/>   
                </div>
                <div >
                    <p:dataTable id="taskTable"
                                 draggableColumns="true" 
                                 var="taskTable"
                                 widgetVar="taskTable"  
                                 rowIndexVar="index" 
                                 value="#{crmTasksListDTOMB.dataModel}" lazy="true" 
                                 rows="10"
                                 paginator="true"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink}
                                 {PreviousPageLink} {PageLinks} {NextPageLink}
                                 {LastPageLink} {RowsPerPageDropdown}"
                                 emptyMessage="#{userData.userDDs['EMPTY_TABLE']}" >

                        <f:facet name="header">

                            <p:commandButton class="saddButton" id="b2" icon="fa fa-plus" title="#{userData.userDDs['ADD']}" action="#{crmTasksListDTOMB.goToAdd()}" 
                                             style="float:right" />

                            <p:outputPanel>
                                <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                                <p:inputText id="globalFilter" a:autofocus="true" onkeyup="PF('taskTable').filter()" style="width:150px" />
                            </p:outputPanel>

                            <p:selectOneMenu id="emp" value="#{crmTasksListDTOMB.employeeDTOSelected}" converter="#{crmTasksListDTOMB.employeeDTOConverter}">
                                <f:selectItem itemLabel="الكل" itemValue="" />
                                <f:selectItems value="#{crmTasksListDTOMB.employeeDTOList}" var="empl" itemLabel="#{empl.name}" itemValue="#{empl}" />
                                <p:ajax listener="#{crmTasksListDTOMB.init()}" event="itemSelect" update="@form"
                                                    process="@form"/>
                            </p:selectOneMenu>
                        </f:facet>


                        <p:column style="width: 11vh; text-align: right;font-size:1.8vh;border-radius: 0px" filterStyle="display:none"
                                  filterBy="#{taskTable.serial}" 
                                  filterMatchMode="contains"
                                  headerText="#" 
                                  sortBy="#{taskTable.serial}" 
                                  >
                            <p:outputLabel value="#{taskTable.serial}" />
                        </p:column>


                        <p:column style="width: 11vh; text-align: right;font-size:1.8vh;border-radius: 0px" filterStyle="display:none"
                                  filterBy="#{taskTable.activityType.name}" 
                                  filterMatchMode="contains"
                                  headerText="نوع النشاط" 
                                  sortBy="#{taskTable.activityType.name}" 
                                  >
                            <p:outputLabel value="#{taskTable.activityType.name}" />
                        </p:column>

                        <p:column style="width: 13vh; text-align: right;font-size:1.8vh;border-radius: 0px" filterStyle="display:none"
                                  filterBy="#{taskTable.subject}" 
                                  filterMatchMode="contains"
                                  headerText="الموضوع" 
                                  sortBy="#{taskTable.subject}" 
                                  >
                            <p:outputLabel value="#{taskTable.subject}" />
                        </p:column>

                        <p:column style="width: 9vh; text-align: right;font-size:1.8vh;border-radius: 0px" filterStyle="display:none"
                                  filterBy="#{taskTable.assignedTo.name}" 
                                  filterMatchMode="contains"
                                  headerText="المتابع" 
                                  sortBy="#{taskTable.assignedTo.name}" 
                                  >
                            <p:outputLabel value="#{taskTable.assignedTo.name}" />
                        </p:column>

                        <p:column  style="width: 10vh; text-align: right;font-size:1.8vh;border-radius: 0px" filterStyle="display:none"
                                   filterBy="#{taskTable.startDate}" 
                                   filterMatchMode="contains"
                                   headerText="وقت وتاريخ البداية" 
                                   sortBy="#{taskTable.startDate}" 
                                   >
                            <p:outputLabel value="#{taskTable.startDate}" >
                                <f:convertDateTime  pattern="MM/dd/yyyy HH:mm:ss" />
                            </p:outputLabel>
                        </p:column>

                        <p:column  style="width: 10vh; text-align: right;font-size:1.8vh;border-radius: 0px" filterStyle="display:none"
                                   filterBy="#{taskTable.endDate}" 
                                   filterMatchMode="contains"
                                   headerText="وقت وتاريخ النهاية" 
                                   sortBy="#{taskTable.endDate}" 
                                   >
                            <p:outputLabel value="#{taskTable.endDate}" >
                                <f:convertDateTime  pattern="MM/dd/yyyy HH:mm:ss" />
                            </p:outputLabel>
                        </p:column>


                        <p:column style="width: 13vh; text-align: right;font-size:1.8vh;border-radius: 0px" filterStyle="display:none"
                                  filterBy="#{taskTable.createdByName}" 
                                  filterMatchMode="contains"
                                  headerText="المختص" 
                                  sortBy="#{taskTable.createdByName}" 
                                  >
                            <p:outputLabel value="#{taskTable.createdByName}" />
                        </p:column>

                        <p:column style="width: 10vh;font-size: 1.8vh;text-align: -webkit-auto" headerText="#{userData.userDDs['TRANSACTION']}" >
                            <p:commandButton update="@form" icon="fa fa-fw fa-edit" title="#{userData.userDDs['EDIT']}" action="#{crmTasksListDTOMB.goToEdit()}">
                                <f:setPropertyActionListener value="#{taskTable.id}"  target="#{crmTasksListDTOMB.crmTaskDTOSelected}" />
                            </p:commandButton>
                            <p:commandButton update="@form" icon="fa fa-remove" title="#{userData.userDDs['DELETE']}" 
                                             action="#{crmTasksListDTOMB.delete}">
                                <f:setPropertyActionListener value="#{taskTable.id}" target="#{crmTasksListDTOMB.crmTaskDTOSelected}" />
                                <p:confirm header="Confirmation" message="#{userData.userDDs['ARE_YOU_SURE']}" icon="ui-icon-alert" />
                            </p:commandButton>
                        </p:column>







                    </p:dataTable> 
                    <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                        <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                        <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                    </p:confirmDialog>
                </div>
            </p:fieldset>
        </h:form>

    </ui:define>
</ui:composition>
