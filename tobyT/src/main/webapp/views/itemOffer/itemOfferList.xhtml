<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/newTemplate.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">

        <h:form id="form" dir="#{userData.dir}" class='formmargin'>
          

            <h:panelGrid  id="twelveSegment" columns="1" cellspacing="20" cellpadding="0" >
                <p:fieldset legend="العروض"  >

                    <div>
                        <p:messages autoUpdate="true"  id="msg" showDetail="true" closable="true" rendered="true"/>
                    </div>

                    <p:dataTable 
                        id="itemoffer" 
                        draggableColumns="true"
                        var="itemoffer" 
                        widgetVar="itemoffer" 
                        rowIndexVar="index"
                        value="#{itemOfferListMB.itemOfferDTOs}"
                        rows="15" 
                        paginator="true"
                        paginatorTemplate="{CurrentPageReport} {FirstPageLink}
                        {PreviousPageLink} {PageLinks} {NextPageLink}
                        {LastPageLink} {RowsPerPageDropdown}"
                        emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"                         
                         >
                        
                        <f:facet name="header">
                            <p:commandButton  class="saddButton" id="b2" icon="fa fa-plus" title="#{userData.userDDs['ADD']}" action="#{itemOfferListMB.goToAdd()}" 
                                             style="float:right"
                                             rendered="#{userData.userScreens['itemsdata'].add or userData.isAdmin}" >
                            </p:commandButton>
                        </f:facet>
                        
                        <p:column headerText="من تاريخ" style="text-align:right;width: 12vh;font-size: 1.4vh;border-radius: 0px" 
                                  filterBy="#{itemoffer.date}" sortBy="#{itemData.date}" 
                                  filterMatchMode="contains" filterStyle="display:none">
                            <h:outputText value="#{itemoffer.date}"  />
                        </p:column>
                        <p:column headerText="إلى تاريخ" style="text-align:right;width: 12vh;font-size: 1.4vh;border-radius: 0px" 
                                  filterBy="#{itemoffer.dateEndOffer}" sortBy="#{itemData.dateEndOffer}" 
                                  filterMatchMode="contains" filterStyle="display:none">
                            <h:outputText value="#{itemoffer.dateEndOffer}"  />
                        </p:column>                        
                        
                        <p:column style="width: 10vh;font-size: 1.4vh;border-radius: 0px;text-align: center"  headerText="#{userData.userDDs['TRANSACTION']}" >
                            <p:commandButton class="seditButtons" update="@form" icon="fa fa-fw fa-edit"
                                             title="#{userData.userDDs['EDIT']}" action="#{itemOfferListMB.goToEdit()}">
                            <f:setPropertyActionListener value="#{itemoffer}"  target="#{itemOfferListMB.itemOfferDTOSelected}" />
                        </p:commandButton>

                           <p:commandButton  class="sdeleteButtons"  update="@form"
                                             title="#{userData.userDDs['DELETE']}" 
                                               action="#{itemOfferListMB.delete()}"
                                               style="background-color: red;border-radius: 3px;"
                                               icon="fa fa-remove">
                                <f:setPropertyActionListener value="#{itemoffer}" 
                                                             target="#{itemOfferListMB.itemOfferDTOSelected}" />
                                <p:confirm header="#{userData.userDDs['COFIGRATION']}" message="#{userData.userDDs['ARE_YOU_SURE']}" icon="ui-icon-alert" />
                            </p:commandButton>

                            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                                <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                                <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                            </p:confirmDialog>
                        </p:column>

                    </p:dataTable>
                </p:fieldset>

            </h:panelGrid>

        </h:form>
    </ui:define>
</ui:composition>
