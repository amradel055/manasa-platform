<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <h:form id="ScreenAddEditForm" enctype="multipart/form-data" dir="#{userData.dir}" class='formmargin'>
            <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                  margin-top: 12%;
                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;"
                                  icon="fa fa-fw fa-home"
                                  title="#{userData.userDDs['HOME']}"
                                  class="smhomeButton" 
                                  action="exit" />  
            </div>
            <p:fieldset legend=" متابعة بيانات العميل" style="margin-bottom:20px">

                <div class="ui-g-12 ui-md-6" style="padding: 0px;">
                    <h:panelGroup>
                        <p:outputLabel style="width:104px;margin-right: 5%"  value="العميل" />
                    </h:panelGroup>
                    <h:panelGroup>
                        <p:autoComplete style="width:34%!important " 
                                        dropdown="true"
                                        converter="#{CustomerTrackingMB.invOrganizationSiteDTOConverter}"
                                        value="#{CustomerTrackingMB.invOrganizationSiteDTO}"
                                        var="customer"
                                        itemLabel="#{customer}" 
                                        itemValue="#{customer}" 
                                        forceSelection="true" 
                                        completeMethod="#{CustomerTrackingMB.completeCustomerDTO}"
                                        >
                            <p:ajax event="itemSelect" listener="#{CustomerTrackingMB.search()}" update="invInvoicePurchaseTable2"  />
                        </p:autoComplete>
                    </h:panelGroup>
                </div>

            </p:fieldset>
            <p:fieldset   legend="بحث بالعميل" >


                <p:dataTable id="invInvoicePurchaseTable2"
                             draggableColumns="true"
                             draggableRows="true"
                             var="invInvoicePurchaseTable2" 
                             widgetVar="bTable2" 
                             rowIndexVar="index" 
                             value="#{CustomerTrackingMB.invInvoiceList}"
                             paginator="true"
                             rows="10" 
                             paginatorTemplate="{CurrentPageReport} {FirstPageLink}
                             {PreviousPageLink} {PageLinks} {NextPageLink}
                             {LastPageLink} {RowsPerPageDropdown}" 
                             emptyMessage="#{userData.userDDs['EMPTY_TABLE']}" 
                             >

                    <p:column  style="width: 10vh;font-size: 1.6vh;border-radius: 0px; text-align: right"  filterStyle="display:none" 
                               filterBy="#{invInvoicePurchaseTable2.serial}" 
                               filterMatchMode="contains" 
                               headerText="#{userData.userDDs['INVOICE_NO']}"
                               sortBy="#{invInvoicePurchaseTable2.serial}"
                               >
                        <p:outputLabel value="#{invInvoicePurchaseTable2.serial}"/>
                    </p:column>


                    <p:column style="width: 9vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px; text-align: center" filterStyle="display:none" 
                              filterBy="#{invInvoicePurchaseTable2.date}" 
                              filterMatchMode="contains"
                              headerText="#{userData.userDDs['DATEE']}"
                              sortBy="#{invInvoicePurchaseTable2.date}" 
                              >
                        <p:outputLabel value="#{invInvoicePurchaseTable2.date}" >
                            <f:convertDateTime type="date" pattern="dd-MM-yyyy"/>
                        </p:outputLabel>                           
                    </p:column>

                    <p:column style="width: 9vh;font-size: 1.8vh;border-radius: 0px;text-align: center" filterStyle="display:none"
                              filterBy="#{invInvoicePurchaseTable2.invInventoryId.name}"
                              filterMatchMode="contains" 
                              headerText="#{userData.userDDs['DEPOSITORY']}"
                              sortBy="#{invInvoicePurchaseTable2.invInventoryId.name}" 
                              >
                        <p:outputLabel value="#{invInvoicePurchaseTable2.invInventoryId.name}" />
                    </p:column>

                    <p:column style="width: 8vh;font-size: 1.8vh;border-radius: 0px;text-align: center" filterStyle="display:none"
                              filterBy="#{invInvoicePurchaseTable2.customerCode}"
                              filterMatchMode="contains" 
                              headerText="كود"
                              sortBy="#{invInvoicePurchaseTable2.customerCode}" 
                              >
                        <p:outputLabel value="#{invInvoicePurchaseTable2.customerCode}" />
                    </p:column>

                    <p:column style="width: 8vh;font-size: 1.8vh;border-radius: 0px;text-align: center" filterStyle="display:none"
                              filterBy="#{invInvoicePurchaseTable2.organizationSiteName}"
                              filterMatchMode="contains" 
                              headerText="العميل"
                              sortBy="#{invInvoicePurchaseTable2.organizationSiteName}" 
                              >
                        <p:outputLabel value="#{invInvoicePurchaseTable2.organizationSiteName}" />
                    </p:column>
                    <p:column style="width: 9vh;font-size: 1.8vh;border-radius: 0px;text-align: center" filterStyle="display:none"
                              filterBy="#{invInvoicePurchaseTable2.customerMobile}"
                              filterMatchMode="contains" 
                              headerText="الهاتف"
                              sortBy="#{invInvoicePurchaseTable2.customerMobile}" 
                              >
                        <p:outputLabel value="#{invInvoicePurchaseTable2.customerMobile}" />
                    </p:column>
                    <p:column style="width: 10vh;font-size: 1.8vh;border-radius: 0px;text-align: center" filterStyle="display:none"
                              filterBy="#{invInvoicePurchaseTable2.invoiceStatus}"
                              filterMatchMode="contains" 
                              headerText="الحالة"
                              sortBy="#{invInvoicePurchaseTable2.invoiceStatus}" >
                        <p:outputLabel value="#{invInvoicePurchaseTable2.invoiceStatus}" />
                    </p:column>
                    <p:column style="width: 10vh;font-size: 1.8vh;border-radius: 0px;text-align: center" filterStyle="display:none"
                              filterBy="#{invInvoicePurchaseTable2.numberOfToob}"
                              filterMatchMode="contains" 
                              headerText="عدد التوب"
                              sortBy="#{invInvoicePurchaseTable2.numberOfToob}" >
                        <p:outputLabel value="#{invInvoicePurchaseTable2.numberOfToob}" />
                    </p:column>

                    <p:column style="width: 10vh;font-size: 1.8vh;border-radius: 0px;" filterStyle="display:none"
                              filterBy="#{invInvoicePurchaseTable2.createdByName}"
                              filterMatchMode="contains" 
                              headerText="#{userData.userDDs['INVOI_ENTR']}"
                              sortBy="#{invInvoicePurchaseTable2.createdByName}" >
                        <p:outputLabel value="#{invInvoicePurchaseTable2.createdByName}" />
                    </p:column>
                    <p:column style="width: 10vh;font-size: 1.8vh;border-radius: 0px;text-align: center" filterStyle="display:none"
                              filterBy="#{invInvoicePurchaseTable2.remarks}"
                              filterMatchMode="contains" 
                              headerText="#{userData.userDDs['NOTE']}"
                              sortBy="#{invInvoicePurchaseTable2.remarks}" >
                        <p:outputLabel value="#{invInvoicePurchaseTable2.remarks}" />
                    </p:column>
                    <p:column  style="width: 12vh;font-size: 1.8vh;text-align:center;border-radius: 0px;" headerText="#{userData.userDDs['TRANSACTION']}" >
                        <p:commandButton  
                            update="@form" 
                            class="smsearchButtons"
                            icon="fa fa-fw fa-search-plus"  style="background-color: rgba(63, 81, 181, 0.88);border-radius: 3px;"
                            title="#{userData.userDDs['VIEW']}" 
                            action="#{invPurchaseInvoiceListDTOMB.goToEdit()}"  >
                            <f:setPropertyActionListener value="#{invInvoicePurchaseTable2}" 
                                                         target="#{invPurchaseInvoiceListDTOMB.invInvoiceDTOSelected}" />
                        </p:commandButton>



                        <p:commandButton 
                            class="sprintButtons"
                            update="@form" onclick="form.target = '_blank'"  ajax="false"
                            icon="fa fa-fw fa-print" style="background-color: rgb(0, 74, 128);border-radius: 3px;"
                            title="print" 
                            action="#{invPurchaseInvoiceListDTOMB.printList()}"  >
                            <f:setPropertyActionListener value="#{invInvoicePurchaseTable2}" 
                                                         target="#{invPurchaseInvoiceListDTOMB.invInvoiceDTOSelected}" />
                        </p:commandButton>

                    </p:column>
                    <f:facet name="footer"   >

                    </f:facet>
                </p:dataTable> 
                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                    <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                    <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                </p:confirmDialog>

            </p:fieldset>

        </h:form>
    </ui:define>

</ui:composition>
