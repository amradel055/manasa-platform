<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">
        <h:body>

            <h:form dir="RTL" style="margin-right: 20px" id="form" >
                <p:fieldset  legend=" ربحية الأصناف المباعة" id="stages"  style=" position: relative">
                    <p:messages id="messages" showDetail="true" closable="true"/> 


                    <div class="ui-g-6 ui-xl-6">

                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">

                                <p:calendar style="width: 50%"  id="dateFrom"
                                            value="#{profitOfItemsSoldReport.profitOfItemsSold.dateFrom}"
                                            pattern="dd/MM/yyyy"  showButtonPanel="true" >

                                </p:calendar>
                            </div>
                            <div class="ui-g-6 ui-xl-6">

                                <p:outputLabel style="width: 50px"  value="من تاريخ" />



                            </div>
                        </div>

                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">
                                <p:inputText value="#{profitOfItemsSoldReport.dayHijriFrom}" /> يوم
                                <p:inputText value="#{profitOfItemsSoldReport.monthHijriFrom}" />  شهر
                                <p:inputText value="#{profitOfItemsSoldReport.yearHijriFrom}" />  سنة
                                <p:commandButton     class="saveButton" id="excuteFrom" 
                                                     value="تنفيذ" 
                                                     icon="fa fa-fw fa-save"
                                                     action="#{profitOfItemsSoldReport.convertDateFrom()}"
                                                     update="dateFrom"
                                                     />
                            </div>
                            <div class="ui-g-6 ui-xl-6">
                                <p:outputLabel style="width: 50px"  value="من تاريخ هجري" />
                            </div>
                        </div>

                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">
                                <p:calendar style="width: 50%"  id="dateTo"
                                            value="#{profitOfItemsSoldReport.profitOfItemsSold.dateTo}"
                                            pattern="dd/MM/yyyy"  showButtonPanel="true" >

                                </p:calendar>

                            </div>
                            <div class="ui-g-6 ui-xl-6">

                                <p:outputLabel style="width: 50px"  value="الى تاريخ" />



                            </div>
                        </div>

                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">
                                <p:inputText value="#{profitOfItemsSoldReport.dayHijriTo}" /> يوم
                                <p:inputText value="#{profitOfItemsSoldReport.monthHijriTo}" />  شهر
                                <p:inputText value="#{profitOfItemsSoldReport.yearHijriTo}" />  سنة
                                <p:commandButton     class="saveButton" id="excuteTo" 
                                                     value="تنفيذ" 
                                                     icon="fa fa-fw fa-save"
                                                     action="#{profitOfItemsSoldReport.convertDateTo()}"
                                                     update="dateTo"
                                                     />
                            </div>
                            <div class="ui-g-6 ui-xl-6">
                                <p:outputLabel style="width: 50px"  value="إلى تاريخ هجري" />
                            </div>
                        </div>

                    </div>
                    <div class="ui-g-6 ui-xl-6">
                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">
                                <p:selectCheckboxMenu id="gallary_From" value="#{profitOfItemsSoldReport.profitOfItemsSold.gallarySelected}" 
                                                      converter="#{profitOfItemsSoldReport.gallaryDTOConverters}"
                                                      label="المعرض" style="width: 15rem"
                                                      filter="true" filterMatchMode="startsWith" panelStyle="width: 15rem" scrollHeight="250">
                                    <f:selectItems value="#{profitOfItemsSoldReport.gallaryLists}" 
                                                   var="gallary"
                                                   itemLabel="#{gallary}"
                                                   itemValue="#{gallary}"/>
                                </p:selectCheckboxMenu>
                            </div>
                            <div class="ui-g-6 ui-xl-6">
                                <p:outputLabel style="width: 50px;margin-right: 1%" value="المعرض"/>
                            </div>
                        </div>
                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">
                                <p:selectOneMenu id="option" value="#{profitOfItemsSoldReport.type}" >
                                    <f:selectItem itemLabel="امر شغل" itemValue="4"/>
                                    <f:selectItem itemLabel="فواتير مشتريات" itemValue="0"/>
                                    <f:selectItem itemLabel=" مردود مشتريات" itemValue="2"/>
                                    <f:selectItem itemLabel=" مردود مبيعات" itemValue="2"/>
                                </p:selectOneMenu>

                            </div>

                            <div class="ui-g-6 ui-xl-6">
                                <p:outputLabel value="الحالة"/>
                            </div>
                        </div>

                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">
                                <p:selectCheckboxMenu id="proGroup" value="#{profitOfItemsSoldReport.profitOfItemsSold.groupDTOSelected}" 
                                                      converter="#{profitOfItemsSoldReport.proGroupDTOConverter}"
                                                      label="الفئة" style="width: 15rem"
                                                      filter="true" filterMatchMode="startsWith" panelStyle="width: 15rem" scrollHeight="250">
                                    <f:selectItems value="#{profitOfItemsSoldReport.groupDTOList}" 
                                                   var="proGroup"
                                                   itemLabel="#{proGroup}"
                                                   itemValue="#{proGroup}"/>
                                </p:selectCheckboxMenu>
                            </div>
                            <div class="ui-g-6 ui-xl-6">
                                <p:outputLabel style="width: 50px;margin-right: 1%" value="الفئة"/>
                            </div>
                        </div>

                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">
                                <p:selectOneMenu style="width: 100%" id="invoiceType1" 
                                                 value="#{profitOfItemsSoldReport.invoiceType}">                                                             
                                    <f:selectItem itemLabel="Sales مبيعات"  itemValue=""  />
                                    <f:selectItem itemLabel="منيكانات الفروع"  itemValue="0"  />
                                    <f:selectItem itemLabel="منيكانات القماشين"  itemValue="1"  />
                                    <f:selectItem itemLabel="Relations علاقات عامة"  itemValue="2"  />
                                    <f:selectItem itemLabel="تفصيل القماشين"  itemValue="3"  />
                                    <f:selectItem itemLabel="Employees موظفى الفروع"  itemValue="4"  />
                                    <f:selectItem itemLabel="Modify تعديلات"  itemValue="5"  />
                                    <f:selectItem itemLabel="Others أخرى"  itemValue="6"  />
                                </p:selectOneMenu>      
                            </div>
                            <div class="ui-g-6 ui-xl-6">
                                <p:outputLabel style="width: 70px;" value="نوع الفاتورة"/>
                            </div>
                        </div>

                    </div>




                </p:fieldset>
                <div class="ui-g-12 ui-xl-12">

                    <p:commandButton     class="saveButton" id="saveB" 
                                         value="بحث" 
                                         icon="fa fa-fw fa-save"
                                         action="#{profitOfItemsSoldReport.search()}"
                                         update="table messages"
                                         >

                    </p:commandButton>
                    <h:commandLink  class="sdcreenimg">  
                        <p:graphicImage name="/img/excel.jpg" width="24"/>  
                        <p:dataExporter type="xls"
                                        target="table" 
                                        fileName=" ربحية الأصناف المباعة"
                                        postProcessor="#{profitOfItemsSoldReport.postProcessXLS}" />  
                    </h:commandLink> 

                </div>
                <p:fieldset  legend="البيانات"   style="margin-bottom:20px">
                    <p:dataTable  id="table"
                                  var="data"
                                  value="#{profitOfItemsSoldReport.profitOfItemsSoldList}"
                                  draggableColumns="true"
                                  paginator="true"
                                  widgetVar="data" 
                                  rowIndexVar="index" 
                                  rows="30"
                                  emptyMessage="EMPTY_TABLE"
                                  >

                        <p:column headerText="الكود" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{data.code}" />
                        </p:column>
                        <p:column headerText="الاسم" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{data.name}" />
                        </p:column>
                        <p:column headerText="متوسط التكلفة" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{data.costAverage}" />
                        </p:column>
                        <p:column headerText="كمية المبيعات" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{data.totallSell}" />
                        </p:column>
                        <p:column headerText="عدد المبيعات" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{data.totallNumber}" />
                        </p:column>
                        <p:column headerText="الخصم الكلى" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{data.totallDiscount}" />
                        </p:column>
                        <p:column headerText="اجمالى سعر البيع" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{data.totallNet}" />
                        </p:column>

                    </p:dataTable>
                    <div class="ui-g-12 ui-md-6">
                        <p:commandButton class="printButton"  icon="fa fa-fw fa-print"
                                         onclick="form.target = '_blank'" ajax="false"
                                         value="#{userData.userDDs['PRINT']}"
                                         actionListener="#{profitOfItemsSoldReport.exportPDF(actionEvent)}"/>
                    </div>

                </p:fieldset>
            </h:form>
        </h:body>
    </ui:define>
</ui:composition>
