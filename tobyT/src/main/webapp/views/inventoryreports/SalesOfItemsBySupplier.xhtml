<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">
        <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>

        <f:event listener="#{userData.authorize}" type="preRenderView" />

        <h:form  id="form" dir="#{userData.dir}"  style="margin-right: 20px">

            <p:fieldset    style=" position: relative;margin-bottom: 10px"   legend="  #{userData.userDDs['ITEM_SALE_SUPP']}"> 

                <div  id="firstSegment" class="ui-g-12 ui-g-nopad firstset">
                    <div class="ui-g">

                        <div class="ui-g-6 ui-xl-6">

                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">

                                    <p:selectCheckboxMenu id="organization" value="#{salesOfItemsBySupplierNewMB.purchaseOfItemsBySuppliersSearchBean.organizationSiteList }" 
                                                          converter="#{salesOfItemsBySupplierNewMB.invOrgSiteSupplierConverter}"
                                                          label="اختر مورد" style="width: 15rem"
                                                          filter="true" filterMatchMode="startsWith" panelStyle="width: 15rem" scrollHeight="250">
                                        <f:selectItems value="#{salesOfItemsBySupplierNewMB.organizationSiteRootList}" 
                                                       var="organization"
                                                       itemLabel="#{organization}" 
                                                       itemValue="#{organization}"/>
                                    </p:selectCheckboxMenu>
                                </div>

                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 70px" value="#{userData.userDDs['FROM_SUPPLIER']}"/>

                                </div>
                            </div>

                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:calendar pattern="dd/MM/yyyy" 
                                                value="#{salesOfItemsBySupplierNewMB.purchaseOfItemsBySuppliersSearchBean.dateFrom}"
                                                style="width: 56%">

                                    </p:calendar>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel  style="width: 70px" value="#{userData.userDDs['FROM_DATE']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:calendar pattern="dd/MM/yyyy" 
                                                value="#{salesOfItemsBySupplierNewMB.purchaseOfItemsBySuppliersSearchBean.dateTo}"
                                                style="width: 56%">

                                    </p:calendar>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel  style="width: 70px" value="#{userData.userDDs['TO_DATE']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:selectCheckboxMenu id="proGroup" value="#{salesOfItemsBySupplierNewMB.purchaseOfItemsBySuppliersSearchBean.groupDTOSelected}" 
                                                          converter="#{salesOfItemsBySupplierNewMB.proGroupDTOConverter}"
                                                          label="الفئة" style="width: 15rem"
                                                          filter="true" filterMatchMode="startsWith" panelStyle="width: 15rem" scrollHeight="250">
                                        <f:selectItems value="#{salesOfItemsBySupplierNewMB.groupDTOList}" 
                                                       var="proGroup"
                                                       itemLabel="#{proGroup}"
                                                       itemValue="#{proGroup}"/>
                                    </p:selectCheckboxMenu>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 50px;margin-right: 1%" value="الفئة"/>
                                </div>
                            </div>

                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:selectOneMenu style="width: 100%" id="invoiceType1" 
                                                     value="#{salesOfItemsBySupplierNewMB.invoiceType}">   
                                         <f:selectItem itemLabel="الكل"  itemValue="-1"  />
                                        <f:selectItem itemLabel="Sales مبيعات"  itemValue=""  />
                                        <f:selectItem itemLabel="منيكانات الفروع"  itemValue="0"  />
                                        <f:selectItem itemLabel="منيكانات القماشين"  itemValue="1"  />
                                        <f:selectItem itemLabel="Relations علاقات عامة"  itemValue="2"  />
                                        <f:selectItem itemLabel="تفصيل القماشين"  itemValue="3"  />
                                        <f:selectItem itemLabel="Employees موظفى الفروع"  itemValue="4"  />
                                        <f:selectItem itemLabel="Modify تعديلات"  itemValue="5"  />
                                        <f:selectItem itemLabel="Others أخرى"  itemValue="6"  />
                                    </p:selectOneMenu>      
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 70px;" value="نوع الفاتورة"/>
                                </div>
                            </div>




                        </div>

                        <div class="ui-g-6 ui-xl-6">




                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">

                                    <p:selectBooleanCheckbox  id="showReportCheck" value="#{salesOfItemsBySupplierNewMB.invItemSalesSearchBean.showReport}">
                                    </p:selectBooleanCheckbox>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 70px" value="#{userData.userDDs['TOTAL_SALE_REP']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:selectBooleanCheckbox  id="shortReportCheck"  value="#{salesOfItemsBySupplierNewMB.invItemSalesSearchBean.shortReport}">
                                    </p:selectBooleanCheckbox>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 70px" value="مورد مختصر"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:commandButton value="رسم بياني" update="@form" oncomplete="PF('dlg1').show()" />

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">

                                </div>
                                <div class="ui-g-6 ui-xl-6">

                                </div>
                            </div>
                        </div>

                    </div>
                    <p:dialog class="ui-dialog"
                              modal="true"
                              position='center,center'
                              minHeight="40" minWidth="220"
                              header="رسم بياني" widgetVar="dlg1">


                        <div  id="donutchart"  style="width: 75vw; height: 650px;"></div>

                        <p:commandButton  class="printButton"
                                          id="PrintC"
                                          ajax="false"
                                          onclick="form.target = '_blank'"  
                                          icon="fa fa-fw fa-print"
                                          value="#{userData.userDDs['PRINT']}" 
                                          actionListener="#{salesOfItemsBySupplierNewMB.exportChartPDF}"
                                          title="#{userData.userDDs['PRINT']}"
                                          immediate="true" />
                    </p:dialog> 
                </div>


                <div style="text-align: center">
                    <p:commandButton    class="searchButton"
                                        title="#{userData.userDDs['SEARCH']}"
                                        action="#{salesOfItemsBySupplierNewMB.search()}"
                                        id="saveB"
                                        value="#{userData.userDDs['SEARCH']}"
                                        update="@form" 
                                        icon="fa fa-search"  />

                    <p:commandButton  class="newButton"
                                      id="NewB"
                                      title="#{userData.userDDs['NEW']}" 
                                      immediate="true" 
                                      action="#{salesOfItemsBySupplierNewMB.resetSearch()}"
                                      update="form"
                                      value="#{userData.userDDs['NEW']}"
                                      icon="fa fa-plus"/>

                    <p:commandButton  class="PrintButton"
                                      id="PrintB"
                                      ajax="false"
                                      onclick="form.target = '_blank'"  
                                      icon="fa fa-fw fa-print"
                                      value="#{userData.userDDs['PRINT']}" 
                                      actionListener="#{salesOfItemsBySupplierNewMB.exportPDF}"
                                      title="#{userData.userDDs['PRINT']}"
                                      immediate="true" />

                    <p:commandButton  class="closeButton"
                                      id="CloseB"
                                      icon="fa fa-fw fa-backward"  
                                      title="#{userData.userDDs['BACK']}"
                                      action="exit"
                                      value="#{userData.userDDs['BACK']}"/>
                    <h:commandLink  >  
                        <p:graphicImage name="/img/excel.jpg" width="24"/>  
                        <p:dataExporter type="xls"
                                        target="itemSalesReportTable" 
                                        fileName=" تقرير مبيعات الاصناف"
                                        postProcessor="#{salesOfItemsBySupplierNewMB.postProcessXLS}" />  
                    </h:commandLink>

                    <p:blockUI block="form" trigger="saveB NewB PrintB CloseB shortReportCheck showReportCheck" animate="true" >

                        <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                    </p:blockUI> 


                </div>
            </p:fieldset>

            <p:fieldset id="reportDB">
                <p:dataTable 
                    rendered="#{salesOfItemsBySupplierNewMB.invItemSalesSearchBean.showReport eq false}"
                    draggableColumns="true" 
                    var="itemSalesReportTable" 
                    widgetVar="itemSalesReportTable"  
                    rowKey="#{itemSalesReportTable}"
                    rowIndexVar="index" 
                    value="#{salesOfItemsBySupplierNewMB.itemSalesViewBeanList}" 
                    dir="rtl" 
                    paginator="true"
                    rows="20"
                    emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                    id="itemSalesReportTable"
                    rowStyleClass="#{not ( itemSalesReportTable.groupName eq null) and salesOfItemsBySupplierNewMB.invItemSalesSearchBean.shortReport eq false ? 'colored' : null} ">
                    <f:facet name="header">


                        <p:outputPanel>
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" onkeyup="PF('itemSalesReportTable').filter()" style="width:150px" />
                        </p:outputPanel>

                    </f:facet>


                    <p:column   style="width: 8vh;text-align: right;font-size: 1.8vh" headerText="#{userData.userDDs['INVOICE_NO']}" >
                        <p:outputLabel value="#{itemSalesReportTable.serial}" />
                    </p:column>


                    <p:column style="width: 12vh;text-align: right;font-size: 1.8vh" 
                              headerText="#{userData.userDDs['INVOICE_DATE']}">

                        <p:outputLabel value="#{itemSalesReportTable.date}">
                            <f:convertDateTime type="date" pattern="dd-MM-yyyy"/>
                        </p:outputLabel>
                    </p:column>

                    <p:column style="width: 12vh;text-align: right;font-size: 1.8vh" filterStyle="display:none"
                              headerText="#{userData.userDDs['ITEM_NUMBER']}">

                        <p:outputLabel value="#{itemSalesReportTable.itemBarcode}" />
                    </p:column>

                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh" 
                              headerText="#{userData.userDDs['ITEM_NAME']}">

                        <p:outputLabel value="#{itemSalesReportTable.itemName}" />
                    </p:column>
                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh" 
                              headerText="عدد الثياب" >

                        <p:outputLabel value="#{itemSalesReportTable.numberThobe}" />
                    </p:column>
                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh" 
                              headerText="عدد أمتار الثوب الواحد " >

                        <p:outputLabel value="#{itemSalesReportTable.quantityOfOneUnit}" />
                    </p:column>

                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh" 
                              headerText="إجمالى عدد الأمتار " >

                        <p:outputLabel value="#{itemSalesReportTable.itemQuantity}" />
                    </p:column> 

                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh" 
                              headerText=" تكلفة المتر" >

                        <p:outputLabel value="#{itemSalesReportTable.costAvarage}" />
                    </p:column> 

                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh" 
                              headerText=" كمية الفسح" >

                        <p:outputLabel value="#{itemSalesReportTable.fash}" />
                    </p:column> 

                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh" 
                              headerText="تكلفة الفسح" >

                        <p:outputLabel value="#{itemSalesReportTable.costAvarageFashTotal}" />
                    </p:column> 

                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh" 
                              headerText="إجمالى الكمية المباعة " >
                        <p:outputLabel value="#{itemSalesReportTable.totalQuantity}" />
                    </p:column> 

                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh" 
                              headerText=" إجمالى تكلفة الشراء" >

                        <p:outputLabel value="#{itemSalesReportTable.totalcostAvarage}" />

                    </p:column> 

                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh"  headerText="#{userData.userDDs['DISCOUNT']}">

                        <p:outputLabel value="#{itemSalesReportTable.discount}" />

                    </p:column>

                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh"  headerText="#{userData.userDDs['TOTAL']}">
                        <p:outputLabel value="#{itemSalesReportTable.net}" />
                    </p:column> 

                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh"  headerText="المورد">
                        <p:outputLabel value="#{itemSalesReportTable.supplierName}" />
                    </p:column> 

                    <p:columnGroup type="footer">
                        <p:row>
                            <p:column colspan="13"  footerText="#{userData.userDDs['TOTAL']}" /> 
                            <p:column  footerText="#{salesOfItemsBySupplierNewMB.sumTotalNew}" /> 
                            <p:column colspan="1"  footerText="" /> 
                        </p:row>
                    </p:columnGroup>

                </p:dataTable>



                <p:dataTable style="margin-top: 2%"
                             rendered="#{salesOfItemsBySupplierNewMB.invItemSalesSearchBean.showReport eq true}"
                             draggableColumns="true" 
                             var="itemSalesReportTable2" 
                             widgetVar="itemSalesReportTable2"  
                             rowKey="#{itemSalesReportTable2}"
                             rowIndexVar="index" 
                             value="#{salesOfItemsBySupplierNewMB.itemSalesViewBeanList}" 
                             dir="rtl" 
                             emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                             id="itemSalesReportTable2"
                             rowStyleClass="#{not ( itemSalesReportTable2.groupName eq null) and salesOfItemsBySupplierNewMB.invItemSalesSearchBean.shortReport eq false ? 'colored' : null} ">



                    <p:column style="width: 12vh;text-align: right;font-size: 1.8vh" filterStyle="display:none"
                              headerText="#{userData.userDDs['ITEM_NUMBER']}" >
                        <p:outputLabel value="#{itemSalesReportTable2.itemCode}" />
                    </p:column>

                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh" 
                              headerText="#{userData.userDDs['ITEM_NAME']}" >
                        <p:outputLabel value="#{itemSalesReportTable2.itemName}" />
                    </p:column> 
                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh" 
                              headerText="عدد الثياب">
                        <p:outputLabel value="#{itemSalesReportTable2.numberThobe}" >
                        </p:outputLabel>                           
                    </p:column>
                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh" 
                              headerText="عدد أمتار الثوب الواحد " >

                        <p:outputLabel value="#{itemSalesReportTable2.quantityOfOneUnit}" />
                    </p:column>

                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh" 
                              headerText="إجمالى عدد الأمتار " >

                        <p:outputLabel value="#{itemSalesReportTable2.itemQuantity}" />
                    </p:column> 

                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh" 
                              headerText=" تكلفة المتر" >

                        <p:outputLabel value="#{itemSalesReportTable2.costAvarage}" />
                    </p:column> 

                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh" 
                              headerText=" كمية الفسح" >

                        <p:outputLabel value="#{itemSalesReportTable2.fash}" />
                    </p:column> 

                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh" 
                              headerText="تكلفة الفسح" >

                        <p:outputLabel value="#{itemSalesReportTable2.costAvarageFashTotal}" />
                    </p:column> 

                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh" 
                              headerText="إجمالى الكمية المباعة " >
                        <p:outputLabel value="#{itemSalesReportTable2.totalQuantity}" />
                    </p:column> 

                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh" 
                              headerText=" إجمالى تكلفة الشراء" >

                        <p:outputLabel value="#{itemSalesReportTable2.totalcostAvarage}" />

                    </p:column> 

                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh"  headerText="#{userData.userDDs['DISCOUNT']}">

                        <p:outputLabel value="#{itemSalesReportTable2.discount}" />

                    </p:column>

                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh"  headerText="#{userData.userDDs['TOTAL']}">
                        <p:outputLabel value="#{itemSalesReportTable2.net}" />
                    </p:column> 

                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh"  headerText="المورد">
                        <p:outputLabel value="#{itemSalesReportTable2.supplierName}" />
                    </p:column> 
                    <p:columnGroup type="footer">
                        <p:row>
                            <p:column colspan="2"  footerText="#{userData.userDDs['TOTAL']}" /> 
                            <p:column  footerText="#{salesOfItemsBySupplierNewMB.totalThobeNumberNew}" /> 
                            <p:column colspan="1"  /> 
                            <p:column  footerText="#{salesOfItemsBySupplierNewMB.totalQuantityNew}" /> 
                            <p:column colspan="1"  /> 
                            <p:column  footerText="#{salesOfItemsBySupplierNewMB.totalFashNew}" /> 
                            <p:column  footerText="#{salesOfItemsBySupplierNewMB.totalFashCostNew}" /> 
                            <p:column  footerText="#{salesOfItemsBySupplierNewMB.totalQuantityWithFashNew}" /> 
                            <p:column  footerText="#{salesOfItemsBySupplierNewMB.totalcostAvarageNew}" /> 
                            <p:column  footerText="#{salesOfItemsBySupplierNewMB.totalDiscountNew}" /> 
                            <p:column  footerText="#{salesOfItemsBySupplierNewMB.sumTotal}" /> 
                            <p:column colspan="1"  footerText="" /> 
                        </p:row>
                    </p:columnGroup>
                </p:dataTable>

            </p:fieldset>

            <script type="text/javascript">
                google.load("visualization", "1", {packages: ["corechart"]});
                google.charts.setOnLoadCallback(drawChart);
                function drawChart() {
                    var data = google.visualization.arrayToDataTable(
                #{salesOfItemsBySupplierNewMB.pieChartsRows}
                    );
                    var options = {
                        title: 'مبيعات اصناف حسب الموردين',
                        height: 800,
                        seriesType: "bars",
                        vAxis: {
                            title: "الاجمالي"
                        },
                        hAxis: {
                            title: "اسم المورد",
                            slantedText: true, /* Enable slantedText for horizontal axis */
                            slantedTextAngle: 90 /* Define slant Angle */
                        },
                        'chartArea': {'width': '100%', height: '100%', top: '9%', left: '15%', right: '3%', bottom: '30%'} /* Adjust chart alignment to fit vertical labels for horizontal axis*/
                    };

                    var chart = new google.visualization.ComboChart(document.getElementById('donutchart'));
                    chart.draw(data, options);
                }
            </script>

        </h:form>
    </ui:define>
</ui:composition>
