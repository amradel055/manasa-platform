<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">
        <link rel="stylesheet" href="https://ZulNs.github.io/libs/calendar.css"/>
        <script type="text/javascript" src="https://ZulNs.github.io/libs/hijri-date.js"></script>
        <script type="text/javascript" src="https://ZulNs.github.io/libs/calendar.js"></script>
        <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form  id="form" dir="#{userData.dir}"  class='formmargin'>


            <p:fieldset  id="head"  legend="#{userData.userDDs['CLIENT_ACC_REVEAL']}"

                         style=" position: relative">

                <div  id="firstSegment" class="ui-g-12 ui-g-nopad firstset">
                    <div class="ui-g">
                        <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:selectOneMenu id="group" value="#{supplierAccountReportMB.gallaryDTOSelect}"
                                                     converter="#{supplierAccountReportMB.gallaryDTOConverters}">
                                        <f:selectItem itemLabel="اختر معرض" itemValue=""/>
                                        <f:selectItems value="#{supplierAccountReportMB.gallaryLists}" 
                                                       var="gallary"
                                                       itemLabel="#{gallary}"
                                                       itemValue="#{gallary}" />
                                        <p:ajax listener="#{supplierAccountReportMB.hishis()}" />
                                    </p:selectOneMenu>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 50px;margin-right: 1%" value="المعرض"/>
                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:autoComplete style="width:40%!important"
                                                    dropdown="true"
                                                    converter="#{supplierAccountReportMB.invOrgSiteConverter}"
                                                    value="#{supplierAccountReportMB.supplierAccountSearchBean.fromorganizationNameDTO}"
                                                    var="organization"
                                                    itemLabel="#{organization}" 
                                                    itemValue="#{organization}"
                                                    forceSelection="true" 
                                                    completeMethod="#{supplierAccountReportMB.completOrgSiteFrom}"
                                                    maxResults="10"
                                                    > 
                                    </p:autoComplete>

                                </div>
                                <div class="ui-g-6 ui-xl-6">


                                    <p:outputLabel style="width: 75px;" value="#{userData.userDDs['FROM_CUSTOM']}"/>


                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">

                                    <p:autoComplete style="width:40%!important" 
                                                    dropdown="true"
                                                    converter="#{supplierAccountReportMB.invOrgSiteConverter}"
                                                    value="#{supplierAccountReportMB.supplierAccountSearchBean.toorganizationNameDTO}"
                                                    var="organization"
                                                    itemLabel="#{organization}" 
                                                    itemValue="#{organization}"
                                                    forceSelection="true"
                                                    completeMethod="#{supplierAccountReportMB.completOrgSiteTo}" 
                                                    maxResults="10">
                                    </p:autoComplete>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 75px" value="#{userData.userDDs['TO_CUSTOM']}"/>
                                </div>
                            </div>
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">

                                    <p:calendar pattern="dd/MM/yyyy" 
                                                value="#{supplierAccountReportMB.supplierAccountSearchBean.dateFrom}"
                                                style="width: 50%"
                                                id="dateFrom">

                                    </p:calendar>
                                </div>
                                <div class="ui-g-6 ui-xl-6">


                                    <p:outputLabel  style="width: 70px;" value="#{userData.userDDs['FROM_DATE']}"/>


                                </div>
                            </div>

                            <div class="ui-g-12 ui-xl-12" id="datepicker">
                                <div class="ui-g-6 ui-xl-6">
                                    <input id="pick-button" type="button" onclick="pickADate();"
                                           value="pick"
                                           />
                                    <input      value="#{supplierAccountReportMB.supplierAccountSearchBean.dateTest}"
                                                style="width: 50%"
                                                id="picked-text"/>


                                </div>
                                <div class="ui-g-6 ui-xl-6">

                                    <p:outputLabel style="width: 50px"  value="الى تاريخ" />



                                </div>
                            </div>
                        </div>
                    </div>
                </div>


                <div style="text-align : center">
                    <p:commandButton     class="searchButtons"
                                         title="#{userData.userDDs['SEARCH']}"
                                         action="#{supplierAccountReportMB.search()}"
                                         id="search"
                                         value="#{userData.userDDs['SEARCH']}"
                                         update="SupplierAccountViewTable" 
                                         />

                    <p:commandButton  class="newButtons"
                                      id="NewB"
                                      title="#{userData.userDDs['NEW']}" 
                                      immediate="true" 
                                      action="#{supplierAccountReportMB.reset()}"
                                      update="form"
                                      value="#{userData.userDDs['NEW']}"
                                      onclick="clearDate();"/>


                    <p:commandButton  class="printButtons"
                                      id="PrintB"
                                      ajax="false"
                                      onclick="form.target = '_blank'"  
                                      value="#{userData.userDDs['PRINT']}" 
                                      actionListener="#{supplierAccountReportMB.exportPDF}"
                                      title="#{userData.userDDs['PRINT']}"
                                      immediate="true" />

                    <p:commandButton     class="closeButtons"
                                         id="CloseB"
                                         value="#{userData.userDDs['BACK']}" 
                                         title="#{userData.userDDs['BACK']}"
                                         action="exit"   />

                    <h:commandLink  class="sdcreenimg"  style="margin-right: 4px;">  
                        <p:graphicImage name="/img/excel.jpg" width="24"/>  
                        <p:dataExporter type="xls"
                                        target="SupplierAccountViewTable" 
                                        fileName=" تقرير كشف حساب مورد"
                                        postProcessor="#{supplierAccountReportMB.postProcessXLS}" />  
                    </h:commandLink>


                </div>

                <p:blockUI block="form" trigger="search NewB PrintB CloseB" animate="true" >

                    <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                </p:blockUI> 

            </p:fieldset>

            <p:fieldset  style="margin-top: 2%">
                <p:dataTable 
                    rows="20"
                    paginator="true"
                    draggableColumns="true" 
                    var="SupplierAccountViewTable" 
                    widgetVar="SupplierAccountViewTable"  
                    rowKey="#{SupplierAccountViewTable}"
                    rowIndexVar="index" 
                    value="#{supplierAccountReportMB.supplierAccountViewBeanList}" 
                    dir="rtl" 
                    emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                    id="SupplierAccountViewTable">
                    <f:facet name="header">


                        <p:outputPanel>
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" onkeyup="PF('SupplierAccountViewTable').filter()" style="width:150px" />
                        </p:outputPanel>

                    </f:facet>

                    <p:column   style="width: 12vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" headerText="#{userData.userDDs['INVOICE_NO']}" 

                                filterBy="#{SupplierAccountViewTable.serial}" 
                                filterMatchMode="contains" 
                                sortBy="#{SupplierAccountViewTable.serial}"
                                filterable="false">
                        <h:outputText value="#{SupplierAccountViewTable.serial}" style="font-size: 1.5vh"/>
                    </p:column>

                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" 
                              headerText="#{userData.userDDs['DATEE']}"

                              filterBy="#{SupplierAccountViewTable.date}" 
                              filterMatchMode="contains" 
                              sortBy="#{SupplierAccountViewTable.date}"
                              filterable="false">

                        <p:outputLabel value="#{SupplierAccountViewTable.date}">
                            <f:convertDateTime type="date" pattern="dd-MM-yyyy"/>
                        </p:outputLabel>
                    </p:column>
                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" filterStyle="display:none"
                              headerText="#{userData.userDDs['CUSTOMER']}" 

                              filterBy="#{SupplierAccountViewTable.organizationName}" 
                              filterMatchMode="contains" 
                              sortBy="#{SupplierAccountViewTable.organizationName}"
                              filterable="false">

                        <h:outputText value="#{SupplierAccountViewTable.organizationName}" style="font-size: 1.5vh;width: 95%"/>
                    </p:column>

                    <p:column style="width: 12vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" filterStyle="display:none"
                              headerText="#{userData.userDDs['TRANSACTION_TYPE']}"

                              filterBy="#{SupplierAccountViewTable.screenName}" 
                              filterMatchMode="contains" 
                              sortBy="#{SupplierAccountViewTable.screenName}"
                              filterable="false">

                        <h:outputText value="#{SupplierAccountViewTable.screenName}" style="font-size: 1.5vh;width: 95%"/>
                    </p:column>
                    <p:column style="width: 12vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" filterStyle="display:none"
                              headerText="الخزينه"

                              filterBy="#{SupplierAccountViewTable.glBankName}" 
                              filterMatchMode="contains" 
                              sortBy="#{SupplierAccountViewTable.glBankName}"
                              filterable="false">

                        <h:outputText value="#{SupplierAccountViewTable.glBankName}" style="font-size: 1.5vh;width: 95%"/>
                    </p:column>
                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" 
                              headerText="#{userData.userDDs['DEBIT']}" 

                              filterBy="#{SupplierAccountViewTable.exitt}" 
                              filterMatchMode="contains" 
                              sortBy="#{SupplierAccountViewTable.exitt}"
                              filterable="false">

                        <p:inputNumber readonly="true" value="#{SupplierAccountViewTable.exitt}" style="font-size: 1.5vh;width: 95%"/>

                    </p:column>

                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" 
                              headerText="#{userData.userDDs['CREDIT']}" 

                              filterBy="#{SupplierAccountViewTable.adding}" 
                              filterMatchMode="contains" 
                              sortBy="#{SupplierAccountViewTable.adding}"
                              filterable="false">

                        <p:inputNumber readonly="true" value="#{SupplierAccountViewTable.adding}" style="font-size: 1.5vh;width: 90%"/>
                    </p:column>

                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh;border-radius: 0px;" 
                              headerText="#{userData.userDDs['BALANCE']}"

                              filterBy="#{SupplierAccountViewTable.balance}" 
                              filterMatchMode="contains" 
                              sortBy="#{SupplierAccountViewTable.balance}"
                              filterable="false">

                        <p:inputNumber readonly="true" value="#{SupplierAccountViewTable.balance}" style="font-size: 1.5vh;width: 95%"/>

                    </p:column>
                    <p:columnGroup type="footer">
                        <p:row>
                            <p:column colspan="5" style="text-align:right;border-radius: 0px;" footerText="#{userData.userDDs['TOTAL']}  :" />
                            <p:column footerText="#{supplierAccountReportMB.totalDebit}"  style="font-size: 1.4vh;border-radius: 0px;"/>
                            <p:column footerText="#{supplierAccountReportMB.totalCredit}" style="font-size: 1.4vh;border-radius: 0px;"/>
                            <p:column  style="font-size: 1.4vh;border-radius: 0px;" />
                        </p:row>
                    </p:columnGroup>
                </p:dataTable>
            </p:fieldset>
            <script>
                function clearDate() {
                    document.getElementById("form:dateFrom_input").value = null;
                    document.getElementById("form:dateTo_input").value = null;
                }


                var pickedTxt = document.getElementById('picked-text'),
                        pickBtn = document.getElementById('pick-button'),
                        datepicker = new Calendar();
                document.getElementById('datepicker').appendChild(datepicker.getElement());
                datepicker.getElement().style.marginTop = '10px';

                datepicker.callback = function () {
                    pickedTxt.value = datepicker.getDate().getDateString();
                    pickedTxt.selectionStart = 0;
                    pickedTxt.selectionEnd = pickedTxt.value.length;
                    pickedTxt.focus();
                };

                datepicker.onHide = function () {
                    pickBtn.style.display = 'inline-block';
                };

                function pickADate() {
                    pickBtn.style.display = 'none';
                    datepicker.show();
                }

            </script>
        </h:form>
    </ui:define>
</ui:composition>
