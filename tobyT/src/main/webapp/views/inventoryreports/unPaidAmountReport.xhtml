<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">
        <h:body>

            <h:form dir="RTL" style="margin-right: 20px" id="form" >
                <p:fieldset  legend="تقرير بالمبالغ الغير مسددة بالفروع" id="stages"  style=" position: relative">
                    <p:messages id="messages" showDetail="true" closable="true"/> 



                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">

                            <p:calendar style="width: 50%"  id="dateFrom"
                                        value="#{unpaidAmountReport.datefrom}"
                                        pattern="dd/MM/yyyy"  showButtonPanel="true" >

                            </p:calendar>
                        </div>
                        <div class="ui-g-6 ui-xl-6">

                            <p:outputLabel style="width: 50px"  value="من تاريخ" />



                        </div>
                    </div>


                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:calendar style="width: 50%"  id="dateTo"
                                        value="#{unpaidAmountReport.dateto}"
                                        pattern="dd/MM/yyyy"  showButtonPanel="true" >

                            </p:calendar>

                        </div>
                        <div class="ui-g-6 ui-xl-6">

                            <p:outputLabel style="width: 50px"  value="الى تاريخ" />
                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:selectCheckboxMenu id="gallary_From" value="#{unpaidAmountReport.invInventoryDTOSelected}" 
                                                  converter="#{unpaidAmountReport.inventoryDTOConverters}"
                                                  label="" style="width: 15rem"
                                                  filter="true" filterMatchMode="startsWith" panelStyle="width: 15rem" scrollHeight="250">
                                <f:selectItems value="#{unpaidAmountReport.invInventoryDTOList}" 
                                               var="inventory"
                                               itemLabel="#{inventory}"
                                               itemValue="#{inventory}"/>
                            </p:selectCheckboxMenu>
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 50px;" value="المعرض"/>
                        </div>
                    </div>

                </p:fieldset>
                <div class="ui-g-12 ui-xl-12">
                        <p:commandButton     class="saveButton" id="saveB" 
                                             value="بحث" 
                                             icon="fa fa-fw fa-save"
                                             action="#{unpaidAmountReport.search()}"
                                             update="table messages"
                                             >
                        </p:commandButton>
                        <p:commandButton class="printButton"  icon="fa fa-fw fa-print"
                                         onclick="form.target = '_blank'" ajax="false"
                                         value="#{userData.userDDs['PRINT']}"
                                         actionListener="#{unpaidAmountReport.exportPDF(actionEvent)}"/>

                        <h:commandLink  class="sdcreenimg" style="margin-right: 4px;">  

                            <p:graphicImage name="/img/excel.jpg" width="24"/>  

                            <p:dataExporter type="xls"
                                            target="data" 
                                            fileName=" تقرير اجمالي المبالغ الغير  المسددة "
                                            postProcessor="#{unpaidAmountReport.postProcessXLS}" />  
                        </h:commandLink>
                </div>


                <p:fieldset  legend="البيانات"   style="margin-bottom:20px">
                    <p:dataTable  id="table"
                                  var="data"
                                  value="#{unpaidAmountReport.balanceGalaryList}"
                                  draggableColumns="true"
                                  paginator="true"
                                  widgetVar="data" 
                                  rowIndexVar="index" 
                                  rows="30"
                                  emptyMessage="EMPTY_TABLE"
                                  >

                        <p:column headerText="اسم المعرض" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{data.gallaryName}" />
                        </p:column>
                        <p:column headerText="المبلغ الغير مسدد" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{data.value}" />
                        </p:column>


                    </p:dataTable>


                </p:fieldset>
            </h:form>
        </h:body>
    </ui:define>
</ui:composition>
