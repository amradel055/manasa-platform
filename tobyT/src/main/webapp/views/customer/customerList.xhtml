<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form  class='formmargin' id="form" dir="#{userData.dir}">

            <p:fieldset legend="#{userData.userDDs['CUSTOMER_DATA']}" >

                <div >
                    <p:messages id="curmsg" 
                                autoUpdate="true"
                                showDetail="true" 
                                rendered="true" closable="true"/>   
                </div>
                <div>
                    <p:dataTable 
                        id="organizationSiteTable"
                        draggableColumns="true"
                        var="organizationSiteTable" 
                        widgetVar="bTable" 
                        rowIndexVar="index" 
                        value="#{organizationSiteListMB.dataModel}"     
                        lazy="true" 
                        rows="20"
                        paginator="true"
                        paginatorTemplate="{CurrentPageReport} {FirstPageLink}
                        {PreviousPageLink} {PageLinks} {NextPageLink}
                        {LastPageLink} {RowsPerPageDropdown}" 
                        emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                        >

                        <f:facet name="header" >
                            <p:commandButton  class="saddButton" icon="fa fa-plus" title="#{userData.userDDs['ADD']}" 
                                              id="addA"
                                              action="#{organizationSiteListMB.goToAdd()}" style="float:right"
                                              rendered="#{userData.userScreens['customer'].add or userData.isAdmin}"/>

                            <p:selectOneMenu id="inventory" value="#{organizationSiteListMB.gallaryDTOSelect}"
                                             converter="#{organizationSiteListMB.gallaryDTOConverters}" 
                                             style="float:right;width: 20%!important;color:#fff;height: 30px!important;margin-right: 0.5%;">

                                <p:ajax listener="#{organizationSiteListMB.loadGallaryList()}" update="form" />
                                <f:selectItem itemLabel="#{userData.userDDs['ALL']}" itemValue="" />

                                <f:selectItems value="#{organizationSiteListMB.gallaryLists}" 
                                               var="inventory" itemLabel="#{inventory.name}"
                                               itemValue="#{inventory}"/> 
                            </p:selectOneMenu>

                            <p:blockUI block="form" trigger="addA" animate="true" >

                                <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                            </p:blockUI> 

                            <p:outputPanel  >
                                <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                                <p:inputText id="globalFilter" a:autofocus="true" onkeyup="PF('bTable').filter()" style="width:150px" />
                            </p:outputPanel>
                        </f:facet>


                        <p:column style="width:13vh;font-size:1.8vh;text-align: right;border-radius: 0px "
                                  filterStyle="display:none"
                                  filterBy="#{organizationSiteTable.code}"
                                  filterMatchMode="contains" 
                                  headerText="#{userData.userDDs['CUSTOM_CODE']}"
                                  sortBy="#{organizationSiteTable.code}"  
                                  >
                            <p:outputLabel value="#{organizationSiteTable.code}" />
                        </p:column>

                        <p:column style="width:13vh;font-size:1.8vh;text-align: right;border-radius: 0px "
                                  filterStyle="display:none"
                                  filterBy="#{organizationSiteTable.name}"
                                  filterMatchMode="contains" 
                                  headerText="#{userData.userDDs['CUSTOM_NAME']}" sortBy="#{organizationSiteTable.name}" >
                            <p:inputText value="#{organizationSiteTable.name}" />
                        </p:column>



                        <p:column style="width:15vh;font-size: 1.8vh;text-align: right;border-radius: 0px "
                                  filterStyle="display:none" 
                                  filterBy="#{organizationSiteTable.mobile}"
                                  filterMatchMode="contains" 
                                  headerText="الجوال"
                                  sortBy="#{organizationSiteTable.mobile}" 
                                  >
                            <p:inputText value="#{organizationSiteTable.mobile}" />
                        </p:column>
                        <p:column style="width:30vh;font-size: 2.5vh;text-align: center;border-radius: 0px " headerText="الشركة التابع لها">
                            <p:selectOneMenu  id="offerCompanyDTO" filter="true" filterMatchMode="contains"
                                              value="#{organizationSiteTable.offerCompanyDTO}"
                                              converter="#{organizationSiteListMB.offerCompanyDTOConverter}">
                                <f:selectItem itemLabel="اختر" itemValue=""/>
                                <f:selectItems value="#{organizationSiteListMB.offerCompanyDTOList}" 
                                               var="offerCompanyDTO"
                                               itemLabel="#{offerCompanyDTO}"
                                               itemValue="#{offerCompanyDTO}" />
                            </p:selectOneMenu>
                        </p:column>





                        <p:column style="width:10vh;font-size: 1.8vh;text-align: center;border-radius: 0px " headerText="#{userData.userDDs['TRANSACTION']}" >
                            <p:commandButton class="seditButtons" update="@form" icon="fa fa-fw fa-edit" style="background-color: #6a6967;border-radius: 3px;" 
                                             title="#{userData.userDDs['EDIT']}" action="#{organizationSiteListMB.goToEdit()}" rendered="#{userData.userScreens['customer'].edit or userData.isAdmin}">
                                <f:setPropertyActionListener value="#{organizationSiteTable.id}"  target="#{organizationSiteListMB.invOrganizationSiteSelected}" />
                            </p:commandButton>
                            <p:commandButton  class="sdeleteButtons" update="@form" 
                                              icon="fa fa-remove" style="background-color: red;border-radius: 3px;"
                                              title="#{userData.userDDs['DELETE']}" 
                                              action="#{organizationSiteListMB.delete}"
                                              rendered="#{userData.userScreens['customer'].delete or userData.isAdmin}">
                                <f:setPropertyActionListener value="#{organizationSiteTable}" target="#{organizationSiteListMB.invOrganizationSiteDTO}" />
                                <p:confirm header="Confirmation" message="#{userData.userDDs['ARE_YOU_SURE']}" icon="ui-icon-alert" />
                            </p:commandButton>
                            <p:commandButton class="seditButtons" update="@form" icon="fa fa-fw fa-save" style="background-color: #6a6967;border-radius: 3px;" 
                                             title="#{userData.userDDs['SAVE']}" action="#{organizationSiteListMB.updateCompany(organizationSiteTable)}" rendered="#{userData.userScreens['customer'].edit or userData.isAdmin}">
                            </p:commandButton>
                        </p:column>

                    </p:dataTable> 
                    <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                        <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                        <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                    </p:confirmDialog>
                </div>
            </p:fieldset>
        </h:form>
    </ui:define>
</ui:composition>
