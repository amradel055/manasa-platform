<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">
        <style type="text/css">
            .cheap {
                background-color: #54a90a !important;
                background-image: none !important;
                color: #ffffff !important;
            }
        </style>

        <h:body>

            <h:form dir="RTL" style="margin-right: 20px" id="form" >
                <p:fieldset  legend="إجماليات الفئات" id="stages"  style=" position: relative">
                    <p:messages id="messages" showDetail="true" closable="true"/> 

                    <div class="ui-g-6 ui-xl-6">
                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">
                                <p:selectCheckboxMenu id="gallary_From" value="#{summitionItemReportMB2.gallaryListSelected}" 
                                                      converter="#{summitionItemReportMB2.gallaryDTOConverters}"
                                                      label="المعرض" style="width: 15rem"
                                                      filter="true" filterMatchMode="startsWith" panelStyle="width: 15rem" scrollHeight="250">
                                    <f:selectItems value="#{summitionItemReportMB2.gallaryLists}" 
                                                   var="gallary"
                                                   itemLabel="#{gallary}"
                                                   itemValue="#{gallary}"/>
                                </p:selectCheckboxMenu>
                            </div>
                            <div class="ui-g-6 ui-xl-6">
                                <p:outputLabel style="width: 50px;margin-right: 1%" value="المعرض"/>
                            </div>
                        </div>
                        <div class="ui-g-12 ui-xl-12">
                             <div class="ui-g-6 ui-xl-6">
                                <p:selectCheckboxMenu id="proGroup" value="#{summitionItemReportMB.proGroupListSelected}" 
                                                      converter="#{summitionItemReportMB.proGroupDTOConverter}"
                                                      label="الفئة" style="width: 15rem"
                                                      filter="true" filterMatchMode="startsWith" panelStyle="width: 15rem" scrollHeight="250">
                                    <f:selectItems value="#{summitionItemReportMB.groupDTOList}" 
                                                   var="proGroup"
                                                   itemLabel="#{proGroup}"
                                                   itemValue="#{proGroup}"/>
                                </p:selectCheckboxMenu>
                            </div>
                            <div class="ui-g-6 ui-xl-6">

                                <p:outputLabel style="width: 50px;margin-right: 1%" value="الفئة"/>



                            </div>
                        </div>
                        
                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">
                                <p:selectOneMenu style="width: 100%" id="invoiceType1" 
                                                 value="#{summitionItemReportMB.invoiceType}">                                                             
                                    <f:selectItem itemLabel="Sales مبيعات"  itemValue=""  />
                                    <f:selectItem itemLabel="منيكانات الفروع"  itemValue="0"  />
                                    <f:selectItem itemLabel="منيكانات القماشين"  itemValue="1"  />
                                    <f:selectItem itemLabel="Relations علاقات عامة"  itemValue="2"  />
                                    <f:selectItem itemLabel="تفصيل القماشين"  itemValue="3"  />
                                    <f:selectItem itemLabel="Employees موظفى الفروع"  itemValue="4"  />
                                    <f:selectItem itemLabel="Modify تعديلات"  itemValue="5"  />
                                    <f:selectItem itemLabel="Others أخرى"  itemValue="6"  />
                                </p:selectOneMenu>      
                            </div>
                            <div class="ui-g-6 ui-xl-6">
                                <p:outputLabel style="width: 70px;" value="نوع الفاتورة"/>
                            </div>
                        </div>

                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">
                                <p:selectBooleanCheckbox value="#{summitionItemReportMB2.tobAndKhiata}" itemLabel="خياطة و توب"/>
                            </div>
                            <div class="ui-g-6 ui-xl-6">
                                <p:outputLabel style="width: 50px;margin-right: 1%" value="إجمالى الخياطة والتوب"/>
                            </div>
                                
                        </div>
                            

                        </div>

                        <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">

                                    <p:calendar style="width: 50%"  id="dateFrom"
                                                value="#{summitionItemReportMB2.dateFrom}"
                                                pattern="dd/MM/yyyy"  showButtonPanel="true" >

                                    </p:calendar>
                                </div>
                                <div class="ui-g-6 ui-xl-6">

                                    <p:outputLabel style="width: 50px"  value="من تاريخ" />



                                </div>
                            </div>

                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText value="#{summitionItemReportMB2.dayHijriFrom}" /> يوم
                                    <p:inputText value="#{summitionItemReportMB2.monthHijriFrom}" />  شهر
                                    <p:inputText value="#{summitionItemReportMB2.yearHijriFrom}" />  سنة
                                    <p:commandButton     class="saveButton" id="excuteFrom" 
                                                         value="تنفيذ" 
                                                         icon="fa fa-fw fa-save"
                                                         action="#{summitionItemReportMB2.convertDateFrom()}"
                                                         update="dateFrom"
                                                         />
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 50px"  value="من تاريخ هجري" />
                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:calendar style="width: 50%"  id="dateFrom1"
                                                value="#{summitionItemReportMB2.dateTo}"
                                                pattern="dd/MM/yyyy"  showButtonPanel="true" >

                                    </p:calendar>

                                </div>
                                <div class="ui-g-6 ui-xl-6">

                                    <p:outputLabel style="width: 50px"  value="الى تاريخ" />



                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText value="#{summitionItemReportMB2.dayHijriTo}" /> يوم
                                    <p:inputText value="#{summitionItemReportMB2.monthHijriTo}" />  شهر
                                    <p:inputText value="#{summitionItemReportMB2.yearHijriTo}" />  سنة
                                    <p:commandButton     class="saveButton" id="excuteTo" 
                                                         value="تنفيذ" 
                                                         icon="fa fa-fw fa-save"
                                                         action="#{summitionItemReportMB2.convertDateTo()}"
                                                         update="dateFrom1"
                                                         />
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 50px"  value="إلى تاريخ هجري" />
                                </div>
                            </div>

                        </div>

                </p:fieldset>
                <div class="ui-g-12 ui-xl-12">

                    <p:commandButton     class="saveButton" id="saveB" 
                                         value="بحث" 
                                         icon="fa fa-fw fa-save"
                                         action="#{summitionItemReportMB2.search()}"
                                         update="table messages "
                                         >

                    </p:commandButton>


                    <h:commandLink   class="sdcreenimg" >  
                        <p:graphicImage name="/img/excel.jpg" width="24" style='margin-right:25%;'/>  
                        <p:dataExporter type="xls"
                                        target="table" 
                                        fileName="إجماليات الفئات" />  
                    </h:commandLink>

                </div>
                <p:fieldset  legend="البيانات"   style="margin-bottom:20px">
                    <p:dataTable  id="table"
                                  var="data"
                                  value="#{summitionItemReportMB2.itemsViewList}"
                                  draggableColumns="true"
                                  paginator="true"
                                  widgetVar="data" 
                                  rowIndexVar="index" 
                                  rows="30"
                                  emptyMessage="EMPTY_TABLE"
                                  rowStyleClass="#{data.rowType eq 1 ? 'cheap' : null}"
                                  >

                        <p:column headerText="الكود" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{data.code}" />
                        </p:column>
                        <p:column headerText="الفئة" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{data.name}" />
                        </p:column>
                        <p:column headerText="العدد" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{data.number}" />
                        </p:column>
                        <p:column headerText="سعر البيع" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{data.allCost}" />
                        </p:column>
                        <p:column headerText=" التكلفة" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{data.allAvarageCost}" />
                        </p:column>

                        <p:summaryRow>
                            <p:column colspan="2" style="text-align:right">
                                <h:outputText value="Total "/>
                            </p:column>
                            <p:column>
                                <h:outputText value="#{summitionItemReportMB2.sumNumberTotal}"/>
                            </p:column>
                            <p:column>
                                <h:outputText value="#{summitionItemReportMB2.sumAllCostTotal}"/>
                            </p:column>
                            <p:column>
                                <h:outputText value="#{summitionItemReportMB2.sumAllAvarageCost}"/>
                            </p:column>
                        </p:summaryRow>

                        <p:columnGroup type="footer">
                            <p:row>
                                <p:column colspan="2" style="text-align:right;border-radius: 0px" footerText="#{userData.userDDs['TOTAL']}  :" />
                                <p:column  >
                                    <f:facet name="footer">
                                        <p:inputNumber
                                            value="#{summitionItemReportMB2.sumNumberTotal}" />
                                    </f:facet>
                                </p:column>

                                <p:column  >
                                    <f:facet name="footer">
                                        <p:inputNumber
                                            value="#{summitionItemReportMB2.sumAllCostTotal}" />
                                    </f:facet>
                                </p:column>
                                <p:column  >
                                    <f:facet name="footer">
                                        <p:inputNumber
                                            value="#{summitionItemReportMB2.sumAllAvarageCost}" />
                                    </f:facet>
                                </p:column>

                            </p:row>
                        </p:columnGroup>

                    </p:dataTable>
                    <div class="ui-g-12 ui-md-6">
                        <p:commandButton class="printButton2"  icon="fa fa-fw fa-print"
                                         onclick="form.target = '_blank'" ajax="false"
                                         value="#{userData.userDDs['PRINT']}"
                                         actionListener="#{summitionItemReportMB.exportPDF(actionEvent)}"/>
                    </div>
                    <div class="ui-g-12 ui-md-6">
                        
                        <p:commandButton class="printButton"  icon="fa fa-fw fa-print"
                                         onclick="form.target = '_blank'" ajax="false"
                                         value="#{userData.userDDs['PRINT']} New"
                                         actionListener="#{summitionItemReportMB2.print2()}"/>
                    </div>

                </p:fieldset>
            </h:form>
        </h:body>
    </ui:define>
</ui:composition>
