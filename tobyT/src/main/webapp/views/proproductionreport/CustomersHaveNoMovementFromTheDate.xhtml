<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">
        <h:body>

            <h:form dir="RTL" style="margin-right: 20px" id="form" >

                <p:fieldset  legend=" عمال ليس لديهم حركة من تاريخ" id="stages"  style=" position: relative">
                    <p:messages id="messages" showDetail="true" closable="true"/> 

                  

                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">

                                <p:calendar style="width: 50%"  id="dateFrom"
                                            value="#{customersHaveNoMovmentFromTheDateMB.noMovementFromTheDate.date}"
                                            pattern="dd/MM/yyyy"  showButtonPanel="true" >

                                </p:calendar>
                            </div>
                            <div class="ui-g-6 ui-xl-6">

                                <p:outputLabel style="width: 50px"  value="من تاريخ" />



                            </div>
                        </div>
                  
                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:inputText style="width: 10%" value="#{customersHaveNoMovmentFromTheDateMB.dayHijriFrom}" /> يوم
                            <p:inputText style="width: 10%" value="#{customersHaveNoMovmentFromTheDateMB.monthHijriFrom}" />  شهر
                            <p:inputText style="width: 20%" value="#{customersHaveNoMovmentFromTheDateMB.yearHijriFrom}" />  سنه
                            <p:commandButton     class="saveButton" id="excuteFrom" 
                                                 value="تنفيذ" 
                                                 icon="fa fa-fw fa-save"
                                                 action="#{customersHaveNoMovmentFromTheDateMB.convertDateFrom()}"
                                                 update="dateFrom"
                                                 />
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 50px"  value="من تاريخ هجري" />
                        </div>
                    </div>

                   
                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">
                                <p:selectCheckboxMenu id="gallary_From" value="#{customersHaveNoMovmentFromTheDateMB.gallarySelected}" 
                                                      converter="#{customersHaveNoMovmentFromTheDateMB.gallaryDTOConverters}"
                                                      label="المعرض" style="width: 15rem"
                                                      filter="true" filterMatchMode="startsWith" panelStyle="width: 15rem" scrollHeight="250">
                                    <f:selectItems value="#{customersHaveNoMovmentFromTheDateMB.gallaryLists}" 
                                                   var="gallary"
                                                   itemLabel="#{gallary}"
                                                   itemValue="#{gallary}"/>
                                </p:selectCheckboxMenu>
                            </div>
                            <div class="ui-g-6 ui-xl-6">
                                <p:outputLabel style="width: 50px;margin-right: 1%" value="المعرض"/>
                            </div>
                        </div>

                    


                </p:fieldset>

                <div class="ui-g-12 ui-xl-12">
                    <div class="ui-g-6 ui-xl-6">


                        <p:commandButton     class="saveButton" id="saveB" 
                                             value="بحث" 
                                             icon="fa fa-fw fa-save"
                                             action="#{customersHaveNoMovmentFromTheDateMB.search()}"
                                             update="@form"
                                             >

                        </p:commandButton>
                        <h:commandLink  class="sdcreenimg">  
                            <p:graphicImage name="/img/excel.jpg" width="24"/>  
                            <p:dataExporter type="xls"
                                            target="table" 
                                            fileName=" عمال ليس لديهم حركة من تاريخ"
                                            postProcessor="#{customersHaveNoMovmentFromTheDateMB.postProcessXLS}" />  
                        </h:commandLink> 


                    </div>
                </div>
                <p:fieldset  legend="البيانات"   style="margin-bottom:20px">
                    <p:dataTable  id="table"
                                  var="data"
                                  value="#{customersHaveNoMovmentFromTheDateMB.list}"
                                  draggableColumns="true"
                                  paginator="true"
                                  widgetVar="data" 
                                  rowIndexVar="index" 
                                  emptyMessage="EMPTY_TABLE"
                                  rows="20" lazy="true"
                                  >
                        <p:column headerText="#" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText 
                                value="#{index + 1}" />
                        </p:column>
                        <p:column headerText="اسم الموظف " style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{data.name}" />
                        </p:column>
                        <p:column headerText="التليفون" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{data.mobile}" />
                        </p:column>



                    </p:dataTable>
                    <div class="ui-g-12 ui-md-6">
                        <p:commandButton class="printButton"  icon="fa fa-fw fa-print"
                                         onclick="form.target = '_blank'" ajax="false"
                                         value="#{userData.userDDs['PRINT']}"
                                         actionListener="#{customersHaveNoMovmentFromTheDateMB.exportPDF(actionEvent)}"/>
                    </div>


                </p:fieldset>

            </h:form>
        </h:body>
    </ui:define>
</ui:composition>
