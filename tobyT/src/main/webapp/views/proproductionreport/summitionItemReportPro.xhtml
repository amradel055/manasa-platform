<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">

        <style type="text/css">
            .cheap {
                background-color: #54a90a !important;
                background-image: none !important;
                color: #ffffff !important;
            }
        </style>

        <h:body>

            <h:form dir="RTL" style="margin-right: 20px" id="form" >
                <p:fieldset  legend="إجماليات الفئات" id="stages"  style=" position: relative">
                    <p:messages id="messages" showDetail="true" closable="true"/> 

                    <div class="ui-g-6 ui-xl-6">
                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">
                                <p:selectCheckboxMenu id="gallary_From" value="#{summitionItemReportMB.gallaryListSelected}" 
                                                      converter="#{summitionItemReportMB.gallaryDTOConverter}"
                                                      label="المعرض" style="width: 15rem"
                                                      filter="true" filterMatchMode="startsWith" panelStyle="width: 15rem" scrollHeight="250">
                                    <f:selectItems value="#{summitionItemReportMB.gallaryList}" 
                                                   var="gallary"
                                                   itemLabel="#{gallary}"
                                                   itemValue="#{gallary}"/>
                                </p:selectCheckboxMenu>
                            </div>
                            <div class="ui-g-6 ui-xl-6">
                                <p:outputLabel style="width: 50px;margin-right: 1%" value="المعرض"/>
                            </div>
                        </div>
                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">

                                <p:autoComplete style="width:85%" 
                                                dropdown="true"
                                                converter="#{autoComplete.proGroupDTOConverter}"
                                                value="#{summitionItemReportMB.proGroupDTOSelected}"  
                                                var="proGroup"
                                                itemLabel="#{proGroup}"
                                                itemValue="#{proGroup}" 
                                                forceSelection="true" 
                                                completeMethod="#{autoComplete.completeProGroup}" >
                                </p:autoComplete>
                            </div>
                            <div class="ui-g-6 ui-xl-6">

                                <p:outputLabel style="width: 50px;margin-right: 1%" value="الفئة"/>



                            </div>
                        </div>

                    </div>

                    <div class="ui-g-6 ui-xl-6">
                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">

                                <p:calendar style="width: 50%"  id="dateFrom"
                                            value="#{summitionItemReportMB.dateFrom}"
                                            pattern="dd/MM/yyyy"  showButtonPanel="true" >

                                </p:calendar>
                            </div>
                            <div class="ui-g-6 ui-xl-6">

                                <p:outputLabel style="width: 50px"  value="من تاريخ" />



                            </div>
                        </div>

                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">
                                <p:inputText value="#{summitionItemReportMB.dayHijriFrom}" /> يوم
                                <p:inputText value="#{summitionItemReportMB.monthHijriFrom}" />  شهر
                                <p:inputText value="#{summitionItemReportMB.yearHijriFrom}" />  سنة
                                <p:commandButton     class="saveButton" id="excuteFrom" 
                                                     value="تنفيذ" 
                                                     icon="fa fa-fw fa-save"
                                                     action="#{summitionItemReportMB.convertDateFrom()}"
                                                     update="dateFrom"
                                                     />
                            </div>
                            <div class="ui-g-6 ui-xl-6">
                                <p:outputLabel style="width: 50px"  value="من تاريخ هجري" />
                            </div>
                        </div>
                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">
                                <p:calendar style="width: 50%"  id="dateFrom1"
                                            value="#{summitionItemReportMB.dateTo}"
                                            pattern="dd/MM/yyyy"  showButtonPanel="true" >

                                </p:calendar>

                            </div>
                            <div class="ui-g-6 ui-xl-6">

                                <p:outputLabel style="width: 50px"  value="الى تاريخ" />



                            </div>
                        </div>
                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">
                                <p:inputText value="#{summitionItemReportMB.dayHijriTo}" /> يوم
                                <p:inputText value="#{summitionItemReportMB.monthHijriTo}" />  شهر
                                <p:inputText value="#{summitionItemReportMB.yearHijriTo}" />  سنة
                                <p:commandButton     class="saveButton" id="excuteTo" 
                                                     value="تنفيذ" 
                                                     icon="fa fa-fw fa-save"
                                                     action="#{summitionItemReportMB.convertDateTo()}"
                                                     update="dateFrom1"
                                                     />
                            </div>
                            <div class="ui-g-6 ui-xl-6">
                                <p:outputLabel style="width: 50px"  value="إلى تاريخ هجري" />
                            </div>
                        </div>


                    </div>

                </p:fieldset>
                <div class="ui-g-12 ui-xl-12">

                    <p:commandButton     class="saveButton" id="saveB" 
                                         value="بحث" 
                                         icon="fa fa-fw fa-save"
                                         action="#{summitionItemReportMB.search()}"
                                         update="table messages"
                                         >

                    </p:commandButton>

                    <h:commandLink   class="sdcreenimg" >  
                        <p:graphicImage name="/img/excel.jpg" width="24" style='margin-right:25%;'/>  
                        <p:dataExporter type="xls"
                                        target="table" 
                                        fileName="إجماليات الفئات" />  
                    </h:commandLink>

                </div>
                <p:fieldset  legend="البيانات"   style="margin-bottom:20px">
                    <p:dataTable  id="table"
                                  var="data"
                                  value="#{summitionItemReportMB.itemsViewList}"
                                  paginator="true"
                                  widgetVar="data" 
                                  rowIndexVar="index" 
                                  sortMode="single"
                                  rows="30"
                                  emptyMessage="EMPTY_TABLE"
                                  rowStyleClass="#{data.rowType eq 1 ? 'cheap' : null}"
                                  >

                        <p:column sortBy="#{data.code}"  headerText="الكود" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{data.code}" />
                        </p:column>
                        <p:column   headerText="الفئة" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{data.name}" />
                        </p:column>
                        <p:column  headerText="استلام بالمشغل" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{data.factoryNumber}" />
                        </p:column>
                        <p:column  headerText="ارسال للمعرض" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{data.sendNumber}" />
                        </p:column>
                        <p:column  headerText=" الفرق" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{data.different}" />
                        </p:column>
                        <p:column  headerText="المستلم بالمعرض" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{data.deliveryNumber}" />
                        </p:column>
                        <p:column  headerText="المسلم للعميل" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{data.customerNumber}" />
                        </p:column>


                        <p:summaryRow>
                            <p:column colspan="2" style="text-align:right">
                                <h:outputText value="Total "/>
                            </p:column>
                            <p:column>
                                <h:outputText value="#{summitionItemReportMB.sumFactoryNumberTotal}"/>
                            </p:column>
                            <p:column>
                                <h:outputText value="#{summitionItemReportMB.sumSendNumberTotal}"/>
                            </p:column>
                            <p:column>
                                <h:outputText value="#{summitionItemReportMB.sumDifferentTotal}"/>
                            </p:column>
                            <p:column>
                                <h:outputText value="#{summitionItemReportMB.sumDeliveryNumberTotal}"/>
                            </p:column>
                            <p:column>
                                <h:outputText value="#{summitionItemReportMB.sumCustomerNumberTotal}"/>
                            </p:column>
                        </p:summaryRow>
                        
                        
                        <p:columnGroup type="footer">
                            <p:row>
                                <p:column colspan="2" style="text-align:right;border-radius: 0px" footerText="#{userData.userDDs['TOTAL']}  :" />
                                <p:column  >
                                    <f:facet name="footer">
                                        <p:inputNumber
                                            value="#{summitionItemReportMB.sumFactoryNumberTotal}" />
                                    </f:facet>
                                </p:column>
                                
                                <p:column  >
                                    <f:facet name="footer">
                                        <p:inputNumber
                                            value="#{summitionItemReportMB.sumSendNumberTotal}" />
                                    </f:facet>
                                </p:column>
                                <p:column  >
                                    <f:facet name="footer">
                                        <p:inputNumber
                                            value="#{summitionItemReportMB.sumDifferentTotal}" />
                                    </f:facet>
                                </p:column>
                                
                             
                                
                                <p:column  >
                                    <f:facet name="footer">
                                        <p:inputNumber
                                            value="#{summitionItemReportMB.sumDeliveryNumberTotal}" />
                                    </f:facet>
                                </p:column>
                                
                                <p:column  >
                                    <f:facet name="footer">
                                        <p:inputNumber
                                            value="#{summitionItemReportMB.sumCustomerNumberTotal}" />
                                    </f:facet>
                                </p:column>


                            </p:row>
                        </p:columnGroup>
                        
                    </p:dataTable>









                    <div class="ui-g-12 ui-md-6">
                        <p:commandButton class="printButton"  icon="fa fa-fw fa-print"
                                         onclick="form.target = '_blank'" ajax="false"
                                         value="#{userData.userDDs['PRINT']}"
                                         actionListener="#{summitionItemReportMB.exportPDF(actionEvent)}"/>
                    </div>

                </p:fieldset>
            </h:form>
        </h:body>
    </ui:define>
</ui:composition>
