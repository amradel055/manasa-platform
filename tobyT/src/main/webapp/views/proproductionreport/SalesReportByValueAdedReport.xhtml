<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">
        <h:body>

            <h:form dir="RTL" style="margin-right: 20px" id="form" >
                <p:fieldset  legend="بيان الفواتير حسب الضريبة " id="stages"  style=" position: relative">
                    <p:messages id="messages" showDetail="true" closable="true"/> 

                    <div class="ui-g-6 ui-xl-6">
                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">

                                <p:autoComplete style="width:85%" id="gallary_from" 
                                                dropdown="true"
                                                converter="#{autoComplete.invInventoryDTOConverter}"
                                                value="#{salesReportByValueAdedReportMB.salesReportByValueAded.gallerySelected}" 
                                                var="gallaryFrom"
                                                itemLabel="#{gallaryFrom}"
                                                itemValue="#{gallaryFrom}" 
                                                forceSelection="true" 
                                                completeMethod="#{autoComplete.completeGallaryDTO}" >
                                </p:autoComplete>
                            </div>
                            <div class="ui-g-6 ui-xl-6">
                                <p:outputLabel style="width: 50px;margin-right: 1%" value="معرض"/>

                            </div>
                        </div>

                    </div>

                    <div class="ui-g-6 ui-xl-6">
                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">

                                <p:calendar style="width: 50%"  id="dateFrom"
                                            value="#{salesReportByValueAdedReportMB.salesReportByValueAded.dateFrom}"
                                            pattern="dd/MM/yyyy"  showButtonPanel="true" >

                                </p:calendar>
                            </div>
                            <div class="ui-g-6 ui-xl-6">

                                <p:outputLabel style="width: 50px"  value="من تاريخ" />



                            </div>
                        </div>

                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">
                                <p:inputText value="#{salesReportByValueAdedReportMB.dayHijriFrom}" /> يوم
                                <p:inputText value="#{salesReportByValueAdedReportMB.monthHijriFrom}" />  شهر
                                <p:inputText value="#{salesReportByValueAdedReportMB.yearHijriFrom}" />  سنة
                                <p:commandButton     class="saveButton" id="excuteFrom" 
                                                     value="تنفيذ" 
                                                     icon="fa fa-fw fa-save"
                                                     action="#{salesReportByValueAdedReportMB.convertDateFrom()}"
                                                     update="dateFrom"
                                                     />
                            </div>
                            <div class="ui-g-6 ui-xl-6">
                                <p:outputLabel style="width: 50px"  value="من تاريخ هجري" />
                            </div>
                        </div>
                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">
                                <p:calendar style="width: 50%"  id="dateFrom1"
                                            value="#{salesReportByValueAdedReportMB.salesReportByValueAded.dateTo}"
                                            pattern="dd/MM/yyyy"  showButtonPanel="true" >

                                </p:calendar>

                            </div>
                            <div class="ui-g-6 ui-xl-6">

                                <p:outputLabel style="width: 50px"  value="الى تاريخ" />



                            </div>
                        </div>

                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">
                                <p:inputText value="#{salesReportByValueAdedReportMB.dayHijriTo}" /> يوم
                                <p:inputText value="#{salesReportByValueAdedReportMB.monthHijriTo}" />  شهر
                                <p:inputText value="#{salesReportByValueAdedReportMB.yearHijriTo}" />  سنة
                                <p:commandButton     class="saveButton" id="excuteTo" 
                                                     value="تنفيذ" 
                                                     icon="fa fa-fw fa-save"
                                                     action="#{salesReportByValueAdedReportMB.convertDateTo()}"
                                                     update="dateFrom1"
                                                     />
                            </div>
                            <div class="ui-g-6 ui-xl-6">
                                <p:outputLabel style="width: 50px"  value="إلى تاريخ هجري" />
                            </div>
                        </div>


                    </div>

                </p:fieldset>
                <div class="ui-g-12 ui-xl-12">

                    <p:commandButton     class="saveButton" id="saveB" 
                                         value="بحث" 
                                         icon="fa fa-fw fa-save"
                                         action="#{salesReportByValueAdedReportMB.search()}"
                                         update="table messages"
                                         >

                    </p:commandButton>
                    <h:commandLink  class="sdcreenimg">  
                        <p:graphicImage name="/img/excel.jpg" width="24"/>  
                        <p:dataExporter type="xls"
                                        target="table" 
                                        fileName="بيان الفواتير حسب الضريبة "
                                        postProcessor="#{salesReportByValueAdedReportMB.postProcessXLS}" />  
                    </h:commandLink> 

                </div>
                <p:fieldset  legend="البيانات"   style="margin-bottom:20px">
                    <p:dataTable  id="table"
                                  var="data"
                                  value="#{salesReportByValueAdedReportMB.salesReportByValueAdedList}"
                                  draggableColumns="true"
                                  paginator="true"
                                  widgetVar="data" 
                                  rowIndexVar="index" 
                                  rows="30"
                                  emptyMessage="EMPTY_TABLE"
                                  >

                        <p:column headerText="اسم المعرض" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{data.galleryName}" />
                        </p:column>
                        <p:column headerText="قبل الضريبة" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{data.totalBeforeTax}" />
                        </p:column>
                        <p:column headerText="بعد الضريبة" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{data.totalAfterTax}" />
                        </p:column>
                        <p:column headerText="بالضريبة" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{data.tax}" />
                        </p:column>

                    </p:dataTable>
                    <div class="ui-g-12 ui-md-6">
                        <p:commandButton class="printButton"  icon="fa fa-fw fa-print"
                                         onclick="form.target = '_blank'" ajax="false"
                                         value="#{userData.userDDs['PRINT']}"
                                         actionListener="#{salesReportByValueAdedReportMB.exportPDF(actionEvent)}"/>
                    </div>

                </p:fieldset>
            </h:form>
        </h:body>
    </ui:define>
</ui:composition>
