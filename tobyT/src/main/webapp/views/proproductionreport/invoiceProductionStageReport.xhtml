<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />
        <link rel="stylesheet" href="https://ZulNs.github.io/libs/calendar.css"/>
        <script type="text/javascript" src="https://ZulNs.github.io/libs/hijri-date.js"></script>
        <script type="text/javascript" src="https://ZulNs.github.io/libs/calendar.js"></script>
        <h:body>

            <h:form dir="RTL" style="margin-right: 20px" id="form" >
                <p:fieldset  legend="بيان مراحل وموظفين الفواتير" id="stages"  style=" position: relative">
                    <p:messages id="messages" showDetail="true" closable="true"/> 


                    <div class="ui-g-6 ui-xl-6">
                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">

                                <p:outputLabel  value="#{invoiceProductionStagesReportMB.invoiceMovementReport.deliveryDate}" />

                            </div>
                            <div class="ui-g-6 ui-xl-6">

                                <p:outputLabel  value="تاريخ التسليم للطيار" />



                            </div>
                        </div>
                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">

                                <p:outputLabel   value="#{invoiceProductionStagesReportMB.invoiceMovementReport.galaryDate}" />

                            </div>
                            <div class="ui-g-6 ui-xl-6">

                                <p:outputLabel   value="تاريخ الاستلام بالمعرض" />


                            </div>
                        </div>
                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">
                                <p:outputLabel  value="#{invoiceProductionStagesReportMB.invoiceMovementReport.clientDate}" />
                            </div>
                            <div class="ui-g-6 ui-xl-6">
                                <p:outputLabel  value="تاريخ التسليم للعميل" />
                            </div>
                        </div>
                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">
                                <p:outputLabel  value="#{invoiceProductionStagesReportMB.invoiceMovementReport.inventoryName}" />
                            </div>
                            <div class="ui-g-6 ui-xl-6">
                                <p:outputLabel  value="اسم المعرض" />
                            </div>
                        </div>
                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">


                            </div>
                            <div class="ui-g-6 ui-xl-6">


                                <p:commandButton     class="saveButton" id="saveB" 
                                                     value="بحث" 
                                                     icon="fa fa-fw fa-save"
                                                     action="#{invoiceProductionStagesReportMB.search()}"
                                                     update="table messages"
                                                     >

                                </p:commandButton>
                                <h:commandLink  class="sdcreenimg">  
                                    <p:graphicImage name="/img/excel.jpg" width="24"/>  
                                    <p:dataExporter type="xls"
                                                    target="table" 
                                                    fileName="بيان مراحل وموظفين الفواتير"
                                                    postProcessor="#{invoiceProductionStagesReportMB.postProcessXLS}" />  
                                </h:commandLink> 


                            </div>
                        </div>

                    </div>
                    <div class="ui-g-6 ui-xl-6">
                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">

                                <h:inputText value="#{invoiceProductionStagesReportMB.printProductionDTO.fromInvInvoice}" >
                                    <p:ajax update="@form"  process="@form"     event="blur"  listener="#{invoiceProductionStagesReportMB.findInvoiceDate()}" />
                                </h:inputText>

                            </div>
                            <div class="ui-g-6 ui-xl-6">
                                <p:outputLabel style="width: 50px;margin-right: 1%" value="رقم الفاتورة"/>
                            </div>
                        </div>

                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">
                                <p:calendar style="width: 50%"  id="dateFrom"
                                            value="#{invoiceProductionStagesReportMB.printProductionDTO.fromDate}"
                                            pattern="dd/MM/yyyy"  showButtonPanel="true" >

                                </p:calendar>

                            </div>
                            <div class="ui-g-6 ui-xl-6">


                                <p:outputLabel style="width: 50px"  value="من تاريخ" />


                            </div>
                        </div>
                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">
                                <p:inputText value="#{invoiceProductionStagesReportMB.dayHijriFrom}" /> يوم
                                <p:inputText value="#{invoiceProductionStagesReportMB.monthHijriFrom}" />  شهر
                                <p:inputText value="#{invoiceProductionStagesReportMB.yearHijriFrom}" />  سنة
                                <p:commandButton     class="saveButton" id="excuteFrom" 
                                                     value="تنفيذ" 
                                                     icon="fa fa-fw fa-save"
                                                     action="#{invoiceProductionStagesReportMB.convertDateFrom()}"
                                                     update="dateFrom"
                                                     />
                            </div>
                            <div class="ui-g-6 ui-xl-6">
                                <p:outputLabel style="width: 50px"  value="من تاريخ هجري" />
                            </div>
                        </div>
                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">
                                <p:calendar style="width: 50%"  id="dateTo"
                                            value="#{invoiceProductionStagesReportMB.printProductionDTO.toDate}"
                                            pattern="dd/MM/yyyy"  showButtonPanel="true" >

                                </p:calendar>

                            </div>
                            <div class="ui-g-6 ui-xl-6">


                                <p:outputLabel style="width: 50px"  value="الى تاريخ" />


                            </div>
                        </div>

                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">
                                <p:inputText value="#{invoiceProductionStagesReportMB.dayHijriTo}" /> يوم
                                <p:inputText value="#{invoiceProductionStagesReportMB.monthHijriTo}" />  شهر
                                <p:inputText value="#{invoiceProductionStagesReportMB.yearHijriTo}" />  سنة
                                <p:commandButton     class="saveButton" id="excuteTo" 
                                                     value="تنفيذ" 
                                                     icon="fa fa-fw fa-save"
                                                     action="#{invoiceProductionStagesReportMB.convertDateTo()}"
                                                     update="dateTo"
                                                     />
                            </div>
                            <div class="ui-g-6 ui-xl-6">
                                <p:outputLabel style="width: 50px"  value="إلى تاريخ هجري" />
                            </div>
                        </div>

                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">

                                <p:outputLabel style="width: 50px"  value="#{invoiceProductionStagesReportMB.invoiceMovementReport.clientName}" />

                            </div>
                            <div class="ui-g-6 ui-xl-6">

                                <p:outputLabel style="width: 50px"  value="اسم العميل" />



                            </div>
                        </div> 
                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">
                                <p:outputLabel   value="#{invoiceProductionStagesReportMB.invoiceMovementReport.factoryDate}" />


                            </div>
                            <div class="ui-g-6 ui-xl-6">

                                <p:outputLabel  value="تاريخ الاستلام بالمشغل" />



                            </div>
                        </div>

                    </div>



                </p:fieldset>
                <p:fieldset  legend="البيانات"   style="margin-bottom:20px">
                    <p:dataTable  id="table"
                                  var="data"
                                  value="#{invoiceProductionStagesReportMB.invoiceProductionStagesReports}"
                                  draggableColumns="true"
                                  paginator="true"
                                  widgetVar="data" 
                                  rowIndexVar="index" 
                                  emptyMessage="EMPTY_TABLE"
                                  sortBy="#{data.invInvoice}"
                                  rows="20"
                                  >
                        <p:headerRow>
                            <p:column colspan="1" style="width: 15vh;font-size: 2vh;border-radius: 0px;" >
                                <h:outputText value="عدد الثوب" />
                            </p:column>
                            <p:column colspan="5" style="width: 15vh;font-size: 2vh;border-radius: 0px;" >
                                <h:outputText value="#{data.number}" />
                            </p:column>
                        </p:headerRow>
                        <p:column headerText="#" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText 
                                value="#{index + 1}" />
                        </p:column>
                        <p:column headerText="التاريخ" style="width: 13vh;text-align: center!important;font-size: 2vh">
                            <h:outputText value="#{data.date}">
                                <f:convertDateTime pattern="dd/MM/yyyy hh:mm:ss" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="اسم الصنف" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{data.productName}" />
                        </p:column>
                        <p:column headerText="الكمية" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{data.quantity}" />
                        </p:column>
                        <p:column headerText="المرحلة" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{data.stage}" />
                        </p:column>
                        <p:column headerText="الموظف" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{data.empName}" />
                        </p:column>



                    </p:dataTable>
                    <div class="ui-g-12 ui-md-6">
                        <p:commandButton class="printButton"  icon="fa fa-fw fa-print"
                                         onclick="form.target = '_blank'" ajax="false"
                                         value="#{userData.userDDs['PRINT']}"
                                         actionListener="#{invoiceProductionStagesReportMB.exportPDF(actionEvent)}"/>
                    </div>
                </p:fieldset>

            </h:form>
            <script type="text/javascript">
                var pickedTxt = document.getElementById('picked-text'),
                        pickBtn = document.getElementById('pick-button'),
                        datepicker = new Calendar();
                document.getElementById('datepicker').appendChild(datepicker.getElement());
                datepicker.getElement().style.marginTop = '10px';

                datepicker.callback = function () {
                    pickedTxt.value = datepicker.getDate().getDateString();
                    pickedTxt.selectionStart = 0;
                    pickedTxt.selectionEnd = pickedTxt.value.length;
                    pickedTxt.focus();
                };

                datepicker.onHide = function () {
                    pickBtn.style.display = 'inline-block';
                };

                function pickADate() {
                    pickBtn.style.display = 'none';
                    datepicker.show();
                }
            </script>
        </h:body>
    </ui:define>
</ui:composition>
