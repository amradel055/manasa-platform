<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">
        <h:body>
            <h:form dir="RTL" style="margin-right: 20px" id="form" >
                <p:fieldset  legend=" فواتير المصنع حسب اخر مرحلة" id="stages"  style=" position: relative">
                    <p:messages id="messages" showDetail="true" closable="true"/> 
                    <div class="ui-g-6 ui-xl-6">
                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">
                                <p:selectCheckboxMenu id="gallary_From" value="#{proProductionTransactionFactoryLastMB.proProductionTransactionFactoryView.gallerySelectedList}" 
                                                      converter="#{proProductionTransactionFactoryLastMB.gallaryDTOConverters}"
                                                      label="المعرض" style="width: 15rem"
                                                      filter="true" filterMatchMode="startsWith" panelStyle="width: 15rem" scrollHeight="250">
                                    <f:selectItems value="#{proProductionTransactionFactoryLastMB.gallaryLists}" 
                                                   var="gallary"
                                                   itemLabel="#{gallary}"
                                                   itemValue="#{gallary}"/>
                                </p:selectCheckboxMenu>
                            </div>
                            <div class="ui-g-6 ui-xl-6">
                                <p:outputLabel style="width: 50px;margin-right: 1%" value="المعرض"/>
                            </div>
                        </div>
                    </div>
                    <div class="ui-g-6 ui-xl-6">
                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">
                                <p:calendar style="width: 50%"  id="dateFrom"
                                            value="#{proProductionTransactionFactoryLastMB.proProductionTransactionFactoryView.date}"
                                            pattern="dd/MM/yyyy"  showButtonPanel="true" >
                                </p:calendar>
                            </div>
                            <div class="ui-g-6 ui-xl-6">
                                <p:outputLabel style="width: 50px"  value=" من تاريخ" />
                            </div>
                        </div>

                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">
                                <p:inputText value="#{proProductionTransactionFactoryLastMB.dayHijriFrom}" /> يوم
                                <p:inputText value="#{proProductionTransactionFactoryLastMB.monthHijriFrom}" />  شهر
                                <p:inputText value="#{proProductionTransactionFactoryLastMB.yearHijriFrom}" />  سنة
                                <p:commandButton     class="saveButton" id="excuteFrom" 
                                                     value="تنفيذ" 
                                                     icon="fa fa-fw fa-save"
                                                     action="#{proProductionTransactionFactoryLastMB.convertDateFrom()}"
                                                     update="dateFrom"
                                                     />
                            </div>
                            <div class="ui-g-6 ui-xl-6">
                                <p:outputLabel style="width: 50px"  value="من تاريخ هجري" />
                            </div>
                        </div>

                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">
                                <p:calendar style="width: 50%"  id="dateTo"
                                            value="#{proProductionTransactionFactoryLastMB.proProductionTransactionFactoryView.dateTo}"
                                            pattern="dd/MM/yyyy"  showButtonPanel="true" >
                                </p:calendar>
                            </div>
                            <div class="ui-g-6 ui-xl-6">
                                <p:outputLabel style="width: 50px"  value=" الى تاريخ" />
                            </div>
                        </div>
                        <div class="ui-g-12 ui-xl-12">
                            <div class="ui-g-6 ui-xl-6">
                                <p:inputText value="#{proProductionTransactionFactoryLastMB.dayHijriTo}" /> يوم
                                <p:inputText value="#{proProductionTransactionFactoryLastMB.monthHijriTo}" />  شهر
                                <p:inputText value="#{proProductionTransactionFactoryLastMB.yearHijriTo}" />  سنة
                                <p:commandButton     class="saveButton" id="excuteTo" 
                                                     value="تنفيذ" 
                                                     icon="fa fa-fw fa-save"
                                                     action="#{proProductionTransactionFactoryLastMB.convertDateTo()}"
                                                     update="dateTo"
                                                     />
                            </div>
                            <div class="ui-g-6 ui-xl-6">
                                <p:outputLabel style="width: 50px"  value="إلى تاريخ هجري" />
                            </div>
                        </div>

                    </div>
                </p:fieldset>

                <div class="ui-g-12 ui-xl-12">
                    <div class="ui-g-6 ui-xl-6">


                        <p:commandButton     class="saveButton" id="saveB" 
                                             value="بحث" 
                                             icon="fa fa-fw fa-save"
                                             action="#{proProductionTransactionFactoryLastMB.search()}"
                                             update="@form"
                                             >

                        </p:commandButton>
                        <h:commandLink  class="sdcreenimg">  
                            <p:graphicImage name="/img/excel.jpg" width="24"/>  
                            <p:dataExporter type="xls"
                                            target="table" 
                                            fileName="فواتير المصنع حسب اخر حركة لأوامر الشغل"
                                            postProcessor="#{proProductionTransactionFactoryLastMB.postProcessXLS}" />  
                        </h:commandLink> 


                    </div>
                </div>
                <p:fieldset  legend="البيانات"   style="margin-bottom:20px">
                    <p:dataTable  id="table"
                                  var="data"
                                  value="#{proProductionTransactionFactoryLastMB.proProductionItemsTransactionDTOList}"
                                  draggableColumns="true"
                                  paginator="true"
                                  widgetVar="data" 
                                  rowIndexVar="index" 
                                  emptyMessage="EMPTY_TABLE"
                                  rows="20" lazy="true"
                                  >
                        <p:column headerText="#" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText 
                                value="#{index + 1}" />
                        </p:column>
                        <p:column style="width: 8vh;text-align: -webkit-auto;font-size: 1.4vh" 
                                  headerText="رقم الفاتورة"
                                  >
                            <p:outputLabel value="#{data.invoiceSerial}" />
                        </p:column>
                        <p:column style="width: 8vh;text-align: -webkit-auto;font-size: 1.4vh" 
                                  headerText=" اسم المعرض"
                                  >
                            <p:outputLabel value="#{data.galleryName}" />
                        </p:column>

                        <p:column style="width: 10vh;text-align: -webkit-auto;font-size: 1.4vh" 
                                  headerText="اسم العامل "
                                  >
                            <p:outputLabel value="#{data.createdByName}" />


                        </p:column>
                        <p:column style="width: 10vh;text-align: -webkit-auto;font-size: 1.4vh" 
                                  headerText="رقم العامل "
                                  >
                            <p:outputLabel value="#{data.createdByCode}" />


                        </p:column>
                        <p:column style="width: 10vh;text-align: -webkit-auto;font-size: 1.4vh"
                                  headerText="عدد الثياب"
                                  >
                            <p:outputLabel value="#{data.clothNumber}" />


                        </p:column>

                        <p:column style="width: 10vh;text-align: -webkit-auto;font-size: 1.6vh" 
                                  headerText="المرحله"
                                  >
                            <p:outputLabel value="#{data.stageName}" />


                        </p:column>

                        <p:column style="width: 10vh;text-align: -webkit-auto;font-size: 1.6vh"
                                  headerText="تاريخ الشغل"
                                  >
                            <p:outputLabel value="#{data.orderDate}" >
                                <f:convertDateTime type="date" pattern="dd-MM-yyyy"/>
                            </p:outputLabel>
                        </p:column>
                        <p:column style="width: 10vh;text-align: -webkit-auto;font-size: 1.6vh"
                                  headerText="تاريخ الفاتورة"
                                  >
                            <p:outputLabel value="#{data.invoiceDate}" >
                                <f:convertDateTime type="date" pattern="dd-MM-yyyy"/>
                            </p:outputLabel>
                        </p:column>

                    </p:dataTable>
                    <div class="ui-g-12 ui-md-6">
                        <p:commandButton class="printButton"  icon="fa fa-fw fa-print"
                                         onclick="form.target = '_blank'" ajax="false"
                                         value="#{userData.userDDs['PRINT']}"
                                         actionListener="#{proProductionTransactionFactoryLastMB.exportPDF(actionEvent)}"/>
                    </div>


                </p:fieldset>

            </h:form>
        </h:body>
    </ui:define>
</ui:composition>
