<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">
        <h:body>

            <h:form dir="RTL" style="margin-right: 20px" id="form" >
                <p:fieldset  legend=" الفواتير المسجلة اكثر من مرة" id="stages"  style=" position: relative">
                    <p:messages id="messages" showDetail="true" closable="true"/> 

                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">

                            <p:calendar style="width: 50%"  id="dateFrom"
                                        value="#{invoiceRegisteredMoreThanOnceMB.registeredMoreThanOnce.date}"
                                        pattern="dd/MM/yyyy"  showButtonPanel="true" >

                            </p:calendar>
                        </div>
                        <div class="ui-g-6 ui-xl-6">

                            <p:outputLabel style="width: 50px"  value="من تاريخ" />



                        </div>
                    </div>

                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">

                            <p:inputText style="width: 35%!important" id="ad1" value="#{invoiceRegisteredMoreThanOnceMB.registeredMoreThanOnce.serial}"
                                         />

                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 50px;margin-right: 1%" value="رقم الفاتورة"/>

                        </div>
                    </div>




                </p:fieldset>
                <div class="ui-g-12 ui-xl-12" >

                    <p:commandButton     class="saveButton" id="saveB" 
                                         value="بحث" 
                                         icon="fa fa-fw fa-save"
                                         action="#{invoiceRegisteredMoreThanOnceMB.search()}"
                                         update="table messages"
                                         >

                    </p:commandButton>


                    <h:commandLink  class="sdcreenimg">  
                        <p:graphicImage name="/img/excel.jpg" width="24"/>  
                        <p:dataExporter type="xls"
                                        target="table" 
                                        fileName=" الفواتير المسجلة اكثر من مرة "
                                        postProcessor="#{invoiceRegisteredMoreThanOnceMB.postProcessXLS}" />  
                    </h:commandLink> 

                </div>
                <p:fieldset  legend="البيانات"   style="margin-bottom:20px">
                    <p:dataTable  id="table"
                                  var="data"
                                  value="#{invoiceRegisteredMoreThanOnceMB.list}"
                                  draggableColumns="true"
                                  paginator="true"
                                  widgetVar="data" 
                                  rowIndexVar="index" 
                                  rows="10"
                                  emptyMessage="EMPTY_TABLE"
                                  >

                        <p:column headerText="رقم الفاتورة" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{data.serial}" />
                        </p:column>
                        <p:column headerText=" تاريخ الاستلام" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{data.receivedDate}" />
                        </p:column>
                        <p:column headerText=" اسم المرحلة" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{data.stageName}" />
                        </p:column>
                        <p:column headerText="اسم الصنف" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{data.itemName}" />
                        </p:column>
                        <p:column headerText=" عدد مرات الشغل" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{data.workNumber}" />
                        </p:column>
                        <p:column headerText="العدد بالفاتورة" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{data.originNumber}" />
                        </p:column>
                        <p:column headerText=" الفرق" style="width: 10vh;text-align: center!important;font-size: 1.8vh">
                            <h:outputText value="#{data.subtraction}" />
                        </p:column>

                        <p:column headerText="#{userData.userDDs['TRANSACTION']}"  style="width: 10vh;font-size: 1.8vh;text-align: center;border-radius: 0px;">

                            <p:commandButton update="@form" 
                                             class="sdeleteButtons"
                                             icon="fa fa-remove" 
                                             style="background-color: red;border-radius: 3px;"
                                             title="#{userData.userDDs['DELETE']}" 
                                             action="#{invoiceRegisteredMoreThanOnceMB.delete()}" >
                                <f:setPropertyActionListener value="#{data}" target="#{invoiceRegisteredMoreThanOnceMB.registeredMoreThanOnceSelected}" />
                            </p:commandButton>
                        </p:column>

                    </p:dataTable>
                    <div class="ui-g-12 ui-md-6">
                        <p:commandButton class="printButton"  icon="fa fa-fw fa-print"
                                         onclick="form.target = '_blank'" ajax="false"
                                         value="#{userData.userDDs['PRINT']}"
                                         actionListener="#{invoiceRegisteredMoreThanOnceMB.exportPDF(actionEvent)}"/>
                    </div>

                </p:fieldset>
            </h:form>
        </h:body>
    </ui:define>
</ui:composition>
