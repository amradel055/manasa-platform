                            <div class="ui-g-12 ui-md-6">

                                        <p:calendar id="dateFrom"

                            <div class="ui-g-12 ui-md-6">

                                        <p:selectOneMenu style="width: 37.5%; margin-top: 5px;"

                                            <f:selectItem itemLabel="#{userData.userDDs['POSTPONE']}" itemValue="1" />

                                            <p:ajax update="dueDate" />
                                        </p:selectOneMenu>

                                </h:panelGroup>

                            </div>
                            <div class="ui-g-12 ui-md-6" >

                                <h:panelGroup id="pdueDate" >

                                        <p:outputLabel for="dueDate" style="width: 95px;" value="#{userData.userDDs['DUE_DATE']}"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:calendar id="dueDate" value="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.dueDate}"
                                                    disabled="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.id != null or invPurchaseInvoiceFormDTOMB.invInvoiceDTO.paymentType ne 1}"
                                                    pattern="dd/MM/yyyy"
                                                    style="width:50%"/>
                                    </h:panelGroup>

                                </h:panelGroup>
                            </div>
                            <div class="ui-g-12 ui-md-6">
                                <h:panelGroup>

                                        <p:outputLabel style="width: 100px;margin-right: 6%;" value="#{userData.userDDs['SUPPLIER']}"/>
                                    </h:panelGroup> 

                                    <p:inputText readonly="true" style="width: 36.5%"  
                                                 id="purchIdVal20" rendered="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.loadedSerial  ne null}" 
                                                 value="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.organizationSiteId}" />

                                    <h:panelGroup>
                                        <p:autoComplete style="width:37%!important" 
                                                        dropdown="true"
                                                        converter="#{invPurchaseInvoiceFormDTOMB.organizationSiteDTOConvertor}"
                                                        value="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.organizationSiteId}"
                                                        rendered="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.loadedSerial  eq null}" 
                                                        var="supplier"
                                                        itemLabel="#{supplier}" 
                                                        itemValue="#{supplier}" 
                                                        forceSelection="true" 
                                                        completeMethod="#{invPurchaseInvoiceFormDTOMB.completeSuppllier}" 
                                                        disabled="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.id != null}">

                                            <p:ajax update="@form"
                                                    process="@form"
                                                    event="itemSelect"
                                                    listener="#{invPurchaseInvoiceFormDTOMB.putCurrency()}" />


                                        </p:autoComplete>
                                    </h:panelGroup> 

                                </h:panelGroup>
                            </div>
                            <div class="ui-g-12 ui-md-6">

                                <h:panelGroup>

                                        <p:outputLabel style="width: 95px; margin-right: 6%;" value="#{userData.userDDs['SUPP_INVOI_NO']}"/>

                                        <p:inputText value="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.supplierInvoiceNumber}" 
                                                     disabled="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.id != null}"
                                                     style="width: 37.5%!important"/>
                                    </h:panelGroup>
                                </h:panelGroup>

                            </div>





                            <div class="ui-g-12 ui-md-6">

                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel style="width: 100px;margin-right: 6%;" value="#{userData.userDDs['PURCHASES_DELEGATE']}"/>
                                    </h:panelGroup> 
                                    <p:inputText readonly="true" style="width: 36.5%"  
                                                 id="purchIdVal21" rendered="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.loadedSerial  ne null}" 
                                                 value="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.invDelegatorId}" />
                                    <h:panelGroup>
                                        <p:autoComplete style="width:37%!important " 
                                                        dropdown="true"
                                                        converter="#{invPurchaseInvoiceFormDTOMB.invDelegatorDTOConvertor}"
                                                        value="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.invDelegatorId}"
                                                        rendered="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.loadedSerial  eq null}" 
                                                        var="purchasePerson"
                                                        itemLabel="#{purchasePerson}" 
                                                        itemValue="#{purchasePerson}" 
                                                        forceSelection="true" 
                                                        completeMethod="#{invPurchaseInvoiceFormDTOMB.completeDelegatorPurchase}"
                                                        disabled="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.id != null}">

                                        </p:autoComplete>
                                    </h:panelGroup> 
                                </h:panelGroup>
                            </div>
                            <div class="ui-g-12 ui-md-6">

                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel  style="width: 95px; margin-right: 6%;" value="#{userData.userDDs['BILL_SUPPLIER_DATE']}"/>
                                    </h:panelGroup>

                                    <h:panelGroup>
                                        <p:calendar pattern="dd/MM/yyyy" 
                                                    value="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.supplierInvoiceDate}"
                                                    disabled="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.id != null}"
                                                    style="width: 37%">
                                        </p:calendar>
                                    </h:panelGroup>
                                </h:panelGroup>
                            </div>
                            <div class="ui-g-12 ui-md-6">

                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel style="width: 100px;margin-right: 6%;" value="#{userData.userDDs['SINGLE_COST_CENTER']}"/>                        
                                    </h:panelGroup>

                                    <h:panelGroup>
                                        <p:autoComplete style="width:37%" 
                                                        dropdown="true"
                                                        converter="#{invPurchaseInvoiceFormDTOMB.costCenterConverter}"
                                                        value="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.costCenterId}"

                                                        var="CostCenter"
                                                        itemLabel="#{CostCenter}" 
                                                        itemValue="#{CostCenter}" 
                                                        forceSelection="true" 
                                                        completeMethod="#{invPurchaseInvoiceFormDTOMB.completeCostCenters}" 
                                                        disabled="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.id != null}">


                                        </p:autoComplete>
                                    </h:panelGroup>
                                </h:panelGroup>

                            </div>
                            <div class="ui-g-12 ui-md-6">
                                <h:panelGroup>

                                    <h:panelGroup>
                                        <p:outputLabel style="width: 100px;margin-right: 6%;" value="#{userData.userDDs['ADMIN_UNIT']}"/>
                                    </h:panelGroup>

                                    <h:panelGroup>
                                        <p:autoComplete style="width:36.5%"
                                                        dropdown="true" 
                                                        converter="#{invPurchaseInvoiceFormDTOMB.adminUnitConverter}"
                                                        value="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.adminUnitId}"

                                                        var="adminUnitId"
                                                        itemLabel="#{adminUnitId}" 
                                                        itemValue="#{adminUnitId}" 
                                                        forceSelection="true" 
                                                        completeMethod="#{invPurchaseInvoiceFormDTOMB.completeAdminUnits}"
                                                        disabled="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.id != null}" >


                                        </p:autoComplete>
                                    </h:panelGroup>
                                </h:panelGroup>
                            </div>
                            <div class="ui-g-12 ui-md-6">

                                <h:panelGroup id="currencyPanelGroup">

                                    <h:panelGroup>
                                        <p:outputLabel  style="width: 100px; margin-right: 6%;" value="#{userData.userDDs['CURRENCY']}"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:inputText readonly="true" style="width: 37%" 
                                                     value="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.currencyId}"/>
                                    </h:panelGroup>


                                </h:panelGroup>
                            </div>
                            <div class="ui-g-12 ui-md-6">

                                <h:panelGroup >
                                    <h:panelGroup>
                                        <p:outputLabel style="width: 100px;margin-right: 6%;" value="#{userData.userDDs['TREASURY']}"/>
                                    </h:panelGroup> 

                                    <h:panelGroup>
                                        <p:autoComplete style="width:37%" 
                                                        dropdown="true"
                                                        converter="#{invPurchaseInvoiceFormDTOMB.glBankConverter}"
                                                        value="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.glBankId}"
                                                        id="glbank1"
                                                        var="bank"
                                                        itemLabel="#{bank}" 
                                                        itemValue="#{bank}" 
                                                        forceSelection="true" 
                                                        completeMethod="#{invPurchaseInvoiceFormDTOMB.completeGlBank}"
                                                        disabled="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.id != null}"
                                                        >

                                        </p:autoComplete>
                                    </h:panelGroup> 
                                </h:panelGroup>
                            </div>
                            <div class="ui-g-12 ui-md-6">
                                <h:panelGroup>
                                    <h:panelGroup id="exchangeRate">
                                        <p:outputLabel style="width: 100px; margin-right: 6%;" value="#{userData.userDDs['RATE']}"/>
                                    </h:panelGroup>

                                    <h:panelGroup id="CurrencyRate">
                                        <p:outputLabel value="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.rate}"/>
                                    </h:panelGroup>
                                </h:panelGroup>

                            </div>


                            <div class="ui-g-12 ui-md-6">
                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel style="width: 100px;margin-right: 6%;" value="#{userData.userDDs['DEPOSITORY']}"/>
                                    </h:panelGroup>

                                    <h:panelGroup>
                                        <p:autoComplete style="width:37%"  id="inventoryDTO" widgetVar="inventoryDTO"
                                                        dropdown="true"
                                                        converter="#{invPurchaseInvoiceFormDTOMB.invInventoryDTOConverter}"
                                                        value="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.invInventoryId}"
                                                        var="inventoryDTO" 
                                                        itemLabel="#{inventoryDTO}" 
                                                        itemValue="#{inventoryDTO}" 
                                                        forceSelection="true" 
                                                        completeMethod="#{invPurchaseInvoiceFormDTOMB.completeInventory}" 
                                                        disabled="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.id != null}">
                                        </p:autoComplete>
                                    </h:panelGroup>
                                </h:panelGroup>
                            </div>

                            <div class="ui-g-12 ui-md-12">

                                <h:panelGroup rendered="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.loadedSerial  ne null}">
                                    <h:panelGroup>
                                        <p:outputLabel   style="width: 95px; margin-right: 3%;" value="رقم فاتورة التحميل"/>
                                    </h:panelGroup>

                                    <h:panelGroup>
                                        <p:inputText readonly="true" style="width:69%"  value="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.loadedSerial}"
                                                     />
                                    </h:panelGroup>
                                </h:panelGroup>
                            </div>

                            <div class="ui-g-12 ui-md-12" style="margin-top:-14px;">

                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel style="width: 95px; margin-right: 3%;" value="#{userData.userDDs['NOTE']}"/>
                                    </h:panelGroup>

                                    <h:panelGroup>
                                        <p:inputText style="width:69%"  value="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.remarks}"
                                                     disabled="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.id != null}"/>
                                    </h:panelGroup>
                                </h:panelGroup>
                            </div>
                        </h:panelGroup>
                    </div>
                </div>

            </p:fieldset>

                <p:fieldset id="fieldSetId" legend="#{userData.userDDs['DETA_PURCHASE_INV']}"   style="margin:2% 0">


                <p:dataTable id="invPurchaseInvoiceDetailsTable"
                             widgetVar="invPurchaseInvoiceDetailsTable"
                             style="margin-bottom:20px"
                             
                             var="invPurchaseInvoiceDetailsTable"
                             rowIndexVar="index" 
                             dir="rtl" 
                             emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                             editable="true"
                             editMode="cell"
                             selectionMode="single"
                             sortBy="#{1}"
                             rowKey="#{invPurchaseInvoiceDetailsTable.index}"
                             selection="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.invPurchaseInvoiceDetailsSelected}"
                             value="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.invPurchaseInvoiceDetailList}" >

                    <f:facet name="header" >
                        <p:commandButton  id="addnew"
                                          class="saddButton"
                                          icon="fa fa-plus"
                                          title="#{userData.userDDs['ADD']}" 
                                          disabled="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.id != null or invPurchaseInvoiceFormDTOMB.invInvoiceDTO.loadedSerial  ne null}"
                                          actionListener="#{invPurchaseInvoiceFormDTOMB.addInvDetail()}" 
                                          update=":form:fieldSetId"  
                                          oncomplete="PrimeFaces.focus('form:invPurchaseInvoiceDetailsTable:'+#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.invPurchaseInvoiceDetailList.size()}+':invItemNameIn')"
                                          immediate="true"
                                          ajax="true"
                                          style="float:right"/>

                        <p:outputPanel>
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" onkeyup="PF('invPurchaseInvoiceDetailsTable').filter()" style="width:150px" />
                        </p:outputPanel>
                    </f:facet>

                    <p:column headerText="#" style="width: 4vh;text-align:center;border-radius: 0px" >
                        <h:outputText value="#{index + 1}"  />
                    </p:column>

                    <p:column style="width: 13vh;text-align: -webkit-auto;border-radius: 0px" id="itemName" headerText="#{userData.userDDs['ITEM']}" 
                              filterBy="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail}" 
                              filterMatchMode="contains" 
                              sortBy="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail}"
                              filterable="false">
                        <p:outputLabel value="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail}" 
                                       rendered="#{invPurchaseInvoiceDetailsTable.isEdit}" />
                        <p:autoComplete id="invItemNameIn"  
                                        rendered="#{not invPurchaseInvoiceDetailsTable.isEdit}" 
                                        style="width:100%"
                                        converter="#{invPurchaseInvoiceFormDTOMB.itemsBarcodesDetailsViewConverter}"
                                        value="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail}"
                                        maxResults="5"
                                        var="item"
                                        itemLabel="#{item}" 
                                        itemValue="#{item}" 
                                        forceSelection="true" 
                                        completeMethod="#{invPurchaseInvoiceFormDTOMB.completeItemsDatas}" >
                            <p:ajax update=" unitvalue length paintColor QuantityT WeightT costTt discountT netId totalQuantity totalWeight  totalNet  form:totalActualWeight form:totalNetAfterDiscount   form:totalWithTaxValue form:taxvalue"
                                    event="itemSelect" listener="#{invPurchaseInvoiceFormDTOMB.validateItems(invPurchaseInvoiceDetailsTable)}" />



                        </p:autoComplete>            
                    </p:column>

                    <p:column  style="width: 13vh;text-align: -webkit-auto;border-radius: 0px" id="Unit"

                               filterBy="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail.unitName}" 
                               filterMatchMode="contains" 
                               sortBy="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail.unitName}"
                               filterable="false"
                               headerText="#{userData.userDDs['UNIT_NUMBER']}">
                        <p:inputText id="unitvalue" readonly="true" 
                                     disabled="true"
                                     value="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail.unitName}" style="width: 95%" />  

                    </p:column>

                    <p:column style="width: 12vh;text-align: -webkit-auto;border-radius: 0px" id="tall" headerText="الطول"
                              rendered="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.companyActivity eq 'Alumetal'}"
                              filterBy="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail.length}" 
                              filterMatchMode="contains" 
                              sortBy="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail.length}"
                              filterable="false" >
                        <p:outputLabel style="width:99%" 
                                       id="length"  
                                       value="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail.length}"/>
                    </p:column>

                    <p:column style="width: 12vh;text-align: -webkit-auto;border-radius: 0px" id="color" headerText="اللون"
                              rendered="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.companyActivity eq 'Alumetal'}"
                              filterBy="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail.paintColorName}" 
                              filterMatchMode="contains" 
                              sortBy="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail.paintColorName}"
                              filterable="false" >
                        <p:outputLabel style="width:99%" 
                                       id="paintColor"  
                                       value="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail.paintColorName}"/>
                    </p:column>


                    <p:column style="width: 13vh;text-align: -webkit-auto;border-radius: 0px"
                              id="Quantity"
                              headerText="#{userData.userDDs['NUMBER']}"
                              filterBy="#{invPurchaseInvoiceDetailsTable.quantity}" 
                              filterMatchMode="contains" 
                              sortBy="#{invPurchaseInvoiceDetailsTable.quantity}"
                              filterable="false">

                        <p:inputText id="QuantityT"  
                                     value="#{invPurchaseInvoiceDetailsTable.quantity}" 

                                     style="width:95%">
                            <p:ajax listener="#{invPurchaseInvoiceFormDTOMB.validateQuantityColum(invPurchaseInvoiceDetailsTable)}" 
                                    update="netId totalQuantity totalWeight  totalNet form:totalNetAfterDiscount form:totalActualWeight form:totalWithTaxValue form:taxvalue  "/>
                        </p:inputText>        

                    </p:column>

                    <p:column style="width: 13vh;text-align: -webkit-auto;border-radius: 0px" rendered="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.companyActivity eq 'Alumetal'}"
                              id="Weight"
                              headerText="#{userData.userDDs['WEIGHT']}"
                              filterBy="#{invPurchaseInvoiceDetailsTable.weight}" 
                              filterMatchMode="contains" 
                              sortBy="#{invPurchaseInvoiceDetailsTable.weight}"
                              filterable="false">

                        <p:inputNumber id="WeightT" decimalPlaces="3"
                                       value="#{invPurchaseInvoiceDetailsTable.weight}"  
                                       style="width:100%">
                            <p:ajax listener="#{invPurchaseInvoiceFormDTOMB.updateSummition()}" update="netId totalQuantity  totalWeight totalNet form:totalActualWeight form:totalNetAfterDiscount form:taxvalue form:totalWithTaxValue"/>
                        </p:inputNumber>
                    </p:column>

                    <p:column style="width: 12vh;text-align: -webkit-auto;border-radius: 0px" id="COST" headerText="#{userData.userDDs['PRICE']}"
                              filterBy="#{invPurchaseInvoiceDetailsTable.cost}" 
                              filterMatchMode="contains" 
                              sortBy="#{invPurchaseInvoiceDetailsTable.cost}"
                              filterable="false">
                        <p:inputText id="costTt" 
                                     value="#{invPurchaseInvoiceDetailsTable.cost}"

                                     style="width:95%">
                            <p:ajax listener="#{invPurchaseInvoiceFormDTOMB.validatePriceColumn(invPurchaseInvoiceDetailsTable)}" 
                                    update="netId totalQuantity  totalWeight totalNet form:totalActualWeight form:totalNetAfterDiscount form:totalWithTaxValue form:taxvalue"/>
                        </p:inputText>       
                    </p:column>

                    <p:column style="width: 14vh;text-align: -webkit-auto;border-radius: 0px" id="DISCOUNT" headerText="#{userData.userDDs['DISCOUNT']}">
                        <p:inputText id="discountT" 
                                     value="#{invPurchaseInvoiceDetailsTable.discount}" 
                                     disabled="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail == null}"
                                     style="width:70%!important;display: inline!important">
                            <p:ajax listener="#{invPurchaseInvoiceFormDTOMB.validateDiscountColumn(invPurchaseInvoiceDetailsTable)}"
                                    update="discountT netId totalQuantity totalWeight totalNet form:totalActualWeight form:totalNetAfterDiscount  form:taxvalue form:totalWithTaxValue  "/>
                        </p:inputText>  
                        <p:outputLabel value="%"  style="display: inline!important"  />
                    </p:column>


                    <p:column style="width: 13vh;text-align: -webkit-auto;border-radius: 0px" id="net" headerText="#{userData.userDDs['TOTAL']}" 
                              filterBy="#{invPurchaseInvoiceDetailsTable.net}" 
                              filterMatchMode="contains" 
                              sortBy="#{invPurchaseInvoiceDetailsTable.net}"
                              filterable="false">
                        <p:outputLabel id="netId" value="#{invPurchaseInvoiceDetailsTable.net}"   />
                    </p:column>

                        <p:column colspan="3" style="text-align:right">
                            <h:outputText style="text-align:right" value="#{userData.userDDs['TOTAL']}  :" />
                        </p:column>
                        <p:column>
                            <h:outputText id="totalQuantity" value="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.totalQuatity}"/>
                        </p:column>
                        <p:column>
                            <h:outputText id="totalWeight" value="#{invPurchaseInvoiceFormDTOMB.invInvoiceDTO.totalWeight}"/>
