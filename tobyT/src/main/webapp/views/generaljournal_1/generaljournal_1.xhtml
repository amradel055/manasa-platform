<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns="http://www.w3.org/1999/xhtml" >
    <script src="http://code.jquery.com/jquery-latest.min.js"></script>

    <ui:define name="content">
        <h:form id="form" dir="rtl" style="margin-right: 20px">
            <div class="ui-g-12 ui-xl-12">
                <div class="ui-g-6 ui-xl-6">
                    <p:inputText 
                        value="#{generalJournalBean_new.serial}"
                        style="width:50%">
                        <p:ajax  update="@form"  listener="#{generalJournalBean_new.search()}" event="blur" />
                    </p:inputText>
                </div>
                <div class="ui-g-6 ui-xl-6">
                    <p:outputLabel  style="width: 100px;" value="رقم القيد "/>

                </div>
            </div>
            <p:fieldset legend="#{userData.userDDs['GENERAL_JOURNAL']}" style="margin-bottom: 20px">
                <div>
                    <p:messages autoUpdate="true"  id="msg" showDetail="true" closable="true" rendered="false" />
                </div>
                <div >
                    <p:commandButton class="scloseButton" style="float: left;margin-top: 3px" icon="fa fa-fw fa-backward"    action="exit"  immediate="true"/>
                </div>

                <script>
                    window.thisPage = window.thisPage || {};
                    window.thisPage.isDirty = false;

                    window.thisPage.closeEditorWarning = function (event) {
                        if (window.thisPage.isDirty)
                            return 'It looks like you have been editing something' +
                                    ' - if you leave before saving, then your changes will be lost.'
                        else
                            return undefined;
                    };

                    $("form").on('keyup', 'textarea', 'itemSelect', // You can use input[type=text] here as well.
                            function () {
                                window.thisPage.isDirty = true;
                            });

                    $("form").on('keyup', 'input[type=text]', 'select', // You can use input[type=text] here as well.
                            function () {
                                window.thisPage.isDirty = true;
                            });

                    $("form").submit(function () {
                        QC.thisPage.isDirty = false;
                    });
                    window.onbeforeunload = window.thisPage.closeEditorWarning;
                </script>

                <p:dialog modal="true"
                          position='center,center'
                          minHeight="40" minWidth="100"
                          header="نحذير" widgetVar="dlg1"  
                          dynamic="true">

                    <h:outputText value="هل تريد تجاهل التغييرات"  />

                    <p:panelGrid></p:panelGrid>


                    <p:commandButton  class="" title="#{userData.userDDs['NO']}" 
                                      value="#{userData.userDDs['NO']}" 
                                      action="#{generalJournalBean_new.changeRowSelectedCancel()}"
                                      icon="fa fa-fw fa-cancel" 
                                      update="@form"
                                      onclick="PF('dlg1').hide();" />

                    <p:commandButton  class="ssaveButton" id="saveIm"
                                      title="#{userData.userDDs['YES']}" 
                                      value="#{userData.userDDs['YES']}"
                                      action ="#{generalJournalBean_new.changeRowSelectedOk()}"
                                      icon="fa fa-fw fa-save"
                                      validateClient="true" 
                                      onclick="PF('dlg1').hide();"
                                      update="@form" />
                </p:dialog> 

                <p:dataTable 
                    draggableColumns="true" 
                    widgetVar="generalJournaltable" 
                    id="generallist"  
                    rowIndexVar="index" 
                    rows="5"
                    var="general" 
                    dir="#{userData.dir}" 
                    rowKey="#{general.index}" 
                    value="#{generalJournalBean_new.generaDTOlList}"                    
                    paginator="true" 
                    paginatorTemplate="{CurrentPageReport} {FirstPageLink}
                    {PreviousPageLink} {PageLinks} {NextPageLink}
                    {LastPageLink} {RowsPerPageDropdown}"
                    emptyMessage="#{userData.userDDs['EMPTY_TABLE']}" 
                    selection="#{generalJournalBean_new.selectedGeneralJournal}" 
                    selectionMode="single" >

                    <p:ajax  event="rowSelect"   listener="#{generalJournalBean_new.onRowSelect}"  update="@form"/>


                    <f:facet name="header" class="col-md-12">
                        <p:commandButton class="saddButton" id="b2" icon="fa fa-plus"
                                         title="#{userData.userDDs['ADD']}"
                                         actionListener="#{generalJournalBean_new.add}"
                                         style="float:right" update=":form" 
                                         rendered="#{(userData.userScreens['generaljournal_1'].add or userData.isAdmin)
                                                     and (generalJournalBean_new.glYearDTOSelection.openning eq 0 or generalJournalBean_new.glYearDTOSelection.openning eq null)}" 
                                         oncomplete="PF('generalJournaltable').addRow()" />



                        <p:selectOneMenu id="year" value="#{generalJournalBean_new.glYearDTOSelection}"
                                         converter="#{generalJournalBean_new.glYearDTOConverter}" 
                                         style="float:right;width: 20%!important;color:#fff">

                            <p:ajax listener="#{generalJournalBean_new.loadgeneraljournalList()}" update="form" />

                            <f:selectItems value="#{generalJournalBean_new.glYearDTOList}" 
                                           var="year" itemLabel="#{year.name}"
                                           itemValue="#{year}"/> 
                        </p:selectOneMenu>
                        <p:selectOneMenu filter="true" filterMatchMode="contains" 
                                         style="width: 20%!important;float: left;color: #fff!important"
                                         value="#{generalJournalBean_new.accountsSystemSettings.accountPrinting}"  
                                         >
                            <f:selectItem itemLabel="#{userData.userDDs['HORIZONTAL_PRINT']}" itemValue="HORIZONTAL" />
                            <f:selectItem itemLabel="#{userData.userDDs['VERTICAL_PRINT']}" itemValue="VERTICAL" />

                        </p:selectOneMenu>
                    </f:facet>

                    <p:column headerText="#{userData.userDDs['GENERAL_NUMBER']}" style="width: 5vh;font-size: 1.4vh;text-align: "  filterStyle="display:none" sortBy="#{general.serial}"  filterBy="#{general.serial}"  filterMatchMode="contains">
                        <h:outputText style="font-size: 1.2vh" value="#{general.serial}" />

                    </p:column>
                    <p:column style="width: 8vh;font-size: 1.4vh;text-align: center" filterFunction="#{generalJournalBean_new.filterByDate}" filterStyle="display:none" sortBy="#{general.generalData}"  filterBy="#{general.generalData}"  filterMatchMode="contains" headerText=" #{userData.userDDs['GENERAL_DATE']} " >
                        <h:outputText   style="font-size: 1.2vh;"  id="datee" value="#{general.generalData}" rendered="#{not general.markEdit}" > 
                            <f:convertDateTime   id="datee"  pattern="yyyy-MM-dd"   /> 
                        </h:outputText>   
                        <p:calendar  style="display:block;width: 100% " id="date"  value="#{general.generalData}" pattern="dd/MM/yyyy" rendered="#{general.markEdit}" />                        
                    </p:column>
                    <p:column  style="width:12vh;font-size: 1.4vh;text-align: center"  filterStyle="display:none" sortBy="#{general.generalType.name}" filterBy="#{general.generalType.name}"  filterMatchMode="contains" headerText="#{userData.userDDs['GERNAL_TYPE']}">
                        <h:outputText value="#{general.generalType.name}" rendered="#{not general.markEdit}"/>
                        <p:selectOneMenu id="acc" filter="true" filterMatchMode="contains" value="#{generalJournalBean_new.selectedDocumentsType}"  rendered="#{general.markEdit}" style="width:100%" >
                            <p:ajax listener="#{generalJournalBean_new.ondocumentsTypesChange}" update="generaldocument" />
                            <f:selectItems value="#{generalJournalBean_new.documentsTypes}"  var="doc" itemLabel="#{doc.name}" itemValue="#{doc.id}"/>
                        </p:selectOneMenu>
                    </p:column>
                    <p:column style="width: 8vh;font-size: 1.4vh;text-align: center" filterStyle="display:none" sortBy="#{general.generalDecument}" filterBy="#{general.generalDecument}"  filterMatchMode="contains" headerText="#{userData.userDDs['GERNAL_DECUMENT']}">
                        <h:outputText id="generaldocument" value="#{generalJournalBean_new.generalDocument}" rendered="#{ general.markEdit}"/>
                        <h:outputText value="#{general.generalDecument}" rendered="#{ not general.markEdit}"/>
                    </p:column>

                    <p:column style="width: 8vh;font-size: 1.4vh;text-align: center"  headerText=" #{userData.userDDs['ENTRY_ENTRANCE']}" >
                        <h:outputText value="#{general.created_by.name}" rendered="#{ not general.markEdit}"/>
                    </p:column>

                    <p:column style="width: 18vh;font-size: 1.4vh;text-align: center" headerText="#{userData.userDDs['GERNAL_STATEMENT']}" filterStyle="display:none" filterBy="#{general.generalStatement}" filterMatchMode="contains">
                        <h:outputText value="#{general.generalStatement}" rendered="#{not general.markEdit}" style="width: 100%"/>
                        <p:inputTextarea style="width: 100%" rows="5" cols="33" value="#{general.generalStatement}" autoResize="true" rendered="#{general.markEdit}" />
                    </p:column>

                    <p:column style="width: 10vh;font-size: 1.4vh;text-align: center" >
                        <p:commandButton   class="ssaveButton" update="@form" 
                                           title="#{userData.userDDs['SAVE']}"
                                           rendered="#{general.markEdit  
                                                       and (userData.userScreens['generaljournal_1'].add 
                                                       or userData.isAdmin)}"
                                           action="#{generalJournalBean_new.save()}" 
                                           icon="fa fa-fw fa-save"  disabled="#{general.post_flag eq TRUE or generalJournalBean_new.glYearDTOSelection.openning eq 1 }">
                            <f:setPropertyActionListener value="#{general}" target="#{generalJournalBean_new.selectedGeneralJournal}" />

                        </p:commandButton>

                        <p:commandButton class="sreloadButton"
                                         update="@form" title="#{userData.userDDs['RELOAD']}" 
                                         rendered="#{general.markEdit  
                                                     and (userData.userScreens['generaljournal_1'].add or userData.isAdmin)}"
                                         action="#{generalJournalBean_new.reload()}" icon="fa fa-fw fa-undo"  disabled="#{general.post_flag eq TRUE or generalJournalBean_new.glYearDTOSelection.openning eq 1 }">
                            <f:setPropertyActionListener value="#{general}" target="#{generalJournalBean_new.selectedGeneralJournal}" />
                        </p:commandButton>

                        <p:commandButton  class="seditButton" update="@form" title="#{userData.userDDs['EDIT']}" 
                                          action="#{generalJournalBean_new.edit()}"
                                          icon="fa fa-fw fa-edit" 
                                          rendered="#{not general.markEdit  
                                                      and (userData.userScreens['generaljournal_1'].edit 
                                                      or userData.isAdmin)}"  disabled="#{general.post_flag 
                                                      or generalJournalBean_new.glYearDTOSelection.openning eq 1 or general.userModifyAbility eq true}">
                            <f:setPropertyActionListener value="#{general}" target="#{generalJournalBean_new.selectedGeneralJournal}" />
                        </p:commandButton>

                        <p:commandButton   class="sdeleteButton" update="@form" title="#{userData.userDDs['DELETE']}" 
                                           action="#{generalJournalBean_new.delete}" icon="fa fa-remove" rendered="#{not general.markEdit  and (userData.userScreens['generaljournal_1'].delete or userData.isAdmin)}" disabled="#{general.post_flag or generalJournalBean_new.glYearDTOSelection.openning eq 1 or general.userModifyAbility eq true}">
                            <f:setPropertyActionListener value="#{general}" target="#{generalJournalBean_new.selectedGeneralJournal}" />
                            <p:confirm header="#{userData.userDDs['COFIGRATION']}" message="#{userData.userDDs['ARE_YOU_SURE']}" icon="ui-icon-alert" />
                        </p:commandButton>

                        <p:commandButton class="scobyButton" update="@form" title="نسخ"
                                         action="#{generalJournalBean_new.repeatGeneralJournal()}" 
                                         icon="fa fa-fw fa-copy"  disabled="#{general.post_flag 
                                                                              or generalJournalBean_new.glYearDTOSelection.openning eq 1}"
                                         rendered="#{not general.markEdit  and (userData.userScreens['generaljournal_1'].delete or userData.isAdmin)}">
                            <f:setPropertyActionListener value="#{general}" target="#{generalJournalBean_new.selectedGeneralJournal}" />
                            <p:confirm header="#{userData.userDDs['COFIGRATION']}" message="هل انت متاكد من نسخ الكل" icon="ui-icon-alert" />

                        </p:commandButton>

                        <p:commandButton   class="sprintButton" ajax="false" onclick="form.target = '_blank'" 
                                           icon="fa fa-fw fa-print"
                                           actionListener="#{generalJournalBean_new.exportPDF}" 
                                           rendered="#{not general.markEdit  and (userData.userScreens['generaljournal_1'].delete or userData.isAdmin)}"/>

                        <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                            <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                            <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                        </p:confirmDialog>
                    </p:column>



                </p:dataTable>
            </p:fieldset>

            <p:fieldset id="generalDetailsFeildSet" legend="#{userData.userDDs['GENERAL_JOURNAL_DETAILS']}">
                <div class="col-xs-12">
                    <p:messages autoUpdate="true"  id="msg2" showDetail="true" closable="true" rendered="true" />
                </div>

                <p:dataTable id="generalDetails" 
                             draggableColumns="true" 
                             widgetVar="generalJournalDetailstable"                         

                             rowIndexVar="index"
                             var="gendetails" 
                             dir="rtl" 
                             selection="#{generalJournalBean_new.details}"
                             rowKey="#{gendetails.id} #{gendetails.index}" 
                             value="#{generalJournalBean_new.detailsList}" 
                             stickyHeader="#{generalJournalBean_new.stickyHeader}"

                             emptyMessage="#{userData.userDDs['EMPTY_TABLE']}">

                    <p:ajax event="rowSelectCheckbox"
                            process="@form"
                            listener="#{generalJournalBean_new.onRowSelectDetails}"
                            update="form"/>

                    <p:ajax event="rowUnselectCheckbox"
                            process="@form"
                            listener="#{generalJournalBean_new.onRowUnselect()}"
                            update="form"/>

                    <f:facet name="header">
                        <p:commandButton id="b2" icon="fa fa-plus"
                                         class="saddButton"
                                         title="#{userData.userDDs['ADD']}"
                                         actionListener="#{generalJournalBean_new.adddetails}"
                                         style="float:right" 
                                         update="generalDetails" ajax="true" 
                                         rendered="#{generalJournalBean_new.glYearDTOSelection.openning eq 0 
                                                     or generalJournalBean_new.glYearDTOSelection.openning eq null}"
                                         disabled="#{generalJournalBean_new.selectedGeneralJournal.post_flag or generalJournalBean_new.modifyJournalAbility}"/>



                        <p:commandButton class="deleteButton" id="b4" 
                                         value="#{userData.userDDs['DELETE']}" 
                                         style="float:left;width: 60px"
                                         rendered="#{(userData.userScreens['generaljournal_1'].add or userData.isAdmin) and (generalJournalBean_new.glYearDTOSelection.openning eq 0 or generalJournalBean_new.glYearDTOSelection.openning eq null)}" 
                                         action="#{generalJournalBean_new.deleteAll}" icon="fa fa-fw fa-remove" update="@form"
                                         disabled="#{generalJournalBean_new.selectedGeneralJournal.post_flag or  generalJournalBean_new.modifyJournalAbility}">

                            <p:confirm header="#{userData.userDDs['COFIGRATION']}" message="#{userData.userDDs['ARE_YOU_SURE']}" icon="ui-icon-alert" />
                        </p:commandButton>


                        <p:outputPanel >
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large"/>
                            <p:inputText id="globalFilter" onkeyup="PF('generalJournalDetailstable').filter()" style="width:150px" />
                        </p:outputPanel>
                    </f:facet>

                    <p:column  selectionMode="multiple" toggleable="false" style="width:.5vh;background-color: #fff;padding-left:2.5vh;padding-right:0px"  />

                    <p:column style="width: .5vh;font-size: 1.4vh;text-align: center" headerText="#" >
                        <h:outputText value="#{gendetails.serial}" style="font-size: 1.2vh" />
                    </p:column>

                    <p:column style="width: 8vh;font-size: 1.2vh;text-align: center"
                              filterStyle="display:none" 
                              filterBy="#{gendetails.glACCOUNTId.accNumber}"  filterable="true"
                              filterMatchMode="contains" 
                              headerText="#{userData.userDDs['ACCOUNT']}">

                        <h:outputText style="font-size: 1.1vh;font-weight:bold"
                                      value="#{gendetails.glACCOUNTId.accNumber} #{gendetails.glACCOUNTId.name}" 
                                      rendered="#{not gendetails.markEdit}"/>                    

                        <p:selectOneMenu style="width: 100%"
                                         filter="true" filterMatchMode="contains"
                                         id="acc" value="#{gendetails.glACCOUNTId.id}"
                                         rendered="#{gendetails.markEdit}">

                            <f:selectItem itemLabel="#{userData.userDDs['CHOOSE']}" 
                                          itemValue="" 
                                          noSelectionOption="true" />
                            <f:selectItems value="#{generalJournalBean_new.glAccounts}" 
                                           var="acc" 
                                           itemLabel="#{acc}" 
                                           itemValue="#{acc.id}"/>

                        </p:selectOneMenu>
                    </p:column>

                    <p:column id="com2" filterStyle="display:none" 
                              style="width: 5vh;font-size: 1.4vh;text-align: center"

                              filterBy="#{gendetails.costCenterId}"
                              filterMatchMode="contains" 
                              headerText="#{userData.userDDs['SINGLE_COST_CENTER']}">

                        <h:outputText
                            value="#{gendetails.costCenterId}"
                            rendered="#{not gendetails.markEdit}"/>

                        <p:selectOneMenu style="width:70px; float:right"
                                         filter="true" filterMatchMode="contains" 
                                         id="cost1" 
                                         value="#{gendetails.costCenterId.id}" 
                                         rendered="#{ gendetails.markEdit}">

                            <p:ajax listener="#{generalJournalBean_new.onCostCenterChange()}" />

                            <f:selectItem itemLabel="#{userData.userDDs['CHOOSE']}" id="cost" 
                                          itemDisabled="#{not generalJournalBean_new.disableCC}"
                                          itemValue="#{-1}" noSelectionOption="true" />

                            <f:selectItems value="#{generalJournalBean_new.costCenterList}" 
                                           var="cost" itemLabel="#{cost}"
                                           itemValue="#{cost.id}"/>
                        </p:selectOneMenu>
                    </p:column>

                    <p:column filterStyle="display:none"
                              style="width: 8vh;font-size: 1.4vh;text-align: center"

                              filterBy="#{gendetails.adminUnitId.code}" 
                              filterMatchMode="contains" 
                              headerText="#{userData.userDDs['ADMIN_UNIT']}">

                        <h:outputText style="width: 100%"
                                      value="#{gendetails.adminUnitId.code}"
                                      rendered="#{not gendetails.markEdit}"/> 
                        <p:selectOneMenu filter="true" 
                                         filterMatchMode="contains"
                                         id="com1"  
                                         value="#{gendetails.adminUnitId.id}" 
                                         style="width:65px"
                                         rendered="#{gendetails.markEdit}">
                            <p:ajax listener="#{generalJournalBean_new.onAdminUnitChange()}" />
                            <f:selectItem itemLabel="#{userData.userDDs['CHOOSE']}" id="com"
                                          itemDisabled="#{not generalJournalBean_new.disableAdminU}"
                                          itemValue="#{-1}" noSelectionOption="true"  />

                            <f:selectItems value="#{generalJournalBean_new.glAdminunitlist}"  
                                           var="Admin" itemLabel="#{Admin.name}"
                                           itemValue="#{Admin.id}"/>
                        </p:selectOneMenu>
                    </p:column>

                    <p:column style="width: 6vh;font-size: 1.4vh;text-align: center" filterStyle="display:none" 

                              filterBy="#{gendetails.debitAmount}" 
                              filterMatchMode="contains"
                              headerText="#{userData.userDDs['DEBIT_AMOUNT']}">

                        <h:outputText style="width: 90%"
                                      value="#{gendetails.debitAmount}" rendered="#{not gendetails.markEdit}"/>

                        <p:inputNumber style="width:70%"
                                       id="debit" 
                                       value="#{gendetails.debitAmount}"
                                       valueChangeListener="#{generalJournalBean_new.debitRender}"
                                       disabled="#{generalJournalBean_new.debitDisabled}" 
                                       rendered="#{ gendetails.markEdit}" 
                                       >
                            <p:ajax update="credit" />
                        </p:inputNumber>
                    </p:column>

                    <p:column style="width: 6vh;font-size: 1.4vh;text-align: center"  filterStyle="display:none"
                              filterBy="#{gendetails.creditamount}" 
                              filterMatchMode="contains" 
                              headerText="#{userData.userDDs['CREDIT_AMOUNT']}">

                        <h:outputText   value="#{gendetails.creditamount}"

                                        rendered="#{not gendetails.markEdit}"/>

                        <p:inputNumber 
                            style="width:100%"
                            id="credit"
                            value="#{gendetails.creditamount}" 
                            disabled="#{generalJournalBean_new.creditDisabled}"
                            valueChangeListener="#{generalJournalBean_new.creditRender}" 
                            rendered="#{gendetails.markEdit}"  >
                            <p:ajax update="debit" />

                        </p:inputNumber>
                    </p:column>

                    <p:column style="width: 15vh;font-size: 1.4vh;text-align: center"  headerText="#{userData.userDDs['DESCRIBTION']}">
                        <h:outputText style="width: 100%" value="#{gendetails.discribtion}" rendered="#{not gendetails.markEdit}"/>
                        <p:inputText style="width: 100%"  onclick="myFunction()" id="Desc" value="#{gendetails.discribtion}" rendered="#{gendetails.markEdit}"/>
                    </p:column>

                    <p:columnGroup type="footer">
                        <p:row>
                            <p:column   footerText=""  style="width:2vh;background-color: #fff;padding-left:2.5vh;padding-right:0px"  />
                            <p:column   footerText="" /> 
                            <p:column   footerText="" /> 
                            <p:column   footerText="#{userData.userDDs['TOTAL']} " />


                            <p:column   footerText="" />
                            <p:column   footerText="#{generalJournalBean_new.summaryCreditString}"  style="font-size: 1.2vh !important"/>
                            <p:column   footerText="#{generalJournalBean_new.summaryDebitString}" style="font-size: 1.2vh !important" />
                            <p:column   footerText="#{userData.userDDs['DIFFERENCE']}" />
                            <p:column   footerText="#{generalJournalBean_new.difference}" />

                        </p:row>
                    </p:columnGroup>

                    <p:column style="width: 10vh;font-size: 1.4vh;text-align: center" >

                        <p:commandButton  class="ssaveButton" id="b5" icon="fa fa-check " 
                                          title="#{userData.userDDs['SAVE']}"  
                                          action="#{generalJournalBean_new.confirm}"
                                          update="generalDetails"
                                          rendered="#{(gendetails.markEdit)
                                                      and ( generalJournalBean_new.glYearDTOSelection.openning eq 0 
                                                      or generalJournalBean_new.glYearDTOSelection.openning eq null)}" 
                                          disabled="#{generalJournalBean_new.selectedGeneralJournal.post_flag or generalJournalBean_new.modifyJournalAbility}" >
                            <f:setPropertyActionListener value="#{gendetails}"
                                                         target="#{generalJournalBean_new.detail}"  />
                        </p:commandButton>

                        <p:commandButton   class="sreloadButton" update="generalDetails" title="#{userData.userDDs['RELOAD']}" 
                                           rendered="#{(gendetails.markEdit) and (generalJournalBean_new.glYearDTOSelection.openning eq 0 or generalJournalBean_new.glYearDTOSelection.openning eq null)}"
                                           action="#{generalJournalBean_new.reloadDetails()}" icon="fa fa-fw fa-undo"   
                                           disabled="#{generalJournalBean_new.selectedGeneralJournal.post_flag}">
                            <f:setPropertyActionListener value="#{gendetails}" target="#{generalJournalBean_new.detail}" />
                        </p:commandButton>

                        <p:commandButton   class="seditButton"  title="#{userData.userDDs['EDIT']}" 
                                           rendered="#{(not gendetails.markEdit ) and (generalJournalBean_new.glYearDTOSelection.openning eq 0 or generalJournalBean_new.glYearDTOSelection.openning eq null)}"
                                           action="#{generalJournalBean_new.editgeneraldetails()}" icon="fa fa-fw fa-edit" 
                                           update="generalDetails" 
                                           disabled="#{(gendetails.markDisable) or generalJournalBean_new.selectedGeneralJournal.post_flag or generalJournalBean_new.modifyJournalAbility}" >
                            <f:setPropertyActionListener value="#{gendetails}" target="#{generalJournalBean_new.detail}"  />
                        </p:commandButton>

                        <p:commandButton class="saddButton" id="b7" icon="fa fa-plus" title="#{userData.userDDs['ADD']}" 
                                         rendered="#{(not gendetails.markEdit) and( generalJournalBean_new.glYearDTOSelection.openning eq 0 or generalJournalBean_new.glYearDTOSelection.openning eq null)}"
                                         actionListener="#{generalJournalBean_new.adddetails}" 
                                         update=":form:generalDetails" ajax="true" 
                                         disabled="#{(gendetails.markDisable) or generalJournalBean_new.selectedGeneralJournal.post_flag or generalJournalBean_new.modifyJournalAbility}" />


                        <p:commandButton  class="sreloadButton" update=":form" title="نسخ"
                                          action="#{generalJournalBean_new.repeatGeneralJournalDetail}" 
                                          icon="fa fa-fw fa-copy" ajax="true" 
                                          rendered="#{(not gendetails.markEdit) and (generalJournalBean_new.glYearDTOSelection.openning eq 0 or generalJournalBean_new.glYearDTOSelection.openning eq null)}"                                       
                                          disabled="#{(gendetails.markDisable) or generalJournalBean_new.selectedGeneralJournal.post_flag or generalJournalBean_new.modifyJournalAbility}">
                            <f:setPropertyActionListener value="#{gendetails}" target="#{generalJournalBean_new.journalDetailSelected}" />
                        </p:commandButton>

                    </p:column >

                    <f:facet name="footer"  >
                        <p:commandButton  icon="fa fa-plus"
                                          class="saddButton"

        <script>
            function insert(str, index, value) {
                return str.substr(index) + value + str.substr(0, index);
            }
            ;

            $(document).on('keydown', function (event) {
                if (event.keyCode === 32) {

                    var elem = document.getElementById(event.target.id);
                    var insertPos = elem.selectionEnd;

                    event.target.value = insert(event.target.value, insertPos, ' ');
                }
            });
