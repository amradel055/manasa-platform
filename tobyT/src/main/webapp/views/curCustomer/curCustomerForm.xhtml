<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">



        <h:form style="margin-right: 20px" id="form" dir="#{userData.dir}">
            <p:fieldset id="whole" legend="تسجيل بيانات العميل" style="margin-bottom:20px">

                <div class="col-xs-12">
                    <p:messages id="curmsg" showDetail="true" rendered="true" closable="true"/>   
                </div>

                <div  id="firstLine" class="ui-g-12 ui-g-nopad">
                    <div class="ui-g">


                        <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText style="width: 49%!important" value="#{glBankFromMB.glBankEntity.name}"/>

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 65px" value="اسم العميل رباعي"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:calendar id="dateFrom"  locale="es"
                                                pattern="dd/MM/yyyy"
                                                style="width:50%!important"/>

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 65px" value="تاريخ الميلاد "/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText style="width: 49%!important" />

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 65px" value="سن العميل"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText style="width: 49%!important" />

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 65px" value="رقم التليفون"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText style="width: 49%!important" />

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 65px" value="رقم البطاقة"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText style="width: 49%!important" />

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 65px" value="رقم الباسبور"/>

                                </div>
                            </div>



                        </div>

                        <div class="ui-g-6 ui-xl-6">

                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText style="width: 49%!important" />

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 65px" value="محل السكن كما هو متواجد بالبطاقة"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText style="width: 49%!important" />

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 65px" value="الوظيفة"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:selectOneRadio id="console" >
                                        <f:selectItem itemLabel="متزوج" itemValue="1"/>
                                        <f:selectItem itemLabel="أعزب" itemValue="2"/>
                                    </p:selectOneRadio>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <h5 class="p-mt-0">الحالة الاجتماعية</h5>
                                </div>

                            </div>
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:autoComplete id="GlAccount_ID" 
                                                    style="width: 85%" 
                                                    dropdown="true"
                                                    value=""

                                                    var="p"
                                                    itemLabel="#{p}" 
                                                    itemValue="#{p}" 
                                                    forceSelection="true"  >


                                    </p:autoComplete>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 65px"
                                                   value="المحافظة"
                                                   for="GlAccount_ID"/>
                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:autoComplete id="Currency_ID" 
                                                    style="width: 85%" 
                                                    dropdown="true"
                                                    value=""

                                                    var="p"
                                                    itemLabel="#{p}" 
                                                    itemValue="#{p}" 
                                                    forceSelection="true" >



                                    </p:autoComplete>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 65px"
                                                   value="المراكز الطبية"
                                                   for="Currency_ID"/>
                                </div>
                            </div>

                        </div>

                    </div>
                </div>


                <panelGrid class="centerButtons col-md-12" style='display: block; text-align: center;'>

                    <h:panelGroup>

                        <p:commandButton  class="saveButton" id="saveB" 
                                          style="margin: 0 auto;text-align: center;display: inline-block;"
                                          title="#{userData.userDDs['SAVE']}" 
                                          value="#{userData.userDDs['SAVE']}" 
                                          icon="fa fa-fw fa-save" 
                                          update="@form"
                                          />
                        <p:commandButton value="طباعة" 
                                         type="button" 
                                         icon="fa fa-fw fa-print" 
                                         class="printButton" 
                                         id="printB" 
                                         style="margin: 0 auto;text-align: center;display: inline-block;margin-right: 1%;" 
                                         />

                        <p:blockUI block="form" trigger="saveB" animate="true" >

                            <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                        </p:blockUI> 


                    </h:panelGroup>
                </panelGrid>

            </p:fieldset>



        </h:form>
    </ui:define>
</ui:composition>
