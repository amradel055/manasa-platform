<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />
        <h:form  class='formmargin' id="form" dir="#{userData.dir}">

            <p:fieldset legend="#{userData.userDDs['ADD/DISC_NOTIFI']}" id="whole">
                <div class="ui-g-12 ui-xl-12">
                    <div class="ui-g-6 ui-xl-6">
                        <p:inputText  style="width:35%!important"  required="true" value="#{invNoticeListMB.invNoticeEntity.serial}" />

                    </div>
                    <p:autoComplete style="width:35%!important" 
                                    dropdown="true"
                                    required="true"
                                    converter="#{autoComplete.organizationSiteDTOConvertor}"
                                    value="#{invNoticeListMB.invNoticeEntity.organizationSiteId}"
                                    var="supplier"
                                    itemLabel="#{supplier}" 
                                    itemValue="#{supplier}" 
                                    forceSelection="true" 
                                    completeMethod="#{autoComplete.completeCustomerFrom}">
                    </p:autoComplete>
                        <p:commandButton  
                            update="@form" 
                            class="smsearchButtons"
                            icon="fa fa-fw fa-search-plus"  style="background-color: rgba(63, 81, 181, 0.88);border-radius: 3px;"
                            title="#{userData.userDDs['VIEW']}" 
                            action="#{invNoticeListMB.search()}" >
                        </p:commandButton>
                </div>
                <div>
                    <p:messages id="curmsg" showDetail="true" rendered="true" closable="true"/>   
                </div>
                
                  




                <p:dataTable id="invNotice"
                             draggableColumns="true" 
                             var="invNotice" 
                             widgetVar="bTable" 
                             rowIndexVar="index" 
                             value="#{invNoticeListMB.invNoticeEntityList}" 
                             paginator="true"
                             emptyMessage="#{userData.userDDs['EMPTY_TABLE']}">

                    <f:facet name="header" >
                        <p:commandButton  class="saddButton" icon="fa fa-plus" 
                                          id="addA"
                                          title="#{userData.userDDs['ADD']}"
                                          action="#{invNoticeListMB.goToAdd()}"
                                          style="float:right" 
                                          rendered="#{userData.userScreens['customeraddnotice'].add or userData.isAdmin}"
                                          />

                        <p:blockUI block="form" trigger="addA" animate="true" >

                            <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                        </p:blockUI> 

                        <p:outputPanel  >
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" onkeyup="PF('bTable').filter()" style="width:150px" />
                        </p:outputPanel>
                    </f:facet>

                    <p:column headerText="#" style="width: 5vh;text-align: right;font-size: 1.8vh;border-radius: 0px"  >
                        <p:outputLabel value="#{invNotice.serial}" />
                    </p:column>

                    <p:column style="width: 14vh;text-align: right;font-size: 1.8vh;border-radius: 0px" filterStyle="display:none"
                              filterBy="#{invNotice.organizationSiteId}" 
                              filterMatchMode="contains" 
                              headerText="#{userData.userDDs['CORRES_CUSTO']}"
                              sortBy="#{invNotice.organizationSiteId}"
                              >
                        <p:outputLabel value="#{invNotice.organizationSiteId}" />
                    </p:column>

                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh;border-radius: 0px" filterStyle="display:none"
                              filterBy="#{invNotice.date}" 
                              filterMatchMode="contains" 
                              headerText="#{userData.userDDs['DATEE']}"
                              sortBy="#{invNotice.date}"
                              >
                        <p:outputLabel value="#{invNotice.date}" >
                            <f:convertDateTime type="date" pattern="dd-MM-yyyy"/>
                        </p:outputLabel> 
                    </p:column>

                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh;border-radius: 0px" filterStyle="display:none"
                              filterBy="#{invNotice.value}" 
                              filterMatchMode="contains" 
                              headerText="#{userData.userDDs['AMOUNT']}"
                              sortBy="#{invNotice.value}"
                              >
                        <p:outputLabel value="#{invNotice.value}" />
                    </p:column>

                    <p:column style="width: 14vh;text-align: right;font-size: 1.8vh;border-radius: 0px" filterStyle="display:none"
                              filterBy="#{invNotice.typeName}" 
                              filterMatchMode="contains" 
                              headerText="#{userData.userDDs['TYPE']}"
                              sortBy="#{invNotice.typeName}"
                              >
                        <p:outputLabel value="#{invNotice.typeName}" />
                    </p:column>

                    <p:column style="width: 14vh;text-align: right;font-size: 1.8vh;border-radius: 0px" filterStyle="display:none"
                              filterBy="#{invNotice.remark}" 
                              filterMatchMode="contains" 
                              headerText="#{userData.userDDs['NOTE']}"
                              sortBy="#{invNotice.remark}"
                              >
                        <p:outputLabel value="#{invNotice.remark}" />
                    </p:column>


                    <p:column style="width: 10vh;text-align: center;font-size: 1.8vh;border-radius: 0px" headerText="#{userData.userDDs['TRANSACTION']}">
                        <p:commandButton  class="seditButtons" update="@form" icon="fa fa-fw fa-edit"
                                          title="#{userData.userDDs['EDIT']}" style="background-color: #6a6967;border-radius: 3px;"
                                          action="#{invNoticeListMB.goToEdit()}" 
                                          rendered="#{userData.userScreens['customeraddnotice'].edit or userData.isAdmin}"
                                          >
                            <f:setPropertyActionListener value="#{invNotice}" 
                                                         target="#{invNoticeListMB.invNoticeEntitySelected}" />
                        </p:commandButton>

                        <p:commandButton  class="sdeleteButtons" update="form" 
                                          icon="fa fa-remove" style="background-color: red;border-radius: 3px;"
                                          title="#{userData.userDDs['DELETE']}" 
                                          action="#{invNoticeListMB.delete}"
                                          rendered="#{userData.userScreens['customeraddnotice'].delete or userData.isAdmin}"
                                          >

                            <f:setPropertyActionListener value="#{invNotice}"
                                                         target="#{invNoticeListMB.invNoticeEntitySelected}" />
                            <p:confirm header="Confirmation" message="#{userData.userDDs['ARE_YOU_SURE']}" icon="ui-icon-alert" />
                        </p:commandButton>
                    </p:column>
                </p:dataTable>
                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                    <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                    <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                </p:confirmDialog>

            </p:fieldset>
        </h:form>
    </ui:define>
</ui:composition>
