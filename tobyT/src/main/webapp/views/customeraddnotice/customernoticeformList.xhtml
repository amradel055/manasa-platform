<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"

                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">
        <div class="col-xs-12"> 
            <p:messages id="curmsg" showDetail="true" rendered="true" closable="true"/>   
        </div>
        <h:form class='formmargin' id="form"  enctype="multipart/form-data"  dir="#{userData.dir}">


            <p:fieldset legend="#{userData.userDDs['ADD/DISC_NOTIFI']}">

                <div  id="firstLine" class="ui-g-12 ui-g-nopad">

                    <div class="ui-g">

                        <div class="ui-g-6 ui-xl-6">

                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:fieldset  style="width: 68%;border-radius: 5px">
                                        <p:selectOneRadio  id="console"  value ="#{invNoticeFormMB.invNoticeEntity.type}" >
                                            <f:selectItem itemLabel="اشعار مدين" itemValue="0" />
                                            <f:selectItem itemLabel="#{userData.userDDs['DISC_NOTIF']}" itemValue="1" />
                                            <f:selectItem itemLabel="اشعار دائن" itemValue="4" />
                                        </p:selectOneRadio>
                                    </p:fieldset>
                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">

                                    <p:autoComplete style="width:35%!important" 
                                                    dropdown="true"
                                                    required="true"
                                                    converter="#{autoComplete.organizationSiteDTOConvertor}"
                                                    value="#{invNoticeFormMB.invNoticeEntity.organizationSiteId}"
                                                    rendered="#{invNoticeFormMB.invNoticeEntity.id eq null and ( not invNoticeFormMB.fromInvoice)}"
                                                    var="supplier"
                                                    itemLabel="#{supplier}" 
                                                    itemValue="#{supplier}" 
                                                    forceSelection="true" 
                                                    completeMethod="#{autoComplete.completeCustomerFrom}">
                                        <p:ajax update="@form"
                                                event="itemSelect"
                                                process="@this"
                                                listener="#{invNoticeFormMB.chooseInvoice()}" />
                                    </p:autoComplete>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 85px;" value="#{userData.userDDs['CORRES_CUSTO']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel value="#{invNoticeFormMB.invNoticeEntity.invoiceSerial}" 
                                                   rendered="#{invNoticeFormMB.invNoticeEntity.id ne null}" />

                                    <p:selectOneMenu  id="invoice" style="width:100%"  
                                                      rendered="#{invNoticeFormMB.invNoticeEntity.id eq null}"
                                                      value="#{invNoticeFormMB.invNoticeEntity.invoiceId}">
                                        <f:selectItem itemLabel="اختر الفاتوره "/>
                                        <f:selectItems  var="inninvoice"
                                                        value="#{invNoticeFormMB.glBankTransactionInvoiceViewList}"
                                                        itemLabel="#{inninvoice.serial}"
                                                        itemValue="#{inninvoice.invoiceId}"/>
                                    </p:selectOneMenu>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 85px;" value="الفاتورة"/>

                                </div>
                            </div>
                        </div>



                        <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:calendar required="true"
                                                value="#{invNoticeFormMB.invNoticeEntity.date}"
                                                pattern="dd/MM/yyyy" 
                                                style="width:50%"/>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 50px" value="#{userData.userDDs['DATEE']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText  style="width:35%!important"  required="true" value="#{invNoticeFormMB.invNoticeEntity.amount}" />

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 50px" value="#{userData.userDDs['AMOUNT']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText  style="width:35%!important" value="#{invNoticeFormMB.invNoticeEntity.remarks}" />

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 50px" value="#{userData.userDDs['REMARK']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 50px;margin-right: 1%" value="#{invNoticeFormMB.gallaryDTOSelect}" rendered="#{invNoticeFormMB.fromInvoice}"/>
                                    <p:selectOneMenu id="group" value="#{invNoticeFormMB.gallaryDTOSelect}" rendered="#{not invNoticeFormMB.fromInvoice}"
                                                     converter="#{invNoticeFormMB.gallaryDTOConverters}">
                                        <f:selectItems value="#{invNoticeFormMB.gallaryListSelected}" 
                                                       var="gallary"
                                                       itemLabel="#{gallary}"
                                                       itemValue="#{gallary}" />
                                    </p:selectOneMenu>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 50px;margin-right: 1%" value="المعرض"/>
                                </div>
                            </div>
                        </div>                        
                    </div>
                </div>

                <h:panelGrid  class="col-md-12" columns="1">      

                    <h:panelGroup class="centerButtons"> 
                        <p:commandButton  class="saveButton"
                                          id="saveB" 
                                          title="#{userData.userDDs['SAVE']}" 
                                          value="#{userData.userDDs['SAVE']}" 
                                          action="#{invNoticeFormMB.saveNoticeList()}"
                                          update="form curmsg"/>

                        <p:commandButton  class="newButton" 
                                          id="newN"
                                          ajax="false"
                                          value="#{userData.userDDs['NEW']}" 
                                          title="#{userData.userDDs['NEW']}"
                                          onclick="form.target = ''"  
                                          actionListener="#{invNoticeFormMB.reset()}"/>
                        
                        
                         <p:commandButton  class="saveButton"
                                          id="addAs"
                                          title="#{userData.userDDs['ADD']}"
                                          action="#{invNoticeFormMB.addNotice()}"
                                          value="إضافة" 
                                          update="invNotice"/>
                        


                        <p:commandButton  class="closeButton" 
                                          id="cancel"
                                          title="#{userData.userDDs['BACK']}"
                                          value="#{userData.userDDs['BACK']}" 
                                          action="#{invNoticeFormMB.exit()}"
                                          update="@form"/>

                        <p:blockUI block="form" trigger="saveB" animate="true" >

                            <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                        </p:blockUI> 
                    </h:panelGroup>

                </h:panelGrid>       

            </p:fieldset>

            <p:fieldset legend="#{userData.userDDs['ADD/DISC_NOTIFI']}" id="whole">
                <div>
                    <p:messages id="curmsg" showDetail="true" rendered="true" closable="true"/>   
                </div>
                <p:dataTable id="invNotice"
                             draggableColumns="true" 
                             var="invNotice" 
                             widgetVar="bTable" 
                             rowIndexVar="index" 
                             value="#{invNoticeFormMB.invNoticeList}" 
                             paginator="true"
                             emptyMessage="#{userData.userDDs['EMPTY_TABLE']}">


                    <p:column style="width: 14vh;text-align: right;font-size: 1.8vh;border-radius: 0px" 
                              headerText="المعرض"
                              >
                        <p:outputLabel value="#{invNotice.invInventory}" />
                    </p:column>

                    <p:column style="width: 14vh;text-align: right;font-size: 1.8vh;border-radius: 0px" 
                              headerText="#{userData.userDDs['CORRES_CUSTO']}"
                              >
                        <p:outputLabel value="#{invNotice.organizationSiteId}" />
                    </p:column>

                    <p:column style="width: 14vh;text-align: right;font-size: 1.8vh;border-radius: 0px" 
                              headerText="الفاتورة"
                              >
                        <p:outputLabel value="#{invNotice.invInvoice}" />
                    </p:column>

                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh;border-radius: 0px" 
                              headerText="#{userData.userDDs['DATEE']}"
                              >
                        <p:outputLabel value="#{invNotice.date}" >
                            <f:convertDateTime type="date" pattern="dd-MM-yyyy"/>
                        </p:outputLabel> 
                    </p:column>

                    <p:column style="width: 10vh;text-align: right;font-size: 1.8vh;border-radius: 0px" 
                              headerText="#{userData.userDDs['AMOUNT']}"
                              >
                        <p:outputLabel value="#{invNotice.value}" />
                    </p:column>

                    <p:column style="width: 14vh;text-align: right;font-size: 1.8vh;border-radius: 0px"
                              headerText="#{userData.userDDs['TYPE']}"
                              >
                        <p:outputLabel value="#{invNotice.typeName}" />
                    </p:column>

                    <p:column style="width: 14vh;text-align: right;font-size: 1.8vh;border-radius: 0px" 
                              headerText="#{userData.userDDs['NOTE']}"
                              >
                        <p:outputLabel value="#{invNotice.remark}" />
                    </p:column>


                    <p:column style="width: 10vh;text-align: center;font-size: 1.8vh;border-radius: 0px" headerText="#{userData.userDDs['TRANSACTION']}">
                        
                        <p:commandButton  class="sdeleteButtons" update="form" 
                                          icon="fa fa-remove" style="background-color: red;border-radius: 3px;"
                                          title="#{userData.userDDs['DELETE']}" 
                                          action="#{invNoticeFormMB.deleteNotice()}"
                                          rendered="#{userData.userScreens['customeraddnotice'].delete or userData.isAdmin}"
                                          >

                            <f:setPropertyActionListener value="#{invNotice}"
                                                         target="#{invNoticeFormMB.invNoticeSelected}" />
                            <p:confirm header="Confirmation" message="#{userData.userDDs['ARE_YOU_SURE']}" icon="ui-icon-alert" />
                        </p:commandButton>
                    </p:column>
                </p:dataTable>
                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                    <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                    <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                </p:confirmDialog>

            </p:fieldset>


        </h:form>
    </ui:define>
</ui:composition>
