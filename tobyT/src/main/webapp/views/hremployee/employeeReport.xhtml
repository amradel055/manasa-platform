<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/newTemplate.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <f:event listener="#{userData.authorize}" type="preRenderView" />

        <h:form id="form" dir="#{userData.dir}}" class='formmargin'>
            <div style=" position: absolute;left: 20px">
                <p:commandButton  icon="fa fa-fw fa-home"
                                  title="#{userData.userDDs['HOME']}"
                                  class="smhomeButton"  
                                  style="z-index: 2;

                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;

                                  background: #22323a 50% 50% repeat-x!important;" 
                                  action="exit" />

            </div>
             <p:fieldset  legend="تقرير الموظفين "

                         style=" position: relative">

                <div  id="firstSegment" class="ui-g-12 ui-g-nopad firstset">
                    <div class="ui-g">

                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 75px;margin-right: 6%;" value="من موظف"/>
                                </h:panelGroup> 

                                <h:panelGroup>
                                    <p:selectOneMenu id="EVENTFrom" style="width: 35%;" value="#{employeeReportMB.employeeReportSearchBean.empFrom}" converter="#{employeeReportMB.employeeDTOConverterFrom}">
                                        <f:selectItem itemLabel="اختر" itemValue="" />
                                        <f:selectItems value="#{employeeReportMB.empFrom}" var="leads" itemValue="#{leads}" itemLabel="#{leads}" />
                                    </p:selectOneMenu>
                                </h:panelGroup> 
                            </h:panelGroup>
                        </div>
                        
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 75px" value="الى موظف"/>
                                </h:panelGroup> 

                                <h:panelGroup>
                                    <p:selectOneMenu id="eventTo" style="width: 35%;" value="#{employeeReportMB.employeeReportSearchBean.empTo}" converter="#{employeeReportMB.employeeDTOConverterTo}">
                                        <f:selectItem itemLabel="اختر" itemValue="" />
                                        <f:selectItems value="#{employeeReportMB.empTo}" var="leadsd" itemValue="#{leadsd}" itemLabel="#{leadsd}" />
                                    </p:selectOneMenu>
                                </h:panelGroup> 
                            </h:panelGroup>
                        </div>

                    </div>
                </div>
                <h:panelGrid  columns="1"  class="col-md-12">

                    <h:panelGroup  class="centerButtons"  style="margin-top: 2%">


                        <p:commandButton     class="searchButtons"
                                             title="#{userData.userDDs['SEARCH']}"
                                             action="#{employeeReportMB.search()}"
                                             id="saveB"
                                             value="#{userData.userDDs['SEARCH']}"
                                             update="@form"
                                             style="color: #fff!important;background-color: #2196F3;margin-left: 5px;"   />

                 
                        <p:commandButton class="closeButtons"
                                         id="CloseB"
                                         style="color: #fff!important;background-color: #035C70;margin-left: 5px;"  
                                         value="#{userData.userDDs['BACK']}" 
                                         title="#{userData.userDDs['BACK']}"
                                         action="exit"/>

                    </h:panelGroup>

                </h:panelGrid>

            </p:fieldset>
             
            
            <p:fieldset legend="بيانات الموظفين" style="margin-bottom:20px">
                <p:messages autoUpdate="true"  id="messages" showDetail="true" closable="true"/>  

                <div>
                    <p:dataTable 
                        draggableColumns="true" 
                        widgetVar="employeetable" var="employee" 
                        value="#{employeeReportMB.employeeReturn}" rowIndexVar="index" 
                        paginator="true" rows="15"
                        emptyMessage="#{userData.userDDs['EMPTY_TABLE']}" style="padding: 0px 5px">
                        <f:facet name="header" >
                           
                            <p:outputPanel  >
                                <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                                <p:inputText id="globalFilter" a:autofocus="true" onkeyup="PF('employeetable').filter()" style="width:150px" />
                            </p:outputPanel>
                        </f:facet>
                        <p:column headerText="#" style="width: 6vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px" >
                            <h:outputText value="#{index + 1}" style="font-size: 1.5vh;"  />
                        </p:column>
                        <p:column filterStyle="display:none" style="width: 10vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px" sortBy="#{employee.code}" filterBy="#{code}"  filterMatchMode="contains" headerText="كود الموظف " >
                            <h:outputText value="#{employee.code}" style="font-size: 1.5vh;"  />
                        </p:column>

                        <p:column filterStyle="display:none" style="width: 40vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px" sortBy="#{employee.name}" filterBy="#{name}"  filterMatchMode="contains" headerText="أسم الموظف " >
                            <h:outputText value="#{employee.name}"    style="font-size: 1.5vh; text-align: center;"  />
                        </p:column>
                        <p:column filterStyle="display:none" style="width: 40vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px" sortBy="#{employee.parentId.name}" filterBy="#{name}"  filterMatchMode="contains" headerText="الرئيس المباشر" >
                            <h:outputText value="#{employee.parentId.name}"    style="font-size: 1.5vh; text-align: center;"  />
                        </p:column>
                         <p:column filterStyle="display:none" style="width: 40vh;font-size: 1.8vh;text-align: -webkit-auto;border-radius: 0px" sortBy="#{employee.designation.name}" filterBy="#{name}"  filterMatchMode="contains" headerText="الوظيفه" >
                             <h:outputText value="#{employee.designation.name}"    style="font-size: 1.5vh; text-align: center;"  />
                        </p:column>
   
                    </p:dataTable>
                </div>
            </p:fieldset>
           

        </h:form>
    </ui:define>
</ui:composition>
