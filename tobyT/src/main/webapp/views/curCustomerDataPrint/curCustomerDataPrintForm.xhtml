<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">

        

        <h:form style="margin-right: 20px" id="form" dir="#{userData.dir}">
            <p:fieldset id="whole" legend="بيانات ملف العميل" style="margin-bottom:20px">

                <div class="col-xs-12">
                    <p:messages id="curmsg" showDetail="true" rendered="true" closable="true"/>   
                </div>

                <div  id="firstLine" class="ui-g-12 ui-g-nopad">
                    <div class="ui-g">


                        <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 49%!important" value="#{glBankFromMB.glBankEntity.name}"/>

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 65px" value="اسم العميل"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 49%!important" value="#{glBankFromMB.glBankEntity.name}"/>

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 65px" value="سن العميل"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 49%!important" value="#{glBankFromMB.glBankEntity.name}"/>

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 65px" value="رقم التليفون"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 49%!important" value="#{glBankFromMB.glBankEntity.name}"/>

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 65px" value="رقم الباسبور"/>

                                </div>
                            </div>
                          
                            
                                <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 49%!important" value="#{glBankFromMB.glBankEntity.name}"/>

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 65px" value="المحافظة"/>

                                </div>
                            </div>
                            
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 49%!important" value="#{glBankFromMB.glBankEntity.name}"/>

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 65px" value="المراكز الطبية"/>

                                </div>
                            </div>

                        </div>
                        

                    </div>
                </div>
                
                
                
                
                

            </p:fieldset>

            <div class="">
                    <p:dataTable 
                        draggableColumns="true"
                        var="glyear"  
                        rowIndexVar="index" 
                         value="#{glyearListBean.glYears}" 
                         rows="#{userData.rowListCount}" 
                         paginator="true" emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                                 id="gLyear">
                        
                        <f:facet name="header" class="col-md-12">
                            
                            
                             
                            <p:outputPanel >
                                 <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                                <p:inputText id="globalFilter"  onkeyup="PF('bTable').filter()" style="width:150px" />
                            </p:outputPanel>
                        </f:facet>
                        
                      
                        <p:column headerText="#" style="width: 4vh;text-align:right;font-size: 1.8vh;border-radius: 0px" >
                            <p:outputLabel value="#{index+1}" style="font-size: 1.5vh"/>
                        </p:column>
                      
                        
                        <p:column headerText="كود الفحص" style="width: 15vh;text-align: -webkit-auto;font-size: 1.8vh;border-radius: 0px" >
                            <p:outputLabel value="#{glyear.name}" style="font-size: 1.5vh" />
                        </p:column>
                        <p:column headerText="اسم الفحص" style="width: 15vh;text-align: -webkit-auto;font-size: 1.8vh;border-radius: 0px" >
                            <p:outputLabel value="#{glyear.isDefault ? 'الافتراضية' : ''}" style="font-size: 1.5vh" />
                        </p:column>
                        <p:column headerText="صورة الفحص" style="width: 15vh;text-align: -webkit-auto;font-size: 1.8vh;border-radius: 0px" >
                            <p:outputLabel value="#{glyear.isDefault ? 'الافتراضية' : ''}" style="font-size: 1.5vh" />
                        </p:column>
                        
                    </p:dataTable>
                    
                    
                    
                    
                    
                    <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                        <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                        <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                    </p:confirmDialog>
                </div>
            
            <panelGrid class="centerButtons col-md-12">

                    <h:panelGroup>

                        <p:commandButton  class="saveButton" id="saveB" 
                                          title="طباعة الشهادة" 
                                          value="طباعة الشهادة" 
                                          icon="fa fa-fw fa-save" 
                                          action="#{glBankFromMB.save()}" 
                                          disabled="#{glBankFromMB.disableSave}"
                                          update="@form"
                                          />
                        
                        <p:blockUI block="form" trigger="saveB" animate="true" >

                            <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                        </p:blockUI> 


                    </h:panelGroup>
                </panelGrid>

        </h:form>
    </ui:define>
</ui:composition>
