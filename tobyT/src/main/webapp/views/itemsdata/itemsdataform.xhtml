<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">

        <h:form id="form" dir="#{userData.dir}" style="margin-right: 15px">
            <p:fieldset id="whole" style="margin-bottom:20px">
                <div class="ui-g-6 ui-xl-6">
                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:autoComplete style="width:40%" 
                                            dropdown="true"
                                            converter="#{itemDataFormMB.invGroupDTOConverter}"
                                            value="#{itemDataFormMB.itemDataEntity.groupId}"
                                            var="group"
                                            itemLabel="#{group}" 
                                            itemValue="#{group}" 
                                            forceSelection="true" 
                                            completeMethod="#{itemDataFormMB.completeInvGroups}" >
                            </p:autoComplete>
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 75px;" value="#{userData.userDDs['GROUP']}"/>
                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:inputText style="width:48%" value="#{itemDataFormMB.itemDataEntity.discountrate}" >
                                <p:ajax event="blur" listener="#{itemDataFormMB.calcDiscountValue}" update="discountvalue"/>
                            </p:inputText>
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width:70px" value=" نسبة الخصم"/>
                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:inputText style="width:48%" value="#{itemDataFormMB.itemDataEntity.discountvalue}" id="discountvalue" />
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width:70px" value=" القيمة بعد  الخصم"/>
                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:inputText style="width:48%" value="#{itemDataFormMB.itemDataEntity.maxpriceyoung}" />
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width:70px" value=" أعلى سعر ولادى "/>
                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:inputText style="width:48%" value="#{itemDataFormMB.itemDataEntity.maxpricemen}" />
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width:70px" value=" أعلى سعر رجالى "/>
                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:inputText style="width:48%" value="#{itemDataFormMB.itemDataEntity.minpriceyoung}" />
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width:70px" value=" اقل سعر ولادى "/>
                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:inputText style="width:48%" value="#{itemDataFormMB.itemDataEntity.minpricemen}" />
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width:70px" value=" اقل سعر رجالى "/>
                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:inputText style="width:48%" value="#{itemDataFormMB.itemDataEntity.numbermetersyoung}" />
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width:70px" value=" عدد الامتارولادى "/>
                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:inputText style="width:48%" value="#{itemDataFormMB.itemDataEntity.numbermetersmen}" />
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width:70px" value=" عدد الامتار رجالى "/>
                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:inputText style="width:48%" value="#{itemDataFormMB.itemDataEntity.numbermetersfreeyoung}" />
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width:70px" value=" عدد الامتار مجانى ولادى "/>
                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:inputText style="width:48%" value="#{itemDataFormMB.itemDataEntity.numbermetersfreemen}" />
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width:70px" value=" عدد الامتار مجانى رجالى "/>
                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:inputText style="width:48%" value="#{itemDataFormMB.itemDataEntity.bounsepriceyoung}" />
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width:70px" value=" سعر إضافى ولادى"/>
                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:inputText style="width:48%" value="#{itemDataFormMB.itemDataEntity.bounsepricemen}" />
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width:70px" value=" سعر إضافى رجالى"/>
                        </div>
                    </div>
                    
                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:selectOneMenu value="#{itemDataFormMB.itemDataEntity.isOfferItem}" >
                                <f:selectItem itemLabel="نعم" itemValue="1" />
                                <f:selectItem itemLabel="لا" itemValue="0" />
                            </p:selectOneMenu>

                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width:70px" value=" هل الصنف داخل عرض"/>
                        </div>
                    </div>

                </div>

                <div class="ui-g-6 ui-xl-6">  

                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:autoComplete style="width:85%!important" 
                                            dropdown="true"
                                            required="true"
                                            converter="#{itemDataFormMB.organizationSiteConvertor}"
                                            value="#{itemDataFormMB.itemDataEntity.siteId}"
                                            var="supplier"
                                            itemLabel="#{supplier}" 
                                            itemValue="#{supplier}" 
                                            forceSelection="true" 
                                            completeMethod="#{itemDataFormMB.completeOrganizationSite}">
                            </p:autoComplete>

                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 70px" value="#{userData.userDDs['SUPPLIER_NAME']}"/>
                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel  style="width: 49%!important" id="itemNumber2"  value="#{itemDataFormMB.itemDataEntity.code}" />
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 70px" value="#{userData.userDDs['ITEM_CODE']}"/>
                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:inputText style="width: 49%!important"
                                         id="itemName" 
                                         value="#{itemDataFormMB.itemDataEntity.name}"
                                         requiredMessage="#{userData.userDDs['ITEM_NAME_REQ']}"
                                         required="true"/>
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel  style="width: 70px" value="#{userData.userDDs['ITEM_NAME']}"/>
                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:autoComplete style="width:85%" id="Cost_Center_From"  
                                            dropdown="true"
                                            converter="#{itemDataFormMB.unitDTOConverter}"
                                            value="#{itemDataFormMB.itemDataEntity.unitId}"
                                            var="unitId"
                                            itemLabel="#{unitId}" 
                                            itemValue="#{unitId}" 
                                            forceSelection="true" 
                                            completeMethod="#{itemDataFormMB.completeUnits}" >
                            </p:autoComplete>

                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel  style="width: 70px" value="#{userData.userDDs['MEASUR_UNIT']}"/>
                        </div>
                    </div>

                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:autoComplete style="width:85%" id="progroup"  
                                            dropdown="true"
                                            converter="#{itemDataFormMB.proGroupDTOConverter}"
                                            value="#{itemDataFormMB.itemDataEntity.proGroupId}"
                                            var="proGroup"
                                            itemLabel="#{proGroup}" 
                                            itemValue="#{proGroup}" 
                                            forceSelection="true" 
                                            completeMethod="#{itemDataFormMB.completeproGroups}" >
                            </p:autoComplete>
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel  style="width: 70px" value="المرحلة"/>
                        </div>
                    </div>


                    <div class="ui-g-12 ui-xl-12" >
                        <div class="ui-g-6 ui-xl-6">
                            <p:selectOneMenu style="width: 50.5%"  id="typeCat" filter="true" filterMatchMode="startsWith"  rendered="false"
                                             value="#{itemDataFormMB.itemDataEntity.typeCat}"
                                             requiredMessage="#{userData.userDDs['PROD_TYP_MUST_SELE']}"
                                             required="true" >                        
                                <f:selectItem itemLabel="#{userData.userDDs['CHOOSE']}"    />
                                <f:selectItem itemLabel="#{userData.userDDs['CRUDE_MATERIALS']}" itemValue="0"    />
                                <f:selectItem itemLabel="#{userData.userDDs['MATE_UND_OPE']}" itemValue="1"    />
                                <f:selectItem itemLabel="#{userData.userDDs['CRUDE_PRODUCT']}" itemValue="2"    />
                                <f:selectItem itemLabel="#{userData.userDDs['OTHER_MATERI']}" itemValue="3"    />
                                <f:selectItem itemLabel="#{userData.userDDs['SPARE_PARTS']}" itemValue="4"    />
                                <f:selectItem itemLabel="#{userData.userDDs['PACK_WARP_MATER']}" itemValue="5"    />
                            </p:selectOneMenu> 

                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 70px" value="#{userData.userDDs['PRODUCT_TYPE']}"  rendered="false"/>
                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:inputText style="width: 49%!important" id="isSell"
                                         value="#{itemDataFormMB.itemDataEntity.sellPrice}"
                                         requiredMessage="#{userData.userDDs['SELL_PRI_MU_ADD']}"
                                         required="true"/>
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 70px" value="#{userData.userDDs['SELLING_PRICE1']}"/>
                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:inputText style="width: 49%!important" id="remarks" 
                                         value="#{itemDataFormMB.itemDataEntity.remarks}"/>

                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width: 70px" value="#{userData.userDDs['NOTE']}"/>
                        </div>
                    </div>

                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:inputText style="width:49%!important" id="LastPrice"
                                         value="#{itemDataFormMB.itemDataEntity.lastCost}"/>
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width:70px" value="#{userData.userDDs['LATEST_COST']}"/>
                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width:49%!important" id="costAverage" 
                                           value="#{itemDataFormMB.itemDataEntity.costAverage}"/>
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width:70px" value="#{userData.userDDs['AVERAGE_COST']}"/>
                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width:48%" id="dateFrom" value="#{itemDataFormMB.itemDataEntity.dateCreateCat}">
                                <f:convertDateTime type="date" pattern="dd-MM-yyyy"/>
                            </p:outputLabel>
                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width:70px" value="#{userData.userDDs['CREATED_DATE']}"/>
                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:selectOneMenu value="#{itemDataFormMB.itemDataEntity.itemNatural}" rendered="false" >
                                <f:selectItem itemLabel="اختر" itemValue="" />
                                <f:selectItem itemLabel="مواد خام" itemValue="0" />
                                <f:selectItem itemLabel="منتج" itemValue="1" />
                                <f:selectItem itemLabel="مبيعات" itemValue="2" />
                                <f:selectItem itemLabel="خدمات" itemValue="3" />
                            </p:selectOneMenu>

                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width:70px" value=" طبيعة الصنف"  rendered="false"/>
                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:selectOneMenu value="#{itemDataFormMB.itemDataEntity.isinventoryitem}" >
                                <f:selectItem itemLabel="اختر" itemValue="" />
                                <f:selectItem itemLabel="نعم" itemValue="1" />
                                <f:selectItem itemLabel="لا" itemValue="0" />
                            </p:selectOneMenu>

                        </div>
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width:70px" value=" هل هو صنف مخزنى"/>
                        </div>
                    </div>

                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:selectOneMenu value="#{itemDataFormMB.itemDataEntity.itemNatural}" >
                                <f:selectItem itemLabel="اختر" itemValue="" />
                                <f:selectItem itemLabel="عرض واحد" itemValue="1" />
                                <f:selectItem itemLabel="عرضين" itemValue="2" />
                            </p:selectOneMenu>
                        </div>     
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width:70px" value="  نوع العرض"/>
                        </div>
                    </div>
                    <div class="ui-g-12 ui-xl-12">
                        <div class="ui-g-6 ui-xl-6">
                            <p:selectOneMenu value="#{itemDataFormMB.itemDataEntity.typeItem}" converter="#{itemDataFormMB.invItemTypeDTOConverter}" >
                                <f:selectItem itemLabel="اختر" itemValue="" />
                                <f:selectItems value="#{itemDataFormMB.invItemType}"  
                                               var="InvItemType" 
                                               itemLabel="#{InvItemType.name}"
                                               itemValue="#{InvItemType}"/>
                            </p:selectOneMenu>
                        </div>     
                        <div class="ui-g-6 ui-xl-6">
                            <p:outputLabel style="width:70px" value="  نوع التوب"/>
                        </div>
                    </div>
                </div>
                <!--First Segment-->
                <h:panelGrid id="firstSegment" columns="2"  class="col-md-12" cellspacing="20" cellpadding="0" style="margin-top:15px" >
                    <p:messages id="curmsg" autoUpdate="true" showDetail="true" rendered="true" closable="true"/>   
                </h:panelGrid>
                <p:commandButton    value="حفظ" 
                                    action="#{itemDataFormMB.saveItem()}" />
                <p:commandButton  class="newButtons" 
                                          id="newN"
                                          ajax="false"

                                          value="#{userData.userDDs['NEW']}" 
                                          onclick="form.target = ''" 
                                          actionListener="#{itemDataFormMB.reset()}"/>
                 <p:commandButton  class="printButtons"
                                          ajax="false"
                                          onclick="form.target = '_blank'"  
                                          title="#{userData.userDDs['PRINT']}"
                                          value="#{userData.userDDs['PRINT']}" 
                                          actionListener="#{itemDataFormMB.print}"/>
                <p:commandButton   title="بحث" 
                                   class="sreloadButtons" style="background-color:rgb(162, 46, 247);border-radius: 3px;margin-bottom:3px"

                                   onclick="PF('dlg4').show();"
                                   icon="fa fa-fw fa-search-plus" >
                </p:commandButton>
                
                
            </p:fieldset>   

            <div class="ui-g-6 ui-xl-6" >

                <p:dialog header="البحث عن صنف" widgetVar="dlg4" showEffect="explode" hideEffect="bounce" height="440" width="500" style="margin-top: 2%">

                    <h:panelGroup>
                        <p:outputLabel style="width: 10vh" value="الصنف"/>
                    </h:panelGroup> 
                    <h:panelGroup>
                        <p:inputText value="#{itemDataFormMB.itemName}"/>  
                    </h:panelGroup>

                    <h:panelGroup style="margin-right: 6%">

                        <p:commandButton     class="saveButton"  
                                             title="#{userData.userDDs['SEARCH']}"
                                             value="بحث" 
                                             icon="fa fa-fw fa-save" 
                                             action="#{itemDataFormMB.findAllItemsBarcodesDetailsViewBranchId()}"
                                             update="itemTable"
                                             >
                        </p:commandButton>

                    </h:panelGroup>

                    <h:panelGroup>
                        <p:dataTable id="itemTable"
                                     draggableColumns="true" 
                                     var="itemTable" 
                                     style="margin-top: 5%"
                                     widgetVar="itemTable" 
                                     rowIndexVar="index" 
                                     dir="rtl" 
                                     selection="#{itemDataFormMB.itemsBarcodesDetailsViewListForSearchSelected}"
                                     value="#{itemDataFormMB.itemsBarcodesDetailsViewListForSearch}" 
                                     selectionMode="single"
                                     rowKey="#{itemTable.id}"  scrollable="true" scrollHeight="250"
                                     emptyMessage="#{userData.userDDs['EMPTY_TABLE']}">

                            <f:facet name="header" >
                                <p:outputPanel  >
                                    <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                                    <p:inputText id="globalFilter" onkeyup="PF('itemTable').filter()" style="width:150px" />
                                </p:outputPanel>
                            </f:facet>

                            <p:column style="width:2vw;font-size:0.8vw;text-align: right;border-radius: 0px"
                                      filterStyle="display:none"
                                      filterBy="#{itemTable.barcode}"
                                      filterMatchMode="contains"
                                      headerText="الكود" 
                                      sortBy="#{itemTable.barcode}" 
                                      >
                                <p:outputLabel value="#{itemTable.barcode}" />
                            </p:column>  

                            <p:column style="width:10vw;font-size:0.8vw;text-align: right;border-radius: 0px"
                                      filterStyle="display:none" filterBy="#{itemTable.name}"
                                      filterMatchMode="contains"
                                      headerText="الصنف" 
                                      sortBy="#{itemTable.name}" >
                                <p:outputLabel value="#{itemTable.name}" />
                            </p:column>  
                        </p:dataTable> 

                    </h:panelGroup>

                    <h:panelGroup>
                        <br/>
                        <p:commandButton     class="saveButton"  
                                             title="#{userData.userDDs['SAVE']}"
                                             value="تحميل" 
                                             icon="fa fa-fw fa-save" 
                                             action="#{itemDataFormMB.fillItemDate()}"
                                             update="@form"
                                             >
                        </p:commandButton>
                    </h:panelGroup>
                </p:dialog>
            </div>
        </h:form>
    </ui:define>
</ui:composition>
