<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">
        <div class="col-xs-12">
            <p:messages id="curmsg" showDetail="true" rendered="true" closable="true"/>   
        </div>
        <h:form style="margin-right: 20px" id="form"  enctype="multipart/form-data"  dir="#{userData.dir}">


            <p:fieldset legend="#{userData.userDDs['ADD/DISC_NOTIFI']}">

                <div  id="firstLine" class="ui-g-12 ui-g-nopad">

                    <div class="ui-g">

                        <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <h:outputLabel   style="width:59.5%!important"  value="#{invNoticeFormMB.invNoticeEntity.serial}"/>

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 85px;" value="#{userData.userDDs['NUMB']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:fieldset  style="width: 68%;border-radius: 5px">
                                        <p:selectOneRadio  id="console"  value ="#{invNoticeFormMB.invNoticeEntity.type}" >
                                            <f:selectItem itemLabel="#{userData.userDDs['ADD_NOTIF']}" itemValue="2" />
                                            <f:selectItem itemLabel="#{userData.userDDs['DISC_NOTIF']}" itemValue="3" />
                                        </p:selectOneRadio>
                                    </p:fieldset>
                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel value="#{invNoticeFormMB.invNoticeEntity.organizationSiteId}" 
                                                   rendered="#{invNoticeFormMB.invNoticeEntity.id ne null}" />
                                    <div class="ui-g-6 ui-xl-6"></div>
                                    <p:autoComplete style="width:35%!important" 
                                                    dropdown="true"
                                                    required="true"
                                                    converter="#{autoComplete.supplierConvertorFrom}"
                                                    value="#{invNoticeFormMB.invNoticeEntity.organizationSiteId}"
                                                    rendered="#{invNoticeFormMB.invNoticeEntity.id eq null}"
                                                    var="supplier"
                                                    itemLabel="#{supplier}" 
                                                    itemValue="#{supplier}" 
                                                    forceSelection="true" 
                                                    completeMethod="#{autoComplete.completeSupplierFrom}">

                                    </p:autoComplete>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 85px;" value="#{userData.userDDs['SUPPLIER']}"/>

                                </div>
                            </div>
                        </div>



                        <div class="ui-g-6 ui-xl-6">
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:calendar required="true"
                                                value="#{invNoticeFormMB.invNoticeEntity.date}"
                                                pattern="dd/MM/yyyy" 
                                                style="width:50%"/>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 50px" value="#{userData.userDDs['DATEE']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText  style="width:35%!important"  required="true" value="#{invNoticeFormMB.invNoticeEntity.amount}" />

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 50px" value="#{userData.userDDs['AMOUNT']}"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText  style="width:35%!important" value="#{invNoticeFormMB.invNoticeEntity.remarks}" />

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 50px" value="#{userData.userDDs['REMARK']}"/>

                                </div>
                            </div>
                        </div>                        
                    </div>
                </div>

                <h:panelGrid  class="col-md-12" columns="1">      

                    <h:panelGroup class="centerButtons"> 
                        <p:commandButton  class="saveButton"
                                          id="saveB" 
                                          title="#{userData.userDDs['SAVE']}" 
                                          value="#{userData.userDDs['SAVE']}" 
                                          action="#{invNoticeFormMB.save()}"
                                          update="form curmsg"/>

                        <p:commandButton  class="newButton" 
                                          id="newN"
                                          ajax="false"
                                          value="#{userData.userDDs['NEW']}" 
                                          title="#{userData.userDDs['NEW']}"
                                          onclick="form.target = ''" 
                                          actionListener="#{invNoticeFormMB.reset()}"/>


                        <p:commandButton  class="closeButton" 
                                          id="cancel"
                                          title="#{userData.userDDs['BACK']}"
                                          value="#{userData.userDDs['BACK']}" 
                                          action="#{invNoticeFormMB.exit()}"
                                          update="@form"/>

                        <p:blockUI block="form" trigger="saveB" animate="true" >

                            <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                        </p:blockUI> 
                    </h:panelGroup>

                </h:panelGrid>       

            </p:fieldset>

        </h:form>
    </ui:define>
</ui:composition>
