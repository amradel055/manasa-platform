<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <link rel="stylesheet" type="text/css" href="../../resources/css/main.css" /> 
    <link rel="stylesheet" type="text/css" href="./../../resources/css/custom.css" />
    <ui:define name="content">
        <p:messages id="curmsg" autoUpdate="true" showDetail="true" showSummary="true" rendered="true" closable="true"/>


        <h:form  id="form"  class='formmargin' dir="#{userData.dir}">
            <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                  margin-top: 12%;
                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;"
                                  icon="fa fa-fw fa-home"
                                  title="#{userData.userDDs['HOME']}"
                                  class="smhomeButton" 
                                  action="exit" />
                <p:commandButton  style="z-index: 2;
                                  margin-top: 9%!important;
                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;" 
                                  class="viewButton sminimize"
                                  icon="fa fa-window-minimize"
                                  title="إظهار/إخفاء"/>  
            </div>
            <p:fieldset legend="#{userData.userDDs['MIGRAT_ACCOUNT']}" style="margin-bottom:20px">

                <div>
                    <p:messages autoUpdate="true"  id="msg" showDetail="true" closable="true" rendered="true" />
                </div>

                <div  id="firstLine" class="ui-g-12 ui-g-nopad">
                    <div class="ui-g">
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 75px;margin-right: 6%;" value="المعرض" 
                                                   />
                                </h:panelGroup>

                                <h:panelGroup>                                    
                                    <p:selectCheckboxMenu id="gallary_From" value="#{shiftingJournalMB_new.gallaryListSelected}" 
                                                          converter="#{shiftingJournalMB_new.gallaryDTOConverters}"
                                                          label="المعرض" style="width: 15rem"
                                                          filter="true" filterMatchMode="startsWith" panelStyle="width: 15rem" scrollHeight="250">
                                        <f:selectItems value="#{shiftingJournalMB_new.gallaryLists}" 
                                                       var="gallary"
                                                       itemLabel="#{gallary}"
                                                       itemValue="#{gallary}"/>
                                        <p:ajax event="change"  update="@form" />
                                    </p:selectCheckboxMenu>
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>
                        
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 75px;margin-right: 6%;" value="الخزائن" 
                                                   />
                                </h:panelGroup>

                                <h:panelGroup>    
                                    <p:selectCheckboxMenu id="glBank_From" value="#{shiftingJournalMB_new.glBankDTOListSelected}" 
                                                          converter="#{shiftingJournalMB_new.glBankDTOConverter}"
                                                          label="الخزينة" style="width: 15rem"
                                                          filter="true" filterMatchMode="startsWith" panelStyle="width: 15rem" scrollHeight="250">
                                        <f:selectItems value="#{shiftingJournalMB_new.glBankDTOLists}" 
                                                       var="gallary"
                                                       itemLabel="#{gallary}"
                                                       itemValue="#{gallary}"/>
                                    </p:selectCheckboxMenu>
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>
                        
                        <div class="ui-g-12 ui-md-6">

                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 75px;margin-right: 6%;" value="#{userData.userDDs['JOURNAL_TYPE']}" 
                                                   />
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:selectOneMenu style="width:35%" value="#{shiftingJournalMB_new.symbolId}" id="GlAccount_ID_from" >
                                        <f:selectItem itemLabel="#{userData.userDDs['CHOOSE']}"  itemValue="" />
                                        <f:selectItems value="#{shiftingJournalMB_new.options}" var="opt" itemLabel="#{opt.label}" itemValue="#{opt.value}"/>
                                        <p:ajax update="@form" process="@form" listener="#{shiftingJournalMB_new.loadDataTableHead()}" />
                                    </p:selectOneMenu>
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>   

                                <h:panelGroup>
                                    <p:outputLabel style="width: 75px;margin-right: 6%;" value="#{userData.userDDs['FINANCE_YEAR']}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:selectOneMenu style="width:35%" id="year" filter="true" filterMatchMode="contains"   value="#{shiftingJournalMB_new.glYearSelection}" converter="#{shiftingJournalMB_new.glYearConverter}"   >
                                        <p:ajax update="dateFrom dateTo" listener="#{shiftingJournalMB_new.pushGlYearSelection()}" />
                                        <f:selectItem itemLabel="#{userData.userDDs['CHOOSE']}"  itemValue="" />
                                        <f:selectItems value="#{shiftingJournalMB_new.glYearList}"  var="year" itemLabel="#{year.name}" itemValue="#{year}"/>
                                    </p:selectOneMenu>
                                </h:panelGroup>

                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 69px;margin-right: 6%;"  value="#{userData.userDDs['YEAR_FROM']}" />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:calendar style="width: 50%"   id="dateFrom"
                                                value="#{shiftingJournalMB_new.dateFrom}"
                                                pattern="yyyy/MM/dd" showButtonPanel="true" >
                                        <p:ajax listener="#{shiftingJournalMB_new.checkDate(true)}" event="dateSelect" update="dateFrom"/>
                                    </p:calendar>
                                </h:panelGroup>

                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>

                                <h:panelGroup>
                                    <p:outputLabel style="width: 69px;margin-right: 6%;"  value="#{userData.userDDs['YEAR_TO']}" />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:calendar style="width: 50%"  id="dateTo"
                                                value="#{shiftingJournalMB_new.dateTo}"
                                                pattern="yyyy/MM/dd"  showButtonPanel="true" >
                                        <p:ajax listener="#{shiftingJournalMB_new.checkDate(false)}" event="dateSelect" update="table1"/>
                                    </p:calendar>

                                </h:panelGroup>

                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 84px;margin-right: 6%;"  value="#{userData.userDDs['CONSTRAINTS_STAGE']}" />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:selectBooleanCheckbox id="chek" style="width:50%;" value="#{shiftingJournalMB_new.shiftedJournals}">
                                        <p:ajax  listener="#{shiftingJournalMB_new.showShiftedJournals}" update="@form" />
                                    </p:selectBooleanCheckbox>
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>
                    </div>
                </div>

                <h:panelGrid  class="centerButtons col-md-12" columns="1">
                    <h:panelGroup>
                        <p:commandButton  class="midrateallButtonss" 
                                          style="color: #fff!important;background-color: #009fff;margin-left: 5px"
                                          value="#{userData.userDDs['MIDRATE_ALL']}"  
                                          id="movTo"
                                          action="#{shiftingJournalMB_new.shift}" update="form"
                                          disabled="#{shiftingJournalMB_new.postRestrictionsViewList.size() eq 0 or shiftingJournalMB_new.shiftedJournals}" >
                            <p:confirm disabled="#{shiftingJournalMB_new.postRestrictionsViewList.size() eq 0}" header="#{userData.userDDs['COFIGRATION']}" message="#{userData.userDDs['ARE_YOU_SURE']}" icon="ui-icon-alert" />
                        </p:commandButton>

                        <p:commandButton  id="Cancelb" class="cancellmidrateButtonss"  style="width: 113px;color: #fff!important;background-color: #3800ffd6;margin-left: 5px" 
                                          value="#{userData.userDDs['CANCEL_RELAY']}" action="#{shiftingJournalMB_new.undoShifting}" 
                                          update="form"
                                          disabled="#{shiftingJournalMB_new.postRestrictionsViewList.size() eq 0 or not shiftingJournalMB_new.shiftedJournals}" >
                            <p:confirm disabled="#{shiftingJournalMB_new.postRestrictionsViewList.size() eq 0}"
                                       header="#{userData.userDDs['COFIGRATION']}" message="#{userData.userDDs['ARE_YOU_SURE']}" icon="ui-icon-alert" />

                        </p:commandButton>

                        <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                            <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                            <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                        </p:confirmDialog>


                    </h:panelGroup>
                </h:panelGrid>

            </p:fieldset>

            <p:fieldset>

                <p:dataTable  id="table1"
                              style="margin-top: 0px"
                              widgetVar="postRestrict" 
                              var="postRestrict" 
                              dir="#{userData.dir}" 
                              rows="8"  
                              selection="#{shiftingJournalMB_new.postRestrictionsView}" 
                              selectionMode="single"   
                              rowKey="#{postRestrict}" 
                              value="#{shiftingJournalMB_new.postRestrictionsViewList}"                    
                              paginator="true" 
                              rowIndexVar="index" 
                              emptyMessage="#{userData.userDDs['EMPTY_TABLE']}" >

                    <f:facet name="header" class="col-md-12">

                        <p:outputPanel>
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large;" />
                            <p:inputText   id="globalFilter"   onkeyup="PF('cashSett').filter()" style='width: 16%!important;' />
                        </p:outputPanel>

                    </f:facet>

                    <p:ajax id="rowselects"  event="rowSelect"   listener="#{shiftingJournalMB_new.onRowSelect}"  update="@form"/>
                    <p:column headerText="#" style="width: 2%;font-size: 15px;text-align: -webkit-auto;border-radius: 0px" >
                        <h:outputText value="#{index + 1}" style="width: 2%;font-size: 12px;" />
                    </p:column>               
                    <p:column   style="font-size: 1.4vh;width: 8vh;text-align:center!important;border-radius: 0px" sortBy="#{postRestrict.date}"  filterBy="#{postRestrict.date}"  filterMatchMode="contains" headerText=" #{userData.userDDs['DATEE']} " >
                        <h:outputText      value="#{postRestrict.date}"  > 
                            <f:convertDateTime     pattern="yyyy-MM-dd" /> 
                        </h:outputText>                        
                    </p:column>
                    <p:column  style="font-size: 1.4vh;width: 39vh;text-align:center!important;border-radius: 0px"
                               sortBy="#{postRestrict.remark}" filterBy="#{postRestrict.remark}"  
                               filterMatchMode="contains" headerText="#{userData.userDDs['MOVEMENT']}">
                        <h:outputText  value="#{postRestrict.remark}" />
                    </p:column>
                    <p:column style="font-size: 1.4vh;width: 7vh;text-align:center!important;border-radius: 0px"  headerText="#{userData.userDDs['DOCUMENT_NUMBER']}"  
                              sortBy="#{postRestrict.serial}"  filterBy="#{postRestrict.serial}"  filterMatchMode="contains" >
                        <h:outputText value="#{postRestrict.serial}" />
                    </p:column>
                    <p:column style="font-size: 1.4vh;width: 5vh;text-align:center!important;border-radius: 0px"  headerText="#{userData.userDDs['YEAR']}" 
                              sortBy="#{postRestrict.glYear}"  filterBy="#{postRestrict.glYear}"  filterMatchMode="contains">
                        <h:outputText value="#{postRestrict.glYear}" />
                    </p:column>
                    <p:column style="font-size: 1.4vh;width: 10vh;text-align:center!important;border-radius: 0px"  headerText="#{userData.userDDs['GENERAL_NUMBER']}" 
                              sortBy="#{postRestrict.generalJournalId}"  filterBy="#{postRestrict.generalJournalId}"  filterMatchMode="contains">
                        <h:outputText value="#{postRestrict.generalJournalId}" />
                    </p:column>

                    <p:column style="font-size: 1.4vh;width: 7vh;border-radius: 0px" >
                        <p:commandButton  class="ssaveButtons" title="#{userData.userDDs['ACCOUNT_MIGRATION']}"  
                                          action="#{shiftingJournalMB_new.shift}"
                                          update="form" id="shift"
                                          onclick="this.disabled = true;"
                                          oncomplete="this.disabled=false;"
                                          icon="fa fa-check " style="background-color:#1c3599;border-radius: 3px;"
                                          disabled="#{shiftingJournalMB_new.shiftedJournals}"
                                          >
                            <f:setPropertyActionListener value="#{postRestrict}" target="#{shiftingJournalMB_new.postRestrictionsSelected}"  />
                        </p:commandButton>

                        <p:commandButton  id="undoShifting"  class="sreloadButtons" update="form" title="#{userData.userDDs['CANCEL_MIGRATION']}" 
                                          action="#{shiftingJournalMB_new.undoShifting}" 
                                          style="background-color: #1c993b;border-radius: 3px;"
                                          onclick="this.disabled = true;"
                                          oncomplete="this.disabled=false;"
                                          icon="fa fa-fw fa-undo"
                                          disabled="#{not shiftingJournalMB_new.shiftedJournals}"
                                          >
                            <f:setPropertyActionListener value="#{postRestrict}" target="#{shiftingJournalMB_new.postRestrictionsSelected}" />
                        </p:commandButton>
                    </p:column>
                </p:dataTable>


                <p:dataTable 
                    widgetVar="" 
                    var="postRestrictDetails" 
                    selection="#{shiftingJournalMB_new.postRestrictionsDetailsBeanSelection}" 
                    selectionMode="single"   
                    rowKey="#{postRestrictDetails}"
                    dir="#{userData.dir}" 
                    value="#{shiftingJournalMB_new.postRestrictionDetailsBeanList}"      
                    rows="10"  
                    paginator="true" 
                    style='margin-top: 2%;'
                    emptyMessage="#{userData.userDDs['EMPTY_TABLE']}" >

                    <p:ajax  event="rowSelect"   listener="#{shiftingJournalMB_new.onRowDetailsSelect}"  update="@form"/>

                    <p:column headerText="#{userData.userDDs['ACCOUNT_NUMBER']}"  style="font-size: 1.4vh;width: 7vh;border-radius: 0px"   >
                        <h:outputText  value="#{postRestrictDetails.accNumber}" />
                    </p:column>
                    <p:column headerText="#{userData.userDDs['ACCOUNT_NAME']}"  style="font-size: 1.4vh;width: 7vh;border-radius: 0px">
                        <h:outputText  value="#{postRestrictDetails.accName}" />
                    </p:column>
                    <p:column headerText="#{userData.userDDs['DESCRIBTION']}"  style="font-size: 1.4vh;width: 24vh;border-radius: 0px">
                        <h:outputText  value="#{postRestrictDetails.remarks}" />
                    </p:column>

                    <p:column headerText="#{userData.userDDs['DEBIT']}"  style="font-size: 1.4vh;width: 24vh;border-radius: 0px">
                        <h:outputText  value="#{postRestrictDetails.valueDebit}" />
                    </p:column>

                    <p:column headerText="#{userData.userDDs['CREDIT']}"  style="font-size: 1.4vh;width: 24vh;border-radius: 0px">
                        <h:outputText  value="#{postRestrictDetails.valueCredit}" />
                    </p:column>


                    <p:columnGroup type="footer">
                        <p:row>
                            <p:column style="border-radius: 0px" colspan="3" footerText="#{userData.userDDs['TOTAL']} " />                           
                            <p:column style="border-radius: 0px" footerText="#{shiftingJournalMB_new.debitFinalSummary}" />
                            <p:column style="border-radius: 0px" footerText="#{shiftingJournalMB_new.creditFinalSummary}" />
                            <p:column style="border-radius: 0px" colspan="2"  footerText="" />
                        </p:row>
                        <p:row>
                            <p:column style="border-radius: 0px" footerText="#{userData.userDDs['COST_CENTER']}" />                           
                            <p:column style="border-radius: 0px" colspan="2" footerText="#{shiftingJournalMB_new.costCenterShow.code}#{shiftingJournalMB_new.costCenterShow.name}" />
                            <p:column style="border-radius: 0px" footerText="#{userData.userDDs['ADMIN_UNIT']}" />
                            <p:column style="border-radius: 0px" colspan="3" footerText="#{shiftingJournalMB_new.adminUnitShow.code}#{shiftingJournalMB_new.adminUnitShow.name}" />
                        </p:row>
                    </p:columnGroup>
                </p:dataTable>
                <h:panelGrid class="col-md-12 centerButtons" columns="1">

                    <h:panelGroup>

                        <p:commandButton class="closeButtons" 
                                         title="#{userData.userDDs['BACK']}" 
                                         immediate="true" 
                                         value="#{userData.userDDs['BACK']}" 
                                         style="color: #fff!important;background-color: #0034ffeb"
                                         action="exit"   />

                    </h:panelGroup>

                </h:panelGrid>
            </p:fieldset>



            <p:blockUI block="form" trigger="GlAccount_ID_from movTo Cancelb @(.ssaveButtons) @(.sreloadButtons) dateTo chek "  animate="true" >

                <p:graphicImage library="img" name="loading.gif" ></p:graphicImage>

            </p:blockUI> 

        </h:form>
    </ui:define>
</ui:composition>
