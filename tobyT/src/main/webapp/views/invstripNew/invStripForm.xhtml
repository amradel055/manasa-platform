<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <h:form id="form"  enctype="multipart/form-data"  dir="#{userData.dir}" style="margin-right: 15px">
            <p:fieldset  legend="#{userData.userDDs['STORE_INVENTORY']}" style="margin-bottom:20px">
                <div >
                    <p:messages id="curmsg" 
                                autoUpdate="true"
                                showDetail="true" 
                                rendered="true" closable="true"/>   
                </div>


                <div  id="firstLine" class="ui-g-12 ui-g-nopad">
                    <div class="ui-g">

                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel  style="width: 45px" value="رقم الحجز"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel  style="width: 48%!important" id="serialNo" value="#{invStripFormNewMB.invStripDTO.serial}"/>
                                </h:panelGroup>

                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>

                                <h:panelGroup>
                                    <p:outputLabel  style="width: 45px" value="#{userData.userDDs['DATE']}"/>
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:calendar  style="width: 48%!important"
                                                 requiredMessage="يجب ادخال تاريخ"  value="#{invStripFormNewMB.invStripDTO.stripDate}" pattern="dd/MM/yyyy" />
                                </h:panelGroup>

                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width: 45px" value="المخزن"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:autoComplete style="width:83%" 
                                                    dropdown="true"
                                                    readonly="#{invStripFormNewMB.invStripDTO.id != null}"
                                                    converter="#{invStripFormNewMB.invInventoryDTOConverter}"
                                                    value="#{invStripFormNewMB.invStripDTO.inventoryId}"
                                                    var="inventory"
                                                    itemLabel="#{inventory}" 
                                                    itemValue="#{inventory}" 
                                                    forceSelection="true" 
                                                    completeMethod="#{invStripFormNewMB.completeInventory}" >                                            
                                    </p:autoComplete>
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>

                                <h:panelGroup>
                                    <p:outputLabel style="width: 45px" value="مستند الجرد"/>
                                </h:panelGroup>
                                <h:panelGroup >
                                    <h:panelGroup>
                                        <p:inputText style="width: 48%!important"  id="stripDocument" value="#{invStripFormNewMB.invStripDTO.stripDocument}" />
                                    </h:panelGroup>
                                </h:panelGroup>

                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel  style="width: 40px"  value="#{userData.userDDs['NOTE']}"/>
                                </h:panelGroup>

                                <h:panelGroup>
                                    <p:inputText style="width: 70%!important"  id="ad11" value="#{invStripFormNewMB.invStripDTO.remarks}" />
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>
                    </div>
                </div>


            </p:fieldset>
            
            
                <h:panelGroup class="centerButtons"  style="margin-top: 2%">

                    <p:commandButton class="saveButton" id="saveB" 
                                     title="#{userData.userDDs['SAVE']}"
                                     disabled="#{invStripFormNewMB.invStripDTO.id != null}"
                                     value="#{userData.userDDs['SAVE']}"
                                     icon="fa fa-fw fa-save" 
                                     action="#{invStripFormNewMB.saveHead()}" 
                                     update="@form"/>

                    <p:commandButton  class="newButton"
                                      id="newN"
                                      ajax="false"
                                      icon="fa fa-fw fa-plus"
                                      title="#{userData.userDDs['NEW']}"
                                      value="#{userData.userDDs['NEW']}" 
                                      onclick="form.target = ''" 
                                      actionListener="#{invStripFormNewMB.reset()}"/>

                    <p:commandButton class="cancelButton" 
                                     id="cancel" 
                                     title="#{userData.userDDs['CANCEL']}" 
                                     value="#{userData.userDDs['CANCEL']}"
                                     icon="fa fa-fw fa-backward" 
                                     action="#{invStripFormNewMB.exit()}" 
                                     update="@form"/>
                    <h:commandLink style="float: left" class="sdcreenimg">  
                        <p:graphicImage name="/img/excel.jpg" width="24"/>  
                        <p:dataExporter type="xls"
                                        target="invStripTable" 
                                        fileName="جرد المخازن"
                                        postProcessor="#{invStripFormNewMB.postProcessXLS}" />  
                    </h:commandLink>

                    <p:blockUI block="form" trigger="saveB" animate="true" >

                        <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                    </p:blockUI> 
                </h:panelGroup>

            <p:fieldset  style="margin-bottom:20px">
                <p:dataTable var="invStripTable" paginator="true" rows="20"
                             widgetVar="invStripTable"
                             rowIndexVar="index"
                             rowKey="#{invStripTable}"
                             selectionMode="single"
                             selection="#{invStripFormNewMB.invStripDetailSelected}"
                             dir="rtl"
                             sortBy="#{1}"
                             emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                             editable="true"
                             editMode="cell"
                             value="#{invStripFormNewMB.invStripDetailList}"
                             id="invStripTable">

                    <f:facet name="header" class="col-md-12">
                        <p:commandButton  id="b7" icon="fa fa-plus" 
                                          class="saddbuttonins" 
                                          title="#{userData.userDDs['ADD']}" 

                                          actionListener="#{invStripFormNewMB.addInvDetail()}" 
                                          update="invStripTable"  
                                          immediate="true"
                                          oncomplete="PrimeFaces.focus('form:invStripTable:'+#{invStripFormNewMB.invStripDetailList.size()}+':invItemNameIn')"
                                          ajax="true" style="float:right" />

                        <p:outputPanel>
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" onkeyup="PF('invStripTable').filter()" style="width:150px" />
                        </p:outputPanel>
                    </f:facet>


                    <p:column style="width: 8vh;text-align: -webkit-auto;font-size: 1.8vh"   id="serail" 
                              headerText="#{userData.userDDs['SERIAL']}">
                        <h:outputText value="#{invStripTable.serial}"  />
                    </p:column>


                    <p:column style="width: 13vh;text-align: -webkit-auto;border-radius: 0px" id="itemName" headerText="#{userData.userDDs['ITEM']}" 
                              filterBy="#{invStripTable.itemsBarcodesDetail}" 
                              filterMatchMode="contains" 
                              sortBy="#{invStripTable.itemsBarcodesDetail}"
                              filterable="false">
                        <h:outputText 
                            rendered="#{invStripTable.id ne null}"
                            value="#{invStripTable.itemsBarcodesDetail.name}"  />
                        <p:autoComplete id="invItemNameIn"   rendered="#{invStripTable.id eq null}"
                                        style="width:100%"
                                        converter="#{autoComplete.itemsBarcodesDetailsViewConverter}"
                                        value="#{invStripTable.itemsBarcodesDetail}"
                                        maxResults="20"
                                        var="item"
                                        itemLabel="#{item}" 
                                        itemValue="#{item}" 
                                        forceSelection="true" 
                                        completeMethod="#{autoComplete.completeItemsBarcodesDetailsView}" >
                            <p:ajax event="itemSelect"  update="itemNaturalT" />
                        </p:autoComplete>            
                    </p:column>

                    <p:column  style="width: 12vh;text-align: -webkit-auto;font-size: 1.8vh"
                               id="itemNatural" headerText="طبيعة الصنف">

                        <h:outputText id="itemNaturalT" value="#{invStripTable.itemsBarcodesDetail.typeShow}"
                                      style="width:95%"/>


                    </p:column>
                    
                    
                     <p:column  style="width: 12vh;text-align: -webkit-auto;font-size: 1.8vh"
                               id="Quantity" headerText="جرد فعلى"
                               filterBy="#{invStripTable.actualQuantity}" 
                               filterMatchMode="contains" 
                               sortBy="#{invStripTable.actualQuantity}"
                               filterable="false">
                        <p:inputText id="QuantityT" value="#{invStripTable.actualQuantity}"
                                     style="width:95%">
                            <p:ajax   listener="#{invStripFormNewMB.hishis()}" />
                        </p:inputText>
                    </p:column>



                    <p:column  style="width: 12vh;text-align: -webkit-auto;font-size: 1.8vh"
                               id="wasalate" headerText="وصلات"

                               filterBy="#{invStripTable.wasalate}" 
                               filterMatchMode="contains" 
                               sortBy="#{invStripTable.wasalate}"
                               filterable="false">

                        <p:inputText id="wasalateT" value="#{invStripTable.wasalate}"
                                     style="width:95%">
                            <p:ajax event="blur"  update="@form" listener="#{invStripFormNewMB.validateActulQuantityColumNew(invStripTable)}" />
                        </p:inputText>


                    </p:column>

                    <p:column style="width: 6vh;text-align: -webkit-auto;font-size: 1.8vh" >
                        <p:commandButton  id="b8" icon="fa fa-plus" 
                                          class="saddbuttonins" style="color: #fff!important;background-color: #00BCD4"
                                          title="#{userData.userDDs['ADD']}" 

                                          actionListener="#{invStripFormNewMB.addInvDetail()}" 
                                          update="invStripTable"  
                                          immediate="true"
                                          oncomplete="PrimeFaces.focus('form:invStripTable:'+#{invStripFormNewMB.invStripDetailList.size()}+':invItemNameIn')"
                                          ajax="true" />

                        <p:commandButton class="sdeleteButton" update="invStripTable" title="#{userData.userDDs['DELETE']}"
                                         rendered="#{userData.userScreens['proworkorder'].edit or userData.isAdmin}"
                                         action="#{invStripFormNewMB.deleteInvDetailNew(invStripTable)}" icon="fa fa-remove" >

                            <p:confirm header="#{userData.userDDs['COFIGRATION']}"
                                       message="#{userData.userDDs['ARE_YOU_SURE']}"
                                       icon="ui-icon-alert" />
                        </p:commandButton>

                        <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                            <p:commandButton title="#{userData.userDDs['YES']}" type="button"
                                             styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                            <p:commandButton title="#{userData.userDDs['NO']}" type="button" 
                                             styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                        </p:confirmDialog>
                    </p:column >

                </p:dataTable>

            </p:fieldset>




        </h:form>
    </ui:define>
</ui:composition>
