<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/newTemplate.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">

        <style>

            .ui-widget-content .ui-state-default, .ui-widget-header .ui-state-default {
                border: 1px solid #c5dbec;
                background:#fff;

            }
            .ui-dialog {
                position: absolute !important;
                left: 1vw!important;
                top: 25vh!important;}
            </style>
            <f:event listener="#{userData.authorize}" type="preRenderView" />
            <h:form id="form" dir="#{userData.dir}" class='formmargin'>
            <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                  margin-top: 24%;
                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;"
                                  icon="fa fa-fw fa-home"
                                  title="#{userData.userDDs['HOME']}"
                                  class="smhomeButton" 
                                  action="exit" />

            </div>
            <div >
                <p:messages id="curmsg" autoUpdate="true" showDetail="true" rendered="true" closable="true"/>   
            </div>

            <p:fieldset legend="#{userData.userDDs['PURCHASE_ORDER']}"> 

                <div  id="firstSegment" class="ui-g-12 ui-g-nopad">

                    <div class="ui-g">
                        <h:panelGroup id="test">

                            <div class="ui-g-12 ui-md-6">
                                <h:panelGroup>

                                    <h:panelGroup>
                                        <p:outputLabel style="width: 95px; margin-right: 6%;" value="#{userData.userDDs['DATEE']}*"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:calendar id="dateFrom" 

                                                    value="#{invPurchaseOrderFormDTOMB.invInvoiceDTO.date}"
                                                    pattern="dd/MM/yyyy"
                                                    style="width:50%!important"/>
                                    </h:panelGroup>

                                </h:panelGroup>
                            </div>

                            <div class="ui-g-12 ui-md-6">

                                <h:panelGroup>

                                    <p:outputLabel style="width: 95px;margin-right: 6%;" id="purchId" value="#{userData.userDDs['SERIAL']}" />
                                    <p:inputText style="width: 37%" 
                                                 id="purchIdVal" readonly="true"
                                                 value="#{invPurchaseOrderFormDTOMB.invInvoiceDTO.serial}" />

                                </h:panelGroup>
                            </div>

                            <div class="ui-g-12 ui-md-4">

                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel style="width: 103px;margin-right: -44%;" value="#{userData.userDDs['PURCHASES_DELEGATE']}*"/>
                                    </h:panelGroup> 

                                    <h:panelGroup>
                                        <p:autoComplete style="width:56%!important " 
                                                        dropdown="true"
                                                        converter="#{invPurchaseOrderFormDTOMB.invDelegatorDTOConvertor}"
                                                        value="#{invPurchaseOrderFormDTOMB.invInvoiceDTO.invDelegatorId}"

                                                        var="purchasePerson"
                                                        itemLabel="#{purchasePerson}" 
                                                        itemValue="#{purchasePerson}" 
                                                        forceSelection="true" 
                                                        completeMethod="#{invPurchaseOrderFormDTOMB.completeDelegatorPurchase}"
                                                        >

                                        </p:autoComplete>
                                    </h:panelGroup> 
                                </h:panelGroup>
                            </div>

                            <div class="ui-g-12 ui-md-2">

                                <h:panelGroup id="currencyPanelGroup">

                                    <h:panelGroup>
                                        <p:outputLabel style="width: 100px; margin-right: -162%;" value="#{userData.userDDs['']}"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:inputText style="width: 30%" 
                                                     value="#{invPurchaseOrderFormDTOMB.invInvoiceDTO.currencyId.code}"/>
                                    </h:panelGroup>


                                </h:panelGroup>
                            </div>

                            <div class="ui-g-12 ui-md-2">
                                <h:panelGroup>
                                    <h:panelGroup id="exchangeRate">
                                        <p:outputLabel style="width: 100px; margin-right: -84%;" value="#{userData.userDDs['']}"/>
                                    </h:panelGroup>

                                    <h:panelGroup id="CurrencyRate">
                                        <p:inputText style="width: 30%"
                                                     value="#{invPurchaseOrderFormDTOMB.invInvoiceDTO.rate}"/>
                                    </h:panelGroup>
                                </h:panelGroup>

                            </div>

                            <div class="ui-g-12 ui-md-4">
                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel style="width: 99px;margin-right: 10%;" value="#{userData.userDDs['SUPPLIER']}*"/>
                                    </h:panelGroup> 
                                    <h:panelGroup>
                                        <p:autoComplete style="width:54%!important" 
                                                        dropdown="true"
                                                        converter="#{autoComplete.supplierConvertorFrom}"
                                                        value="#{invPurchaseOrderFormDTOMB.invInvoiceDTO.organizationSiteId}"

                                                        var="supplier"
                                                        itemLabel="#{supplier}" 
                                                        itemValue="#{supplier}" 
                                                        forceSelection="true" 
                                                        completeMethod="#{autoComplete.completeSupplierFrom}" 
                                                        >
                                            <p:ajax update="@form"
                                                    event="change"
                                                    process="@form"
                                                    listener="#{invPurchaseOrderFormDTOMB.putCurrency()}" />
                                            <p:ajax update="@form"
                                                    process="@form"
                                                    event="itemSelect"
                                                    listener="#{invPurchaseOrderFormDTOMB.putCurrency()}" />
                                        </p:autoComplete>
                                    </h:panelGroup> 

                                </h:panelGroup>
                            </div>








                            <div class="ui-g-12 ui-md-12">

                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel style="width: 95px; margin-right: 3%;" value="#{userData.userDDs['NOTE']}"/>
                                    </h:panelGroup>

                                    <h:panelGroup>
                                        <p:inputText style="width:69.5%"  value="#{invPurchaseOrderFormDTOMB.invInvoiceDTO.remarks}"
                                                     >
                                            <p:ajax listener="#{invPurchaseOrderFormDTOMB.updateSummition()}"/>
                                        </p:inputText>
                                    </h:panelGroup>
                                </h:panelGroup>
                            </div>
                        </h:panelGroup>
                    </div>
                </div>

            </p:fieldset>

            <p:fieldset id="fieldSetId" legend="#{userData.userDDs['DETA_OF_PUE_ORD']}"  style="margin:2% 0">


                <p:dataTable id="invPurchaseInvoiceDetailsTable"
                             widgetVar="invPurchaseInvoiceDetailsTable"
                             style="margin-bottom:20px"
                             var="invPurchaseInvoiceDetailsTable"
                             rowIndexVar="index" 
                             dir="rtl" 
                             emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                             editable="true"
                             editMode="cell"
                             selectionMode="single"
                             sortBy="#{1}"
                             rowKey="#{invPurchaseInvoiceDetailsTable.index}"
                             selection="#{invPurchaseOrderFormDTOMB.invInvoiceDTO.invPurchaseInvoiceDetailsSelected}"
                             value="#{invPurchaseOrderFormDTOMB.invInvoiceDTO.invPurchaseInvoiceDetailList}" >

                    <f:facet name="header" >
                        <p:commandButton  id="addnew"
                                          class="saddButton"
                                          icon="fa fa-plus"
                                          title="#{userData.userDDs['ADD']}" 

                                          actionListener="#{invPurchaseOrderFormDTOMB.addInvDetail()}" 
                                          update=":form:fieldSetId"  
                                          oncomplete="PrimeFaces.focus('form:invPurchaseInvoiceDetailsTable:'+#{invPurchaseOrderFormDTOMB.invInvoiceDTO.invPurchaseInvoiceDetailList.size()}+':invItemNameIn')"
                                          immediate="true"
                                          ajax="true"
                                          style="float:right"/>

                        <p:outputPanel>
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" onkeyup="PF('invPurchaseInvoiceDetailsTable').filter()" style="width:150px" />
                        </p:outputPanel>
                    </f:facet>

                    <p:column headerText="#" style="width: 4vh;text-align:center;border-radius: 0px" >
                        <h:outputText value="#{invPurchaseInvoiceDetailsTable.serial}"  />
                    </p:column>

                    <p:column style="width: 13vh;text-align: -webkit-auto;border-radius: 0px" id="itemName" headerText="#{userData.userDDs['ITEM']}" 
                              filterBy="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail}" 
                              filterMatchMode="contains" 
                              sortBy="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail}"
                              filterable="false">
                        <h:outputText 
                            rendered="#{not invPurchaseOrderFormDTOMB.columnRender}"
                            value="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail.name}"  />
                        <p:autoComplete id="invItemNameIn"  

                                        style="width:100%"
                                        converter="#{autoComplete.itemsBarcodesDetailsViewConverter}"
                                        value="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail}"
                                        maxResults="5"
                                        var="item"
                                        itemLabel="#{item}" 
                                        itemValue="#{item}" 
                                        forceSelection="true" 
                                        completeMethod="#{autoComplete.completeItemsBarcodesDetailsView}" >
                            <p:ajax update=" unitvalue length paintColor QuantityT WeightT costTt discountT netId totalQuantity totalWeight  totalNet  "
                                    event="itemSelect" listener="#{invPurchaseOrderFormDTOMB.validateItems(invPurchaseInvoiceDetailsTable)}" />

                        </p:autoComplete>            
                    </p:column>

                    <p:column  style="width: 13vh;text-align: -webkit-auto;border-radius: 0px" id="Unit"

                               filterBy="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail.unitName}" 
                               filterMatchMode="contains" 
                               sortBy="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail.unitName}"
                               filterable="false"
                               headerText="#{userData.userDDs['UNIT_NUMBER']}">
                        <p:inputText id="unitvalue" readonly="true" 
                                     disabled="true"
                                     value="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail.unitName}" style="width: 95%" />  

                    </p:column>

                    <p:column style="width: 12vh;text-align: -webkit-auto;border-radius: 0px" id="tall" headerText="الطول"
                              rendered="#{invPurchaseOrderFormDTOMB.invInvoiceDTO.companyActivity eq 'Alumetal'}"
                              filterBy="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail.length}" 
                              filterMatchMode="contains" 
                              sortBy="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail.length}"
                              filterable="false" >
                        <p:inputText style="width:99%" 
                                     disabled="true" 
                                     id="length" readonly="true"  
                                     value="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail.length}"/>
                    </p:column>

                    <p:column style="width: 12vh;text-align: -webkit-auto;border-radius: 0px" id="color" headerText="اللون"
                              rendered="#{invPurchaseOrderFormDTOMB.invInvoiceDTO.companyActivity eq 'Alumetal'}"
                              filterBy="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail.paintColorName}" 
                              filterMatchMode="contains" 
                              sortBy="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail.paintColorName}"
                              filterable="false" >
                        <p:inputText style="width:99%" 
                                     disabled="true" 
                                     id="paintColor" readonly="true"  
                                     value="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail.paintColorName}"/>
                    </p:column>


                    <p:column style="width: 13vh;text-align: -webkit-auto;border-radius: 0px"
                              id="Quantity"
                              headerText="#{userData.userDDs['NUMBER']}"
                              filterBy="#{invPurchaseInvoiceDetailsTable.quantity}" 
                              filterMatchMode="contains" 
                              sortBy="#{invPurchaseInvoiceDetailsTable.quantity}"
                              filterable="false">

                        <p:inputText id="QuantityT"  
                                     value="#{invPurchaseInvoiceDetailsTable.quantity}" 

                                     style="width:95%">
                            <p:ajax listener="#{invPurchaseOrderFormDTOMB.validateQuantityColum(invPurchaseInvoiceDetailsTable)}" 
                                    update="@form"/>
                        </p:inputText>        

                    </p:column>

                    <p:column style="width: 13vh;text-align: -webkit-auto;border-radius: 0px" 
                              rendered="#{invPurchaseOrderFormDTOMB.invInvoiceDTO.companyActivity eq 'Alumetal'}"
                              id="Weight"
                              headerText="#{userData.userDDs['WEIGHT']}"
                              filterBy="#{invPurchaseInvoiceDetailsTable.weight}" 
                              filterMatchMode="contains" 
                              sortBy="#{invPurchaseInvoiceDetailsTable.weight}"
                              filterable="false">

                        <p:inputNumber id="WeightT" decimalPlaces="3" disabled="true"
                                       value="#{invPurchaseInvoiceDetailsTable.weight}"  
                                       style="width:100%">
                        </p:inputNumber>
                    </p:column>

                    <p:column style="width: 12vh;text-align: -webkit-auto;border-radius: 0px" id="COST" headerText="#{userData.userDDs['PRICE']}"
                              filterBy="#{invPurchaseInvoiceDetailsTable.cost}" 
                              filterMatchMode="contains" 
                              sortBy="#{invPurchaseInvoiceDetailsTable.cost}"
                              filterable="false">
                        <p:inputText id="costTt" 
                                     value="#{invPurchaseInvoiceDetailsTable.cost}"

                                     style="width:95%">
                            <p:ajax listener="#{invPurchaseOrderFormDTOMB.validatePriceColumn(invPurchaseInvoiceDetailsTable)}" 
                                    update="invPurchaseInvoiceDetailsTable"/>
                        </p:inputText>       
                    </p:column>

                    <p:column style="width: 14vh;text-align: -webkit-auto;border-radius: 0px" id="DISCOUNT" headerText="#{userData.userDDs['DISCOUNT']}">
                        <p:inputText id="discountT" 
                                     value="#{invPurchaseInvoiceDetailsTable.discount}" 
                                     disabled="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail == null}"
                                     style="width:70%!important;display: inline!important">
                            <p:ajax listener="#{invPurchaseOrderFormDTOMB.validateDiscountColumn(invPurchaseInvoiceDetailsTable)}"
                                    update="invPurchaseInvoiceDetailsTable"/>
                        </p:inputText>  
                        <p:outputLabel value="%"  style="display: inline!important"  />
                    </p:column>


                    <p:column style="width: 13vh;text-align: -webkit-auto;border-radius: 0px" id="net" headerText="#{userData.userDDs['TOTAL']}" 
                              filterBy="#{invPurchaseInvoiceDetailsTable.net}" 
                              filterMatchMode="contains" 
                              sortBy="#{invPurchaseInvoiceDetailsTable.net}"
                              filterable="false">
                        <p:outputLabel id="netId" value="#{invPurchaseInvoiceDetailsTable.net}"   />
                    </p:column>

                    <p:summaryRow>
                        <p:column colspan="3" style="text-align:right">
                            <h:outputText style="text-align:right" value="#{userData.userDDs['TOTAL']}  :" />
                        </p:column>
                        <p:column>
                            <h:outputText id="totalQuantity" value="#{invPurchaseOrderFormDTOMB.invInvoiceDTO.totalQuatity}"/>
                        </p:column>
                        <p:column />
                        <p:column>
                            <h:outputText id="totalWeight" 
                                          rendered="#{invPurchaseOrderFormDTOMB.invInvoiceDTO.companyActivity eq 'Alumetal'}"
                                          value="#{invPurchaseOrderFormDTOMB.invInvoiceDTO.totalWeight}"/>
                        </p:column>
                        <p:column rendered="#{invPurchaseOrderFormDTOMB.invInvoiceDTO.companyActivity eq 'Alumetal'}" />
                        <p:column rendered="#{invPurchaseOrderFormDTOMB.invInvoiceDTO.companyActivity eq 'Alumetal'}" />
                        <p:column rendered="#{invPurchaseOrderFormDTOMB.invInvoiceDTO.companyActivity eq 'Alumetal'}" />
                        <p:column>
                            <h:outputText id="totalNet" value="#{invPurchaseOrderFormDTOMB.invInvoiceDTO.totalNet}"/>
                        </p:column>
                        <p:column />
                    </p:summaryRow>

                    <p:column 
                        style="width: 13vh;text-align: center;border-radius: 0px" 
                        headerText="#{userData.userDDs['TRANSACTION']}"
                        rendered="#{invPurchaseOrderFormDTOMB.columnRender}"
                        >

                        <p:commandButton  id="b7" icon="fa fa-plus" 
                                          class="saddbuttonins" style="color: #fff!important;background-color: #00BCD4"
                                          title="#{userData.userDDs['ADD']}" 

                                          actionListener="#{invPurchaseOrderFormDTOMB.addInvDetail()}" 
                                          update=":form:fieldSetId"  
                                          immediate="true"
                                          oncomplete="PrimeFaces.focus('form:invPurchaseInvoiceDetailsTable:'+#{invPurchaseOrderFormDTOMB.invInvoiceDTO.invPurchaseInvoiceDetailList.size()}+':invItemNameIn')"
                                          ajax="true" />

                        <p:commandButton  update="invPurchaseInvoiceDetailsTable netId totalQuantity  totalWeight  totalNet "
                                          title="#{userData.userDDs['DELETE']}" 
                                          class="sdeleteButtons" style="color: #fff!important;background-color: red"

                                          action="#{invPurchaseOrderFormDTOMB.deleteInvDetail(invPurchaseInvoiceDetailsTable)}"
                                          icon="fa fa-remove" >
                            <p:confirm header="#{userData.userDDs['COFIGRATION']}" 
                                       message="#{userData.userDDs['ARE_YOU_SURE']}"
                                       icon="ui-icon-alert" />
                        </p:commandButton>

                        <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                            <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                            <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                        </p:confirmDialog>
                    </p:column >

                </p:dataTable>

                <h:panelGrid  class="col-md-12" columns="1"  style="margin-top:2%">

                    <h:panelGroup  class="centerButtons">

                        <p:commandButton  id="saveB" 
                                          class="saveButtons"
                                          title="#{userData.userDDs['SAVE']}"
                                          value="#{userData.userDDs['SAVE']}" 

                                          style="color: #fff!important;background-color: #2196F3;margin-left: 5px" 
                                          action="#{invPurchaseOrderFormDTOMB.save()}"
                                          update="@form"/>

                        <p:commandButton 
                            id="newN"
                            ajax="false"
                            style="color: #fff!important;background-color: #9c27b0d1;margin-left: 5px"
                            value="#{userData.userDDs['NEW']}" 
                            class="newButtons"
                            onclick="form.target = ''" 
                            actionListener="#{invPurchaseOrderFormDTOMB.reset()}"/>


                        <p:commandButton  class="deleteButtons" 
                                          id="cancel" 
                                          title="#{userData.userDDs['CANCEL']}" 
                                          value="#{userData.userDDs['CANCEL']}" 
                                          style="color: #fff!important;background-color: #035C70;margin-left: 5px"  
                                          immediate="true"
                                          action="#{invPurchaseOrderFormDTOMB.exit()}" 
                                          update="@form"/>

                        <h:commandLink  style="float:left" class="sdcreenimg">  
                            <p:graphicImage name="/img/excel.jpg" width="24" style='margin-right:25%;'/>  
                            <p:dataExporter type="xls"
                                            target="invPurchaseInvoiceDetailsTable" 
                                            fileName="طلب الشراء" preProcessor="#{invPurchaseOrderFormDTOMB.preProcessXLS()}"
                                            postProcessor="#{invPurchaseOrderFormDTOMB.postProcessXLS}" />  
                        </h:commandLink>

                        <p:blockUI block="form" trigger="saveB" animate="true" >

                            <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                        </p:blockUI> 


                    </h:panelGroup>

                </h:panelGrid>
            </p:fieldset>
        </h:form>


        <script>

            document.addEventListener("keydown", function (e) {
                console.log(e.which);
                if (e.which === 13) {
                    e.preventDefault();
                    return false;
                }
                ;
            });

        </script>
    </ui:define>
</ui:composition>
