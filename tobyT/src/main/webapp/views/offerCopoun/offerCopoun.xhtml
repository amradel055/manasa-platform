<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml">
    <ui:define name="content">
        <h:form id="form" enctype="multipart/form-data" dir="#{userData.dir}" style="margin-right: 20px">

            <p:fieldset  legend="ادخل عرض جديده" id="newOfferCompany"  style="margin-bottom:20px">
                <div id="newOferCompany" class="form-group col-md-12">

                    <p:fileUpload value="#{offerCopounMB.offerCompanyFile}" mode="simple" onstart="disableChoosing()" 
                                  oncomplete="enableChoosing()" />
                </div>

                <div class="form-group col-md-12">
                    <p:commandButton id="btnnewOOferCompany"  actionListener="#{offerCopounMB.readOfferCopoun()}" ajax="false" value="تحميل">
                        <f:ajax execute="@all" render="@form"/>
                        <p:ajax/>
                    </p:commandButton>
                </div>







            </p:fieldset>

            <p:fieldset  legend="انشاء كوبونات الراجحي" id="raghiCopoun"  style="margin-bottom:20px">
                <div class="ui-g-12 ui-xl-12">
                    <div class="ui-g-6 ui-xl-6">
                        <p:inputText id="number"  style="width:100%" value="#{offerCopounMB.offerCopounDTOSearch.number}" />
                    </div>
                    <div class="ui-g-6 ui-xl-6">
                        <p:outputLabel for="searchBySerial" style="width: 95px;"  value="عدد الكوبونات الراجحي" />
                    </div>
                </div>
                
                <div class="ui-g-12 ui-xl-12">
                    <div class="ui-g-6 ui-xl-6">
                        <p:inputText id="discounttype"  style="width:100%" value="#{offerCopounMB.offerCopounDTOSearch.discountType}" />
                    </div>
                    <div class="ui-g-6 ui-xl-6">
                        <p:outputLabel for="searchBySerial" style="width: 95px;"  value="نوع الخصم" />
                    </div>
                </div>
                
                <div class="ui-g-12 ui-xl-12">
                    <div class="ui-g-6 ui-xl-6">
                        <p:inputText id="discountValue"  style="width:100%" value="#{offerCopounMB.offerCopounDTOSearch.discountValue}" />
                    </div>
                    <div class="ui-g-6 ui-xl-6">
                        <p:outputLabel for="searchBySerial" style="width: 95px;"  value="قيمة الخصم" />
                    </div>
                </div>
                
                <div class="ui-g-12 ui-xl-12">
                    <div class="ui-g-6 ui-xl-6">
                        <p:inputText id="searchBySerial"  style="width:100%" value="#{offerCopounMB.offerCopounDTOSearch.gallaryType}" />
                    </div>
                    <div class="ui-g-6 ui-xl-6">
                        <p:outputLabel for="searchBySerial" style="width: 95px;"  value="نوع المعرض" />
                    </div>
                </div>
                
                <div class="form-group col-md-12">
                    <p:commandButton id="raghiCode"  actionListener="#{offerCopounMB.raghiGenerateCode()}" ajax="false" value="انشاء أكواد"/>
                </div>
            </p:fieldset>
            <p:blockUI block="form" trigger=" " animate="true" >

                <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>
            </p:blockUI>

            <p:dialog header="رسالة" widgetVar="sucesses" minHeight="40">
                <h:outputText value="تم الحفظ بنجاح" />
            </p:dialog>
        </h:form>
    </ui:define>
</ui:composition>
