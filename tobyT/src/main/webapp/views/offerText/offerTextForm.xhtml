<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">

        <h:form class='formmargin' id="form"  enctype="multipart/form-data"  dir="#{userData.dir}">

            <p:fieldset legend="انشاء رسالة نصية"  style="margin-bottom:20px">


                <div class="col-xs-12">
                    <p:messages autoUpdate="true"  id="msgopp" showDetail="true" closable="true" />
                </div>
                <div  id="firstLine" class="ui-g-12 ui-g-nopad">
                    <div class="ui-g">

                        <div class="ui-g-6 ui-xl-6">


                            <div class="ui-g-12 ui-xl-12">

                                <div class="ui-g-6 ui-xl-6">
                                    <p:inputText style="width: 35%!important" id="ad1" value="#{offerTextFormBean.offerTextDTO.text}"/>

                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 85px;" value="العرض"/>

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:calendar style="width: 50%"  id="dateFrom1"
                                                value="#{offerTextFormBean.offerTextDTO.dateFrom}"
                                                pattern="dd/MM/yyyy"  showButtonPanel="true" >
                                    </p:calendar>
                                </div>
                                <div class="ui-g-6 ui-xl-6">

                                    <p:outputLabel style="width: 50px"  value="من تاريخ" />

                                </div>
                            </div>
                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:calendar style="width: 50%"  id="dateTo"
                                                value="#{offerTextFormBean.offerTextDTO.dateTo}"
                                                pattern="dd/MM/yyyy"  showButtonPanel="true" >
                                    </p:calendar>
                                </div>
                                <div class="ui-g-6 ui-xl-6">

                                    <p:outputLabel style="width: 50px"  value="الى تاريخ" />

                                </div>
                            </div>

                            <div class="ui-g-12 ui-xl-12">
                                <div class="ui-g-6 ui-xl-6">
                                    <p:autoComplete style="width:37%"  id="gallaryDTO" widgetVar="gallaryDTO"
                                                    dropdown="true"
                                                    converter="#{autoComplete.invInventoryDTOConverter}"
                                                    value="#{offerTextFormBean.offerTextDTO.galaryDTO}"
                                                    var="gallaryDTO" 
                                                    itemLabel="#{gallaryDTO}" 
                                                    itemValue="#{gallaryDTO}" 
                                                    forceSelection="true" 
                                                    completeMethod="#{autoComplete.completeGallaryDTO}" >
                                    </p:autoComplete>
                                </div>
                                <div class="ui-g-6 ui-xl-6">
                                    <p:outputLabel style="width: 100px;" value="المعرض"/>

                                </div>
                            </div>


                        </div>
                    </div>                        
                </div>


            </p:fieldset>

            <div class="asmaa" style="text-align: center">
                <p:commandButton  class="saveButton"  
                                  id="saveB" 
                                  title="#{userData.userDDs['SAVE']}"
                                  value="#{userData.userDDs['SAVE']}" 
                                  style=""
                                  action="#{offerTextFormBean.save()}" 
                                  update="@form"/>

                <p:commandButton  class="newButton" 
                                  id="newN"
                                  ajax="false"
                                  style=""
                                  value="#{userData.userDDs['NEW']}" 
                                  title="#{userData.userDDs['NEW']}"
                                  onclick="form.target = ''" 
                                  actionListener="#{offerTextFormBean.reset()}"/>

                <p:commandButton class="closeButton" 
                                 title="#{userData.userDDs['BACK']}" 
                                 immediate="true" 
                                 value="#{userData.userDDs['BACK']}" 
                                 style="" 
                                 action="#{offerTextFormBean.exit()}"   />



                <p:blockUI block="form" trigger="saveB" animate="true" >

                    <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                </p:blockUI> 

            </div>
        </h:form>
    </ui:define>
</ui:composition>
