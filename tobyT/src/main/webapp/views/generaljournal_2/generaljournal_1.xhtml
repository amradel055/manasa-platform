<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/template.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns="http://www.w3.org/1999/xhtml" >
    <script src="http://code.jquery.com/jquery-latest.min.js"></script>

    <ui:define name="content">
        <h:form id="form" dir="rtl" style="margin-right: 20px">
            <p:fieldset legend="#{userData.userDDs['GENERAL_JOURNAL']}" style="margin-bottom: 20px">
                <div>
                    <p:messages autoUpdate="true"  id="msg" showDetail="true" closable="true" rendered="false" />
                </div>
                <div >
                    <p:commandButton class="scloseButton" style="float: left;margin-top: 3px" icon="fa fa-fw fa-backward"    action="exit"  immediate="true"/>
                </div>

                <script>
                    window.thisPage = window.thisPage || {};
                    window.thisPage.isDirty = false;

                    window.thisPage.closeEditorWarning = function (event) {
                        if (window.thisPage.isDirty)
                            return 'It looks like you have been editing something' +
                                    ' - if you leave before saving, then your changes will be lost.'
                        else
                            return undefined;
                    };

                    $("form").on('keyup', 'textarea', 'itemSelect', // You can use input[type=text] here as well.
                            function () {
                                window.thisPage.isDirty = true;
                            });

                    $("form").on('keyup', 'input[type=text]', 'select', // You can use input[type=text] here as well.
                            function () {
                                window.thisPage.isDirty = true;
                            });

                    $("form").submit(function () {
                        QC.thisPage.isDirty = false;
                    });
                    window.onbeforeunload = window.thisPage.closeEditorWarning;
                </script>

                <p:dialog modal="true"
                          position='center,center'
                          minHeight="40" minWidth="100"
                          header="نحذير" widgetVar="dlg1"  
                          dynamic="true">

                    <h:outputText value="هل تريد تجاهل التغييرات"  />

                    <p:panelGrid></p:panelGrid>


                    <p:commandButton  class="" title="#{userData.userDDs['NO']}" 
                                      value="#{userData.userDDs['NO']}" 
                                      action="#{generalJournalBean_new2.changeRowSelectedCancel()}"
                                      icon="fa fa-fw fa-cancel" 
                                      update="@form"
                                      onclick="PF('dlg1').hide();" />

                    <p:commandButton  class="ssaveButton" id="saveIm"
                                      title="#{userData.userDDs['YES']}" 
                                      value="#{userData.userDDs['YES']}"
                                      action ="#{generalJournalBean_new2.changeRowSelectedOk()}"
                                      icon="fa fa-fw fa-save"
                                      validateClient="true" 
                                      onclick="PF('dlg1').hide();"
                                      update="@form" />
                </p:dialog> 


                <div class="ui-g-6 ui-xl-6">
                    <div class="ui-g-6 ui-xl-6" >
                        <h:outputText style="font-size: 1.2vh" value="#{generalJournalBean_new2.selectedGeneralJournal.serial}" /> 
                    </div>
                    <div class="ui-g-6 ui-xl-6">
                        <p:outputLabel   value="#{userData.userDDs['GENERAL_NUMBER']}"/>
                    </div>
                </div>

                <div class="ui-g-6 ui-xl-6">
                    <div class="ui-g-6 ui-xl-6" >
                        <p:calendar  style="display:block;width: 100% " id="date"  value="#{generalJournalBean_new2.selectedGeneralJournal.generalData}" pattern="dd/MM/yyyy"  /> 
                    </div>
                    <div class="ui-g-6 ui-xl-6">
                        <p:outputLabel   value="#{userData.userDDs['GENERAL_DATE']}"/>
                    </div>
                </div>

                <div class="ui-g-6 ui-xl-6">
                    <div class="ui-g-6 ui-xl-6" >
                        <p:selectOneMenu id="acc2" filter="true" filterMatchMode="contains" value="#{generalJournalBean_new2.selectedDocumentsType}"   >
                            <p:ajax listener="#{generalJournalBean_new2.ondocumentsTypesChange}" update="generaldocument" />
                            <f:selectItems value="#{generalJournalBean_new2.documentsTypes}"  var="doc" itemLabel="#{doc.name}" itemValue="#{doc.id}"/>
                        </p:selectOneMenu>
                    </div>
                    <div class="ui-g-6 ui-xl-6">
                        <p:outputLabel for="acc2"  value="#{userData.userDDs['GERNAL_TYPE']}"/>
                    </div>
                </div>

                <div class="ui-g-6 ui-xl-6">
                    <div class="ui-g-6 ui-xl-6" >
                        <h:outputText id="generaldocument" value="#{generalJournalBean_new2.selectedGeneralJournal.generalDecument}" />
                    </div>
                    <div class="ui-g-6 ui-xl-6">
                        <p:outputLabel for="generaldocument"  value="#{userData.userDDs['GERNAL_DECUMENT']}"/>
                    </div>
                </div>
                <div class="ui-g-6 ui-xl-6">
                    <div class="ui-g-6 ui-xl-6" >
                        <p:inputTextarea style="font-size: 1.2vh" value="#{generalJournalBean_new2.selectedGeneralJournal.generalStatement}" />
                    </div>
                    <div class="ui-g-6 ui-xl-6">
                        <p:outputLabel   value="#{userData.userDDs['GERNAL_STATEMENT']}"/>
                    </div>
                </div>

                <div class="ui-g-6 ui-xl-6">
                    <div class="ui-g-6 ui-xl-6" >
                        <p:selectOneMenu style="width: 100%" converter="#{generalJournalBean_new2.glAccountDTOConverter}"
                                         filter="true" filterMatchMode="contains"
                                         id="acc" value="#{generalJournalBean_new2.detail.glACCOUNTId}"
                                         >

                            <f:selectItem itemLabel="#{userData.userDDs['CHOOSE']}" 
                                          itemValue="" 
                                          noSelectionOption="true" />
                            <f:selectItems value="#{generalJournalBean_new2.glAccounts}" 
                                           var="acc" 
                                           itemLabel="#{acc}" 
                                           itemValue="#{acc}"/>

                        </p:selectOneMenu>
                    </div>
                    <div class="ui-g-6 ui-xl-6">
                        <p:outputLabel  value="#{userData.userDDs['ACCOUNT']}"/>
                    </div>
                </div>

                <div class="ui-g-6 ui-xl-6">
                    <div class="ui-g-6 ui-xl-6" >
                        <p:selectOneMenu style="width:70px; float:right" 
                                         converter="#{generalJournalBean_new2.costCenterDTOConverter}"
                                         filter="true" 
                                         filterMatchMode="contains" 
                                         id="cost1" 
                                         value="#{generalJournalBean_new2.detail.costCenterId}" 
                                         >

                            <p:ajax listener="#{generalJournalBean_new2.onCostCenterChange()}" />

                            <f:selectItem itemLabel="#{userData.userDDs['CHOOSE']}" id="cost" itemValue="" noSelectionOption="true" />

                            <f:selectItems value="#{generalJournalBean_new2.costCenterList}" 
                                           var="cost" itemLabel="#{cost.name}"
                                           itemValue="#{cost}"/>
                        </p:selectOneMenu>
                    </div>
                    <div class="ui-g-6 ui-xl-6">
                        <p:outputLabel value="#{userData.userDDs['SINGLE_COST_CENTER']}"/>
                    </div>
                </div>

                <div class="ui-g-6 ui-xl-6">
                    <div class="ui-g-6 ui-xl-6" >
                        <p:selectOneMenu filter="true" 
                                         filterMatchMode="contains"
                                         id="com1"  
                                         value="#{generalJournalBean_new2.detail.adminUnitId.id}" 
                                         style="width:65px"
                                         rendered="#{gendetails.markEdit}">
                            <p:ajax listener="#{generalJournalBean_new2.onAdminUnitChange()}" />
                            <f:selectItem itemLabel="#{userData.userDDs['CHOOSE']}" id="com"
                                          itemValue="#{-1}" noSelectionOption="true"  />

                            <f:selectItems value="#{generalJournalBean_new2.glAdminunitlist}"  
                                           var="Admin" itemLabel="#{Admin.name}"
                                           itemValue="#{Admin.id}"/>
                        </p:selectOneMenu>
                    </div>
                    <div class="ui-g-6 ui-xl-6">
                        <p:outputLabel   value="#{userData.userDDs['ADMIN_UNIT']}"/>
                    </div>
                </div>
                <div class="ui-g-6 ui-xl-6">
                    <div class="ui-g-6 ui-xl-6" >
                        <p:inputNumber style="width:70%"
                                       id="debit" 
                                       value="#{generalJournalBean_new2.detail.debitAmount}"
                                       valueChangeListener="#{generalJournalBean_new2.debitRender}" 
                                       >
                            <p:ajax update="credit" />
                        </p:inputNumber>
                    </div>
                    <div class="ui-g-6 ui-xl-6">
                        <p:outputLabel  value="#{userData.userDDs['DEBIT_AMOUNT']}"/>
                    </div>
                </div>
                <div class="ui-g-6 ui-xl-6">
                    <div class="ui-g-6 ui-xl-6" >
                        <p:inputNumber 
                            style="width:100%"
                            id="credit"
                            value="#{generalJournalBean_new2.detail.creditamount}" 
                            valueChangeListener="#{generalJournalBean_new2.creditRender}" 
                            >
                            <p:ajax update="debit" />

                        </p:inputNumber>
                    </div>
                    <div class="ui-g-6 ui-xl-6">
                        <p:outputLabel  value="#{userData.userDDs['CREDIT_AMOUNT']}"/>
                    </div>
                </div>

                <div class="ui-g-6 ui-xl-6">
                    <div class="ui-g-6 ui-xl-6" >
                        <p:inputText style="width: 100%"  onclick="myFunction()" id="Desc" value="#{generalJournalBean_new2.detail.discribtion}" />
                    </div>
                    <div class="ui-g-6 ui-xl-6">
                        <p:outputLabel  value="#{userData.userDDs['DESCRIBTION']}"/>
                    </div>
                </div>

                <div class="ui-g-12 ui-xl-12">
                    <p:commandButton  class="ssaveButton" id="b5" icon="fa fa-check " 
                                      title="إضافة"  
                                      action="#{generalJournalBean_new2.onAddDetails()}"
                                      update="generalDetails"/>

                   

                    <p:commandButton  class="saveallButton" id="b33" title="#{userData.userDDs['SAVE_ALL']}"  value="#{userData.userDDs['SAVE_ALL']}" 
                                      style="float:left;width: 85px;"
                                      action="#{generalJournalBean_new2.savegeneraljournaldetails()}" icon="fa fa-fw fa-save" 
                                      update="@form" />

                    <p:commandButton   class="ssaveButton" update="@form" 
                                       title="#{userData.userDDs['SAVE']}"
                                       action="#{generalJournalBean_new2.save()}" 
                                       icon="fa fa-fw fa-save"  >
                        <f:setPropertyActionListener value="#{general}" target="#{generalJournalBean_new2.selectedGeneralJournal}" />
                    </p:commandButton>
                </div>

            </p:fieldset>

            <p:fieldset id="generalDetailsFeildSet" legend="#{userData.userDDs['GENERAL_JOURNAL_DETAILS']}">
                <div class="col-xs-12">
                    <p:messages autoUpdate="true"  id="msg2" showDetail="true" closable="true" rendered="true" />
                </div>

                <p:dataTable id="generalDetails" 
                             draggableColumns="true" 
                             widgetVar="generalJournalDetailstable"                         

                             rowIndexVar="index"
                             var="gendetails" 
                             dir="rtl" 
                             selection="#{generalJournalBean_new2.details}"
                             rowKey="#{gendetails.id} #{gendetails.index}" 
                             value="#{generalJournalBean_new2.detailsList}" 
                             stickyHeader="#{generalJournalBean_new2.stickyHeader}"

                             emptyMessage="#{userData.userDDs['EMPTY_TABLE']}">

                    <p:ajax event="rowSelectCheckbox"
                            process="@form"
                            listener="#{generalJournalBean_new2.onRowSelectDetails}"
                            update="form"/>

                    <p:ajax event="rowUnselectCheckbox"
                            process="@form"
                            listener="#{generalJournalBean_new2.onRowUnselect()}"
                            update="form"/>

                    <f:facet name="header">
                        <p:commandButton id="b2" icon="fa fa-plus"
                                         class="saddButton"
                                         title="#{userData.userDDs['ADD']}"
                                         actionListener="#{generalJournalBean_new2.adddetails}"
                                         style="float:right" 
                                         update="generalDetails" ajax="true" 
                                         rendered="#{generalJournalBean_new2.glYearDTOSelection.openning eq 0 
                                                     or generalJournalBean_new2.glYearDTOSelection.openning eq null}"
                                         disabled="#{generalJournalBean_new2.selectedGeneralJournal.post_flag or generalJournalBean_new2.modifyJournalAbility}"/>



                        <p:commandButton class="deleteButton" id="b4" 
                                         value="#{userData.userDDs['DELETE']}" 
                                         style="float:left;width: 60px"
                                        
                                         action="#{generalJournalBean_new2.deleteAll}" icon="fa fa-fw fa-remove" update="@form"
                                         >

                            <p:confirm header="#{userData.userDDs['COFIGRATION']}" message="#{userData.userDDs['ARE_YOU_SURE']}" icon="ui-icon-alert" />
                        </p:commandButton>


                        <p:outputPanel >
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large"/>
                            <p:inputText id="globalFilter" onkeyup="PF('generalJournalDetailstable').filter()" style="width:150px" />
                        </p:outputPanel>
                    </f:facet>

                    <p:column  selectionMode="multiple" toggleable="false" style="width:.5vh;background-color: #fff;padding-left:2.5vh;padding-right:0px"  />

                    <p:column style="width: .5vh;font-size: 1.4vh;text-align: center" headerText="#" >
                        <h:outputText value="#{gendetails.serial}" style="font-size: 1.2vh" />
                    </p:column>

                    <p:column style="width: 8vh;font-size: 1.2vh;text-align: center"
                              filterStyle="display:none" 
                              filterBy="#{gendetails.glACCOUNTId.accNumber}"  filterable="true"
                              filterMatchMode="contains" 
                              headerText="#{userData.userDDs['ACCOUNT']}">

                        <h:outputText style="font-size: 1.1vh;font-weight:bold"
                                      value="#{gendetails.glACCOUNTId.accNumber} #{gendetails.glACCOUNTId.name}" 
                                      rendered="#{not gendetails.markEdit}"/>                    

                        <p:selectOneMenu style="width: 100%"
                                         filter="true" filterMatchMode="contains"
                                         id="acc3" value="#{gendetails.glACCOUNTId.id}"
                                         rendered="#{gendetails.markEdit}">

                            <f:selectItem itemLabel="#{userData.userDDs['CHOOSE']}" 
                                          itemValue="" 
                                          noSelectionOption="true" />
                            <f:selectItems value="#{generalJournalBean_new2.glAccounts}" 
                                           var="acc3" 
                                           itemLabel="#{acc3}" 
                                           itemValue="#{acc3.id}"/>

                        </p:selectOneMenu>
                    </p:column>

                    <p:column id="com2" filterStyle="display:none" 
                              style="width: 5vh;font-size: 1.4vh;text-align: center"

                              filterBy="#{gendetails.costCenterId.code}"
                              filterMatchMode="contains" 
                              headerText="#{userData.userDDs['SINGLE_COST_CENTER']}">

                        <h:outputText
                            value="#{gendetails.costCenterId}"
                            rendered="#{not gendetails.markEdit}"/>

                        <p:selectOneMenu style="width:70px; float:right"
                                         filter="true" filterMatchMode="contains" 
                                         id="cost1" 
                                         value="#{gendetails.costCenterId.id}" 
                                         rendered="#{ gendetails.markEdit}">

                            <p:ajax listener="#{generalJournalBean_new2.onCostCenterChange()}" />

                            <f:selectItem itemLabel="#{userData.userDDs['CHOOSE']}" id="cost" 
                                          itemDisabled="#{not generalJournalBean_new2.disableCC}"
                                          itemValue="#{-1}" noSelectionOption="true" />

                            <f:selectItems value="#{generalJournalBean_new2.costCenterList}" 
                                           var="cost" itemLabel="#{cost}"
                                           itemValue="#{cost.id}"/>
                        </p:selectOneMenu>
                    </p:column>

                    <p:column filterStyle="display:none"
                              style="width: 8vh;font-size: 1.4vh;text-align: center"

                              filterBy="#{gendetails.adminUnitId.code}" 
                              filterMatchMode="contains" 
                              headerText="#{userData.userDDs['ADMIN_UNIT']}">

                        <h:outputText style="width: 100%"
                                      value="#{gendetails.adminUnitId.code}"
                                      rendered="#{not gendetails.markEdit}"/> 
                        <p:selectOneMenu filter="true" 
                                         filterMatchMode="contains"
                                         id="com1"  
                                         value="#{gendetails.adminUnitId.id}" 
                                         style="width:65px"
                                         rendered="#{gendetails.markEdit}">
                            <p:ajax listener="#{generalJournalBean_new2.onAdminUnitChange()}" />
                            <f:selectItem itemLabel="#{userData.userDDs['CHOOSE']}" id="com"
                                          itemDisabled="#{not generalJournalBean_new2.disableAdminU}"
                                          itemValue="#{-1}" noSelectionOption="true"  />

                            <f:selectItems value="#{generalJournalBean_new2.glAdminunitlist}"  
                                           var="Admin" itemLabel="#{Admin.name}"
                                           itemValue="#{Admin.id}"/>
                        </p:selectOneMenu>
                    </p:column>

                    <p:column style="width: 6vh;font-size: 1.4vh;text-align: center" filterStyle="display:none" 

                              filterBy="#{gendetails.debitAmount}" 
                              filterMatchMode="contains"
                              headerText="#{userData.userDDs['DEBIT_AMOUNT']}">

                        <h:outputText style="width: 90%"
                                      value="#{gendetails.debitAmount}" rendered="#{not gendetails.markEdit}"/>

                        <p:inputNumber style="width:70%"
                                       id="debit" 
                                       value="#{gendetails.debitAmount}"
                                       valueChangeListener="#{generalJournalBean_new2.debitRender}"
                                       disabled="#{generalJournalBean_new2.debitDisabled}" 
                                       rendered="#{ gendetails.markEdit}" 
                                       >
                            <p:ajax update="credit" />
                        </p:inputNumber>
                    </p:column>

                    <p:column style="width: 6vh;font-size: 1.4vh;text-align: center"  filterStyle="display:none"
                              filterBy="#{gendetails.creditamount}" 
                              filterMatchMode="contains" 
                              headerText="#{userData.userDDs['CREDIT_AMOUNT']}">

                        <h:outputText   value="#{gendetails.creditamount}"

                                        rendered="#{not gendetails.markEdit}"/>

                        <p:inputNumber 
                            style="width:100%"
                            id="credit"
                            value="#{gendetails.creditamount}" 
                            disabled="#{generalJournalBean_new2.creditDisabled}"
                            valueChangeListener="#{generalJournalBean_new2.creditRender}" 
                            rendered="#{gendetails.markEdit}"  >
                            <p:ajax update="debit" />

                        </p:inputNumber>
                    </p:column>

                    <p:column style="width: 15vh;font-size: 1.4vh;text-align: center"  headerText="#{userData.userDDs['DESCRIBTION']}">
                        <h:outputText style="width: 100%" value="#{gendetails.discribtion}" rendered="#{not gendetails.markEdit}"/>
                        <p:inputText style="width: 100%"  onclick="myFunction()" id="Desc" value="#{gendetails.discribtion}" rendered="#{gendetails.markEdit}"/>
                    </p:column>

                    <p:columnGroup type="footer">
                        <p:row>
                            <p:column   footerText=""  style="width:2vh;background-color: #fff;padding-left:2.5vh;padding-right:0px"  />
                            <p:column   footerText="" /> 
                            <p:column   footerText="" /> 
                            <p:column   footerText="#{userData.userDDs['TOTAL']} " />


                            <p:column   footerText="" />
                            <p:column   footerText="#{generalJournalBean_new2.summaryCreditString}"  style="font-size: 1.2vh !important"/>
                            <p:column   footerText="#{generalJournalBean_new2.summaryDebitString}" style="font-size: 1.2vh !important" />
                            <p:column   footerText="#{userData.userDDs['DIFFERENCE']}" />
                            <p:column   footerText="#{generalJournalBean_new2.difference}" />

                        </p:row>
                    </p:columnGroup>

                    <p:column style="width: 10vh;font-size: 1.4vh;text-align: center" >

                        <p:commandButton  class="ssaveButton" id="b5" icon="fa fa-check " 
                                          title="#{userData.userDDs['SAVE']}"  
                                          action="#{generalJournalBean_new2.confirm}"
                                          update="generalDetails"
                                          rendered="#{(gendetails.markEdit)
                                                      and ( generalJournalBean_new2.glYearDTOSelection.openning eq 0 
                                                      or generalJournalBean_new2.glYearDTOSelection.openning eq null)}" 
                                          disabled="#{generalJournalBean_new2.selectedGeneralJournal.post_flag or generalJournalBean_new2.modifyJournalAbility}" >
                            <f:setPropertyActionListener value="#{gendetails}"
                                                         target="#{generalJournalBean_new2.detail}"  />
                        </p:commandButton>

                        <p:commandButton   class="sreloadButton" update="generalDetails" title="#{userData.userDDs['RELOAD']}" 
                                           rendered="#{(gendetails.markEdit) and (generalJournalBean_new2.glYearDTOSelection.openning eq 0 or generalJournalBean_new2.glYearDTOSelection.openning eq null)}"
                                           action="#{generalJournalBean_new2.reloadDetails()}" icon="fa fa-fw fa-undo"   
                                           disabled="#{generalJournalBean_new2.selectedGeneralJournal.post_flag}">
                            <f:setPropertyActionListener value="#{gendetails}" target="#{generalJournalBean_new2.detail}" />
                        </p:commandButton>

                        <p:commandButton   class="seditButton"  title="#{userData.userDDs['EDIT']}" 
                                           rendered="#{(not gendetails.markEdit ) and (generalJournalBean_new2.glYearDTOSelection.openning eq 0 or generalJournalBean_new2.glYearDTOSelection.openning eq null)}"
                                           action="#{generalJournalBean_new2.editgeneraldetails()}" icon="fa fa-fw fa-edit" 
                                           update="generalDetails" 
                                           disabled="#{(gendetails.markDisable) or generalJournalBean_new2.selectedGeneralJournal.post_flag or generalJournalBean_new2.modifyJournalAbility}" >
                            <f:setPropertyActionListener value="#{gendetails}" target="#{generalJournalBean_new2.detail}"  />
                        </p:commandButton>

                        <p:commandButton class="saddButton" id="b7" icon="fa fa-plus" title="#{userData.userDDs['ADD']}" 
                                         rendered="#{(not gendetails.markEdit) and( generalJournalBean_new2.glYearDTOSelection.openning eq 0 or generalJournalBean_new2.glYearDTOSelection.openning eq null)}"
                                         actionListener="#{generalJournalBean_new2.adddetails}" 
                                         update=":form:generalDetails" ajax="true" 
                                         disabled="#{(gendetails.markDisable) or generalJournalBean_new2.selectedGeneralJournal.post_flag or generalJournalBean_new2.modifyJournalAbility}" />


                        <p:commandButton  class="sreloadButton" update=":form" title="نسخ"
                                          action="#{generalJournalBean_new2.repeatGeneralJournalDetail}" 
                                          icon="fa fa-fw fa-copy" ajax="true" 
                                          rendered="#{(not gendetails.markEdit) and (generalJournalBean_new2.glYearDTOSelection.openning eq 0 or generalJournalBean_new2.glYearDTOSelection.openning eq null)}"                                       
                                          disabled="#{(gendetails.markDisable) or generalJournalBean_new2.selectedGeneralJournal.post_flag or generalJournalBean_new2.modifyJournalAbility}">
                            <f:setPropertyActionListener value="#{gendetails}" target="#{generalJournalBean_new2.journalDetailSelected}" />
                        </p:commandButton>

                    </p:column >

                    <f:facet name="footer"  >
                        <p:commandButton  icon="fa fa-plus"
                                          class="saddButton"
                                          title="#{userData.userDDs['ADD']}"
                                          actionListener="#{generalJournalBean_new2.adddetails}"
                                          style="float:right" 
                                          update="generalDetails" ajax="true" 
                                          rendered="#{(generalJournalBean_new2.stickyHeader) and ( generalJournalBean_new2.glYearDTOSelection.openning eq 0 or generalJournalBean_new2.glYearDTOSelection.openning eq null)}"
                                          disabled="#{generalJournalBean_new2.selectedGeneralJournal.post_flag or generalJournalBean_new2.modifyJournalAbility}" />

                        <p:commandButton  title="#{userData.userDDs['SAVE_ALL']}"  value="#{userData.userDDs['SAVE_ALL']}" style="float:left"
                                          rendered="#{(userData.userScreens['generaljournal_1'].add and generalJournalBean_new2.stickyHeader) and ( generalJournalBean_new2.glYearDTOSelection.openning eq 0 or generalJournalBean_new2.glYearDTOSelection.openning eq null)}" actionListener="#{generalJournalBean_new2.info()}" 
                                          action="#{generalJournalBean_new2.savegeneraljournaldetails()}" icon="fa fa-fw fa-save" 
                                          update="@form" disabled="#{generalJournalBean_new2.selectedGeneralJournal.post_flag or generalJournalBean_new2.modifyJournalAbility}"/>

                        <p:commandButton  class="sdeleteButton" title="حذف"  value="حذف" style="float:left" 
                                          rendered="#{(userData.userScreens['generaljournal_1'].add  and generalJournalBean_new2.stickyHeader)  and (generalJournalBean_new2.glYearDTOSelection.openning eq 0 or generalJournalBean_new2.glYearDTOSelection.openning eq null)}" 
                                          action="#{generalJournalBean_new2.deleteAll}" icon="fa fa-fw fa-remove" update="@form"
                                          disabled="#{generalJournalBean_new2.selectedGeneralJournal.post_flag or generalJournalBean_new2.modifyJournalAbility}">

                            <p:confirm header="#{userData.userDDs['COFIGRATION']}" message="#{userData.userDDs['ARE_YOU_SURE']}" icon="ui-icon-alert" />
