<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="./../../template/newTemplate.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:define name="content">

        <style>

            .ui-widget-content .ui-state-default, .ui-widget-header .ui-state-default {
                border: 1px solid #c5dbec;
                background:#fff;

            }
            .ui-dialog {
                position: absolute !important;
                left: 1vw!important;
                top: 25vh!important;}
            </style>
            <f:event listener="#{userData.authorize}" type="preRenderView" />
            <h:form id="form" dir="#{userData.dir}" class='formmargin'>
            <div style=" position: absolute;left: 20px"> 

                <p:commandButton  style="z-index: 2;
                                  margin-top: 24%;
                                  color: #035c70!important; 
                                  background-color: #223238!important;
                                  border: 1px solid #22323a!important;
                                  background: #22323a 50% 50% repeat-x!important;"
                                  icon="fa fa-fw fa-home"
                                  title="#{userData.userDDs['HOME']}"
                                  class="smhomeButton" 
                                  action="exit" />

            </div>
            <div >
                <p:messages id="curmsg" autoUpdate="true" showDetail="true" rendered="true" closable="true"/>   
            </div>

            <p:fieldset  legend="#{userData.userDDs['RECEIPT_GOOD_REQ']}"> 

                <div  id="firstSegment" class="ui-g-12 ui-g-nopad">

                    <div class="ui-g">
                        <h:panelGroup id="test">
                            <div class="ui-g-12 ui-md-6">

                                <h:panelGroup>

                                    <p:outputLabel style="width: 95px;margin-right: 6%;" id="purchId" value="#{userData.userDDs['PURCHASE_NUMBER']}" />
                                    <p:inputText style="width: 37.5%" 
                                                 id="purchIdVal" readonly="true"
                                                 value="#{invAddingOrderFormDTOMB.invInvoiceDTO.serial}" />

                                </h:panelGroup>
                            </div>
                            <div class="ui-g-12 ui-md-6">
                                <h:panelGroup>

                                    <h:panelGroup>
                                        <p:outputLabel style="width: 95px; margin-right: 6%;" value="#{userData.userDDs['DATEE']}*"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:calendar id="dateFrom" 

                                                    value="#{invAddingOrderFormDTOMB.invInvoiceDTO.date}"
                                                    pattern="dd/MM/yyyy"
                                                    style="width:50%!important"/>
                                    </h:panelGroup>

                                </h:panelGroup>
                            </div>


                            <div class="ui-g-12 ui-md-6">

                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel style="width: 100px;margin-right: 6%;" value="#{userData.userDDs['PURCHASES_DELEGATE']}"/>
                                    </h:panelGroup> 

                                    <p:inputText readonly="true" style="width: 36.5%"  
                                                 id="purchIdVal2" rendered="#{invAddingOrderFormDTOMB.invInvoiceDTO.loadedSerial  ne null}" 
                                                 value="#{invAddingOrderFormDTOMB.invInvoiceDTO.invDelegatorId}" />

                                    <h:panelGroup>
                                        <p:autoComplete style="width:36.5%!important " 
                                                        rendered="#{invAddingOrderFormDTOMB.invInvoiceDTO.loadedSerial  eq null}"
                                                        dropdown="true"
                                                        converter="#{invAddingOrderFormDTOMB.invDelegatorDTOConvertor}"
                                                        value="#{invAddingOrderFormDTOMB.invInvoiceDTO.invDelegatorId}"

                                                        var="purchasePerson"
                                                        itemLabel="#{purchasePerson}" 
                                                        itemValue="#{purchasePerson}" 
                                                        forceSelection="true" 
                                                        completeMethod="#{invAddingOrderFormDTOMB.completeDelegatorPurchase}"
                                                        >

                                        </p:autoComplete>
                                    </h:panelGroup> 
                                </h:panelGroup>
                            </div>


                            <div class="ui-g-12 ui-md-6">

                                <h:panelGroup id="currencyPanelGroup">

                                    <h:panelGroup>
                                        <p:outputLabel style="width: 95px; margin-right: 6%;" value="#{userData.userDDs['CURRENCY']}"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:inputText readonly="true" style="width: 38%" 
                                                     value="#{invAddingOrderFormDTOMB.invInvoiceDTO.currencyId.name}"/>
                                    </h:panelGroup>


                                </h:panelGroup>
                            </div>

                            <div class="ui-g-12 ui-md-6">
                                <h:panelGroup>
                                    <h:panelGroup id="exchangeRate">
                                        <p:outputLabel style="width: 94px; margin-right: 6%;" value="#{userData.userDDs['RATE']}"/>
                                    </h:panelGroup>

                                    <h:panelGroup id="CurrencyRate">
                                        <p:inputText class="rateBox" readonly="true" value="#{invAddingOrderFormDTOMB.invInvoiceDTO.rate}"/>
                                    </h:panelGroup>
                                </h:panelGroup>

                            </div>

                            <div class="ui-g-12 ui-md-6">

                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel  style="width: 95px; margin-right: 6%;" value="#{userData.userDDs['BILL_SUPPLIER_DATE']}"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:calendar pattern="dd/MM/yyyy" 
                                                    value="#{invAddingOrderFormDTOMB.invInvoiceDTO.supplierInvoiceDate}"
                                                    style="width: 37%">
                                        </p:calendar>
                                    </h:panelGroup>
                                </h:panelGroup>
                            </div>


                            <div class="ui-g-12 ui-md-6">

                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel style="width: 95px; margin-right: 6%;" value="#{userData.userDDs['SUPP_INVOI_NO']}"/>
                                    </h:panelGroup>

                                    <h:panelGroup>
                                        <p:inputText value="#{invAddingOrderFormDTOMB.invInvoiceDTO.supplierInvoiceNumber}" 
                                                     style="width: 38%!important"/>
                                    </h:panelGroup>
                                </h:panelGroup>

                            </div>

                            <div class="ui-g-12 ui-md-6">
                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel style="width: 100px;margin-right: 6%;" value="#{userData.userDDs['DEPOSITORY']}"/>
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:autoComplete style="width:36.5%"  id="inventoryDTO" widgetVar="inventoryDTO"
                                                        dropdown="true" 
                                                        converter="#{invAddingOrderFormDTOMB.invInventoryDTOConverter}"
                                                        value="#{invAddingOrderFormDTOMB.invInvoiceDTO.invInventoryId}"
                                                        var="inventoryDTO" 
                                                        itemLabel="#{inventoryDTO}" 
                                                        itemValue="#{inventoryDTO}" 
                                                        forceSelection="true" 
                                                        completeMethod="#{invAddingOrderFormDTOMB.completeInventory}" 
                                                        >
                                        </p:autoComplete>
                                    </h:panelGroup>
                                </h:panelGroup>
                            </div>


                            <div class="ui-g-12 ui-md-6">
                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel style="width: 100px;margin-right: 6%;" value="#{userData.userDDs['SUPPLIER']}"/>
                                    </h:panelGroup> 

                                    <h:panelGroup>
                                        <p:inputText readonly="true" style="width: 36.5%" 
                                                     id="purchIdVal6" rendered="#{invAddingOrderFormDTOMB.invInvoiceDTO.loadedSerial ne null}" 
                                                     value="#{invAddingOrderFormDTOMB.invInvoiceDTO.organizationSiteId}" />
                                    </h:panelGroup>

                                    <h:panelGroup > 
                                        <p:autoComplete style="width:37%!important"  
                                                        rendered="#{invAddingOrderFormDTOMB.invInvoiceDTO.loadedSerial eq null}"
                                                        dropdown="true"
                                                        converter="#{invAddingOrderFormDTOMB.organizationSiteDTOConvertor}"
                                                        value="#{invAddingOrderFormDTOMB.invInvoiceDTO.organizationSiteId}"

                                                        var="supplier"
                                                        itemLabel="#{supplier}" 
                                                        itemValue="#{supplier}" 
                                                        forceSelection="true" 
                                                        completeMethod="#{invAddingOrderFormDTOMB.completeSuppllier}" 
                                                        >


                                            <p:ajax update="@form"
                                                    event="change"
                                                    process="@form"
                                                    listener="#{invAddingOrderFormDTOMB.putCurrency()}" />
                                            <p:ajax update="@form"
                                                    process="@form"
                                                    event="itemSelect"
                                                    listener="#{invAddingOrderFormDTOMB.putCurrency()}" />


                                        </p:autoComplete>
                                    </h:panelGroup> 

                                </h:panelGroup>
                            </div>

                            <div class="ui-g-12 ui-md-12">

                                <h:panelGroup rendered="#{invAddingOrderFormDTOMB.invInvoiceDTO.loadedSerial  ne null}">
                                    <h:panelGroup>
                                        <p:outputLabel style="width: 95px; margin-right: 3%;" value="رقم أمر الشراء"/>
                                    </h:panelGroup>

                                    <h:panelGroup>
                                        <p:inputText readonly="true" style="width: 36.5%"  value="#{invAddingOrderFormDTOMB.invInvoiceDTO.loadedSerial}"
                                                     />
                                    </h:panelGroup>
                                </h:panelGroup>
                            </div>


                            <div class="ui-g-12 ui-md-12" style="margin-top:-12px;">

                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel style="width: 95px; margin-right: 3%;" value="#{userData.userDDs['NOTE']}"/>
                                    </h:panelGroup>

                                    <h:panelGroup>
                                        <p:inputText style="width:69.5%"  value="#{invAddingOrderFormDTOMB.invInvoiceDTO.remarks}"
                                                     />
                                    </h:panelGroup>
                                </h:panelGroup>
                            </div>
                        </h:panelGroup>
                    </div>
                </div>

            </p:fieldset>

            <p:fieldset id="fieldSetId" legend="#{userData.userDDs['DETA_OF_PUE_ORD']}"  style="margin:2% 0">


                <p:dataTable id="invPurchaseInvoiceDetailsTable"
                             widgetVar="invPurchaseInvoiceDetailsTable"
                             style="margin-bottom:20px"
                             var="invPurchaseInvoiceDetailsTable"
                             rowIndexVar="index" 
                             dir="rtl" 
                             emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                             editable="true"
                             editMode="cell"
                             selectionMode="single"
                             sortBy="#{1}"
                             rowKey="#{invPurchaseInvoiceDetailsTable.index}"
                             selection="#{invAddingOrderFormDTOMB.invInvoiceDTO.invPurchaseInvoiceDetailsSelected}"
                             value="#{invAddingOrderFormDTOMB.invInvoiceDTO.invPurchaseInvoiceDetailList}" >

                    <f:facet name="header" >
                        <p:commandButton  id="addnew"
                                          class="saddButton"
                                          icon="fa fa-plus"
                                          title="#{userData.userDDs['ADD']}" 
                                          disabled="#{invAddingOrderFormDTOMB.invInvoiceDTO.loadedSerial  ne null}"
                                          actionListener="#{invAddingOrderFormDTOMB.addInvDetail()}" 
                                          update=":form:fieldSetId"  
                                          oncomplete="PrimeFaces.focus('form:invPurchaseInvoiceDetailsTable:'+#{invAddingOrderFormDTOMB.invInvoiceDTO.invPurchaseInvoiceDetailList.size()}+':invItemNameIn')"
                                          immediate="true"
                                          ajax="true"
                                          style="float:right"/>

                        <p:outputPanel>
                            <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                            <p:inputText id="globalFilter" onkeyup="PF('invPurchaseInvoiceDetailsTable').filter()" style="width:150px" />
                        </p:outputPanel>
                    </f:facet>

                    <p:column headerText="#" style="width: 4vh;text-align:center;border-radius: 0px" >
                        <h:outputText value="#{invPurchaseInvoiceDetailsTable.serial}"  />
                    </p:column>

                    <p:column style="width: 13vh;text-align: -webkit-auto;border-radius: 0px" id="itemName" headerText="#{userData.userDDs['ITEM']}" 
                              filterBy="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail}" 
                              filterMatchMode="contains" 
                              sortBy="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail}"
                              filterable="false">
                        <p:outputLabel value="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail}" 
                                       rendered="#{invPurchaseInvoiceDetailsTable.isEdit}" />

                        <p:autoComplete id="invItemNameIn"  
                                        rendered="#{not invPurchaseInvoiceDetailsTable.isEdit}" 
                                        style="width:100%"
                                        converter="#{invAddingOrderFormDTOMB.itemsBarcodesDetailsViewConverter}"
                                        value="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail}"
                                        maxResults="10"
                                        var="item"
                                        itemLabel="#{item}" 
                                        itemValue="#{item}" 
                                        forceSelection="true" 
                                        completeMethod="#{invAddingOrderFormDTOMB.completeItemsDatas}" >
                            <p:ajax update=" unitvalue length paintColor QuantityT WeightT  totalQuantity totalWeight    "
                                    event="itemSelect" listener="#{invAddingOrderFormDTOMB.validateItems(invPurchaseInvoiceDetailsTable)}" />



                        </p:autoComplete>            
                    </p:column>

                    <p:column  style="width: 13vh;text-align: -webkit-auto;border-radius: 0px" id="Unit"

                               filterBy="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail.unitName}" 
                               filterMatchMode="contains" 
                               sortBy="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail.unitName}"
                               filterable="false"
                               headerText="#{userData.userDDs['UNIT_NUMBER']}">
                        <p:outputLabel id="unitvalue" 
                                       value="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail.unitName}" style="width: 95%" />  

                    </p:column>

                    <p:column style="width: 12vh;text-align: -webkit-auto;border-radius: 0px" id="tall" headerText="الطول"
                              rendered="#{invAddingOrderFormDTOMB.invInvoiceDTO.companyActivity eq 'Alumetal'}"
                              filterBy="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail.length}" 
                              filterMatchMode="contains" 
                              sortBy="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail.length}"
                              filterable="false" >
                        <p:outputLabel style="width:99%" 
                                       id="length" 
                                       value="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail.length}"/>
                    </p:column>

                    <p:column style="width: 12vh;text-align: -webkit-auto;border-radius: 0px" id="color" headerText="اللون"
                              rendered="#{invAddingOrderFormDTOMB.invInvoiceDTO.companyActivity eq 'Alumetal'}"
                              filterBy="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail.paintColorName}" 
                              filterMatchMode="contains" 
                              sortBy="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail.paintColorName}"
                              filterable="false" >
                        <p:outputLabel style="width:99%" 
                                       id="paintColor" 
                                       value="#{invPurchaseInvoiceDetailsTable.itemsBarcodesDetail.paintColorName}"/>
                    </p:column>


                    <p:column style="width: 13vh;text-align: -webkit-auto;border-radius: 0px"
                              id="Quantity"
                              headerText="#{userData.userDDs['NUMBER']}"
                              filterBy="#{invPurchaseInvoiceDetailsTable.quantity}" 
                              filterMatchMode="contains" 
                              sortBy="#{invPurchaseInvoiceDetailsTable.quantity}"
                              filterable="false">

                        <p:inputText id="QuantityT"  
                                     value="#{invPurchaseInvoiceDetailsTable.quantity}" 
                                     style="width:95%">
                            <p:ajax listener="#{invAddingOrderFormDTOMB.validateQuantityColum(invPurchaseInvoiceDetailsTable)}" 
                                    update="totalQuantity totalWeight invItemNameIn QuantityT"/>
                        </p:inputText>        

                    </p:column>

                    <p:column style="width: 13vh;text-align: -webkit-auto;border-radius: 0px" rendered="#{invAddingOrderFormDTOMB.invInvoiceDTO.companyActivity eq 'Alumetal'}"
                              id="Weight"
                              headerText="#{userData.userDDs['WEIGHT']}"
                              filterBy="#{invPurchaseInvoiceDetailsTable.weight}" 
                              filterMatchMode="contains" 
                              sortBy="#{invPurchaseInvoiceDetailsTable.weight}"
                              filterable="false">

                        <p:inputNumber id="WeightT" decimalPlaces="3"
                                       value="#{invPurchaseInvoiceDetailsTable.weight}"  
                                       style="width:100%">
                            <p:ajax listener="#{invAddingOrderFormDTOMB.updateSummition()}" update="totalQuantity  totalWeight  "/>
                        </p:inputNumber>
                    </p:column>

                    <p:summaryRow>
                        <p:column colspan="3" style="text-align:right">
                            <h:outputText style="text-align:right" value="#{userData.userDDs['TOTAL']}  :" />
                        </p:column>
                        <p:column>
                            <h:outputText id="totalQuantity" value="#{invAddingOrderFormDTOMB.invInvoiceDTO.totalQuatity}"/>
                        </p:column>
                        <p:column rendered="#{invAddingOrderFormDTOMB.invInvoiceDTO.companyActivity eq 'Alumetal'}">
                            <h:outputText id="totalWeight" value="#{invAddingOrderFormDTOMB.invInvoiceDTO.totalWeight}"/>
                        </p:column>
                        <p:column rendered="#{invAddingOrderFormDTOMB.invInvoiceDTO.companyActivity eq 'Alumetal'}" />
                        <p:column rendered="#{invAddingOrderFormDTOMB.invInvoiceDTO.companyActivity eq 'Alumetal'}" />

                        <p:column />
                    </p:summaryRow>

                    <p:column 
                        rendered="#{invAddingOrderFormDTOMB.columnRender}"
                        style="width: 13vh;text-align: center;border-radius: 0px" 
                        headerText="#{userData.userDDs['TRANSACTION']}">

                        <p:commandButton  id="b7" icon="fa fa-plus" 
                                          class="saddbuttonins" style="color: #fff!important;background-color: #00BCD4"
                                          title="#{userData.userDDs['ADD']}" 
                                          disabled="#{invAddingOrderFormDTOMB.invInvoiceDTO.loadedSerial  ne null}"
                                          actionListener="#{invAddingOrderFormDTOMB.addInvDetail()}" 
                                          update=":form:fieldSetId"  
                                          immediate="true"
                                          oncomplete="PrimeFaces.focus('form:invPurchaseInvoiceDetailsTable:'+#{invAddingOrderFormDTOMB.invInvoiceDTO.invPurchaseInvoiceDetailList.size()}+':invItemNameIn')"
                                          ajax="true" />

                        <p:commandButton  update="invPurchaseInvoiceDetailsTable totalQuantity  totalWeight   "
                                          title="#{userData.userDDs['DELETE']}" 
                                          class="sdeleteButtons" style="color: #fff!important;background-color: red"

                                          action="#{invAddingOrderFormDTOMB.deleteInvDetail(invPurchaseInvoiceDetailsTable)}"
                                          icon="fa fa-remove" >
                            <p:confirm header="#{userData.userDDs['COFIGRATION']}" 
                                       message="#{userData.userDDs['ARE_YOU_SURE']}"
                                       icon="ui-icon-alert" />
                        </p:commandButton>

                        <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                            <p:commandButton title="#{userData.userDDs['YES']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
                            <p:commandButton title="#{userData.userDDs['NO']}" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
                        </p:confirmDialog>
                    </p:column >

                </p:dataTable>

                <h:panelGrid  class="col-md-12" columns="1"  style="margin-top:2%">

                    <h:panelGroup  class="centerButtons">

                        <p:commandButton  id="saveB" 
                                          class="saveButtons"
                                          title="#{userData.userDDs['SAVE']}"
                                          value="#{userData.userDDs['SAVE']}" 

                                          style="color: #fff!important;background-color: #2196F3;margin-left: 5px" 
                                          action="#{invAddingOrderFormDTOMB.save()}"
                                          update="@form"/>

                        <p:commandButton 
                            id="newN"
                            ajax="false"
                            style="color: #fff!important;background-color: #9c27b0d1;margin-left: 5px"
                            value="#{userData.userDDs['NEW']}" 
                            class="newButtons"
                            onclick="form.target = ''" 
                            actionListener="#{invAddingOrderFormDTOMB.reset()}"/>

                        <p:commandButton  
                            class="reloadButtons"
                            id="loadL"
                            rendered="#{invAddingOrderFormDTOMB.invInvoiceDTO.id eq null}"
                            title="#{userData.userDDs['UPLOAD']}"
                            value="#{userData.userDDs['UPLOAD']}" 
                            style="color: #fff!important;background-color: #1B00D4E6;margin-left: 5px"  
                            action="#{invAddingOrderFormDTOMB.loadDailogue()}"
                            update="loaddlg"/>
                        <p:commandButton  class="printButtons"
                                          ajax="false"
                                          onclick="form.target = '_blank'"  
                                          style="color: #fff!important;background-color: blue;margin-left: 5px" 
                                          value="#{userData.userDDs['PRINT']}" 
                                          title="#{userData.userDDs['PRINT']}" 
                                          actionListener="#{invAddingOrderFormDTOMB.print}"/>


                        <p:commandButton  class="deleteButtons" 
                                          id="cancel" 
                                          title="#{userData.userDDs['CANCEL']}" 
                                          value="#{userData.userDDs['CANCEL']}" 
                                          style="color: #fff!important;background-color: #035C70;margin-left: 5px"  
                                          immediate="true"
                                          action="#{invAddingOrderFormDTOMB.exit()}" 
                                          update="@form"/>

                        <h:commandLink  style="float:left" class="sdcreenimg">  
                            <p:graphicImage name="/img/excel.jpg" width="24" style='margin-right:25%;'/>  
                            <p:dataExporter type="xls"
                                            target="invPurchaseInvoiceDetailsTable" 
                                            fileName="فاتورة اذن استلام بضاعة"
                                            preProcessor="#{invAddingOrderFormDTOMB.preProcessXLS()}"
                                            postProcessor="#{invAddingOrderFormDTOMB.postProcessXLS}" />  
                        </h:commandLink>

                        <p:blockUI block="form" trigger="saveB" animate="true" >

                            <p:graphicImage library="img" name="9wcA.gif" ></p:graphicImage>

                        </p:blockUI> 


                    </h:panelGroup>

                </h:panelGrid>
            </p:fieldset>



            <h:panelGrid columns="1" cellpadding="5">

                <h:panelGroup>


                    <p:dialog id="loaddlg" header="#{userData.userDDs['PURCHASE_OR_NO']}" 
                              widgetVar="loaddlg" modal="true">

                        <div class="ui-g-12 ui-md-6">

                            <h:panelGroup>

                                <p:outputLabel style="width: 95px;margin-right: 6%;" id="loadedSerial1" value="رقم طلب الشراء المطلوب استكماله" />
                                <p:inputText style="width: 37%" 
                                             id="loadedSerial" 
                                             value="#{invAddingOrderFormDTOMB.invInvoiceDTO.needLoadedSerial}" />

                            </h:panelGroup>
                        </div>                      
                        <div>
                            <p:messages id="loadMsg"
                                        autoUpdate="true" 
                                        showDetail="true" 
                                        closable="true"/>   
                        </div>
                        <div style="padding-top: 60px">

                            <p:dataTable id="dlgTable"
                                         draggableColumns="true" 
                                         var="dlgTable" 
                                         widgetVar="dlgTable" 
                                         rowIndexVar="index" 
                                         dir="rtl" 
                                         selection="#{invAddingOrderFormDTOMB.invInvoiceDTO.invDailogeDataSelected}"
                                         value="#{invAddingOrderFormDTOMB.dataModelInvDailogueData}" 
                                         rows="10"  selectionMode="single"
                                         rowKey="#{dlgTable.index}"
                                         paginator="true" 
                                         lazy="true" 
                                         paginatorTemplate="{CurrentPageReport} {FirstPageLink}
                                         {PreviousPageLink} {PageLinks} {NextPageLink}
                                         {LastPageLink} {RowsPerPageDropdown}"
                                         emptyMessage="#{userData.userDDs['EMPTY_TABLE']}"
                                         >
                                <f:facet name="header" >
                                    <p:outputPanel  >
                                        <h:outputText value="#{userData.userDDs['SEARCH']} : "  style="font-size: large" />
                                        <p:inputText id="globalFilter" onkeyup="PF('dlgTable').filter()" style="width:150px" />
                                    </p:outputPanel>
                                </f:facet>

                                <p:column style="width:15vw;font-size:1.8vw;text-align: right;border-radius: 0px" 
                                          filterStyle="display:none"
                                          filterBy="#{dlgTable.serial}" 
                                          filterMatchMode="contains"
                                          headerText="#{userData.userDDs['PURCHASE_NUMBER']}"
                                          sortBy="#{dlgTable.serial}"
                                          >
                                    <p:outputLabel value="#{dlgTable.serial}" />
                                </p:column>
