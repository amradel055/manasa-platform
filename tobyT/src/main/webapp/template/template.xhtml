<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      lang="en">

    <h:head>
        <f:facet name="first">
            <meta http-equiv="X-UA-Compatible" content="IE=edge" />
            <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
            <meta name="apple-mobile-web-app-capable" content="yes" />
        </f:facet>
        <title><ui:insert name="title">Toby</ui:insert></title>
        <link href="#{request.contextPath}/resources/customcss/custom.css" rel="stylesheet"/>
        <h:outputScript name="js/nanoscroller.js" library="serenity-layout" />
        <h:outputScript name="js/layout.js" library="serenity-layout" />
        <h:outputScript name="js/ripple.js" library="serenity-layout" />
        <ui:insert name="head"/>
    </h:head>

    <h:body>
        <div class="layout-wrapper #{guestPreferences.orientationRTL ? 'layout-rtl' : null} #{guestPreferences.horizontal ? 'layout-menu-horizontal' : null}">
            <ui:include src="./sidebar.xhtml" />

            <div class="layout-main">
                <ui:include src="./topbar.xhtml" />

                <div class="layout-breadcrumb" style="height: 110px;">
                    <ul>
                        <li><p:link outcome="/dashboard"><i class="material-icons">&#xE88A;</i></p:link></li>
                        <li>/</li>
                        <ui:insert name="breadcrumb" />
                    </ul>

                    <div class="layout-breadcrumb-options">                        
                        <a href="#" title="اضافة عميل محتمل" >
                            <h:form>
                                <p:commandButton    action="#{globalMB.showAddDialog}"    icon="fa fa-sign-out-alt"
                                                    id="addProbCustomer" style="background-color:#0064bc;"  
                                                    />
                            </h:form>
                        </a>
                        <a href="#" title="Backup">
                            <i class="material-icons">&#xE864;</i>
                        </a>
                        <a href="#" title="Bookmark">
                            <i class="material-icons">&#xE866;</i>
                        </a>
                        <a href="#" title="Logout" >
                            <h:form>
                                <p:commandButton    action="#{loginBean.logout}"   icon="fa fa-sign-out-alt"
                                                    id="logout"   ajax="false" style="background-color:#CC1C1C; border-radius: 50%;" class="material-icons" />
                            </h:form>
                        </a>
                    </div>

                </div>

                <div class="layout-content">
                    <ui:insert name="content"/>
                </div>

                <ui:include src="./config.xhtml" />

                <ui:include src="./footer.xhtml" />

                <div class="layout-main-mask"></div>
            </div>
        </div>

        <p:ajaxStatus style="width:32px;height:32px;position:fixed;right:7px;bottom:7px">
            <f:facet name="start">
                <i class="fa fa-circle-o-notch fa-spin ajax-loader" aria-hidden="true"></i>
            </f:facet>

            <f:facet name="complete">
                <h:outputText value="" />
            </f:facet>
        </p:ajaxStatus>
        <h:outputStylesheet name="css/nanoscroller.css" library="serenity-layout" />
        <h:outputStylesheet name="css/ripple.css" library="serenity-layout" />
        <h:outputStylesheet name="css/layout-#{guestPreferences.layout}.css" library="serenity-layout" />
        <h:form>
            <p:dialog class="dialogueCRM" header="إضافةعميل جديد"  id="dlg12add" widgetVar="dlg12add" minHeight="40" width="50%" >
                <p:fieldset legend="تفاصيل العملاء المحتملين" style="margin-bottom:20px">
                    <p:messages autoUpdate="true"  id="messages" showDetail="true" closable="true" /> 
                    <div   class="ui-g-12 ui-g-nopad" style="padding: 0px;">
                        <div class="ui-g">
                            <div class="ui-g-12 ui-md-12" style="padding: 0px;">
                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel style="width:99px;margin-right: 2.5%"  value="كود العميل" />
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel  style="width: 35%!important"  id="employeeCode"  value="#{globalMB.invOrganizationSiteDTO.code}">
                                        </p:outputLabel>
                                    </h:panelGroup>
                                </h:panelGroup>
                            </div>

                            <div class="ui-g-12 ui-md-6" style="padding: 0px;">
                                <h:panelGroup>
                                    <h:panelGroup>
                                        <p:outputLabel style="width:99px;margin-right: 5%"  value="الاسم" />
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:inputText  style="width: 35%!important"  id="employeeName"  value="#{globalMB.invOrganizationSiteDTO.name}">

                                        </p:inputText>
                                    </h:panelGroup>
                                </h:panelGroup>
                            </div>

                            <div class="ui-g-12 ui-md-6" style="padding: 0px;">
                                <h:panelGroup>
                                    <h:panelGroup>

                                        <p:outputLabel style="width:98px; margin-right: 5%;"  value="الموبايل" />
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:inputText  style="width: 35%!important"  id="mobile" validatorMessage="يجب ادخال هاتف صحيح"  value="#{globalMB.invOrganizationSiteDTO.mobile}">

                                        </p:inputText>
                                    </h:panelGroup>
                                </h:panelGroup>
                            </div>

                            <div class="ui-g-12 ui-md-6" style="padding: 0px;">
                                <h:panelGroup>
                                    <p:outputLabel style="width:99px;margin-right: 5%"  value="البريد الالكتروني" />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:inputText  style="width: 35%!important"  id="employeeCode2" value="#{globalMB.invOrganizationSiteDTO.email}" validatorMessage="الايميل غير صحيح">

                                    </p:inputText>
                                </h:panelGroup>
                            </div>

                            <div class="ui-g-12 ui-md-6" style="padding: 0px;">
                                <h:panelGroup>
                                    <h:panelGroup>

                                        <p:outputLabel style="width:99px; margin-right: 5%;"  value="الشركة" />
                                    </h:panelGroup>
                                    <h:panelGroup>
                                        <p:inputText  style="width: 35%!important"  id="companyName"  value="#{globalMB.invOrganizationSiteDTO.companyName}">
                                        </p:inputText>
                                    </h:panelGroup>
                                </h:panelGroup>
                            </div>



                            <div class="ui-g-12 ui-md-6" style="padding: 0px;">
                                <h:panelGroup>
                                    <p:outputLabel style="width:104px;margin-right: 5%"  value="مصدر العميل" />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:autoComplete style="width:34%!important " 
                                                    dropdown="true"
                                                    converter="#{globalMB.learnAboutCompanyfromconverter}"
                                                    value="#{globalMB.invOrganizationSiteDTO.learnAboutCompanyFrom}"
                                                    var="learnAboutCompanyfrom"
                                                    itemLabel="#{learnAboutCompanyfrom}" 
                                                    itemValue="#{learnAboutCompanyfrom}" 
                                                    forceSelection="true" 
                                                    completeMethod="#{globalMB.completeLearnAboutCompanyfrom}"
                                                    >

                                    </p:autoComplete>
                                </h:panelGroup>
                            </div>
                        </div>





                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">
                            <h:panelGroup>
                                <p:outputLabel style="width:99px;margin-right: 5%"  value="الموقع الالكتروني" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:inputText  style="width: 35%!important"  id="employeeCode4"  value="#{globalMB.invOrganizationSiteDTO.urlSite}">
                                </p:inputText>
                            </h:panelGroup>
                        </div>

                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">
                            <h:panelGroup>
                                <p:outputLabel style="width:104px;margin-right: 5%"  value="الوظيفه" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:autoComplete style="width:34%!important " 
                                                dropdown="true"
                                                converter="#{globalMB.jobConverter}"
                                                value="#{globalMB.invOrganizationSiteDTO.workTypeId}"
                                                var="workTypeId"
                                                itemLabel="#{workTypeId}" 
                                                itemValue="#{workTypeId}" 
                                                forceSelection="true" 
                                                completeMethod="#{globalMB.completeWorkType}"
                                                >

                                </p:autoComplete>
                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">
                            <h:panelGroup>
                                <p:outputLabel style="width:104px;margin-right: 5%"  value="ملاحظات" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:inputText style="width:34%!important " 
                                             value="#{globalMB.invOrganizationSiteDTO.remark}"
                                             />

                            </h:panelGroup>
                        </div>

                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">
                            <h:panelGroup>
                                <p:outputLabel style="width:104px;margin-right: 5%"  value="الشارع" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:inputText style="width:34%!important " 
                                             value="#{globalMB.invOrganizationSiteDTO.street}"
                                             />

                            </h:panelGroup>
                        </div>

                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">
                            <h:panelGroup>
                                <p:outputLabel style="width:104px;margin-right: 5%"  value="جهة العمل" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:inputText style="width:34%!important " 
                                             value="#{globalMB.invOrganizationSiteDTO.employer}"
                                             />

                            </h:panelGroup>
                        </div>

                    </div>
                </p:fieldset>
                <p:commandButton   class="saveButton"  
                                   id="saveB" 
                                   title="#{userData.userDDs['SAVE']}"
                                   value="#{userData.userDDs['SAVE']}" 
                                   style="color: #fff;"
                                   action="#{globalMB.saveLead()}" 
                                   update="@form" />

            </p:dialog>



            <p:dialog class="dialogueCRM" header="إضافة شكوى"  id="dlgeventadd" widgetVar="dlg12add" minHeight="40" width="50%" >
                <p:fieldset legend="تفاصيل  الشكوى" style="margin-bottom:20px" id="dlgeventaddset" >
                    <p:messages autoUpdate="true"  id="messages" showDetail="true" closable="true" /> 
                    <div   class="ui-g-12 ui-g-nopad" style="padding: 0px;">
                        <div class="ui-g-12 ui-md-12" style="padding: 0px;">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width:99px;margin-right: 2.5%"  value="المعرض" />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:selectOneMenu id="inventory" value="#{globalMB.gallaryId}"
                                                     style="float:right;width: 20%!important;color:#fff;height: 30px!important;margin-right: 0.5%;">
                                        <f:selectItems value="#{globalMB.gallaryLists}" 
                                                       var="inventory" itemLabel="#{inventory.name}"
                                                       itemValue="#{inventory.id}"/> 
                                    </p:selectOneMenu>
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>
                        <div class="ui-g-12 ui-md-12" style="padding: 0px;">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width:99px;margin-right: 2.5%"  value="كود العميل" />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:inputText  style="width: 35%!important"  id="employeeCode"  value="#{globalMB.customerCode}" >
                                        <p:ajax listener="#{globalMB.findCustomer()}" update="dlgeventaddset" />
                                    </p:inputText>
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>

                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">
                            <h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel style="width:99px;margin-right: 5%"  value="الاسم" />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel  style="width: 35%!important"  id="employeeName"  value="#{globalMB.crmEventDTO.customerId.name}"/>
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>

                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">
                            <h:panelGroup>
                                <h:panelGroup>

                                    <p:outputLabel style="width:98px; margin-right: 5%;"  value="الموبايل" />
                                </h:panelGroup>
                                <h:panelGroup>
                                    <p:outputLabel  style="width: 35%!important"  id="mobile"  value="#{globalMB.crmEventDTO.customerId.mobile}"/>
                                </h:panelGroup>
                            </h:panelGroup>
                        </div>

                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">
                            <h:panelGroup>
                                <p:outputLabel style="width:99px;margin-right: 5%"  value="البريد الالكتروني" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:outputLabel  style="width: 35%!important"  id="employeeCode2" value="#{globalMB.crmEventDTO.customerId.email}" />
                            </h:panelGroup>
                        </div>

                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">
                            <h:panelGroup>
                                <p:outputLabel style="width:104px;margin-right: 5%"  value="المتابع" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:selectOneMenu value="#{globalMB.crmEventDTO.assignedTo}" converter="#{globalMB.crmEmployeeConverter}" effect="fold" >
                                    <f:selectItems value="#{globalMB.crmEmployeeList}" var="employee" itemLabel="#{employee}" itemValue="#{employee}" />
                                </p:selectOneMenu>
                            </h:panelGroup>
                        </div>


                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">
                            <h:panelGroup>
                                <p:outputLabel style="width:104px;margin-right: 5%"  value="نوع الشكاوي" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:selectOneMenu value="#{globalMB.crmEventDTO.status}" converter="#{globalMB.crmStatusEventConverter}" effect="fold" >
                                    <f:selectItems value="#{globalMB.crmStatusEventList}" var="status" itemLabel="#{status}" itemValue="#{status}" />
                                </p:selectOneMenu>
                            </h:panelGroup>
                        </div>


                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">
                            <h:panelGroup>
                                <p:outputLabel style="width:104px;margin-right: 5%"  value="الأولوية" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:selectOneMenu value="#{globalMB.crmEventDTO.symbolPriority}" converter="#{globalMB.crmPeriorityConverter}" effect="fold" >
                                    <f:selectItems value="#{globalMB.crmPeriorityList}" var="periority" itemLabel="#{periority}" itemValue="#{periority}" />
                                </p:selectOneMenu>
                            </h:panelGroup>
                        </div>




                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">
                            <h:panelGroup>
                                <p:outputLabel style="width:104px;margin-right: 5%"  value="عنوان الشكوي" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:inputText style="width:34%!important " 
                                             value="#{globalMB.crmEventDTO.subject}"
                                             />

                            </h:panelGroup>
                        </div>


                        <div class="ui-g-12 ui-md-6" style="padding: 0px;">
                            <h:panelGroup>
                                <p:outputLabel style="width:104px;margin-right: 5%"  value="نص الشكوي" />
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:inputText style="width:34%!important " 
                                             value="#{globalMB.crmEventDTO.discription}"
                                             />

                            </h:panelGroup>
                        </div>
                    </div>
                </p:fieldset>
                <p:commandButton   class="saveButton"  
                                   id="saveB" 
                                   title="#{userData.userDDs['SAVE']}"
                                   value="#{userData.userDDs['SAVE']}" 
                                   style="color: #fff;"
                                   action="#{globalMB.saveLead()}" 
                                   update="@form" />

            </p:dialog>
        </h:form>
    </h:body>


</html>
